    Device:
    Architecture:
    Execution:
      thread: Single instruction-executing lane; 32 threads form one warp, and a thread issues its own cp.async copies and arrives alone on barriers
      warp: 32 lockstep threads of one CTA; the scope of warp shuffle register exchange and of one warp-issued mma.sync
      cta: Thread block of one kernel launch owning one dynamic shared-memory allocation; the scope of __syncthreads() and the unit the launch grid partitions work over
      cluster: CTAs co-scheduled by a launch-time cluster dimension; peer shared memory is addressable inside it and cluster barriers synchronise its CTAs
      sm: Streaming multiprocessor that hosts resident CTAs and supplies the shared memory one CTA allocates; the device SM count is read by the host plan
      tensor core: Matrix-multiply unit of one SM executing warp-issued mma.sync and per-CTA or CTA-pair tcgen05.mma
