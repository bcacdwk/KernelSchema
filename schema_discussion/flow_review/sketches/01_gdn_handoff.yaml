flow:
  launch:
    - {phase: [prep]}
    - {phase: [chain], protocol: pdl, start_after: prep.launch_ready}
  handoff:
    Ti: &prep_to_chain
      producer: prep
      consumer: [chain]
      storage: global
      ready: prep.kernel_done
      wait_at: chain.prep_ready
    Qd: *prep_to_chain
    b: *prep_to_chain
    bc: *prep_to_chain
    Ai: *prep_to_chain
    Dl: *prep_to_chain
    Qc: *prep_to_chain
    Kc: *prep_to_chain
