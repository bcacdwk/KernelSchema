META_DATA:
  Name: nvfp4_fused_moe
  Describe: Routed NVFP4 mixture-of-experts forward with an explicit block-16 activation quantize-dequantize between FC1 and FC2 and a routing-weighted BF16 sum
  Source: KernelSchema@24d2b3d3ca9d4907c4e7efd9607cf78cfb1a52b2:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  Version: 1
  Dispatch:
    id: split_k
    when: token_count*slot_count <= 1536 and token_count <= 128 and token_count*slot_count >= 32, and the wide GEMM2 leaf with the bulk drain is kept, so the route tile count read from the ids of the call that fixes the launch set, summed over experts as ceil(valid routes of the expert / 128), times (hidden_dim/128)*max(1,intermediate_dim/256) is at least 3072, and the multi-node chain is kept, so some ids entry lies in [0,expert_count) and the hidden_states payload is not entirely zero in magnitude
DESIGN:
  Math_reshape:
    Thesis: Both operands stay packed NVFP4 and the tensor core applies the block-16 scales, so no decoded array exists. Routes are grouped per expert, the FC1 reduction is cut into two channel slices a separate node reduces, and its activation operand comes from clipped gather boxes
    Rewrite:
      - Name: Route grouping and padding
        Math: |
          A route (t,s) is valid when ids[t,s] is in [0,expert_count); route_count counts them.
          counts[e] = valid routes selecting e; offs is its exclusive prefix, offs[expert_count] = route_count.
          route_position maps the valid routes onto [0,route_count), giving expert e the run [offs[e],offs[e]+counts[e]); the order inside an expert is an inert permutation, as every value below depends on a route only through (t,s,e).
          route_of[t,s] = route_position(t,s), or -1 when invalid; route_token[r], route_slot[r], route_expert[r] invert it.
          Tiles of bm rows cut each run: tile_offsets is the exclusive prefix of ceil(counts[e]/bm), tile_count = tile_offsets[expert_count], tile_expert[j] holds j's expert, tile_first[j] = (j-tile_offsets[tile_expert[j]])*bm, tile_rows(j) = min(bm, counts[tile_expert[j]]-tile_first[j]).
          Tile j starts at row offs[tile_expert[j]]+tile_first[j]. Its rows past tile_rows(j) are padding: not fetched, not stored, no E2M1 or E4M3 trap. Rows r >= route_count belong to no tile.
        Symbol:
          route_count: {meaning: Number of valid routes}
          route_capacity: {meaning: Allocated rows of route-indexed buffers, value: token_count*slot_count}
          bm: {meaning: Route rows in one tile, binding: 'bind:DESIGN.Work_schedule::bm'}
          counts: {meaning: Valid routes per expert, shape: [{expert: expert_count}], dtype: int32, retention: keep_value invocation}
          offs: {meaning: Exclusive route prefix per expert, shape: [{expert: expert_count+1}], dtype: int32, retention: keep_value invocation}
          tile_count: {meaning: Number of nonempty route tiles}
          tile_bound: {meaning: Upper bound on the route tile count, value: 'ceil_div(route_capacity,bm) + min(expert_count,route_capacity)'}
          tile_offsets: {meaning: Exclusive tile prefix per expert, shape: [{expert: expert_count+1}], dtype: int32, retention: keep_value invocation}
          tile_expert: {meaning: Expert owning each route tile, shape: [{tile: tile_count}], dtype: int32, retention: keep_value invocation}
          tile_first: {meaning: First route of a tile inside its expert, shape: [{tile: tile_count}], dtype: int32, retention: keep_value invocation}
          tile_rows: {meaning: Valid route rows of one route tile}
          route_of: {meaning: Position of each route slot, shape: [{token: token_count}, {slot: slot_count}], dtype: int32, retention: keep_value invocation}
          route_token: {meaning: Token of a positioned route; the FC1 operand row, shape: [{route: route_capacity}], dtype: int32, retention: keep_value invocation}
          route_slot: {meaning: Slot of a positioned route; unread here, shape: [{route: route_capacity}], dtype: int32, retention: keep_value invocation}
          route_expert: {meaning: Expert of a positioned route; read by ACT, shape: [{route: route_capacity}], dtype: int32, retention: keep_value invocation}
        Ledger:
          Baseline: Evaluate every route from its own token row, fetching the expert weights per route
          Gain: One expert's weights serve a contiguous run of up to bm routes, addressed as offsets of one buffer
          Cost: 0 -> about 16*route_capacity bytes of index arrays per call, plus the per-expert and per-tile offsets
      - Name: Direct clipped activation operand
        Math: |
          No route-ordered copy of the activations exists. The FC1 operand rows are the Contract's hidden_states and hidden_states_scale themselves, addressed through route_token: row r of a tile reads token route_token[r], so decoding the fetched bytes gives hidden_value[route_token[r]] by the Contract's decode, with no rescale and no rearrangement.
          A stage fetches only the rows of its tile below tile_rows(j), four rows per gather box, so padding rows never leave the input tensor and a token with no valid route is never read.
          Each of a tile's split_count*(intermediate_dim/64) items fetches those rows over its own channel range.
        Ledger:
          Baseline: Copy each valid route's payload and scale bytes once into a route-ordered buffer, then box 128 contiguous rows of it per stage
          Gain: 0 instead of route_capacity*(hidden_dim/2 + hidden_dim/16) bytes copied and re-read; a stage fetches 4*ceil(tile_rows(j)/4) rows, not bm
          Cost: A stage issues ceil(tile_rows(j)/4) four-row boxes instead of one contiguous box, and each of a tile's items re-fetches those rows
      - Name: Block-scaled packed product in two slices
        Math: |
          Neither operand is decoded. For packed codes ac, bc and E4M3 scales as, bs over a reduction length L that is a multiple of nvfp4_block, with kb = floor(k/nvfp4_block):
            bsprod(ac,as,bc,bs)[m,n] = sum32 over kb ascending of fp32(as[m,kb]) * fp32(bs[n,kb]) * sum_{u=0}^{nvfp4_block-1} e2m1(ac[m,kb*nvfp4_block+u]) * e2m1(bc[n,kb*nvfp4_block+u])
          the FP32 accumulator being zeroed before kb = 0; one instruction advances nvfp4_block*4 channels, inner sum and scale products included.
          The FC1 reduction splits into split_count slices of hidden_dim/split_count channels.
          For tile j, slice sl and n-tile channels n, part[sl,r,n] is bsprod over slice sl of the row r activation operand against prepared row n of expert tile_expert[j], and part[sl,r,intermediate_dim+n] the same against row intermediate_dim+n, written only below tile_rows(j).
          For the (t,s) with route_of[t,s] = r, the ascending sum over sl of part[sl,r,n] is the Contract's up[t,s,n] and of the gate column its gate[t,s,n].
        Symbol:
          split_count: {meaning: Channel slices of the FC1 hidden reduction, value: 2}
          part: {meaning: FP32 slice partial of the up and gate of one route, shape: [{slice: split_count}, {route: route_capacity}, {channel: 2*intermediate_dim}], dtype: fp32, retention: keep_value invocation}
        Arithmetic:
          Accumulate: FP32 accumulator, ascending block order, zeroed at the item's first group; each slice keeps its own, added in ascending slice order downstream
        Ledger:
          Baseline: One item per (tile, n-tile) accumulating all hidden_dim/256 stages in one accumulator and quantizing it in place
          Gain: Items tile_count*(intermediate_dim/64) -> split_count times that, each accumulator chain hidden_dim/256 -> hidden_dim/(256*split_count) stages
          Cost: 0 -> split_count*route_capacity*2*intermediate_dim FP32 partial elements written once and read once
      - Name: Slice reduction of the FC1 partials
        Math: |
          For a route r, a group b of nvfp4_block consecutive intermediate channels and a channel u of that group:
            fc1_up = the sum over sl ascending of part[sl,r,b*nvfp4_block+u], from 0
            fc1_gate = the sum over sl ascending of part[sl,r,intermediate_dim+b*nvfp4_block+u], from 0
          so the slice sums cover the hidden reduction in ascending channel order, joined by split_count-1 FP32 adds per element.
          The reduction ranges over all route_capacity rows. Rows at or past route_count are produced by no item and hold what part kept: their route_expert is outside [0,expert_count) and they are dropped, or it is a stale in-range id and their activation bytes land in a row no fc2 tile stores.
        Ledger:
          Baseline: One accumulator per route holding the whole hidden reduction, quantized by the epilogue that produced it
          Cost: 0 -> split_count*route_capacity*2*intermediate_dim*4 bytes of FP32 partials read once, and split_count-1 extra FP32 adds per element
      - Name: Clamp, activation and NVFP4 quantize
        Math: |
          For route r, e = route_expert[r], alpha = gemm1_alpha[e], beta = gemm1_beta[e], limit = gemm1_clamp_limit[e] when present:
            gate_c = min(fc1_gate, limit), up_c = min(max(fc1_up,-limit),limit) when present, else both unchanged
            activation_type 3:  act = (gate_c * sig(alpha*gate_c)) * (up_c + beta)
            activation_type 10: act = (alpha * tanh(rcp_rn(alpha)*gate_c)) * sig(gate_c) * (beta * tanh(rcp_rn(beta)*up_c))
            sig(x) = rcp_approx(1 + exp2_approx_ftz(x*L2E)); tanh(x) = fma32(sig(2*x),2,-1); L2E = fp32(-log2(e))
          Per group b of nvfp4_block channels of one route, peak = max abs(act) over the group, an order-free tree across its four quarters:
            act_scale[r,b] = fp8_e4m3fn(min(peak * fp32(1/e2m1_max), e4m3_max)), saturating
            act_code = e2m1_rne(act * rcp_rn(max(fp32(act_scale[r,b]), 2^-126))), saturating
          act_payload packs two act_code per byte with the even channel in the low nibble, so act_code*fp32(act_scale) is the Contract's act_q.
        Symbol:
          act_scale: {meaning: E4M3 scale of one activation block, shape: [{route: route_capacity}, {block: intermediate_dim/nvfp4_block}], dtype: fp8_e4m3fn, retention: keep_value invocation}
          act_payload: {meaning: E2M1 activation codes at two per byte, shape: [{route: route_capacity}, {packed: intermediate_dim/2}], dtype: uint8, retention: keep_value invocation}
        Arithmetic:
          Approx: sig and tanh use ex2.approx.ftz and rcp.approx; the argument prescale is two rounded steps, which the source bounds within 1.5 ulp of the folded form
          Accumulate: peak is an order-free max tree; the quantize multiplies by rcp_rn of the scale instead of dividing, and 1/e2m1_max is a rounded constant
        Ledger:
          Baseline: Clamp, activate and quantize in the GEMM1 epilogue from the item's own accumulator
          Gain: One pass over route_capacity*(intermediate_dim/nvfp4_block) groups with four threads each, not a drain inside a tile epilogue
          Cost: Every activation argument is scaled by two rounded multiplies instead of one folded constant
      - Name: Fc2 product and per-route BF16
        Math: |
          fc2[r,h] = bsprod of row r of (act_payload, act_scale) against the prepared row h of expert tile_expert[j] in (gemm2_weights, gemm2_weights_scale), with L = intermediate_dim, for the routes r of tile j. For the (t,s) with route_of[t,s] = r it is the Contract's inner sum of that route, because act_code*fp32(act_scale) is act_q.
          rout[r,h] = bf16(fc2[r,h]), round to nearest even, is materialized for every valid route and is what the routing reduction consumes; fc2 itself is never stored.
          A tile's rows past tile_rows(j) read act_payload bytes no valid route produced, and their fc2 and rout are not stored.
        Symbol: {rout: {meaning: Per-route FC2 result as BF16, shape: [{route: route_capacity}, {hidden: hidden_dim}], dtype: bf16, retention: keep_value invocation}}
        Ledger:
          Baseline: Keep each route's FC2 result in FP32, or reduce routes into the token output where they are produced
          Gain: Route result bytes 4 -> 2 per element
          Cost: One extra BF16 rounding per element, and route_capacity*hidden_dim*2 bytes written then re-read
      - Name: Routing-weighted output reduction
        Math: |
          For every token t and hidden channel h:
            acc[t,h] = the sum over s ascending of fma32(fp32(rout[route_of[t,s],h]), scores[t,s], partial), from 0
          skipping every s whose route_of[t,s] is -1, so an invalid route contributes exactly 0; output[t,h] = bf16(acc[t,h]).
          These are the Contract's acc and output with the route sum fixed to ascending slot order, which the Contract leaves unspecified. fp32(x) is the exact widening of a BF16 value, and output is written for every (t,h) whether or not any route is valid.
        Arithmetic:
          Accumulate: Each route term is one fma32 of the widened BF16 value and its score, so the product is not rounded before the running sum
        Ledger:
          Baseline: Accumulate the score-weighted route results into the output atomically, as the reference does
          Gain: A fixed ascending slot order per element, one BF16 rounding, and no read-modify-write of output
          Cost: rout is read slot_count times per token instead of being reduced where it is produced
  Work_schedule:
    Thesis: One submission per node, each free to launch at its predecessor's permission rather than its completion, so preambles overlap. One block builds the routing map; both GEMMs read it through a persistent capped grid; FC1 items are (tile, slice, n-tile), doubling the workers feeding the activation node
    Step:
      PREPARE:
        Describe: 'Build the whole routing map in one block: expert counts, route and tile offsets, every route''s position and tuple, and the tile map'
        Decomposition:
          Strategy: 32 warp ranges over the route list; warp-private histograms, a cross-warp prefix per expert and a 32-warp scan publish counts and both offsets
          Partition: {}
          Target:
            Single_tile:
              counts: {meaning: Valid routes per expert, shape: [{expert: expert_count}], dtype: int32}
              offs: {meaning: Exclusive route prefix per expert, shape: [{expert: expert_count+1}], dtype: int32}
              tile_offsets: {meaning: Exclusive tile prefix per expert, shape: [{expert: expert_count+1}], dtype: int32}
              tile_expert: {meaning: Expert owning each route tile, shape: [{tile: tile_count}], dtype: int32}
              tile_first: {meaning: First route of a tile inside its expert, shape: [{tile: tile_count}], dtype: int32}
              route_of: {meaning: Position of each route slot, shape: [{token: token_count}, {slot: slot_count}], dtype: int32}
              route_token: {meaning: Token of each positioned route, shape: [{route: route_capacity}], dtype: int32}
              route_slot: {meaning: Slot of each positioned route, shape: [{route: route_capacity}], dtype: int32}
              route_expert: {meaning: Expert of each positioned route, shape: [{route: route_capacity}], dtype: int32}
        Mapping:
          Strategy: One block of 1024 threads; the staged ids, histogram, scan and positions stay in shared memory, whose dynamic part is sized by route_capacity
          Worker: {unit: cta, unit_count: 1}
          Worker_count: 1
        Schedule:
          Worker_assignment:
            Preassigned: {start: 0, count: 1}
            Refill: none
            Exit: assigned_done
      GEMM1:
        Describe: Multiply each route tile's activation rows of one channel slice by its expert's FC1 weight and store the raw FP32 slice partials of both halves
        Decomposition:
          Strategy: bm = 128 route rows per tile; split_count slices cut the hidden_dim/256 stages evenly, so hidden_dim/256 is a multiple of it; a stage is 256 channels
          Partition:
            tile: {meaning: One existing route tile, size: tile_count, tile: 1, range: [0, tile_bound]}
            k_slice: {meaning: One channel slice of the hidden reduction, size: split_count, tile: 1}
            n_tile: {meaning: Block of intermediate channels, size: intermediate_dim, tile: 64}
          Worktile:
            Iteration:
              a_payload: {meaning: Activation payload rows fetched for this stage, shape: [{route: bm}, {byte: 128}], dtype: uint8, direction: ascending}
              a_scale: {meaning: Activation scales of the same fetched rows, shape: [{route: bm}, {scale_block: 16}], dtype: fp8_e4m3fn, direction: ascending}
              b_payload: {meaning: FC1 payload of 128 prepared rows; up then gate, shape: [{row: 128}, {byte: 128}], dtype: uint8, direction: ascending}
              b_scale: {meaning: FC1 scales of those rows in one fused image, shape: [{row: 128}, {scale_block: 16}], dtype: fp8_e4m3fn, direction: ascending}
          Target:
            Single_tile: {part: {meaning: FP32 slice partials of this item's columns, shape: [{route: bm}, {channel: 128}], dtype: fp32}}
        Mapping:
          Strategy: resident_cap is two CTAs per sm of the device; the capped grid only partitions items and never changes which items run
          Worker: {unit: cta, unit_count: 1}
          Worker_count: items_per_tile*min(tile_bound, max(1, floor(resident_cap/items_per_tile)))
        Schedule:
          Strategy: items_per_tile = split_count*(intermediate_dim/64); items number tile*items_per_tile + k_slice*(intermediate_dim/64) + n_tile, bounded by tile_count
          Worktile_order:
            - {by: tile, direction: ascending}
            - {by: k_slice, direction: ascending}
            - {by: n_tile, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, stride: worker_count}
            Refill: none
            Exit: assigned_done
      ACT:
        Describe: Reduce the FP32 slice partials of every route block in ascending slice order, then clamp, activate and quantize them into the packed activation
        Decomposition:
          Strategy: One thread per quarter of a 16-channel block of a route, quarters fastest; the four threads of a block share its maximum and one writes its scale byte
          Partition: {act_item: {meaning: One quarter of a route's activation block, size: route_capacity*(intermediate_dim/nvfp4_block)*4, tile: 256}}
          Target:
            Single_tile:
              act_payload: {meaning: Packed activation codes of this worktile, shape: [{block: 64}, {byte: 8}], dtype: uint8}
              act_scale: {meaning: Group scale of those 64 route blocks, shape: [{block: 64}], dtype: fp8_e4m3fn}
            Tile_reduction: {dimension: k_slice, input: 'ref:DESIGN.Math_reshape::part', output: ['ref:DESIGN.Math_reshape::act_payload', 'ref:DESIGN.Math_reshape::act_scale'], method: 'ref:DESIGN.Math_reshape::Slice reduction of the FC1 partials'}
        Mapping:
          Strategy: One thread per item with no grid stride; a thread whose item index passes route_capacity*(intermediate_dim/nvfp4_block)*4 has no work
          Worker: {unit: cta, unit_count: 1}
          Worker_count: ceil_div(route_capacity*(intermediate_dim/nvfp4_block)*4, 256)
        Schedule:
          Worktile_order: [{by: act_item, direction: ascending}]
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
      GEMM2:
        Describe: Multiply each route tile's packed activation by its expert's FC2 weight and materialize every route's result as BF16
        Decomposition:
          Strategy: bm = 128 route rows per tile, the same tiles GEMM1 used; a stage advances 256 intermediate channels of one 128-column operand
          Partition:
            tile: {meaning: One existing route tile, size: tile_count, tile: 1, range: [0, tile_bound]}
            n_tile: {meaning: Block of hidden channels, size: hidden_dim, tile: 128}
          Worktile:
            Iteration:
              a_payload: {meaning: Packed activation payload of the tile rows, shape: [{route: bm}, {byte: 128}], dtype: uint8, direction: ascending}
              a_scale: {meaning: Activation group scales of the tile rows, shape: [{route: bm}, {scale_block: 16}], dtype: fp8_e4m3fn, direction: ascending}
              b_payload: {meaning: FC2 payload of 128 prepared rows, shape: [{row: 128}, {byte: 128}], dtype: uint8, direction: ascending}
              b_scale: {meaning: FC2 scales of those prepared rows, shape: [{row: 128}, {scale_block: 16}], dtype: fp8_e4m3fn, direction: ascending}
          Target:
            Single_tile: {rout: {meaning: BF16 route results of the tile, shape: [{route: bm}, {hidden: 128}], dtype: bf16}}
        Mapping:
          Strategy: resident_cap is two CTAs per sm of the device; the capped grid only partitions items and never changes which items run
          Worker: {unit: cta, unit_count: 1}
          Worker_count: (hidden_dim/128)*min(tile_bound, max(1, floor(resident_cap/(hidden_dim/128))))
        Schedule:
          Strategy: Items number tile*(hidden_dim/128) + n_tile, bounded by the device tile_count; the leaf is fixed by the ids of the launch-setting call
          Worktile_order:
            - {by: tile, direction: ascending}
            - {by: n_tile, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, stride: worker_count}
            Refill: none
            Exit: assigned_done
      FINALIZE:
        Describe: Sum each token's routed BF16 results weighted by their routing scores and write that token's output row
        Decomposition:
          Partition:
            token: {meaning: One output row, size: token_count, tile: 1}
            hidden_block: {meaning: Block of hidden channels, size: hidden_dim, tile: 512}
          Target:
            Single_tile: {output: {meaning: This token's channels in the block, shape: [{hidden: 512}], dtype: 'ref:CONTRACT.Algorithm_requirement::output.dtype'}}
        Mapping:
          Strategy: One thread per 4-channel chunk of the block; a thread whose chunk passes hidden_dim/4 has no work
          Worker: {unit: cta, unit_count: 1}
          Worker_count: token_count * ceil_div(hidden_dim, 512)
        Schedule:
          Worktile_order:
            - {by: token, direction: ascending}
            - {by: hidden_block, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
    Flow:
      Launch:
        - {step: [PREPARE]}
        - {step: [GEMM1], start_after: PREPARE.launch_ready}
        - {step: [ACT], start_after: GEMM1.launch_ready}
        - {step: [GEMM2], start_after: ACT.launch_ready}
        - {step: [FINALIZE], start_after: GEMM2.launch_ready}
      Handoff:
        counts: {producer: PREPARE, consumer: [GEMM1, GEMM2], storage: global, ready: PREPARE.kernel_done}
        offs: {producer: PREPARE, consumer: [GEMM1, GEMM2], storage: global, ready: PREPARE.kernel_done}
        tile_offsets: {producer: PREPARE, consumer: [GEMM1, GEMM2], storage: global, ready: PREPARE.kernel_done}
        tile_expert: {producer: PREPARE, consumer: [GEMM1, GEMM2], storage: global, ready: PREPARE.kernel_done}
        tile_first: {producer: PREPARE, consumer: [GEMM1, GEMM2], storage: global, ready: PREPARE.kernel_done}
        route_of: {producer: PREPARE, consumer: [FINALIZE], storage: global, ready: PREPARE.kernel_done}
        route_token: {producer: PREPARE, consumer: [GEMM1], storage: global, ready: PREPARE.kernel_done}
        route_expert: {producer: PREPARE, consumer: [ACT], storage: global, ready: PREPARE.kernel_done}
        part: {producer: GEMM1, consumer: [ACT], storage: global, ready: GEMM1.kernel_done}
        act_payload: {producer: ACT, consumer: [GEMM2], storage: global, ready: ACT.kernel_done}
        act_scale: {producer: ACT, consumer: [GEMM2], storage: global, ready: ACT.kernel_done}
        rout: {producer: GEMM2, consumer: [FINALIZE], storage: global, ready: GEMM2.kernel_done}
  Tile_pipeline:
    Thesis: Both GEMMs split seven warps into two operand producers, one tensor-core issuer and four epilogue warps coupled only by mbarriers, with a three-deep payload ring, a two-deep scale ring and one accumulator per item; the boundary hoist stays off in this range. The other three nodes are single roles
    Step:
      PREPARE:
        Storage:
          ids_stage: {meaning: Staged expert id of every route slot, depth: 1, location: smem, shape: [{route: route_capacity}],
            dtype: int32, total_size: 4*route_capacity}
          warp_table: {meaning: Warp-private per-expert counters and bases, depth: 1, location: smem, shape: [{warp: 32}, {expert: 256}],
            dtype: int32, total_size: 32768}
        Role:
          MAIN:
            Info:
              Describe: Build the routing map and the tile map of the whole call in one block
              Member: warp[0:32]
              Using_verb:
                compute:
                  stage_ids: {execution_mode: serial, describe: 'Read the route_capacity ids into ids_stage, 16 bytes at a time where the pointer allows it, and zero warp_table; done covers the block rendezvous'}
                  histogram: {execution_mode: serial, describe: Each warp counts the valid ids of its own contiguous route range into its warp_table row; done covers the block rendezvous}
                  expert_scan: {execution_mode: serial, describe: 'Publish counts from each expert column of warp_table turned into per-warp bases, then scan them into offs and tile_offsets; done covers the rendezvous'}
                  scatter: {execution_mode: serial, describe: 'Take each position from its warp base and the per-expert rank, then write route_token, route_slot, route_expert and route_of, or -1 when invalid'}
                  tile_map: {execution_mode: serial, describe: Search the shared tile offsets for every tile of the call and write tile_expert and tile_first}
                await: {predecessor: {execution_mode: serial, describe: Grid-wide wait until every prior submission has completed and flushed its writes; done covers the whole CTA}}
                signal: {launch_dependents: {execution_mode: serial, describe: One warp per CTA permits the successor submission to launch; the grid signals once every CTA has run it}}
            Pipe:
              - await:predecessor
              - signal:launch_dependents
              - compute:stage_ids
              - compute:histogram
              - compute:expert_scan
              - compute:scatter
              - compute:tile_map
      GEMM1:
        Index:
          t: {meaning: Local ordinal of this worker's items, definition: worktile}
          ks: {meaning: k stage inside one item, definition: [0, hidden_dim/(256*split_count)]}
          g: {meaning: Stage ordinal across items, definition: {flatten: [t, ks]}}
        Storage:
          a_ring: {meaning: Staged activation payload rows of one stage, depth: 3, location: smem, shape: [{route: 128}, {byte: 128}],
            dtype: uint8, total_size: 49152, view: {a_payload(g): {slot_index: g%3}}}
          b_ring: {meaning: FC1 payload stages; up rows then gate rows, depth: 3, location: smem, shape: [{row: 128}, {byte: 128}],
            dtype: uint8, total_size: 49152, view: {b_payload(g): {slot_index: g%3}}}
          sfa_ring: {meaning: Staged activation scale blocks, depth: 2, location: smem, shape: [{element: 2048}],
