META_DATA:
  Name: nvfp4_fused_moe
  Describe: Routed NVFP4 mixture-of-experts forward with an explicit block-16 activation quantize-dequantize between FC1 and FC2 and a routing-weighted BF16 sum
  Source: KernelSchema@24d2b3d3ca9d4907c4e7efd9607cf78cfb1a52b2:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  Version: 4
  Dispatch:
    when: token_count*slot_count > 1536 and ceil_div(token_count*slot_count,128)*(hidden_dim/128)*max(1,intermediate_dim/256) >= 3072, and the multi-node chain is kept, so token_count*slot_count > 8192 or (token_count*slot_count)*hidden_dim > 32000000 or some ids entry lies in [0,expert_count), and the hidden_states payload is not entirely zero in magnitude
CONTRACT:
  Algorithm_requirement:
    Constant:
      nvfp4_block: {value: 16, meaning: Channels sharing one NVFP4 scale factor}
      e2m1_max: {value: 6, meaning: Largest magnitude of a signed E2M1 code}
      e4m3_max: {value: 448, meaning: Largest finite fp8_e4m3fn magnitude}
    Input:
      topk_ids: {meaning: 'Routing pair (expert ids, route weights) per slot', shape: [{token: token_count}, {slot: slot_count}], dtype: 'tuple(int32, fp32)'}
      hidden_states: {meaning: 'NVFP4 payload of the token activations, 2 per byte', shape: [{token: token_count}, {packed_hidden: hidden_dim/2}], dtype: uint8}
      hidden_states_scale: {meaning: E4M3 scale per nvfp4_block hidden channels, shape: [{token: token_count}, {hidden_block: hidden_dim/nvfp4_block}], dtype: fp8_e4m3fn}
      gemm1_weights: {meaning: 'Prepared NVFP4 FC1 payload, up and gate rows', shape: [{expert: expert_count}, {out: 2*intermediate_dim}, {packed_hidden: hidden_dim/2}], dtype: uint8}
      gemm1_weights_scale: {meaning: 'Prepared FC1 scales, 128x4 tiled', shape: [{expert: expert_count}, {out: 2*intermediate_dim}, {hidden_block: hidden_dim/nvfp4_block}], dtype: fp8_e4m3fn}
      gemm2_weights: {meaning: Prepared NVFP4 FC2 payload, shape: [{expert: expert_count}, {hidden: hidden_dim}, {packed_intermediate: intermediate_dim/2}], dtype: uint8}
      gemm2_weights_scale: {meaning: 'Prepared FC2 scales, 128x4 tiled', shape: [{expert: expert_count}, {hidden: hidden_dim}, {intermediate_block: intermediate_dim/nvfp4_block}], dtype: fp8_e4m3fn}
      gemm1_alpha: {meaning: Per-expert alpha of the FC1 activation, shape: [{expert: expert_count}], dtype: fp32, range: '[0.5, 2] or 4.0'}
      gemm1_beta: {meaning: Per-expert beta of the FC1 activation, shape: [{expert: expert_count}], dtype: fp32, range: '[0, 1] or 25.0'}
      gemm1_clamp_limit: {meaning: Per-expert FC1 clamp bound; None disables it, shape: [{expert: expert_count}], dtype: fp32, nullable: true, range: '[1, 16]'}
      activation_type: {meaning: Selects one of the two FC1 activation formulas, shape: [], dtype: python_int, range: 3 or 10}
      routing_bias: {meaning: 'Router bias, always None; routing is resolved', shape: [], dtype: python_none}
      gemm1_bias: {meaning: 'FC1 bias, absent in the declared domain', shape: [], dtype: python_none}
      gemm2_bias: {meaning: 'FC2 bias, absent in the declared domain', shape: [], dtype: python_none}
      output1_scale_scalar: {meaning: 'FC1 up scale, 1 in the domain and not applied', shape: [{expert: expert_count}], dtype: fp32}
      output1_scale_gate_scalar: {meaning: 'FC1 gate scale, 1 in the domain, not applied', shape: [{expert: expert_count}], dtype: fp32}
      output2_scale_scalar: {meaning: 'FC2 scale, 1 in the domain and not applied', shape: [{expert: expert_count}], dtype: fp32}
      num_experts: {meaning: Equal to expert_count; not read by the math, shape: [], dtype: python_int}
      top_k: {meaning: Equal to slot_count; not read by the math, shape: [], dtype: python_int}
      intermediate_size: {meaning: Equal to intermediate_dim; not read, shape: [], dtype: python_int}
      n_group: {meaning: 'Router group count, always None', shape: [], dtype: python_none}
      topk_group: {meaning: 'Router group selection count, always None', shape: [], dtype: python_none}
      local_expert_offset: {meaning: 'First local expert index, 0 in the domain', shape: [], dtype: python_int}
      local_num_experts: {meaning: Equal to expert_count; not read, shape: [], dtype: python_int}
      routed_scaling_factor: {meaning: 'Routed output factor, 1 and not applied', shape: [], dtype: python_float}
      routing_method_type: {meaning: 'Router policy id, 0; routing is consumed as is', shape: [], dtype: python_int}
      do_finalize: {meaning: 'Requests the reduction, True and unconditional', shape: [], dtype: python_bool}
      enable_pdl: {meaning: 'Launch hint, False; no numerical effect', shape: [], dtype: python_bool}
      per_token_scale: {meaning: 'Per-token scale, always None', shape: [], dtype: python_none}
      output_buffer: {meaning: Caller-allocated write destination of the result, shape: [{token: token_count}, {hidden: hidden_dim}], dtype: bf16}
      tune_max_num_tokens: {meaning: 'Autotuning budget, 8192; not read', shape: [], dtype: python_int}
      gemm1_lora_delta: {meaning: 'FC1 LoRA delta, always None', shape: [], dtype: python_none}
      valid_hidden_size: {meaning: 'Hidden padding limit, always None', shape: [], dtype: python_none}
      valid_intermediate_size: {meaning: 'Intermediate padding limit, always None', shape: [], dtype: python_none}
      num_fused_shared_experts: {meaning: 'Fused shared experts, always None', shape: [], dtype: python_none}
      hidden_states_scale_layout: {meaning: 'Scale layout tag, 2; not read by the math', shape: [], dtype: python_int}
    Output: {output: {meaning: output_buffer overwritten and returned in a list, shape: [{token: token_count}, {hidden: hidden_dim}], dtype: bf16}}
    Compute:
      - Name: Routing
        Math: |
          topk_ids is the pair (ids, scores): ids[t,s] names the expert of route slot s of token t and scores[t,s] is its weight, for 0 <= t < token_count and 0 <= s < slot_count.
          A route is valid when ids[t,s] is in [0, expert_count); an invalid route selects no expert and contributes exactly 0. The construction marks a masked or absent route with -1 and zeroes its score.
          Sizes come from the input shapes. In the declared domain slot_count = 8, token_count is in [1, 8192], (hidden_dim, intermediate_dim, expert_count) is one of (2048, 768, 128), (4096, 768, 128), (4096, 1536, 128), (7168, 256, 256), and both feature sizes are multiples of nvfp4_block, so every scale block is complete.
          Arithmetic between the declared storage and quantization boundaries is FP32, round-to-nearest-even, TF32 disabled; codes and scales enter at their exact decoded values.
          No formula reads the other interface arguments, whose entries record the fixed values of the declared domain.
        Symbol:
          ids: {meaning: Expert index of each route slot, shape: 'ref:topk_ids.shape', dtype: int32}
          scores: {meaning: Routing weight of each route slot, shape: 'ref:topk_ids.shape', dtype: fp32}
      - Name: Nvfp4 payload decode
        Math: |
          e2m1_level(code) for a 4-bit code is level[code mod 8] of level = (0, 0.5, 1, 1.5, 2, 3, 4, 6), negated when code >= 8, so code 8 is -0.
          One payload byte carries two consecutive channels of a row: q[j] holds channel 2j in its low nibble q[j] mod 16 and channel 2j+1 in its high nibble floor(q[j] / 16).
          decode(q, sf) for a payload q whose last axis has length m/2 and a scale sf whose last axis has length m/nvfp4_block:
            decode(q, sf)[d] = e2m1_level(nibble(d)) * fp32(sf[floor(d / nvfp4_block)])   for 0 <= d < m
            nibble(d) = q[floor(d/2)] mod 16 when d is even, floor(q[floor(d/2)] / 16) when d is odd
          The fp8_e4m3fn scale is used as its exact FP32 value and a zero scale decodes its whole block to zero. Every axis other than the last is independent and keeps its order.
          hidden_value = decode(hidden_states, hidden_states_scale) for each token; the hidden-state scales are logical row-major and carry no tiling.
        Symbol: {hidden_value: {meaning: Decoded FP32 activation of one token, shape: [{token: token_count}, {hidden: hidden_dim}], dtype: fp32}}
      - Name: Prepared weight layout
        Math: |
          The declared prepared layout stores the expert weight payloads and scales out of logical row order. For a prepared tensor with nrow logical rows:
            half_row(l) = 2*l for l < nrow/2 and 2*(l - nrow/2) + 1 for l >= nrow/2, applied to gemm1_weights only, whose stored rows interleave the up and gate halves; gemm2_weights uses half_row(l) = l
            row_perm(g) = 32*floor(g/32) + 8*(g mod 4) + floor((g mod 32)/4)
            prepared_row(l) = row_perm(half_row(l))
          The payload row and the scale row of one logical row share that index. The weight scale bytes are in addition tiled into 128-row by 4-column blocks: reading the stored scale tensor of one expert as an (nrow/128, ncol/4, 32, 16) image, where ncol is its scale column count, the multiplier of prepared row p and scale column j sits at [floor(p/128), floor(j/4), p mod 32, 4*floor((p mod 128)/32) + (j mod 4)]. Every declared geometry has nrow a multiple of 128 and ncol a multiple of 4, so the tiling carries no padding.
      - Name: Decoded expert weights
        Math: |
          w1[e][L,:] = decode over the row prepared_row(L) of gemm1_weights[e] and of the un-tiled gemm1_weights_scale[e], for 0 <= L < 2*intermediate_dim, so nrow = 2*intermediate_dim. Logical rows below intermediate_dim form the up projection and the rest form the gate projection.
          w2[e][L,:] = the same decode over gemm2_weights and gemm2_weights_scale, for 0 <= L < hidden_dim, so nrow = hidden_dim and half_row(L) = L.
        Symbol:
          w1: {meaning: 'Decoded FC1 weight of one expert, logical rows', shape: [{expert: expert_count}, {out: 2*intermediate_dim}, {hidden: hidden_dim}], dtype: fp32}
          w2: {meaning: 'Decoded FC2 weight of one expert, logical rows', shape: [{expert: expert_count}, {hidden: hidden_dim}, {intermediate: intermediate_dim}], dtype: fp32}
      - Name: Fc1 per route
        Math: |
          For every valid route (t,s) with e = ids[t,s]:
            up[t,s,i]   = sum_{h=0}^{hidden_dim-1} hidden_value[t,h] * w1[e,i,h]                    for 0 <= i < intermediate_dim
            gate[t,s,i] = sum_{h=0}^{hidden_dim-1} hidden_value[t,h] * w1[e,intermediate_dim+i,h]
          Both are FP32 dot products over the whole hidden dimension, without bias and without any output scale factor. up and gate exist only for valid routes; an invalid route never reaches FC2 and contributes 0 to the output.
        Symbol:
          up: {meaning: 'FC1 up half of one valid route, pre-activation', shape: [{token: token_count}, {slot: slot_count}, {intermediate: intermediate_dim}], dtype: fp32}
          gate: {meaning: 'FC1 gate half of one valid route, pre-activation', shape: [{token: token_count}, {slot: slot_count}, {intermediate: intermediate_dim}], dtype: fp32}
      - Name: Clamp and activation
        Math: |
          alpha = gemm1_alpha[e] and beta = gemm1_beta[e] are per-expert values used exactly.
          If gemm1_clamp_limit is not None, with limit = gemm1_clamp_limit[e]:
            up_c   = clamp(up, -limit, limit)
            gate_c = min(gate, limit)
          The gate half is bounded from above only and receives no lower bound. If gemm1_clamp_limit is None, up_c = up and gate_c = gate.
          If activation_type = 10:
            act = alpha * tanh(gate_c / alpha) * sigmoid(gate_c) * (beta * tanh(up_c / beta))
          Otherwise, which is activation_type = 3 in the declared domain:
            act = gate_c * sigmoid(alpha * gate_c) * (up_c + beta)
          sigmoid(x) = 1 / (1 + exp(-x)), tanh is the hyperbolic tangent, and every product and sum is FP32.
        Symbol: {act: {meaning: Activated FC1 value of one valid route, shape: [{token: token_count}, {slot: slot_count}, {intermediate: intermediate_dim}], dtype: fp32}}
      - Name: Activation nvfp4 round trip
        Math: |
          Every route quantizes its own activation independently, one group per nvfp4_block consecutive intermediate channels. For a valid route (t,s) and 0 <= b < intermediate_dim/nvfp4_block:
            peak = max_{0<=u<nvfp4_block} abs(act[t,s,b*nvfp4_block+u])
            act_scale[t,s,b] = fp8_e4m3fn(clamp(peak / e2m1_max, 0, e4m3_max))
            normalized = act[t,s,b*nvfp4_block+u] / fp32(act_scale[t,s,b]) when act_scale[t,s,b] > 0, and 0 when it is 0
            act_q[t,s,b*nvfp4_block+u] = e2m1_rne(normalized) * fp32(act_scale[t,s,b])
          The scale cast is round-to-nearest-even into fp8_e4m3fn after the clamp and the scale is read back as its exact FP32 value, so a zero scale forces its whole group to zero.
          e2m1_rne(x) keeps the sign of x, rounds abs(x) to the nearest value of (0, 0.5, 1, 1.5, 2, 3, 4, 6), takes the level with the even code index on a tie, and saturates to 6 when abs(x) > 6.
          This quantize-dequantize is the declared boundary between the activation and FC2: FC2 consumes act_q and never act.
        Symbol:
          act_scale: {meaning: E4M3 scale of one activation block of a route, shape: [{token: token_count}, {slot: slot_count}, {block: intermediate_dim/nvfp4_block}], dtype: fp8_e4m3fn}
          act_q: {meaning: Activation after the NVFP4 round trip, shape: [{token: token_count}, {slot: slot_count}, {intermediate: intermediate_dim}], dtype: fp32}
      - Name: Fc2 per route
        Math: |
          For every valid route (t,s) with e = ids[t,s] and 0 <= h < hidden_dim:
            route_out[t,s,h] = fp32(bf16(sum_{i=0}^{intermediate_dim-1} act_q[t,s,i] * w2[e,h,i])) * scores[t,s]
          The FP32 sum covers the whole intermediate dimension, is materialized as BF16 with round-to-nearest-even before the routing weight is applied, and the product is formed in FP32. No bias and no output scale factor is applied.
          For a route that selects no expert, route_out[t,s,h] = 0 for every h.
        Symbol: {route_out: {meaning: BF16 FC2 result of one route times its weight, shape: [{token: token_count}, {slot: slot_count}, {hidden: hidden_dim}], dtype: fp32}}
      - Name: Routing reduction and output
        Math: |
          For every token t and hidden channel h:
            acc[t,h] = sum_{s=0}^{slot_count-1} route_out[t,s,h]      in FP32, the summation order over routes being unspecified
            output[t,h] = bf16(acc[t,h])                              round-to-nearest-even into the declared storage dtype
          A token whose slots are all invalid keeps acc = 0 and therefore output = 0, which is how empty and fully masked routing are answered.
          output is output_buffer, the same tensor object the caller supplied: its incoming values are not read, all token_count*hidden_dim elements are overwritten, that object is returned inside a one-element list, and no other caller-visible storage changes. The input construction places output_buffer inside a larger guarded allocation, so a write outside that view is observable. Buffers an implementation keeps for itself are not outputs.
        Symbol: {acc: {meaning: FP32 sum of the route contributions of a token, shape: [{token: token_count}, {hidden: hidden_dim}], dtype: fp32}}
    Golden_reference:
      Source: KernelSchema@24d2b3d3ca9d4907c4e7efd9607cf78cfb1a52b2:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/problem/reference.py::Model.forward
      Tolerance:
        output: Source only, no defaults; atol=.01 rtol=.05 mismatch_fraction<=.001 rel_l2<=.01; formula absent
      Gap: Standard answer only inside the declared fixed domain; arguments marked inert are never read
  Hardware_specification:
    Device:
    Architecture:
    Execution:
      thread: Single instruction lane of a warp holding its own registers; the fixed implementation sizes per-thread payload staging at this level
      warp: 32 threads issued together inside one CTA; the fixed implementation splits staging, tensor-core issue and epilogue roles across warps of the same CTA
      cta: Thread block of one or more warps that runs on a single SM for its lifetime and owns one shared-memory allocation
      sm: Streaming multiprocessor hosting the resident CTAs of a grid together with their shared memory and registers
      grid: The CTAs of one kernel launch, distributed over the SMs of the device, with no ordering guaranteed between them
    Feature:
      mechanism: null
    Stack:
      Language:
      Toolchain:
    Wiki:
      Hardware:
      Programming:
        Language:
      Microbench:
      Sota:
