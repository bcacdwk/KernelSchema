meta_data:
  name: fp8_scaled_grouped_gemm
  describe: Multiply contiguous row groups of FP8 activations by their FP8 weight matrices with block scales, overwriting
    a caller-owned BF16 output.
  source: SchemaExtractSource_2c7b5a74c0b3@497a8077ac54ed1431bc00772871337f9a309852:kernel_wiki/aka-cuda-operators-20261030/operators/gemm/grouped/fp8_scaled_grouped_gemm/candidate/solution.py::Model.forward
  version: 2
  dispatch:
    id: wide_recovery
    parent: wide
    when: |
      Let U be the engine chosen by Model initialization. U is umma when
      the device-0 major capability queried by _Engines is 10 and the UMMA
      library builds and loads successfully; otherwise initialization tries
      the sync engine. A binding-module failure alone retains UMMA via ctypes.
      Let S be the device-0 multiprocessor count passed by that wrapper.
      Let P be the engine selector returned by sched_policy in the UMMA
      module actually invoked. Its cache key is (address(m_indptr), E, M, N, K).
      A cache hit reuses P, without deriving it again from current tensor contents.
      On a miss, the host attempts a device-to-host pointer-array copy and
      stream synchronization. P defaults to 0 if either fails or the copied
      boundaries are not nonnegative, nondecreasing and at most M.
      After a successful read, let h be the copied boundaries,
      A = count of integers 0 <= g < E with h[g+1] > h[g],
      T = sum over 0 <= g < E of ceil((h[g+1]-h[g])/128),
      B = K/128 and I = T*(N/256).
      Let W mean N is divisible by 256, A > 0, S > 0, and at least one of:
      (B >= 32 and ((I >= 4*S and T >= 4*A)
                   or (B <= 48 and 2*I >= 5*S and T >= A)));
      (B >= 16 and I >= 8*S and (T >= 2*A or T == A));
      (8 <= B <= 12 and I >= 10*S and T >= A);
      (8 <= B <= 20 and I >= 4*S and T >= 2*A).
      The new selector is P=0 when W is false, P=2 when W is true and
      B <= 20 and 2*T >= 3*A, and P=1 otherwise. The normal build sets sareg=0.
      Let L be this request's actual compute-kernel submissions, including
      any submission preceding an API-error fallback. Graph construction
      and instantiation alone add no computation to L. For a recorded request,
      use its recorded host selection and by-value arguments at replay;
      device reads still use the tensor contents at execution time.
      Let F denote umma_wide<4,32768,0> and G denote umma_wide<3,65536,1>.
      Select exactly when U is umma, P is 1 or 2, and L is exactly
      [F,F], [G,G] or [G,F]. These are two actual compute submissions in
      one request, ordered by the same stream. P=1 attempts F; P=2 attempts
      G unless the permanent g_w1g_off flag redirects it to F. A failed
      graph replay disables that engine's graph path and continues to its
      direct attempt. A failed direct G attempt sets g_w1g_off and continues
      to F. Count an attempt in L only if it actually submitted computation;
      API failure cannot remove an already submitted prefix. Construction
      or instantiation without replay adds no computation. A pure recording
      describes this future execution, with no extra invocation at recording.
design:
  math_reshape:
    thesis: Evaluate the grouped product twice from the stored FP8 payloads, applying block scales after each dot
      and overwriting the output on each evaluation. Recovery doubles the dense work and writeback while retaining
      the single-evaluation numerical path and avoiding scaled FP32 operand materialization.
    rewrite:
    - step: block_dot
      name: Unscaled block products
      math: |
        Let q in {0,1} index two complete evaluations. The values below belong
        to independent evaluations; no result of evaluation 0 is an input to
        evaluation 1. The notation suppresses q on local values.
        Let KB = K/ScaleK and Tn = N/Bn. For each group g, let
        Rg = m_indptr[g+1]-m_indptr[g], Tm(g) = ceil_div(Rg,Bm).
        For 0 <= x < Tm(g), 0 <= y < Tn, define
        r0 = m_indptr[g]+x*Bm, c0 = y*Bn and V = min(Bm,Rg-x*Bm).
        For 0 <= kb < KB, 0 <= u < Bm, 0 <= v < Bn, 0 <= z < ScaleK:
        A_tile(kb)[u,z] = a[r0+u,kb*ScaleK+z] if u < H and r0+u < M;
                        = 0 if u < H and r0+u >= M;
                        = the retained, unspecified FP8 row payload if u >= H.
        B_tile(kb)[v,z] = b[g,c0+v,kb*ScaleK+z].
        Dot(kb) = mm32(A_tile(kb), B_tile(kb)^T).
        All Bm rows are evaluated, including u >= V; no result from those
        rows is used in an output. Empty groups have no such instances.
        Let Mp = Bm*sum_g Tm(g) be the total evaluated row extent.
      arithmetic:
        accumulate: Each Dot uses four consecutive 32-element reduction slices, in increasing order, with FP8 inputs
          and a FP32 accumulator initialized by the first slice. Subsequent slices accumulate into that result.
      symbol:
        Bm: {meaning: Evaluated rows per output worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn: {meaning: Columns per output worktile, binding: 'bind:design.work_schedule::Bn'}
        H: {meaning: Loaded activation row extent for the current worktile, binding: 'bind:design.work_schedule::H'}
        A_tile:
          meaning: Activation payload consumed by a block product
          shape: [{row: Bm}, {reduction: ScaleK}]
          dtype: fp8_e4m3fn
        B_tile:
          meaning: Weight payload consumed by a block product
          shape: [{column: Bn}, {reduction: ScaleK}]
          dtype: fp8_e4m3fn
        Dot:
          meaning: Unscaled reduction-block product
          shape: [{row: Bm}, {column: Bn}]
          dtype: fp32
          retention: keep_value (q,g,x,y,kb)
    - step: scaled_sum
      name: Block scaling and ordered output accumulation
      math: |
        For each q and each nonempty output worktile, F(-1)[u,v] = 0.
        For kb=0,...,KB-1 in ascending order and 0 <= h < Bn/ScaleN:
        sa(kb,u) = a_scale[kb,r0+u] if r0+u < M, otherwise 0.
        sb(kb,h) = b_scale[g,kb,y*(Bn/ScaleN)+h].
        Scale(kb)[u,h] = sa(kb,u)*sb(kb,h).
        For 0 <= u < Bm and 0 <= v < Bn:
        F(kb)[u,v] = fma32(Scale(kb)[u,floor(v/ScaleN)],
                           Dot(kb)[u,v], F(kb-1)[u,v]).
        For 0 <= u < V and 0 <= v < Bn:
        out[r0+u,c0+v] = bf16(F(KB-1)[u,v]).
        Discard F for u >= V. Each evaluation overwrites the entire output
        view without reading its prior contents. Evaluation 1 supplies the
        final output. The output identity and all other side effects follow
        Contract's Grouped matrix product and writeback requirement.
      symbol:
        Scale:
          meaning: Rounded product of the activation and weight scales for each row and column-scale block.
          shape: [{row: Bm}, {n_block: Bn/ScaleN}]
          dtype: fp32
        F:
          meaning: Scaled output accumulator
          shape: [{row: Bm}, {column: Bn}]
          dtype: fp32
          retention: carry_forward (q,g,x,y); kb=-1..KB-1
    ledger:
      baseline: One direct Contract evaluation with materialized scaled FP32 A_value and B_value, followed by their
        grouped FP32 matrix product. The design counts cover both evaluations, including padded rows.
      matmul:
      - item: Dense products
        change: M*N*K FP32-input MACs -> 2*Mp*N*K FP8-input MACs per request; 2*(Mp-M)*N*K MACs compute discarded
          rows
        by: [block_dot]
      vector:
      - item: Scale application
        change: M*K+E*N*K FP32 operand multiplications -> 2*Mp*Tn*KB*(Bn/ScaleN) scale multiplications and 2*Mp*N*KB
          FP32 fused multiply-adds per request
        by: [scaled_sum]
      footprint:
      - item: Scaled operands
        change: 4*(M*K+E*N*K) bytes of FP32 operand materialization -> 0 bytes; each live Dot and F is 4*Bm*Bn bytes
          and belongs to one q
        by: [block_dot, scaled_sum]
      error:
      - item: Reassociation
        change: Per-operand scaling before the product -> rounded scale products applied after each block dot, then
          ordered FP32 FMA; no source-provided bound on final reference error
        by: [block_dot, scaled_sum]
      traffic:
      - item: Output writeback
        change: 2*M*N -> 4*M*N logical output bytes written per request; neither evaluation reads previous output
        by: [scaled_sum]
  work_schedule:
    thesis: Submit two independent persistent wide grids on the request stream, waiting for the first kernel to finish
      before the second begins. Each grid owns and recomputes the complete output; recovery incurs a second full evaluation
      and writeback without passing intermediate values between grids.
    flow:
      launch:
      - phase: [first]
      - phase: [retry]
        start_after: first.kernel_done
    phase:
      first: &wide_work
        describe: Compute block_dot and scaled_sum for one evaluation q over every grouped output tile, overwriting
          its owned rows.
        decomposition:
          strategy: |
            Bind q=0 in first and q=1 in retry. Use the specialization L[q] and
            that actual submission's by-value parameters and tensor maps. Tensor
            bindings and host choices in a graph come from recording or explicit
            updates; reads of tensor contents occur during this execution.
            Bm = 128 and Bn = 256. Let prefix(0)=0 and
            prefix(g+1)=prefix(g)+Tm(g); W=prefix(E)*Tn.
            The work numbered w has the unique nonempty group g satisfying
            prefix(g)*Tn <= w < prefix(g+1)*Tn.
            Let z=w-prefix(g)*Tn; y=floor(z/Tm(g)), x=z%Tm(g).
            This binds the mathematical worktile (q,g,x,y), including r0,c0,V.
            The activation extent H is the smallest member of {16,32,64,128}
            at least V when all three reduced-height tensor maps were obtained;
            otherwise H=128 for this submission. Only H rows are loaded, but
            every block product evaluates Bm rows as defined in block_dot.
            Each local iteration consumes block kb, kb in [0,KB).
            All scales and all K contributions are applied inside this worktile;
            no cross-worktile reduction or intermediate global matrix is used.
          partition:
            work: {size: W, tile: 1}
          worktile:
            invariant:
              m_indptr:
                shape: [{boundary: E+1}]
                dtype: ref:contract.algorithm_requirement::m_indptr.dtype
            iteration:
              A_tile:
                shape: [{row: Bm}, {reduction: ScaleK}]
                dtype: ref:design.math_reshape::A_tile.dtype
                direction: ascending
              B_tile:
                shape: [{column: Bn}, {reduction: ScaleK}]
                dtype: ref:design.math_reshape::B_tile.dtype
                direction: ascending
              a_scale:
                shape: [{k_block: 1}, {row: Bm}]
                dtype: ref:contract.algorithm_requirement::a_scale.dtype
                direction: ascending
              b_scale:
                shape: [{k_block: 1}, {n_block: Bn/ScaleN}]
                dtype: ref:contract.algorithm_requirement::b_scale.dtype
                direction: ascending
          target:
            single_tile:
              out:
                shape: [{row: V}, {column: Bn}]
                dtype: ref:contract.algorithm_requirement::out.dtype
        mapping:
          strategy: |
            Let Wub=(ceil_div(M,Bm)+E)*Tn and C=max(1,min(Wub,S)), where S
            is the wrapper's multiprocessor count used for this submission.
            The kernel uses 320 threads per CTA. C is a submission count,
            not a claim that all workers are resident simultaneously.
          worker: {unit: CTA, unit_count: 1}
          worker_count: C
        schedule:
          strategy: |
            Each CTA independently copies the execution-time m_indptr and builds
            prefix once. Producer and epilogue scan groups monotonically from
            their previous group for each increasing assigned w. Empty groups
            are skipped. Workers with worker_id >= W do initialization and
            teardown but execute no worktile.
            The two launches use the same request stream. first.kernel_done includes
            all first-grid output writes and worker teardown before retry begins;
            it does not require a blocking host wait. The grids have distinct worker
            and local-resource instances even if their mappings are identical.
            There is no cross-phase data handoff: retry reads the original inputs,
            reinitializes its local accumulators and overwrites out without reading
            first's output. The graph for either phase retains its own ParamsW and
            tensor maps, including its recorded bstream flag; a direct submission
            uses the current parameters. The grid and activation-map availability
            also belong to that submission.
            Required A, output and wide B maps and shared-memory capacity are checked
            on the host. Reduced-height map failure only disables H reduction.
            An attempt with no actual computation adds no entry to L; the selection
            here requires both actual compute submissions. Subsequent API errors
            do not retract them. Model.forward propagates a nonzero return code
            without switching to the sync engine.
          worktile_order: [{by: work, direction: ascending}]
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      retry: *wide_work
  tile_pipeline:
    thesis: Each submission separately overlaps single-block operand loads, FP8 products and two column groups of
      epilogue work. Its specialization chooses a deeper input ring with two store batches (F) or a shallower ring
      with one larger batch (G); all local state and outstanding operations close within that submission.
      The source TMEM drain omits the row-group address contribution in every F/G instance of first and retry;
      this design retains complete 128x256 products and distinct row ownership supported by product generation,
      512-column TMEM capacity, row-specific scales and stores.
    phase:
      first: &wide_pipe
        domain:
          t: worktile
          kb: [0, KB]
          n:
            flatten: [t, kb]
          p: [0, KB+2]
          d: [0, 4]
        resource:
          Schedule:
            space: SMEM
            member_slot_shape: [{array: 2}, {boundary: E+1}]
            dtype: int32
            slot_count: 1
          OperandRing:
            space: SMEM
            member_slot_shape: [{row: Bm+Bn}, {reduction: ScaleK}]
            dtype: fp8_e4m3fn
            slot_count: R
            view:
              Operands(n): {slot_index: n%R}
              A_block(n):
                slot_index: n%R
                part:
                  row: [0, Bm]
              B_block(n):
                slot_index: n%R
                part:
                  row: [Bm, Bm+Bn]
          ProductRing:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: Bn}]
            dtype: fp32
            slot_count: 2
            view:
              Product(n): {slot_index: n%2}
          ScalePrefetch:
            space: register
            member_slot_shape: [{operand: 2}, {row: Bm}, {n_block: Bn/ScaleN}]
            dtype: fp32
            slot_count: 2
            view:
              RawScale(t,p): {slot_index: p%2}
          CurrentScale:
            space: register
            member_slot_shape: [{row: Bm}, {n_block: Bn/ScaleN}]
            dtype: fp32
            slot_count: 1
            view:
              Scale(n): {}
          DrainRegister:
            space: register
            member_slot_shape: [{row: Bm}, {n_block: Bn/ScaleN}, {column: 32}]
            dtype: fp32
            slot_count: 2
            view:
              Fragment(n,d): {slot_index: d%2}
          F:
            space: register
            member_slot_shape: [{row: Bm}, {column: Bn}]
            dtype: fp32
            slot_count: 1
          OutputStaging:
            space: SMEM
            member_slot_shape: [{row: Bm}, {column: J*ScaleN}]
            dtype: bf16
            slot_count: 1
            view:
              Output(t,f): {}
        role:
          Producer:
            info:
              execution_mode: async
              member: warp[8:9]
              verb:
                initialize:
                  execution_mode: serial
                  meaning: 'Schedule is the CTA-cooperative entry: copy m_indptr, build prefix, initialize resource
                    generations and allocate ProductRing with the issuing warp. Completion includes the CTA rendezvous
                    before role divergence. Schedule holds boundaries and prefix. Let J=1 when this phase uses L[q]=F
                    and J=2 when L[q]=G, with q bound by work_schedule. Set R=5-J for this worker''s lifetime. ProductRing
                    holds two independent Dot blocks. Each launch starts its own ring positions, generations, scale
                    state and store history; no local resource or event instance is shared between first and retry.'
                load: 'The elected lane loads A_tile(kb) and B_tile(kb) into A_block(n) and B_block(n), jointly named
                  Operands(n). The A box covers H rows and zero-fills beyond global M; rows above H retain their storage
                  contents. B covers all Bn columns. Done covers all actual transfer bytes, without requiring a write
                  to untouched A rows. Ring positions and generations continue across worktiles. Bstream is the submitted
                  bstream flag: on a policy miss it is zero after a failed or invalid host read, otherwise one exactly
                  when copied row tiles equal copied nonempty groups. Policy hits reuse the flag; graph replay uses
                  the value recorded in that graph.'
            pipe:
              prologue: ['initialize:Schedule']
              repeat: n
              steady: ['load:Operands(n)']
            waits_for:
              reuse:
                load:Operands(n+R): ['Issuer/mma:A_block(n)@B_block(n)']
          Issuer:
            info:
              execution_mode: async
              member: warp[9:10]
              verb:
                mma: The elected lane computes Dot(kb) into Product(n) using the four reduction slices defined by
                  block_dot, initializing on the first slice. Done is the committed completion that makes the product
                  readable and ends all reads of Operands(n). Producer and Epilogue observe this same completion for
                  different purposes.
            pipe:
              repeat: n
              steady: ['mma:A_block(n)@B_block(n)']
            waits_for:
              data:
                mma:A_block(n)@B_block(n): ['Producer/load:Operands(n)']
              reuse:
                mma:A_block(n+2)@B_block(n+2): ['Epilogue/release:Product(n)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                prepare: Work(t) decodes coordinates from Schedule and initializes F to its mathematical initial state.
                  Two four-warp groups each own all Bm rows and one disjoint ScaleN-column group; within each group,
                  members own disjoint rows. All Bm rows participate in computation and release. Let Full(t)=1 if
                  V=Bm, otherwise 0.
                prefetch:
                  execution_mode: async
                  meaning: RawScale(t,p) loads the activation and weight scales of block p into ScalePrefetch when
                    p<KB. Activation scales are replicated across column groups; weight scales across rows. A row
                    beyond global M receives zero without reading a_scale, while rows in another physical group are
                    still read. For p>=KB both scales are set to zero, complete at issue, and perform no global read.
                    Each worktile primes blocks 0 and 1; consuming block kb allows replacement by kb+2. The captured
                    Scale survives that replacement.
                capture: Scale(n) consumes RawScale(t,kb) and computes mathematical Scale(kb) into CurrentScale. Done
                  ends those raw-scale reads. Each row and column group's scale is retained through all four fragment
                  accumulations of this block.
                acquire: Product(n) observes the issuer's committed completion and establishes TMEM visibility before
                  any fragment is read.
                read:
                  execution_mode: async
                  meaning: Fragment(n,d) reads columns [32*d,32*(d+1)) of each column group from Product(n) into DrainRegister
                    for all Bm rows. Done includes delivery of both groups' fragments into registers.
                await: Complete after the referenced TMEM fragment delivery has finished.
                compute: Accum(n,d) uses Fragment(n,d) and the retained Scale(n) to perform scaled_sum for those columns
                  in F. Done ends reads of the fragment, permitting that DrainRegister slot to be reused.
                release: Product(n) joins completed TMEM reads from all epilogue rows and both column groups, returning
                  its slot before the final register FMA. Staging(t,f) instead waits for every outstanding earlier
                  bulk store to stop reading OutputStaging, then rendezvous all epilogue members. The first batch
                  has no prior store to wait for; later batches include stores from this or earlier worktiles. Tail
                  worktiles preserve this bulk-store history.
                publish: Output(t,f) converts the J column groups numbered J*f through J*f+J-1 from F to BF16 in OutputStaging.
                  All epilogue members rendezvous; the writers publish their data to the asynchronous access domain
                  before the elected store lane proceeds.
                store:
                  execution_mode: async
                  meaning: Output(t,f) issues 2*J full-height 64-column bulk transfers to out starting at column c0+J*f*ScaleN
                    and commits one group. Done means destination writes are complete. The next batch or worktile
                    may advance while those writes remain in flight.
                store_tail: out(t,z) converts and directly stores F for rows u<V in both column groups. Other rows
                  do not write. Done ends all F reads; OutputStaging and the prior bulk-store history are untouched.
                drain: Stores waits for destination completion of all earlier bulk groups; it has no data effect when
                  none were issued. After all roles finish, the CTA rendezvous precedes ProductRing deallocation,
                  including for workers assigned no worktiles.
            pipe:
              prologue: ['wait:Schedule']
              repeat: t
              steady:
              - prepare:Work(t)
              - repeat: p[0:2]
                steady: ['prefetch:RawScale(t,p)']
              - repeat: n[t]
                steady:
                - capture:Scale(n)
                - prefetch:RawScale(t,kb+2)
                - acquire:Product(n)
                - read:Fragment(n,0)
                - repeat: d[0:3]
                  steady: ['await:Fragment(n,d)', 'read:Fragment(n,d+1)', 'compute:Accum(n,d)']
                - await:Fragment(n,3)
                - release:Product(n)
                - compute:Accum(n,3)
              - repeat:
                  f: [0, Full(t)*2/J]
                steady: ['release:Staging(t,f)', 'publish:Output(t,f)', 'store:Output(t,f)']
              - repeat:
                  z: [0, 1-Full(t)]
                steady: ['store_tail:out(t,z)']
              epilogue: ['drain:Stores']
            waits_for:
              data:
                wait:Schedule@done: ['Producer/initialize:Schedule']
                capture:Scale(n): ['prefetch:RawScale(t,kb)']
                acquire:Product(n): ['Issuer/mma:A_block(n)@B_block(n)']
                await:Fragment(n,d)@done: ['read:Fragment(n,d)']
      retry: *wide_pipe
realization:
  require:
  - item: ['design.tile_pipeline::first.Producer', 'design.tile_pipeline::retry.Producer']
    choice: Use tensor-map 2D asynchronous loads with byte-count completion barriers; the operand maps and MMA descriptors
      use compatible 128-byte swizzling.
    reason: Readiness covers the selected H-row A box and full B box while preserving the untouched A rows and the
      R-slot operand storage.
  - item: ['design.tile_pipeline::first.Issuer', 'design.tile_pipeline::retry.Issuer']
    choice: Use tcgen05.mma.cta_group::1.kind::f8f6f4 and tcgen05.commit for the product/operand completion; use tcgen05.fence::after_thread_sync
      after the relevant barrier waits.
    reason: These bind the TMEM product path and the completion observed both for epilogue visibility and for operand
      reuse.
  - item: ['design.tile_pipeline::first.Epilogue', 'design.tile_pipeline::retry.Epilogue']
    choice: Use tcgen05.ld with tcgen05.wait::ld for fragment delivery, and tcgen05.fence::after_thread_sync when
      acquiring each product.
    reason: Rotated fragment consumption and early ProductRing release rely on completed TMEM reads, not merely their
      issue.
  - item: ['design.tile_pipeline::first.OutputStaging', 'design.tile_pipeline::retry.OutputStaging']
    choice: Match BF16 staging to UINT16 64-by-128 tensor maps. Publish with fence.proxy.async.shared::cta and an
      epilogue rendezvous; use bulk-group stores, wait_group.read 0 for source reuse and wait_group 0 for exit.
    reason: The J-group buffer is shared by its writers; permission to overwrite it precedes completion of the destination
      writes.
  prefer:
  - item: ['design.tile_pipeline::first.Producer', 'design.tile_pipeline::retry.Producer']
    choice: Use the L2 evict_first hint for B loads exactly when Bstream is set.
    reason: The host policy targets one row tile per nonempty group, where B has no row-tile reuse. A retained policy
      can outlive those tensor contents; the hint does not assert absence of reuse during the current execution.
