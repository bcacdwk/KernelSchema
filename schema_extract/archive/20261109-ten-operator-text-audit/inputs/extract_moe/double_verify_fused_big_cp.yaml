meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization and BF16 output.
  source: 
    SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: double_verify_fused_big_cp
    parent: verify_fused_big_cp
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved routing
      preparation threshold, and zflag/zflag_host are the device verification
      state and its pinned host mirror. All implementation controls used to
      construct a and the reused graphs follow the frozen default scope.
      Let R=T*K. Select exactly when the call reuses a, a.cfg=97,
      a.cfg2 is 23 or 44, a.zflag != 0, a.zflag_host != 0,
      R > a.small_thresh, R < 49152, and graph_replay returns zero after
      successfully submitting or recording both exec_clean and exec, in that
      order, for this request. exec_clean is the verify-only graph; exec is
      the full pipeline including its own verifier. Outside outer capture,
      graph_replay sets the pinned word to -1, launches exec_clean, polls
      while it remains -1 for at most 200000000 iterations, and the final
      volatile check observes a value other than 1, so exec is also launched.
      This includes observed dirty input and an unresolved poll timeout.
      Inside outer capture it records both graphs without polling; their
      later execution belongs to this node for either clean or dirty input.
      The executed or recorded FC2 launch follows refused tma_set lookups
      with 128-column boxes: cfg2=23 falls through cfg12 and its second
      refused lookup, while cfg2=44 falls through directly; both select
      fc=8 and k_gemm_f4<128,false,3>.
      Every private-stream run_pipeline call in this request, if present,
      is capture-only following successful cudaStreamBeginCapture; there
      is no additional uncaptured pipeline submission on that stream.
      Pure recording creates no computation or GPU completion events.
      ABI choices, tensor bindings and kernel identity are fixed at recording;
      device tensor reads use execution-time contents. Reuse does not repeat
      route_hist, table initialization, workspace construction or the ABI
      zero probe. The second verdict does not remove any submitted kernel.
design:
  math_reshape:
    thesis: |
      Recheck inputs and zero the caller output twice, reusing the same verdict
      and output storage. The second verdict guards compact routing, fused FC1
      activation and quantization, and packed FC2 with direct BF16 route stores;
      the first pass adds a full scan and zero write even when no payload work follows.
    rewrite:
    - step: verify
      name: Revalidate zero input twice and overwrite the same output
      math: |
        R = T*K. VerifyBatch and VerifyBlocks are bound by work_schedule.
        For 0 <= b < VerifyBlocks and a flat space of length N, define
        S_b(N) = {i in integers | 0 <= i < N and
                  floor(i/VerifyBatch) mod VerifyBlocks = b}.
        Flatten each tensor in its declared contiguous order.
        For verification v=0 and then v=1, independently read the current inputs.
        Dirty(v,b) is 1 if any hidden_states byte belonging to a four-byte
        word indexed by S_b(T*H/8) has bitwise AND with 0x77 nonzero,
        or any hidden_states_scale byte indexed by S_b(T*H/16) has
        its low seven bits equal to 0x7f, or any route_weights element
        indexed by S_b(R) is nonfinite, or any gemm1_alpha or gemm1_beta
        element indexed by S_b(E) is nonfinite. Also test the corresponding
        gemm1_clamp_limit elements when that tensor is not None.
        Otherwise Dirty(v,b)=0. FirstClean = 1-max_b Dirty(0,b);
        Clean = 1-max_b Dirty(1,b). Neither pass rechecks weight scales.
        For every v, b and i in S_b(T*H/8), unconditionally write eight BF16
        positive zeros to flattened output elements [8*i,8*i+8).
        FirstZeroOutput[t,h]=bf16(0) is the v=0 version; ZeroOutput[t,h]=bf16(0)
        is the v=1 version of that same caller output, not separate allocations.
        The second pass overwrites every first-pass zero, without reading it.
        FirstClean and Clean are successive versions of one retained verdict,
        each exposed for host observation. FirstClean
        is available for the host decision until the second pass overwrites it;
        it is not used by downstream payload guards or copied to form Clean.
        FirstZeroOutput is retained only until the second pass writes ZeroOutput.
        Clean is retained for all downstream guards. On dirty executions
        ZeroOutput remains until finalize overwrites it; on clean executions it is Y.
        For Clean=1, use empty active domains V={} and M=J=U=PaddedRows=0,
        without reading routing metadata. Counts and Fill are reset to zero;
        other routing, gathered, intermediate and route-result buffers keep
        their previous contents and are not consumed. For Clean=0 evaluate
        the routing, gather, fc1_quantize, fc2 and finalize definitions below.
        Nchunk=9*H/256 in both cases.
      symbol:
        VerifyBatch: {meaning: Verification packet width, binding: bind:design.work_schedule::VerifyBatch}
        VerifyBlocks: {meaning: Number of verification shards, binding: bind:design.work_schedule::VerifyBlocks}
        Dirty: {meaning: Nonzero predicate for one verification instance and shard, shape: [], dtype: int32}
        FirstClean:
          meaning: First verdict, retained until the second verification overwrites its storage
          shape: []
          dtype: int32
          retention: keep_value invocation
        FirstZeroOutput:
          meaning: First zero version of caller output, overwritten by the second verification
          shape:
          - token: T
          - hidden: H
          dtype: bf16
          retention: keep_value invocation
        Clean: {meaning: Current zero-input verdict stored in the ABI device flag, shape: [], dtype: int32, retention: keep_value invocation}
        ZeroOutput: {meaning: 'Second zero version of caller output, retained as Y on clean executions', shape: [token: T, hidden: H], dtype: bf16, retention: keep_value
            invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        For Clean=0, let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For b = 0..ceil_div(R,RouteBatch)-1, Hist(b)[e] counts routes to e among flattened slots
        [RouteBatch*b,RouteBatch*(b+1)),
        clipped to [0,R). Counts[e] = sum_b Hist(b)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        Fill[e] starts at zero. Each route batch reserves its expert counts by
        fetch-and-add on Fill[e]; local ranks assign a bijection rho from V onto
        [0,M), with rho(t,k) in [Offs[e],Offs[e+1]) for e = route_ids[t,k].
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k]. Fill[e] ends at Counts[e].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteBatch: {meaning: Route histogram batch size, binding: bind:design.work_schedule::RouteBatch}
        BM: {meaning: Expert row block size, binding: bind:design.work_schedule::BM}
        Hist: {meaning: Expert histogram for one route batch, shape: [expert: E], dtype: int32}
        Counts: {meaning: Active route count per expert; zero on clean executions, shape: [expert: E], dtype: int32, retention: keep_value invocation}
        Fill: {meaning: Atomic expert reservation counters, shape: [expert: E], dtype: int32, retention: keep_value invocation}
        Offs: {meaning: Compact expert row prefix, shape: [prefix: E+1], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [prefix: E+1], dtype: int32, retention: keep_value invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [token: T, slot: K], dtype: int32, retention: keep_value invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [route: M], dtype: int32, retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [route: M], dtype: int32, retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [route: M], dtype: int32, retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [row_tile: J], dtype: int32, retention: keep_value invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [row_tile: J], dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        For Clean=0 and (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [route: M, packed_hidden: H/2], dtype: uint8, retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [route: M, hidden_block: H/Block], dtype: fp8_e4m3fn, retention: keep_value invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [chunk: T*Nchunk, byte: 16], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [chunk: T*Nchunk, slot: K, byte: 16], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        For Clean=0:
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: bind:design.work_schedule::BN1}
        BK: {meaning: Reduction channels per staging iteration, binding: bind:design.work_schedule::BK}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [row: BM, column: 2*BN1], dtype: fp32, retention: 'carry_forward (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [route: M, packed_intermediate: I/2], dtype: uint8, retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [route: M, intermediate_block: I/Block], dtype: fp8_e4m3fn, retention: keep_value invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based tanh identity and reciprocal-multiply quantization
          replace the reference evaluation. unknown: no verified uniform error bound for the full declared domain is supplied; source comments and local probes are not an output
          guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation; four such updates make one BK stage. The notation 
          does not assert FP32 products or reference-order bit equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For Clean=0:
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        For valid(j) <= r < BM, X2[r,:] is also
        Decode(ActQ[base(j),:],ActS[base(j),:]); both payload and scale
        use the first valid row of this tile. These padded contractions
        are evaluated and discarded.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: bind:design.work_schedule::BN2}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [row: BM, column: BN2], dtype: fp32, retention: 'carry_forward (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [route: M, hidden: H], dtype: bf16, retention: keep_value invocation}
      arithmetic:
        accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output columns change.
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For Clean=1, Y = ZeroOutput with no further output access.
        For Clean=0:
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol:
        Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward (t,h); k=-1..K-1'}
    ledger:
      baseline: Contract evaluation with decoded FP32 activations, both FC1 outputs and Act materialized before QDQ, and BF16 route results; M denotes its valid-route 
        count on dirty executions.
      matmul:
      - item: Expert contractions
        change: 'For Clean=0: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows'
        by: [fc1_quantize, fc2]
      - item: Clean contractions
        change: 'For Clean=1: eliminate all expert contractions, between 0 and 3*R*H*I MAC per invocation depending on valid routing'
        by: [verify]
      vector:
      - item: Activation and quantization
        change: 'For Clean=0: M*I -> PaddedRows*I channel evaluations, plus O(R+ceil_div(R,RouteBatch)*E+E+J*log2(E)) integer routing work per invocation'
        by: [routing, fc1_quantize]
      footprint:
      - item: Intermediate materialization
        change: 'For Clean=0: 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes remain 2*M*H'
        by: [gather, fc1_quantize, fc2]
      traffic:
      - item: Gather
        change: 'For Clean=0: Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads'
        by: [gather]
      - item: Two verification passes
        change: Add 2*(9*T*H/16 + 4*R + 8*E) bytes read, plus 8*E if clamping is enabled; write 4*T*H output bytes per invocation before any dirty finalize stores; 
          protocol traffic excluded
        by: [verify]
      error:
      - item: Numerical evaluation
        change: 'For Clean=0: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I evaluated channels; fixed FMA route reduction affects
          T*H outputs; uniform output error bound not established'
        by: [fc1_quantize, finalize]
  work_schedule:
    thesis: |
      Submit the independent verifier, then the full pipeline's verifier, the
      unconditional Counts/Fill zeroing service and seven guarded kernels.
      Both verifier submissions remain present for dirty input or unresolved polling,
      and on every execution of an outer graph that recorded the joint request.
      PDL separates launch permission from visible predecessor results; persistent
      GEMM workers retain the dirty path's rings across expert tiles.
      Outside outer capture, the host writes -1 before the first graph, polls its
      pinned mirror and submits the full graph when the final check is not 1.
      This host observation does not establish GPU completion. Outer capture records
      both graphs without polling; its later replay has no host reset or poll action.
      Workspace, verification state and the pinned mirror persist with the ABI. Same-stream ordering
      protects sequential reuse; this path supplies no cross-stream exclusion.
      Every downstream grid reads the second verdict Clean before its data operands.
    flow:
      launch:
      - phase:
        - verify_first
        protocol: pdl
      - {phase: [verify], protocol: pdl, start_after: verify_first.kernel_done}
      - {phase: [count], protocol: pdl, start_after: verify.kernel_done}
      - {phase: [scan], protocol: pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: pdl, start_after: scatter.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Clean: {producer: verify, consumer: [count, scan, scatter, gather, fc1, fc2, finalize], storage: global, ready: verify.kernel_done, wait_at: [count.guard_ready, 
              scan.guard_ready, scatter.guard_ready, gather.guard_ready, fc1.guard_ready, fc2.guard_ready, finalize.guard_ready]}
        ZeroOutput: {producer: verify, consumer: [finalize], storage: global, ready: verify.kernel_done, wait_at: finalize.guard_ready}
        Counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, ready: count.kernel_done}
        Offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        TilePrefix: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileExpert: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileRow: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        RoutePos: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      verify_first:
        describe: 'First independent verification: zero the output and publish the host-decision verdict.'
        decomposition:
          strategy: |
            VerifyBatch=256; VerifyBlocks=min(T,296). This phase evaluates verification
            v=0 in math_reshape.verify. Shard b owns S_b(N) for each flat input/output
            space and traverses those spaces separately in ascending packet order.
            It zeros FirstZeroOutput and forms Dirty(0,b); the last arrival publishes
            FirstClean. The 16-byte device verification workspace is retained with
            the ABI: one verdict word, one dirty-OR word, one arrival counter and one
            unused word. All four start at zero at ABI construction. Each verifier's
            last arrival resets dirty and arrival words; the unused word is untouched.
            The winner also publishes its verdict to the retained 4-byte pinned mirror.
            verify_first and verify share this entire workspace, mirror and caller output;
            no second flag allocation or output snapshot is made. The second verifier
            starts only after verify_first.kernel_done, which covers all first-pass stores,
            contributions and resets even when the host already stopped polling.
            The optional clamp slice is accessed only when it is not None.
          partition:
            b: {size: VerifyBlocks, tile: 1}
          worktile:
            invariant:
              hidden_states: {shape: [element: 4*count(S_b(T*H/8))], dtype: uint8}
              hidden_states_scale: {shape: [element: count(S_b(T*H/16))], dtype: fp8_e4m3fn}
              route_weights: {shape: [element: count(S_b(R))], dtype: fp32}
              gemm1_alpha: {shape: [expert: count(S_b(E))], dtype: fp32}
              gemm1_beta: {shape: [expert: count(S_b(E))], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: count(S_b(E))], dtype: fp32}
          target:
            single_tile:
              Dirty: {shape: [], dtype: int32}
              FirstZeroOutput: {shape: [element: 8*count(S_b(T*H/8))], dtype: bf16}
            tile_reduction: {dimension: b, input: ref:design.math_reshape::Dirty, output: ref:design.math_reshape::FirstClean, method: ref:design.math_reshape::verify}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyBlocks}
        schedule:
          worktile_order:
          - {by: b, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      verify:
        describe: 'Second verification: overwrite the same output and publish the payload-guard verdict.'
        decomposition:
          strategy: |
            Reuse VerifyBatch, VerifyBlocks and flag storage from verify_first,
            and S_b from math_reshape.verify. This separate submission evaluates v=1:
            each shard zeros ZeroOutput and forms Dirty(1,b), then the last arrival
            publishes Clean and resets the dirty-OR and arrival words. It overwrites
            FirstClean in the same device word and pinned mirror, independently of
            what the host observed. No second host reset or poll occurs between these
            two verifiers. Every output element is overwritten without loading the
            first version. Clamp access is conditional on a non-None clamp tensor.
          partition:
            b: {size: VerifyBlocks, tile: 1}
          worktile:
            invariant:
              hidden_states: {shape: [element: 4*count(S_b(T*H/8))], dtype: uint8}
              hidden_states_scale: {shape: [element: count(S_b(T*H/16))], dtype: fp8_e4m3fn}
              route_weights: {shape: [element: count(S_b(R))], dtype: fp32}
              gemm1_alpha: {shape: [expert: count(S_b(E))], dtype: fp32}
              gemm1_beta: {shape: [expert: count(S_b(E))], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: count(S_b(E))], dtype: fp32}
          target:
            single_tile:
              Dirty: {shape: [], dtype: int32}
              ZeroOutput: {shape: [element: 8*count(S_b(T*H/8))], dtype: bf16}
            tile_reduction: {dimension: b, input: ref:design.math_reshape::Dirty, output: ref:design.math_reshape::Clean, method: ref:design.math_reshape::verify}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyBlocks}
        schedule:
          worktile_order:
          - {by: b, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      count:
        describe: Form block histograms and accumulate Counts.
        decomposition:
          strategy: RouteBatch=256. A cudaMemsetAsync service zeros the adjacent E-element Counts and Fill arrays before count starts. Each 256-route worktile forms Hist 
            and atomically adds each nonzero expert count; the memset repeats on every execution. For Clean=1 the assigned work remains present but its data action is a 
            no-op. The zeroing service follows verify.kernel_done and completes before count starts, even for Clean=1; count adds nothing in that case.
          partition:
            route: {size: R, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [route: RouteBatch], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Hist: {shape: [expert: E], dtype: int32}
            tile_reduction: {dimension: route, input: ref:design.math_reshape::Hist, output: ref:design.math_reshape::Counts, method: ref:design.math_reshape::routing}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(R,RouteBatch)'}
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      scan:
        describe: Joint prefix scans followed by tile-map enumeration.
        decomposition:
          strategy: BM = 128. One worktile scans all E counts and per-expert ceil counts, then enumerates J row tiles by binary search of the tile prefixes. For Clean=1 
            the assigned work remains present but its data action is a no-op. Clean=1 leaves all prefix and tile-map storage unchanged; active J=0 comes from the guard, 
            not a stale prefix read.
          partition: {}
          worktile:
            invariant:
              Counts: {shape: [expert: E], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Offs: {shape: [prefix: E+1], dtype: int32}
              TilePrefix: {shape: [prefix: E+1], dtype: int32}
              TileExpert: {shape: [row_tile: J], dtype: int32}
              TileRow: {shape: [row_tile: J], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}
      scatter:
        describe: Recompute batch histograms, reserve expert intervals and publish both route maps.
        decomposition:
          strategy: Hist is recomputed locally, not transferred from count. A block reserves Hist[e] rows by one Fill atomic per nonempty expert and assigns ranks with 
            block-local atomics. Fill's zero initialization is the count-stage memset; different blocks may reserve in any order. Map stores are clipped to actual routes 
            and RoutePos is -1 for invalid routes. For Clean=1 the assigned work remains present but its data action is a no-op. Clean=1 reads neither IDs nor Offs and 
            leaves maps unchanged.
          partition:
            route: {size: R, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [route: RouteBatch], dtype: int32}
              Offs: {shape: [prefix: E+1], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              RoutePos: {shape: [route: RouteBatch], dtype: int32}
              PackedToken: {shape: [route: RouteBatch], dtype: int32}
              PackedSlot: {shape: [route: RouteBatch], dtype: int32}
              PackedExpert: {shape: [route: RouteBatch], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(R,RouteBatch)'}
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk) coordinates, with chunk fastest; a tile can 
            cross token boundaries. All work is empty when M=0. Otherwise chunks whose token has no routes are visited without payload reads or writes; the final packet 
            is clipped. Clean=1 does not read Offs[E] and has no active chunks.
          partition:
            chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}
          worktile:
            invariant:
              SourceChunk: {shape: [chunk: 128, byte: 16], dtype: uint8}
              RoutePos: {shape: [chunk: 128, slot: K], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              GatherChunk: {shape: [chunk: 128, slot: K, byte: 16], dtype: uint8}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'min(1184,ceil_div(T*Nchunk,128))'}
        schedule:
          worktile_order:
          - {by: chunk, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: "BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local iterations and four 64-channel updates per iteration. Valid
            rows are base(j)..base(j)+valid(j); padded arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is read only when
            gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI's row-tile upper bound. Let Cap be the cached automatic grid cap: twice the queried SM
            count, or zero if that query failed. For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap). The submitted grid uses
            G(I/BN1), independent of the current J. Clean=1 reads no tile metadata, leaves its work domain empty and performs no TMEM allocation; submitted grid size is unchanged."
          partition:
            row_tile: {size: J, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
              gemm1_alpha: {shape: [expert: 1], dtype: fp32}
              gemm1_beta: {shape: [expert: 1], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: 1], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              GatherQ: {shape: [row: BM, packed_hidden: BK/2], dtype: uint8, direction: ascending}
              GatherS: {shape: [row: BM, hidden_block: BK/Block], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [column: 2*BN1, packed_hidden: BK/2], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [column: 2*BN1, hidden_block: BK/Block], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [row: BM, packed_intermediate: BN1/2], dtype: uint8}
              ActS: {shape: [row: BM, intermediate_block: BN1/Block], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(I/BN1)}
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only valid(j) output rows are stored. All submitted workers 
            remain present when J=0, but their assigned sequences are empty. Clean=1 reads no tile metadata, leaves its work domain empty and performs no TMEM allocation;
            submitted grid size is unchanged.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [row: BM, packed_intermediate: BK/2], dtype: uint8, direction: ascending}
              ActS: {shape: [row: BM, intermediate_block: BK/Block], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [column: BN2, packed_intermediate: BK/2], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [column: BN2, intermediate_block: BK/Block], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [row: BM, hidden: BN2], dtype: bf16}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: "FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker produces up to 128*FinalWidth consecutive hidden elements
            of one token. Route slots are a local reduction, not independently assigned work; masked routes do not read the route-result slab. For Clean=1 the assigned work
            remains present but its data action is a no-op. ZeroOutput is the prior version of the same output storage: retain it on Clean=1 or overwrite it on Clean=0, without
            loading its bytes."
          partition:
            token: {size: T, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos: {shape: [slot: K], dtype: int32}
              route_weights: {shape: [slot: K], dtype: fp32}
              Clean: {shape: [], dtype: int32}
              ZeroOutput: {shape: [hidden: 128*FinalWidth], dtype: bf16}
            iteration:
              RouteResult: {shape: [slot: 1, hidden: 128*FinalWidth], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [hidden: 128*FinalWidth], dtype: bf16}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |
      Each verifier independently streams zeros and predicate scans, then folds
      last-arrival state into its verdict. Full completion separates their reuse
      of output, device flags and pinned mirror; the host mirror is not a completion
      notification. Downstream guards use only the second verdict. Dirty FC1 keeps
      its separate producers, MMA and four epilogue roles; dirty FC2 keeps four
      cooperative warps and three-slot payload copies. Clean work closes without
      operand or TMEM activity while preserving the submitted kernels' events.
    phase:
      verify_first:
        resource:
          Predicate: {space: register, member_slot_shape: [lane: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor completion and visibility; warp 0 grants dependent-grid launch permission. This trigger does not publish the 
                  verdict or output.
                produce: |-
                  Stream the shard's FirstZeroOutput region with 16-byte zero stores, covering all caller output elements exactly once across shards. Stores may remain in flight until kernel completion.
                compute: |
                  Keep one Predicate accumulator per thread across the separate payload,
                  activation-scale, route-weight and parameter scans. Start each at zero,
                  OR its dirty tests, then perform a CTA-wide OR rendezvous to obtain Dirty(0,b).
                  The optional clamp input is accessed only when enabled.
                fold: |
                  One thread contributes Dirty(0,b) to the global dirty-OR word when nonzero,
                  orders that contribution before its atomic arrival ticket with a device
                  fence, and takes one ticket. The last arrival reads the combined dirty
                  word, writes FirstClean, and resets the dirty word and arrival counter to zero.
                  Other arrivals perform no verdict store. The pinned mirror is nonzero, so
                  the winner executes a system fence then a volatile store of the same
                  verdict. Done means this shard's contribution and any winner tail are
                  finished; it does not imply that other shards' output stores have drained.
                  Only verify_first.kernel_done makes the complete FirstZeroOutput and FirstClean available
                  before the second verifier reuses their storage. State reuse follows same-stream execution ordering,
                  not the early trigger or the host-mirror store.
            pipe:
              prologue: [enter:Protocol]
              steady:
              - produce:FirstZeroOutput
              - compute:Dirty
              - fold:FirstClean
      verify:
        resource:
          Predicate: {space: register, member_slot_shape: [lane: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor completion and visibility; warp 0 grants dependent-grid launch permission. This trigger does not publish the 
                  verdict or output.
                produce: Stream the shard's ZeroOutput region with 16-byte zero stores, covering all caller output elements exactly once across shards. Stores may remain 
                  in flight until kernel completion.
                compute: |
                  Keep one Predicate accumulator per thread across the separate payload,
                  activation-scale, route-weight and parameter scans. Start each at zero,
                  OR its dirty tests, then perform a CTA-wide OR rendezvous to obtain Dirty(1,b).
                  The optional clamp input is accessed only when enabled.
                fold: |
                  One thread contributes Dirty(1,b) to the global dirty-OR word when nonzero,
                  orders that contribution before its atomic arrival ticket with a device
                  fence, and takes one ticket. The last arrival reads the combined dirty
                  word, writes Clean, and resets the dirty word and arrival counter to zero.
                  Other arrivals perform no verdict store. The pinned mirror is nonzero, so
                  the winner executes a system fence then a volatile store of the same
                  verdict. Done means this shard's contribution and any winner tail are
                  finished; it does not imply that other shards' output stores have drained.
                  Only verify.kernel_done makes the complete ZeroOutput and Clean available
                  to downstream guards. State reuse follows same-stream execution ordering,
                  not the early trigger or the host-mirror store.
            pipe:
              prologue: [enter:Protocol]
              steady: [produce:ZeroOutput, compute:Dirty, fold:Clean]
      count:
        resource:
          Hist: {space: SMEM, member_slot_shape: [expert: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: &id001 |
                  All participating threads wait for predecessor completion and visibility;
                  warp 0 then grants dependent-grid launch permission. Perform the guard's
                  additional predecessor wait and read Clean. This entry executes even
                  without payload work. Clean=1 suppresses data actions, not their declared
                  no-op events or the kernel completion; the trigger grants no data readiness.
                produce: 'For Clean=1 this action is a no-op with issue/done events and no data or scratch access. For Clean=0: Zero Hist, synchronize the CTA, histogram valid
                  routes, synchronize, then atomically add nonzero Hist entries into Counts.'
            pipe:
              prologue: [enter:Protocol]
              steady: [produce:Counts]
        milestone:
          guard_ready: [Main/enter:Protocol@done]
      scan:
        resource:
          PrefixScratch: {space: SMEM, member_slot_shape: [element: 386], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: *id001
                produce: 'For Clean=1 this action is a no-op with issue/done events and no data or scratch access. For Clean=0: PrefixScratch holds 257 tile-prefix entries,
                  two 64-word scan arrays and the tile total. Warp-local scans, the scan of warp totals and CTA rendezvous produce both prefixes. After their publication within
                  the CTA, threads enumerate tile IDs by binary search and write Offs, TilePrefix, TileExpert and TileRow. J=0 still writes prefixes.'
            pipe:
              prologue: [enter:Protocol]
              steady: [produce:TilePrefix]
        milestone:
          guard_ready: [Main/enter:Protocol@done]
      scatter:
        resource:
          Reservation: {space: SMEM, member_slot_shape: [table: 3, expert: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: *id001
                produce: 'For Clean=1 this action is a no-op with issue/done events and no data or scratch access. For Clean=0: Reservation contains batch counts, reserved
                  bases and local ranks. Zero counts/ranks, CTA rendezvous, histogram, rendezvous, reserve intervals from Fill, rendezvous, then assign atomic local ranks and
                  write all four maps defined by routing. No thread exits before the last rendezvous; invalid real routes still write RoutePos=-1.'
            pipe:
              prologue: [enter:Protocol]
              steady: [produce:RoutePos]
        milestone:
          guard_ready: [Main/enter:Protocol@done]
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *id001
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries, and loads a 16-byte source only if some route is 
                  valid. Replicate to those destinations; the same registers hold this chunk through all route stores. No inter-thread exchange.
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady: [produce:GatherChunk(t)]
        milestone:
          guard_ready: [Main/enter:Protocol@done]
      fc1:
        domain:
          t: worktile
          i: [0, H/BK]
          g: {flatten: [t, i]}
          c: [0, 2]
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape: [row: BM, byte: BK/2]
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape: [row: 128, byte: BK/2]
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(g): {slot_index: g%3}
          AScale:
            space: SMEM
            member_slot_shape: [row: BM, block: BK/Block]
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(g): {slot_index: g%2}
          BScale:
            space: SMEM
            member_slot_shape: [row: 128, block: BK/Block]
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(g): {slot_index: g%2}
          APrefetch:
            space: register
            member_slot_shape: [row: BM, block: BK/Block]
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              APrefetch(t,i): {slot_index: i%2}
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C1: {part: {column: [0, 128]}}
              ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}
          Fragment: {space: register, member_slot_shape: [row: BM, column: 64], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [row: BM, block: 4], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: &id002 |
                  First perform the guard's predecessor-completion wait and read Clean.
                  For Clean=1, read no tile metadata, allocate nothing and perform no
                  explicit dependent-grid trigger or CTA rendezvous; the kernel's completion
                  supplies launch_ready. Work domains are empty and retire is a no-op.
                  For Clean=0, execute the normal predecessor wait and warp-0 launch trigger.
                  If J=0, allocate nothing and leave work domains empty. Otherwise warp 0
                  initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous before their independent loops, including
                  workers with no assigned item.
                prime: Resolve this worktile's expert and row base. The activation-scale source is GatherS. Load the first stage and, when the local stage count exceeds 
                  one, the second into APrefetch. All BM rows are loaded, redirecting padding scales to the first valid row. Prefetch registers are restarted per 
                  worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility. If a next stage exists in this worktile, load it into 
                  the other register set before the warp rendezvous and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy is 
                  overwritten without use. Done includes this arrival, not completion of the independent payload/weight-scale loads.
                retire: &id003 After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage. For global J=0 this action is
                  a no-op. It does not insert a per-worktile drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady: [publish:AScale(g)]
              epilogue: [retire:TensorStorage]
            waits_for:
              reuse:
                publish:AScale(g+2): [MMA/mma:PayloadA(g)@PayloadB(g)]
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the full-stage transaction count for 32768 payload bytes. 
                  Done covers both payload transfers. Payloads use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared ABI permutation. The lane-permuted 4-byte 
                  asynchronous copies collectively stage 2048 bytes. Done is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint 
                  two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion edge.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: g
              prologue: [enter:Protocol]
              steady: [load:PayloadPair(g), stage:BScale(g)]
              epilogue: [retire:TensorStorage]
            waits_for:
              reuse:
                load:PayloadPair(g+3): [MMA/mma:PayloadA(g)@PayloadB(g)]
                stage:BScale(g+2): [MMA/mma:PayloadA(g)@PayloadB(g)]
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                wait:
                  execution_mode: serial
                  meaning: Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors; q identifies the optional wait before the first 
                    scale copy of a worktile.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM: four scale-copy operations for each operand. Issuance
                  includes submission of all scale copies; only then does this issuer advance to the MMA action. Done is covered by the following cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1. The first update initializes C1 without reading its old 
                  value. The fused 128-column product covers both up and gate. Issue a cumulative completion commit after each stage; done covers scale copies, payload 
                  reads and accumulator updates. The last stage also commits result readiness for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed 
                  ScaleTM before a later scale copy overwrites that scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady:
              - repeat:
                  q: [0, 'min(1,t)*(1-Hoist)']
                steady: ['wait:Drain(t,q)']
              - repeat: g[t]
                steady: [prepare:ScaleTM(g), mma:PayloadA(g)@PayloadB(g)]
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                prepare:ScaleTM(g): [AProducer/publish:AScale(g), BProducer/load:PayloadPair(g), BProducer/stage:BScale(g)]
              reuse:
                wait:Drain(t,q)@done: [Epilogue/release:Accumulator(t-1), Epilogue0/release:Accumulator(t-1), Epilogue1/release:Accumulator(t-1), 
                    Epilogue2/release:Accumulator(t-1)]
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]): [Epilogue/release:Accumulator(t-1), Epilogue0/release:Accumulator(t-1), Epilogue1/release:Accumulator(t-1), 
                    Epilogue2/release:Accumulator(t-1)]
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: *id002
                drain: &id004 Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For c=0 or 1, load the matching 32 up and 32 gate 
                  values into this quadrant's rows of Fragment, issue both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register 
                  fragment usable.
                emit: &id005 Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize ScalePack and retain its first two scale 
                  bytes; c=1 adds the last two, stores the full four-byte scale word on valid rows and resets it. Store valid payload bytes for each c. Done means local 
                  computation and store submission consumed Fragment; global stores can still be in flight. Invalid rows submit no output stores.
                release: &id006 This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases only this warp's accumulator quadrant; MMA reuse 
                  waits for all four epilogue roles. This warp immediately continues its final conversion/store tail without waiting for the other epilogue warps or for 
                  global output-store completion.
                retire: *id003
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', release:Accumulator(t), 'emit:ActQ(t,1)']
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', release:Accumulator(t), 'emit:ActQ(t,1)']
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', release:Accumulator(t), 'emit:ActQ(t,1)']
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', release:Accumulator(t), 'emit:ActQ(t,1)']
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
        milestone:
          guard_ready: [AProducer/enter:Protocol@done, BProducer/enter:Protocol@done, MMA/enter:Protocol@done, Epilogue/enter:Protocol@done, Epilogue0/enter:Protocol@done,
            Epilogue1/enter:Protocol@done, Epilogue2/enter:Protocol@done]
      fc2:
        domain:
          t: worktile
          i: [0, I/BK]
          s: [0, I/BK+2]
          c: [0, BN2/32]
        resource:
          RowIndex: {space: SMEM, member_slot_shape: [row: BM], dtype: int32, slot_count: 1}
          PayloadA:
            space: SMEM
            member_slot_shape: [row: BM, byte: BK/2]
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(t,i): {slot_index: i%3}
          PayloadB:
            space: SMEM
            member_slot_shape: [row: BN2, byte: BK/2]
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(t,i): {slot_index: i%3}
          AScale:
            space: SMEM
            member_slot_shape: [row: BM, block: BK/Block]
            dtype: fp8_e4m3fn
            slot_count: 3
            view:
              AScale(t,i): {slot_index: i%3}
          BScale:
            space: SMEM
            member_slot_shape: [row: BN2, block: BK/Block]
            dtype: fp8_e4m3fn
            slot_count: 3
            view:
              BScale(t,i): {slot_index: i%3}
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C2: {part: {column: [0, 128]}}
              ScaleTM(t,i): {part: {column: [128+32*(i%3), 160+32*(i%3)]}, dtype: uint8}
          Fragment: {space: register, member_slot_shape: [row: BM, column: 32], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: async
              member: warp[0:4]
              verb:
                enter:
                  execution_mode: serial
                  meaning: |
                    First perform the guard's predecessor-completion wait and read Clean.
                    For Clean=1, read no tile metadata, allocate nothing and perform no
                    explicit dependent-grid trigger or CTA rendezvous; the kernel's completion
                    supplies launch_ready. Work domains are empty and retire is a no-op.
                    For Clean=0, execute the normal predecessor wait and warp-0 launch trigger.
                    If J=0, allocate nothing and leave work domains empty. Otherwise warp 0
                    initializes the shared completion protocol and allocates TensorStorage;
                    all four warps rendezvous before the cooperative work loop, including
                    workers with no assigned item.
                resolve:
                  execution_mode: serial
                  meaning: Resolve the expert and compact row base. Populate RowIndex for all BM rows, redirecting padding rows to base(j), then rendezvous the CTA. Both 
                    ActQ payload and ActS scale loads use this map throughout the worktile.
                scale:
                  execution_mode: serial
                  meaning: ScalePair(t,k) loads one 16-byte ActS row and four prepared 4-byte weight-scale words per operand row, then stores their complete AScale and 
                    BScale images in slot k modulo three. Preserve the prepared scale permutation and establish shared-to-async visibility. Done includes these 
                    synchronous loads, shared stores and the proxy fence; acquire supplies CTA-wide publication. No scale-prefetch buffer survives this action. The first 
                    two valid stages are primed; later scales are refilled after the MMA two stages earlier is issued, allowing the scale-load latency to overlap that 
                    MMA.
                stage: CopyGroup(t,s) submits 16-byte asynchronous copies for the complete PayloadA and PayloadB images of stage s into slot s modulo three, and commits 
                  one group. Use RowIndex for ActQ and the prepared weight-row mapping for gemm2_weights. Done covers the payload copies, before acquire's CTA 
                  publication. For s >= I/BK commit an empty group, touching no operand slot; its issue and done events still exist. Two prime groups and one group per 
                  local iteration preserve the two-group lookahead, including the short I/BK=1 case.
                wait:
                  execution_mode: serial
                  meaning: Previous(t,i,q) collectively waits for its explicit MMA predecessor and rendezvous the CTA before refilling a previously consumed slot. q 
                    identifies the occurrence for noninitial local stages; the first stage has none.
                acquire:
                  execution_mode: serial
                  meaning: Wait for the current payload-copy group, leaving at most two newer groups outstanding. Rendezvous the CTA and establish shared-to-async 
                    visibility for its payloads and synchronously staged scales. Done makes all four operand images readable. No tensor-box transaction wait is used.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: The elected warp-0 issuer copies both scale images into ScaleTM with four scale copies per operand, then issues four ordered 64-channel 
                    block-scaled updates of C2 and one cumulative completion commit. The first update initializes C2 without reading its old value. Done covers scale 
                    copies, operand reads and accumulator updates; same-issuer ordering makes each scale image available before its consuming update.
                drain:
                  execution_mode: serial
                  meaning: Before c=0, wait for the final MMA commit and rendezvous the CTA. Each warp owns its TMEM quadrant, one row per lane. Load the next 32 columns 
                    into Fragment and wait for all those TMEM reads to retire, including padding rows.
                emit:
                  execution_mode: serial
                  meaning: Convert Fragment to BF16 and directly store valid rows to RouteResult. Done consumes Fragment and submits the stores; kernel completion 
                    supplies global visibility. Padding rows produce no stores. There is no shared output sink.
                close:
                  execution_mode: serial
                  meaning: Rendezvous all four warps after their last drain and direct store submission, before the next worktile resolves or primes. All data-bearing 
                    operand copies have been consumed; trailing empty groups may remain until later copy-group waits. Restart payload and scale slot indices at zero for 
                    the next worktile, while carrying MMA completion parity across worktiles.
                retire:
                  execution_mode: serial
                  meaning: After the assigned sequence, warp 0 deallocates TensorStorage. For global J=0 this is a no-op. Prior drain and close actions have finished all 
                    TMEM reads; ordinary global stores finish with the kernel, without a bulk-store drain.
            pipe:
              repeat: t
              prologue: [enter:Protocol]
              steady:
              - resolve:RowIndex(t)
              - repeat:
                  p: [0, 2]
                steady:
                - repeat:
                    a: ['min(p,I/BK)', 'min(p+1,I/BK)']
                  steady: ['scale:ScalePair(t,a)']
                - stage:CopyGroup(t,p)
              - repeat: i
                steady:
                - repeat:
                    q: [0, 'min(1,i)']
                  steady: ['wait:Previous(t,i,q)']
                - stage:CopyGroup(t,i+2)
                - acquire:Operands(t,i)
                - mma:PayloadA(t,i)@PayloadB(t,i)
                - repeat:
                    b: ['min(i+2,I/BK)', 'min(i+3,I/BK)']
                  steady: ['scale:ScalePair(t,b)']
              - repeat: c
                steady: ['drain:Fragment(t,c)', 'emit:RouteResult(t,c)']
              - close:Worktile(t)
              epilogue: [retire:TensorStorage]
            waits_for:
              data:
                acquire:Operands(t,i): ['stage:CopyGroup(t,i)', 'scale:ScalePair(t,i)']
                drain:Fragment(t,0): ['mma:PayloadA(t,last(i))@PayloadB(t,last(i))']
              reuse:
                wait:Previous(t,i,q)@done: ['mma:PayloadA(t,i-1)@PayloadB(t,i-1)']
        milestone:
          guard_ready: [Main/enter:Protocol@done]
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [hidden: 128*FinalWidth], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *id001
                produce: "For Clean=1 this action is a no-op with issue/done events and no data or scratch access. For Clean=0: Each thread owns FinalWidth independent output
                  elements. Hoist its eight route indices and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order using finalize's
                  FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier is required. Empty routing still writes zeros."
            pipe:
              prologue: [enter:Protocol]
              steady: [produce:Y]
        milestone:
          guard_ready: [Main/enter:Protocol@done]
realization:
  require:
  - item: [design.tile_pipeline::fc1.MMA, design.tile_pipeline::fc2.Main]
    choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale copies, with cumulative tcgen05.commit completion and 
      tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: Scale visibility and operand-slot reuse depend on ordered scale reads and cumulative MMA completion.
  - item: [design.tile_pipeline::fc1, design.tile_pipeline::fc2.Main]
    choice: Use tcgen05.ld with tcgen05.wait::ld before releasing or reusing an accumulator quadrant, using the issuing warp's hardware quadrant.
    reason: The register fragment must be materialized and all TMEM reads retired before accumulator overwrite or deallocation.
  - item: design.tile_pipeline::fc2.Main
    choice: Use cp.async.cg 16-byte payload copies with one commit group per CopyGroup and cp.async.wait_group 2 at acquire, preserving empty commits. Publish generic 
      shared scale stores with fence.proxy.async.shared::cta and the specified CTA rendezvous.
    reason: Payload completion and generic-to-async scale visibility use distinct guarantees; empty commits preserve which payload group the wait retires.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents protocol for eager and recorded work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item:
    - design.tile_pipeline::verify_first.Main
    - design.tile_pipeline::verify.Main
    choice: Use a CTA-wide predicate OR, device atomicOr/atomicAdd and a device fence before each arrival; use a system fence before the volatile pinned-host verdict 
      store.
    reason: The last-arrival fold requires every dirty contribution to precede its ticket, and the host mirror uses a separate visibility scope.
