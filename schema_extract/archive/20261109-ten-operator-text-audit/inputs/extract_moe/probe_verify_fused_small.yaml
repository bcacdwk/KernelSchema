meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: probe_verify_fused_small
    parent: verify_fused_small
    when: |
      Let R=T*K. Rebuild means Model.forward reaches ABI construction after
      both its identity hot entry and full-key cache miss, including a miss
      delegated by the default C wrapper. Let a be the resulting MoEABI;
      cfg/cfg2 select FC1/FC2, small_thresh is its saved routing threshold,
      and zflag/zflag_host bind device verification state and its optional
      pinned host mirror. All implementation controls follow the frozen
      default implementation scope.
      Select exactly when the call rebuilds a, ensure_tables returns through
      the already-ready device entry without submitting table initialization,
      moe_zero_probe
      actually submits one k_zero_scan and returns 1 (zero_ok=true),
      a.cfg=97, a.cfg2=81, R<=a.small_thresh, and moe_run returns zero through
      one caller-stream run_pipeline or graph_replay's ordinary full-graph
      arm, with no verify-only graph launched in this request.
      Any private-stream run_pipeline call is capture-only after a successful
      BeginCapture; no additional uncaptured pipeline runs on that stream.
      Include the scan, its host readback and construction services before
      the six-kernel execution; successful inner recording creates no extra
      computation or completion event before its replay.
      The threshold is 3000 for nonempty construction-time routing when
      3000<R<=6500, otherwise 6500. The lazily evaluated route_hist counts
      current IDs in [0,E) after a host copy, at most once during construction,
      and supplies the automatic FC2, empty-routing and threshold decisions.
      The workspace can be an existing shape/configuration entry or newly
      allocated. This accepted probe creates fresh zeroed device verification
      state and, exactly when T*H>=2^20, a pinned host mirror initialized to -1.
      Probe acceptance is a construction-time fact, not a prediction of Clean:
      verification and the subsequent kernels read current device contents.
      Recorded kernels retain their scalar values and tensor bindings; their
      later device reads use execution-time contents.
design:
  math_reshape:
    thesis: >-
      Scan construction-time eligibility, including both weight-scale tensors,
      and retain the verdict for the host decision. Recheck current zero payload and finite dynamic parameters, writing zero output
      before publishing a clean verdict. On dirty input, compact valid routes by expert
      and preserve packed block-scaled operands through both contractions. Fuse FC1, approximate gated activation and requantization,
      eliminating full FC1 and FP32 activation materialization at the cost of a
      gathered input copy, full padded row arithmetic and changed activation rounding.
      Clean verification avoids those computations; dirty verification adds a full
      scan and an output write before the ordinary result overwrites it.
    rewrite:
      - step: probe
        name: Scan ABI-construction eligibility without writing the output
        math: |
          R=T*K. ProbeGroups, ProbeRows and ProbeOwned are bound by work_schedule.
          Use tensor contents read by this construction-time scan. For each
          group v in [0,ProbeGroups), ProbeDirtyGroup(v) is int32(1) if any
          predicate below holds, otherwise int32(0):
          a hidden_states byte b in a row t in ProbeRows(v) has
          (b bitwise_and 0x77)!=0; a hidden_states_scale byte b in such a row
          has (b bitwise_and 0x7f)=0x7f;
          flattened route_weights[i] is nonfinite for i in ProbeOwned(v,R);
          gemm1_alpha[e] or gemm1_beta[e] is nonfinite for e in ProbeOwned(v,E),
          or an enabled gemm1_clamp_limit[e] is nonfinite;
          a scale byte b among the four bytes of a word i in
          ProbeOwned(v,2*E*I*H/(4*Block)) of gemm1_weights_scale, or in
          ProbeOwned(v,E*H*I/(4*Block)) of gemm2_weights_scale, has
          (b bitwise_and 0x7f)=0x7f. Weight scales are scanned in physical
          flat order; no permutation is needed for this predicate.
          ProbeDirty starts at int32(0). Each group with ProbeDirtyGroup(v)=1
          sets it to int32(1); clean groups leave it unchanged. After all
          groups, ProbeDirty=max_v ProbeDirtyGroup(v). The host reads this
          scalar for its acceptance decision. No output, route map or expert
          intermediate is produced here; execution-time verification below
          independently defines Clean from the values it reads then.
        symbol:
          ProbeGroups: {meaning: Number of eligibility-scan groups, binding: "bind:design.work_schedule::ProbeGroups"}
          ProbeRows: {meaning: Token rows owned by one eligibility-scan group, binding: "bind:design.work_schedule::ProbeRows"}
          ProbeOwned: {meaning: Flat scalar or word indices owned by one eligibility-scan group, binding: "bind:design.work_schedule::ProbeOwned"}
          ProbeDirtyGroup: {meaning: Dirty contribution from one eligibility-scan group, shape: [], dtype: int32}
          ProbeDirty: {meaning: Construction-time dirty result retained through the host readback, shape: [], dtype: int32, retention: "keep_value invocation"}
      - step: verify
        name: Recheck current input and materialize the provisional zero output
        math: |
          VerifyGroups and the index map Owned are bound by work_schedule.
          For each verification group v in [0,VerifyGroups),
          flatten each input below in row-major order. DirtyGroup(v) is int32(1)
          if any of the following predicates holds, and int32(0) otherwise:
          a payload byte b among the four bytes of a word i in Owned(v,T*H/8)
          has (b bitwise_and 0x77) != 0;
          a scale byte b at i in Owned(v,T*H/Block) has
          (b bitwise_and 0x7f) = 0x7f;
          route_weights[i] is nonfinite for i in Owned(v,R);
          gemm1_alpha[e] or gemm1_beta[e] is nonfinite for e in Owned(v,E);
          or, when gemm1_clamp_limit is not None, gemm1_clamp_limit[e] is nonfinite.
          Independently of DirtyGroup, write ZeroOutput[t,h] = bf16(0) for
          all (t,h). ZeroPacket[i,a] is its flattened view at element 8*i+a,
          0 <= i < T*H/8 and 0 <= a < 8; group v writes Owned(v,T*H/8).
          Clean = int32(1 - max_v DirtyGroup(v)).
          ZeroOutput is the initial version written into the caller's output,
          not a separate buffer. Clean=1 retains it as Y; Clean=0 replaces it
          through routing, gather, fc1_quantize, fc2 and finalize below.
          Only those dirty computations produce routing or intermediate values;
          on clean execution their existing scratch bytes are untouched and unread.
          Weight payloads, weight scales and route_ids are not scanned here.
        symbol:
          VerifyGroups: {meaning: Number of verification groups, binding: "bind:design.work_schedule::VerifyGroups"}
          Owned: {meaning: Flat indices assigned to one verification group, binding: "bind:design.work_schedule::Owned"}
          DirtyGroup: {meaning: Dirty predicate contribution of one verification group, shape: [], dtype: int32}
          Clean: {meaning: Current device verification verdict consumed by every later kernel, shape: [], dtype: int32, retention: "keep_value invocation"}
          ZeroOutput: {meaning: Provisional BF16 zero version of the caller output, shape: [token: T, hidden: H], dtype: bf16, retention: "keep_value invocation"}
          ZeroPacket: {meaning: Eight-element flat view of ZeroOutput with no separate storage, shape: [packet: "T*H/8", hidden: 8], dtype: bf16}
      - step: routing
        name: Compact routes and enumerate expert row blocks
        math: |
          Only when Clean=0, let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
          For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
          [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
          Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
          Offs[0] = TilePrefix[0] = 0;
          Offs[e+1] = Offs[e] + Counts[e];
          TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
          For each group g and expert e, the local reservation cursor starts at
          sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
          by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
          Thus groups occupy disjoint expert intervals in ascending group order,
          while ranks within a group follow atomic arrival order. rho is a bijection
          from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
          RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
          PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
          PackedExpert[rho(t,k)] = route_ids[t,k].
          For TilePrefix[e] <= j < TilePrefix[e+1],
          TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
          Define base(j) = Offs[TileExpert[j]] + TileRow[j],
          valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
          Only the used prefixes of the packed arrays and tile arrays are written.
        symbol:
          RouteGroups: {meaning: Number of contiguous routing groups, binding: "bind:design.work_schedule::RouteGroups"}
          RouteBatch: {meaning: Contiguous slots per routing group, binding: "bind:design.work_schedule::RouteBatch"}
          BM: {meaning: Expert row block size, binding: "bind:design.work_schedule::BM"}
          Hist: {meaning: Expert histogram for one route batch, shape: [expert: E], dtype: int32}
          Counts: {meaning: Current route count per expert, shape: [expert: E], dtype: int32, retention: "keep_value invocation"}
          Offs: {meaning: Compact expert row prefix, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          TilePrefix: {meaning: Prefix of expert row blocks, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [token: T, slot: K], dtype: int32, retention: "keep_value invocation"}
          PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          TileExpert: {meaning: Expert for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
          TileRow: {meaning: Expert-local row origin for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
      - step: gather
        name: Replicate packed input into compact route order
        math: |
          Nchunk = 9*H/256. Only when Clean=0, for (t,k) in V,
          GatherQ[rho(t,k),:] = hidden_states[t,:] and
          GatherS[rho(t,k),:] = hidden_states_scale[t,:].
          Each token with at least one valid route supplies one logical input
          payload/scale copy, replicated to its valid routes. Let U be the count
          of such tokens. Unused rows of the R-row backing buffers retain old bytes.
          For f = t*Nchunk+c, SourceChunk[f,:] denotes the
          c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
          of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
          chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
          These chunk names are views of the same copies, with no additional storage.
          Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
          definitions; these decoded operands are mathematical views, not saved arrays.
        symbol:
          GatherQ: {meaning: Gathered packed input payload, shape: [route: M, packed_hidden: "H/2"], dtype: uint8, retention: "keep_value invocation"}
          GatherS: {meaning: Gathered input block scales, shape: [route: M, hidden_block: "H/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
          SourceChunk: {meaning: Byte view used by the flat gather, shape: [chunk: "T*Nchunk", byte: 16], dtype: uint8}
          GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [chunk: "T*Nchunk", slot: K, byte: 16], dtype: uint8}
      - step: fc1_quantize
        name: Joint up and gate contraction with fused approximate activation
        math: |
          BN1 and BK are bound by work_schedule. Only when Clean=0,
          for each (j,n), n in [0,I/BN1),
          form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
          W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
          C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
          B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
          B1 is the concatenation of those up and gate groups; X1's valid row r
          is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
          contracted: their payload comes from consecutive backing-buffer rows
          base(j)+r, while their scale row is redirected to base(j).
          Payload outside the R-row domain is zero-filled; unused in-bounds
          backing bytes remain unspecified, not zeroed.
          For each row and intermediate channel, take u,v from the final C1
          up/gate columns and apply Contract's asymmetric clamp when enabled.
          Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
          ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
          Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
          For activation_type = 3, z = gemm1_alpha[e]*L and
          a = (v*S(v,z))*(u+gemm1_beta[e]).
          For type 10, zg = ia*(2*L), zu = ib*(2*L),
          g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
          w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
          The unused beta reciprocal for type 3 does not enter a.
          For each 16-channel block, peak = max(abs(a)),
          s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
          zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
          Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
          channel into the low nibble. Save those bytes as ActQ and s as ActS,
          only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
          multiplication and code conversion; they decode to zero scale.
          Padding rows also execute activation and quantization but are discarded.
          C1 and activated FP32 values are consumed locally, not globally materialized.
        symbol:
          BN1: {meaning: FC1 intermediate columns per worktile, binding: "bind:design.work_schedule::BN1"}
          BK: {meaning: Reduction channels per staging iteration, binding: "bind:design.work_schedule::BK"}
          C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [row: BM, column: "2*BN1"], dtype: fp32, retention: "carry_forward (j,n); l=-1..H/64-1"}
          ActQ: {meaning: Packed quantized intermediate payload, shape: [route: M, packed_intermediate: "I/2"], dtype: uint8, retention: "keep_value invocation"}
          ActS: {meaning: Intermediate quantization scales, shape: [route: M, intermediate_block: "I/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
        arithmetic:
          approx: >-
            exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32.
            Folded sigmoid arguments, the sigmoid-based tanh identity and
            reciprocal-multiply quantization replace the reference evaluation.
            unknown: no verified uniform error bound for the full declared domain
            is supplied; source comments and local probes are not an output guarantee.
          accumulate: >-
            Each 64-channel contraction uses native E2M1 inputs and E4M3 block
            scales with FP32 accumulation; four such updates make one BK stage.
            The notation does not assert FP32 products or reference-order bit equality.
      - step: fc2
        name: Packed intermediate contraction and route materialization
        math: |
          Only when Clean=0, for each row tile j and BN2-column group n in [0,H/BN2),
          X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
          B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
          C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
          B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
          Padded rows use the same payload/scale-row rule as fc1_quantize,
          now with the ActQ/ActS backing buffers, and are discarded after contraction.
          Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
          for r < valid(j). Unused route-result rows retain old contents.
        symbol:
          BN2: {meaning: FC2 output columns per worktile, binding: "bind:design.work_schedule::BN2"}
          C2: {meaning: Accumulator of one FC2 worktile, shape: [row: BM, column: BN2], dtype: fp32, retention: "carry_forward (j,n); l=-1..I/64-1"}
          RouteResult: {meaning: BF16 result for each valid compact route, shape: [route: M, hidden: H], dtype: bf16, retention: "keep_value invocation"}
        arithmetic:
          accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output columns change.
      - step: finalize
        name: Fixed route-order fused accumulation into caller output
        math: |
          For Clean=1, Y[t,h] = ZeroOutput[t,h] with no further output write.
          For Clean=0 and every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
          Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
          otherwise Z(k) = Z(k-1), without reading RouteResult.
          Y[t,h] = bf16(Z(K-1)), overwriting the provisional zero version.
          In either case return the existing one-element list alias of the
          caller output as required by Contract.
        symbol:
          Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: "carry_forward (t,h); k=-1..K-1"}
    ledger:
      baseline: >-
        Contract evaluation for each valid route, saving decoded FP32 activations,
        both FC1 outputs and Act before QDQ; save the same BF16 route results.
      matmul:
        - {item: Clean expert contractions, change: "When Clean=1, up to 3*R*H*I route MAC per invocation -> 0; activation, QDQ and final route FMA evaluation are also skipped", by: [verify]}
        - {item: Expert contractions, change: "When Clean=0, 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows", by: [fc1_quantize, fc2]}
      vector:
        - {item: Activation and quantization, change: "When Clean=0, M*I -> PaddedRows*I channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E)) integer routing work per invocation", by: [routing, fc1_quantize]}
      footprint:
        - {item: Intermediate materialization, change: "When Clean=0, 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes remain 2*M*H", by: [gather, fc1_quantize, fc2]}
      traffic:
        - {item: Construction scan, change: "Add 9*T*H/16+4*R+8*E+3*E*H*I/Block input bytes read, plus 4*E if clamping is enabled, per ABI construction; materialize one 4-byte ProbeDirty result for host readback", by: [probe]}
        - {item: Verification, change: "Add 9*T*H/16+4*R+8*E logical input bytes read, plus 4*E if clamping is enabled, and 2*T*H output bytes written per invocation; dirty execution writes the final output again", by: [verify]}
        - {item: Gather, change: "When Clean=0, Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads", by: [gather]}
      error:
        - {item: Numerical evaluation, change: "When Clean=0, Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established", by: [fc1_quantize, finalize]}
  work_schedule:
    thesis: >-
      Execute one ordinary eligibility-scan kernel, then six computational kernels
      through eager submission or full-graph replay: verification followed by five
      guarded kernels. Before the scan, an optional lazy route_hist service copies
      4*R ID bytes to the host and counts valid IDs for automatic dispatch. The
      already-ready table entry adds no table kernel. Allocate one global int32
      ProbeDirty and initialize it to zero on the caller stream before scan.
      After probe.kernel_done, synchronize that stream, read the four-byte result
      into a host scalar initially set to 1, free the temporary, and accept only
      the helper return value 1. The source does not check the copy's return code.
      Next initialize the fresh global int32[4] VerifyState to zero. On a workspace
      cache miss, create the backing buffers and zero the adjacent Counts/Fill
      allocation (2*E int32); a hit retains its existing bytes. Fill is unused by
      this small preparation. Offs and TilePrefix have E+1 entries, four packed
      maps have R entries each, and two tile maps have TileCap entries each.
      GatherQ/GatherS share a 9*R*H/16-byte slab; the packed ActQ/ActS views occupy
      9*R*I/16 bytes of a 2*R*I-byte allocation; RouteResult has 2*R*H bytes.
      No initialization of these empty-allocated slabs is implied. At T*H>=2^20,
      allocate the pinned mirror and set it to -1 before binding it to a.
      Construct the ABI and call moe_run; its launcher prepares any needed tensor
      maps and launch attributes before the affected submissions. Allocation,
      initialization and copies are service operations; flow enumerates the
      operator's computational kernels. The published cache keeps the ABI, input
      bindings, workspace and verification tensors alive for later reuse.
      Caller-stream ordering places VerifyState initialization before verification.
      Successful private-stream capture records work only; actual graph replay
      is on the caller stream. The scan is an actual completed prefix, not part
      of the recorded six-kernel graph. All six
      submissions and their completion events exist on clean and dirty execution.
      Clean=1 makes each later computational work set empty without reading stale
      routing metadata; the device guard remains part of every submitted worker. One CTA prepares all routing metadata using shared group
      histograms and prefixes, replacing separate count, scan and scatter grids
      and their device memset. Flat gather exposes broad parallelism;
      statically strided persistent GEMM workers amortize setup and retain rings across
      expert tiles. PDL grants early launch, while consumers still wait for predecessor
      completion before reading its results.
      Global workspace persists across requests and graph replays; its R-row packed
      operand and route-result views retain unwritten bytes. Same-stream ordering
      orders their reuse; after the probe readback this path adds no cross-stream
      exclusion or host wait for the six-kernel computation.
      The ABI's global int32[4] VerifyState contains the Clean verdict, a dirty-OR
      word, an arrival count and an unused word. The two aggregation words begin
      at zero from this ABI construction; the last arriving verifier resets
      them before completing this invocation.
      Clean remains readable until all five guarded kernels finish. A bound pinned
      int32 host mirror receives the verdict, but this path does not wait on it.
    flow:
      launch:
        - {phase: [probe]}
        - {phase: [verify], protocol: pdl, start_after: probe.kernel_done}
        - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
        - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
        - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
        - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
        - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Clean:
          producer: verify
          consumer: [prepare, gather, fc1, fc2, finalize]
          storage: global
          ready: verify.kernel_done
          wait_at: [prepare.verified, gather.verified, fc1.verified, fc2.verified, finalize.verified]
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      probe:
        describe: Scan construction-time zero eligibility, including all weight scales.
        decomposition:
          strategy: >-
            ProbeGroups=296 and ProbeWidth=256. For scan_group coordinate v,
            ProbeRows(v)={t in integers | 0<=t<T and t mod ProbeGroups=v}.
            ProbeOwned(v,L)={i in integers | 0<=i<L and
            floor(i/ProbeWidth) mod ProbeGroups=v}. Payload and input scales
            traverse whole token rows with stride ProbeGroups; scores and expert
            parameters use independent flat grid strides. Each weight-scale pass
            visits four-byte words with the same flat stride. All 296 workers
            participate, including groups with no token rows. One CTA reduces
            its predicates to ProbeDirtyGroup, and an elected participant writes
            1 to the initially zero global ProbeDirty only for a dirty group.
            Final ProbeDirty is ready for the host only after the whole grid.
          partition: {scan_group: {size: ProbeGroups, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [token: 1, packed_hidden: "H/2"], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [token: 1, hidden_block: "H/Block"], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [slot: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_weights_scale: {shape: [scale: "4*ProbeWidth"], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights_scale: {shape: [scale: "4*ProbeWidth"], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {ProbeDirtyGroup: {shape: [], dtype: int32}}
            tile_reduction:
              dimension: scan_group
              input: "design.math_reshape::ProbeDirtyGroup"
              output: "design.math_reshape::ProbeDirty"
              method: "design.math_reshape::probe"
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: ProbeGroups}
        schedule:
          worktile_order: [{by: scan_group, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      verify:
        describe: Zero all output packets and reduce current-input dirty predicates to Clean.
        decomposition:
          strategy: >-
            VerifyGroups=min(T,296) and VerifyWidth=256. Let v be the verification_group
            coordinate. Owned(v,L) = {i in integers | 0 <= i < L and
            floor(i/VerifyWidth) mod VerifyGroups = v}; apply it independently to
            each flattened input and output index space of verify.
            Its local grid-stride traversal uses VerifyWidth-wide packets separated
            by VerifyGroups*VerifyWidth, clipped at each tensor's end. The payload,
            scale, route-weight and expert-parameter traversals are separate loops;
            alpha, beta and any enabled clamp share the expert traversal. One worktile
            writes its ZeroPacket subset and contributes one DirtyGroup. Each worker
            atomically contributes to the global dirty OR and then takes an arrival
            ticket; the last arrival produces Clean and resets the aggregation words.
          partition: {verification_group: {size: VerifyGroups, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [packed_hidden: "4*VerifyWidth"], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [hidden_block: VerifyWidth], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [slot: VerifyWidth], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [expert: VerifyWidth], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [expert: VerifyWidth], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [expert: VerifyWidth], dtype: fp32, direction: ascending}
          target:
            single_tile:
              ZeroPacket: {shape: [packet: "count(Owned(v,T*H/8))", hidden: 8], dtype: bf16}
              DirtyGroup: {shape: [], dtype: int32}
            tile_reduction:
              dimension: verification_group
              input: "design.math_reshape::DirtyGroup"
              output: "design.math_reshape::Clean"
              method: "design.math_reshape::verify"
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyGroups}
        schedule:
          worktile_order: [{by: verification_group, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: >-
            This work exists only for Clean=0. BM=128, RouteGroups=32 and
            RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32).
            Groups cover contiguous, clipped ranges of flattened route slots;
            these are local subdivisions of one worktile, not independent work.
            Stage all IDs once, form group histograms and their exclusive expert
            bases, scan expert counts and tile counts, then assign local atomic
            ranks and enumerate J tiles by binary search of TilePrefix.
            This worktile writes all Counts, both E+1 prefixes and every RoutePos;
            packed maps and tile maps write only their used prefixes. No separate
            count initialization or global reservation-counter update is needed.
          partition: {request: {size: "1-Clean", tile: 1}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              route_ids: {shape: [token: T, slot: K], dtype: int32}
          target:
            single_tile:
              Counts: {shape: [expert: E], dtype: int32}
              Offs: {shape: [prefix: "E+1"], dtype: int32}
              TilePrefix: {shape: [prefix: "E+1"], dtype: int32}
              RoutePos: {shape: [token: T, slot: K], dtype: int32}
              PackedToken: {shape: [route: M], dtype: int32}
              PackedSlot: {shape: [route: M], dtype: int32}
              PackedExpert: {shape: [route: M], dtype: int32}
              TileExpert: {shape: [row_tile: J], dtype: int32}
              TileRow: {shape: [row_tile: J], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worktile_order: [{by: request, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: >-
            GatherChunks=0 when Clean=1, otherwise T*Nchunk*min(1,M).
            Read Offs[E] only after a dirty guard to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk) coordinates,
            with chunk fastest; a tile can cross token boundaries. All work is empty
            when M=0. Otherwise chunks whose token has no routes are visited without
            payload reads or writes; the final packet is clipped.
          partition: {chunk: {size: GatherChunks, tile: 128}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              SourceChunk: {shape: [chunk: 128, byte: 16], dtype: uint8}
              RoutePos: {shape: [chunk: 128, slot: K], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
          target:
            single_tile: {GatherChunk: {shape: [chunk: 128, slot: K, byte: 16], dtype: uint8}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "min(1184,ceil_div(T*Nchunk,128))"}
        schedule:
          worktile_order: [{by: chunk, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: >-
            ActiveTiles=0 when Clean=1, otherwise J; the clean guard reads no J.
            BN1=64, BK=256; each row tile and intermediate column group is one
            worktile, with H/BK local iterations and four 64-channel updates per
            iteration. Valid rows are base(j)..base(j)+valid(j); padded arithmetic
            follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is
            read only when gemm1_clamp_limit is not None.
            TileCap=ceil_div(R,BM)+min(E,R) is the ABI's row-tile upper bound.
            Let Cap be the cached automatic grid cap: twice the queried SM count,
            or zero if that query failed. For Nx column groups define
            G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            The submitted grid uses G(I/BN1), independent of the current J.
          partition: {row_tile: {size: ActiveTiles, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
              gemm1_alpha: {shape: [expert: 1], dtype: fp32}
              gemm1_beta: {shape: [expert: 1], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: 1], dtype: fp32}
            iteration:
              GatherQ: {shape: [row: BM, packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              GatherS: {shape: [row: BM, hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [column: "2*BN1", packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [column: "2*BN1", hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [row: BM, packed_intermediate: "BN1/2"], dtype: uint8}
              ActS: {shape: [row: BM, intermediate_block: "BN1/Block"], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(I/BN1)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: >-
            BN2=128; reuse BM, BK, ActiveTiles, TileCap and G from fc1. Each worktile traverses
            I/BK local stages. Only valid(j) output rows are stored. All submitted
            workers remain present when J=0, but their assigned sequences are empty.
          partition: {row_tile: {size: ActiveTiles, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
            iteration:
              ActQ: {shape: [row: BM, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              ActS: {shape: [row: BM, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [column: BN2, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [column: BN2, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {RouteResult: {shape: [row: BM, hidden: BN2], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(H/BN2)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: >-
            FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range.
            One worker produces up to 128*FinalWidth consecutive hidden elements of one token.
            Route slots are a local reduction, not independently assigned work;
            masked routes do not read the route-result slab.
          partition: {token: {size: "T*(1-Clean)", tile: 1}, hidden: {size: H, tile: "128*FinalWidth"}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              RoutePos: {shape: [slot: K], dtype: int32}
              route_weights: {shape: [slot: K], dtype: fp32}
            iteration:
              RouteResult: {shape: [slot: 1, hidden: "128*FinalWidth"], dtype: bf16, direction: ascending}
          target: {single_tile: {Y: {shape: [hidden: "128*FinalWidth"], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "T*ceil_div(H,128*FinalWidth)"}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: >-
      The eligibility scan reduces per-participant predicates within each CTA,
      publishing only dirty contributions to its initialized scalar. Verification
      cooperatively scans independent flat tensor ranges and uses a
      last-arrival OR fold. Later workers read Clean only after full predecessor
      completion; empty clean work domains leave entry and terminal no-op events
      present. Prepare dirty routing with one cooperative CTA and shared in-place histogram/rank
      storage. Separate activation-scale staging, payload/weight-scale staging, MMA issue
      and four-warp epilogues. Three payload slots and two scale slots cross work
      boundaries; early accumulator release overlaps the next contraction with
      the previous conversion/store tail. FC2 separately tracks shared-source
      reuse and global completion of its bulk output stores.
    phase:
      probe:
        resource:
          DirtyBits: {space: register, member_slot_shape: [element: ProbeWidth], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                compute: >-
                  Initialize DirtyBits, scan the worktile's payload and input-scale
                  rows, then the separate score and expert-parameter loops, and
                  finally both weight-scale word spaces. Each participant retains
                  its predicate bits across these loops; a CTA-wide OR produces
                  ProbeDirtyGroup. An absent clamp is never dereferenced. Done
                  covers all reads and the block reduction. No output is written.
                publish: >-
                  One elected participant writes 1 to global ProbeDirty only when
                  this group's predicate is dirty. Otherwise this action is a
                  no-op with a completion event. The source uses an ordinary
                  same-value store; this is not an atomic arrival or grid barrier.
                  Done covers this group's contribution, not the whole reduction.
                  The grid completion and subsequent stream synchronization precede
                  the host readback and release of the temporary scalar.
            pipe: {steady: ["compute:ProbeDirtyGroup", "publish:ProbeDirty"]}
      verify:
        resource:
          DirtyBits: {space: register, member_slot_shape: [element: VerifyWidth], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                enter: >-
                  Wait for the preceding grid's completion and visibility, then warp 0
                  grants dependent launch permission without promising Clean or output readiness.
                produce: >-
                  Verification combines this worktile's ZeroPacket stores and
                  DirtyGroup calculation. Initialize each participant's DirtyBits,
                  then each participant issues its zero stores and scans its strided
                  payload words, scale bytes, route weights and expert parameters.
                  A CTA-wide OR predicate reduction produces DirtyGroup after these
                  traversals. The clamp is read only when present; route_ids and
                  weight tensors are not read. Done covers the predicate reduction
                  and store submission; output visibility is supplied by kernel_done.
                publish: >-
                  One elected thread contributes a dirty bit to VerifyState when
                  needed, establishes device visibility and atomically takes an
                  arrival ticket. The last arriving CTA reads the aggregate, writes
                  Clean and resets both aggregation words. If a host mirror is bound,
                  it then uses system visibility before writing the same verdict there.
                  Other CTAs do not write Clean or the mirror. Done covers this CTA's
                  contribution; Clean and all ZeroPacket writes become externally
                  usable at verify.kernel_done. The unused VerifyState word is unchanged.
            pipe:
              prologue: ["enter:Protocol"]
              steady: ["produce:Verification", "publish:Clean"]
      prepare:
        domain: {t: worktile}
        milestone: {verified: ["Main/enter:Protocol"]}
        resource:
          StagedIds:
            space: SMEM
            member_slot_shape: [token: T, slot: K]
            dtype: int32
            slot_count: 1
            view: {route_ids: {}}
          GroupTable:
            space: SMEM
            member_slot_shape: [group: RouteGroups, expert: 256]
            dtype: int32
            slot_count: 1
            view:
              "Hist(g)": {part: {group: [g, "g+1"], expert: [0, E]}}
              "RankCursor(g)": {part: {group: [g, "g+1"], expert: [0, E]}}
          Offs: {space: SMEM, member_slot_shape: [prefix: 257], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [prefix: 257], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [element: 129], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:32]"
              verb:
                enter: &pdl_entry >-
                  All participating threads wait for predecessor grid completion
                  and visibility; warp 0 then grants dependent-grid launch permission.
                  After the guard's completion wait, read Clean. Clean=1 returns
                  before metadata or payload access, with an empty work domain.
                  The entry executes even if this worker has no payload work;
                  launch permission alone grants no data readiness.
                produce: >-
                  Stage every route ID once into StagedIds and zero the full
                  GroupTable, including the unused expert columns. After CTA
                  rendezvous, warp g forms Hist(g) for its contiguous route group.
                  Rendezvous before expert-wise prefixing replaces Hist with
                  RankCursor, the group-exclusive reservation bases of routing,
                  and writes Counts. Another rendezvous precedes the paired
                  expert scans; ScanScratch holds two 64-word scan arrays and J.
                  Publish Offs and TilePrefix both globally and into their local
                  caches, then rendezvous before scatter and tile enumeration.
                  Each warp advances its own RankCursor by atomics while writing
                  RoutePos and all three packed maps. Enumerate and store TileExpert
                  and TileRow from the cached tile prefix. StagedIds and the prefix
                  caches survive through their last reads; GroupTable is overwritten
                  only after histogram production is complete. M=0 still writes
                  zero Counts/prefixes and RoutePos=-1, with no packed or tile stores.
            pipe: {repeat: t, prologue: ["enter:Protocol"], steady: ["produce:RoutePos(t)"]}
      gather:
        domain: {t: worktile}
        milestone: {verified: ["Main/enter:Protocol"]}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:4]"
              verb:
                enter: *pdl_entry
                produce: >-
                  Each of the 128 threads handles one SourceChunk, reads its token's
                  eight RoutePos entries, and loads a 16-byte source only if some
                  route is valid. Replicate to those destinations; the same registers
                  hold this chunk through all route stores. No inter-thread exchange.
            pipe: {repeat: t, prologue: ["enter:Protocol"], steady: ["produce:GatherChunk(t)"]}
      fc1:
        milestone:
          verified: ["AProducer/enter:Protocol", "BProducer/enter:Protocol", "MMA/enter:Protocol", "Epilogue/enter:Protocol", "Epilogue0/enter:Protocol", "Epilogue1/enter:Protocol", "Epilogue2/enter:Protocol"]
        domain:
          t: worktile
          i: [0, "H/BK"]
          g: {flatten: [t, i]}
          c: [0, 2]
        resource:
          PayloadA: &payload_a
            space: SMEM
            member_slot_shape: [row: BM, byte: "BK/2"]
            dtype: uint8
            slot_count: 3
            view: {"PayloadA(g)": {slot_index: "g%3"}}
          PayloadB: &payload_b
            space: SMEM
            member_slot_shape: [row: 128, byte: "BK/2"]
            dtype: uint8
            slot_count: 3
            view: {"PayloadB(g)": {slot_index: "g%3"}}
          AScale: &scale_a
            space: SMEM
            member_slot_shape: [row: BM, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"AScale(g)": {slot_index: "g%2"}}
          BScale: &scale_b
            space: SMEM
            member_slot_shape: [row: 128, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"BScale(g)": {slot_index: "g%2"}}
          APrefetch: &a_prefetch
            space: register
            member_slot_shape: [row: BM, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"APrefetch(t,i)": {slot_index: "i%2"}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C1: {part: {column: [0, 128]}}
              "ScaleTM(g)": {part: {column: ["128+32*(g%2)", "160+32*(g%2)"]}, dtype: uint8}
          Fragment: &fragment
            space: register
            member_slot_shape: [row: BM, column: 64]
            dtype: fp32
            slot_count: 1
          ScalePack: {space: register, member_slot_shape: [row: BM, block: 4], dtype: uint8, slot_count: 1}
        role:
          AProducer: &a_producer
            info:
              execution_mode: serial
              member: "warp[0:1]"
              verb:
                enter: &gemm_enter >-
                  First wait for predecessor completion and read Clean. Clean=1
                  returns before the regular PDL trigger, J reads or local allocation;
                  kernel completion supplies dependent launch permission in that case.
                  For Clean=0, execute the regular PDL wait/trigger entry. If global
                  J=0, perform no local allocation and leave work domains empty.
                  Otherwise warp 0
                  initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent
                  work loops. A worker with no assigned item still participates.
                prime: &a_prime >-
                  Resolve this worktile's expert and row base. The activation-scale
                  source is GatherS in fc1 and ActS in fc2. Load the first stage
                  and, when the local stage count exceeds one, the second into
                  APrefetch. All BM rows are loaded, redirecting padding scales to
                  the first valid row. Prefetch registers are restarted per worktile.
                publish: &a_publish >-
                  Scatter the current APrefetch set into AScale, then establish
                  shared-to-async visibility. If a next stage exists in this worktile,
                  load it into the other register set before the warp rendezvous and
                  full-stage arrival. Thus stage 1 is loaded again after being primed;
                  the first primed copy is overwritten without use. Done includes this
                  arrival, not completion of the independent payload/weight-scale loads.
                retire: &gemm_retire >-
                  After this role's whole assigned sequence, rendezvous with all seven
                  warps; warp 0 deallocates TensorStorage. For Clean=1 or dirty J=0
                  this action is a no-op with no rendezvous or deallocation. It does not insert a per-worktile drain or a new global
                  memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - "prime:APrefetch(t)"
                - repeat: "g[t]"
                  steady: ["publish:AScale(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              reuse:
                "publish:AScale(g+2)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
          BProducer:
            info:
              execution_mode: async
              member: "warp[1:2]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                load: >-
                  Stage PayloadA from GatherQ and PayloadB as the two contiguous
                  up/gate weight boxes. Arm the full-stage transaction count for
                  32768 payload bytes. Done covers both payload transfers. Payloads
                  use three slots independently of the two scale slots.
                stage: >-
                  Copy prepared weight scales into BScale's fused 128-row up/gate
                  image, preserving the prepared ABI permutation. The lane-permuted
                  4-byte asynchronous copies collectively stage 2048 bytes. Done is
                  their completion arrival to the full-stage protocol. Also issue
                  an L2-only weight-scale hint two stages ahead when that stage lies
                  in the same worktile; the hint has no consumer or completion edge.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: g
              prologue: ["enter:Protocol"]
              steady: ["load:PayloadPair(g)", "stage:BScale(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              reuse:
                "load:PayloadPair(g+3)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
                "stage:BScale(g+2)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: "warp[2:3]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                wait: &drain_wait
                  execution_mode: serial
                  meaning: >-
                    Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes
                    after its explicit predecessors; q identifies the optional
                    wait before the first scale copy of a worktile.
                prepare: &scale_prepare >-
                  The elected issuer waits for the full-stage protocol and copies
                  AScale and BScale into ScaleTM: four scale-copy operations for each
                  operand. Issuance includes submission of all scale copies;
                  only then does this issuer advance to the MMA action. Done is covered
                  by the following cumulative MMA completion.
                mma: >-
                  Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel
                  block-scaled updates to C1. The first update initializes C1 without
                  reading its old value. The fused 128-column product covers both up
                  and gate. Issue a cumulative completion commit after each stage;
                  done covers scale copies, payload reads and accumulator updates.
                  The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM
                  before a later scale copy overwrites that scale slot, and makes each
                  scale copy visible before the MMA that uses it.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - repeat: {q: [0, "min(1,t)*(1-Hoist)"]}
                  steady: ["wait:Drain(t,q)"]
                - repeat: "g[t]"
                  steady: ["prepare:ScaleTM(g)", "mma:PayloadA(g)@PayloadB(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              data:
                "prepare:ScaleTM(g)": ["AProducer/publish:AScale(g)", "BProducer/load:PayloadPair(g)", "BProducer/stage:BScale(g)"]
              reuse:
                "wait:Drain(t,q)@done": &prior_drain ["Epilogue/release:Accumulator(t-1)", "Epilogue0/release:Accumulator(t-1)", "Epilogue1/release:Accumulator(t-1)", "Epilogue2/release:Accumulator(t-1)"]
                "mma:PayloadA(g[t,0])@PayloadB(g[t,0])": *prior_drain
          Epilogue:
            info:
              execution_mode: serial
              member: "warp[3:4]"
              verb: &fc1_epi_verb
                enter: *gemm_enter
                drain: >-
                  Each warp owns its hardware TMEM quadrant (warp index modulo four),
                  one row per lane. For c=0 or 1, load the matching 32 up and 32 gate
                  values into this quadrant's rows of Fragment, issue both reads before waiting, and wait for
                  all their TMEM reads to retire. Done makes this register fragment usable.
                emit: >-
                  Evaluate fc1_quantize for this 32-channel Fragment, including padding
                  rows. For c=0 initialize ScalePack and retain its first two scale bytes;
                  c=1 adds the last two, stores the full four-byte scale word on valid
                  rows and resets it. Store valid payload bytes for each c. Done means
                  local computation and store submission consumed Fragment; global
                  stores can still be in flight. Invalid rows submit no output stores.
                release: &acc_release >-
                  This warp arrives once after its last TMEM-read wait and warp
                  rendezvous. Done releases only this warp's accumulator quadrant;
                  MMA reuse waits for all four epilogue roles. This warp immediately
                  continues its final conversion/store tail without waiting for the
                  other epilogue warps or for global output-store completion.
                retire: *gemm_retire
            pipe: &fc1_epi_pipe
              repeat: t
              prologue: ["enter:Protocol"]
              steady: ["drain:Fragment(t,0)", "emit:ActQ(t,0)", "drain:Fragment(t,1)", "release:Accumulator(t)", "emit:ActQ(t,1)"]
              epilogue: ["retire:TensorStorage"]
            waits_for: &fc1_epi_wait
              data:
                "drain:Fragment(t,0)": ["MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])"]
          Epilogue0:
            info:
              execution_mode: serial
              member: "warp[4:5]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
          Epilogue1:
            info:
              execution_mode: serial
              member: "warp[5:6]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
          Epilogue2:
            info:
              execution_mode: serial
              member: "warp[6:7]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
      fc2:
        milestone:
          verified: ["AProducer/enter:Protocol", "BProducer/enter:Protocol", "MMA/enter:Protocol", "Epilogue/enter:Protocol", "Epilogue0/enter:Protocol", "Epilogue1/enter:Protocol", "Epilogue2/enter:Protocol"]
        domain:
          t: worktile
          i: [0, "I/BK"]
          g: {flatten: [t, i]}
          c: [0, 2]
        resource:
          PayloadA: *payload_a
          PayloadB: *payload_b
          AScale: *scale_a
          BScale: *scale_b
          APrefetch: *a_prefetch
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C2: {part: {column: [0, 128]}}
              "ScaleTM(g)": {part: {column: ["128+32*(g%2)", "160+32*(g%2)"]}, dtype: uint8}
          Fragment: *fragment
          Sink: {space: SMEM, member_slot_shape: [quadrant: 4, row: 32, hidden: 32], dtype: bf16, slot_count: 1}
        role:
          AProducer: *a_producer
          BProducer:
            info:
              execution_mode: async
              member: "warp[1:2]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                load: >-
                  Stage PayloadA from ActQ and PayloadB from the selected FC2 weights.
                  Arm the full-stage protocol for 32768 bytes; done covers both tensor
                  transfers. Padding payload rows remain consecutive while AProducer
                  redirects their scale rows. No weight-payload L2 hint is issued here.
                stage: >-
                  Copy the prepared FC2 scale image with 16-byte asynchronous copies,
                  four per lane, into BScale. Done includes the copy-completion arrival
                  in the full-stage protocol; no independent scale-prefetch hint.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: g
              prologue: ["enter:Protocol"]
              steady: ["load:PayloadPair(g)", "stage:BScale(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              reuse:
                "load:PayloadPair(g+3)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
                "stage:BScale(g+2)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: "warp[2:3]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                wait: *drain_wait
                prepare: *scale_prepare
                mma: >-
                  Execute four ordered 64-channel block-scaled updates of C2, with
                  first-update initialization and cumulative stage completion. Done
                  covers preceding scale copies and operand reads; last-stage commit
                  also publishes the result. Same-issuer scale-copy/MMA ordering protects
                  ScaleTM reuse and copy-to-MMA visibility, including a hoisted first stage
                  of the next worktile.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - repeat: {q: [0, "min(1,t)*(1-Hoist)"]}
                  steady: ["wait:Drain(t,q)"]
                - repeat: "g[t]"
                  steady: ["prepare:ScaleTM(g)", "mma:PayloadA(g)@PayloadB(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              data:
                "prepare:ScaleTM(g)": ["AProducer/publish:AScale(g)", "BProducer/load:PayloadPair(g)", "BProducer/stage:BScale(g)"]
              reuse:
                "wait:Drain(t,q)@done": *prior_drain
                "mma:PayloadA(g[t,0])@PayloadB(g[t,0])": *prior_drain
          Epilogue:
            info:
              execution_mode: serial
              member: "warp[3:4]"
              verb: &fc2_epi_verb
                enter: *gemm_enter
                drain: >-
                  Each warp owns its TMEM quadrant; for c=0 or 1, issue reads of the
                  two adjacent 32-column chunks into its own quadrant's 64-column Fragment,
                  then wait once for both reads to retire. Padding rows are read too.
                release: *acc_release
                emit: >-
                  Process the two 32-column chunks in order. A quadrant whose
                  entire 32-row group is valid converts to BF16 and uses its own Sink region: wait until
                  all earlier bulk stores by that warp have finished reading Sink,
                  rendezvous the warp, populate Sink, establish async-proxy visibility,
                  rendezvous, and issue/commit the bulk store. Repeat for the second
                  chunk, reusing that same region. A partial quadrant converts and
                  directly stores only valid rows and never writes Sink.
                  Done covers conversion, Fragment consumption and store submission;
                  it is not a global-completion event. The bulk read wait also protects
                  Sink across worktiles, even when intervening quadrants used direct stores.
                finish: >-
                  Each epilogue warp's issuing lane waits for every outstanding bulk
                  store to complete globally. This runs once after the whole work
                  sequence. It is a no-op for Clean=1 or dirty J=0; for dirty J>0 it runs even if
                  this worker had no items. It does not wait per worktile.
                retire: *gemm_retire
            pipe: &fc2_epi_pipe
              repeat: t
              prologue: ["enter:Protocol"]
              steady: ["drain:Fragment(t,0)", "emit:RouteResult(t,0)", "drain:Fragment(t,1)", "release:Accumulator(t)", "emit:RouteResult(t,1)"]
              epilogue: ["finish:BulkStores", "retire:TensorStorage"]
            waits_for: &fc2_epi_wait
              data:
                "drain:Fragment(t,0)": ["MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])"]
          Epilogue0:
            info:
              execution_mode: serial
              member: "warp[4:5]"
              verb: *fc2_epi_verb
            pipe: *fc2_epi_pipe
            waits_for: *fc2_epi_wait
          Epilogue1:
            info:
              execution_mode: serial
              member: "warp[5:6]"
              verb: *fc2_epi_verb
            pipe: *fc2_epi_pipe
            waits_for: *fc2_epi_wait
          Epilogue2:
            info:
              execution_mode: serial
              member: "warp[6:7]"
              verb: *fc2_epi_verb
            pipe: *fc2_epi_pipe
            waits_for: *fc2_epi_wait
      finalize:
        domain: {t: worktile}
        milestone: {verified: ["Main/enter:Protocol"]}
        resource:
          Accumulator: {space: register, member_slot_shape: [hidden: "128*FinalWidth"], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:4]"
              verb:
                enter: *pdl_entry
                produce: >-
                  Each thread owns FinalWidth independent output elements. Hoist its eight
                  route indices and scores, initialize Accumulator, then consume
                  valid BF16 route vectors in increasing slot order using finalize's
                  FMA recurrence. Convert and store Y once; no CTA reduction or
                  inter-thread barrier is required. Empty routing still writes zeros.
            pipe: {repeat: t, prologue: ["enter:Protocol"], steady: ["produce:Y(t)"]}
realization:
  require:
    - item: ["design.tile_pipeline::fc1.MMA", "design.tile_pipeline::fc2.MMA"]
      choice: >-
        Use the source's tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and
        tcgen05.cp scale path, with cumulative tcgen05.commit completion and
        tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
      reason: The shared-slot reuse and cross-work scale-copy hoist depend on the same issuer's ordered scale reads and cumulative operand-read completion.
    - item: ["design.tile_pipeline::fc1", "design.tile_pipeline::fc2"]
      choice: For all epilogue roles, use tcgen05.ld with tcgen05.wait::ld before each final accumulator-release arrival, using the issuing warp's hardware quadrant.
      reason: Register materialization and early accumulator reuse require TMEM reads to have retired before the next work overwrites it.
    - item: "design.tile_pipeline::fc2"
      choice: >-
        Bind bulk Sink reuse to cp.async.bulk.wait_group.read 0, its publication to
        fence.proxy.async.shared::cta, and terminal completion to
        cp.async.bulk.wait_group 0. The output tensor map is a byte view with a
        64-byte by 32-row box; full quadrants use it and partial quadrants use direct stores.
      reason: Source-read completion permits Sink overwrite but does not make RouteResult globally visible to finalize.
    - item: "design.work_schedule::flow"
      choice: >-
        For verify and its five successors, preserve programmatic-stream-serialization
        launches and griddepcontrol.wait / launch_dependents for eager and recorded
        work. The preceding eligibility scan uses an ordinary kernel launch.
      reason: Launch permission and visible predecessor results are separate guarantees.
    - item: "design.tile_pipeline::verify.Main"
      choice: >-
        Use device-scoped atomicOr/atomicAdd with device publication before arrival;
        the last-arriver mirror store uses a system fence and pinned host storage
        when that ABI binding is present.
      reason: The folded verdict and reset must cover every verifier contribution; a device-only publication does not provide the host-mirror visibility of this path.
