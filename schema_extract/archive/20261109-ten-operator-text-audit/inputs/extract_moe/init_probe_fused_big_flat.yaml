          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
