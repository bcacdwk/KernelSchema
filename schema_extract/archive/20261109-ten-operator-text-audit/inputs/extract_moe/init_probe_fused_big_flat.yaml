"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Precomputed routed mixture of experts with prepared NVFP4 weights,\
    \ gated activation, activation requantization and BF16 output."
  "source": "SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "init_probe_fused_big_flat"
    "parent": "probe_fused_big_flat"
    "when": |
      Let a be the MoEABI newly constructed by Model.forward after its identity
      and key caches miss. All implementation controls and any graph bindings
      follow the frozen default implementation scope. Let R=T*K. The saved
      small_thresh is 3000 when 3000<R<=6500 and route_hist finds a valid route,
      otherwise 6500; route_hist counts valid IDs from its construction-time
      host readback and is evaluated once for this construction's cfg2 gate.
      Select exactly when ensure_tables actually submits one k_init_tables,
      its launch-status check and device-wide synchronization succeed, one
      k_zero_scan is actually submitted by moe_zero_probe, Python retains
      zero_ok=false, and the rebuilt a has cfg=97, cfg2=23, I=256,
      zflag=zflag_host=0, R>a.small_thresh and R<49152. The subsequent moe_run
      returns zero after one caller-stream run_pipeline execution or ordinary
      full-graph replay. FC2 uses a successful tma_set lookup and the
      k_gemm_f4_flat<128,3,2,true> entry. Any private-stream run_pipeline call
      in this request is capture-only after successful cudaStreamBeginCapture;
      no uncaptured private-stream pipeline is added.
      zero_ok=false includes a rejected scan and a probe error or exception
      after scan submission; allocation/memset failure before scan submission
      is outside this node. The scan and construction services belong to this
      request, even when probing fails. Successful internal capture records
      only the later pipeline and contributes no second execution. For recorded
      work, ABI scalars and bindings are those fixed at recording, while device
      reads use execution-time contents; capture alone creates no kernel_done.
"design":
  math_reshape:
    thesis: |-
      Materialize three persistent format tables and scan the inputs before
      full packed MoE computation; the tables have no consumer in this path
      and the rejected or failed probe saves no contraction work. Compact
      valid routes by expert, fuse FC1 with approximate activation and
      requantization, and retain the BF16 FC2 route materialization.
    rewrite:
    - step: format_tables
      name: Materialize all byte-to-value format conversions
      math: |
        For each byte b in [0,256), let lo=b mod 16, hi=floor(b/16),
        sign=floor(b/128), exponent=floor(b/8) mod 16, and mantissa=b mod 8.
        Define D8(b) as a quiet NaN when exponent=15 and mantissa=7;
        otherwise its magnitude is mantissa*2^(-9) when exponent=0,
        and (1+mantissa/8)*2^(exponent-7) otherwise. Apply the sign bit,
        preserving signed zero. F is Contract's exact E2M1 decoder.
        E2M1Pair[b,0]=bf16(F(lo)); E2M1Pair[b,1]=bf16(F(hi)).
        E4M3Float[b]=fp32(D8(b)).
        E4M3Pair[b,0]=E4M3Pair[b,1]=bf16(E4M3Float[b]).
        Retain all three complete tables for the module's device lifetime;
        a later table initialization overwrites them with the same format-only
        values. No table value is consumed by this call's probe, routing,
        native block-scaled contractions, activation or finalization.
      symbol:
        E2M1Pair: {meaning: BF16 low/high E2M1 nibble values for every byte,
          shape: [{byte: 256}, {pair: 2}], dtype: bf16, retention: keep_value device}
        E4M3Float: {meaning: FP32 E4M3FN value for every byte,
          shape: [{byte: 256}], dtype: fp32, retention: keep_value device}
        E4M3Pair: {meaning: Duplicated BF16 E4M3FN value for every byte,
          shape: [{byte: 256}, {pair: 2}], dtype: bf16, retention: keep_value device}
    - step: zero_probe
      name: Test the zero-input shortcut without changing the full computation
      math: |
        Let HasLimit be 1 when gemm1_clamp_limit is not None, otherwise 0.
        Let Byte(X) be X's row-major uint8 storage view. For shard b in
        [0,ProbeBlocks), define Tokens(b)={t in [0,T) | t mod ProbeBlocks=b},
        Elements(b,L)={i in [0,L) | floor(i/ProbeWidth) mod ProbeBlocks=b}, and
        ScaleBytes(b,L)={i in [0,L) | floor(i/(4*ProbeWidth)) mod ProbeBlocks=b}.
        W1Bytes=E*2*I*(H/Block); W2Bytes=E*H*(I/Block).
        ProbeReject[b] is int32(1) if any of the following predicates is true,
        and int32(0) otherwise. Evaluate every indicated input, even after a
        positive predicate: (Byte(hidden_states)[t,j] bitwise_and 0x77)!=0
        for t in Tokens(b), 0<=j<H/2; (Byte(hidden_states_scale)[t,j]
        bitwise_and 0x7f)=0x7f for t in Tokens(b), 0<=j<H/Block;
        not isfinite(route_weights[i]) for flattened i in Elements(b,T*K);
        not isfinite(gemm1_alpha[e]) or not isfinite(gemm1_beta[e]) for
        e in Elements(b,E), additionally not isfinite(gemm1_clamp_limit[e])
        when HasLimit=1; and (Byte(X)[i] bitwise_and 0x7f)=0x7f for
        (X,L)=(gemm1_weights_scale,W1Bytes) or (gemm2_weights_scale,W2Bytes),
        i in ScaleBytes(b,L). isfinite tests the FP32 value; the byte predicate
        tests E4M3FN NaN encodings without decoding or unswizzling.
        ProbeDirty starts at int32(0). Each positive ProbeReject sets it to
        int32(1); a zero ProbeReject leaves it unchanged. Thus its completed
        logical value is max_b ProbeReject[b]. It is retained for host readback,
        then discarded; neither it nor ProbeReject changes the route computation.
        ScanBytes=9*T*H/16+4*T*K+4*E*(2+HasLimit)+W1Bytes+W2Bytes.
      symbol:
        ProbeBlocks: {meaning: Number of disjoint zero-scan shards, binding: 'bind:design.work_schedule::ProbeBlocks'}
        ProbeWidth: {meaning: Scalar packet width of one zero-scan shard iteration, binding: 'bind:design.work_schedule::ProbeWidth'}
        ProbeReject: {meaning: One shard zero-test rejection predicate, shape: [], dtype: int32}
        ProbeDirty: {meaning: Shared monotone rejection word consumed by host probing, shape: [], dtype: int32,
          retention: keep_value probe}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        R = T*K. Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For b = 0..ceil_div(R,RouteBatch)-1, Hist(b)[e] counts routes to e among flattened slots
        [RouteBatch*b,RouteBatch*(b+1)),
        clipped to [0,R). Counts[e] = sum_b Hist(b)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        Fill[e] starts at zero. Each route batch reserves its expert counts by
        fetch-and-add on Fill[e]; local ranks assign a bijection rho from V onto
        [0,M), with rho(t,k) in [Offs[e],Offs[e+1]) for e = route_ids[t,k].
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k]. Fill[e] ends at Counts[e].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteBatch: {meaning: Route histogram batch size, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Fill: {meaning: Atomic expert reservation counters, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}],
          dtype: int32, retention: keep_value invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        Nchunk = 9*H/256. For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8,
          retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K},
            {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32,
          retention: 'carry_forward (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}],
          dtype: uint8, retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based
          tanh identity and reciprocal-multiply quantization replace the reference evaluation. unknown: no verified
          uniform error bound for the full declared domain is supplied; source comments and local probes are not
          an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation;
          four such updates make one BK stage. The notation does not assert FP32 products or reference-order bit
          equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}
      arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only
          the reduction extent and output columns change.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return a new
        one-element list containing that same tensor, preserving its storage alias.
      symbol:
        Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}
    ledger:
      baseline: Contract evaluation for the M valid routes, saving decoded FP32 activations, both FC1 outputs and
        Act before QDQ; save the same BF16 route results.
      matmul:
      - {item: Expert contractions, change: '3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded
          padded rows', by: [fc1_quantize, fc2]}
      vector:
      - {item: Format-table construction, change: 'Add 512 E2M1 decodes, 256 E4M3FN decodes
          and 768 BF16 conversions for this table-cache miss', by: [format_tables]}
      - item: Activation and quantization
        change: M*I -> PaddedRows*I channel evaluations, plus O(R+ceil_div(R,RouteBatch)*E+E+J*log2(E)) integer
          routing work per invocation
        by:
        - routing
        - fc1_quantize
      footprint:
      - {item: Format tables, change: Retain 3072 bytes per device module instance;
          this initialization overwrites all entries without adding a second table set,
          by: [format_tables]}
      - item: Intermediate materialization
        change: 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16
          route bytes remain 2*M*H
        by:
        - gather
        - fc1_quantize
        - fc2
      - {item: Probe flag, change: Add one 4-byte logical rejection word until probe cleanup, by: [zero_probe]}
      traffic:
      - {item: Format-table writes, change: Add 3072 logical store bytes per table
          initialization; this selected path performs no later table reads,
          by: [format_tables]}
      - {item: Gather, change: 'Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand
          reads', by: [gather]}
      - item: Rejected zero probe
        change: A completed scan adds ScanBytes input bytes, a 4-byte zero initialization and up to 4*ProbeBlocks
          flag-store bytes per ABI rebuild; one 4-byte host readback is attempted only after successful status and
          completion checks. Failed execution does not establish the completed-scan traffic total.
        by:
        - zero_probe
      error:
      - item: Numerical evaluation
        change: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I evaluated
          channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established
        by:
        - fc1_quantize
        - finalize
  work_schedule:
    thesis: |-
      Submit one table-initialization kernel and one zero scan during ABI
      construction, then the seven-kernel big routing and packed MoE chain.
      A device-wide completion service separates initialization from further
      construction work. The probe has an independent 4-byte flag
      and a host completion/readback boundary. The subsequent chain uses PDL
      launch permission separately from data readiness, with statically strided
      persistent GEMM workers and the same global handoffs as ordinary reuse.
      The default cfg2=23 gate requires one construction-time route-ID readback;
      its histogram selects variants, while device routing is recomputed for
      the actual execution. The format tables occupy three 1024-byte global
      arrays per device module instance; they persist independently of the ABI
      workspace and have no consumer phase in this selected computation.
      Workspace allocation and initialization are services, not additional
      computational phases. A workspace cache miss initializes the adjacent
      2*E int32 Counts/Fill slab and allocates the R-row maps, packed gathered
      input backing, activation backing and BF16 route-result backing. A hit
      retains that storage. In either case the pipeline memset resets Counts
      and Fill again. Unwritten backing bytes are not initialized by inference.
      The published ABI retains its tensors and workspace for later calls;
      this request ends with the same caller-owned output alias. Same-stream
      ordering governs reuse, without added cross-stream exclusion.
    flow:
      launch:
      - {phase: [tables]}
      - {phase: [probe], start_after: tables.kernel_done}
      - {phase: [count], protocol: pdl, start_after: probe.kernel_done}
      - {phase: [scan], protocol: pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: pdl, start_after: scatter.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, ready: count.kernel_done}
        Offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        TilePrefix: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileExpert: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileRow: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        RoutePos: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      tables:
        describe: Construct the complete three format-conversion tables.
        decomposition:
          strategy: |-
            One worktile produces every byte entry of E2M1Pair, E4M3Float and
            E4M3Pair in the module's existing global arrays. No input data or
            prior table contents are read and no initialization of these arrays
            is needed before their complete overwrite. The table-cache miss is
            for this Model and device; it need not be the module's first write.
            After the launch-status check, the host synchronizes the whole device,
            including other preceding device work, before marking this device
            ready in the Model's table cache. Both services succeed in this node.
            Route-ID readback, probing and workspace construction follow this
            host boundary. Device synchronization is a service, not another
            computational phase; the tables.kernel_done dependency records its
            in-request completion requirement. The arrays remain allocated for
            the module's device lifetime, without a per-request release or reset.
          partition: {}
          target:
            single_tile:
              E2M1Pair: {shape: [{byte: 256}, {pair: 2}], dtype: bf16}
              E4M3Float: {shape: [{byte: 256}], dtype: fp32}
              E4M3Pair: {shape: [{byte: 256}, {pair: 2}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: 1}
            refill: none
            exit: assigned_done
      probe:
        describe: Scan disjoint input shards and monotonically publish the rejection flag.
        decomposition:
          strategy: |-
            ProbeBlocks=296 and ProbeWidth=256. Each worktile owns one shard b
            from zero_probe: complete token rows in Tokens(b), scalar packets in
            Elements(b,L), and four-byte scale packets in ScaleBytes(b,L). These
            are independent local loops, all ascending; no loop stops on rejection.
            A device allocation and memset service establish ProbeDirty=0 before
            submission. Each rejecting worktile sets the same global word to 1;
            nonrejecting worktiles do not write it. It is not a per-shard array.
            After submission, the host checks launch status, then synchronizes this
            stream; a failed check cleans up and returns -3 or -4 respectively.
            On successful checks it attempts a 4-byte D2H copy into a host word
            initialized to 1, frees the device word and returns 1 only for a zero
            readback. The copy status is unchecked. The source supplies no output
            correctness guarantee for an execution failure. Python continues here
            only with zero_ok=false, without allocating either verification flag.
            Cleanup is attempted on every post-submission exit; the normal lifetime
            ends after scan completion and readback. A failed service is not modeled
            as cancelling an already submitted scan or creating a recovery kernel.
          partition:
            shard: {size: ProbeBlocks, tile: 1}
          worktile:
            iteration:
              hidden_states: {shape: [{token: 1}, {packed_hidden: H/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{token: 1}, {hidden_block: H/Block}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{element: ProbeWidth}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: ProbeWidth}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: ProbeWidth}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: ProbeWidth}], dtype: fp32, direction: ascending}
              gemm1_weights_scale: {shape: [{element: 4*ProbeWidth}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights_scale: {shape: [{element: 4*ProbeWidth}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ProbeReject: {shape: [], dtype: int32}
            tile_reduction: {dimension: shard, input: 'ref:design.math_reshape::ProbeReject', output: 'ref:design.math_reshape::ProbeDirty',
              method: 'ref:design.math_reshape::zero_probe'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ProbeBlocks
        schedule:
          worktile_order:
          - {by: shard, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      count:
        describe: Form block histograms and accumulate Counts.
        decomposition:
          strategy: RouteBatch=256. A cudaMemsetAsync service zeros the adjacent E-element Counts and Fill arrays
            before count starts. Each 256-route worktile forms Hist and atomically adds each nonzero expert count;
            the memset repeats on every execution.
          partition:
            route: {size: R, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
          target:
            single_tile:
              Hist: {shape: [{expert: E}], dtype: int32}
            tile_reduction: {dimension: route, input: 'ref:design.math_reshape::Hist', output: 'ref:design.math_reshape::Counts',
              method: 'ref:design.math_reshape::routing'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R,RouteBatch)
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      scan:
        describe: Joint prefix scans followed by tile-map enumeration.
        decomposition:
          strategy: BM = 128. One worktile scans all E counts and per-expert ceil counts, then enumerates J row
            tiles by binary search of the tile prefixes.
          partition: {}
          worktile:
            invariant:
              Counts: {shape: [{expert: E}], dtype: int32}
          target:
            single_tile:
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: 1}
            refill: none
            exit: assigned_done
      scatter:
        describe: Recompute batch histograms, reserve expert intervals and publish both route maps.
        decomposition:
          strategy: Hist is recomputed locally, not transferred from count. A block reserves Hist[e] rows by one
            Fill atomic per nonempty expert and assigns ranks with block-local atomics. Fill's zero initialization
            is the count-stage memset; different blocks may reserve in any order. Map stores are clipped to actual
            routes and RoutePos is -1 for invalid routes.
          partition:
            route: {size: R, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
          target:
            single_tile:
              RoutePos: {shape: [{route: RouteBatch}], dtype: int32}
              PackedToken: {shape: [{route: RouteBatch}], dtype: int32}
              PackedSlot: {shape: [{route: RouteBatch}], dtype: int32}
              PackedExpert: {shape: [{route: RouteBatch}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R,RouteBatch)
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk)
            coordinates, with chunk fastest; a tile can cross token boundaries. All work is empty when M=0. Otherwise
            chunks whose token has no routes are visited without payload reads or writes; the final packet is clipped.
          partition:
            chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}
          worktile:
            invariant:
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
          target:
            single_tile:
              GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: min(1184,ceil_div(T*Nchunk,128))
        schedule:
          worktile_order:
          - {by: chunk, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local
            iterations and four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j); padded
            arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice
            is read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI''s row-tile
            upper bound. Let Cap be the cached automatic grid cap: twice the queried SM count, or zero if that query
            failed. For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else
            TileCap). The submitted grid uses G(I/BN1), independent of the current J.'
          partition:
            row_tile: {size: J, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(I/BN1)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only
            valid(j) output rows are stored. All submitted workers remain present when J=0, but their assigned sequences
            are empty.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(H/BN2)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker
            produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are a local reduction,
            not independently assigned work; masked routes do not read the route-result slab.
          partition:
            token: {size: T, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos: {shape: [{slot: K}], dtype: int32}
              route_weights: {shape: [{slot: K}], dtype: fp32}
            iteration:
              RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: T*ceil_div(H,128*FinalWidth)
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: |-
      Eight warps independently construct all format-table entries, with no
      CTA-local exchange or persistent local storage. Eight cooperative warps
      then scan each probe shard with a register rejection
      state and one CTA-wide OR before a conditional global flag store. After
      the host probe boundary, FC1 keeps separate producers, MMA issue and
      four epilogue warps. FC2 streams single-stage worktiles through three
      payload slots, two scale slots and a delayed metadata ring; its single
      accumulator serializes MMA with the preceding direct BF16 readout.
    phase:
      tables:
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                produce: |-
                  FormatTables denotes E2M1Pair, E4M3Float and E4M3Pair from
                  format_tables. Each of the 256 threads computes the entries
                  for its byte value, rounds the three BF16 values and stores
                  the low/high pair, FP32 scale and duplicated BF16 scale pair
                  in their global arrays. No thread reads another thread's
                  entries; no CTA barrier, shared tile or local reuse protocol
                  is needed. Done includes computation and store submission;
                  kernel completion establishes the tables' global visibility.
            pipe: {steady: ['produce:FormatTables']}
      probe:
        resource:
          RejectState: {space: register, member_slot_shape: [{element: ProbeWidth}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                produce: |-
                  Initialize one unsigned rejection state per thread. Threads stride
                  through the shard's token-row payload words and scale bytes, then its
                  routing weights, expert parameters and both prepared scale arrays.
                  Payload words retain only the eight E2M1 magnitude fields; packed
                  scale words test all four bytes. Optional clamp loads occur only when
                  HasLimit=1. Accumulate every predicate locally without an early exit.
                  All 256 threads participate in the CTA-wide OR, including threads
                  with no assigned elements. One thread sets ProbeDirty to 1 if this
                  OR rejects; otherwise no global store occurs. No CTA polls the word
                  or waits for another CTA. Completion includes this local scan and
                  conditional store; kernel completion supplies host-visible readiness.
                  The fixed source uses non-atomic shared-flag stores, so this design
                  records the monotone publication without asserting race-free execution.
            pipe: {steady: ['produce:ProbeDirty']}
      count:
        resource:
          Hist: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Zero Hist, synchronize the CTA, histogram valid routes, synchronize, then atomically add
                  nonzero Hist entries into Counts.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:Counts']}
      scan:
        resource:
          PrefixScratch: {space: SMEM, member_slot_shape: [{element: 386}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: PrefixScratch holds 257 tile-prefix entries, two 64-word scan arrays and the tile total.
                  Warp-local scans, the scan of warp totals and CTA rendezvous produce both prefixes. After their
                  publication within the CTA, threads enumerate tile IDs by binary search and write Offs, TilePrefix,
                  TileExpert and TileRow. J=0 still writes prefixes.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:TilePrefix']}
      scatter:
        resource:
          Reservation: {space: SMEM, member_slot_shape: [{table: 3}, {expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Reservation contains batch counts, reserved bases and local ranks. Zero counts/ranks, CTA
                  rendezvous, histogram, rendezvous, reserve intervals from Fill, rendezvous, then assign atomic
                  local ranks and write all four maps defined by routing. No thread exits before the last rendezvous;
                  invalid real routes still write RoutePos=-1.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:RoutePos']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries,
                  and loads a 16-byte source only if some route is valid. Replicate to those destinations; the same
                  registers hold this chunk through all route stores. No inter-thread exchange.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:GatherChunk(t)']}
      fc1:
        domain:
          t: worktile
          i:
          - 0
          - H/BK
          g: {flatten: [t, i]}
          c:
          - 0
          - 2
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(g): {slot_index: g%3}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(g): {slot_index: g%2}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(g): {slot_index: g%2}
          APrefetch:
            space: register
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              APrefetch(t,i): {slot_index: i%2}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C1:
                part: {column: [0, 128]}
              ScaleTM(g):
                part: {column: [128+32*(g%2), 160+32*(g%2)]}
                dtype: uint8
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                prime: Resolve this worktile's expert and row base. The activation-scale source is GatherS. Load
                  the first stage and, when the local stage count exceeds one, the second into APrefetch. All BM
                  rows are loaded, redirecting padding scales to the first valid row. Prefetch registers are restarted
                  per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy
                  is overwritten without use. Done includes this arrival, not completion of the independent payload/weight-scale
                  loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - prime:APrefetch(t)
              - {repeat: 'g[t]', steady: ['publish:AScale(g)']}
              epilogue:
              - retire:TensorStorage
            waits_for:
              reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the
                  full-stage transaction count for 32768 payload bytes. Done covers both payload transfers. Payloads
                  use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done
                  is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint
                  two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'],
              epilogue: ['retire:TensorStorage']}
            waits_for:
              reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors;
                    q identifies the optional wait before the first scale copy of a worktile.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of all scale
                  copies; only then does this issuer advance to the MMA action. Done is covered by the following
                  cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1.
                  The first update initializes C1 without reading its old value. The fused 128-column product covers
                  both up and gate. Issue a cumulative completion commit after each stage; done covers scale copies,
                  payload reads and accumulator updates. The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites
                  that scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - repeat: {q: [0, 'min(1,t)*(1-Hoist)']}
                steady:
                - wait:Drain(t,q)
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue:
              - retire:TensorStorage
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done:
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]):
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
                  c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue
                  both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register
                  fragment usable.
                emit: Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize
                  ScalePack and retain its first two scale bytes; c=1 adds the last two, stores the full four-byte
                  scale word on valid rows and resets it. Store valid payload bytes for each c. Done means local
                  computation and store submission consumed Fragment; global stores can still be in flight. Invalid
                  rows submit no output stores.
                release: This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases
                  only this warp's accumulator quadrant; MMA reuse waits for all four epilogue roles. This warp
                  immediately continues its final conversion/store tail without waiting for the other epilogue warps
                  or for global output-store completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - drain:Fragment(t,0)
              - emit:ActQ(t,0)
              - drain:Fragment(t,1)
              - release:Accumulator(t)
              - emit:ActQ(t,1)
              epilogue:
              - retire:TensorStorage
            waits_for:
              data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
