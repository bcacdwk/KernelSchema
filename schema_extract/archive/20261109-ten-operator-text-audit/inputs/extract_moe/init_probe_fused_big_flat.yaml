      fc2:
        domain: {t: worktile, c: [0, BN2/32]}
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(t): {slot_index: t%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: BN2}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(t): {slot_index: t%3}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(t): {slot_index: t%2}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: BN2}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(t): {slot_index: t%2}
          ScalePrefetch: {space: register, member_slot_shape: [{operand: 2}, {row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Metadata:
            space: register
            member_slot_shape:
            - {lane: BM}
            - {field: 5}
            dtype: uint32
            slot_count: 3
            view:
              Metadata(t): {slot_index: t%3}
          Pending: {space: register, member_slot_shape: [{lane: BM}, {field: 5}], dtype: uint32, slot_count: 1}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C2:
                part: {column: [0, 128]}
              ScaleTM(t):
                part: {column: [128+32*(t%2), 160+32*(t%2)]}
                dtype: uint8
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: async
              member: warp[0:4]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol before testing the assigned work. Since I/BK=1, each t
                    is both one worktile and one continuous staging iteration. An empty assigned sequence allocates
                    nothing, including when J>0 but this worker has no item. Otherwise initialize completion state,
                    allocate TensorStorage from warp 0 and rendezvous all four warps.
                prime:
                  execution_mode: serial
                  meaning: 'Resolve the first min(3,count(t)) assigned items into Metadata. Each lane retains five
                    lookup fields: compact row origin, valid row extent, output column origin, and weight payload/scale
                    coordinates. Advance the static assignment cursor once per resolved item; no shared row-index
                    table is used. Empty work makes this action a no-op.'
                fetch:
                  execution_mode: serial
                  meaning: Using this item's Metadata, load both operands' scale images into the single ScalePrefetch
                    register set. Load ActS for all BM rows, redirecting padding rows to the first valid row; load
                    prepared gemm2_weights_scale for all BN2 columns. The previous prefetched set has already been
                    published before this overwrite. These ordinary loads may overlap an issued MMA.
                publish:
                  execution_mode: serial
                  meaning: Scatter ScalePrefetch into AScale and BScale for the indicated item and establish shared-to-async
                    visibility. The register set is then reusable. Acquire supplies the CTA rendezvous before the
                    current scale images are consumed.
                load: Warp 0 issues the ActQ and gemm2_weights tensor boxes from this item's Metadata into PayloadA
                  and PayloadB. Arm completion for their combined 32768 bytes. Done covers both payload transfers;
                  consecutive payload rows and padding follow the fc2 definition.
                wait:
                  execution_mode: serial
                  meaning: Previous(t,q) or Final(b) waits for its explicit MMA predecessor and rendezvous all four
                    warps before accumulator readout. Previous also protects the payload slot reused by item t+2
                    and the scale slot reused by item t+1. q identifies the noninitial-iteration wait. Final establishes
                    TMEM read visibility.
                commit:
                  execution_mode: serial
                  meaning: MetadataUpdate(t) commits the preceding iteration's Pending for item t+2 to Metadata(t+2),
                    after the preceding item's readout and close. The new item aliases that preceding item's metadata
                    slot; delaying the commit preserves its output coordinates. With no pending item this action
                    touches no slot and is a no-op.
                acquire:
                  execution_mode: serial
                  meaning: Wait for the current payload transaction completion, rendezvous the CTA and establish
                    shared-to-async visibility for its scales. Done makes PayloadA, PayloadB, AScale and BScale
                    readable.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: The elected warp-0 issuer copies both scale images into ScaleTM, then issues the four
                    ordered 64-channel block-scaled updates of C2 and one cumulative completion commit. The first
                    update initializes C2 without reading the previous item's accumulator. Done covers scale copies,
                    operand reads and accumulator updates. Same-issuer ordering makes each scale image visible before
                    its consuming update. Future scale fetch and metadata resolve may proceed while this MMA is
                    in flight.
                resolve:
                  execution_mode: serial
                  meaning: Resolve item t+3 into Pending if it belongs to this worker's assigned sequence, advancing
                    the same cursor used by prime. Retain it until the next iteration's commit; do not overwrite
                    Metadata here because the current item's epilogue still needs it. If no such item exists, touch
                    neither Pending nor Metadata.
                drain:
                  execution_mode: serial
                  meaning: Each warp owns its hardware TMEM quadrant, one row per lane. Load the next 32 columns
                    into Fragment and wait for all these TMEM reads to retire, including padding rows.
                emit:
                  execution_mode: serial
                  meaning: Convert Fragment to BF16 and directly submit valid-row stores to RouteResult using this
                    item's Metadata. Done consumes Fragment; kernel completion supplies global visibility. Padding
                    rows submit no stores, and there is no shared output sink.
                close:
                  execution_mode: serial
                  meaning: Rendezvous all four warps after this item's last TMEM read and store submission. Its
                    accumulator and metadata slots may now be reused, while ordinary global stores may remain in
                    flight. Payload prefetch for later items is not drained here.
                retire:
                  execution_mode: serial
                  meaning: After the final readout and close, warp 0 deallocates TensorStorage. Every issued payload
                    and scale load has been consumed. Empty assigned sequences make this action a no-op; global
                    stores complete with the kernel, without a bulk-store drain.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              - prime:Metadata
              - repeat: {p: [0, 'min(1,count(t))']}
                steady:
                - fetch:ScalePrefetch(p)
                - publish:Scales(p)
              - repeat: {p: [0, 'min(2,count(t))']}
                steady:
                - load:PayloadPair(p)
              - repeat: {p: [1, 'max(1,min(2,count(t)))']}
                steady:
                - fetch:ScalePrefetch(p)
              steady:
              - repeat: {q: [0, 'min(1,t)']}
                steady:
                - wait:Previous(t,q)
              - repeat: {b: ['max(0,t-1)', t]}
                steady:
                - {repeat: c, steady: ['drain:Fragment(b,c)', 'emit:RouteResult(b,c)']}
                - close:Readout(b)
              - commit:MetadataUpdate(t)
              - repeat: {s: ['min(t+1,count(t))', 'min(t+2,count(t))']}
                steady:
                - publish:Scales(s)
              - repeat: {p: ['min(t+2,count(t))', 'min(t+3,count(t))']}
                steady:
                - load:PayloadPair(p)
              - acquire:Operands(t)
              - mma:PayloadA(t)@PayloadB(t)
              - repeat: {s: ['min(t+2,count(t))', 'min(t+3,count(t))']}
                steady:
                - fetch:ScalePrefetch(s)
              - resolve:Pending(t)
              epilogue:
              - repeat: {b: ['max(0,count(t)-1)', count(t)]}
                steady:
                - wait:Final(b)
                - {repeat: c, steady: ['drain:Fragment(b,c)', 'emit:RouteResult(b,c)']}
                - close:Readout(b)
              - retire:TensorStorage
            waits_for:
              data: {'acquire:Operands(t)': ['load:PayloadPair(t)', 'publish:Scales(t)']}
              reuse: {'wait:Previous(t,q)@done': ['mma:PayloadA(t-1)@PayloadB(t-1)'], 'wait:Final(b)@done': ['mma:PayloadA(b)@PayloadB(b)']}
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices
                  and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order
                  using finalize's FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier
                  is required. Empty routing still writes zeros.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:Y']}
realization:
  require:
  - item:
    - design.tile_pipeline::fc1.MMA
    - design.tile_pipeline::fc2.Main
    choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale copies, with cumulative tcgen05.commit
      completion and tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: Scale visibility and operand-slot reuse depend on ordered scale reads and cumulative MMA completion.
  - item:
    - design.tile_pipeline::fc1
    - design.tile_pipeline::fc2.Main
    choice: Use tcgen05.ld with tcgen05.wait::ld before releasing or reusing an accumulator quadrant, using the
      issuing warp's hardware quadrant.
    reason: Register fragments must be materialized and TMEM reads retired before accumulator overwrite or deallocation.
  - item: design.tile_pipeline::fc2.Main
    choice: Use TMA tensor-box transfers with mbarrier transaction-byte completion for PayloadPair. Publish register-staged
      scales with fence.proxy.async.shared::cta and the acquire CTA rendezvous.
    reason: Payload completion and visibility of ordinary shared scale stores are separate prerequisites of the
      scale-copy and MMA sequence.
  - item:
    - design.work_schedule::count
    - design.work_schedule::scan
    - design.work_schedule::scatter
    - design.work_schedule::gather
    - design.work_schedule::fc1
    - design.work_schedule::fc2
    - design.work_schedule::finalize
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents
      protocol for eager and recorded work.
    reason: Launch permission and visible predecessor results are separate guarantees.
