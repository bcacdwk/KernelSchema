meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: verify_split_ws
    parent: split_ws
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved routing
      preparation threshold, and zflag/zflag_host are the optional device
      verification state and its pinned host mirror.
      All implementation controls, including those used to construct a and
      any reused graph, follow the frozen default implementation scope.
      Let R = T*K. Select exactly when the call reuses a, a.cfg = 99,
      a.cfg2 = 57, a.zflag != 0, a.zflag_host = 0, R < 32,
      R <= a.small_thresh, and moe_run returns zero through either
      a single caller-stream run_pipeline call or graph_replay's ordinary
      full-graph arm. Every private-stream run_pipeline call in this request,
      if present, is capture-only following a successful cudaStreamBeginCapture;
      there is no additional uncaptured pipeline submission on that stream.
      This includes eager submission, first replay after successful graph
      construction, and existing-graph replay when they have this same work.
      During outer-graph capture these calls only record the selected request;
      the plan's computation and completion events occur on its later replay.
      Use the ABI choices and bindings fixed at recording, while device tensor
      reads use the contents at execution. Reusing a does not rerun route_hist,
      table initialization, workspace construction or the ABI zero probe.
      The non-null device flag records an accepted ABI-construction zero probe,
      not a prediction of the current verification result. R<32 implies
      T*H<2^20 throughout the Contract, so the default pinned-mirror gate is off.
      Both clean and dirty current contents select this same six-kernel plan.
design:
  math_reshape:
    thesis: Verify current zero-input eligibility and overwrite output with zero before the guarded split-K/WS chain.
      Clean calls keep that output and full-chain scratch unchanged; dirty calls pay the extra scan and zero write before the
      two-slice FC1, separate merge/quantization and direct-store FC2.
    rewrite:
    - step: verify_zero
      name: Recheck current bytes and write the initial output version
      math: |
        R = T*K. For a stored byte b, bits(b,m) denotes integer bitwise AND.
        ZeroClean = int32(1) exactly when all of the following current-input
        predicates hold, and int32(0) otherwise:
        bits(b,119)=0 for every hidden_states byte;
        bits(b,127)!=127 for every hidden_states_scale byte;
        every route_weights, gemm1_alpha and gemm1_beta element is finite;
        every gemm1_clamp_limit element is finite when that input is not None.
        All predicate elements are scanned, without short-circuiting after a failure.
        No route ID or weight tensor is scanned by this verification.
        Active = int32(1-ZeroClean).
        YZero[t,h] = bf16(0) for every t in [0,T), h in [0,H).
        YZero is stored unconditionally as the initial version in caller output,
        including on dirty calls; it is not a separate output allocation.
        The later guarded finalize defines the final Y version in that same storage.
      symbol:
        ZeroClean: {meaning: Current device verification verdict consumed by every guarded kernel, shape: [], dtype: int32,
          retention: keep_value invocation}
        Active: {meaning: One for dirty full-chain work and zero for clean early returns, shape: [], dtype: int32}
        YZero: {meaning: Initial all-zero version written into caller output before the guarded chain, shape: [{token: T},
            {hidden: H}], dtype: bf16, retention: keep_value invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        If Active=0, set the logical active sizes M=J=PaddedRows=0 without
        reading route_ids or any retained routing scratch. All routing arrays keep
        their previous bytes and have no current route meaning.
        Only for Active=1, evaluate the following routing definitions and writes:
        Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos: {meaning: Inverse compact-route map used by finalize, shape: [{token: T}, {slot: K}], dtype: int32,
          retention: keep_value invocation}
        PackedToken: {meaning: Compact token index used for direct FC1 input gathering, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index used by the separate activation pass, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
    - step: fc1_partial
      name: Two independent joint up and gate contractions
      math: |-
        BN1, BK and SK are bound by work_schedule. For each row tile j,
        intermediate group n in [0,I/BN1), and slice s in [0,SK), let e=TileExpert[j].
        B1 concatenates W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:].
        For valid rows, X1[r,:]=A[PackedToken[base(j)+r],:].
        For each slice, C1(-1)=0 and
        C1(l)=mma32(X1[:,s*H/SK+l*64:s*H/SK+(l+1)*64],
                   B1[:,s*H/SK+l*64:s*H/SK+(l+1)*64]^T,C1(l-1)),
        for l=0..H/(64*SK)-1.
        Save the final C1 up/gate columns into
        Part[s,base(j)+r,n*BN1:(n+1)*BN1] and
        Part[s,base(j)+r,I+n*BN1:I+(n+1)*BN1], only for r<valid(j).
        All BM rows undergo contraction. Padded input rows contain retained,
        unspecified operand bytes; a final partially filled four-row payload group
        duplicates the first valid token in its extra rows, while their scales
        remain unspecified. No padded accumulator is stored.
        Part has an SK-by-R-by-2I backing allocation; its rows [M,R) retain prior
        bytes and have no current route meaning. C1 is local to its slice.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        SK: {meaning: Number of independent FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 slice worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32,
          retention: 'carry_forward (j,n,s); l=-1..H/(64*SK)-1'}
        Part: {meaning: FP32 slice partials for valid compact routes, shape: [{slice: SK}, {route: M}, {channel: 2*I}],
          dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: Each 64-channel contraction uses native E2M1 payloads and E4M3 block scales with FP32 accumulation;
          four updates form a BK stage. Slice accumulators start independently, changing the reduction grouping. This
          notation does not assert FP32 products or reference-order bit equality.
    - step: merge_quantize
      name: Merge slices then apply non-folded activation and quantization
      math: |
        If Active=0, Qrows is empty, Q=0, and Part, PackedExpert, ActQ and ActS
        backing storage is neither read nor written.
        Only for Active=1, evaluate the following backing-row pass:
        For every backing row r in [0,R) and block b in [0,I/Block), read all SK
        up/gate partial vectors before reading the stored compact expert ID.
        On r<M these are Part[:,r,:] and PackedExpert[r]; on r>=M both reads
        use retained backing bytes, without initialization in this invocation.
        Let Qrows={r in [0,R) | the read expert ID is in [0,E)} and Q=count(Qrows).
        Only Qrows proceeds to the following arithmetic and packed stores.
        For channel h=Block*b+c, c in [0,Block), up_partial(s) and gate_partial(s)
        denote the read slice-s entries at h and I+h. Set U(-1)=Vg(-1)=0;
        U(s)=U(s-1)+up_partial(s), Vg(s)=Vg(s-1)+gate_partial(s),
        s=0..SK-1 in ascending slice order, with FP32 addition.
        Take u=U(SK-1), v=Vg(SK-1), and apply Contract's asymmetric clamp
        when enabled for the read expert e.
        Let L=fp32(-1.44269504), ia=rcp_rn(gemm1_alpha[e]),
        ib=rcp_rn(gemm1_beta[e]), where rcp_rn is the correctly rounded FP32 reciprocal.
        Define S(x)=rcp_approx(1+exp2_ftz(x*L)).
        For activation_type=3, a=(v*S(v*gemm1_alpha[e]))*(u+gemm1_beta[e]).
        For type 10, xg=v*ia, xu=u*ib,
        g=gemm1_alpha[e]*fma32(S(xg+xg),2,-1),
        w=gemm1_beta[e]*fma32(S(xu+xu),2,-1), and a=(g*S(v))*w.
        The unused beta reciprocal for type 3 does not enter a.
        Within each 16-channel block, peak=max(abs(a)),
        scale=fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq=a*rcp_rn(max(scale,fp32(1.17549435e-38))).
        Round zq to E2M1 using Contract's RNE/saturation rule; even channels
        occupy low nibbles. For r<M save payload as ActQ and scale as ActS.
        Rows r>=M that pass the expert check undergo the same arithmetic and
        overwrite the corresponding unused ActQ/ActS backing rows; rejected
        rows retain their bytes. No tail value is a valid route result.
        Scale-zero blocks still execute the reciprocal, multiply and conversion.
        The merged FP32 up/gate and activated values are consumed locally.
      symbol:
        U: {meaning: FP32 up partial sum for one backing row and channel, shape: [], dtype: fp32, retention: 'carry_forward
            (r,h); s=-1..SK-1'}
        Vg: {meaning: FP32 gate partial sum for one backing row and channel, shape: [], dtype: fp32, retention: 'carry_forward
            (r,h); s=-1..SK-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32 and rcp_approx is rcp.approx.f32. Sigmoid-based tanh and reciprocal-multiply
          quantization replace the reference evaluation. The sigmoid arguments preserve the indicated intermediate rounding
          without folded prescales. unknown: no verified uniform output error bound for the declared domain is supplied.'
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows read consecutive ActQ backing rows base(j)+r; payload beyond
        R is zero-filled, while their scale row is redirected to base(j).
        In-bounds unused backing bytes are not assumed zero. Padded results are discarded.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}
      arithmetic:
        accumulate: Native block-scaled multiplication and accumulation semantics are those of fc1_partial; FC2 uses
          one uninterrupted reduction over I.
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        If Active=0, Y[t,h]=YZero[t,h]; no scratch, scores or output are read and
        no further output store is issued.
        Only for Active=1, evaluate the following recurrence and overwrite:
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)); overwrite the caller output.
        In both cases return the existing one-element output list alias.
      symbol:
        Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}
    ledger:
      baseline: On dirty inputs, Contract evaluation for M valid routes with materialized FP32 FC1 outputs and activation
        before QDQ, and the same BF16 route results. Clean-input comparison uses that unguarded Contract evaluation;
        route-count-dependent differences below apply only to dirty inputs.
      matmul:
      - item: Expert contractions
        change: 'When Active=1: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows'
        by:
        - fc1_partial
        - fc2
      vector:
      - item: Merge and activation
        change: 'When Active=1: Add 2*SK*Q*I FP32 additions; M*I -> Q*I activation/quantization channel evaluations,
          plus O(R+RouteGroups*E+E+J*log2(E)) routing work per invocation'
        by:
        - routing
        - merge_quantize
      - item: Current-input verification
        change: Add O(T*H+R+E) bit tests, finite checks and OR reduction per invocation; Active=0 executes no routing,
          contraction, activation or final route reduction
        by:
        - verify_zero
      footprint:
      - item: Intermediate materialization
        change: 'When Active=1: 12*M*I FP32 FC1/Act bytes -> 8*SK*M*I partial bytes plus 9*M*I/16 packed bytes per invocation;
          no gathered input slab; backing capacities use R in place of M'
        by:
        - fc1_partial
        - merge_quantize
      - item: Verification verdict
        change: Add one retained int32 verdict, 4 logical bytes per invocation; YZero aliases the existing output, and clean calls do not overwrite
          the retained full-chain scratch
        by:
        - verify_zero
      traffic:
      - item: Partial exchange
        change: 'When Active=1: 16*M*I FC1 write/read bytes -> 8*SK*(M+R)*I partial write/read bytes per invocation;
          all R rows are read before expert rejection, excluding local activation and packed-output traffic'
        by:
        - fc1_partial
        - merge_quantize
      - item: Verification scan and output initialization
        change: Add 41*T*H/16+4*R+8*E bytes per invocation, plus 4*E bytes when a clamp limit is present, excluding flag
          atomics; on clean calls this replaces the full-chain data traffic
        by:
        - verify_zero
      depth:
      - item: FC1 reduction
        change: 'When Active=1: H/64 -> H/(64*SK) native accumulator updates per slice followed by SK FP32 merge additions
          per output channel'
        by:
        - fc1_partial
        - merge_quantize
      error:
      - item: Numerical evaluation
        change: 'When Active=1: Split accumulation and approximate non-folded activation change M*I valid channels; auxiliary
          tail arithmetic has no route output; final FMA reduction affects T*H outputs; uniform output error bound is
          not established'
        by:
        - fc1_partial
        - merge_quantize
        - finalize
  work_schedule:
    thesis: Submit verification followed by all five guarded computational kernels. The verification grid cooperatively
      produces a fresh device verdict and the initial output version; clean calls retain every submitted kernel and its
      completion event but perform no full-chain data work. Dirty calls retain static strided split-K/WS work and its
      partial exchange. Same-stream ordering covers retained ABI scratch and verification state across calls; there is
      no cross-stream exclusion or host completion wait.
    flow:
      launch:
      - {phase: [verify], protocol: pdl}
      - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: prepare.launch_ready}
      - {phase: [activate], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: activate.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        ZeroClean:
          producer: verify
          consumer:
          - prepare
          - fc1
          - activate
          - fc2
          - finalize
          storage: global
          ready: verify.kernel_done
          wait_at:
          - prepare.verdict_ready
          - fc1.verdict_ready
          - activate.verdict_ready
          - fc2.verdict_ready
          - finalize.verdict_ready
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [finalize], storage: global, ready: prepare.kernel_done}
        ActQ: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        ActS: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        PackedToken: {producer: prepare, consumer: [fc1], storage: global, ready: prepare.kernel_done}
        PackedExpert: {producer: prepare, consumer: [activate], storage: global, ready: prepare.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
    phase:
      verify:
        describe: Scan current zero-input predicates, initialize caller output and reduce the device verdict.
        decomposition:
          strategy: VerifyCTAs=min(T,296). One cooperative grid worktile performs independent flattened traversals of
            the full predicate arrays and YZero. Its members collectively reduce the predicate to one ZeroClean value
            within the same submission. No flag initialization kernel or host mirror write is submitted in this request.
          partition: {}
          worktile:
            invariant:
              hidden_states: {shape: [{token: T}, {packed_hidden: H/2}], dtype: uint8}
              hidden_states_scale: {shape: [{token: T}, {hidden_block: H/Block}], dtype: fp8_e4m3fn}
              route_weights: {shape: [{token: T}, {slot: K}], dtype: fp32}
              gemm1_alpha: {shape: [{expert: E}], dtype: fp32}
              gemm1_beta: {shape: [{expert: E}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: E}], dtype: fp32}
          target:
            single_tile:
              ZeroClean: {shape: [], dtype: int32}
              YZero: {shape: [{token: T}, {hidden: H}], dtype: bf16}
        mapping:
          strategy: Member v in [0,VerifyCTAs) visits flattened chunks [256*v+256*VerifyCTAs*l,256*v+256*VerifyCTAs*l+256),
            clipped to each traversal extent, for l>=0. Output chunks count eight BF16 elements, payload chunks count
            four bytes, and scale, score and parameter chunks count one element. These traversals are separate local
            loops, not a Cartesian product. The optional limit is traversed only when present; every member participates
            in the final reduction even with an empty traversal.
          worker: {unit: CTA, unit_count: VerifyCTAs}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: 1}
            refill: none
            exit: assigned_done
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: Before full-chain data work, every submitted worker consumes ZeroClean through its guard. Active=0 performs no full-chain data work
            or scratch access; its submission and protocol/completion events remain. BM=128, RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32).
            Groups cover contiguous, clipped ranges of flattened route slots; these are local subdivisions of one worktile,
            not independent work. Stage all IDs once, form group histograms and their exclusive expert bases, scan expert
            counts and tile counts, then assign local atomic ranks and enumerate J tiles by binary search of TilePrefix.
            This worktile writes all Counts, both E+1 prefixes and every RoutePos; packed maps and tile maps write only
            their used prefixes. No separate count initialization or global reservation-counter update is needed. The
            sole assigned worktile is a no-op on clean calls; its retained routing arrays are not cleared.
          partition: {}
          worktile:
            invariant:
              route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}
              ZeroClean: {shape: [], dtype: int32}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: 1}
            refill: none
            exit: assigned_done
      fc1:
        describe: Contract one hidden-channel slice into raw FP32 up/gate partials.
        decomposition:
          strategy: Before full-chain data work, every submitted worker consumes ZeroClean through its guard. Active=0 performs no full-chain data work
            or scratch access; its submission and protocol/completion events remain. BN1=64, BK=256, SK=2. One row tile,
            slice and intermediate column group form a worktile with H/(SK*BK) local stages, each containing four 64-channel
            updates. Slice s spans [s*H/SK,(s+1)*H/SK). PackedToken maps valid compact rows directly to hidden_states
            and hidden_states_scale; clipped padding follows fc1_partial. TileCap=ceil_div(R,BM)+min(E,R) is the saved
            row-tile upper bound. Let Cap be twice the queried SM count, or zero if that query failed. For Nx column/slice
            groups, G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap). Submit G(SK*I/BN1) workers
            independently of J; when J=0 the submitted workers have empty work sequences. On clean calls J=0 is the logical
            empty work count defined by routing, not a read of stale TilePrefix.
          partition:
            row_tile: {size: J, tile: 1}
            slice: {size: SK, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              PackedToken: {shape: [{row: BM}], dtype: int32}
              ZeroClean: {shape: [], dtype: int32}
            iteration:
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              hidden_states: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              Part: {shape: [{row: BM}, {channel: 2*BN1}], dtype: fp32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(SK*I/BN1)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: slice, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      activate:
        describe: Merge all slice partials for a packet of quantization blocks and write packed activations.
        decomposition:
          strategy: Before full-chain data work, every submitted worker consumes ZeroClean through its guard. Active=0 performs no full-chain data work
            or scratch access; its submission and protocol/completion events remain. Flatten (backing row r, intermediate
            block b) with b fastest into f=r*(I/Block)+b. A worktile covers up to 64 consecutive f values; it may span
            rows. Visit the entire R-row backing domain even when M=0. All slice loads precede expert validation; merge_quantize
            specifies which rows compute and store. The Part and PackedExpert handoffs supply their current valid prefixes;
            auxiliary tail reads use retained backing bytes, not a synthesized current route or a zero initializer. Per-block
            alpha, beta and optional clamp inputs are read only after expert validation. On clean calls these preassigned
            worktiles are no-ops; their target stores are not performed.
          partition:
            quant_block: {size: R*I/Block, tile: 64}
          worktile:
            invariant:
              Part: {shape: [{slice: SK}, {quant_block: 64}, {channel: 2*Block}], dtype: fp32}
              PackedExpert: {shape: [{quant_block: 64}], dtype: int32}
              gemm1_alpha: {shape: [{quant_block: 64}], dtype: fp32}
              gemm1_beta: {shape: [{quant_block: 64}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{quant_block: 64}], dtype: fp32}
              ZeroClean: {shape: [], dtype: int32}
          target:
            single_tile:
              ActQ: {shape: [{quant_block: 64}, {packed_intermediate: Block/2}], dtype: uint8}
              ActS: {shape: [{quant_block: 64}], dtype: fp8_e4m3fn}
            tile_reduction:
              dimension: slice
              input: design.math_reshape::Part
              output:
              - design.math_reshape::ActQ
              - design.math_reshape::ActS
              method: design.math_reshape::merge_quantize
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R*I/Block,64)
        schedule:
          worktile_order:
          - {by: quant_block, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: Before full-chain data work, every submitted worker consumes ZeroClean through its guard. Active=0 performs no full-chain data work
            or scratch access; its submission and protocol/completion events remain. BN2=128; reuse BM, BK, TileCap and
            G from fc1. Each worktile traverses I/BK local stages. Only valid(j) output rows are stored. All submitted
            workers remain present when J=0, but their assigned sequences are empty. On clean calls J=0 is the logical
            empty work count defined by routing, not a read of stale TilePrefix.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              ZeroClean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(H/BN2)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: Before full-chain data work, every submitted worker consumes ZeroClean through its guard. Active=0 performs no full-chain data work
            or scratch access; its submission and protocol/completion events remain. FinalWidth=4 for T<=128, otherwise
            8. One worker produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are a local
            reduction; masked routes do not read the route-result slab. On clean calls these preassigned worktiles are
            no-ops; their target stores are not performed.
          partition:
            token: {size: T, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos: {shape: [{slot: K}], dtype: int32}
              route_weights: {shape: [{slot: K}], dtype: fp32}
              ZeroClean: {shape: [], dtype: int32}
            iteration:
              RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: T*ceil_div(H,128*FinalWidth)
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: The verifier scans and initializes output with cooperative OR/ticket publication. All later kernels read
      the fresh verdict after predecessor visibility; clean returns preserve their entry and completion events without
      touching full-chain scratch. Dirty FC1 retains independent payload/scale reuse, while FC2 couples reuse at two
      stages and releases its accumulator only after four direct-store chunks.
    phase:
      verify:
        resource:
          DirtyVote: {space: register, member_slot_shape: [{element: 256}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              member: warp[0:8]
              execution_mode: serial
              verb:
                enter: All member threads wait for predecessor-grid completion and visibility; warp 0 in each member
                  then grants dependent-grid launch permission. This permission does not publish the verdict or output.
                produce: Submit the assigned YZero stores into caller output. Done marks store submission; full kernel
                  completion supplies visibility of all output regions.
                compute: Initialize one DirtyVote per participating thread to zero, then scan its assigned payload, activation-scale,
                  score and parameter chunks in separate loops using verify_zero predicates. Accumulate dirty bits without
                  early termination. No route ID, weight payload or weight scale is read.
                publish: 'The retained global ABI state has four int32 words: verdict, dirty OR, arrivals and one unused
                  reserved word. Dirty OR and arrivals start at zero from ABI construction or the preceding completed
                  verification. Reduce DirtyVote with a CTA-wide Boolean OR. A dirty member atomically ORs one into the retained
                  global dirty word. Its elected thread makes that update visible before taking one atomic arrival ticket;
                  clean members also take a ticket. The last member reads the aggregate, stores ZeroClean and resets
                  dirty and arrivals to zero. Nonlast members finish after their arrival; last-member completion includes
                  verdict publication and reset. Consumers wait for full kernel completion, not merely the ticket or
                  launch permission. There is no host-mirror write.'
            pipe:
              prologue:
              - enter:Protocol
              steady:
              - produce:YZero
              - compute:Checks
              - publish:ZeroClean
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1, view: {route_ids: {}}}
          GroupTable:
            space: SMEM
            member_slot_shape:
            - {group: RouteGroups}
            - {expert: 256}
            dtype: int32
            slot_count: 1
            view:
              Hist(g): {part: {group: [g, g+1], expert: [0, E]}}
              RankCursor(g): {part: {group: [g, g+1], expert: [0, E]}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then grants
                  dependent-grid launch permission. This grants no data readiness. The entry executes even if this worker
                  has no payload work.
                produce: 'On Active=0 this declared action is a no-op with issue/done and no data access or store. On
                  Active=1: Stage every route ID once into StagedIds and zero the full GroupTable, including the unused
                  expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous
                  before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive reservation bases of
                  routing, and writes Counts. Another rendezvous precedes the paired expert scans; ScanScratch holds
                  two 64-word scan arrays and J. Publish Offs and TilePrefix both globally and into their local caches,
                  then rendezvous before scatter and tile enumeration. Each warp advances its own RankCursor by atomics
                  while writing RoutePos and all three packed maps. Enumerate and store TileExpert and TileRow from the
                  cached tile prefix. StagedIds and the prefix caches survive through their last reads; GroupTable is
                  overwritten only after histogram production is complete. M=0 still writes zero Counts/prefixes and
                  RoutePos=-1, with no packed or tile stores.'
                guard: Wait for full predecessor-grid completion and visibility, then read the current global ZeroClean.
                  Done records the uniform clean/dirty decision for this CTA. Clean has no subsequent full-chain data
                  accesses; the submitted kernel and its completion event remain.
            pipe:
              prologue:
              - enter:Protocol
              - guard:ZeroClean
              steady:
              - produce:RoutePos
        milestone:
          verdict_ready:
          - Main/guard:ZeroClean
      fc1:
        domain:
          t: worktile
          i:
          - 0
          - H/(SK*BK)
          g: {flatten: [t, i]}
          c:
          - 0
          - 2
        resource:
          PayloadA: &id006 {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: &id007 {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3,
            view: {PayloadB(g): {slot_index: g%3}}}
          AScale: &id008 {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: &id009 {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: &id010 {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1, view: {
              C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: 'On Active=0 this post-guard entry is a no-op: no trigger, routing-scratch read, rendezvous or
                  TMEM allocation occurs; launch_ready is supplied by kernel completion. On Active=1, all threads perform
                  the PDL wait and warp 0 triggers dependent launch, then read J. If J=0 there is no TMEM allocation
                  and the work domains are empty. Otherwise warp 0 initializes the completion protocol and allocates
                  TensorStorage; all seven warps rendezvous before their independent loops. Even workers with no assigned
                  item participate in this initialization.'
                prime: Resolve the worktile's expert, row base and reduction-slice origin. PackedToken selects hidden_states_scale
                  rows. Load the slice's first stage and, when its stage count exceeds one, the second into APrefetch.
                  Load only rows below valid(j); other register and shared scale rows are not initialized. Prefetch registers
                  restart per worktile.
                publish: Scatter only valid rows of the current APrefetch set into AScale and establish shared-to-async
                  visibility. If a next stage exists in this slice, load it into the other register set before the warp
                  rendezvous and full-stage arrival. Stage 1 is loaded again after priming; that first primed copy is
                  overwritten without use. Padding rows of AScale retain their old bytes. Done includes the arrival,
                  not the independent payload/weight-scale transfers.
                retire: After this role's assigned sequence, all seven warps rendezvous and warp 0 deallocates TensorStorage.
                  For Active=0 or J=0 this declared action is a no-op with issue/done. There is no per-worktile drain
                  or extra global fence; kernel completion supplies external store visibility.
                guard: &id001
                  meaning: Wait for full predecessor-grid completion and visibility, then read the current global ZeroClean.
                    Done records the uniform clean/dirty decision for this CTA. Clean has no subsequent full-chain data
                    accesses; the submitted kernel and its completion event remain.
                  execution_mode: serial
            pipe: &id011
              repeat: t
              prologue:
              - guard:ZeroClean
              - enter:Protocol
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady:
                - publish:AScale(g)
              epilogue:
              - retire:TensorStorage
            waits_for:
              reuse:
                publish:AScale(g+2):
                - MMA/mma:PayloadA(g)@PayloadB(g)
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter: &id002
                  execution_mode: serial
                  meaning: 'On Active=0 this post-guard entry is a no-op: no trigger, routing-scratch read, rendezvous
                    or TMEM allocation occurs; launch_ready is supplied by kernel completion. On Active=1, all threads
                    perform the PDL wait and warp 0 triggers dependent launch, then read J. If J=0 there is no TMEM allocation
                    and the work domains are empty. Otherwise warp 0 initializes the completion protocol and allocates
                    TensorStorage; all seven warps rendezvous before their independent loops. Even workers with no assigned
                    item participate in this initialization.'
                load: Using PackedToken, issue ceil_div(valid(j),4) four-row gathers from hidden_states into PayloadA
                  and two contiguous up/gate weight boxes into PayloadB, at this slice's channel offset. In the last
                  partial four-row group, extra payload rows repeat the first valid token; later groups are not fetched
                  or initialized. Arm the full-stage transaction count for (2*BN1+4*ceil_div(valid(j),4))*(BK/2) bytes.
                  Done covers all these payload transfers; payload slots remain independent of scale-slot reuse.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done is
                  their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint two stages
                  ahead when that stage lies in the same worktile; the hint has no consumer or completion edge.
                retire: &id003
                  execution_mode: serial
                  meaning: After this role's assigned sequence, all seven warps rendezvous and warp 0 deallocates TensorStorage.
                    For Active=0 or J=0 this declared action is a no-op with issue/done. There is no per-worktile drain
                    or extra global fence; kernel completion supplies external store visibility.
                guard: *id001
            pipe: &id012
              repeat: g
              prologue:
              - guard:ZeroClean
              - enter:Protocol
              steady:
              - load:PayloadPair(g)
              - stage:BScale(g)
              epilogue:
              - retire:TensorStorage
            waits_for:
              reuse:
                load:PayloadPair(g+3):
                - MMA/mma:PayloadA(g)@PayloadB(g)
                stage:BScale(g+2):
                - MMA/mma:PayloadA(g)@PayloadB(g)
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter: *id002
                wait:
                  execution_mode: serial
                  meaning: Drain(t,q) completes after the four explicit prior-work accumulator releases. q identifies
                    the one noninitial-work wait; FC1 performs this wait before its first scale copy.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM:
                  four scale-copy operations for each operand. Issuance includes submission of all scale copies; only
                  then does this issuer advance to the MMA action. Done is covered by the following cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1. The
                  first update initializes C1 without reading its old value. The fused 128-column product covers both
                  up and gate. Issue a cumulative completion commit after each stage; done covers scale copies, payload
                  reads and accumulator updates. The last stage also commits result readiness for the epilogue. Same-issuer
                  ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites that scale
                  slot, and makes each scale copy visible before the MMA that uses it.
                retire: *id003
                guard: *id001
            pipe: &id013
              repeat: t
              prologue:
              - guard:ZeroClean
              - enter:Protocol
              steady:
              - repeat:
                  q:
                  - 0
                  - min(1,t)
                steady:
                - wait:Drain(t,q)
              - repeat: g[t]
                steady:
                - prepare:ScaleTM(g)
                - mma:PayloadA(g)@PayloadB(g)
              epilogue:
              - retire:TensorStorage
            waits_for: &id014
              data:
                prepare:ScaleTM(g):
                - AProducer/publish:AScale(g)
                - BProducer/load:PayloadPair(g)
                - BProducer/stage:BScale(g)
              reuse:
                wait:Drain(t,q)@done:
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id004
                enter: 'On Active=0 this post-guard entry is a no-op: no trigger, routing-scratch read, rendezvous or
                  TMEM allocation occurs; launch_ready is supplied by kernel completion. On Active=1, all threads perform
                  the PDL wait and warp 0 triggers dependent launch, then read J. If J=0 there is no TMEM allocation
                  and the work domains are empty. Otherwise warp 0 initializes the completion protocol and allocates
                  TensorStorage; all seven warps rendezvous before their independent loops. Even workers with no assigned
                  item participate in this initialization.'
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For c=0
                  or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue both
                  reads before waiting, and wait for all their TMEM reads to retire. Done makes this register fragment
                  usable.
                emit: Store the 32 up and 32 gate FP32 Fragment values directly into the matching Part slice for valid
                  rows. Padding rows perform the reads but no stores. Done means store submission has consumed Fragment;
                  global stores may still be in flight.
                release: After both chunks have been drained and their raw partial stores submitted, rendezvous this
                  warp and arrive once to release its accumulator quadrant. Next-work scale preparation waits for all
                  four epilogue roles; global partial-store completion is provided by kernel completion.
                retire: After this role's assigned sequence, all seven warps rendezvous and warp 0 deallocates TensorStorage.
                  For Active=0 or J=0 this declared action is a no-op with issue/done. There is no per-worktile drain
                  or extra global fence; kernel completion supplies external store visibility.
                guard: *id001
            pipe: &id005
              repeat: t
              prologue:
              - guard:ZeroClean
              - enter:Protocol
              steady:
              - drain:Fragment(t,0)
              - emit:Part(t,0)
              - drain:Fragment(t,1)
              - emit:Part(t,1)
              - release:Accumulator(t)
              epilogue:
              - retire:TensorStorage
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id004
            pipe: *id005
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id004
            pipe: *id005
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id004
            pipe: *id005
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
        milestone: &id017
          verdict_ready:
          - AProducer/guard:ZeroClean
          - BProducer/guard:ZeroClean
          - MMA/guard:ZeroClean
          - Epilogue/guard:ZeroClean
          - Epilogue0/guard:ZeroClean
          - Epilogue1/guard:ZeroClean
          - Epilogue2/guard:ZeroClean
      activate:
        resource:
          PartialLoad: {space: register, member_slot_shape: [{slice: SK}, {quant_block: 64}, {channel: 2*Block}], dtype: fp32,
            slot_count: 1}
          Merged: {space: register, member_slot_shape: [{quant_block: 64}, {channel: 2*Block}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{quant_block: 64}, {channel: Block}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor grid completion and visibility; warp 0 grants dependent-grid
                  launch permission. This does not grant data readiness.
                load: 'On Active=0 this declared action is a no-op with issue/done and no data access or store. On Active=1:
                  Four neighboring threads own each 16-channel quantization block, with four up and four gate channels
                  per thread. For every in-range backing row, load both slice vectors into PartialLoad before the expert-ID
                  test. Out-of-range packet lanes do no reads; unused route rows still load allocated backing bytes.
                  Done means these vectors are available locally.'
                produce: 'On Active=0 this declared action is a no-op with issue/done and no data access or store. On
                  Active=1: Read PackedExpert''s backing row and reject out-of-range IDs before any per-expert parameter
                  access. Accepted groups merge the retained slices into Merged in ascending order, then compute merge_quantize
                  into Activated. Four-lane maximum exchange combines all 16 absolute values; paired neighbor exchange
                  assembles packed payload words. Store ActQ and one ActS byte per accepted block, including unused backing
                  rows that pass the check. No cross-block or cross-CTA exchange is needed. Rejected groups perform no
                  arithmetic or stores, but the action still completes. PartialLoad is dead after the merge; Merged is
                  dead after activation; Activated is dead after quantization and store submission.'
                guard: Wait for full predecessor-grid completion and visibility, then read the current global ZeroClean.
                  Done records the uniform clean/dirty decision for this CTA. Clean has no subsequent full-chain data
                  accesses; the submitted kernel and its completion event remain.
            pipe:
              prologue:
              - enter:Protocol
              - guard:ZeroClean
              steady:
              - load:PartialLoad
              - produce:ActQ
        milestone:
          verdict_ready:
          - Main/guard:ZeroClean
      fc2:
        domain:
          t: worktile
          i:
          - 0
          - I/BK
          g: {flatten: [t, i]}
          c:
          - 0
          - BN2/32
        resource:
          PayloadA: *id006
          PayloadB: *id007
          AScale: *id008
          BScale: *id009
          APrefetch: *id010
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1, view: {
              C2: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: 'On Active=0 this post-guard entry is a no-op: no trigger, routing-scratch read, rendezvous or
                  TMEM allocation occurs; launch_ready is supplied by kernel completion. On Active=1, all threads perform
                  the PDL wait and warp 0 triggers dependent launch, then read J. If J=0 there is no TMEM allocation
                  and the work domains are empty. Otherwise warp 0 initializes the completion protocol and allocates
                  TensorStorage; all seven warps rendezvous before their independent loops. Even workers with no assigned
                  item participate in this initialization.'
                prime: Resolve this worktile's expert and row base. Load ActS for the first stage and, when the stage
                  count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting padding scales to
                  the first valid row. Prefetch registers restart per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility. If
                  a next stage exists in this worktile, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy is overwritten
                  without use. Done includes this arrival, not completion of the independent payload/weight-scale loads.
                retire: After this role's assigned sequence, all seven warps rendezvous and warp 0 deallocates TensorStorage.
                  For Active=0 or J=0 this declared action is a no-op with issue/done. There is no per-worktile drain
                  or extra global fence; kernel completion supplies external store visibility.
                guard: *id001
            pipe: *id011
            waits_for:
              reuse:
                publish:AScale(g+2):
                - MMA/mma:PayloadA(g)@PayloadB(g)
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter: *id002
                load: Stage PayloadA from ActQ and PayloadB from the selected FC2 weights. Arm the full-stage protocol
                  for 32768 bytes; done covers both tensor transfers. Padding payload rows remain consecutive while AProducer
                  redirects their scale rows. The coupled reuse wait gates payload issue and the following weight-scale
                  staging at a two-stage distance, although payload storage has three slots. No weight-payload L2 hint
                  is issued here.
                stage: Copy the prepared FC2 scale image with 16-byte asynchronous copies, four per lane, into BScale.
                  Done includes the copy-completion arrival in the full-stage protocol; no independent scale-prefetch
                  hint.
                retire: *id003
                guard: *id001
            pipe: *id012
            waits_for:
              reuse:
                load:PayloadPair(g+2):
                - MMA/mma:PayloadA(g)@PayloadB(g)
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter: *id002
                wait:
                  execution_mode: serial
                  meaning: Drain(t,q) completes after the four explicit prior-work accumulator releases. q identifies
                    the one noninitial-work wait, before the first scale copy.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM:
                  four scale-copy operations for each operand. Issuance includes submission of all scale copies; only
                  then does this issuer advance to the MMA action. Done is covered by the following cumulative MMA completion.'
                mma: Execute four ordered 64-channel block-scaled updates of C2, with first-update initialization and
                  cumulative stage completion. Done covers preceding scale copies and operand reads; last-stage commit
                  also publishes the result. Same-issuer scale-copy/MMA ordering protects ScaleTM reuse and copy-to-MMA
                  visibility.
                retire: *id003
                guard: *id001
            pipe: *id013
            waits_for: *id014
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id015
                enter: 'On Active=0 this post-guard entry is a no-op: no trigger, routing-scratch read, rendezvous or
                  TMEM allocation occurs; launch_ready is supplied by kernel completion. On Active=1, all threads perform
                  the PDL wait and warp 0 triggers dependent launch, then read J. If J=0 there is no TMEM allocation
                  and the work domains are empty. Otherwise warp 0 initializes the completion protocol and allocates
                  TensorStorage; all seven warps rendezvous before their independent loops. Even workers with no assigned
                  item participate in this initialization.'
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. Read the
                  single 32-column chunk c into that quadrant's rows of Fragment and wait for its TMEM reads to retire.
                  Padding rows are read too; done makes Fragment usable.
                release: After all four chunks have been drained and their direct stores submitted, rendezvous this warp
                  and arrive once to release its accumulator quadrant. Next-work scale preparation waits for all four
                  epilogue roles; kernel completion supplies global store visibility.
                emit: For valid rows, convert Fragment to BF16 and submit direct stores into the matching 32-column RouteResult
                  region. Padding rows perform no conversion or stores. Done means store submission has consumed Fragment;
                  global stores may still be in flight.
                retire: After this role's assigned sequence, all seven warps rendezvous and warp 0 deallocates TensorStorage.
                  For Active=0 or J=0 this declared action is a no-op with issue/done. There is no per-worktile drain
                  or extra global fence; kernel completion supplies external store visibility.
                guard: *id001
            pipe: &id016
              repeat: t
              prologue:
              - guard:ZeroClean
              - enter:Protocol
              steady:
              - repeat: c
                steady:
                - drain:Fragment(t,c)
                - emit:RouteResult(t,c)
              - release:Accumulator(t)
              epilogue:
              - retire:TensorStorage
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id015
            pipe: *id016
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id015
            pipe: *id016
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id015
            pipe: *id016
            waits_for:
              data:
                drain:Fragment(t,0):
                - MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])
        milestone: *id017
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then grants
                  dependent-grid launch permission. This grants no data readiness. The entry executes even if this worker
                  has no payload work.
                produce: 'On Active=0 this declared action is a no-op with issue/done and no data access or store. On
                  Active=1: Each thread owns FinalWidth independent output elements. Hoist its eight route indices and
                  scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order using
                  finalize''s FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier is required.
                  Empty routing still writes zeros.'
                guard: Wait for full predecessor-grid completion and visibility, then read the current global ZeroClean.
                  Done records the uniform clean/dirty decision for this CTA. Clean has no subsequent full-chain data
                  accesses; the submitted kernel and its completion event remain.
            pipe:
              prologue:
              - enter:Protocol
              - guard:ZeroClean
              steady:
              - produce:Y
        milestone:
          verdict_ready:
          - Main/guard:ZeroClean
realization:
  require:
  - item:
    - design.tile_pipeline::fc1.MMA
    - design.tile_pipeline::fc2.MMA
    choice: Use the source's tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale path, with cumulative
      tcgen05.commit completion and tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: Shared-slot reuse relies on the same issuer ordering scale copies before their MMA consumers, and on cumulative
      operand-read completion.
  - item:
    - design.tile_pipeline::fc1
    - design.tile_pipeline::fc2
    choice: For all epilogue roles, use tcgen05.ld with tcgen05.wait::ld before each final accumulator-release arrival,
      using the issuing warp's hardware quadrant.
    reason: TMEM register reads must retire before accumulator reuse; both contractions release only after all epilogue
      chunks have consumed their register fragments for store submission.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents protocol
      for eager and recorded work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.tile_pipeline::fc1.BProducer
    choice: Use tensor-map gather4 with the clipped box count and its matching expect_tx byte count, joining payload
      transactions with both scale producers in the full-stage protocol.
    reason: The consumer readiness event must include every issued payload byte while excluding omitted padding boxes;
      a fixed full-tile transaction count would never complete on clipped work.
  - item: design.tile_pipeline::verify.Main
    choice: Use CTA Boolean reduction, global atomicOr and atomicAdd, with a device-scope thread fence between any dirty-word
      update and the arrival ticket.
    reason: Last-arrival publication relies on seeing every member dirty contribution before reading the aggregate; only
      full kernel completion releases consumers and the next same-stream verification.
