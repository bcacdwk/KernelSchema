meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: verify_root
    parent: root
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg and cfg2
      select FC1 and FC2, small_thresh is the saved routing-preparation threshold,
      and zflag/zflag_host are the device verification state and its optional
      pinned host mirror. All implementation controls follow the frozen default
      implementation scope, including construction of a and any reused graph.
      Let R=T*K. Select exactly when the call reuses a, a.cfg=97, a.cfg2=81,
      a.zflag is nonzero, R>a.small_thresh, R<49152, and moe_run returns zero
      through either one caller-stream run_pipeline call or graph_replay's
      ordinary full-graph arm, with no preceding verify-only graph execution.
      Every private-stream run_pipeline call in this request, if present, is
      capture-only after successful cudaStreamBeginCapture; no additional
      uncaptured pipeline is submitted there. The full-graph arm is selected
      when exec_clean is absent or a.zflag_host is zero; a nonzero mirror may
      still be written by the full graph. Eager execution and a fallback after
      capture-only construction are included when they submit this same work.
      During outer capture this request is only recorded; computation and
      completion events occur on its later execution. ABI choices and bindings
      are fixed at recording, while verification and all other device reads use
      the contents at execution. Clean and dirty verification outcomes both
      belong to this node. Reuse does not repeat route_hist, table initialization,
      workspace construction or the ABI eligibility probe.
design:
  math_reshape:
    thesis: |-
      Revalidate zero activation data and unconditionally zero the output before
      the routed pipeline. A clean verdict avoids all routed payload work; a
      dirty verdict retains packed expert compaction, fused FC1 activation and
      requantization, and BF16 FC2 materialization. Verification adds a full
      activation scan and output write even when the full computation is needed.
    rewrite:
    - step: zero_verify
      name: Revalidate the zero shortcut and write the initial output version
      math: |
        R=T*K and Nchunk=9*H/256. Let Mref=count({(t,k) | 0<=t<T,
        0<=k<K, route_ids[t,k]>=0}) for the comparison baseline.
        HasLimit=1 when gemm1_clamp_limit is not None, otherwise 0. For 0 <= i < T*H/8 and 0 <= b < 4, Q4[i,b] is byte
        4*i+b of flattened hidden_states; this is a view, not a saved copy.
        VerifyIndex(s,L) partitions [0,L) among VerifyWorkers shards as bound below.
        For s in [0,VerifyWorkers), DirtyPart(s) is int32(1) if any of:
          a byte Q4[i,b] has a nonzero magnitude bit (Q4[i,b] bitwise-AND 0x77 != 0)
            for i in VerifyIndex(s,T*H/8), b in [0,4);
          a flattened hidden_states_scale byte has its low seven bits equal to 127
            for its index in VerifyIndex(s,T*H/16);
          route_weights has a nonfinite element at a flattened index in VerifyIndex(s,R);
          gemm1_alpha or gemm1_beta is nonfinite at an index in VerifyIndex(s,E);
          HasLimit=1 and gemm1_clamp_limit is nonfinite at such an expert index.
        Otherwise DirtyPart(s)=int32(0). Clean=int32(1-OR_s DirtyPart(s)).
        Always write ZeroOutput[t,h]=bf16(0) for every (t,h), before any final
        overwrite. ZeroOutput denotes the first written version of Y in the
        caller output storage; it does not allocate a second tensor.
        Active=1-Clean. When Active=0, Y=ZeroOutput. The other rewrite steps
        execute only when Active=1. On Active=0, use V={} and M=J=U=PaddedRows=0
        solely as empty-work bookkeeping; do not read stale map metadata to obtain
        these values. Counts and Fill are reset to zero for both outcomes, while
        all other routing, gathered, activation and route-result backing bytes
        remain unchanged on Active=0. No weights or weight scales are read by
        this verification; it uses the existing ABI probe's accepted eligibility.
      symbol:
        VerifyWorkers: {meaning: Number of verification shards, binding: 'bind:design.work_schedule::VerifyWorkers'}
        VerifyIndex: {meaning: Index subset assigned to a verification shard, binding: 'bind:design.work_schedule::VerifyIndex'}
        DirtyPart: {meaning: One shard dirty predicate before the global OR, shape: [], dtype: int32}
        Clean: {meaning: Current device zero-verification verdict, shape: [], dtype: int32, retention: keep_value invocation}
        Active: {meaning: Derived selector for routed payload work; not a separate stored flag}
        ZeroOutput: {meaning: Initial zero version of Y in the same caller-owned storage, shape: [{token: T}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
        Q4: {meaning: Four-byte word view of flattened hidden_states, shape: [{word: T*H/8}, {byte: 4}], dtype: uint8}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        For Active=1, let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For b = 0..ceil_div(R,RouteBatch)-1, Hist(b)[e] counts routes to e among flattened slots
        [RouteBatch*b,RouteBatch*(b+1)),
        clipped to [0,R). Counts[e] = sum_b Hist(b)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        Fill[e] starts at zero. Each route batch reserves its expert counts by
        fetch-and-add on Fill[e]; local ranks assign a bijection rho from V onto
        [0,M), with rho(t,k) in [Offs[e],Offs[e+1]) for e = route_ids[t,k].
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k]. Fill[e] ends at Counts[e].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteBatch: {meaning: Route histogram batch size, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        Fill: {meaning: Atomic expert reservation counters, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        For Active=1 and (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K}, {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        For Active=1:
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}], dtype: uint8, retention: keep_value
            invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based tanh identity and reciprocal-multiply
          quantization replace the reference evaluation. unknown: no verified uniform error bound for the full declared domain is supplied; source
          comments and local probes are not an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation; four such updates make one
          BK stage. The notation does not assert FP32 products or reference-order bit equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For Active=1:
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output
          columns change.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For Active=1:
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol:
        Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward (t,h); k=-1..K-1'}
    ledger:
      baseline: Contract evaluation for Mref valid routes, saving decoded FP32 activations, both FC1 outputs and Act before QDQ, and BF16 route
        results.
      matmul:
      - item: Expert contractions
        change: 3*Mref*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows; zero routed MACs when Active=0
        by: [zero_verify, fc1_quantize, fc2]
      vector:
      - item: Activation and quantization
        change: Mref*I -> PaddedRows*I activation/quantization channel evaluations, plus Active*O(R+ceil_div(R,RouteBatch)*E+E+J*log2(E)) routing
          work and O(T*H+R+E) verification tests per invocation
        by: [zero_verify, routing, fc1_quantize]
      footprint:
      - item: Intermediate materialization
        change: 12*Mref*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes 2*Mref*H ->
          2*M*H; ZeroOutput aliases Y
        by: [zero_verify, gather, fc1_quantize, fc2]
      traffic:
      - item: Gather
        change: Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads
        by: [gather]
      - item: Verification and initial output write
        change: Add 9*T*H/16+4*R+4*E*(2+HasLimit) input bytes read and 2*T*H output bytes written per invocation; no weight reads
        by: [zero_verify]
      error:
      - item: Numerical evaluation
        change: When Active=1, approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I channels; fixed FMA
          route reduction affects T*H outputs; uniform output error bound not established
        by: [fc1_quantize, finalize]
  work_schedule:
    thesis: |-
      Submit verification, the Counts/Fill memset service, and all seven routed
      kernels for every execution. Active makes their payload work sets empty
      on clean data, without removing launches or completion events. Each
      routed-grid entry still reads Clean when its work set is empty. Dirty data
      uses flat gather and statically strided persistent GEMMs. PDL separates
      launch permission from visible results; the memset orders count after
      verification completion. ABI workspace and verification state persist
      across requests; same-stream order protects reuse, with no cross-stream
      exclusion or host completion wait in this path.
    flow:
      launch:
      - phase: [verify]
        protocol: pdl
      - phase: [count]
        protocol: pdl
        start_after: verify.kernel_done
      - phase: [scan]
        protocol: pdl
        start_after: count.launch_ready
      - phase: [scatter]
        protocol: pdl
        start_after: scan.launch_ready
      - phase: [gather]
        protocol: pdl
        start_after: scatter.launch_ready
      - phase: [fc1]
        protocol: pdl
        start_after: gather.launch_ready
      - phase: [fc2]
        protocol: pdl
        start_after: fc1.launch_ready
      - phase: [finalize]
        protocol: pdl
        start_after: fc2.launch_ready
      handoff:
        Clean:
          producer: verify
          consumer: [count, scan, scatter, gather, fc1, fc2, finalize]
          storage: global
          ready: verify.kernel_done
          wait_at: [count.guarded, scan.guarded, scatter.guarded, gather.guarded, fc1.guarded, fc2.guarded, finalize.guarded]
        Counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, ready: count.kernel_done}
        Offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        TilePrefix: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileExpert: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileRow: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        RoutePos: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      verify:
        describe: Zero caller output and reduce current-input dirty predicates into the device verdict.
        decomposition:
          strategy: |-
            VerifyWorkers=min(T,296), VerifyWidth=256.
            VerifyIndex(s,L)={i in integers | 0<=i<L and floor(i/VerifyWidth)%VerifyWorkers=s}.
            Shard s is one complete worktile. It independently walks consecutive
            VerifyWidth-element packets of each flattened stream, starting at
            s*VerifyWidth and advancing by VerifyWorkers*VerifyWidth; clip each
            stream to its own length. These are separate local loops, not a product
            of work dimensions. Payload packets contain four bytes per Q4 word.
            The same word-index map covers output units of eight BF16 elements.
            After streaming its output stores and predicate reads, each shard
            contributes DirtyPart to the global OR and takes one arrival ticket.
            The last arrival publishes Clean and resets the dirty accumulator and
            arrival count to zero for the next execution; no grid-wide spinning.
            The ABI owns four int32 verification words: verdict, dirty accumulator,
            arrival count and an unused word. The two counters start at zero from
            ABI construction and self-reset; the unused word is untouched here.
            If a.zflag_host is nonzero, the last arrival also publishes Clean to
            that one-word pinned mirror after device-state publication. This is a
            state write even in the ordinary full-graph arm; no host polling or
            verify-only launch is part of this node.
          partition:
            shard: {size: VerifyWorkers, tile: 1}
          worktile:
            iteration:
              Q4: {shape: [{word: VerifyWidth}, {byte: 4}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{element: VerifyWidth}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{route: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              ZeroOutput: {shape: [{unit: 'count(VerifyIndex(s,T*H/8))'}, {element: 8}], dtype: bf16}
              DirtyPart: {shape: [], dtype: int32}
            tile_reduction: {dimension: shard, input: 'ref:design.math_reshape::DirtyPart', output: 'ref:design.math_reshape::Clean', method: 'ref:design.math_reshape::zero_verify'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: VerifyWorkers
        schedule:
          worktile_order:
          - {by: shard, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      count:
        describe: Form block histograms and accumulate Counts.
        decomposition:
          strategy: RouteBatch=256. A cudaMemsetAsync service zeros the adjacent E-element Counts and Fill arrays after verify.kernel_done and
            before count starts, including Active=0. Each 256-route worktile forms Hist and atomically adds each nonzero expert count; the memset
            repeats on every execution.
          partition:
            route: {size: R*Active, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Hist: {shape: [{expert: E}], dtype: int32}
            tile_reduction: {dimension: route, input: 'ref:design.math_reshape::Hist', output: 'ref:design.math_reshape::Counts', method: 'ref:design.math_reshape::routing'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R,RouteBatch)
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      scan:
        describe: Joint prefix scans followed by tile-map enumeration.
        decomposition:
          strategy: BM = 128. The single active worktile scans all E counts and per-expert ceil counts, then enumerates J row tiles by binary
            search of the tile prefixes.
          partition:
            scan_task: {size: Active, tile: 1}
          worktile:
            invariant:
              Counts: {shape: [{expert: E}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: Active}
            refill: none
            exit: assigned_done
          worktile_order:
          - {by: scan_task, direction: ascending}
      scatter:
        describe: Recompute batch histograms, reserve expert intervals and publish both route maps.
        decomposition:
          strategy: Hist is recomputed locally, not transferred from count. A block reserves Hist[e] rows by one Fill atomic per nonempty expert
            and assigns ranks with block-local atomics. Fill's zero initialization is the count-stage memset; different blocks may reserve in
            any order. Map stores are clipped to actual routes and RoutePos is -1 for invalid routes.
          partition:
            route: {size: R*Active, tile: RouteBatch}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              RoutePos: {shape: [{route: RouteBatch}], dtype: int32}
              PackedToken: {shape: [{route: RouteBatch}], dtype: int32}
              PackedSlot: {shape: [{route: RouteBatch}], dtype: int32}
              PackedExpert: {shape: [{route: RouteBatch}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R,RouteBatch)
        schedule:
          worktile_order:
          - {by: route, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk) coordinates, with
            chunk fastest; a tile can cross token boundaries. All work is empty when M=0. Otherwise chunks whose token has no routes are visited
            without payload reads or writes; the final packet is clipped.
          partition:
            chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}
          worktile:
            invariant:
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: min(1184,ceil_div(T*Nchunk,128))
        schedule:
          worktile_order:
          - {by: chunk, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local iterations and four 64-channel
            updates per iteration. Valid rows are base(j)..base(j)+valid(j); padded arithmetic follows fc1_quantize. Metadata selects one expert
            and remains invariant; the clamp slice is read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI''s
            row-tile upper bound. Let Cap be the cached automatic grid cap: twice the queried SM count, or zero if that query failed. For Nx column
            groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap). The submitted grid uses G(I/BN1), independent
            of the current J.'
          partition:
            row_tile: {size: J, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(I/BN1)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only valid(j) output rows are stored.
            All submitted workers remain present when J=0, but their assigned sequences are empty.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(H/BN2)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker produces up to 128*FinalWidth
            consecutive hidden elements of one token. Route slots are a local reduction, not independently assigned work; masked routes do not
            read the route-result slab.
          partition:
            token: {size: T*Active, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos: {shape: [{slot: K}], dtype: int32}
              route_weights: {shape: [{slot: K}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: T*ceil_div(H,128*FinalWidth)
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: |-
      The verification CTA streams zero stores and independent predicate scans,
      then contributes to a nonspinning last-arrival verdict protocol. Every
      downstream grid reads that verdict before payload work. Dirty execution
      retains the three-slot payload and two-slot scale rings, separate staging
      and MMA roles, early accumulator release, and FC2 bulk-store source reuse
      and terminal completion. Empty work domains preserve entry and terminal
      action events; terminal actions with no acquired resource are no-ops.
    phase:
      verify:
        resource:
          DirtyLane: {space: register, member_slot_shape: [{element: VerifyWidth}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor-grid completion and visibility; warp 0 grants dependent launch permission before streaming
                  starts.
                store: |-
                  Walk this shard's output units and submit the ZeroOutput stores.
                  Done means the local store loop has finished issuing its writes; global
                  output visibility is guaranteed by verify.kernel_done.
                scan: |-
                  Initialize one DirtyLane bit accumulator per thread. Independently
                  walk payload, activation-scale, score and expert-parameter packets in that
                  order, accumulating zero_verify's tests. Read clamp parameters only for
                  HasLimit=1. A CTA-wide predicate OR, including all threads even those
                  with no elements, produces DirtyPart.
                publish: |-
                  The elected thread atomically contributes a dirty bit if DirtyPart
                  is nonzero, orders that contribution before taking one global arrival
                  ticket, and then takes the ticket. The last arriving CTA observes the
                  combined dirty state, writes Clean, and resets both counters for reuse.
                  It also performs the optional pinned-mirror publication defined by verify.
                  Other CTAs complete after their own contributions, without waiting for
                  the last arrival. Done covers this CTA's state updates, not other CTAs'
                  output stores; only verify.kernel_done exposes Clean and ZeroOutput to
                  later grids. Counter reuse requires the previous execution and all its
                  flag readers to have completed through the existing stream ordering.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['store:ZeroOutput', 'scan:DirtyPart', 'publish:Clean']
      count:
        resource:
          Hist: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: &id001 |-
                  All participating threads wait for predecessor-grid completion and
                  visibility; warp 0 then grants dependent-grid launch permission, which
                  does not publish data. Execute the guard's wait and read Clean before
                  any payload, map or scratch access. Done includes this verdict read.
                  This entry occurs even when Active=0 and the work sequence is empty.
                produce: Zero Hist, synchronize the CTA, histogram valid routes, synchronize, then atomically add nonzero Hist entries into Counts.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['produce:Counts(t)']
        milestone:
          guarded: ['Main/enter:Protocol@done']
        domain: {t: worktile}
      scan:
        resource:
          PrefixScratch: {space: SMEM, member_slot_shape: [{element: 386}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: *id001
                produce: PrefixScratch holds 257 tile-prefix entries, two 64-word scan arrays and the tile total. Warp-local scans, the scan of
                  warp totals and CTA rendezvous produce both prefixes. After their publication within the CTA, threads enumerate tile IDs by
                  binary search and write Offs, TilePrefix, TileExpert and TileRow. On Active=1, J=0 still writes prefixes.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['produce:TilePrefix(t)']
        milestone:
          guarded: ['Main/enter:Protocol@done']
        domain: {t: worktile}
      scatter:
        resource:
          Reservation: {space: SMEM, member_slot_shape: [{table: 3}, {expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: *id001
                produce: Reservation contains batch counts, reserved bases and local ranks. Zero counts/ranks, CTA rendezvous, histogram, rendezvous,
                  reserve intervals from Fill, rendezvous, then assign atomic local ranks and write all four maps defined by routing. No thread
                  exits before the last rendezvous; invalid real routes still write RoutePos=-1.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['produce:RoutePos(t)']
        milestone:
          guarded: ['Main/enter:Protocol@done']
        domain: {t: worktile}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *id001
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries, and loads a 16-byte source
                  only if some route is valid. Replicate to those destinations; the same registers hold this chunk through all route stores. No
                  inter-thread exchange.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['produce:GatherChunk(t)']
        milestone:
          guarded: ['Main/enter:Protocol@done']
      fc1:
        domain:
          t: worktile
          i: [0, H/BK]
          g:
            flatten: [t, i]
          c: [0, 2]
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(g): {slot_index: g%3}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(g): {slot_index: g%2}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(g): {slot_index: g%2}
          APrefetch:
            space: register
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              APrefetch(t,i): {slot_index: i%2}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C1:
                part:
                  column: [0, 128]
              ScaleTM(g):
                part:
                  column: [128+32*(g%2), 160+32*(g%2)]
                dtype: uint8
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: &id002 |-
                  All seven warps first execute the guard's predecessor-completion wait
                  and read Clean. For Active=0, perform no metadata read, allocation or
                  explicit PDL trigger; launch_ready then comes from grid completion.
                  For Active=1, execute the PDL wait and warp-0 trigger, then read J.
                  If J=0 there is no local allocation and all work domains are empty.
                  Otherwise warp 0 initializes shared completion state and allocates
                  TensorStorage; all seven warps rendezvous once before independent work
                  loops. A worker with no assigned item still participates when J>0.
                  Done covers the guard and whichever initialization this case requires.
                prime: &id007 Resolve this worktile's expert and row base. The activation-scale source is GatherS in fc1 and ActS in fc2. Load
                  the first stage and, when the local stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting
                  padding scales to the first valid row. Prefetch registers are restarted per worktile.
                publish: &id008 Scatter the current APrefetch set into AScale, then establish shared-to-async visibility. If a next stage exists
                  in this worktile, load it into the other register set before the warp rendezvous and full-stage arrival. Thus stage 1 is loaded
                  again after being primed; the first primed copy is overwritten without use. Done includes this arrival, not completion of the
                  independent payload/weight-scale loads.
                retire: &id003 |-
                  After this role's assigned sequence, all seven warps rendezvous and
                  warp 0 deallocates TensorStorage when Active=1 and J>0. Otherwise this
                  declared action is a no-op with issue/done events. It adds no per-worktile
                  drain or global-memory fence; kernel completion supplies external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady: ['publish:AScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                publish:AScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the full-stage transaction count
                  for 32768 payload bytes. Done covers both payload transfers. Payloads use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared ABI permutation. The lane-permuted
                  4-byte asynchronous copies collectively stage 2048 bytes. Done is their completion arrival to the full-stage protocol. Also
                  issue an L2-only weight-scale hint two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: g
              prologue: ['enter:Protocol']
              steady: ['load:PayloadPair(g)', 'stage:BScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                load:PayloadPair(g+3): ['MMA/mma:PayloadA(g)@PayloadB(g)']
                stage:BScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                wait: {execution_mode: serial, meaning: &id009 'Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit
                    predecessors; q identifies the optional wait before the first scale copy of a worktile.'}
                prepare: &id010 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM: four scale-copy
                  operations for each operand. Issuance includes submission of all scale copies; only then does this issuer advance to the MMA
                  action. Done is covered by the following cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1. The first update initializes
                  C1 without reading its old value. The fused 128-column product covers both up and gate. Issue a cumulative completion commit
                  after each stage; done covers scale copies, payload reads and accumulator updates. The last stage also commits result readiness
                  for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites that
                  scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - repeat:
                  q: [0, 'min(1,t)*(1-Hoist)']
                steady: ['wait:Drain(t,q)']
              - repeat: g[t]
                steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                prepare:ScaleTM(g): ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)', 'Epilogue1/release:Accumulator(t-1)',
                  'Epilogue2/release:Accumulator(t-1)']
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]): ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)', 'Epilogue1/release:Accumulator(t-1)',
                  'Epilogue2/release:Accumulator(t-1)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: *id002
                drain: &id004 Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For c=0 or 1, load the matching
                  32 up and 32 gate values into this quadrant's rows of Fragment, issue both reads before waiting, and wait for all their TMEM
                  reads to retire. Done makes this register fragment usable.
                emit: &id005 Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize ScalePack and retain
                  its first two scale bytes; c=1 adds the last two, stores the full four-byte scale word on valid rows and resets it. Store valid
                  payload bytes for each c. Done means local computation and store submission consumed Fragment; global stores can still be in
                  flight. Invalid rows submit no output stores.
                release: &id006 This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases only this warp's accumulator
                  quadrant; MMA reuse waits for all four epilogue roles. This warp immediately continues its final conversion/store tail without
                  waiting for the other epilogue warps or for global output-store completion.
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb:
                enter: *id002
                drain: *id004
                emit: *id005
                release: *id006
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
        milestone:
          guarded: ['AProducer/enter:Protocol@done', 'BProducer/enter:Protocol@done', 'MMA/enter:Protocol@done', 'Epilogue/enter:Protocol@done',
            'Epilogue0/enter:Protocol@done', 'Epilogue1/enter:Protocol@done', 'Epilogue2/enter:Protocol@done']
      fc2:
        domain:
          t: worktile
          i: [0, I/BK]
          g:
            flatten: [t, i]
          c: [0, 2]
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(g): {slot_index: g%3}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(g): {slot_index: g%2}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(g): {slot_index: g%2}
          APrefetch:
            space: register
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              APrefetch(t,i): {slot_index: i%2}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C2:
                part:
                  column: [0, 128]
              ScaleTM(g):
                part:
                  column: [128+32*(g%2), 160+32*(g%2)]
                dtype: uint8
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          Sink: {space: SMEM, member_slot_shape: [{quadrant: 4}, {row: 32}, {hidden: 32}], dtype: bf16, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: *id002
                prime: *id007
                publish: *id008
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady: ['publish:AScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                publish:AScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                load: Stage PayloadA from ActQ and PayloadB from the selected FC2 weights. Arm the full-stage protocol for 32768 bytes; done covers
                  both tensor transfers. Padding payload rows remain consecutive while AProducer redirects their scale rows. No weight-payload
                  L2 hint is issued here.
                stage: Copy the prepared FC2 scale image with 16-byte asynchronous copies, four per lane, into BScale. Done includes the copy-completion
                  arrival in the full-stage protocol; no independent scale-prefetch hint.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: g
              prologue: ['enter:Protocol']
              steady: ['load:PayloadPair(g)', 'stage:BScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                load:PayloadPair(g+3): ['MMA/mma:PayloadA(g)@PayloadB(g)']
                stage:BScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: *id002
                wait: {execution_mode: serial, meaning: *id009}
                prepare: *id010
                mma: Execute four ordered 64-channel block-scaled updates of C2, with first-update initialization and cumulative stage completion.
                  Done covers preceding scale copies and operand reads; last-stage commit also publishes the result. Same-issuer scale-copy/MMA
                  ordering protects ScaleTM reuse and copy-to-MMA visibility, including a hoisted first stage of the next worktile.
                retire:
                  execution_mode: serial
                  meaning: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - repeat:
                  q: [0, 'min(1,t)*(1-Hoist)']
                steady: ['wait:Drain(t,q)']
              - repeat: g[t]
                steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                prepare:ScaleTM(g): ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)', 'Epilogue1/release:Accumulator(t-1)',
                  'Epilogue2/release:Accumulator(t-1)']
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]): ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)', 'Epilogue1/release:Accumulator(t-1)',
                  'Epilogue2/release:Accumulator(t-1)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: *id002
                drain: &id011 Each warp owns its TMEM quadrant; for c=0 or 1, issue reads of the two adjacent 32-column chunks into its own quadrant's
                  64-column Fragment, then wait once for both reads to retire. Padding rows are read too.
                release: *id006
                emit: &id012 'Process the two 32-column chunks in order. A quadrant whose entire 32-row group is valid converts to BF16 and uses
                  its own Sink region: wait until all earlier bulk stores by that warp have finished reading Sink, rendezvous the warp, populate
                  Sink, establish async-proxy visibility, rendezvous, and issue/commit the bulk store. Repeat for the second chunk, reusing that
                  same region. A partial quadrant converts and directly stores only valid rows and never writes Sink. Done covers conversion,
                  Fragment consumption and store submission; it is not a global-completion event. The bulk read wait also protects Sink across
                  worktiles, even when intervening quadrants used direct stores.'
                finish: &id013 Each epilogue warp's issuing lane waits for every outstanding bulk store to complete globally. This runs once after
                  the whole work sequence. It is a no-op for Active=0 or global J=0; for J>0 it runs even if this worker had no items. It does
                  not wait per worktile.
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)']
              epilogue: ['finish:BulkStores', 'retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb:
                enter: *id002
                drain: *id011
                release: *id006
                emit: *id012
                finish: *id013
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)']
              epilogue: ['finish:BulkStores', 'retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb:
                enter: *id002
                drain: *id011
                release: *id006
                emit: *id012
                finish: *id013
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)']
              epilogue: ['finish:BulkStores', 'retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb:
                enter: *id002
                drain: *id011
                release: *id006
                emit: *id012
                finish: *id013
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)']
              epilogue: ['finish:BulkStores', 'retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
        milestone:
          guarded: ['AProducer/enter:Protocol@done', 'BProducer/enter:Protocol@done', 'MMA/enter:Protocol@done', 'Epilogue/enter:Protocol@done',
            'Epilogue0/enter:Protocol@done', 'Epilogue1/enter:Protocol@done', 'Epilogue2/enter:Protocol@done']
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *id001
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices and scores, initialize Accumulator,
                  then consume valid BF16 route vectors in increasing slot order using finalize's FMA recurrence. Convert and store Y once; no
                  CTA reduction or inter-thread barrier is required. Empty routing still writes zeros.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['produce:Y(t)']
        milestone:
          guarded: ['Main/enter:Protocol@done']
        domain: {t: worktile}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: Use the source's tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale path, with cumulative tcgen05.commit completion
      and tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: The shared-slot reuse and cross-work scale-copy hoist depend on the same issuer's ordered scale reads and cumulative operand-read
      completion.
  - item: ['design.tile_pipeline::fc1', 'design.tile_pipeline::fc2']
    choice: For all epilogue roles, use tcgen05.ld with tcgen05.wait::ld before each final accumulator-release arrival, using the issuing warp's
      hardware quadrant.
    reason: Register materialization and early accumulator reuse require TMEM reads to have retired before the next work overwrites it.
  - item: design.tile_pipeline::fc2
    choice: Bind bulk Sink reuse to cp.async.bulk.wait_group.read 0, its publication to fence.proxy.async.shared::cta, and terminal completion
      to cp.async.bulk.wait_group 0. The output tensor map is a byte view with a 64-byte by 32-row box; full quadrants use it and partial quadrants
      use direct stores.
    reason: Source-read completion permits Sink overwrite but does not make RouteResult globally visible to finalize.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents protocol for eager and recorded
      work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.tile_pipeline::verify.Main
    choice: Use CUDA atomicOr for the dirty accumulator and atomicAdd for arrival tickets, with __threadfence before the ticket; use __threadfence_system
      before the optional volatile mapped-host verdict store.
    reason: The last arrival must observe all dirty contributions, and the optional pinned mirror must receive the published verdict even though
      this node does not poll it.
