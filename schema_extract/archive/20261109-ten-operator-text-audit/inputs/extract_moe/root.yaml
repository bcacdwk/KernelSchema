meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 7
  dispatch:
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved routing
      preparation threshold, and zflag/zflag_host are the optional device
      verification state and its pinned host mirror.
      All implementation controls, including those used to construct a and
      any reused graph, follow the frozen default implementation scope.
      Let R = T*K. Select exactly when the call reuses a, a.cfg = 97,
      a.cfg2 = 81, a.zflag = 0, a.zflag_host = 0,
      R > a.small_thresh, R < 49152, and moe_run returns zero through either
      a single caller-stream run_pipeline call or graph_replay's ordinary
      full-graph arm. Every private-stream run_pipeline call in this request,
      if present, is capture-only following a successful cudaStreamBeginCapture;
      there is no additional uncaptured pipeline submission on that stream.
      This includes eager submission, first replay after successful graph
      construction, and existing-graph replay when they have this same work.
      During outer-graph capture these calls only record the selected request;
      the plan's computation and completion events occur on its later replay.
      Use the ABI choices and bindings fixed at recording, while device tensor
      reads use the contents at execution. Reusing a does not rerun route_hist,
      table initialization, workspace construction or the ABI zero probe.
contract:
  algorithm_requirement:
    constant:
      Block: {value: 16, meaning: Consecutive channels sharing one NVFP4 scale}
      FP4Max: {value: 6, meaning: Largest E2M1 magnitude}
      ScaleMax: {value: 448, meaning: Largest finite E4M3FN scale}
      TokenLimit: {value: 8192, meaning: Declared maximum token count and tuning capacity}
    input:
      route_ids: {meaning: "Expert IDs supplied as topk_ids[0]; -1 marks an invalid route", shape: [token: T, slot: K], dtype: int32, range: "-1 <= value < E"}
      route_weights: {meaning: "Precomputed routing weights supplied as topk_ids[1]", shape: [token: T, slot: K], dtype: fp32, range: [0, 1]}
      routing_bias: {meaning: Python None; routing is already supplied, shape: [], dtype: python_none}
      hidden_states: {meaning: Packed E2M1 activation payload; even channel in the low nibble, shape: [token: T, packed_hidden: "H/2"], dtype: uint8}
      hidden_states_scale: {meaning: Logical row-major activation dequantization scales, shape: [token: T, hidden_block: "H/Block"], dtype: fp8_e4m3fn, range: "2^(-9) <= value <= ScaleMax"}
      gemm1_weights: {meaning: Prepared FC1 payload; decoded rows are up followed by gate, shape: [expert: E, prepared_row: "2*I", packed_hidden: "H/2"], dtype: uint8}
      gemm1_weights_scale: {meaning: Prepared FC1 scales with the scale swizzle defined below, shape: [expert: E, prepared_row: "2*I", hidden_block: "H/Block"], dtype: fp8_e4m3fn, range: "2^(-9) <= value <= ScaleMax"}
      gemm1_bias: {meaning: Python None; no FC1 bias, shape: [], dtype: python_none}
      gemm1_alpha: {meaning: Per-expert activation alpha, shape: [expert: E], dtype: fp32, range: "0.5 <= value <= 2 or value = 4"}
      gemm1_beta: {meaning: Per-expert activation beta, shape: [expert: E], dtype: fp32, range: "0 <= value <= 1 or value = 25"}
      gemm1_clamp_limit: {meaning: Per-expert clamp limit; Python None disables clamping, shape: [expert: E], dtype: fp32, nullable: true, range: [1, 16]}
      gemm2_weights: {meaning: Prepared FC2 payload, shape: [expert: E, prepared_row: H, packed_intermediate: "I/2"], dtype: uint8}
      gemm2_weights_scale: {meaning: Prepared FC2 scales with the scale swizzle defined below, shape: [expert: E, prepared_row: H, intermediate_block: "I/Block"], dtype: fp8_e4m3fn, range: "2^(-9) <= value <= ScaleMax"}
      gemm2_bias: {meaning: Python None; no FC2 bias, shape: [], dtype: python_none}
      output1_scale_scalar: {meaning: FC1 up scale multiplier, shape: [expert: E], dtype: fp32, range: [1, 1]}
      output1_scale_gate_scalar: {meaning: FC1 gate scale multiplier, shape: [expert: E], dtype: fp32, range: [1, 1]}
      output2_scale_scalar: {meaning: FC2 scale multiplier, shape: [expert: E], dtype: fp32, range: [1, 1]}
      num_experts: {meaning: Declared expert count, shape: [], dtype: int64, range: "value = E"}
      top_k: {meaning: Declared routes per token, shape: [], dtype: int64, range: "value = K"}
      n_group: {meaning: Python None; no group selection is requested, shape: [], dtype: python_none}
      topk_group: {meaning: Python None; no group top-k is requested, shape: [], dtype: python_none}
      intermediate_size: {meaning: Local expert intermediate width, shape: [], dtype: int64, range: "value = I"}
      local_expert_offset: {meaning: First local expert ID, shape: [], dtype: int64, range: [0, 0]}
      local_num_experts: {meaning: Number of local experts, shape: [], dtype: int64, range: "value = E"}
      routed_scaling_factor: {meaning: Global routed-output multiplier supplied as a Python float, shape: [], dtype: fp64, range: [1, 1]}
      routing_method_type: {meaning: Precomputed-routing mode, shape: [], dtype: int64, range: [0, 0], default: 0}
      do_finalize: {meaning: Request the combined token output, shape: [], dtype: bool, range: "value = true", default: true}
      enable_pdl: {meaning: Caller scheduling hint supplied as false in the declared input boundary, shape: [], dtype: bool, range: "value = false"}
      activation_type: {meaning: 3 selects SwiGLU and 10 selects SiTU, shape: [], dtype: int64, range: "value in {3, 10}", default: 3}
      per_token_scale: {meaning: Python None; no extra per-token scale, shape: [], dtype: python_none, default: "None"}
      output: {meaning: Caller-owned output destination; previous values do not participate in the result, shape: [token: T, hidden: H], dtype: bf16}
      tune_max_num_tokens: {meaning: Tuning capacity of the declared call, shape: [], dtype: int64, range: "value = TokenLimit", default: "TokenLimit"}
      gemm1_lora_delta: {meaning: Python None; no LoRA update, shape: [], dtype: python_none, default: "None"}
      valid_hidden_size: {meaning: Python None; every hidden channel is valid, shape: [], dtype: python_none, default: "None"}
      valid_intermediate_size: {meaning: Python None; every intermediate channel is valid, shape: [], dtype: python_none, default: "None"}
      num_fused_shared_experts: {meaning: Python None; no fused shared experts, shape: [], dtype: python_none, default: "None"}
      hidden_states_scale_layout: {meaning: Layout code for the supplied row-major activation scales, shape: [], dtype: int64, range: [2, 2]}
    output:
      Y: {meaning: "Final value written in place to input output and returned as the sole list element output[0]; the returned tensor aliases that input", shape: [token: T, hidden: H], dtype: bf16}
    compute:
      - name: Domain and call boundary
        math: |
          None denotes Python None. The declared generated-call domain has
          1 <= T <= TokenLimit, K = 8 and
          (H,I,E) in {(2048,768,128), (4096,768,128), (4096,1536,128), (7168,256,256)}.
          These geometries correspond respectively to Qwen3-30B TP1,
          Qwen3-235B TP2, Qwen3-235B TP1 and DeepSeek-V3 TP8.
          The ten fixed cases are samples, not the whole domain.
          H and I are divisible by Block; H and 2*I are divisible by 128,
          so the packed shapes and prepared scale tiles below have no padding.
          All tensors use their stated contiguous storage on the same CUDA device.
          topk_ids is the pair (route_ids, route_weights). Valid expert IDs are
          distinct within a token. Weights are softmax-normalized over the selected
          top-k logits before invalid routes are zeroed, without renormalization.
          Thus route_ids[t,k] = -1 implies route_weights[t,k] = 0, and each token's
          weight sum is at most 1 (up to FP32 rounding). Balanced, skewed, hotspot,
          masked and entirely empty routing, and zero activation payloads, are included.
          For activation_type = 3, gemm1_alpha is in [0.5,2] and gemm1_beta in [0,1], with
          defaults 1 and 0 when their generator options are omitted. For type 10,
          gemm1_alpha = 4 and gemm1_beta = 25 regardless of those generator options.
          Each of these tensors and any non-None clamp limit is uniform across experts
          in generated calls. The clamp may be None for either activation type.
          All other fixed arguments have the values stated in input; unspecified
          optional API modes outside this generated boundary are not included.
          Floating arithmetic and accumulation are FP32 with TF32 disabled,
          except for the explicit storage and quantization conversions below.
      - name: Decode the external packed ABI
        math: |
          For nibble c in {0,...,15}, F(c) has sign bit floor(c/8) and magnitude
          [0,0.5,1,1.5,2,3,4,FP4Max][c mod 8], preserving signed zero.
          For any row of L channels, with L divisible by Block, define
          Decode(q,s)[j] = F(floor(q[floor(j/2)] / 2^(4*(j mod 2))) mod 16)
                           * s[floor(j/Block)], for 0 <= j < L.
          This rule applies independently to all preceding axes.
          For a prepared scale slice S with visible shape [N,C], Unswizzle(S)
          flattens S in row-major order, reshapes to [N/128,C/4,32,4,4],
          transposes axes to [0,3,2,1,4], and reshapes to [N,C].
          Here N is divisible by 128 and C by 4 in every declared geometry.
          Define P(r) = 32*floor(r/32) + 8*(r mod 4) + floor((r mod 32)/4),
          and g(r) = 2*r for r < I, otherwise 2*(r-I)+1.
          A[t,:] = Decode(hidden_states[t,:], hidden_states_scale[t,:]).
          W1[e,r,:] = Decode(gemm1_weights[e,P(g(r)),:],
                            Unswizzle(gemm1_weights_scale[e,:,:])[P(g(r)),:]),
          for 0 <= r < 2*I.
          W2[e,h,:] = Decode(gemm2_weights[e,P(h),:],
                            Unswizzle(gemm2_weights_scale[e,:,:])[P(h),:]).
          All expert, token and hidden indices range over E, T and H respectively.
        symbol:
          F: {meaning: Exact signed E2M1 nibble decoder, shape: not_applicable, dtype: not_applicable}
          Decode: {meaning: Packed payload and block-scale decoding function, shape: not_applicable, dtype: not_applicable}
          Unswizzle: {meaning: Inverse external prepared-scale permutation, shape: not_applicable, dtype: not_applicable}
          A: {meaning: Decoded activation values, shape: [token: T, hidden: H], dtype: fp32}
          W1: {meaning: Decoded FC1 weights with up rows followed by gate rows, shape: [expert: E, channel: "2*I", hidden: H], dtype: fp32}
          W2: {meaning: Decoded FC2 weights, shape: [expert: E, hidden: H, intermediate: I], dtype: fp32}
      - name: Per-route FC1 and gated activation
        math: |
          For 0 <= t < T, 0 <= k < K and 0 <= j < I, let e = route_ids[t,k].
          If e = -1, Act[t,k,j] = 0 without evaluating the expert expressions.
          Otherwise let u = sum_{h=0}^{H-1} A[t,h]*W1[e,j,h] and
          v = sum_{h=0}^{H-1} A[t,h]*W1[e,I+j,h].
          If gemm1_clamp_limit is not None, let l = gemm1_clamp_limit[e]
          and replace u by clamp(u,-l,l) and v by min(v,l).
          Let alpha = gemm1_alpha[e], beta = gemm1_beta[e],
          and sigmoid(x) = 1/(1+exp(-x)); tanh is the hyperbolic tangent. Then
          Act[t,k,j] = v*sigmoid(alpha*v)*(u+beta) for activation_type = 3;
          Act[t,k,j] = alpha*tanh(v/alpha)*sigmoid(v)
                       * (beta*tanh(u/beta)) for activation_type = 10.
        symbol:
          Act: {meaning: Post-clamp gated activation for each route, shape: [token: T, slot: K, intermediate: I], dtype: fp32}
      - name: Route-local NVFP4 quantization and dequantization
        math: |
          Independently for each (t,k) and 0 <= b < I/Block, let
          peak = max_{j=0}^{Block-1} abs(Act[t,k,b*Block+j]) and
          s = fp8_e4m3fn(clamp(peak*(1/FP4Max),0,ScaleMax)).
          The following per-channel formulas apply for 0 <= j < Block.
          If s = 0, QAct[t,k,b*Block+j] = 0 for the entire block.
          Otherwise let x = Act[t,k,b*Block+j]/s. Choose the nearest magnitude
          from the nonnegative values of F, saturating at FP4Max; a midpoint
          chooses the even magnitude-code index in {0,...,7}.
          Copy x's sign bit to the selected magnitude, yielding q, and set
          QAct[t,k,b*Block+j] = q*s. The scale conversion also uses RNE.
          This quantization uses no positive minimum scale and norm_const = 1.
        symbol:
          QAct: {meaning: FP32 dequantized route activation after blockwise NVFP4 rounding, shape: "ref:Act.shape", dtype: fp32}
      - name: FC2 materialization and output reduction
        math: |
          For each (t,k,h), if route_ids[t,k] = -1 then Route[t,k,h] = bf16(0).
          Otherwise, with e = route_ids[t,k],
          Route[t,k,h] = bf16(sum_{j=0}^{I-1} QAct[t,k,j]*W2[e,h,j]).
          Each FC2 contraction uses independent FP32 accumulation before this
          BF16 RNE materialization. Routing weights are applied after it:
          Y[t,h] = bf16(sum_{k=0}^{K-1} Route[t,k,h]*route_weights[t,k]),
          with the products and route sum in FP32. A token with no valid routes
          produces zero. The no-bias zero-input case also produces zero.
          Overwrite all T*H elements of output and return [output], preserving
          its storage identity. Do not modify other inputs or storage outside
          this logical view; the generator's 64-element guards on each side
          are outside the write region. There is no caller-visible scratch.
          For the TP2 and TP8 geometries this is a local partial expert output;
          any cross-TP sum is performed by the caller outside this callable.
        symbol:
          Route: {meaning: BF16 FC2 result before routing-weight multiplication, shape: [token: T, slot: K, hidden: H], dtype: bf16}
    golden_reference:
      source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/problem/reference.py::Model.forward
      tolerance:
        Y: >-
          Source record: problem/metadata.json describes unchanged upstream
          torch.allclose(reference_float, candidate_float, atol=0.01, rtol=0.05),
          with candidate as the second argument. Its default record declares
          atol=0.01, rtol=0.05, max_mismatch_fraction=0.0; mutated_inputs.output
          declares atol=0.01, rtol=0.05, max_mismatch_fraction=0.001, max_rel_l2=0.01.
          Y is both the returned output[0] tensor and that mutated input.
          No standalone comparison formula or explicit relative_to field is supplied.
          The supplied material does not include the external comparator implementation,
          comparison precision, NaN/Inf policy, relative-L2 normalization, or complete
          routing of default versus mutated-output checks to this alias.
          This record does not adopt the schema's default atol/rtol or rel_rmse
          shorthand interpretation. CERTIFIED_BEST.json states that comparator and
          tolerances were unchanged but supplies no further comparator definitions.
