"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Precomputed routed mixture of experts with prepared NVFP4 weights,\
    \ gated activation, activation requantization and BF16 output."
  "source": "SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "init_probe_fused_big_mono"
    "parent": "probe_fused_big_mono"
    "when": |
      Let rebuild mean that Model.forward misses both ABI cache paths and
      validates and constructs a fresh MoEABI a. Its cfg/cfg2 select FC1/FC2,
      small_thresh is the saved routing-preparation threshold, and zflag and
      zflag_host are optional device verification state and its host mirror.
      All implementation controls follow the frozen default implementation scope.
      Let R=T*K. Select exactly when this is a rebuild, ensure_tables finds the
      device absent from this Model instance's ready set, submits one
      k_init_tables, completes device synchronization and marks it ready.
      The automatic choices are a.cfg=97 and a.cfg2=44, and one
      k_zero_scan submission occurs.
      The probe is not accepted: zero_ok remains false after a non-1 return
      or a caught exception following that submission. Thus a.zflag=0 and
      a.zflag_host=0. A failure before the scan submission does not satisfy this
      condition. Require R>a.small_thresh and R<49152, and moe_run returning zero
      through one caller-stream run_pipeline call or graph_replay's ordinary
      full-graph arm. FC2 uses a successful tma_set lookup with 128-column boxes
      and the cfg44 TMA/SFCP entry.
      Every private-stream run_pipeline in this request, if present, follows
      successful cudaStreamBeginCapture and is capture-only; the request has no
      additional uncaptured private-stream pipeline. Successful graph recording
      followed by replay, or capture failure after a successful BeginCapture
      followed by one caller-stream fallback, has the same computation.
      Workspace construction may reuse its shape/configuration cache or allocate
      fresh storage. Automatic route_hist, when requested by selection, reads
      current IDs to the host and counts valid IDs; it does not replace device
      routing. Host choices and tensor bindings are fixed at recording, while
      device reads use execution-time contents. Recording alone creates no
      kernel completion events. The executed table initialization and scan
      remain prefixes of this request; later ABI/graph reuse does not repeat
      either one.
"design":
  math_reshape:
    thesis: >-
      Compact valid routes by expert and preserve packed block-scaled operands through
      both contractions. Fuse FC1, approximate gated activation and requantization,
      eliminating full FC1 and FP32 activation materialization at the cost of a
      gathered input copy, full padded row arithmetic and changed activation rounding.
      A rebuild also evaluates a zero-eligibility scan; its rejected verdict retains
      the full computation and adds a read-only input pass plus one scalar verdict.
      This request also materializes three format-only conversion tables,
      adding 3072 persistent bytes and their initialization although the
      selected packed-operand computation does not consume them.
    rewrite:
      - step: tables
        name: Materialize the format conversion tables
        math: |
          For each byte code b in [0,256), let sign=floor(b/128),
          exponent=floor(b/8) mod 16, and mantissa=b mod 8.
          Define D8(b) as the signed E4M3FN decode: its magnitude is
          mantissa*2^(-9) when exponent=0, and
          2^(exponent-7)*(1+mantissa/8) otherwise, except that
          exponent=15 and mantissa=7 produces NaN. Apply the sign bit,
          preserving signed zero and the signed NaN.
          bits16(x) denotes the unsigned 16-bit storage encoding of a BF16
          value; bf16 conversions below use RNE.
          FormatPair[b] = uint32(bits16(bf16(F(b mod 16))) +
                                2^16*bits16(bf16(F(floor(b/16))))).
          FormatScale[b] = fp32(D8(b)).
          FormatScalePair[b] = uint32((1+2^16)*bits16(bf16(FormatScale[b]))).
          F is the Contract nibble decoder. All three tables are overwritten
          in full and retained for the current device/module instance beyond
          this request, until its storage is released or initialization runs
          again. They contain no input-dependent values. This node's probe
          and packed FC1/FC2 path do not read any of these tables.
        symbol:
          FormatPair: {meaning: Byte-to-packed-BF16 pair table for the two E2M1 nibbles, shape: [code: 256], dtype: uint32, retention: "keep_value device_module"}
          FormatScale: {meaning: Byte-to-FP32 E4M3FN decode table, shape: [code: 256], dtype: fp32, retention: "keep_value device_module"}
          FormatScalePair: {meaning: E4M3FN decode converted to BF16 and duplicated in a packed word, shape: [code: 256], dtype: uint32, retention: "keep_value device_module"}
      - step: probe
        name: Evaluate zero eligibility without changing the MoE output path
        math: |
          ProbeLimit = 0 if gemm1_clamp_limit is None, otherwise 1.
          ProbeInputs consists of every hidden_states byte, every
          hidden_states_scale element, every route_weights element, every
          gemm1_alpha and gemm1_beta element, every clamp element when
          ProbeLimit=1, and every prepared gemm1_weights_scale and
          gemm2_weights_scale element. For a payload byte q,
          bad(q) = (q mod 8 != 0) or (floor(q/16) mod 8 != 0).
          For an FP8 scale s, bad(s) = (byte(s) mod 128 = 127), where byte
          denotes its unsigned storage encoding. For each tested FP32 value
          x, bad(x) = not isfinite(x).
          ProbePartition(b), b=0..ProbeBlocks-1, partitions these input
          element identities according to the work_schedule binding.
          ProbePart(b) = int32(any bad(x) for x in ProbePartition(b));
          an empty subset produces 0. ProbeDirty starts at int32(0).
          Every nonzero ProbePart contributes int32(1) to the common verdict;
          its final logical value is max_b ProbePart(b).
          Retain ProbeDirty for the host probe decision, then discard it.
          Neither ProbePart nor ProbeDirty changes any input or Y.
        symbol:
          ProbeBlocks: {meaning: Number of disjoint scan partitions, binding: "bind:design.work_schedule::ProbeBlocks"}
          ProbePartition: {meaning: Assignment of tested input elements to a scan partition, binding: "bind:design.work_schedule::ProbePartition"}
          ProbePart: {meaning: Boolean-valued integer verdict for one partition, shape: [], dtype: int32}
          ProbeDirty: {meaning: Common zero-eligibility verdict inspected by the host, shape: [], dtype: int32, retention: "keep_value invocation"}
      - step: routing
        name: Compact routes and enumerate expert row blocks
        math: |
          R = T*K. Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
          For b = 0..ceil_div(R,RouteBatch)-1, Hist(b)[e] counts routes to e among flattened slots
          [RouteBatch*b,RouteBatch*(b+1)),
          clipped to [0,R). Counts[e] = sum_b Hist(b)[e]; M = sum_e Counts[e].
          Offs[0] = TilePrefix[0] = 0;
          Offs[e+1] = Offs[e] + Counts[e];
          TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
          Fill[e] starts at zero. Each route batch reserves its expert counts by
          fetch-and-add on Fill[e]; local ranks assign a bijection rho from V onto
          [0,M), with rho(t,k) in [Offs[e],Offs[e+1]) for e = route_ids[t,k].
          RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
          PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
          PackedExpert[rho(t,k)] = route_ids[t,k]. Fill[e] ends at Counts[e].
          For TilePrefix[e] <= j < TilePrefix[e+1],
          TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
          Define base(j) = Offs[TileExpert[j]] + TileRow[j],
          valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
          Only the used prefixes of the packed arrays and tile arrays are written.
        symbol:
          RouteBatch: {meaning: Route histogram batch size, binding: "bind:design.work_schedule::RouteBatch"}
          BM: {meaning: Expert row block size, binding: "bind:design.work_schedule::BM"}
          Hist: {meaning: Expert histogram for one route batch, shape: [expert: E], dtype: int32}
          Counts: {meaning: Current route count per expert, shape: [expert: E], dtype: int32, retention: "keep_value invocation"}
          Fill: {meaning: Atomic expert reservation counters, shape: [expert: E], dtype: int32, retention: "keep_value invocation"}
          Offs: {meaning: Compact expert row prefix, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          TilePrefix: {meaning: Prefix of expert row blocks, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [token: T, slot: K], dtype: int32, retention: "keep_value invocation"}
          PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          TileExpert: {meaning: Expert for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
          TileRow: {meaning: Expert-local row origin for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
      - step: gather
        name: Replicate packed input into compact route order
        math: |
          For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
          GatherS[rho(t,k),:] = hidden_states_scale[t,:].
          Each token with at least one valid route supplies one logical input
          payload/scale copy, replicated to its valid routes. Let U be the count
          of such tokens. Unused rows of the R-row backing buffers retain old bytes.
          Nchunk = 9*H/256. For f = t*Nchunk+c, SourceChunk[f,:] denotes the
          c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
          of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
          chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
          These chunk names are views of the same copies, with no additional storage.
          Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
          definitions; these decoded operands are mathematical views, not saved arrays.
        symbol:
          GatherQ: {meaning: Gathered packed input payload, shape: [route: M, packed_hidden: "H/2"], dtype: uint8, retention: "keep_value invocation"}
          GatherS: {meaning: Gathered input block scales, shape: [route: M, hidden_block: "H/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
          SourceChunk: {meaning: Byte view used by the flat gather, shape: [chunk: "T*Nchunk", byte: 16], dtype: uint8}
          GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [chunk: "T*Nchunk", slot: K, byte: 16], dtype: uint8}
      - step: fc1_quantize
        name: Joint up and gate contraction with fused approximate activation
        math: |
          BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
          form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
          W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
          C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
          B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
          B1 is the concatenation of those up and gate groups; X1's valid row r
          is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
          contracted: their payload comes from consecutive backing-buffer rows
          base(j)+r, while their scale row is redirected to base(j).
          Payload outside the R-row domain is zero-filled; unused in-bounds
          backing bytes remain unspecified, not zeroed.
          For each row and intermediate channel, take u,v from the final C1
          up/gate columns and apply Contract's asymmetric clamp when enabled.
          Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
          ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
          Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
          For activation_type = 3, z = gemm1_alpha[e]*L and
          a = (v*S(v,z))*(u+gemm1_beta[e]).
          For type 10, zg = ia*(2*L), zu = ib*(2*L),
          g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
          w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
          The unused beta reciprocal for type 3 does not enter a.
          For each 16-channel block, peak = max(abs(a)),
          s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
          zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
          Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
          channel into the low nibble. Save those bytes as ActQ and s as ActS,
          only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
          multiplication and code conversion; they decode to zero scale.
          Padding rows also execute activation and quantization but are discarded.
          C1 and activated FP32 values are consumed locally, not globally materialized.
        symbol:
          BN1: {meaning: FC1 intermediate columns per worktile, binding: "bind:design.work_schedule::BN1"}
          BK: {meaning: Reduction channels per staging iteration, binding: "bind:design.work_schedule::BK"}
          C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [row: BM, column: "2*BN1"], dtype: fp32, retention: "carry_forward (j,n); l=-1..H/64-1"}
          ActQ: {meaning: Packed quantized intermediate payload, shape: [route: M, packed_intermediate: "I/2"], dtype: uint8, retention: "keep_value invocation"}
          ActS: {meaning: Intermediate quantization scales, shape: [route: M, intermediate_block: "I/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
        arithmetic:
          approx: >-
            exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32.
            Folded sigmoid arguments, the sigmoid-based tanh identity and
            reciprocal-multiply quantization replace the reference evaluation.
            unknown: no verified uniform error bound for the full declared domain
            is supplied; source comments and local probes are not an output guarantee.
          accumulate: >-
            Each 64-channel contraction uses native E2M1 inputs and E4M3 block
            scales with FP32 accumulation; four such updates make one BK stage.
            The notation does not assert FP32 products or reference-order bit equality.
      - step: fc2
        name: Packed intermediate contraction and route materialization
        math: |
          For each row tile j and BN2-column group n in [0,H/BN2),
          X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
          B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
          C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
          B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
          Padded rows use the same payload/scale-row rule as fc1_quantize,
          now with the ActQ/ActS backing buffers, and are discarded after contraction.
          Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
          for r < valid(j). Unused route-result rows retain old contents.
        symbol:
          BN2: {meaning: FC2 output columns per worktile, binding: "bind:design.work_schedule::BN2"}
          C2: {meaning: Accumulator of one FC2 worktile, shape: [row: BM, column: BN2], dtype: fp32, retention: "carry_forward (j,n); l=-1..I/64-1"}
          RouteResult: {meaning: BF16 result for each valid compact route, shape: [route: M, hidden: H], dtype: bf16, retention: "keep_value invocation"}
        arithmetic:
          accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output columns change.
      - step: finalize
        name: Fixed route-order fused accumulation into caller output
        math: |
          For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
          Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
          otherwise Z(k) = Z(k-1), without reading RouteResult.
          Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return
          [output], preserving that tensor's storage identity as required by Contract.
        symbol:
          Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: "carry_forward (t,h); k=-1..K-1"}
    ledger:
      baseline: >-
        Contract evaluation for the M valid routes, saving decoded FP32 activations,
        both FC1 outputs and Act before QDQ; save the same BF16 route results.
      matmul:
        - {item: Expert contractions, change: "3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows", by: [fc1_quantize, fc2]}
      vector:
        - {item: Format-table initialization, change: "Add 512 E2M1 and 256 E4M3FN decodes plus 768 BF16 conversions per initializing rebuild", by: [tables]}
        - {item: Rebuild eligibility scan, change: "Add T*H/2 + T*H/16 + R + (2+ProbeLimit)*E + 3*E*H*I/16 element predicates and their Boolean reduction per rebuild", by: [probe]}
        - {item: Activation and quantization, change: "M*I -> PaddedRows*I channel evaluations, plus O(R+ceil_div(R,RouteBatch)*E+E+J*log2(E)) integer routing work per invocation", by: [routing, fc1_quantize]}
      footprint:
        - {item: Format tables, change: "Add three 256-entry four-byte tables, 3072 bytes retained per device/module instance", by: [tables]}
        - {item: Probe verdict, change: "Add 4 bytes retained until host inspection or failure cleanup", by: [probe]}
        - {item: Intermediate materialization, change: "12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes remain 2*M*H", by: [gather, fc1_quantize, fc2]}
      traffic:
        - {item: Format-table stores, change: "Add 3072 output bytes per initializing rebuild; no input-tensor reads", by: [tables]}
        - {item: Probe reads, change: "Add 9*T*H/16 + 4*R + 4*(2+ProbeLimit)*E + 3*E*H*I/16 input bytes per rebuild, plus at most 4*ProbeBlocks verdict-store bytes", by: [probe]}
        - {item: Gather, change: "Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads", by: [gather]}
      error:
        - {item: Numerical evaluation, change: "Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established", by: [fc1_quantize, finalize]}
  work_schedule:
    thesis: >-
      One table-initialization kernel and a device synchronization precede
      the ordinary scan and seven PDL computational kernels. The scan is
      followed by host probe services and, when needed,
      workspace allocation/initialization; the full chain still begins with its
      Counts/Fill memset. Routing and flat gather expose broad parallelism;
      persistent GEMM workers retain their rings across expert tiles.
      Table initialization, scan and full computation use the caller stream,
      so scan starts after table initialization and count starts after
      the scan, while PDL separates later launch permission from data readiness.
      Global workspace may be newly allocated or reused; unwritten packed and
      route-result bytes remain unspecified. Same-stream ordering orders reuse,
      without adding cross-stream exclusion or a final host output wait.
    flow:
      launch:
        - {phase: [table_init]}
        - {phase: [probe_scan], start_after: table_init.kernel_done}
        - {phase: [count], protocol: pdl, start_after: probe_scan.kernel_done}
        - {phase: [scan], protocol: pdl, start_after: count.launch_ready}
        - {phase: [scatter], protocol: pdl, start_after: scan.launch_ready}
        - {phase: [gather], protocol: pdl, start_after: scatter.launch_ready}
        - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
        - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
        - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, ready: count.kernel_done}
        Offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        TilePrefix: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileExpert: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileRow: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        RoutePos: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      table_init:
        describe: Initialize all three device format tables before the rebuild probe.
        decomposition:
          strategy: >-
            One worktile generates every code entry of all three tables.
            These are module-owned global arrays on the current device, each
            containing 256 four-byte entries. The worktile overwrites every entry,
            so no prior table value or zero initialization is required. Their
            storage persists beyond this kernel and request. No later phase in
            this node consumes them, so there is no table data handoff.
            After the ordinary launch, ensure_tables checks its launch status,
            then synchronizes the device before adding the device to this Model
            instance's ready set and proceeding to configuration selection and
            the probe. This service waits for preceding device work as well as
            table_init; it is not an additional computational kernel.
          partition: {}
          target:
            single_tile:
              FormatPair: {shape: [code: 256], dtype: uint32}
              FormatScale: {shape: [code: 256], dtype: fp32}
              FormatScalePair: {shape: [code: 256], dtype: uint32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}
      probe_scan:
        describe: Test zero eligibility and publish a single host-inspected verdict.
        decomposition:
          strategy: |
            ProbeBlocks=296 and ProbeWidth=256. One worktile owns the complete
            strided scan partition b, not one input chunk. ProbePartition(b)
            contains all hidden payload/scales of tokens t=b+q*ProbeBlocks<T,
            q>=0. For route_weights it contains flattened indices
            b*ProbeWidth+j+q*ProbeBlocks*ProbeWidth<R, 0<=j<ProbeWidth.
            The same stripes clipped to E select alpha, beta and the optional
            clamp. For each prepared weight-scale array independently, these
            stripes select four-byte words, clipped to its byte length divided
            by four; all four scale elements in each word belong to b.
            The local passes visit tokens, routing weights, expert parameters,
            FC1 scales and FC2 scales in that order. Each pass is clipped to its
            own extent. There is no data-dependent early exit.
            A service allocation creates the four-byte global ProbeDirty and
            cudaMemsetAsync sets it to zero before this ordinary scan launch.
            Each worktile contributes only a nonzero partial by publishing 1
            into the common flag; zero partials leave it unchanged.
            After submission, a failed launch-status query frees the flag and
            returns -3. Otherwise a stream synchronization is attempted; failure
            frees it and returns -4. After successful synchronization, host h
            starts at 1, a synchronous four-byte D2H copy is attempted without
            checking its status, and the flag is freed. The host accepts only
            h=0 (probe return 1); this node has zero_ok=false. The source's
            concurrent flag stores and unchecked readback do not guarantee a
            reliable verdict.
          partition: {probe_batch: {size: ProbeBlocks, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [token: 1, packed_hidden: "H/2"], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [token: 1, hidden_block: "H/Block"], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [route: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [expert: ProbeWidth], dtype: fp32, direction: ascending}
              gemm1_weights_scale: {shape: [scale: "4*ProbeWidth"], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights_scale: {shape: [scale: "4*ProbeWidth"], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {ProbePart: {shape: [], dtype: int32}}
            tile_reduction: {dimension: probe_batch, input: "ref:design.math_reshape::ProbePart", output: "ref:design.math_reshape::ProbeDirty", method: "ref:design.math_reshape::probe"}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: ProbeBlocks}
        schedule:
          worktile_order: [{by: probe_batch, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      count:
        describe: Form block histograms and accumulate Counts.
        decomposition:
          strategy: >-
            RouteBatch=256. After the probe services, _workspace reuses a cached
            workspace or allocates its arrays; on a miss torch.zeros also clears
            the new adjacent Counts/Fill allocation (2*E int32 elements). Other
            buffers are uninitialized. The optional route_hist ID readback and
            host histogram have already selected cfg2 and small_thresh before the
            probe; neither is recomputed during graph replay. The main-chain
            cudaMemsetAsync service zeros the adjacent E-element Counts
            and Fill arrays before count starts. Each 256-route worktile forms Hist
            and atomically adds each nonzero expert count; the memset repeats on every execution.
          partition: {route: {size: R, tile: RouteBatch}}
          worktile:
            invariant:
              route_ids: {shape: [route: RouteBatch], dtype: int32}
          target:
            single_tile: {Hist: {shape: [expert: E], dtype: int32}}
            tile_reduction: {dimension: route, input: "ref:design.math_reshape::Hist", output: "ref:design.math_reshape::Counts", method: "ref:design.math_reshape::routing"}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "ceil_div(R,RouteBatch)"}
        schedule:
          worktile_order: [{by: route, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      scan:
        describe: Joint prefix scans followed by tile-map enumeration.
        decomposition:
          strategy: >-
            BM = 128. One worktile scans all E counts and per-expert ceil counts,
            then enumerates J row tiles by binary search of the tile prefixes.
          partition: {}
          worktile: {invariant: {Counts: {shape: [expert: E], dtype: int32}}}
          target:
            single_tile:
              Offs: {shape: [prefix: "E+1"], dtype: int32}
              TilePrefix: {shape: [prefix: "E+1"], dtype: int32}
              TileExpert: {shape: [row_tile: J], dtype: int32}
              TileRow: {shape: [row_tile: J], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}
      scatter:
        describe: Recompute batch histograms, reserve expert intervals and publish both route maps.
        decomposition:
          strategy: >-
            Hist is recomputed locally, not transferred from count. A block reserves
            Hist[e] rows by one Fill atomic per nonempty expert and assigns ranks with
            block-local atomics. Fill's zero initialization is the count-stage
            memset; different blocks may reserve in any order. Map stores are clipped
            to actual routes and RoutePos is -1 for invalid routes.
          partition: {route: {size: R, tile: RouteBatch}}
          worktile:
            invariant:
              route_ids: {shape: [route: RouteBatch], dtype: int32}
              Offs: {shape: [prefix: "E+1"], dtype: int32}
          target:
            single_tile:
              RoutePos: {shape: [route: RouteBatch], dtype: int32}
              PackedToken: {shape: [route: RouteBatch], dtype: int32}
              PackedSlot: {shape: [route: RouteBatch], dtype: int32}
              PackedExpert: {shape: [route: RouteBatch], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "ceil_div(R,RouteBatch)"}
        schedule:
          worktile_order: [{by: route, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: >-
            Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk) coordinates,
            with chunk fastest; a tile can cross token boundaries. All work is empty
            when M=0. Otherwise chunks whose token has no routes are visited without
            payload reads or writes; the final packet is clipped.
          partition: {chunk: {size: "T*Nchunk*min(1,M)", tile: 128}}
          worktile:
            invariant:
              SourceChunk: {shape: [chunk: 128, byte: 16], dtype: uint8}
              RoutePos: {shape: [chunk: 128, slot: K], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
          target:
            single_tile: {GatherChunk: {shape: [chunk: 128, slot: K, byte: 16], dtype: uint8}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "min(1184,ceil_div(T*Nchunk,128))"}
        schedule:
          worktile_order: [{by: chunk, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: >-
            BN1=64, BK=256; each row tile and intermediate column group is one
            worktile, with H/BK local iterations and four 64-channel updates per
            iteration. Valid rows are base(j)..base(j)+valid(j); padded arithmetic
            follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is
            read only when gemm1_clamp_limit is not None.
            TileCap=ceil_div(R,BM)+min(E,R) is the ABI's row-tile upper bound.
            Let Cap be the cached automatic grid cap: twice the queried SM count,
            or zero if that query failed. For Nx column groups define
            G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            The submitted grid uses G(I/BN1), independent of the current J.
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
              gemm1_alpha: {shape: [expert: 1], dtype: fp32}
              gemm1_beta: {shape: [expert: 1], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: 1], dtype: fp32}
            iteration:
              GatherQ: {shape: [row: BM, packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              GatherS: {shape: [row: BM, hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [column: "2*BN1", packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [column: "2*BN1", hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [row: BM, packed_intermediate: "BN1/2"], dtype: uint8}
              ActS: {shape: [row: BM, intermediate_block: "BN1/Block"], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(I/BN1)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: >-
            BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses
            I/BK local stages. Only valid(j) output rows are stored. All submitted
            workers remain present when J=0, but their assigned sequences are empty.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
            iteration:
              ActQ: {shape: [row: BM, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              ActS: {shape: [row: BM, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [column: BN2, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [column: BN2, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {RouteResult: {shape: [row: BM, hidden: BN2], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(H/BN2)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: >-
            FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range.
            One worker produces up to 128*FinalWidth consecutive hidden elements of one token.
            Route slots are a local reduction, not independently assigned work;
            masked routes do not read the route-result slab.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: "128*FinalWidth"}}
          worktile:
            invariant:
              RoutePos: {shape: [slot: K], dtype: int32}
              route_weights: {shape: [slot: K], dtype: fp32}
            iteration:
              RouteResult: {shape: [slot: 1, hidden: "128*FinalWidth"], dtype: bf16, direction: ascending}
          target: {single_tile: {Y: {shape: [hidden: "128*FinalWidth"], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "T*ceil_div(H,128*FinalWidth)"}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: >-
      FC1 separates scale and payload producers, MMA issue and four epilogue warps,
      retaining its rings and early accumulator release across worktiles. FC2 uses
      four cooperative warps with three-slot payload and scale staging; each stage
      waits for the previous MMA before refill, and each worktile completes its
      direct BF16 store submissions before the next worktile is primed.
      The preceding eligibility scan uses one cooperative role per CTA with
      register-local flags and a single CTA reduction, without a staging ring.
      Table initialization is a separate cooperative CTA with disjoint code
      entries and direct global stores, without shared staging or consumers
      in the selected packed path.
    phase:
      table_init:
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                produce: >-
                  FormatTables denotes FormatPair, FormatScale and FormatScalePair.
                  Each thread owns one code entry and evaluates the tables rewrite,
                  writing that entry of all three global tables. The scalar
                  conversions are local to the thread, with no shared staging or
                  inter-thread exchange. Done submits all three stores; kernel_done
                  supplies their global visibility before the device synchronization
                  returns. No table storage is released at this worker's exit.
            pipe: {steady: ["produce:FormatTables"]}
      probe_scan:
        resource:
          ProbeFlags: {space: register, member_slot_shape: [element: ProbeWidth], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                produce: >-
                  Initialize each thread's ProbeFlags word to zero. Each thread
                  accumulates its assigned predicates through the five scan passes,
                  retaining its word between passes. Payload loads examine four bytes
                  together and ignore each nibble's sign bit; weight-scale loads examine
                  four encoded scales together. Threads whose local ranges are empty
                  retain zero. A CTA-wide Boolean OR and rendezvous form ProbePart;
                  only the designated leader publishes 1 to global ProbeDirty when
                  the partial is nonzero. There is no cross-CTA rendezvous or PDL
                  entry. Done consumes the local flags and submits any verdict store;
                  kernel completion supplies visibility for host inspection. A zero
                  partial still completes this action but does not write the flag.
            pipe: {steady: ["produce:ProbeDirty"]}
      count:
        resource:
          Hist: {space: SMEM, member_slot_shape: [expert: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                enter: &pdl_entry >-
                  All participating threads wait for predecessor grid completion
                  and visibility; warp 0 then grants dependent-grid launch permission.
                  This grants no data readiness. The entry executes even if this
                  worker has no payload work.
                produce: Zero Hist, synchronize the CTA, histogram valid routes, synchronize, then atomically add nonzero Hist entries into Counts.
            pipe: {prologue: ["enter:Protocol"], steady: ["produce:Counts"]}
      scan:
        resource:
          PrefixScratch: {space: SMEM, member_slot_shape: [element: 386], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:32]"
              verb:
                enter: *pdl_entry
                produce: >-
                  PrefixScratch holds 257 tile-prefix entries, two 64-word
                  scan arrays and the tile total. Warp-local scans, the scan of warp totals and CTA
                  rendezvous produce both prefixes. After their publication within
                  the CTA, threads enumerate tile IDs by binary search and write
                  Offs, TilePrefix, TileExpert and TileRow. J=0 still writes prefixes.
            pipe: {prologue: ["enter:Protocol"], steady: ["produce:TilePrefix"]}
      scatter:
        resource:
          Reservation: {space: SMEM, member_slot_shape: [table: 3, expert: 256], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                enter: *pdl_entry
                produce: >-
                  Reservation contains batch counts, reserved bases and local ranks.
                  Zero counts/ranks, CTA rendezvous, histogram, rendezvous, reserve
                  intervals from Fill, rendezvous, then assign atomic local ranks
                  and write all four maps defined by routing. No thread exits before
                  the last rendezvous; invalid real routes still write RoutePos=-1.
            pipe: {prologue: ["enter:Protocol"], steady: ["produce:RoutePos"]}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:4]"
              verb:
                enter: *pdl_entry
                produce: >-
                  Each of the 128 threads handles one SourceChunk, reads its token's
                  eight RoutePos entries, and loads a 16-byte source only if some
                  route is valid. Replicate to those destinations; the same registers
                  hold this chunk through all route stores. No inter-thread exchange.
            pipe: {repeat: t, prologue: ["enter:Protocol"], steady: ["produce:GatherChunk(t)"]}
      fc1:
        domain:
          t: worktile
          i: [0, "H/BK"]
          g: {flatten: [t, i]}
          c: [0, 2]
        resource:
          PayloadA: &payload_a
            space: SMEM
            member_slot_shape: [row: BM, byte: "BK/2"]
            dtype: uint8
            slot_count: 3
            view: {"PayloadA(g)": {slot_index: "g%3"}}
          PayloadB: &payload_b
            space: SMEM
            member_slot_shape: [row: 128, byte: "BK/2"]
            dtype: uint8
            slot_count: 3
            view: {"PayloadB(g)": {slot_index: "g%3"}}
          AScale: &scale_a
            space: SMEM
            member_slot_shape: [row: BM, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"AScale(g)": {slot_index: "g%2"}}
          BScale: &scale_b
            space: SMEM
            member_slot_shape: [row: 128, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"BScale(g)": {slot_index: "g%2"}}
          APrefetch: &a_prefetch
            space: register
            member_slot_shape: [row: BM, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"APrefetch(t,i)": {slot_index: "i%2"}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C1: {part: {column: [0, 128]}}
              "ScaleTM(g)": {part: {column: ["128+32*(g%2)", "160+32*(g%2)"]}, dtype: uint8}
          Fragment: &fragment
            space: register
            member_slot_shape: [row: BM, column: 64]
            dtype: fp32
            slot_count: 1
          ScalePack: {space: register, member_slot_shape: [row: BM, block: 4], dtype: uint8, slot_count: 1}
        role:
          AProducer: &a_producer
            info:
              execution_mode: serial
              member: "warp[0:1]"
              verb:
                enter: &gemm_enter >-
                  Execute the PDL entry protocol. If global J=0, perform no local
                  allocation; subsequent work domains are empty. Otherwise warp 0
                  initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent
                  work loops. A worker with no assigned item still participates.
                prime: &a_prime >-
                  Resolve this worktile's expert and row base. The activation-scale
                  source is GatherS. Load the first stage
                  and, when the local stage count exceeds one, the second into
                  APrefetch. All BM rows are loaded, redirecting padding scales to
                  the first valid row. Prefetch registers are restarted per worktile.
                publish: &a_publish >-
                  Scatter the current APrefetch set into AScale, then establish
                  shared-to-async visibility. If a next stage exists in this worktile,
                  load it into the other register set before the warp rendezvous and
                  full-stage arrival. Thus stage 1 is loaded again after being primed;
                  the first primed copy is overwritten without use. Done includes this
                  arrival, not completion of the independent payload/weight-scale loads.
                retire: &gemm_retire >-
                  After this role's whole assigned sequence, rendezvous with all seven
                  warps; warp 0 deallocates TensorStorage. For global J=0 this action
                  is a no-op. It does not insert a per-worktile drain or a new global
                  memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - "prime:APrefetch(t)"
                - repeat: "g[t]"
                  steady: ["publish:AScale(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              reuse:
                "publish:AScale(g+2)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
          BProducer:
            info:
              execution_mode: async
              member: "warp[1:2]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                load: >-
                  Stage PayloadA from GatherQ and PayloadB as the two contiguous
                  up/gate weight boxes. Arm the full-stage transaction count for
                  32768 payload bytes. Done covers both payload transfers. Payloads
                  use three slots independently of the two scale slots.
                stage: >-
                  Copy prepared weight scales into BScale's fused 128-row up/gate
                  image, preserving the prepared ABI permutation. The lane-permuted
                  4-byte asynchronous copies collectively stage 2048 bytes. Done is
                  their completion arrival to the full-stage protocol. Also issue
                  an L2-only weight-scale hint two stages ahead when that stage lies
                  in the same worktile; the hint has no consumer or completion edge.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: g
              prologue: ["enter:Protocol"]
              steady: ["load:PayloadPair(g)", "stage:BScale(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              reuse:
                "load:PayloadPair(g+3)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
                "stage:BScale(g+2)": ["MMA/mma:PayloadA(g)@PayloadB(g)"]
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: "warp[2:3]"
              verb:
                enter: {execution_mode: serial, meaning: *gemm_enter}
                wait: &drain_wait
                  execution_mode: serial
                  meaning: >-
                    Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes
                    after its explicit predecessors; q identifies the optional
                    wait before the first scale copy of a worktile.
                prepare: &scale_prepare >-
                  The elected issuer waits for the full-stage protocol and copies
                  AScale and BScale into ScaleTM: four scale-copy operations for each
                  operand. Issuance includes submission of all scale copies;
                  only then does this issuer advance to the MMA action. Done is covered
                  by the following cumulative MMA completion.
                mma: >-
                  Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel
                  block-scaled updates to C1. The first update initializes C1 without
                  reading its old value. The fused 128-column product covers both up
                  and gate. Issue a cumulative completion commit after each stage;
                  done covers scale copies, payload reads and accumulator updates.
                  The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM
                  before a later scale copy overwrites that scale slot, and makes each
                  scale copy visible before the MMA that uses it.
                retire: {execution_mode: serial, meaning: *gemm_retire}
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - repeat: {q: [0, "min(1,t)*(1-Hoist)"]}
                  steady: ["wait:Drain(t,q)"]
                - repeat: "g[t]"
                  steady: ["prepare:ScaleTM(g)", "mma:PayloadA(g)@PayloadB(g)"]
              epilogue: ["retire:TensorStorage"]
            waits_for:
              data:
                "prepare:ScaleTM(g)": ["AProducer/publish:AScale(g)", "BProducer/load:PayloadPair(g)", "BProducer/stage:BScale(g)"]
              reuse:
                "wait:Drain(t,q)@done": &prior_drain ["Epilogue/release:Accumulator(t-1)", "Epilogue0/release:Accumulator(t-1)", "Epilogue1/release:Accumulator(t-1)", "Epilogue2/release:Accumulator(t-1)"]
                "mma:PayloadA(g[t,0])@PayloadB(g[t,0])": *prior_drain
          Epilogue:
            info:
              execution_mode: serial
              member: "warp[3:4]"
              verb: &fc1_epi_verb
                enter: *gemm_enter
                drain: >-
                  Each warp owns its hardware TMEM quadrant (warp index modulo four),
                  one row per lane. For c=0 or 1, load the matching 32 up and 32 gate
                  values into this quadrant's rows of Fragment, issue both reads before waiting, and wait for
                  all their TMEM reads to retire. Done makes this register fragment usable.
                emit: >-
                  Evaluate fc1_quantize for this 32-channel Fragment, including padding
                  rows. For c=0 initialize ScalePack and retain its first two scale bytes;
                  c=1 adds the last two, stores the full four-byte scale word on valid
                  rows and resets it. Store valid payload bytes for each c. Done means
                  local computation and store submission consumed Fragment; global
                  stores can still be in flight. Invalid rows submit no output stores.
                release: &acc_release >-
                  This warp arrives once after its last TMEM-read wait and warp
                  rendezvous. Done releases only this warp's accumulator quadrant;
                  MMA reuse waits for all four epilogue roles. This warp immediately
                  continues its final conversion/store tail without waiting for the
                  other epilogue warps or for global output-store completion.
                retire: *gemm_retire
            pipe: &fc1_epi_pipe
              repeat: t
              prologue: ["enter:Protocol"]
              steady: ["drain:Fragment(t,0)", "emit:ActQ(t,0)", "drain:Fragment(t,1)", "release:Accumulator(t)", "emit:ActQ(t,1)"]
              epilogue: ["retire:TensorStorage"]
            waits_for: &fc1_epi_wait
              data:
                "drain:Fragment(t,0)": ["MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])"]
          Epilogue0:
            info:
              execution_mode: serial
              member: "warp[4:5]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
          Epilogue1:
            info:
              execution_mode: serial
              member: "warp[5:6]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
          Epilogue2:
            info:
              execution_mode: serial
              member: "warp[6:7]"
              verb: *fc1_epi_verb
            pipe: *fc1_epi_pipe
            waits_for: *fc1_epi_wait
      fc2:
        domain:
          t: worktile
          i: [0, "I/BK"]
          g: {flatten: [t, i]}
          s: [0, "I/BK+2"]
          c: [0, "BN2/32"]
        resource:
          RowIndex: {space: SMEM, member_slot_shape: [row: BM], dtype: int32, slot_count: 1}
          PayloadA: *payload_a
          PayloadB: *payload_b
          AScale:
            space: SMEM
            member_slot_shape: [row: BM, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 3
            view: {"AScale(g)": {slot_index: "g%3"}}
          BScale:
            space: SMEM
            member_slot_shape: [row: BN2, block: "BK/Block"]
            dtype: fp8_e4m3fn
            slot_count: 3
            view: {"BScale(g)": {slot_index: "g%3"}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [row: BM, column: 256]
            dtype: fp32
            slot_count: 1
            view:
              C2: {part: {column: [0, 128]}}
              "ScaleTM(g)": {part: {column: ["128+32*(g%3)", "160+32*(g%3)"]}, dtype: uint8}
          Fragment: {space: register, member_slot_shape: [row: BM, column: 32], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: async
              member: "warp[0:4]"
              verb:
                enter:
                  execution_mode: serial
                  meaning: >-
                    Execute the PDL entry protocol. For global J=0, allocate nothing
                    and leave all work domains empty. Otherwise initialize the
                    shared completion protocol, allocate TensorStorage from warp 0
                    and rendezvous the CTA, including workers with no assigned item.
                resolve:
                  execution_mode: serial
                  meaning: >-
                    Resolve the expert and compact row base. Populate RowIndex
                    for all BM rows, redirecting padding scale rows to base(j),
                    then rendezvous the CTA. RowIndex remains live through this
                    worktile's scale copies; payload boxes keep consecutive rows.
                stage: >-
                  CopyGroup(t,s) commits one asynchronous scale-copy group.
                  For s < I/BK, it stages AScale from ActS and prepared BScale
                  from gemm2_weights_scale by four 4-byte copies per row and
                  operand. Warp 0 also issues the ActQ and weight-payload tensor
                  boxes, whose combined completion accounts for 32768 bytes.
                  Payload and scale slots use the continuous stage g[t,s] modulo
                  three; no scale-prefetch register buffer is used. Done covers
                  these scale copies and payload transfers, before acquire's CTA
                  publication. For s >= I/BK, only the empty copy group is committed;
                  the action still has issue and done events and touches no slot.
                  The first two groups prime each worktile. Each iteration then
                  commits one more group, preserving the two-group lookahead even
                  in the final two iterations.
                wait:
                  execution_mode: serial
                  meaning: >-
                    Previous(g,q) collectively waits for its explicit MMA predecessor
                    and rendezvous the CTA before any slot refill. q identifies the
                    occurrence for noninitial local stages; the first stage has none.
                acquire:
                  execution_mode: serial
                  meaning: >-
                    Wait for the current stage's scale-copy group, leaving at most
                    two newer groups outstanding, and for both tensor boxes.
                    Rendezvous the CTA and establish shared-to-async visibility.
                    Done makes PayloadA, PayloadB, AScale and BScale readable.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: >-
                    The elected warp-0 issuer copies both scale images into ScaleTM,
                    then issues four ordered 64-channel block-scaled updates of C2
                    and one cumulative completion commit. The first update of each
                    worktile initializes C2 without reading its previous value.
                    Done covers scale copies, operand reads and accumulator updates.
                    Same-issuer scale-copy/MMA ordering makes each scale image
                    available before its consuming update.
                drain:
                  execution_mode: serial
                  meaning: >-
                    Before c=0, wait for the final MMA commit and rendezvous the CTA.
                    Each warp owns its TMEM quadrant, one row per lane. Load this
                    quadrant's next 32 columns into Fragment and wait for all those
                    TMEM reads to retire, including reads for padding rows.
                emit:
                  execution_mode: serial
                  meaning: >-
                    Convert Fragment to BF16 and directly store the valid rows to
                    RouteResult. Done consumes Fragment and submits the stores;
                    global visibility is supplied by kernel completion. Padding
                    rows produce no stores. There is no shared output sink.
                close:
                  execution_mode: serial
                  meaning: >-
                    Rendezvous all four warps after their last drain and direct
                    store submission. Only then may the next worktile resolve and
                    prime its operands. All payload and scale data copies for this
                    worktile have been consumed; trailing empty copy groups have no
                    data. Carry ring position and completion parity across worktiles.
                retire:
                  execution_mode: serial
                  meaning: >-
                    After the assigned sequence, warp 0 deallocates TensorStorage.
                    For global J=0 this action is a no-op. Prior drain and close
                    actions have finished all TMEM reads; ordinary global stores
                    finish as part of kernel completion, without a bulk-store drain.
            pipe:
              repeat: t
              prologue: ["enter:Protocol"]
              steady:
                - "resolve:RowIndex(t)"
                - repeat: {p: [0, 2]}
                  steady: ["stage:CopyGroup(t,p)"]
                - repeat: "g[t]"
                  steady:
                    - repeat: {q: [0, "min(1,i)"]}
                      steady: ["wait:Previous(g,q)"]
                    - "stage:CopyGroup(t,i+2)"
                    - "acquire:Operands(g)"
                    - "mma:PayloadA(g)@PayloadB(g)"
                - repeat: c
                  steady: ["drain:Fragment(t,c)", "emit:RouteResult(t,c)"]
                - "close:Worktile(t)"
              epilogue: ["retire:TensorStorage"]
            waits_for:
              data:
                "acquire:Operands(g)": ["stage:CopyGroup(t,i)"]
                "drain:Fragment(t,0)": ["mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])"]
              reuse:
                "wait:Previous(g,q)@done": ["mma:PayloadA(g[t,i-1])@PayloadB(g[t,i-1])"]
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [hidden: "128*FinalWidth"], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:4]"
              verb:
                enter: *pdl_entry
                produce: >-
                  Each thread owns FinalWidth independent output elements. Hoist its eight
                  route indices and scores, initialize Accumulator, then consume
                  valid BF16 route vectors in increasing slot order using finalize's
                  FMA recurrence. Convert and store Y once; no CTA reduction or
                  inter-thread barrier is required. Empty routing still writes zeros.
            pipe: {prologue: ["enter:Protocol"], steady: ["produce:Y"]}
realization:
  require:
    - item: ["design.tile_pipeline::fc1.MMA", "design.tile_pipeline::fc2.Main"]
      choice: >-
        Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp
        scale copies, with cumulative tcgen05.commit completion and
        tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
      reason: Scale visibility and operand-slot reuse depend on ordered scale reads and cumulative MMA completion.
    - item: ["design.tile_pipeline::fc1", "design.tile_pipeline::fc2.Main"]
      choice: >-
        Use tcgen05.ld with tcgen05.wait::ld before releasing or reusing an
        accumulator quadrant, using the issuing warp's hardware quadrant.
      reason: The register fragment must be materialized and all TMEM reads retired before accumulator overwrite or deallocation.
    - item: "design.tile_pipeline::fc2.Main"
      choice: >-
        Use cp.async.ca 4-byte scale copies with one commit group per CopyGroup
        and cp.async.wait_group 2 at acquire. Preserve empty commits, the TMA
        transaction-byte completion waits and the CTA publication rendezvous.
      reason: Independent scale and payload completion mechanisms jointly make each stage ready; empty commits preserve which scale group the wait retires.
    - item: "design.work_schedule::flow"
      choice: >-
        Preserve programmatic-stream-serialization launches and the
        griddepcontrol.wait / launch_dependents protocol for the seven main-chain
        kernels, in eager and recorded work. table_init and probe_scan use
        ordinary launches.
      reason: Launch permission and visible predecessor results are separate guarantees.
