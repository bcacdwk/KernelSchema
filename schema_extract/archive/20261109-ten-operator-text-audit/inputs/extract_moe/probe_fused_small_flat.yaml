            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
      fc2:
        domain: {t: worktile}
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view: {PayloadA(t): {slot_index: t%3}}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: BN2}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view: {PayloadB(t): {slot_index: t%3}}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {AScale(t): {slot_index: t%2}}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: BN2}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {BScale(t): {slot_index: t%2}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn,
            slot_count: 1}
          BPrefetch: {space: register, member_slot_shape: [{row: BN2}, {block: BK/Block}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Metadata: {space: register, member_slot_shape: [{field: 4}], dtype: int32, slot_count: 3, view: {
              Metadata(t): {slot_index: t%3}}}
          Pending: {space: register, member_slot_shape: [{field: 4}], dtype: int32, slot_count: 1, view: {
              Pending(t): {}}}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view: {C2: {part: {column: [0, 128]}}, ScaleTM(t): {part: {column: [128+32*(t%2), 160+32*(t%2)]},
                dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Execute the PDL entry protocol before reading J. A worker whose assigned sequence is
                  empty returns without local allocation, even when J>0. Otherwise warp 0 allocates TensorStorage,
                  initializes completion state and joins all four warps at a CTA rendezvous. Ring positions
                  and completion parity start once per worker. Because I=BK here, each t is both one worktile
                  and one reduction stage.
                resolve: Resolve successive assigned worktiles using a stepped row-tile/column cursor equivalent
                  to work_schedule's strided sequence. A descriptor contains the selected expert, compact row
                  base, valid row bound and output-column origin; ordinary per-lane address encodings do not
                  change these coordinates. Initial descriptors go to Metadata's three-slot ring. Later descriptors
                  go to the single Pending register set, without overwriting the still-live ring entry. Metadata
                  remains needed through that worktile's payload issue, scale fetch and output store submission.
                commit: Move the previously resolved Pending descriptor into Metadata. This occurs after the
                  prior worktile's epilogue has finished reading the aliased ring entry, before new lookahead
                  loads use this descriptor.
                fetch: Load ActS and the prepared weight-scale image for this worktile into the single APrefetch
                  and BPrefetch register sets. All BM activation rows are read, redirecting padded rows to
                  base(j); each operand contributes 2048 bytes. Registers are overwritten only after their
                  previous values were scattered by publish. This synchronous fetch can overlap the previously
                  issued MMA and payload transfers.
                publish: ScaleSM(t) scatters APrefetch and BPrefetch into AScale(t) and BScale(t) with their
                  required scale permutations, then establishes shared-to-async visibility. The register sets
                  are now reusable.
                load:
                  execution_mode: async
                  meaning: PayloadPair(t) issues two tensor transfers into PayloadA(t) and PayloadB(t), using
                    Metadata(t) to select ActQ and the prepared FC2 weight box. Arm a transaction for 32768
                    bytes. Done covers both transfers. Two initial worktiles prime the ring; subsequent loads
                    look two worktiles ahead, while the previous MMA has already retired.
                wait: Previous(t,q) waits for the preceding worktile's cumulative MMA completion and rendezvous
                  all four warps; q marks its noninitial occurrence. Ready(t) waits for this worktile's payload
                  transaction, rendezvous the CTA and establishes visibility for its shared scales. Final(t)
                  waits for the last product, applies the tensor synchronization fence and rendezvous the CTA.
                  None of these waits drains future lookahead transfers.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: Warp 0's elected issuer copies AScale(t) and BScale(t) to ScaleTM(t), four scale-copy
                    operations per operand, then issues four ordered 64-channel block-scaled updates to C2.
                    The first update initializes C2 without reading its old value. Same-issuer ordering makes
                    the scale copies visible to the consuming MMA. A cumulative completion commit covers scale
                    copies, payload reads and accumulator updates.
                emit: Each warp drains its hardware TMEM quadrant into Fragment in BN2/32 successive 32-column
                  chunks. Wait for every TMEM read, convert valid rows to BF16 and submit direct global vector
                  stores to RouteResult; padding rows are read but not stored. Reuse each register fragment
                  after its stores have consumed it. A final CTA rendezvous completes all TMEM reads and store
                  submissions before C2 or the old descriptor is reused. Global output stores may remain in
                  flight.
                retire: Deallocate TensorStorage only after the last epilogue and all assigned work. Empty
                  workers have no allocation to retire, so this action is a no-op for them. All issued lookahead
                  transfers belong to existing worktiles and have been consumed; no speculative tail is left
                  to drain. Kernel completion supplies global RouteResult visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              - {repeat: {a: [0, 'min(3,count(t))']}, steady: ['resolve:Metadata(a)']}
              - {repeat: {a: [0, 'min(1,count(t))']}, steady: ['fetch:ScalePrefetch(a)', 'publish:ScaleSM(a)']}
              - {repeat: {a: [0, 'min(2,count(t))']}, steady: ['load:PayloadPair(a)']}
              - {repeat: {a: [1, 'max(1,min(2,count(t)))']}, steady: ['fetch:ScalePrefetch(a)']}
              steady:
              - {repeat: {q: [0, 'min(1,t)']}, steady: ['wait:Previous(t,q)', 'emit:RouteResult(t-1)']}
              - {repeat: {u: ['min(max(3,t+2),count(t))', 'min(max(3,t+3),count(t))']}, steady: ['commit:Metadata(u)']}
              - {repeat: {u: ['min(t+1,count(t))', 'min(t+2,count(t))']}, steady: ['publish:ScaleSM(u)']}
              - {repeat: {u: ['min(t+2,count(t))', 'min(t+3,count(t))']}, steady: ['load:PayloadPair(u)']}
              - wait:Ready(t)
              - mma:PayloadA(t)@PayloadB(t)
              - {repeat: {u: ['min(t+2,count(t))', 'min(t+3,count(t))']}, steady: ['fetch:ScalePrefetch(u)']}
              - {repeat: {u: ['min(t+3,count(t))', 'min(t+4,count(t))']}, steady: ['resolve:Pending(u)']}
              epilogue:
              - {repeat: {a: ['max(0,count(t)-1)', count(t)]}, steady: ['wait:Final(a)', 'emit:RouteResult(a)']}
              - retire:TensorStorage
            waits_for:
              data:
                wait:Previous(t,q)@done:
                - Main/mma:PayloadA(t-1)@PayloadB(t-1)
                wait:Ready(t)@done:
                - Main/load:PayloadPair(t)
                wait:Final(a)@done:
                - Main/mma:PayloadA(a)@PayloadB(a)
      finalize:
        resource: {Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32,
            slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp
                  0 then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices
                  and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot
                  order using finalize's FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread
                  barrier is required. Empty routing still writes zeros.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:Y']}
realization:
  require:
  - item:
    - design.tile_pipeline::fc1.MMA
    - design.tile_pipeline::fc2.Main
    choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and the tcgen05.cp scale path, with cumulative
      tcgen05.commit completion and tcgen05.fence::after_thread_sync at the stated synchronization boundaries.
    reason: Ordered scale consumption and cumulative operand-read completion implement both phases' ring and
      accumulator reuse protocols.
  - item:
    - design.tile_pipeline::fc1
    - design.tile_pipeline::fc2.Main
    choice: Use tcgen05.ld and tcgen05.wait::ld for register materialization, respecting each issuing warp's
      hardware quadrant. Retire the reads before FC1's early release or FC2's boundary epilogue rendezvous.
    reason: Accumulator reuse requires completed TMEM reads, independently of the later global store completion.
  - item: design.tile_pipeline::fc2.Main
    choice: Bind PayloadPair to TMA boxes over ActQ and the prepared FC2 weight byte map, with transaction-byte
      completion. Stage scales through vector global-to-register loads and shared stores, using fence.proxy.async.shared::cta
      and the stated CTA rendezvous before tensor consumption.
    reason: The scale lookahead is carried in registers, so payload transactions and shared scale publication
      have distinct completion guarantees.
  - item: design.work_schedule::flow
    choice: For prepare, gather, fc1, fc2 and finalize, preserve programmatic-stream-serialization launches
      and the griddepcontrol.wait / launch_dependents protocol for eager and recorded work. The scan uses an
      ordinary launch on the caller stream.
    reason: Launch permission and visible predecessor results are separate guarantees.
