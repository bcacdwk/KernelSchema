meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation
    requantization and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: probe_fused_small_flat
    parent: fused_small_flat
    when: |
      Let rebuild mean that Model.forward's identity/key caches and default C
      call wrapper do not select a published ABI, so forward constructs a new
      MoEABI a. All implementation controls follow the frozen default scope.
      Let R=T*K, p be Params derived from a, and small_thresh be the saved
      routing preparation threshold: 3000 when 3000<R<=6500 and the rebuild's
      route histogram is nonempty, otherwise 6500. That histogram counts valid
      expert IDs in the current route_ids, via one cached ids.tolist() readback
      when an automatic selection gate first requests it.
      FC2Flat means launch_gemm<false> obtains a non-null
      tma_set(p,false,128,false) and selects its cfg2=23 NK1 flat-stream kernel;
      for recorded work use the selection made at recording.
      Select exactly when this request rebuilds a, ensure_tables finds the
      device already in _tables_ready and submits no k_init_tables, a.cfg=97,
      a.cfg2=23, I=256, R<=a.small_thresh, and FC2Flat. The zero probe reaches
      and submits one k_zero_scan after successful dirty allocation and zero
      initialization, but does not return the accepted value 1; Python keeps
      zero_ok=false and a.zflag=a.zflag_host=0. This includes a negative probe
      status or a caught exception after scan submission; an error before
      scan submission does not select this node.
      moe_run returns zero through one caller-stream run_pipeline or the
      ordinary full-graph replay arm. Every private-stream run_pipeline in
      this request, if present, is capture-only after successful
      cudaStreamBeginCapture; no extra uncaptured private-stream chain occurs.
      The main chain may be eager, a first replay, or an existing-graph replay.
      Capturing work only records it; its GPU events arise on execution.
      Any service or scan prefix actually executed outside capture remains
      part of this request even when the main chain is only recorded.
      Host choices and bindings stay fixed at rebuilding/recording; device
      reads use execution-time contents, not the histogram or probe snapshot.
design:
  math_reshape:
    thesis: Check zero eligibility before rebuilding the ordinary packed MoE path; a rejected or failed probe
      adds a full input/scale scan without eliminating any expert computation. Compact valid routes by expert
      and preserve packed block-scaled operands through both contractions. Fuse FC1, approximate gated activation
      and requantization, eliminating full FC1 and FP32 activation materialization at the cost of a gathered
      input copy, full padded row arithmetic and changed activation rounding.
    rewrite:
    - step: probe
      name: Evaluate zero eligibility without changing the ordinary result
      math: |
        For every packed hidden_states byte q, test whether either E2M1
        magnitude is nonzero; the two sign bits do not enter this predicate.
        For each byte v encoding hidden_states_scale, gemm1_weights_scale or
        gemm2_weights_scale, test (v mod 128)=127, the E4M3FN nonfinite code.
        For every route_weights, gemm1_alpha and gemm1_beta element, test
        nonfiniteness; test gemm1_clamp_limit only when it is not None.
        These tests cover all elements, including invalid routes and unused
        experts; weight payloads and route_ids are not tested.
        For b=0..ScanWorkers-1, ProbePart(b)=int32(any failing test in ScanSet(b));
        an empty set yields 0. ScanSet partitions those tests as bound below.
        Dirty starts at int32(0). Each ProbePart(b)=1 contributes an idempotent
        set to int32(1), while a zero part leaves it unchanged. After all scan
        work completes, Dirty=max_b ProbePart(b).
        Dirty is retained only for the probe's host readback, not for the expert
        kernels. The host accepts only a probe status of 1; this node follows
        the unmodified ordinary output formulas for every other status.
      symbol:
        ScanWorkers: {meaning: Number of scan shards, binding: 'bind:design.work_schedule::ScanWorkers'}
        ScanSet: {meaning: Partition of the eligibility tests, binding: 'bind:design.work_schedule::ScanSet'}
        ProbePart: {meaning: One shard nonzero verdict, shape: [], dtype: int32}
        Dirty: {meaning: Global eligibility verdict for host readback, shape: [], dtype: int32, retention: keep_value
            invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        R = T*K. Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos:
          meaning: Inverse compact-route map used by gather and finalize
          shape:
          - {token: T}
          - {slot: K}
          dtype: int32
          retention: keep_value invocation
        PackedToken:
          meaning: Compact token index written but not loaded by the selected kernels
          shape:
          - {route: M}
          dtype: int32
          retention: keep_value invocation
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        PackedExpert:
          meaning: Compact expert index written but not consumed by this path
          shape:
          - {route: M}
          dtype: int32
          retention: keep_value invocation
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32,
          retention: keep_value invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        Nchunk = 9*H/256. For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8,
          retention: keep_value invocation}
        GatherS:
          meaning: Gathered input block scales
          shape:
          - {route: M}
          - {hidden_block: H/Block}
          dtype: fp8_e4m3fn
          retention: keep_value invocation
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {
              slot: K}, {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1:
          meaning: Joint up and gate accumulator of one FC1 worktile
          shape:
          - {row: BM}
          - {column: 2*BN1}
          dtype: fp32
          retention: carry_forward (j,n); l=-1..H/64-1
        ActQ:
          meaning: Packed quantized intermediate payload
          shape:
          - {route: M}
          - {packed_intermediate: I/2}
          dtype: uint8
          retention: keep_value invocation
        ActS:
          meaning: Intermediate quantization scales
          shape:
          - {route: M}
          - {intermediate_block: I/Block}
          dtype: fp8_e4m3fn
          retention: keep_value invocation
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the
          sigmoid-based tanh identity and reciprocal-multiply quantization replace the reference evaluation.
          unknown: no verified uniform error bound for the full declared domain is supplied; source comments
          and local probes are not an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation;
          four such updates make one BK stage. The notation does not assert FP32 products or reference-order
          bit equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2:
          meaning: Accumulator of one FC2 worktile
          shape:
          - {row: BM}
          - {column: BN2}
          dtype: fp32
          retention: carry_forward (j,n); l=-1..I/64-1
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}],
          dtype: bf16, retention: keep_value invocation}
      arithmetic:
        accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the
          reduction extent and output columns change.
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return [output],
        preserving the tensor storage identity required by Contract.
      symbol: {Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}}
    ledger:
      baseline: Contract evaluation for the M valid routes, saving decoded FP32 activations, both FC1 outputs
        and Act before QDQ; save the same BF16 route results.
      matmul:
      - {item: Expert contractions, change: '3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded
          padded rows', by: [fc1_quantize, fc2]}
      vector:
      - item: Activation and quantization
        change: M*I -> PaddedRows*I channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E)) integer routing
          work per invocation
        by:
        - routing
        - fc1_quantize
      - item: Eligibility tests
        change: Add T*H/2 packed-byte tests, T*H/Block activation-scale tests, 3*E*H*I/Block weight-scale tests,
          T*K score tests and (2 or 3)*E parameter tests per executed scan; no early termination
        by:
        - probe
      footprint:
      - item: Intermediate materialization
        change: 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes;
          BF16 route bytes remain 2*M*H
        by:
        - gather
        - fc1_quantize
        - fc2
      - {item: Probe verdict, change: 'Add one 4-byte device verdict until probe cleanup, separate from the
          persistent MoE workspace', by: [probe]}
      traffic:
      - {item: Gather, change: 'Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later
          operand reads', by: [gather]}
      error:
      - item: Numerical evaluation
        change: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I
          evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not
          established
        by:
        - fc1_quantize
        - finalize
  work_schedule:
    thesis: |
      One eligibility scan precedes the five-kernel ordinary MoE chain.
      The scan has ordinary stream completion ordering; only prepare, gather,
      FC1, FC2 and finalize use PDL's early launch permission with separate
      predecessor-result visibility. The scan is outside the internally cached
      main graph, so rebuilding a does not add it to later ABI reuse.

      The rebuild's service prefix performs the requested route-ID host readback
      and histogram before the probe, without another table initialization.
      A fresh four-byte Dirty word is zeroed on the caller stream before scan.
      After scan submission, a successful launch-error check permits a stream
      synchronization attempt. Only successful synchronization leads to an
      attempted four-byte device-to-host copy into a host word initialized to 1;
      the source does not check that copy's status. The reached probe paths
      release Dirty during cleanup, then zero_ok=false selects the main chain.
      These service attempts do not manufacture completion events on failure.
      A workspace-cache miss additionally zeroes 2*E int32 count/fill words
      after the probe and before the main chain; a hit retains them. prepare
      overwrites every count, and this path never reads fill. Other workspace
      views are allocated without initialization. No verification state is allocated.

      One CTA prepares all routing; flat gather exposes parallelism and strided
      persistent GEMM workers retain operand rings across worktiles. Global
      workspace persists across calls and graph replays, with unwritten R-row
      operand and route-result bytes retained. Same-stream ordering covers the
      scan, service operations and main work. There is no new cross-stream
      exclusion or host wait for main-chain completion. A failed probe does not
      prove a usable verdict or successful execution of subsequent kernels.
    flow:
      launch:
      - {phase: [scan]}
      - {phase: [prepare], protocol: pdl, start_after: scan.kernel_done}
      - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      scan:
        describe: Evaluate one strided shard of eligibility tests and merge its nonzero verdict.
        decomposition:
          strategy: |
            ScanWorkers=296. ScanSet(b) contains every payload and activation-scale
            test in token rows t=b+296*m, m>=0, t<T. It also contains score indices
            i=256*b+a+296*256*m and parameter expert indices with the same rule,
            0<=a<256, clipped to their respective extents T*K and E.
            For each weight-scale tensor independently, it contains the four byte
            tests in flattened four-byte groups indexed by that same i rule;
            the group extents are E*2*I*H/(4*Block) and E*H*I/(4*Block).
            The optional clamp input follows the parameter assignment only when
            present. These are independent local loops, not Cartesian products.
            Each shard evaluates all its tests without early exit, then contributes
            ProbePart to the global Dirty reduction defined by probe. Dirty's zero
            initialization precedes every shard; there is no inter-CTA scratch or
            second reduction kernel. The source's concurrent same-value stores
            do not establish race-free lowering of this reduction.
          partition: {scan_shard: {size: ScanWorkers, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [{token: 1}, {packed_hidden: H/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{token: 1}, {hidden_block: H/Block}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{element: 256}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_weights_scale: {shape: [{element: 1024}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights_scale: {shape: [{element: 1024}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {ProbePart: {shape: [], dtype: int32}}
            tile_reduction:
              dimension: scan_shard
              input: ref:design.math_reshape::ProbePart
              output: ref:design.math_reshape::Dirty
              method: ref:design.math_reshape::probe
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: ScanWorkers}
        schedule:
          worktile_order:
          - {by: scan_shard, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: BM=128, RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover
            contiguous, clipped ranges of flattened route slots; these are local subdivisions of one worktile,
            not independent work. Stage all IDs once, form group histograms and their exclusive expert bases,
            scan expert counts and tile counts, then assign local atomic ranks and enumerate J tiles by binary
            search of TilePrefix. This worktile writes all Counts, both E+1 prefixes and every RoutePos; packed
            maps and tile maps write only their used prefixes. No separate count initialization or global reservation-counter
            update is needed.
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}}}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk)
            coordinates, with chunk fastest; a tile can cross token boundaries. All work is empty when M=0.
            Otherwise chunks whose token has no routes are visited without payload reads or writes; the final
            packet is clipped.
          partition: {chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}}
          worktile:
            invariant:
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
          target: {single_tile: {GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'min(1184,ceil_div(T*Nchunk,128))'}
        schedule:
          worktile_order:
          - {by: chunk, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK
            local iterations and four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j);
            padded arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the
            clamp slice is read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is
            the ABI''s row-tile upper bound. Let Cap be the cached automatic grid cap: twice the queried SM
            count, or zero if that query failed. For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx))
            if Cap>0 and Nx*TileCap>Cap else TileCap). The submitted grid uses G(I/BN1), independent of the
            current J.'
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn,
                direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(I/BN1)}
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages.
            Only valid(j) output rows are stored. All submitted workers remain present when J=0, but their
            assigned sequences are empty.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn,
                direction: ascending}
          target: {single_tile: {RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One
            worker produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are
            a local reduction, not independently assigned work; masked routes do not read the route-result
            slab.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*FinalWidth}}
          worktile:
            invariant: {RoutePos: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: Eight cooperating scan warps reduce register-carried tests to one per-CTA verdict and contribute
      to Dirty without an inter-CTA barrier. One cooperative CTA prepares routing; FC1 retains separate operand
      producers, MMA issue and four epilogue warps with early accumulator release. Four cooperating FC2 warps
      stream their one-stage worktiles through three payload slots and two scale slots. Payload, scale and
      metadata lookahead cross work boundaries, while the previous product and direct BF16 store submission
      precede accumulator and metadata reuse. This spends prefetch registers to avoid per-worktile re-priming.
    phase:
      scan:
        resource: {ScanAccum: {space: register, member_slot_shape: [{element: 256}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                produce: |
                  Initialize one unsigned predicate accumulator per participating thread
                  in ScanAccum. Cooperatively read and test this shard's assigned inputs,
                  carrying each accumulator across all local loops without early exit.
                  A CTA-wide any reduction and rendezvous produce ProbePart. The elected
                  writer contributes 1 to global Dirty only for a nonzero part; a zero
                  part submits no store. No member reads Dirty, and no CTA waits for
                  another shard. Done covers the shard's reads, reduction and any store
                  submission; kernel completion supplies visibility for host readback.
                  Even a shard without tests completes the reduction with zero.
            pipe: {steady: ['produce:Dirty']}
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1,
            view: {route_ids: {}}}
          GroupTable:
            space: SMEM
            member_slot_shape:
            - {group: RouteGroups}
            - {expert: 256}
            dtype: int32
            slot_count: 1
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g, g+1],
                  expert: [0, E]}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp
                  0 then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: Stage every route ID once into StagedIds and zero the full GroupTable, including the
                  unused expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route
                  group. Rendezvous before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive
                  reservation bases of routing, and writes Counts. Another rendezvous precedes the paired expert
                  scans; ScanScratch holds two 64-word scan arrays and J. Publish Offs and TilePrefix both
                  globally and into their local caches, then rendezvous before scatter and tile enumeration.
                  Each warp advances its own RankCursor by atomics while writing RoutePos and all three packed
                  maps. Enumerate and store TileExpert and TileRow from the cached tile prefix. StagedIds and
                  the prefix caches survive through their last reads; GroupTable is overwritten only after
                  histogram production is complete. M=0 still writes zero Counts/prefixes and RoutePos=-1,
                  with no packed or tile stores.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:RoutePos']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp
                  0 then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos
                  entries, and loads a 16-byte source only if some route is valid. Replicate to those destinations;
                  the same registers hold this chunk through all route stores. No inter-thread exchange.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:GatherChunk(t)']}
      fc1:
        domain: {t: worktile, i: [0, H/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view: {PayloadA(g): {slot_index: g%3}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3,
            view: {PayloadB(g): {slot_index: g%3}}}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {AScale(g): {slot_index: g%2}}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {BScale(g): {slot_index: g%2}}
          APrefetch:
            space: register
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {'APrefetch(t,i)': {slot_index: i%2}}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]},
                dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                  work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                  TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                  A worker with no assigned item still participates.
                prime: Resolve this worktile's expert and row base. Load the first GatherS stage and, when
                  the local stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting
                  padding scales to the first valid row. Prefetch registers are restarted per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp
                  rendezvous and full-stage arrival. Thus stage 1 is loaded again after being primed; the first
                  primed copy is overwritten without use. Done includes this arrival, not completion of the
                  independent payload/weight-scale loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0
                  deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                  drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - prime:APrefetch(t)
              - {repeat: 'g[t]', steady: ['publish:AScale(g)']}
              epilogue:
              - retire:TensorStorage
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and
                    allocates TensorStorage; all seven warps rendezvous once before entering their independent
                    work loops. A worker with no assigned item still participates.
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes.
                  Arm the full-stage transaction count for 32768 payload bytes. Done covers both payload transfers.
                  Payloads use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the
                  prepared ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage
                  2048 bytes. Done is their completion arrival to the full-stage protocol. Also issue an L2-only
                  weight-scale hint two stages ahead when that stage lies in the same worktile; the hint has
                  no consumer or completion edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp
                    0 deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert
                    a per-worktile drain or a new global memory fence; kernel completion supplies the external
                    visibility.
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'],
              epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and
                    allocates TensorStorage; all seven warps rendezvous once before entering their independent
                    work loops. A worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit
                    predecessors; q identifies the optional wait before the first scale copy of a worktile.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale
                  into ScaleTM: four scale-copy operations for each operand. Issuance includes submission of
                  all scale copies; only then does this issuer advance to the MMA action. Done is covered by
                  the following cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates
                  to C1. The first update initializes C1 without reading its old value. The fused 128-column
                  product covers both up and gate. Issue a cumulative completion commit after each stage; done
                  covers scale copies, payload reads and accumulator updates. The last stage also commits result
                  readiness for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed ScaleTM
                  before a later scale copy overwrites that scale slot, and makes each scale copy visible before
                  the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp
                    0 deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert
                    a per-worktile drain or a new global memory fence; kernel completion supplies the external
                    visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - {repeat: {q: [0, 'min(1,t)*(1-Hoist)']}, steady: ['wait:Drain(t,q)']}
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue:
              - retire:TensorStorage
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)',
                  'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done:
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]):
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                  work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                  TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                  A worker with no assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane.
                  For c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment,
                  issue both reads before waiting, and wait for all their TMEM reads to retire. Done makes
                  this register fragment usable.
                emit: Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize
                  ScalePack and retain its first two scale bytes; c=1 adds the last two, stores the full four-byte
                  scale word on valid rows and resets it. Store valid payload bytes for each c. Done means
                  local computation and store submission consumed Fragment; global stores can still be in flight.
                  Invalid rows submit no output stores.
                release: This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases
                  only this warp's accumulator quadrant; MMA reuse waits for all four epilogue roles. This
                  warp immediately continues its final conversion/store tail without waiting for the other
                  epilogue warps or for global output-store completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0
                  deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                  drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              steady:
              - drain:Fragment(t,0)
              - emit:ActQ(t,0)
              - drain:Fragment(t,1)
              - release:Accumulator(t)
              - emit:ActQ(t,1)
              epilogue:
              - retire:TensorStorage
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
