      activate:
        resource:
          PartialLoad:
            space: register
            member_slot_shape: [{slice: SK}, {quant_block: 64}, {channel: 2*Block}]
            dtype: fp32
            slot_count: 1
          Merged:
            space: register
            member_slot_shape: [{quant_block: 64}, {channel: 2*Block}]
            dtype: fp32
            slot_count: 1
          Activated:
            space: register
            member_slot_shape: [{quant_block: 64}, {channel: Block}]
            dtype: fp32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor grid completion and visibility; warp 0 grants dependent-grid
                  launch permission. This does not grant data readiness.
                load: Four neighboring threads own each 16-channel quantization block, with four up and four gate
                  channels per thread. For every in-range backing row, load both slice vectors into PartialLoad
                  before the expert-ID test. Out-of-range packet lanes do no reads; unused route rows still load
                  allocated backing bytes. Done means these vectors are available locally.
                produce: Read PackedExpert's backing row and reject out-of-range IDs before any per-expert parameter
                  access. Accepted groups merge the retained slices into Merged in ascending order, then compute
                  merge_quantize into Activated. Four-lane maximum exchange combines all 16 absolute values; paired
                  neighbor exchange assembles packed payload words. Store ActQ and one ActS byte per accepted block,
                  including unused backing rows that pass the check. No cross-block or cross-CTA exchange is needed.
                  Rejected groups perform no arithmetic or stores, but the action still completes. PartialLoad is
                  dead after the merge; Merged is dead after activation; Activated is dead after quantization and
                  store submission.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['load:PartialLoad', 'produce:ActQ']
      fc2:
        domain:
          t: worktile
          i: [0, I/BK]
          q: [0, I/BK+2]
        resource:
          RowIndex:
            space: SMEM
            member_slot_shape: [{row: BM}]
            dtype: int32
            slot_count: 1
          PayloadA:
            space: SMEM
            member_slot_shape: [{row: BM}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(t,q): {slot_index: q%3}
          PayloadB:
            space: SMEM
            member_slot_shape: [{row: BN2}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(t,q): {slot_index: q%3}
          AScale:
            space: SMEM
            member_slot_shape: [{row: BM}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 3
            view:
              AScale(t,q): {slot_index: q%3}
          BScale:
            space: SMEM
            member_slot_shape: [{row: BN2}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 3
            view:
              BScale(t,q): {slot_index: q%3}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view:
              C2:
                part:
                  column: [0, BN2]
              ScaleTM(t,i):
                part:
                  column: [BN2+32*(i%3), BN2+32*(i%3)+32]
                dtype: uint8
          Fragment:
            space: register
            member_slot_shape: [{row: BM}, {column: 32}]
            dtype: fp32
            slot_count: 1
        role:
          Main:
            info:
              member: warp[0:4]
              execution_mode: serial
              verb:
                enter: All threads wait for predecessor grid completion and visibility, then warp 0 grants dependent-grid
                  launch permission. When global J=0, skip local allocation and all work loops. Otherwise initialize
                  MMA completion state, allocate TensorStorage and rendezvous all four warps, including workers
                  whose assigned sequence is empty. MMA completion parity starts once here and continues across
                  worktiles; payload and scale slots restart at zero for each worktile after the preceding worktile
                  release.
                compute: Rows(t) resolves the worktile expert and base(j), then fills RowIndex[r] with rr(j,r) from
                  fc2. All four warps rendezvous before using it. Both ActQ payload and ActS scale loads use this
                  same map, so every padded row repeats the first valid route. RowIndex survives through all payload
                  and scale staging of this worktile.
                stage:
                  execution_mode: async
                  meaning: Payload(t,q) always commits one asynchronous-copy group. For q<I/BK, cooperatively copy
                    the BM-row ActQ payload selected by RowIndex and the BN2-row prepared weight payload into PayloadA
                    and PayloadB at slot q%3. Prepared weight addressing preserves the Contract permutation. Each
                    operand row contributes BK/2 bytes in 16-byte transfers. Done covers these payload copies. For
                    q>=I/BK, issue no transfers or resource accesses, but retain the empty commit and its events.
                    Two leading groups precede the main loop; each iteration issues the group two stages ahead.
                    There are no tensor-map payload transactions or scale copies in these groups.
                wait: Prior(t,i,u) waits for the explicit previous-stage MMA completion and rendezvous of all four
                  warps; u names its noninitial-stage occurrence. Stage(t,i) waits until the current payload group
                  has completed with two newer groups outstanding, then rendezvous all four warps and establish
                  tensor-operation visibility for the payload and the synchronously staged scales. Result(t) waits
                  for the last MMA commit and rendezvous before accumulator reads. These waits preserve carried
                  MMA completion parity; they do not grant dependent-grid launch permission.
                contract:
                  execution_mode: async_ordered_completion
                  meaning: For C2(t,i), the elected warp-0 issuer copies AScale and BScale into ScaleTM(t,i), then
                    issues the four ordered 64-channel block-scaled updates of fc2. The first update of each worktile
                    initializes C2 without reading old accumulator data. Commit one cumulative completion covering
                    scale copies, payload reads and accumulator writes. Same-issuer ordering makes the scale copies
                    visible to their MMA consumers. No other warp is an independent producer or epilogue role.
                release: Worktile(t) rendezvous all four warps after all fragment reads and direct-store submissions.
                  This permits the next worktile to overwrite C2, RowIndex and operand slots starting at slot zero;
                  no next-work prime is issued before this point. Global stores may remain in flight.
                retire: After the whole assigned sequence, warp 0 deallocates TensorStorage. For J=0 this is a no-op;
                  for J>0 an empty worker still retires its allocation. All MMA and TMEM reads have retired and
                  all issued data-copy groups have been consumed. Kernel completion covers direct global stores;
                  empty copy-group commits need no payload drain.
                produce: For RouteResult(t), each warp independently walks BN2/32 consecutive 32-column chunks.
                  Read its hardware quadrant, one row per lane, into Fragment and wait for those TMEM reads to retire.
                  Read all BM rows, including padding; convert to BF16 with round-to-nearest-even and directly store
                  only rows r<valid(j). The next chunk reuses that warp's Fragment after store submission has consumed
                  it. Warps need no rendezvous between chunks. Done covers all chunk reads, conversions and store
                  submissions, with global visibility supplied by kernel completion. No shared output sink or bulk
                  output store is used.
                load: Scale(t,q), for q<I/BK, synchronously reads all BM rows of ActS and all BN2 rows of prepared
                  weight scales into AScale and BScale at slot q%3, preserving the prepared-scale permutation. Each
                  row contributes BK/Block scale bytes. Register intermediates are transient within this action,
                  with no separate prefetch slab. Establish generic-shared-store visibility to the async proxy.
                  Up to two leading scale stages are filled before the main loop; refill q=i+2 is after current-stage
                  MMA issuance and can overlap it. The preceding-stage MMA retirement protects this slot from its
                  previous reader. For q>=I/BK, perform no reads, writes or resource accesses; the action is a completed
                  no-op.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - compute:Rows(t)
              - repeat:
                  p: [0, 2]
                steady: ['load:Scale(t,p)', 'stage:Payload(t,p)']
              - repeat: i
                steady:
                - repeat:
                    u: [0, 'min(1,i)']
                  steady: ['wait:Prior(t,i,u)']
                - stage:Payload(t,i+2)
                - wait:Stage(t,i)
                - contract:C2(t,i)
                - load:Scale(t,i+2)
              - wait:Result(t)
              - produce:RouteResult(t)
              - release:Worktile(t)
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                wait:Stage(t,i)@done: ['stage:Payload(t,i)']
                wait:Result(t)@done: ['contract:C2(t,last(i))']
              reuse:
                wait:Prior(t,i,u)@done: ['contract:C2(t,i-1)']
      finalize:
        resource:
          Accumulator:
            space: register
            member_slot_shape: [{hidden: 128*FinalWidth}]
            dtype: fp32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices
                  and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order
                  using finalize's FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier
                  is required. Empty routing still writes zeros.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['produce:Y']
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale copies, with cumulative tcgen05.commit
      completion and tcgen05.fence::after_thread_sync at the declared synchronization boundaries.
    reason: The tensor-storage path requires ordered scale-copy/MMA visibility and completion that covers operand
      reads before slot reuse.
  - item: design.tile_pipeline::fc1
    choice: For the four epilogue roles, use tcgen05.ld with tcgen05.wait::ld before accumulator-release arrival,
      using each issuing warp's hardware quadrant.
    reason: The next worktile may reuse the accumulator only after every quadrant's TMEM reads have retired; raw
      partial stores then remain subject to kernel completion.
  - item: design.tile_pipeline::fc2.Main
    choice: Bind payload staging to 16-byte cp.async.cg copies, one commit_group per Payload action and wait_group
      2 at Stage, including the empty tail groups. Bind scale staging to ordinary global loads and shared stores
      with fence.proxy.async.shared::cta; preserve the CTA rendezvous before tensor consumption.
    reason: The payload lookahead depends on group retirement, while scales use synchronous generic-proxy stores.
      The tensor consumer requires visibility from both paths before reading the three-slot ring.
  - item: design.tile_pipeline::fc2.Main
    choice: Use tcgen05.ld and tcgen05.wait::ld for each 32-column Fragment in the issuing warp's hardware quadrant
      before conversion and direct BF16 stores.
    reason: All four cooperative warps need their own quadrant reads to retire before using registers and before
      the worktile-end accumulator reuse boundary.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents
      protocol for eager and recorded work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.tile_pipeline::fc1.BProducer
    choice: Use tensor-map gather4 with the clipped box count and matching expect_tx byte count, joining payload
      transactions with both scale producers in the full-stage protocol.
    reason: Readiness must include every issued payload byte while excluding omitted padding boxes; a fixed full-tile
      transaction count would not complete on clipped work.
