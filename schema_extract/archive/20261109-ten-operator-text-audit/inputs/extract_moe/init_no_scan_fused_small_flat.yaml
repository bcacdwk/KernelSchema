"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Precomputed routed mixture of experts with prepared NVFP4 weights,\
    \ gated activation, activation requantization and BF16 output."
  "source": "SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "init_no_scan_fused_small_flat"
    "parent": "no_scan_fused_small_flat"
    "when": |
      Let a be the MoEABI rebuilt by Model.forward after its identity and key
      caches miss. All implementation controls follow the frozen default
      implementation scope. In a, cfg/cfg2 select FC1/FC2, small_thresh is
      the saved routing preparation threshold, and zflag/zflag_host are the
      optional device verification state and pinned host mirror.
      Let R=T*K. Within this rebuild, route_hist counts valid expert IDs
      0<=e<E in route_ids after an ids.tolist() readback, where ids is the
      contiguous route_ids tensor. The readback occurs only when an automatic
      gate requests this histogram, and later gates reuse it. Under the
      defaults, small_thresh is 3000 when 3000<R<=6500 and route_hist is
      nonempty, otherwise 6500.
      TableInit means an actual k_init_tables submission by ensure_tables;
      its per-device ready-set hit returns without that submission or its
      device synchronization. ProbeScan means an actual k_zero_scan submission
      by moe_zero_probe. Both include work recorded for later execution.
      A probe error or exception does not imply that ProbeScan is absent:
      classify by the work actually submitted. The allocation-error
      return -1 and reset-error return -2 precede the scan launch.
      Let p be Params derived from a. FC2Flat means launch_gemm<false>
      obtains a non-null map set from tma_set(p,false,128,false) and selects
      the cfg2=23 flat-stream NK1 kernel. For recorded work use that selection
      at recording.
      Select exactly when this call rebuilds a, TableInit is present,
      ProbeScan is absent, ensure_tables returns after its successful device
      synchronization and ready-set publication, zero_ok is false,
      a.cfg=97, a.cfg2=23, I=256, FC2Flat,
      a.zflag=0, a.zflag_host=0, R<=a.small_thresh, and moe_run returns zero
      through either a single caller-stream run_pipeline call or graph_replay's
      ordinary full-graph arm. Every private-stream run_pipeline call in this
      request, if present, is capture-only after successful
      cudaStreamBeginCapture; no additional uncaptured pipeline is submitted
      there. This includes eager execution, replay after graph construction,
      existing-graph replay, and eager fallback with the same submitted work.
      The table prefix belongs to this rebuild and precedes any private-stream
      pipeline recording. That recording creates no computation-completion
      events; its replay executes the five pipeline kernels, without repeating
      table initialization, route_hist, the probe or ABI construction. For
      recorded work, host choices, by-value scalars and tensor bindings stay
      fixed at recording; device tensor reads use execution-time contents.
      A synchronization exception in ensure_tables does not reach this path.
"design":
  math_reshape:
    thesis: >-
      Materialize the three format tables once for this device initialization;
      the selected packed tensor-core path does not consume them.
      Compact valid routes by expert and preserve packed block-scaled operands through
      both contractions. Fuse FC1, approximate gated activation and requantization,
      eliminating full FC1 and FP32 activation materialization at the cost of a
      gathered input copy, full padded row arithmetic and changed activation rounding.
    rewrite:
      - step: format_tables
        name: Materialize byte-format conversion tables
        math: |
          For b = 0..CodeCount-1, define sign = floor(b/128),
          exponent = floor((b mod 128)/8), and mantissa = b mod 8.
          Let magnitude = mantissa*2^(-9) when exponent=0,
          (1+mantissa/8)*2^(exponent-7) otherwise, except that
          exponent=15 and mantissa=7 gives a quiet FP32 NaN.
          Let scale_byte(b) be magnitude with the sign bit sign, preserving
          signed zero and NaN. Using Contract's F nibble decoder,
          FormatFP4[b,0] = bf16(F(b mod 16));
          FormatFP4[b,1] = bf16(F(floor(b/16)));
          FormatScale[b] = scale_byte(b);
          FormatScalePair[b,0] = FormatScalePair[b,1] = bf16(FormatScale[b]).
          Overwrite all entries of these device-module tables. Their values
          persist across requests for the module lifetime; this node's
          routing, gather, FC1, FC2 and finalize do not read them.
        symbol:
          CodeCount: {meaning: Number of encodings in one format byte, value: 256}
          FormatFP4: {meaning: Low- and high-nibble decoded BF16 pair for each byte, shape: [code: CodeCount, component: 2], dtype: bf16, retention: "keep_value device"}
          FormatScale: {meaning: FP32 E4M3 byte decoder table, shape: [code: CodeCount], dtype: fp32, retention: "keep_value device"}
          FormatScalePair: {meaning: Replicated BF16 scale decoder table, shape: [code: CodeCount, component: 2], dtype: bf16, retention: "keep_value device"}
      - step: routing
        name: Compact routes and enumerate expert row blocks
        math: |
          R = T*K. Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
          For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
          [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
          Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
          Offs[0] = TilePrefix[0] = 0;
          Offs[e+1] = Offs[e] + Counts[e];
          TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
          For each group g and expert e, the local reservation cursor starts at
          sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
          by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
          Thus groups occupy disjoint expert intervals in ascending group order,
          while ranks within a group follow atomic arrival order. rho is a bijection
          from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
          RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
          PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
          PackedExpert[rho(t,k)] = route_ids[t,k].
          For TilePrefix[e] <= j < TilePrefix[e+1],
          TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
          Define base(j) = Offs[TileExpert[j]] + TileRow[j],
          valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
          Only the used prefixes of the packed arrays and tile arrays are written.
        symbol:
          RouteGroups: {meaning: Number of contiguous routing groups, binding: "bind:design.work_schedule::RouteGroups"}
          RouteBatch: {meaning: Contiguous slots per routing group, binding: "bind:design.work_schedule::RouteBatch"}
          BM: {meaning: Expert row block size, binding: "bind:design.work_schedule::BM"}
          Hist: {meaning: Expert histogram for one route batch, shape: [expert: E], dtype: int32}
          Counts: {meaning: Current route count per expert, shape: [expert: E], dtype: int32, retention: "keep_value invocation"}
          Offs: {meaning: Compact expert row prefix, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          TilePrefix: {meaning: Prefix of expert row blocks, shape: [prefix: "E+1"], dtype: int32, retention: "keep_value invocation"}
          RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [token: T, slot: K], dtype: int32, retention: "keep_value invocation"}
          PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [route: M], dtype: int32, retention: "keep_value invocation"}
          TileExpert: {meaning: Expert for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
          TileRow: {meaning: Expert-local row origin for each row block, shape: [row_tile: J], dtype: int32, retention: "keep_value invocation"}
      - step: gather
        name: Replicate packed input into compact route order
        math: |
          For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
          GatherS[rho(t,k),:] = hidden_states_scale[t,:].
          Each token with at least one valid route supplies one logical input
          payload/scale copy, replicated to its valid routes. Let U be the count
          of such tokens. Unused rows of the R-row backing buffers retain old bytes.
          Nchunk = 9*H/256. For f = t*Nchunk+c, SourceChunk[f,:] denotes the
          c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
          of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
          chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
          These chunk names are views of the same copies, with no additional storage.
          Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
          definitions; these decoded operands are mathematical views, not saved arrays.
        symbol:
          GatherQ: {meaning: Gathered packed input payload, shape: [route: M, packed_hidden: "H/2"], dtype: uint8, retention: "keep_value invocation"}
          GatherS: {meaning: Gathered input block scales, shape: [route: M, hidden_block: "H/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
          SourceChunk: {meaning: Byte view used by the flat gather, shape: [chunk: "T*Nchunk", byte: 16], dtype: uint8}
          GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [chunk: "T*Nchunk", slot: K, byte: 16], dtype: uint8}
      - step: fc1_quantize
        name: Joint up and gate contraction with fused approximate activation
        math: |
          BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
          form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
          W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
          C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
          B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
          B1 is the concatenation of those up and gate groups; X1's valid row r
          is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
          contracted: their payload comes from consecutive backing-buffer rows
          base(j)+r, while their scale row is redirected to base(j).
          Payload outside the R-row domain is zero-filled; unused in-bounds
          backing bytes remain unspecified, not zeroed.
          For each row and intermediate channel, take u,v from the final C1
          up/gate columns and apply Contract's asymmetric clamp when enabled.
          Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
          ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
          Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
          For activation_type = 3, z = gemm1_alpha[e]*L and
          a = (v*S(v,z))*(u+gemm1_beta[e]).
          For type 10, zg = ia*(2*L), zu = ib*(2*L),
          g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
          w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
          The unused beta reciprocal for type 3 does not enter a.
          For each 16-channel block, peak = max(abs(a)),
          s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
          zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
          Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
          channel into the low nibble. Save those bytes as ActQ and s as ActS,
          only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
          multiplication and code conversion; they decode to zero scale.
          Padding rows also execute activation and quantization but are discarded.
          C1 and activated FP32 values are consumed locally, not globally materialized.
        symbol:
          BN1: {meaning: FC1 intermediate columns per worktile, binding: "bind:design.work_schedule::BN1"}
          BK: {meaning: Reduction channels per staging iteration, binding: "bind:design.work_schedule::BK"}
          C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [row: BM, column: "2*BN1"], dtype: fp32, retention: "carry_forward (j,n); l=-1..H/64-1"}
          ActQ: {meaning: Packed quantized intermediate payload, shape: [route: M, packed_intermediate: "I/2"], dtype: uint8, retention: "keep_value invocation"}
          ActS: {meaning: Intermediate quantization scales, shape: [route: M, intermediate_block: "I/Block"], dtype: fp8_e4m3fn, retention: "keep_value invocation"}
        arithmetic:
          approx: >-
            exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32.
            Folded sigmoid arguments, the sigmoid-based tanh identity and
            reciprocal-multiply quantization replace the reference evaluation.
            unknown: no verified uniform error bound for the full declared domain
            is supplied; source comments and local probes are not an output guarantee.
          accumulate: >-
            Each 64-channel contraction uses native E2M1 inputs and E4M3 block
            scales with FP32 accumulation; four such updates make one BK stage.
            The notation does not assert FP32 products or reference-order bit equality.
      - step: fc2
        name: Packed intermediate contraction and route materialization
        math: |
          For each row tile j and BN2-column group n in [0,H/BN2),
          X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
          B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
          C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
          B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
          Padded rows use the same payload/scale-row rule as fc1_quantize,
          now with the ActQ/ActS backing buffers, and are discarded after contraction.
          Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
          for r < valid(j). Unused route-result rows retain old contents.
        symbol:
          BN2: {meaning: FC2 output columns per worktile, binding: "bind:design.work_schedule::BN2"}
          C2: {meaning: Accumulator of one FC2 worktile, shape: [row: BM, column: BN2], dtype: fp32, retention: "carry_forward (j,n); l=-1..I/64-1"}
          RouteResult: {meaning: BF16 result for each valid compact route, shape: [route: M, hidden: H], dtype: bf16, retention: "keep_value invocation"}
        arithmetic:
          accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output columns change.
      - step: finalize
        name: Fixed route-order fused accumulation into caller output
        math: |
          For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
          Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
          otherwise Z(k) = Z(k-1), without reading RouteResult.
          Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
          existing one-element list alias as required by Contract.
        symbol:
          Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: "carry_forward (t,h); k=-1..K-1"}
    ledger:
      baseline: >-
        Contract evaluation for the M valid routes, saving decoded FP32 activations,
        both FC1 outputs and Act before QDQ; save the same BF16 route results.
      matmul:
        - {item: Expert contractions, change: "3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows", by: [fc1_quantize, fc2]}
      vector:
        - {item: Format decoding, change: "Add 2*CodeCount nibble decodes and CodeCount scale decodes with BF16 conversions per table initialization", by: [format_tables]}
        - {item: Activation and quantization, change: "M*I -> PaddedRows*I channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E)) integer routing work per invocation", by: [routing, fc1_quantize]}
      footprint:
        - {item: Format tables, change: "0 -> 12*CodeCount bytes retained per device module; a repeated initialization overwrites the same tables", by: [format_tables]}
        - {item: Intermediate materialization, change: "12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes remain 2*M*H", by: [gather, fc1_quantize, fc2]}
      traffic:
        - {item: Format table writes, change: "Add 12*CodeCount logical bytes written per table initialization", by: [format_tables]}
        - {item: Gather, change: "Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads", by: [gather]}
      error:
        - {item: Numerical evaluation, change: "Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established", by: [fc1_quantize, finalize]}
  work_schedule:
    thesis: >-
      Submit one format-table kernel and finish its device synchronization
      before the five-kernel MoE pipeline, executed eagerly or by graph replay.
      The tables are global module state with no consumer in this pipeline.
      One CTA prepares all routing metadata using shared group
      histograms and prefixes, replacing separate count, scan and scatter grids
      and their device memset. Flat gather exposes broad parallelism;
      statically strided persistent GEMM workers amortize setup and retain rings across
      expert tiles. PDL grants early launch, while consumers still wait for predecessor
      completion before reading its results.
      Global workspace persists across requests and graph replays; its R-row packed
      operand and route-result views retain unwritten bytes. Same-stream ordering
      orders their reuse. After the initialization prefix this path adds no
      cross-stream workspace exclusion or host wait for final output completion.
    flow:
      launch:
        - {phase: [init_tables]}
        - {phase: [prepare], protocol: pdl, start_after: init_tables.kernel_done}
        - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
        - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
        - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
        - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      init_tables:
        describe: Generate all three numeric-format tables independently of invocation tensors.
        decomposition:
          partition: {}
          target:
            single_tile:
              FormatFP4: {shape: [code: CodeCount, component: 2], dtype: bf16}
              FormatScale: {shape: [code: CodeCount], dtype: fp32}
              FormatScalePair: {shape: [code: CodeCount, component: 2], dtype: bf16}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: >-
            BM=128, RouteGroups=32 and
            RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32).
            Groups cover contiguous, clipped ranges of flattened route slots;
            these are local subdivisions of one worktile, not independent work.
            Stage all IDs once, form group histograms and their exclusive expert
            bases, scan expert counts and tile counts, then assign local atomic
            ranks and enumerate J tiles by binary search of TilePrefix.
            This worktile writes all Counts, both E+1 prefixes and every RoutePos;
            packed maps and tile maps write only their used prefixes. No separate
            count initialization or global reservation-counter update is needed.
          partition: {}
          worktile:
            invariant:
              route_ids: {shape: [token: T, slot: K], dtype: int32}
          target:
            single_tile:
              Counts: {shape: [expert: E], dtype: int32}
              Offs: {shape: [prefix: "E+1"], dtype: int32}
              TilePrefix: {shape: [prefix: "E+1"], dtype: int32}
              RoutePos: {shape: [token: T, slot: K], dtype: int32}
              PackedToken: {shape: [route: M], dtype: int32}
              PackedSlot: {shape: [route: M], dtype: int32}
              PackedExpert: {shape: [route: M], dtype: int32}
              TileExpert: {shape: [row_tile: J], dtype: int32}
              TileRow: {shape: [row_tile: J], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule:
          worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: >-
            Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk) coordinates,
            with chunk fastest; a tile can cross token boundaries. All work is empty
            when M=0. Otherwise chunks whose token has no routes are visited without
            payload reads or writes; the final packet is clipped.
          partition: {chunk: {size: "T*Nchunk*min(1,M)", tile: 128}}
          worktile:
            invariant:
              SourceChunk: {shape: [chunk: 128, byte: 16], dtype: uint8}
              RoutePos: {shape: [chunk: 128, slot: K], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
          target:
            single_tile: {GatherChunk: {shape: [chunk: 128, slot: K, byte: 16], dtype: uint8}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "min(1184,ceil_div(T*Nchunk,128))"}
        schedule:
          worktile_order: [{by: chunk, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: >-
            BN1=64, BK=256; each row tile and intermediate column group is one
            worktile, with H/BK local iterations and four 64-channel updates per
            iteration. Valid rows are base(j)..base(j)+valid(j); padded arithmetic
            follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is
            read only when gemm1_clamp_limit is not None.
            TileCap=ceil_div(R,BM)+min(E,R) is the ABI's row-tile upper bound.
            Let Cap be the cached automatic grid cap: twice the queried SM count,
            or zero if that query failed. For Nx column groups define
            G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            The submitted grid uses G(I/BN1), independent of the current J.
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
              gemm1_alpha: {shape: [expert: 1], dtype: fp32}
              gemm1_beta: {shape: [expert: 1], dtype: fp32}
              gemm1_clamp_limit: {shape: [expert: 1], dtype: fp32}
            iteration:
              GatherQ: {shape: [row: BM, packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              GatherS: {shape: [row: BM, hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [column: "2*BN1", packed_hidden: "BK/2"], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [column: "2*BN1", hidden_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [row: BM, packed_intermediate: "BN1/2"], dtype: uint8}
              ActS: {shape: [row: BM, intermediate_block: "BN1/Block"], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(I/BN1)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: >-
            BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses
            I/BK local stages. Only valid(j) output rows are stored. All submitted
            workers remain present when J=0, but their assigned sequences are empty.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [expert: 1], dtype: int32}
              Offs: {shape: [prefix: 1], dtype: int32}
              TilePrefix: {shape: [prefix: 1], dtype: int32}
              TileExpert: {shape: [row_tile: 1], dtype: int32}
              TileRow: {shape: [row_tile: 1], dtype: int32}
            iteration:
              ActQ: {shape: [row: BM, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              ActS: {shape: [row: BM, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [column: BN2, packed_intermediate: "BK/2"], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [column: BN2, intermediate_block: "BK/Block"], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {RouteResult: {shape: [row: BM, hidden: BN2], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "G(H/BN2)"}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: >-
            FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range.
            One worker produces up to 128*FinalWidth consecutive hidden elements of one token.
            Route slots are a local reduction, not independently assigned work;
            masked routes do not read the route-result slab.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: "128*FinalWidth"}}
          worktile:
            invariant:
              RoutePos: {shape: [slot: K], dtype: int32}
              route_weights: {shape: [slot: K], dtype: fp32}
            iteration:
              RouteResult: {shape: [slot: 1, hidden: "128*FinalWidth"], dtype: bf16, direction: ascending}
          target: {single_tile: {Y: {shape: [hidden: "128*FinalWidth"], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: "T*ceil_div(H,128*FinalWidth)"}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: >-
      Eight warps independently generate the complete format tables
      and write global module storage, with no local inter-warp data exchange.
      One cooperative CTA prepares routing; FC1 retains separate operand producers, MMA issue and four epilogue
      warps with early accumulator release. Four cooperating FC2 warps stream their one-stage worktiles
      through three payload slots and two scale slots. Payload, scale and metadata lookahead cross work
      boundaries, while the previous product and direct BF16 store submission precede accumulator and metadata
      reuse. This spends prefetch registers to avoid per-worktile re-priming.
    phase:
      init_tables:
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                produce: >-
                  FormatTables denotes FormatFP4, FormatScale and FormatScalePair
                  together. Each participating thread computes one code's entries by format_tables
                  and writes all three global tables. The BF16 pairs occupy two
                  lanes of a 32-bit stored word. No input tensor is read, no local
                  value survives its stores, and no inter-thread exchange or PDL
                  trigger is used. Kernel completion makes every table entry visible.
            pipe: {steady: ['produce:FormatTables']}
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1,
            view: {route_ids: {}}}
          GroupTable:
            space: SMEM
            member_slot_shape: [{group: RouteGroups}, {expert: 256}]
            dtype: int32
            slot_count: 1
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g,
                    g+1], expert: [0, E]}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: >-
                  All participating threads wait for predecessor grid completion and visibility; warp 0
                  then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: >-
                  Stage every route ID once into StagedIds and zero the full GroupTable, including the unused
                  expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route group.
                  Rendezvous before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive
                  reservation bases of routing, and writes Counts. Another rendezvous precedes the paired
                  expert scans; ScanScratch holds two 64-word scan arrays and J. Publish Offs and TilePrefix
                  both globally and into their local caches, then rendezvous before scatter and tile enumeration.
                  Each warp advances its own RankCursor by atomics while writing RoutePos and all three
                  packed maps. Enumerate and store TileExpert and TileRow from the cached tile prefix. StagedIds
                  and the prefix caches survive through their last reads; GroupTable is overwritten only
                  after histogram production is complete. M=0 still writes zero Counts/prefixes and RoutePos=-1,
                  with no packed or tile stores.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:RoutePos']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: >-
                  All participating threads wait for predecessor grid completion and visibility; warp 0
                  then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: >-
                  Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries,
                  and loads a 16-byte source only if some route is valid. Replicate to those destinations;
                  the same registers hold this chunk through all route stores. No inter-thread exchange.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:GatherChunk(t)']}
      fc1:
        domain: {t: worktile, i: [0, H/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape: [{row: BM}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view: {PayloadA(g): {slot_index: g%3}}
          PayloadB:
            space: SMEM
            member_slot_shape: [{row: 128}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view: {PayloadB(g): {slot_index: g%3}}
          AScale:
            space: SMEM
            member_slot_shape: [{row: BM}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {AScale(g): {slot_index: g%2}}
          BScale:
            space: SMEM
            member_slot_shape: [{row: 128}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {BScale(g): {slot_index: g%2}}
          APrefetch:
            space: register
            member_slot_shape: [{row: BM}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {'APrefetch(t,i)': {slot_index: i%2}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]},
                dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: >-
                  Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                  work domains are empty. Otherwise warp 0 initializes the shared completion protocol and
                  allocates TensorStorage; all seven warps rendezvous once before entering their independent
                  work loops. A worker with no assigned item still participates.
                prime: >-
                  Resolve this worktile's expert and row base. Load the first GatherS stage and, when
                  the local stage count exceeds one,
                  the second into APrefetch. All BM rows are loaded, redirecting padding scales to the first
                  valid row. Prefetch registers are restarted per worktile.
                publish: >-
                  Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the
                  warp rendezvous and full-stage arrival. Thus stage 1 is loaded again after being primed;
                  the first primed copy is overwritten without use. Done includes this arrival, not completion
                  of the independent payload/weight-scale loads.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                  drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['prime:APrefetch(t)', {repeat: 'g[t]', steady: ['publish:AScale(g)']}]
              epilogue: ['retire:TensorStorage']
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: >-
                    Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol
                    and allocates TensorStorage; all seven warps rendezvous once before entering their independent
                    work loops. A worker with no assigned item still participates.
                load: >-
                  Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm
                  the full-stage transaction count for 32768 payload bytes. Done covers both payload transfers.
                  Payloads use three slots independently of the two scale slots.
                stage: >-
                  Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the
                  prepared ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage
                  2048 bytes. Done is their completion arrival to the full-stage protocol. Also issue an
                  L2-only weight-scale hint two stages ahead when that stage lies in the same worktile;
                  the hint has no consumer or completion edge.
                retire:
                  execution_mode: serial
                  meaning: >-
                    After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                    drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'],
              epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: >-
                    Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol
                    and allocates TensorStorage; all seven warps rendezvous once before entering their independent
                    work loops. A worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: >-
                    Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors;
                    q identifies the optional wait before the first scale copy of a worktile.
                prepare: >-
                  The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of
                  all scale copies; only then does this issuer advance to the MMA action. Done is covered
                  by the following cumulative MMA completion.
                mma: >-
                  Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates
                  to C1. The first update initializes C1 without reading its old value. The fused 128-column
                  product covers both up and gate. Issue a cumulative completion commit after each stage;
                  done covers scale copies, payload reads and accumulator updates. The last stage also commits
                  result readiness for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed
                  ScaleTM before a later scale copy overwrites that scale slot, and makes each scale copy
                  visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: >-
                    After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                    drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - {repeat: {q: [0, 'min(1,t)*(1-Hoist)']}, steady: ['wait:Drain(t,q)']}
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)',
                  'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]): ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id001
                enter: >-
                  Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                  work domains are empty. Otherwise warp 0 initializes the shared completion protocol and
                  allocates TensorStorage; all seven warps rendezvous once before entering their independent
                  work loops. A worker with no assigned item still participates.
                drain: >-
                  Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane.
                  For c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of
                  Fragment, issue both reads before waiting, and wait for all their TMEM reads to retire.
                  Done makes this register fragment usable.
                emit: >-
                  Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize
                  ScalePack and retain its first two scale bytes; c=1 adds the last two, stores the full
                  four-byte scale word on valid rows and resets it. Store valid payload bytes for each c.
                  Done means local computation and store submission consumed Fragment; global stores can
                  still be in flight. Invalid rows submit no output stores.
                release: >-
                  This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases
                  only this warp's accumulator quadrant; MMA reuse waits for all four epilogue roles. This
                  warp immediately continues its final conversion/store tail without waiting for the other
                  epilogue warps or for global output-store completion.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                  drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe: &id002
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)',
                'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for: &id003 {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id001
            pipe: *id002
            waits_for: *id003
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id001
            pipe: *id002
            waits_for: *id003
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id001
            pipe: *id002
            waits_for: *id003
      fc2:
        domain: {t: worktile}
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape: [{row: BM}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view: {PayloadA(t): {slot_index: t%3}}
          PayloadB:
            space: SMEM
            member_slot_shape: [{row: BN2}, {byte: BK/2}]
            dtype: uint8
            slot_count: 3
            view: {PayloadB(t): {slot_index: t%3}}
          AScale:
            space: SMEM
            member_slot_shape: [{row: BM}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {AScale(t): {slot_index: t%2}}
          BScale:
            space: SMEM
            member_slot_shape: [{row: BN2}, {block: BK/Block}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {BScale(t): {slot_index: t%2}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn,
            slot_count: 1}
          BPrefetch: {space: register, member_slot_shape: [{row: BN2}, {block: BK/Block}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Metadata: {space: register, member_slot_shape: [{field: 4}], dtype: int32, slot_count: 3, view: {
              Metadata(t): {slot_index: t%3}}}
          Pending: {space: register, member_slot_shape: [{field: 4}], dtype: int32, slot_count: 1, view: {
              Pending(t): {}}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view: {C2: {part: {column: [0, 128]}}, ScaleTM(t): {part: {column: [128+32*(t%2), 160+32*(t%2)]},
                dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: >-
                  Execute the PDL entry protocol before reading J. A worker whose assigned sequence is empty
                  returns without local allocation, even when J>0. Otherwise warp 0 allocates TensorStorage,
                  initializes completion state and joins all four warps at a CTA rendezvous. Ring positions
                  and completion parity start once per worker. Because I=BK here, each t is both one worktile
                  and one reduction stage.
                resolve: >-
                  Resolve successive assigned worktiles using a stepped row-tile/column cursor equivalent
                  to work_schedule's strided sequence. A descriptor contains the selected expert, compact
                  row base, valid row bound and output-column origin; ordinary per-lane address encodings
                  do not change these coordinates. Initial descriptors go to Metadata's three-slot ring.
                  Later descriptors go to the single Pending register set, without overwriting the still-live
                  ring entry. Metadata remains needed through that worktile's payload issue, scale fetch
                  and output store submission.
                commit: >-
                  Move the previously resolved Pending descriptor into Metadata. This occurs after the prior
                  worktile's epilogue has finished reading the aliased ring entry, before new lookahead
                  loads use this descriptor.
                fetch: >-
                  Load ActS and the prepared weight-scale image for this worktile into the single APrefetch
                  and BPrefetch register sets. All BM activation rows are read, redirecting padded rows
                  to base(j); each operand contributes 2048 bytes. Registers are overwritten only after
                  their previous values were scattered by publish. This synchronous fetch can overlap the
                  previously issued MMA and payload transfers.
                publish: >-
                  ScaleSM(t) scatters APrefetch and BPrefetch into AScale(t) and BScale(t) with their required
                  scale permutations, then establishes shared-to-async visibility. The register sets are
                  now reusable.
                load:
                  execution_mode: async
                  meaning: >-
                    PayloadPair(t) issues two tensor transfers into PayloadA(t) and PayloadB(t), using Metadata(t)
                    to select ActQ and the prepared FC2 weight box. Arm a transaction for 32768 bytes. Done
                    covers both transfers. Two initial worktiles prime the ring; subsequent loads look two
                    worktiles ahead, while the previous MMA has already retired.
                wait: >-
                  Previous(t,q) waits for the preceding worktile's cumulative MMA completion and rendezvous
                  all four warps; q marks its noninitial occurrence. Ready(t) waits for this worktile's
                  payload transaction, rendezvous the CTA and establishes visibility for its shared scales.
                  Final(t) waits for the last product, applies the tensor synchronization fence and rendezvous
                  the CTA. None of these waits drains future lookahead transfers.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: >-
                    Warp 0's elected issuer copies AScale(t) and BScale(t) to ScaleTM(t), four scale-copy
                    operations per operand, then issues four ordered 64-channel block-scaled updates to
                    C2. The first update initializes C2 without reading its old value. Same-issuer ordering
                    makes the scale copies visible to the consuming MMA. A cumulative completion commit
                    covers scale copies, payload reads and accumulator updates.
                emit: >-
                  Each warp drains its hardware TMEM quadrant into Fragment in BN2/32 successive 32-column
                  chunks. Wait for every TMEM read, convert valid rows to BF16 and submit direct global
                  vector stores to RouteResult; padding rows are read but not stored. Reuse each register
                  fragment after its stores have consumed it. A final CTA rendezvous completes all TMEM
                  reads and store submissions before C2 or the old descriptor is reused. Global output stores
                  may remain in flight.
                retire: >-
                  Deallocate TensorStorage only after the last epilogue and all assigned work. Empty workers
                  have no allocation to retire, so this action is a no-op for them. All issued lookahead
                  transfers belong to existing worktiles and have been consumed; no speculative tail is
                  left to drain. Kernel completion supplies global RouteResult visibility.
            pipe:
              repeat: t
              prologue:
              - enter:Protocol
              - {repeat: {a: [0, 'min(3,count(t))']}, steady: ['resolve:Metadata(a)']}
              - {repeat: {a: [0, 'min(1,count(t))']}, steady: ['fetch:ScalePrefetch(a)', 'publish:ScaleSM(a)']}
              - {repeat: {a: [0, 'min(2,count(t))']}, steady: ['load:PayloadPair(a)']}
              - {repeat: {a: [1, 'max(1,min(2,count(t)))']}, steady: ['fetch:ScalePrefetch(a)']}
              steady:
              - {repeat: {q: [0, 'min(1,t)']}, steady: ['wait:Previous(t,q)', 'emit:RouteResult(t-1)']}
              - {repeat: {u: ['min(max(3,t+2),count(t))', 'min(max(3,t+3),count(t))']}, steady: ['commit:Metadata(u)']}
              - {repeat: {u: ['min(t+1,count(t))', 'min(t+2,count(t))']}, steady: ['publish:ScaleSM(u)']}
              - {repeat: {u: ['min(t+2,count(t))', 'min(t+3,count(t))']}, steady: ['load:PayloadPair(u)']}
              - wait:Ready(t)
              - mma:PayloadA(t)@PayloadB(t)
              - {repeat: {u: ['min(t+2,count(t))', 'min(t+3,count(t))']}, steady: ['fetch:ScalePrefetch(u)']}
              - {repeat: {u: ['min(t+3,count(t))', 'min(t+4,count(t))']}, steady: ['resolve:Pending(u)']}
              epilogue: [{repeat: {a: ['max(0,count(t)-1)', count(t)]}, steady: ['wait:Final(a)', 'emit:RouteResult(a)']},
                'retire:TensorStorage']
            waits_for:
              data:
                wait:Previous(t,q)@done: ['Main/mma:PayloadA(t-1)@PayloadB(t-1)']
                wait:Ready(t)@done: ['Main/load:PayloadPair(t)']
                wait:Final(a)@done: ['Main/mma:PayloadA(a)@PayloadB(a)']
      finalize:
        resource: {Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32,
            slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: >-
                  All participating threads wait for predecessor grid completion and visibility; warp 0
                  then grants dependent-grid launch permission. This grants no data readiness. The entry
                  executes even if this worker has no payload work.
                produce: >-
                  Each thread owns FinalWidth independent output elements. Hoist its eight route indices
                  and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing
                  slot order using finalize's FMA recurrence. Convert and store Y once; no CTA reduction
                  or inter-thread barrier is required. Empty routing still writes zeros.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:Y']}
realization:
  require:
  - item: design.work_schedule::init_tables
    choice: >-
      Submit k_init_tables on the current device stream, query its launch error,
      and call torch.cuda.synchronize(device) before adding this device to the
      Model instance's ready set. This device-wide host wait precedes automatic
      routing readback, the attempted zero probe, workspace binding and moe_run.
      It is outside the private-stream pipeline graph and is not repeated by
      replay of that graph. Keep the format tables in device-module storage.
    reason: >-
      The initialization prefix has a host completion boundary, including the
      cost of waiting for other device work, beyond flow's kernel-start ordering.
      Ready-set publication only after successful synchronization prevents a
      later cache hit from treating unfinished initialization as complete.
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: >-
      Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and the tcgen05.cp scale path, with cumulative
      tcgen05.commit completion and tcgen05.fence::after_thread_sync at the stated synchronization boundaries.
    reason: Ordered scale consumption and cumulative operand-read completion implement both phases' ring
      and accumulator reuse protocols.
  - item: ['design.tile_pipeline::fc1', 'design.tile_pipeline::fc2.Main']
    choice: >-
      Use tcgen05.ld and tcgen05.wait::ld for register materialization, respecting each issuing warp's hardware
      quadrant. Retire the reads before FC1's early release or FC2's boundary epilogue rendezvous.
    reason: Accumulator reuse requires completed TMEM reads, independently of the later global store completion.
  - item: design.tile_pipeline::fc2.Main
    choice: >-
      Bind PayloadPair to TMA boxes over ActQ and the prepared FC2 weight byte map, with transaction-byte
      completion. Stage scales through vector global-to-register loads and shared stores, using fence.proxy.async.shared::cta
      and the stated CTA rendezvous before tensor consumption.
    reason: >-
      The scale lookahead is carried in registers, so payload transactions and shared scale publication
      have distinct completion guarantees.
  - item: design.work_schedule::flow
    choice: >-
      Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents
      protocol for the five MoE pipeline kernels in eager and recorded work;
      init_tables uses its separate ordinary launch.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.work_schedule::flow
    choice: >-
      Retain the reached rebuild services before moe_run: automatic-gate
      ids.tolist() readback, and the zero probe's attempted four-byte allocation,
      reset attempt only after allocation succeeds, and cleanup on reset failure.
      A Python exception retains the services already reached. If a scan launch
      is attempted but rejected, retain the reached error query and cleanup,
      with no scan completion event. Neither
      allocation failure nor reset failure supplies a scan result or a scan
      completion wait; zero_ok remains false and both verification pointers are
      null. The reset-error exit calls cudaFree before returning -2.
    reason: >-
      These service costs and failure boundaries distinguish ABI reconstruction
      from reuse without supplying a zero verdict or changing the five MoE computing
      submissions. An error cannot be treated as a completed probe.
  - item: ['design.work_schedule::flow', 'design.math_reshape::GatherQ',
      'design.math_reshape::GatherS', 'design.math_reshape::ActQ',
      'design.math_reshape::ActS', 'design.math_reshape::RouteResult']
    choice: >-
      Bind the rebuilt ABI to its keyed workspace. A scratch miss allocates and
      zeroes the contiguous 2*E int32 counts/fill slab; a hit reuses it without
      that initialization. Other selected scratch uses uninitialized allocation.
      GatherQ and GatherS occupy consecutive R*H/2 and R*H/16 byte views;
      ActQ and ActS occupy consecutive R*I/2 and R*I/16 byte views within the
      2*R*I-byte activation allocation. RouteResult has R*H BF16 elements.
      The route maps have R entries and the tile maps have TileCap entries.
      Keep caller tensors, workspace and ABI alive for every recorded or in-flight
      use; cache publication after a successful moe_run retains their strong
      references and the existing output alias. Rebuilding does not wait for
      output completion or introduce cross-stream workspace exclusion.
    reason: >-
      The concrete ABI views must agree with both tensor maps and global handoffs.
      Preparation rewrites the consumed counts and prefixes, so allocation-time
      zeroing is a service operation, not an additional handoff initial value.
      Unwritten operand rows retain unspecified bytes as the mathematical padding
      rule requires; a fresh allocation does not imply zero-filled padding.
