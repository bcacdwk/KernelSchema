meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: double_verify_fused_small_flat
    parent: verify_fused_small_flat
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved preparation
      threshold (3000 or 6500 under default controls), and zflag/zflag_host
      are device verification state and its pinned host mirror.
      All implementation controls, including ABI and graph construction,
      follow the frozen default implementation scope.
      Let p be Params derived from a. FC2Flat means that launch_gemm<false>
      obtains a non-null map set from tma_set(p,false,128,false) and selects
      the cfg2=23 flat-stream NK1 kernel; use the selection fixed at recording.
      Let R=T*K. Select exactly when the request reuses a, a.cfg=97,
      a.cfg2=23, I=256, FC2Flat, R<=a.small_thresh, a.zflag!=0 and
      a.zflag_host!=0, and moe_run returns zero through graph_replay's
      two-graph arm: an existing or newly instantiated verify-only graph
      is submitted, followed on the same caller stream by the full graph.
      Outside outer capture, this requires that the volatile mirror read
      after at most 200000000 polling iterations is not 1 (dirty or timeout).
      Under outer capture both graph launches are recorded without polling;
      every execution of that recorded request follows this node regardless
      of either device verdict. A late clean verdict does not cancel a full
      graph already submitted.
      Every private-stream run_pipeline call in this request, if present,
      is capture-only after successful cudaStreamBeginCapture, with no
      additional uncaptured private-stream computation. This includes the
      first two-graph replay after construction and later matching replays.
      Pure capture executes no recorded kernels and creates no GPU completion
      events; subsequent execution uses the recorded choices and tensor bindings,
      with tensor contents read at execution. Reuse does not repeat route_hist,
      workspace construction, table initialization or the ABI zero probe.
design:
  math_reshape:
    thesis: Evaluate zero eligibility and zero the shared output twice before the guarded fused chain. The second
      verdict selects packed contractions, fused approximate activation and BF16 route materialization, or a zero
      result; both full checks add traffic without extra persistent storage.
    rewrite:
    - step: verify
      name: Two zero checks with distinct versions in reused storage
      math: |
        R = T*K. VerifyGroups, VerifyBatch, VerifySet and HasHost are bound by work_schedule.
        Let v=0 denote the independent probe and v=1 the full-chain verification.
        Each v evaluates the following predicates on the bound inputs read in that evaluation.
        Flatten arrays in logical row-major storage order. VerifyPayload[i] is the uint32
        view of four consecutive hidden_states bytes, with byte a weighted by 2^(8*a),
        a=0..3; VerifyScales and VerifyScores are flat views of hidden_states_scale and
        route_weights, with no additional storage.
        For each v and b in [0,VerifyGroups), PartialDirty(v,b) is int32(1) if any of:
          (VerifyPayload[i] bitand 0x77777777) != 0 for i in VerifySet(b,T*H/8);
          the E4M3 byte encoding of VerifyScales[i], bitand 0x7F, equals 0x7F
            for i in VerifySet(b,T*H/Block);
          VerifyScores[i] is not finite for i in VerifySet(b,R);
          gemm1_alpha[e] or gemm1_beta[e] is not finite for e in VerifySet(b,E);
          gemm1_clamp_limit[e] is not finite for e in VerifySet(b,E), only if not None.
        Otherwise PartialDirty(v,b)=int32(0). bitand denotes bitwise AND.
        DirtyAt(v)=max_b PartialDirty(v,b); CleanAt(v)=1-DirtyAt(v).
        For each v, every b writes bf16(0) at flattened output elements 8*i+a,
        i in VerifySet(b,T*H/8), a=0..7. ProbeOutput[i,a] names this version for
        v=0, ZeroOutput[i,a] for v=1. Both alias the same caller output;
        the second replaces the first without reading it or saving a snapshot.
        The reused four-word int32 verification state has dirty-OR and arrival
        words 1 and 2 initially zero from ABI creation or the preceding completed check.
        Each v combines PartialDirty(v,b), leaves word 3 unchanged and finishes
        with word 0=int32(CleanAt(v)), words 1 and 2=0. ProbeState is the completed
        v=0 version, ZState the v=1 version in the same allocation. The second
        check consumes the reset counters of ProbeState, overwrites word 0 and
        rederives its verdict; it does not take the first verdict as its answer.
        ProbeVerdict=int32(CleanAt(0)) and
        HostVerdict=int32(CleanAt(1)) are successive writes to the same pinned
        int32 mirror, with no retained first snapshot. No route ID, weight payload
        or weight-scale value participates in either predicate.
        Clean=CleanAt(1); only this verdict controls the following computations.
        For Clean=1, M=J=U=PaddedRows=0 are empty execution extents; routing metadata,
        gathered inputs, quantized activations and route-result backing bytes remain
        unchanged. No route scan or expert computation is evaluated in that case.
      symbol:
        VerifyGroups: {meaning: Number of verification partitions, binding: 'bind:design.work_schedule::VerifyGroups'}
        VerifyBatch: {meaning: Elements per flat verification packet, binding: 'bind:design.work_schedule::VerifyBatch'}
        VerifySet: {meaning: Flat indices owned by verification partition b, binding: 'bind:design.work_schedule::VerifySet'}
        HasHost: {meaning: Presence of the pinned verdict mirror in this node, binding: 'bind:design.work_schedule::HasHost'}
        VerifyPayload: {meaning: Word view of packed activation bytes, shape: [{word: T*H/8}], dtype: uint32}
        VerifyScales: {meaning: Flat view of activation scales, shape: [{element: T*H/Block}], dtype: fp8_e4m3fn}
        VerifyScores: {meaning: Flat view of route weights, shape: [{element: R}], dtype: fp32}
        PartialDirty: {meaning: One partition verdict in verification instance v, shape: [], dtype: int32}
        ZState: {meaning: Reused device verdict and reduction state; word 3 is untouched, shape: [{word: 4}],
          dtype: int32, retention: keep_value invocation}
        HostVerdict: {meaning: Full-chain verdict version of the pinned mirror, shape: [], dtype: int32, retention: keep_value
            invocation}
        ZeroOutput: {meaning: Second unconditional zero version of caller output, shape: [{word: T*H/8}, {element: 8}],
          dtype: bf16, retention: keep_value invocation}
        ProbeState: {meaning: Independent-probe version of the same four-word allocation as ZState, shape: [{
              word: 4}], dtype: int32, retention: keep_value invocation}
        ProbeVerdict: {meaning: Independent-probe version of the same pinned mirror as HostVerdict, shape: [],
          dtype: int32, retention: keep_value invocation}
        ProbeOutput: {meaning: 'First zero version of caller output, overwritten without a saved snapshot', shape: [
            {word: T*H/8}, {element: 8}], dtype: bf16, retention: keep_value invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        For Clean=0:
        Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}],
          dtype: int32, retention: keep_value invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        Nchunk = 9*H/256. For Clean=0:
        For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8,
          retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K},
            {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        For Clean=0:
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}],
          dtype: fp32, retention: 'carry_forward (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}],
          dtype: uint8, retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}],
          dtype: fp8_e4m3fn, retention: keep_value invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based
          tanh identity and reciprocal-multiply quantization replace the reference evaluation. unknown: no verified
          uniform error bound for the full declared domain is supplied; source comments and local probes are not
          an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation;
          four such updates make one BK stage. The notation does not assert FP32 products or reference-order bit
          equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For Clean=0:
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}
      arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize;
          only the reduction extent and output columns change.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For Clean=1, Y[t,h] = ZeroOutput[floor((t*H+h)/8),(t*H+h) mod 8]
        without any further output write or route-result read. For Clean=0:
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol: {Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}}
    ledger:
      baseline: For Clean=0, Contract evaluation for M valid routes, saving decoded FP32 activations, both FC1
        outputs and Act before QDQ, with the same BF16 route results. For Clean=1, the same direct evaluation
        for the input valid routes, without zero detection.
      matmul:
      - {item: Expert contractions, change: 'When Clean=0: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including
          discarded padded rows', by: [fc1_quantize, fc2]}
      - {item: Clean expert work, change: 'When Clean=1: 3*H*I MAC per valid input route -> 0', by: [verify]}
      vector:
      - {item: Activation and quantization, change: 'When Clean=0: M*I -> PaddedRows*I channel evaluations, plus
          O(R+RouteGroups*E+E+J*log2(E)) integer routing work per invocation', by: [routing, fc1_quantize]}
      - {item: Clean payload work, change: 'When Clean=1: I activation/quantization channels per valid route and
          K-slot reduction for each of T*H outputs -> 0; each of the two verifications still scans all 9*T*H/16
          activation bytes, R scores and E parameter tuples', by: [verify]}
      footprint:
      - {item: Intermediate materialization, change: 'When Clean=0: 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed
          intermediate bytes; add 9*M*H/16 gathered bytes; BF16 route bytes remain 2*M*H', by: [gather, fc1_quantize,
          fc2]}
      - {item: Verification state, change: 'Add 16 device bytes and 4 pinned host bytes per reused ABI, shared
          by both checks; ProbeOutput and ZeroOutput alias output, with no snapshot allocation', by: [verify]}
      traffic:
      - {item: Gather, change: 'When Clean=0: Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding
          later operand reads', by: [gather]}
      - {item: Verification and zero output, change: Every invocation adds 2*(9*T*H/16 + 4*R + 8*E plus optional
          4*E) input bytes read and 4*T*H output bytes written across the two checks; no weight bytes are scanned,
        by: [verify]}
      error:
      - item: Numerical evaluation
        change: 'When Clean=0: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I
          evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established'
        by: [fc1_quantize, finalize]
  work_schedule:
    thesis: |-
      Submit seven computational kernels: an independent probe, full-chain
      verification, single-CTA preparation, flat gather, fused FC1, flat FC2 and
      finalization. The two graphs share output, device state and pinned mirror;
      the second graph follows the first on the caller stream. PDL separates
      launch permission from data visibility within the full chain. At the host
      graph_replay call the mirror is reset to -1 before the first graph launch.
      Outside capture a bounded volatile poll decides whether to submit the second
      graph; this node contains requests that submit both. A timeout does not wait
      for first-graph completion, but same-stream device ordering still applies.
      Outer capture records both without polling; neither the reset nor the poll
      is a replayed GPU action. All five downstream grids remain submitted for
      either main verdict. Shared global storage survives both checks, the complete
      chain and outstanding accesses before reuse; no host completion wait or
      cross-stream exclusion is added.
    flow:
      launch:
      - {phase: [probe], protocol: pdl}
      - {phase: [verify], protocol: pdl, start_after: probe.kernel_done}
      - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
      - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        ProbeState: {producer: probe, consumer: [verify], storage: global, ready: probe.kernel_done}
        ZState: {producer: verify, consumer: [prepare, gather, fc1, fc2, finalize], storage: global, ready: verify.kernel_done,
          wait_at: [prepare.guard_checked, gather.guard_checked, fc1.guard_checked, fc2.guard_checked, finalize.guard_checked]}
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      probe:
        describe: Perform verification instance v=0 in the independent graph.
        decomposition:
          strategy: |
            VerifyGroups=min(T,296), VerifyBatch=256, HasHost=1.
            For partition b, VerifySet(b,N)={i in integers | 0<=i<N and
            floor(i/VerifyBatch) mod VerifyGroups=b}. Each tensor uses its own clipped,
            ascending flat packet traversal; these are independent loops, not a Cartesian
            product. Traverse output, payload words, scale bytes, scores and expert
            parameters in that order. Every partition OR-reduces its predicates;
            global dirty-OR and arrival tickets combine all partitions. The final
            arrival writes the verdict, resets both counters and publishes the host mirror.
            Counters begin at zero from ABI creation or the preceding completed
            verification, with no per-request memset. ProbeOutput, ProbeState and
            ProbeVerdict are the first versions of shared output, device state and
            pinned mirror. Their values are overwritten by verify; no snapshot is saved.
            The host may read ProbeVerdict to choose the full-graph submission, but the
            second device check consumes only the reset counter state, not this verdict.
          partition: {b: {size: VerifyGroups, tile: 1}}
          worktile:
            iteration:
              VerifyPayload: {shape: [{word: VerifyBatch}], dtype: uint32, direction: ascending}
              VerifyScales: {shape: [{element: VerifyBatch}], dtype: fp8_e4m3fn, direction: ascending}
              VerifyScores: {shape: [{element: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
          target:
            single_tile: {PartialDirty: {shape: [], dtype: int32}, ProbeOutput: {shape: [{word: 'count(VerifySet(b,T*H/8))'},
                  {element: 8}], dtype: bf16}}
            tile_reduction: {dimension: b, input: PartialDirty, output: [ProbeState, ProbeVerdict], method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyGroups}
        schedule: {worktile_order: [{by: b, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      verify:
        describe: Perform verification instance v=1 at the start of the full graph.
        decomposition:
          strategy: |
            Use VerifyGroups, VerifyBatch, VerifySet and HasHost from probe with the same
            packet traversals, partition reduction and last-arrival protocol.
            The graph boundary preserves probe.kernel_done before this verification,
            including when the host poll timed out or the request came from outer replay.
            Consume ProbeState's reset counter words; overwrite the same device state,
            pinned mirror and output with ZState, HostVerdict and ZeroOutput.
            Only this verification's Clean verdict governs the five downstream grids.
            ZeroOutput remains the result on clean and is overwritten by finalize on dirty.
          partition: {b: {size: VerifyGroups, tile: 1}}
          worktile:
            iteration:
              VerifyPayload: {shape: [{word: VerifyBatch}], dtype: uint32, direction: ascending}
              VerifyScales: {shape: [{element: VerifyBatch}], dtype: fp8_e4m3fn, direction: ascending}
              VerifyScores: {shape: [{element: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: VerifyBatch}], dtype: fp32, direction: ascending}
            invariant: {ProbeState: {shape: [{word: 4}], dtype: int32}}
          target:
            single_tile: {ZeroOutput: {shape: [{word: 'count(VerifySet(b,T*H/8))'}, {element: 8}], dtype: bf16},
              PartialDirty: {shape: [], dtype: int32}}
            tile_reduction: {dimension: b, input: PartialDirty, output: [ZState, HostVerdict], method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyGroups}
        schedule: {worktile_order: [{by: b, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: Read ZState through the entry guard before accessing routing metadata or payload. BM=128,
            RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover contiguous, clipped
            ranges of flattened route slots; these are local subdivisions of one worktile, not independent work.
            Stage all IDs once, form group histograms and their exclusive expert bases, scan expert counts and
            tile counts, then assign local atomic ranks and enumerate J tiles by binary search of TilePrefix.
            This worktile writes all Counts, both E+1 prefixes and every RoutePos; packed maps and tile maps write
            only their used prefixes. No separate count initialization or global reservation-counter update is
            needed. For Clean=1 this submitted worktile performs no preparation or scratch writes; its guarded
            result action is a no-op.
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}}}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: Read ZState through the entry guard before accessing routing metadata or payload. Only for
            Clean=0, read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened (token,16-byte-chunk)
            coordinates, with chunk fastest; a tile can cross token boundaries. All work is empty when M=0. Otherwise
            chunks whose token has no routes are visited without payload reads or writes; the final packet is
            clipped. Clean=1 uses the empty M extent without reading Offs.
          partition: {chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}}
          worktile: {invariant: {SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}, RoutePos: {shape: [
                  {chunk: 128}, {slot: K}], dtype: int32}, Offs: {shape: [{prefix: 1}], dtype: int32}}}
          target: {single_tile: {GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'min(1184,ceil_div(T*Nchunk,128))'}
        schedule: {worktile_order: [{by: chunk, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'Read ZState through the entry guard before accessing routing metadata or payload. BN1=64,
            BK=256; each row tile and intermediate column group is one worktile, with H/BK local iterations and
            four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j); padded arithmetic
            follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is read only
            when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI''s row-tile upper bound.
            Let Cap be the cached automatic grid cap: twice the queried SM count, or zero if that query failed.
            For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            The submitted grid uses G(I/BN1), independent of the current J. Clean=1 uses J=0 without reading the
            saved tile prefix; grid dimensions and all kernel completion events remain unchanged.'
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}, ActS: {
                shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(I/BN1)}
        schedule: {worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}],
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: Read ZState through the entry guard before accessing routing metadata or payload. BN2=128;
            reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only valid(j) output
            rows are stored. All submitted workers remain present when J=0, but their assigned sequences are empty.
            Clean=1 uses J=0 without reading the saved tile prefix; grid dimensions and all kernel completion
            events remain unchanged.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn,
                direction: ascending}
          target: {single_tile: {RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule: {worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}],
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: Read ZState through the entry guard before accessing routing metadata or payload. FinalWidth=16
            if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker produces up to 128*FinalWidth
            consecutive hidden elements of one token. Route slots are a local reduction, not independently assigned
            work; masked routes do not read the route-result slab. Clean=1 retains the submitted worktiles but
            does not read route maps, scores or RouteResult, initialize accumulators, or write output; its guarded
            result action is a no-op.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*FinalWidth}}
          worktile: {invariant: {RoutePos: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}],
                dtype: fp32}}, iteration: {RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16,
                direction: ascending}}}
          target: {single_tile: {Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule: {worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}}
  tile_pipeline:
    thesis: |-
      Two cooperative verification grids publish successive verdicts using
      the same global state and output, with full first-graph completion before
      reuse. Each grid has its own workers and DirtyBits registers. Main-verdict
      guards retain every downstream kernel and completion event. Dirty inputs
      use the seven-warp FC1 pipeline and four-warp FC2 flat stream, preserving
      three payload slots, two scale slots and their existing reuse boundaries.
    phase:
      probe:
        resource: {DirtyBits: {space: register, member_slot_shape: [{element: VerifyBatch}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for predecessor grid completion and visibility, then let warp 0 grant dependent-grid
                  launch permission. This permission does not publish the verdict or zero output.
                store: Submit vector zero stores for this partition of ProbeOutput. Done means its stores have
                  been submitted; probe.kernel_done provides global output visibility.
                compute: Initialize the per-thread DirtyBits to zero and OR predicates across each independent
                  flat traversal in the scheduled order. CTA-wide OR and rendezvous produce PartialDirty(0,b);
                  all threads participate even when their individual ranges are empty.
                fold: One thread per CTA atomically ORs a nonzero PartialDirty into ProbeState word 1, then establishes
                  device visibility before incrementing arrival word 2. A zero partition still fences and increments
                  the ticket. Only the final arrival reads the accumulated dirty bit, writes word 0 and resets
                  words 1 and 2. It performs a system-scope fence before the volatile ProbeVerdict store. Earlier
                  arrivals do not wait for the last; this action completes their own contribution, and probe.kernel_done
                  closes the entire reduction and output writes. Word 3 is untouched.
            pipe: {prologue: ['enter:Protocol'], steady: ['store:ProbeOutput', 'compute:PartialDirty', 'fold:ProbeState']}
      verify:
        resource: {DirtyBits: {space: register, member_slot_shape: [{element: VerifyBatch}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for the preceding probe grid's full completion and visibility before
                  any output or state access, then let warp 0 grant dependent-grid launch
                  permission. This permission does not publish the main verdict or zero output.
                store: Submit vector zero stores for this partition of ZeroOutput. Done means its stores have
                  been submitted; verify.kernel_done provides global output visibility.
                compute: Initialize the per-thread DirtyBits to zero and OR predicates across each independent
                  flat traversal in the scheduled order. CTA-wide OR and rendezvous produce PartialDirty(1,b);
                  all threads participate even when their individual ranges are empty.
                fold: |-
                  One thread per CTA atomically ORs a nonzero PartialDirty into ZState word 1,
                  then establishes device visibility before incrementing arrival word 2.
                  These are the same counters reset in ProbeState; no separate initialization
                  or allocation occurs between the two checks. A zero partition still fences
                  and increments the ticket. Only the final arrival reads the accumulated
                  dirty bit, writes word 0, resets words 1 and 2, and performs a system-scope
                  fence before the volatile HostVerdict store. Earlier arrivals complete their
                  own contribution without waiting for the last. verify.kernel_done closes
                  the entire reduction and output writes; word 3 is untouched.
            pipe: {prologue: ['enter:Protocol'], steady: ['store:ZeroOutput', 'compute:PartialDirty', 'fold:ZState']}
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1, view: {
              route_ids: {}}}
          GroupTable: {space: SMEM, member_slot_shape: [{group: RouteGroups}, {expert: 256}], dtype: int32, slot_count: 1,
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g, g+1],
                  expert: [0, E]}}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: {execution_mode: serial, meaning: All participating threads wait for predecessor grid completion
                    and visibility; warp 0 then grants dependent-grid launch permission before the guard. This
                    permission does not establish data readiness.}
                produce: 'For Clean=1 this action is a no-op with no metadata, operand or output access. For Clean=0:
                  Stage every route ID once into StagedIds and zero the full GroupTable, including the unused
                  expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous
                  before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive reservation
                  bases of routing, and writes Counts. Another rendezvous precedes the paired expert scans; ScanScratch
                  holds two 64-word scan arrays and J. Publish Offs and TilePrefix both globally and into their
                  local caches, then rendezvous before scatter and tile enumeration. Each warp advances its own
                  RankCursor by atomics while writing RoutePos and all three packed maps. Enumerate and store
                  TileExpert and TileRow from the cached tile prefix. StagedIds and the prefix caches survive
                  through their last reads; GroupTable is overwritten only after histogram production is complete.
                  M=0 still writes zero Counts/prefixes and RoutePos=-1, with no packed or tile stores.'
                guard:
                  execution_mode: serial
                  meaning: Wait for predecessor grid completion and visibility, then read ZState[0]. Done establishes
                    the current Clean verdict for this worker. Clean=1 performs no downstream metadata or payload
                    accesses; explicitly listed no-op actions still have issue/done events.
            pipe: {prologue: ['enter:Protocol', 'guard:ZState'], steady: ['produce:RoutePos']}
        milestone: {guard_checked: ['Main/guard:ZState@done']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: {execution_mode: serial, meaning: All participating threads wait for predecessor grid completion
                    and visibility; warp 0 then grants dependent-grid launch permission before the guard. This
                    permission does not establish data readiness.}
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries,
                  and loads a 16-byte source only if some route is valid. Replicate to those destinations; the
                  same registers hold this chunk through all route stores. No inter-thread exchange.
                guard:
                  execution_mode: serial
                  meaning: Wait for predecessor grid completion and visibility, then read ZState[0]. Done establishes
                    the current Clean verdict for this worker. Clean=1 performs no downstream metadata or payload
                    accesses; explicitly listed no-op actions still have issue/done events.
            pipe: {repeat: t, prologue: ['enter:Protocol', 'guard:ZState'], steady: ['produce:GatherChunk(t)']}
        milestone: {guard_checked: ['Main/guard:ZState@done']}
      fc1:
        domain: {t: worktile, i: [0, H/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3,
            view: {PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1,
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]},
                dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter:
                  execution_mode: serial
                  meaning: 'For Clean=1 this is a no-op: no explicit PDL trigger, metadata read or local allocation;
                    launch_ready is supplied by kernel completion. Otherwise wait for predecessor completion,
                    let warp 0 grant early launch permission, then read J. J=0 has no allocation and empty work
                    domains. For J>0 warp 0 initializes the shared completion protocol and allocates TensorStorage;
                    all seven warps rendezvous before independent work loops, including workers with no assigned
                    item.'
                prime: Resolve this worktile's expert and row base. Load the first GatherS stage and, when the
                  local stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting
                  padding scales to the first valid row. Prefetch registers are restarted per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp
                  rendezvous and full-stage arrival. Thus stage 1 is loaded again after being primed; the first
                  primed copy is overwritten without use. Done includes this arrival, not completion of the independent
                  payload/weight-scale loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: Wait for predecessor grid completion and visibility, then read ZState[0]. Done establishes
                    the current Clean verdict for this worker. Clean=1 performs no downstream metadata or payload
                    accesses; explicitly listed no-op actions still have issue/done events.
            pipe: {repeat: t, prologue: ['guard:ZState', 'enter:Protocol'], steady: ['prime:APrefetch(t)', {repeat: 'g[t]',
                  steady: ['publish:AScale(g)']}], epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: 'For Clean=1 this is a no-op: no explicit PDL trigger, metadata read or local allocation;
                    launch_ready is supplied by kernel completion. Otherwise wait for predecessor completion,
                    let warp 0 grant early launch permission, then read J. J=0 has no allocation and empty work
                    domains. For J>0 warp 0 initializes the shared completion protocol and allocates TensorStorage;
                    all seven warps rendezvous before independent work loops, including workers with no assigned
                    item.'
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm
                  the full-stage transaction count for 32768 payload bytes. Done covers both payload transfers.
                  Payloads use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes.
                  Done is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale
                  hint two stages ahead when that stage lies in the same worktile; the hint has no consumer or
                  completion edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0
                    deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                    drain or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: Wait for predecessor grid completion and visibility, then read ZState[0]. Done establishes
                    the current Clean verdict for this worker. Clean=1 performs no downstream metadata or payload
                    accesses; explicitly listed no-op actions still have issue/done events.
            pipe: {repeat: g, prologue: ['guard:ZState', 'enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'],
              epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: 'For Clean=1 this is a no-op: no explicit PDL trigger, metadata read or local allocation;
                    launch_ready is supplied by kernel completion. Otherwise wait for predecessor completion,
                    let warp 0 grant early launch permission, then read J. J=0 has no allocation and empty work
                    domains. For J>0 warp 0 initializes the shared completion protocol and allocates TensorStorage;
                    all seven warps rendezvous before independent work loops, including workers with no assigned
                    item.'
                wait: {execution_mode: serial, meaning: 'Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes
                    after its explicit predecessors; q identifies the optional wait before the first scale copy
                    of a worktile.'}
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of all scale
                  copies; only then does this issuer advance to the MMA action. Done is covered by the following
                  cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to
                  C1. The first update initializes C1 without reading its old value. The fused 128-column product
                  covers both up and gate. Issue a cumulative completion commit after each stage; done covers
                  scale copies, payload reads and accumulator updates. The last stage also commits result readiness
                  for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a
                  later scale copy overwrites that scale slot, and makes each scale copy visible before the MMA
                  that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0
                    deallocates TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile
                    drain or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: Wait for predecessor grid completion and visibility, then read ZState[0]. Done establishes
                    the current Clean verdict for this worker. Clean=1 performs no downstream metadata or payload
                    accesses; explicitly listed no-op actions still have issue/done events.
            pipe: {repeat: t, prologue: ['guard:ZState', 'enter:Protocol'], steady: [{repeat: {q: [0, 'min(1,t)*(1-Hoist)']},
                  steady: ['wait:Drain(t,q)']}, {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}],
              epilogue: ['retire:TensorStorage']}
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
