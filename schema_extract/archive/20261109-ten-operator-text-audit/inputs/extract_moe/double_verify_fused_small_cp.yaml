meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: double_verify_fused_small_cp
    parent: verify_fused_small_cp
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg and
      cfg2 select FC1 and FC2, small_thresh is the saved routing preparation
      threshold (3000 or 6500 under the default controls), and zflag/zflag_host
      are device verification state and its pinned host mirror. All controls
      used to build a and any reused graph follow the frozen default scope.
      Let p be Params derived from a. FC2CP means that launch_gemm<false>
      selects k_gemm_f4<128,false,3> with effective fc=8 after refusal of
      tma_set(p,false,128,0). For cfg2=23, refusal first sets cfg=12 and the
      same map-cache key remains refused; cfg2=44 reaches this fallback directly.
      For recorded work use the selection and bindings fixed at recording.
      Let R=T*K. Select exactly when the request reuses a, a.cfg=97,
      a.cfg2 is in {23,44}, FC2CP, a.zflag and a.zflag_host are nonzero,
      R<=a.small_thresh, and moe_run returns zero through graph_replay with
      both exec_clean and exec successfully submitted on the caller stream.
      The clean graph exists. Outside capture the host first writes -1 to
      its mirror, launches exec_clean, and polls while the word is -1 for
      at most 200000000 loop tests; exec is submitted when the final observed
      word is not 1. Thus dirty observations and timeout belong here, even
      if a timed-out verification later returns clean. During outer capture
      both graphs are recorded without polling, and every subsequent execution
      of that recorded request belongs here for either device verdict.
      This includes first replay after successful graph construction and
      existing-graph replay. Any private-stream run_pipeline in this request
      is capture-only following successful cudaStreamBeginCapture; there is
      no additional uncaptured pipeline submission on that stream.
      Pure recording creates no computation or completion events. Execution
      uses current tensor contents with the recorded ABI choices and bindings.
      Reuse reruns neither route_hist nor table/workspace initialization nor
      the ABI eligibility probe. Its accepted probe established zero payload
      and finite scales, scores and parameters when a was built; both current
      verifications recompute their own verdicts. Under the default scope,
      the nonzero pinned mirror also implies T*H>=2^20.
design:
  math_reshape:
    thesis: |-
      Evaluate the current zero predicate twice and zero the caller output on
      both evaluations before the routed computation. The second verdict controls
      the full pipeline: clean avoids expert arithmetic, while dirty retains
      compact routing and fused FC1 quantization, paying for both scans and zero writes.
    rewrite:
      - step: zero_verify
        name: Two independent zero checks and successive output versions
        math: |
          R=T*K. HasLimit=1 when gemm1_clamp_limit is not None, else 0.
          Let flat(X) denote row-major flattening and bits8(x) its eight-bit encoding.
          Qword[w] is the unsigned little-endian integer formed from four consecutive
          bytes of flat(hidden_states), for 0<=w<T*H/8.
          VerifyScale[v]=bits8(flat(hidden_states_scale)[v]), for 0<=v<T*H/Block;
          VerifyScore[v]=flat(route_weights)[v], for 0<=v<R. These are views of
          existing input bytes, with no additional storage. In each evaluation
          these names refer to the bytes read then, not to recording-time contents.
          The operator bitand denotes bitwise AND on unsigned integers.
          There are two evaluations q=0,1, in that order. For each q and
          b in [0,VerifyWorkers), D(q,b) is 1 if any of the following holds at
          that evaluation, and 0 otherwise:
            bitand(Qword[w],0x77777777) != 0 for some w in Shard(b,T*H/8);
            bitand(VerifyScale[v],0x7f) = 0x7f for some v in Shard(b,T*H/Block);
            VerifyScore[v] is not finite for some v in Shard(b,R);
            gemm1_alpha[e] or gemm1_beta[e] is not finite for some e in Shard(b,E);
            gemm1_clamp_limit is not None and gemm1_clamp_limit[e] is not finite
              for some e in Shard(b,E).
          FirstDirtyPart[b]=int32(D(0,b)); FirstClean=int32(1-max_b FirstDirtyPart[b]).
          DirtyPart[b]=int32(D(1,b)); Clean=int32(1-max_b DirtyPart[b]); Dirty=1-Clean.
          The second evaluation recomputes D; it does not reuse FirstClean.
          Independently of both verdicts, FirstZeroOutput[t,h]=bf16(0) at q=0,
          then ZeroOutput[t,h]=bf16(0) at q=1 for every (t,h).
          FirstZeroPacket[c,:]=flat(FirstZeroOutput)[8*c:8*c+8] and
          ZeroPacket[c,:]=flat(ZeroOutput)[8*c:8*c+8], for 0<=c<T*H/8.
          These are successive versions of the caller output, not separate arrays;
          the second zero fill overwrites the first before any routed output write.
          FirstHostVerdict[0]=FirstClean and then HostVerdict[0]=Clean. The first
          and second device verdicts, and their host copies, are successive versions;
          no first-verification value is used by routing through finalize.
          The scope first_verification ends when the second versions replace it.
          When Clean=1, Y=ZeroOutput without further writes. All routing, gathered
          input, packed activation and route-result scratch retains its preceding
          bytes and is not read by the following steps. Define M=J=U=PaddedRows=0
          and V={} in this case as empty computation domains, not metadata writes.
          When Dirty=1, evaluate routing through finalize below; those steps overwrite Y.
          Nchunk=9*H/256 is the input byte-chunk count per token in either case.
        symbol:
          VerifyWorkers: {meaning: Number of verification shards, binding: 'bind:design.work_schedule::VerifyWorkers'}
          Shard: {meaning: Flat indices assigned to verification shard b, binding: 'bind:design.work_schedule::Shard'}
          Mirror: {meaning: Number of pinned host verdict elements in this path, binding: 'bind:design.work_schedule::Mirror'}
          Qword: {meaning: Four-byte view of the current packed activation payload, shape: [{word: T*H/8}], dtype: uint32}
          DirtyPart: {meaning: Boolean dirty result of each verification shard, shape: [{shard: VerifyWorkers}], dtype: int32}
          Clean: {meaning: 'Second device verdict, one for clean and zero for dirty', shape: [], dtype: int32, retention: keep_value
              invocation}
          ZeroOutput: {meaning: Second zero-filled caller-output version before dirty-path overwrite, shape: 'ref:contract.algorithm_requirement::Y.shape',
            dtype: bf16, retention: keep_value invocation}
          ZeroPacket: {meaning: 'Eight-element view of the second zero-filled output, with no additional storage',
            shape: [{packet: T*H/8}, {element: 8}], dtype: bf16}
          HostVerdict: {meaning: Host-visible copy of the second device verdict, shape: [{entry: Mirror}], dtype: int32,
            retention: keep_value invocation}
          VerifyScale: {meaning: Flat byte view of current activation scales, shape: [{scale_byte: T*H/Block}], dtype: uint8}
          VerifyScore: {meaning: Flat view of the current routing weights, shape: [{route: R}], dtype: fp32}
          FirstDirtyPart: {meaning: Boolean dirty result of each first-verification shard, shape: [{shard: VerifyWorkers}],
            dtype: int32}
          FirstClean: {meaning: Device verdict produced by the independent first verification, shape: [], dtype: int32,
            retention: keep_value first_verification}
          FirstZeroOutput: {meaning: 'First zero-filled version of the caller output, replaced by ZeroOutput', shape: 'ref:contract.algorithm_requirement::Y.shape',
            dtype: bf16, retention: keep_value first_verification}
          FirstZeroPacket: {meaning: 'Eight-element view of FirstZeroOutput, with no additional storage', shape: [
              {packet: T*H/8}, {element: 8}], dtype: bf16}
          FirstHostVerdict: {meaning: 'First host-visible verdict, replaced by HostVerdict', shape: [{entry: Mirror}],
            dtype: int32, retention: keep_value first_verification}
      - step: routing
        name: Compact routes and enumerate expert row blocks
        math: |
          For Dirty=1 only:
          Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
          For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
          [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
          Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
          Offs[0] = TilePrefix[0] = 0;
          Offs[e+1] = Offs[e] + Counts[e];
          TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
          For each group g and expert e, the local reservation cursor starts at
          sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
          by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
          Thus groups occupy disjoint expert intervals in ascending group order,
          while ranks within a group follow atomic arrival order. rho is a bijection
          from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
          RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
          PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
          PackedExpert[rho(t,k)] = route_ids[t,k].
          For TilePrefix[e] <= j < TilePrefix[e+1],
          TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
          Define base(j) = Offs[TileExpert[j]] + TileRow[j],
          valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
          Only the used prefixes of the packed arrays and tile arrays are written.
        symbol:
          RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
          RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
          BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
          Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
          Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value
              invocation}
          Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
          TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
              invocation}
          RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}],
            dtype: int32, retention: keep_value invocation}
          PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}],
            dtype: int32, retention: keep_value invocation}
          PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
            retention: keep_value invocation}
          PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}],
            dtype: int32, retention: keep_value invocation}
          TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
              invocation}
          TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
              invocation}
      - step: gather
        name: Replicate packed input into compact route order
        math: |
          For Dirty=1 only:
          For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
          GatherS[rho(t,k),:] = hidden_states_scale[t,:].
          Each token with at least one valid route supplies one logical input
          payload/scale copy, replicated to its valid routes. Let U be the count
          of such tokens. Unused rows of the R-row backing buffers retain old bytes.
          For f = t*Nchunk+c, SourceChunk[f,:] denotes the
          c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
          of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
          chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
          These chunk names are views of the same copies, with no additional storage.
          Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
          definitions; these decoded operands are mathematical views, not saved arrays.
        symbol:
          GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8,
            retention: keep_value invocation}
          GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn,
            retention: keep_value invocation}
          SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
          GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K},
              {byte: 16}], dtype: uint8}
      - step: fc1_quantize
        name: Joint up and gate contraction with fused approximate activation
        math: |
          For Dirty=1 only:
          BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
          form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
          W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
          C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
          B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
          B1 is the concatenation of those up and gate groups; X1's valid row r
          is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
          contracted: their payload comes from consecutive backing-buffer rows
          base(j)+r, while their scale row is redirected to base(j).
          Payload outside the R-row domain is zero-filled; unused in-bounds
          backing bytes remain unspecified, not zeroed.
          For each row and intermediate channel, take u,v from the final C1
          up/gate columns and apply Contract's asymmetric clamp when enabled.
          Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
          ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
          Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
          For activation_type = 3, z = gemm1_alpha[e]*L and
          a = (v*S(v,z))*(u+gemm1_beta[e]).
          For type 10, zg = ia*(2*L), zu = ib*(2*L),
          g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
          w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
          The unused beta reciprocal for type 3 does not enter a.
          For each 16-channel block, peak = max(abs(a)),
          s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
          zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
          Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
          channel into the low nibble. Save those bytes as ActQ and s as ActS,
          only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
          multiplication and code conversion; they decode to zero scale.
          Padding rows also execute activation and quantization but are discarded.
          C1 and activated FP32 values are consumed locally, not globally materialized.
        symbol:
          BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
          BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
          C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32,
            retention: 'carry_forward (j,n); l=-1..H/64-1'}
          ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}],
            dtype: uint8, retention: keep_value invocation}
          ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn,
            retention: keep_value invocation}
        arithmetic:
          approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based
            tanh identity and reciprocal-multiply quantization replace the reference evaluation. unknown: no verified
            uniform error bound for the full declared domain is supplied; source comments and local probes are not
            an output guarantee.'
          accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation;
            four such updates make one BK stage. The notation does not assert FP32 products or reference-order bit
            equality.
      - step: fc2
        name: Packed intermediate contraction and route materialization
        math: |
          For Dirty=1 only:
          For each row tile j and BN2-column group n in [0,H/BN2),
          X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
          B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
          C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
          B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
          For valid(j) <= r < BM, X2[r,:] is
          Decode(ActQ[base(j),:],ActS[base(j),:]): both payload and scale repeat
          the first valid row. These padded rows are contracted and then discarded.
          Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
          for r < valid(j). Unused route-result rows retain old contents.
        symbol:
          BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
          C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
              (j,n); l=-1..I/64-1'}
          RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
            retention: keep_value invocation}
        arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only
            the reduction extent and output columns change.}
      - step: finalize
        name: Fixed route-order fused accumulation into caller output
        math: |
          For Dirty=1 only:
          For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
          Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
          otherwise Z(k) = Z(k-1), without reading RouteResult.
          Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
          existing one-element list alias as required by Contract.
        symbol:
          Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
              (t,h); k=-1..K-1'}
    ledger:
      baseline: |
        Contract evaluation for all valid routes, saving decoded FP32 activations,
        both FC1 outputs and Act before QDQ; save the same BF16 route results.
        The contraction/materialization entries below compare the dirty case.
      matmul:
        - item: Expert contractions
          change: 'For Dirty=1: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows'
          by:
            - fc1_quantize
            - fc2
        - item: Clean shortcut
          change: 'For Clean=1: 3*count({(t,k) | route_ids[t,k]>=0})*H*I -> 0 expert MAC per invocation'
          by:
            - zero_verify
      vector:
        - item: Activation and quantization
          change: 'For Dirty=1: M*I -> PaddedRows*I channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E)) integer
            routing work per invocation'
          by:
            - routing
            - fc1_quantize
        - item: Current-input verification
          change: Add 2*(T*H/8 payload-word tests + T*H/Block scale-byte tests + R score tests + (2+HasLimit)*E parameter
            tests) per invocation
          by:
            - zero_verify
      footprint:
        - item: Intermediate materialization
          change: 'For Dirty=1: 12*M*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered
            bytes; BF16 route bytes remain 2*M*H'
          by:
            - gather
            - fc1_quantize
            - fc2
      traffic:
        - item: Gather
          change: 'For Dirty=1: Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand
            reads'
          by:
            - gather
        - item: Verification scan and zero store
          change: Add 2*(41*T*H/16 + 4*R + 4*(2+HasLimit)*E) logical bytes per invocation, plus scalar verdict traffic;
            dirty execution writes the output a third time
          by:
            - zero_verify
      error:
        - item: Numerical evaluation
          change: 'For Dirty=1: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I
            evaluated channels; fixed FMA route reduction affects T*H outputs; uniform output error bound not established'
          by:
            - fc1_quantize
            - finalize
  work_schedule:
    thesis: |
      Submit the independent verification graph, then the full graph containing
      verification, one-CTA preparation, flat gather, fused FC1, cp.async FC2 and
      finalize: seven computational kernels with distinct submission identities.
      Outside capture the host resets the pinned mirror to -1 before the first
      graph, performs the bounded observation described in when, and submits the
      full graph on a non-clean observation. A timeout does not cancel the first
      grid or imply its completion. Outer recording fixes both graphs and performs
      the host reset once, without polling; replay repeats neither host action. The graph boundary orders the
      first grid's completion before the second grid starts, including their
      shared output, verdict, dirty-word and arrival-counter storage reuse.
      Within the full graph PDL separates launch permission from data readiness.
      Every submitted downstream worker checks the second Clean before scratch
      reads, even with no payload work. Clean execution retains all seven
      launches and completion events. Preparation, gather and finalize trigger
      PDL before guarding; FC1/FC2 guard first and grant launch_ready by grid
      completion on clean, or by their explicit entry trigger on dirty.
      Workspaces and both verdict stores remain owned by the reused ABI.
      Same-stream completion orders subsequent requests; no cross-stream
      exclusion is added. No extra initialization kernel belongs to this reuse.
    flow:
      launch:
        - {phase: [first_verify], protocol: pdl}
        - {phase: [verify], protocol: pdl, start_after: first_verify.kernel_done}
        - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
        - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
        - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
        - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
        - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Clean: {producer: verify, consumer: [prepare, gather, fc1, fc2, finalize], storage: global, ready: verify.kernel_done,
          wait_at: [prepare.guarded, gather.guarded, fc1.guarded, fc2.guarded, finalize.guarded]}
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      first_verify:
        describe: Independently scan the inputs, zero the caller output and publish the first verdict.
        decomposition:
          strategy: |
            VerifyWorkers=min(T,296) and Mirror=1. Let
            Shard(b,N)={v in integers | 0<=v<N and floor(v/256) mod VerifyWorkers=b}.
            Each worker b owns one shard of evaluation q=0 in zero_verify. It visits
            256 consecutive indices at a time with stride 256*VerifyWorkers, separately
            for output packets, payload words, scale bytes, scores and expert parameters.
            Each stream is clipped to its own extent; the clamp stream exists only for
            HasLimit=1. Output packet c belongs to Shard(b,T*H/8) and is zeroed once,
            before that worker's input scans. The target packet shape is a per-shard
            capacity. Empty parameter slices do not remove workers or their arrivals.
            FirstDirtyPart reduces directly into the shared global verification state,
            without a partial array. The last arriving worker publishes FirstClean and
            FirstHostVerdict. FirstZeroPacket aliases the caller output. The second
            verification overwrites these first versions only after first_verify.kernel_done;
            it does not consume their numeric values. Host observation need not wait
            for full-grid completion and supplies no substitute for that reuse boundary.
          partition:
            shard: {size: VerifyWorkers, tile: 1}
          worktile:
            iteration:
              Qword: {shape: [{word: 256}], dtype: uint32, direction: ascending}
              gemm1_alpha: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              VerifyScale: {shape: [{scale_byte: 256}], dtype: uint8, direction: ascending}
              VerifyScore: {shape: [{route: 256}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              FirstZeroPacket: {shape: [{packet: '256*ceil_div(T*H/8,256*VerifyWorkers)'}, {element: 8}], dtype: bf16}
              FirstDirtyPart: {shape: [], dtype: int32}
              FirstHostVerdict: {shape: [{entry: Mirror}], dtype: int32}
            tile_reduction:
              dimension: shard
              input: ref:design.math_reshape::FirstDirtyPart
              output: ref:design.math_reshape::FirstClean
              method: ref:design.math_reshape::zero_verify
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: VerifyWorkers
        schedule:
          worktile_order:
            - {by: shard, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      verify:
        describe: Rescan all verification inputs and replace the first zero output and verdict versions.
        decomposition:
          strategy: |
            Use VerifyWorkers, Mirror and Shard from first_verify, with the same
            clipped per-stream traversal, now for evaluation q=1 of zero_verify.
            Every worker zeros its ZeroPacket region, scans its current inputs and
            contributes DirtyPart, even when the first verdict was clean. The last
            arrival publishes Clean and HostVerdict. The first grid has completed,
            so its dirty word and arrival counter are reset and all of its output
            writes are retired before this grid reuses those allocations. No routing
            kernel consumes FirstClean; only this grid's Clean controls the main work.
            ZeroPacket and the first grid's packets alias the same caller output.
            Finalize overwrites it only on dirty execution after ordered completions.
          partition:
            shard: {size: VerifyWorkers, tile: 1}
          worktile:
            iteration:
              Qword: {shape: [{word: 256}], dtype: uint32, direction: ascending}
              gemm1_alpha: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              VerifyScale: {shape: [{scale_byte: 256}], dtype: uint8, direction: ascending}
              VerifyScore: {shape: [{route: 256}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              ZeroPacket: {shape: [{packet: '256*ceil_div(T*H/8,256*VerifyWorkers)'}, {element: 8}], dtype: bf16}
              DirtyPart: {shape: [], dtype: int32}
              HostVerdict: {shape: [{entry: Mirror}], dtype: int32}
            tile_reduction:
              dimension: shard
              input: ref:design.math_reshape::DirtyPart
              output: ref:design.math_reshape::Clean
              method: ref:design.math_reshape::zero_verify
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: VerifyWorkers
        schedule:
          worktile_order:
            - {by: shard, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: BM=128, RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover contiguous,
            clipped ranges of flattened route slots; these are local subdivisions of one worktile, not independent
            work. Stage all IDs once, form group histograms and their exclusive expert bases, scan expert counts and
            tile counts, then assign local atomic ranks and enumerate J tiles by binary search of TilePrefix. This
            worktile writes all Counts, both E+1 prefixes and every RoutePos; packed maps and tile maps write only
            their used prefixes. No separate count initialization or global reservation-counter update is needed.
          partition:
            active: {size: Dirty, tile: 1}
          worktile:
            invariant:
              route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: Dirty}
            refill: none
            exit: assigned_done
          worktile_order:
            - {by: active, direction: ascending}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: On dirty execution read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened
            (token,16-byte-chunk) coordinates, with chunk fastest; a tile can cross token boundaries. All work is
            empty when M=0. Otherwise chunks whose token has no routes are visited without payload reads or writes;
            the final packet is clipped.
          partition:
            chunk: {size: 'Dirty*T*Nchunk*min(1,M)', tile: 128}
          worktile:
            invariant:
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: min(1184,ceil_div(T*Nchunk,128))
        schedule:
          worktile_order:
            - {by: chunk, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local
            iterations and four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j); padded
            arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice is
            read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI''s row-tile upper
            bound. Let Cap be the cached automatic grid cap: twice the queried SM count, or zero if that query failed.
            For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            The submitted grid uses G(I/BN1), independent of the current J.'
          partition:
            row_tile: {size: J, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(I/BN1)
        schedule:
          worktile_order:
            - {by: row_tile, direction: ascending}
            - {by: intermediate, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only
            valid(j) output rows are stored. All submitted workers remain present when J=0, but their assigned sequences
            are empty.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(H/BN2)
        schedule:
          worktile_order:
            - {by: row_tile, direction: ascending}
            - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker
            produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are a local reduction,
            not independently assigned work; masked routes do not read the route-result slab.
          partition:
            token: {size: Dirty*T, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos: {shape: [{slot: K}], dtype: int32}
              route_weights: {shape: [{slot: K}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: T*ceil_div(H,128*FinalWidth)
        schedule:
          worktile_order:
            - {by: token, direction: ascending}
            - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: Dirty*worker_id, count: Dirty}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: |-
      Both verification grids use fresh per-worker dirty accumulators and the
      same persistent global verdict/arrival state, with full-grid completion
      ordering their reuse. Downstream guards consume only the second verdict;
      clean execution completes every submitted grid without scratch staging or
      TMEM allocation. Dirty execution retains FC1's independent producers, MMA
      and early-release epilogues, and FC2's four-warp, three-slot cp.async loop.
    phase:
      first_verify:
        resource:
          LocalDirty: {space: register, member_slot_shape: [{thread: 256}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              member: warp[0:8]
              execution_mode: serial
              verb:
                enter: |-
                  All participating threads wait for predecessor grid completion and
                  visibility; warp 0 then grants dependent-grid launch permission.
                  This grants no data readiness and executes even with no payload work.
                inspect: |-
                  Each thread submits its assigned FirstZeroPacket stores, then scans its
                  payload-word, scale-byte, score and parameter indices for evaluation q=0.
                  Initialize LocalDirty to zero and retain the accumulated dirty bits through
                  the CTA Boolean reduction. No route IDs, weights or weight scales are read.
                publish: |-
                  Reduce LocalDirty to FirstDirtyPart with a CTA-wide OR. Verification uses
                  one persistent four-int32 global state: a verdict, dirty accumulator,
                  arrival counter and unused word, initially zeroed before ABI publication.
                  A dirty CTA leader atomically ORs the dirty accumulator with one. Every
                  CTA leader then executes a device release fence and atomically increments
                  the arrival counter once. The last ticket holder reads the combined dirty
                  word, publishes FirstClean, resets the dirty accumulator and arrival counter,
                  and performs a system fence before writing FirstHostVerdict to the pinned
                  mirror. Non-last CTAs neither spin nor require all CTAs to be resident.
                  The host may observe the mirror before other CTAs' zero stores complete;
                  this publication therefore does not imply first_verify.kernel_done.
                  That grid-completion event supplies visibility and finishes all first-grid
                  accesses before the next graph overwrites the shared output and state.
                  Outside capture the bounded host observation precedes the next graph's
                  submission; a timeout needs no cancellation or extra kernel.
                  Execution of an outer recording has no intervening host poll.
            pipe:
              prologue:
                - enter:Protocol
              steady:
                - inspect:LocalDirty
                - publish:FirstClean
      verify:
        resource:
          LocalDirty: {space: register, member_slot_shape: [{thread: 256}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              member: warp[0:8]
              execution_mode: serial
              verb:
                enter: |-
                  All participating threads wait for predecessor grid completion and
                  visibility; warp 0 then grants dependent-grid launch permission.
                  This grants no data readiness and executes even with no payload work.
                inspect: |-
                  Each thread submits its assigned ZeroPacket stores, then rescans the
                  payload-word, scale-byte, score and parameter indices for evaluation q=1.
                  Initialize fresh LocalDirty state and retain it through the CTA Boolean
                  reduction. No first-grid dirty result, route IDs, weights or weight scales
                  are read. Input bytes are those observed during this execution.
                publish: |-
                  Reduce LocalDirty to DirtyPart with a CTA-wide OR. Use the same four-int32
                  global state as first_verify, whose dirty accumulator and arrival counter
                  are now reset. A dirty CTA leader atomically ORs the dirty word with one;
                  every leader executes a device release fence and atomically increments
                  the arrival counter once. The last ticket holder reads the combined dirty
                  word, publishes Clean, resets dirty and arrival words, and performs a
                  system fence before overwriting the pinned mirror with HostVerdict.
                  Non-last CTAs do not spin or require grid-wide residency. This publication
                  does not imply completion of other CTAs' zero stores: verify.kernel_done
                  supplies full-grid visibility for the output and device verdict. Guards
                  consume this second Clean only. No host observation is required after
                  this grid. State and mirror remain allocated with the ABI; same-stream
                  ordering completes this grid and all guard readers before another request
                  may overwrite them.
            pipe:
              prologue:
                - enter:Protocol
              steady:
                - inspect:LocalDirty
                - publish:Clean
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1, view: {
              route_ids: {}}}
          GroupTable: {space: SMEM, member_slot_shape: [{group: RouteGroups}, {expert: 256}], dtype: int32, slot_count: 1,
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g, g+1], expert: [
                    0, E]}}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Stage every route ID once into StagedIds and zero the full GroupTable, including the unused
                  expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous
                  before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive reservation bases
                  of routing, and writes Counts. Another rendezvous precedes the paired expert scans; ScanScratch
                  holds two 64-word scan arrays and J. Publish Offs and TilePrefix both globally and into their local
                  caches, then rendezvous before scatter and tile enumeration. Each warp advances its own RankCursor
                  by atomics while writing RoutePos and all three packed maps. Enumerate and store TileExpert and
                  TileRow from the cached tile prefix. StagedIds and the prefix caches survive through their last
                  reads; GroupTable is overwritten only after histogram production is complete. M=0 still writes zero
                  Counts/prefixes and RoutePos=-1, with no packed or tile stores.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              prologue:
                - enter:Protocol
                - guard:Clean
              steady:
                - produce:RoutePos(t)
              repeat: t
        domain: {t: worktile}
        milestone:
          guarded:
            - Main/guard:Clean@done
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries,
                  and loads a 16-byte source only if some route is valid. Replicate to those destinations; the same
                  registers hold this chunk through all route stores. No inter-thread exchange.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              repeat: t
              prologue:
                - enter:Protocol
                - guard:Clean
              steady:
                - produce:GatherChunk(t)
        milestone:
          guarded:
            - Main/guard:Clean@done
      fc1:
        domain:
          t: worktile
          i:
            - 0
            - H/BK
          g:
            flatten:
              - t
              - i
          c:
            - 0
            - 2
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1,
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no assigned
                  item still participates.
                prime: Resolve this worktile's expert and row base. Load from GatherS the first stage and, when the
                  local stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting padding
                  scales to the first valid row. Prefetch registers are restarted per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy is
                  overwritten without use. Done includes this arrival, not completion of the independent payload/weight-scale
                  loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain or
                  a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              prologue:
                - guard:Clean
              steady:
                - repeat:
                    active:
                      - 0
                      - Dirty
                  steady:
                    - repeat: t
                      prologue:
                        - enter:Protocol
                      steady:
                        - prime:APrefetch(t)
                        - repeat: g[t]
                          steady:
                            - publish:AScale(g)
                      epilogue:
                        - retire:TensorStorage
            waits_for:
              reuse:
                publish:AScale(g+2):
                  - MMA/mma:PayloadA(g)@PayloadB(g)
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops. A
                    worker with no assigned item still participates.
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the
                  full-stage transaction count for 32768 payload bytes. Done covers both payload transfers. Payloads
                  use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done
                  is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint
                  two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              prologue:
                - guard:Clean
              steady:
                - repeat:
                    active:
                      - 0
                      - Dirty
                  steady:
                    - repeat: g
                      prologue:
                        - enter:Protocol
                      steady:
                        - load:PayloadPair(g)
                        - stage:BScale(g)
                      epilogue:
                        - retire:TensorStorage
            waits_for:
              reuse:
                load:PayloadPair(g+3):
                  - MMA/mma:PayloadA(g)@PayloadB(g)
                stage:BScale(g+2):
                  - MMA/mma:PayloadA(g)@PayloadB(g)
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops. A
                    worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors;
                    q identifies the optional wait before the first scale copy of a worktile.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM:
                  four scale-copy operations for each operand. Issuance includes submission of all scale copies; only
                  then does this issuer advance to the MMA action. Done is covered by the following cumulative MMA
                  completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1.
                  The first update initializes C1 without reading its old value. The fused 128-column product covers
                  both up and gate. Issue a cumulative completion commit after each stage; done covers scale copies,
                  payload reads and accumulator updates. The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites
                  that scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
