        milestone:
          guarded:
            - AProducer/guard:Clean@done
            - BProducer/guard:Clean@done
            - MMA/guard:Clean@done
            - Epilogue/guard:Clean@done
            - Epilogue0/guard:Clean@done
            - Epilogue1/guard:Clean@done
            - Epilogue2/guard:Clean@done
      fc2:
        domain:
          t: worktile
          i:
            - 0
            - I/BK
          s:
            - 0
            - I/BK+2
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              'PayloadA(t,i)': {slot_index: i%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: BN2}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              'PayloadB(t,i)': {slot_index: i%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 3,
            view: {'AScale(t,i)': {slot_index: i%3}}}
          BScale: {space: SMEM, member_slot_shape: [{row: BN2}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 3,
            view: {'BScale(t,i)': {slot_index: i%3}}}
          RowMap: {space: SMEM, member_slot_shape: [{row: BM}], dtype: int32, slot_count: 1}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1,
            view: {C2: {part: {column: [0, 128]}}, 'ScaleTM(t,i)': {part: {column: [128+32*(i%3), 160+32*(i%3)]},
                dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Execute the PDL entry protocol before reading J. For J=0 there is no local allocation and all
                  work domains are empty. Otherwise initialize completion state and allocate TensorStorage through
                  warp 0, then rendezvous all four warps, including workers with empty assigned sequences. MMA completion
                  parity starts once per worker and continues across its worktiles.
                setup: Resolve the expert, row base and valid row count. Fill RowMap with base(j)+r for valid rows
                  and base(j) for padding, then rendezvous the CTA. Both activation payload and scale accesses use
                  RowMap; keep it through this worktile's last operand access. Operand ring positions restart at zero
                  for each worktile.
                stage:
                  execution_mode: async
                  meaning: Operands(t,s) is one payload-copy group. For s<count(i), all four warps copy ActQ into
                    PayloadA and prepared FC2 weights into PayloadB in 16-byte chunks, 16384 bytes per operand. For
                    the first two stages, issuance first synchronously loads and scatters ActS and prepared weight
                    scales into AScale and BScale, 2048 bytes per operand, and establishes shared-to-async visibility.
                    Later scale stages are filled by the loop tail. All four buffers use slot s%3. Commit one group
                    for every action, including s>=count(i), when there are no operand accesses. Done covers the group's
                    payload copies and any leading scale stores; empty groups retain issue/done events.
                wait: Ready(t,i) waits for the matching payload-copy group and rendezvous all four warps. Two later
                  committed groups, including terminal empty groups, make this wait select stage i. Leading scales
                  were published by their stage action; later scales were synchronously published in an earlier loop
                  tail. Product(t) waits for the final cumulative MMA completion and rendezvous the CTA before any
                  accumulator drain. Completion parity advances after every MMA wait, including Product.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: Warp 0's elected issuer establishes shared-to-async visibility, copies AScale and BScale
                    into ScaleTM with four scale-copy operations per operand, then issues four ordered 64-channel
                    block-scaled updates to C2. The first update initializes C2 without reading its old value. A cumulative
                    completion commit covers scale copies, payload consumption and accumulator updates. Same-issuer
                    ordering makes each scale copy visible to its MMA.
                fill: ScalePair(t,s) is the pair AScale and BScale for the future stage s. After issuing the current
                  MMA, all four warps synchronously load ActS and prepared weight scales through registers, scatter
                  into slot s%3 and establish shared-to-async visibility. These loads can overlap the current MMA.
                  Each activation row loads 16 bytes; each weight row loads four 4-byte words from its prepared scale
                  image. Done covers all shared stores and publication. For s>=count(i), no scale accesses occur;
                  this action is a no-op with issue/done.
                emit: Each warp drains its hardware TMEM quadrant, one row per lane, in BN2/32 successive 32-column
                  chunks. Wait for each TMEM read, convert valid rows to BF16 and submit direct global vector stores
                  to RouteResult. Padding rows are read but not stored. Reuse that warp's Fragment only after its
                  current store instructions have consumed it. A final CTA rendezvous follows all chunks; done guarantees
                  all TMEM reads and store submissions are finished, permitting the next worktile to reuse C2 and
                  the operand rings. Global stores may remain in flight.
                retire: Warp 0 deallocates TensorStorage after the whole assigned sequence; for J>0 even an idle worker
                  allocates and deallocates. For J=0 this is a no-op. Real operand copies have been consumed; terminal
                  empty groups retain no resource accesses. Kernel completion supplies global RouteResult visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              prologue:
                - guard:Clean
              steady:
                - repeat:
                    active:
                      - 0
                      - Dirty
                  steady:
                    - repeat: t
                      prologue:
                        - enter:Protocol
                      steady:
                        - setup:RowMap(t)
                        - repeat:
                            p:
                              - 0
                              - 2
                          steady:
                            - stage:Operands(t,p)
                        - repeat: i
                          steady:
                            - stage:Operands(t,i+2)
                            - wait:Ready(t,i)
                            - mma:PayloadA(t,i)@PayloadB(t,i)
                            - fill:ScalePair(t,i+2)
                        - wait:Product(t)
                        - emit:RouteResult(t)
                      epilogue:
                        - retire:TensorStorage
            waits_for:
              data:
                wait:Ready(t,i)@done:
                  - Main/stage:Operands(t,i)
                wait:Product(t)@done:
                  - Main/mma:PayloadA(t,last(i))@PayloadB(t,last(i))
              reuse:
                stage:Operands(t,i+2):
                  - Main/mma:PayloadA(t,i-1)@PayloadB(t,i-1)
        milestone:
          guarded:
            - Main/guard:Clean@done
      finalize:
        resource:
          Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices and
                  scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order using
                  finalize's FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier is
                  required. Empty routing still writes zeros.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for predecessor grid completion and read Clean from the current
                    verification state. Done makes the uniform verdict available to this role.
                    Clean=1 leaves the worktile domains empty and touches no route metadata,
                    operands or results. This guard issues no explicit dependent-launch trigger.
            pipe:
              prologue:
                - enter:Protocol
                - guard:Clean
              steady:
                - produce:Y(t)
              repeat: t
        domain: {t: worktile}
        milestone:
          guarded:
            - Main/guard:Clean@done
realization:
  require:
    - item:
        - design.tile_pipeline::fc1.MMA
        - design.tile_pipeline::fc2.Main
      choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and the tcgen05.cp scale path, with cumulative tcgen05.commit
        completion and tcgen05.fence::after_thread_sync at the stated synchronization boundaries.
      reason: Ordered scale consumption and cumulative operand-read completion implement both phases' ring and accumulator
        reuse protocols.
    - item:
        - design.tile_pipeline::fc1
        - design.tile_pipeline::fc2.Main
      choice: Use tcgen05.ld and tcgen05.wait::ld for register materialization, respecting each issuing warp's hardware
        quadrant. Retire the reads before FC1's early release or FC2's end-of-work rendezvous.
      reason: Accumulator reuse requires completed TMEM reads, independently of the later global store completion.
    - item: design.tile_pipeline::fc2.Main
      choice: Bind payload staging to cp.async.cg 16-byte copies with cp.async.commit_group for every Operands group,
        including empty terminal groups, and cp.async.wait_group 2 before the CTA rendezvous. Stage scales through
        ordinary global loads and shared stores, publishing them with fence.proxy.async.shared::cta.
      reason: The payload lookahead uses copy-group completion, while the synchronous scale tail relies on shared-to-async
        visibility before tcgen05.cp.
    - item: design.work_schedule::flow
      choice: |-
        Use ordered same-stream cudaGraphLaunch calls for the independent and full
        graphs. Preserve programmatic-stream-serialization kernel launches and the
        griddepcontrol.wait / launch_dependents protocol within each graph.
      reason: |-
        The graph boundary closes shared-output and verdict-state reuse, while
        PDL launch permission within the full graph is separate from data visibility.
    - item:
        - design.tile_pipeline::first_verify.Main
        - design.tile_pipeline::verify.Main
      choice: |-
        Use CTA Boolean reduction, global atomicOr/atomicAdd and device threadfence
        for the dirty-word/arrival protocol. Bind both host verdict versions to
        the same pinned host storage, with a system fence before each volatile write.
      reason: |-
        Each last-arriver fold needs ordered dirty publication and one ticket per
        CTA; the first verdict must be visible to the bounded host poll without a grid barrier.
