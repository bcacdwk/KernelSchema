                steady: [{repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)',
                      'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)'], epilogue: ['retire:TensorStorage']}]
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
