meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: double_verify_fused_big_flat
    parent: verify_fused_big_flat
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved routing
      preparation threshold, and zflag/zflag_host are the device verification
      state and its pinned host mirror. All implementation controls used to
      construct a and any reused graph follow the frozen default implementation
      scope. Let R=T*K.
      Select exactly when the call reuses a, a.cfg=97, a.cfg2=23, I=256,
      a.zflag!=0, a.zflag_host!=0, R>a.small_thresh, R<49152, and moe_run
      returns zero through graph_replay with both exec_clean and exec available.
      The request submits the verify-only graph followed by the full graph
      on the caller stream: outside capture the final volatile host test
      after the bounded poll observes a value other than 1; during outer
      capture both graphs are recorded unconditionally for later execution.
      The bounded poll stops when the mirror leaves -1 or its incremented
      spin count reaches 200000000; a timeout alone does not select this
      node if the subsequent decision read already observes 1.
      The executed or recorded FC2 launch uses a successful tma_set lookup
      with 128-column boxes and k_gemm_f4_flat<128,3,2,true>.
      Every private-stream run_pipeline call, if present, is capture-only
      following successful cudaStreamBeginCapture. This includes first replay
      after graph construction and existing-graph replay with these submissions.
      Pure capture creates no computation or GPU completion events; each later
      outer-graph replay executes both graphs regardless of its tensor contents.
      ABI choices and bindings are fixed at recording; device reads use current
      contents. Reuse does not repeat route_hist, table initialization, workspace
      construction or the ABI zero probe. Either second-verification verdict
      belongs here; the host decision does not replace the second device check.
design:
  math_reshape:
    thesis: |-
      Revalidate zero inputs and provisionally overwrite output twice before
      the compact routed computation. Only the second verdict guards the
      fused FC1 and BF16 route materialization; the first check adds an input
      scan and full output write even when the second check is clean.
    rewrite:
    - step: verify
      name: Two fresh zero checks with successive provisional output versions
      math: |
        Let VerifyWorkers, VerifyWidth and HasMirror be bound by work_schedule.
        Define VerifyIndex(v,L) = {i in integers | 0 <= i < L,
                                  floor(i/VerifyWidth) mod VerifyWorkers = v}.
        For each verification pass p in {0,1} and v in [0,VerifyWorkers),
        let D(p,v) be int32(1) if any following test fails on this shard,
        otherwise int32(0). Evaluate the tests afresh in each pass:
        all four bytes b of each hidden_states payload word indexed by
        VerifyIndex(v,T*H/8) satisfy bit_and(b,0x77)=0;
        each hidden_states_scale byte b in VerifyIndex(v,T*H/Block) satisfies
        bit_and(b,0x7f) != 0x7f;
        route_weights indexed by VerifyIndex(v,R) are finite;
        gemm1_alpha[e], gemm1_beta[e], and gemm1_clamp_limit[e] when present,
        are finite for e in VerifyIndex(v,E).
        Here R=T*K, a payload word contains four bytes, and bit_and denotes
        integer bitwise conjunction. Every listed region is evaluated without
        a global early exit. Define C(p)=int32(1-max_v D(p,v)).
        Each pass unconditionally writes provisional Y[t,h]=bf16(0) for all t,h;
        shard v writes groups of eight flattened output elements indexed by
        VerifyIndex(v,T*H/8). The second pass replaces the first output version.
        DirtyFirst(v)=D(0,v), CleanFirst=C(0), MirrorFirst[0]=CleanFirst.
        Dirty(v)=D(1,v), Clean=C(1), Mirror[0]=Clean.
        The first verdict and mirror are retained until superseded by the second
        versions; no first-pass verdict is used by the routing or contraction steps.
        Only Clean from the second pass selects their active extents. The finalize
        step gives the last output version. Weight payloads, weight scales and
        route IDs are not inspected by either check.
        HasLimit=1 when gemm1_clamp_limit is present, otherwise HasLimit=0.
      symbol:
        VerifyWorkers: {meaning: Number of verification shards, binding: 'bind:design.work_schedule::VerifyWorkers'}
        VerifyWidth: {meaning: Consecutive indices in one verification packet, binding: 'bind:design.work_schedule::VerifyWidth'}
        HasMirror: {meaning: Pinned verdict destination presence, binding: 'bind:design.work_schedule::HasMirror'}
        Dirty: {meaning: Predicate failure bit for one verification shard, shape: [], dtype: int32}
        Clean: {meaning: Current verification verdict consumed by every downstream guard, shape: [], dtype: int32,
          retention: keep_value invocation}
        Mirror: {meaning: 'Second verification mirror version, written without a second host poll', shape: [{mirror: HasMirror}],
          dtype: int32, retention: keep_value invocation}
        DirtyFirst: {meaning: Predicate failure bit for one first-pass shard, shape: [], dtype: int32}
        CleanFirst: {meaning: 'First device verdict, superseded before routed guards', shape: [], dtype: int32,
          retention: keep_value invocation}
        MirrorFirst: {meaning: First pinned verdict version observed by the bounded host gate outside capture, shape: [
            {mirror: HasMirror}], dtype: int32, retention: keep_value invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        Let Nvalid=count(V). Counts and Fill are reset to zero on every execution.
        If Clean=1, set the logical active extents M=J=PaddedRows=0; all other
        route-map and packed scratch contents remain unchanged and are not read.
        The following routing expressions are evaluated only when Clean=0.
        For b = 0..ceil_div(R,RouteBatch)-1, Hist(b)[e] counts routes to e among flattened slots
        [RouteBatch*b,RouteBatch*(b+1)),
        clipped to [0,R). Counts[e] = sum_b Hist(b)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        Fill[e] starts at zero. Each route batch reserves its expert counts by
        fetch-and-add on Fill[e]; local ranks assign a bijection rho from V onto
        [0,M), with rho(t,k) in [Offs[e],Offs[e+1]) for e = route_ids[t,k].
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k]. Fill[e] ends at Counts[e].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteBatch: {meaning: Route histogram batch size, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: 'Expert counts for dirty execution, zero after the unconditional reset when clean', shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        Fill: {meaning: Atomic expert reservation counters, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}],
          dtype: int32, retention: keep_value invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}],
          dtype: int32, retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        Nchunk = 9*H/256. When Clean=1, U=0 and no gather is evaluated.
        Evaluate this step only when Clean=0.
        For (t,k) in V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Each token with at least one valid route supplies one logical input
        payload/scale copy, replicated to its valid routes. Let U be the count
        of such tokens. Unused rows of the R-row backing buffers retain old bytes.
        For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8,
          retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K},
            {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        Evaluate this step only when Clean=0.
        BN1 and BK are bound by work_schedule. For each (j,n), n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32,
          retention: 'carry_forward (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}],
          dtype: uint8, retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based
          tanh identity and reciprocal-multiply quantization replace the reference evaluation. unknown: no verified
          uniform error bound for the full declared domain is supplied; source comments and local probes are not
          an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation;
          four such updates make one BK stage. The notation does not assert FP32 products or reference-order bit
          equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        Evaluate this step only when Clean=0.
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}
      arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only
          the reduction extent and output columns change.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        If Clean=1, retain the provisional zero Y from verify without reading
        route maps or route results. Otherwise evaluate the following recurrence.
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol: {Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}}
    ledger:
      baseline: Contract evaluation for the Nvalid input routes, saving decoded FP32 activations, both FC1 outputs
        and Act before QDQ; save the same BF16 route results. Baseline does not pre-zero output or revalidate zero
        payloads.
      matmul: [{item: Expert contractions, change: '3*Nvalid*H*I -> 3*PaddedRows*H*I MAC per invocation; PaddedRows=0
            when clean, otherwise includes discarded padding', by: [verify, fc1_quantize, fc2]}]
      vector:
      - {item: Activation and quantization, change: 'Nvalid*I -> PaddedRows*I activation/quantization channel evaluations;
          dirty execution adds O(R+ceil_div(R,RouteBatch)*E+E+J*log2(E)) routing work', by: [routing, fc1_quantize]}
      - {item: Zero verification, change: 'Add 2*(T*H/2) payload-byte masks, 2*(T*H/16) scale-byte tests, 2*R score
          tests and 2*(2+HasLimit)*E parameter tests per execution', by: [verify]}
      footprint:
      - item: Intermediate materialization
        change: 12*Nvalid*I FP32 FC1/Act bytes -> 9*M*I/16 packed intermediate bytes; add 9*M*H/16 gathered bytes;
          route materialization is 2*M*H bytes. Active extents vanish when clean; existing workspace capacity remains
          allocated
        by: [gather, fc1_quantize, fc2]
      - item: Verification verdict
        change: Materialize two int32 device-verdict versions and two int32 host-mirror versions per invocation,
          with one live slot each because the second replaces the first; reduction protocol metadata is additional
          storage
        by: [verify]
      traffic:
      - {item: Gather, change: 'Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand
          reads', by: [gather]}
      - {item: Verify and provisional output, change: Add 2*(9*T*H/16 + 4*R + 4*(2+HasLimit)*E) logical input bytes
          read; total output writes change from 2*T*H to 2*T*H*(3-Clean) bytes per execution, by: [verify, finalize]}
      error: [{item: Numerical evaluation, change: Dirty execution retains the approximate activation and fixed
            FMA reduction; clean execution directly writes positive BF16 zero. No additional output error bound
            is established, by: [fc1_quantize, finalize]}]
  work_schedule:
    thesis: |-
      Execute the verify-only graph then the full graph on one stream, retaining
      nine compute submissions and the unconditional Counts/Fill reset; first-graph
      completion protects shared output/verdict reuse, and only the second verdict
      guards routed work. PDL separates launch permission from data visibility:
      clean FC1/FC2 exit before their explicit triggers, so grid completion supplies
      launch_ready, while other kernels trigger before guarding; persistent workspace
      and verdict allocations have no added cross-stream exclusion.
    flow:
      launch:
      - {phase: [first_verify], protocol: pdl}
      - {phase: [verify], protocol: pdl, start_after: first_verify.kernel_done}
      - {phase: [count], protocol: pdl, start_after: verify.kernel_done}
      - {phase: [scan], protocol: pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: pdl, start_after: scatter.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, ready: count.kernel_done}
        Offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        TilePrefix: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileExpert: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        TileRow: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        RoutePos: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Clean:
          producer: verify
          consumer: [count, scan, scatter, gather, fc1, fc2, finalize]
          storage: global
          ready: verify.kernel_done
          wait_at: [count.guard_done, scan.guard_done, scatter.guard_done, gather.guard_done, fc1.guard_done, fc2.guard_done,
            finalize.guard_done]
    phase:
      first_verify:
        describe: Independently zero output and fold the first verification verdict.
        decomposition:
          strategy: |-
            VerifyWorkers=min(T,296), VerifyWidth=256 and HasMirror=1.
            This is pass p=0 of math_reshape.verify. One worktile owns shard v of
            every VerifyIndex(v,L) region, traversing VerifyWidth-element packets
            with a VerifyWorkers-packet stride and clipping final packets. The output
            pass precedes payload, scale, score and expert-parameter scans. Each shard
            produces DirtyFirst(v); the last arrival folds CleanFirst and MirrorFirst.
            A persistent four-int device allocation holds the verdict, initially zero
            dirty accumulator, initially zero arrival count and one unused word.
            Both verification submissions use that same allocation and the same
            one-int pinned mirror. The last arrival resets dirty/arrival state; there
            is no additional initialization kernel between passes.
            For a direct graph_replay call, the host first writes -1 to the mirror.
            Outside capture, it polls while the mirror is -1, for at most 200000000
            incremented spin tests, then performs the final decision read. In this
            node that read is not 1, so the full graph is submitted on the same stream.
            This host observation does not establish first_verify.kernel_done.
            Under outer capture the host writes -1 but does not poll: it records both
            graphs. That host store and poll are not replayed GPU work. Each later
            outer replay still executes both verification submissions, regardless
            of the preexisting mirror value.
            The first graph completes before verify starts, protecting all first-pass
            output stores, publications and resets even if the host gate timed out.
            No routed kernel consumes CleanFirst.
          partition: {shard: {size: VerifyWorkers, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [{payload_word: VerifyWidth}, {byte: 4}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{element: VerifyWidth}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{element: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: '8*count(VerifyIndex(shard,T*H/8))'}], dtype: bf16}
              DirtyFirst: {shape: [], dtype: int32}
            tile_reduction: {dimension: shard, input: 'ref:design.math_reshape::DirtyFirst', output: ['ref:design.math_reshape::CleanFirst',
                'ref:design.math_reshape::MirrorFirst'], method: 'ref:design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyWorkers}
        schedule: {worktile_order: [{by: shard, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      verify:
        describe: Overwrite output again and publish the second verdict used by routed guards.
        decomposition:
          strategy: |-
            This is pass p=1 of math_reshape.verify, using VerifyWorkers,
            VerifyWidth and HasMirror from first_verify. Each worktile owns the
            same shard and packet traversal as first_verify, with fresh input reads.
            The output pass precedes payload, scale, score and expert-parameter scans;
            final packets are clipped. Each shard produces Dirty(v); the last arrival
            folds all shards and publishes Clean and Mirror into the same device and
            pinned words used by CleanFirst and MirrorFirst. The first graph is
            complete before these replacements; its output is overwritten in place.
            The dirty accumulator and arrival count begin at the zeros left by the
            first fold and are reset again by this fold. There is no second host poll.
            This pass runs for every execution in this node, regardless of either
            verification verdict; it creates fresh CTA-local worker state.
          partition: {shard: {size: VerifyWorkers, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [{payload_word: VerifyWidth}, {byte: 4}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{element: VerifyWidth}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{element: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: VerifyWidth}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: '8*count(VerifyIndex(shard,T*H/8))'}], dtype: bf16}
              Dirty: {shape: [], dtype: int32}
            tile_reduction: {dimension: shard, input: 'ref:design.math_reshape::Dirty', output: ['ref:design.math_reshape::Clean',
                'ref:design.math_reshape::Mirror'], method: 'ref:design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyWorkers}
        schedule: {worktile_order: [{by: shard, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: Form block histograms and accumulate Counts.
        decomposition:
          strategy: RouteBatch=256. A cudaMemsetAsync service zeros the adjacent E-element Counts and Fill arrays
            before count starts. Each 256-route worktile forms Hist and atomically adds each nonzero expert count;
            the memset repeats on every execution. The service starts after verify.kernel_done and completes before
            count, even when Clean=1; it does not reset any other scratch.
          partition: {route: {size: R*(1-Clean), tile: RouteBatch}}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Hist: {shape: [{expert: E}], dtype: int32}
            tile_reduction: {dimension: route, input: 'ref:design.math_reshape::Hist', output: 'ref:design.math_reshape::Counts',
              method: 'ref:design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(R,RouteBatch)'}
        schedule: {worktile_order: [{by: route, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      scan:
        describe: Joint prefix scans followed by tile-map enumeration.
        decomposition:
          strategy: BM = 128. One worktile scans all E counts and per-expert ceil counts, then enumerates J row
            tiles by binary search of the tile prefixes.
          partition: {active: {size: 1-Clean, tile: 1}}
          worktile:
            invariant:
              Counts: {shape: [{expert: E}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, step: 1}, refill: none, exit: assigned_done}, worktile_order: [
            {by: active, direction: ascending}]}
      scatter:
        describe: Recompute batch histograms, reserve expert intervals and publish both route maps.
        decomposition:
          strategy: Hist is recomputed locally, not transferred from count. A block reserves Hist[e] rows by one
            Fill atomic per nonempty expert and assigns ranks with block-local atomics. Fill's zero initialization
            is the count-stage memset; different blocks may reserve in any order. Map stores are clipped to actual
            routes and RoutePos is -1 for invalid routes.
          partition: {route: {size: R*(1-Clean), tile: RouteBatch}}
          worktile:
            invariant:
              route_ids: {shape: [{route: RouteBatch}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              RoutePos: {shape: [{route: RouteBatch}], dtype: int32}
              PackedToken: {shape: [{route: RouteBatch}], dtype: int32}
              PackedSlot: {shape: [{route: RouteBatch}], dtype: int32}
              PackedExpert: {shape: [{route: RouteBatch}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(R,RouteBatch)'}
        schedule: {worktile_order: [{by: route, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: After a dirty guard, read Offs[E] to detect an empty route set. Worktiles are 128 consecutive
            flattened (token,16-byte-chunk) coordinates, with chunk fastest; a tile can cross token boundaries.
            All work is empty when M=0. Otherwise chunks whose token has no routes are visited without payload reads
            or writes; the final packet is clipped.
          partition: {chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}}
          worktile:
            invariant:
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile:
              GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'min(1184,ceil_div(T*Nchunk,128))'}
        schedule: {worktile_order: [{by: chunk, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: 'BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local
            iterations and four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j); padded
            arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp slice
            is read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI''s row-tile
            upper bound. Let Cap be the cached automatic grid cap: twice the queried SM count, or zero if that query
            failed. For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else
            TileCap). The submitted grid uses G(I/BN1), independent of the current J.'
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(I/BN1)}
        schedule: {worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}],
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only
            valid(j) output rows are stored. All submitted workers remain present when J=0, but their assigned sequences
            are empty.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule: {worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker
            produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are a local reduction,
            not independently assigned work; masked routes do not read the route-result slab.
          partition: {token: {size: T*(1-Clean), tile: 1}, hidden: {size: H, tile: 128*FinalWidth}}
          worktile:
            invariant:
              RoutePos: {shape: [{slot: K}], dtype: int32}
              route_weights: {shape: [{slot: K}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
            iteration:
              RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule: {worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
  tile_pipeline:
    thesis: |-
      Two verification submissions use separate CTA-local state for zero stores,
      predicate scans and last-arrival folds, reusing shared output and verdict
      storage across the first graph's completion boundary. Routed workers guard
      on the second verdict; dirty FC1 uses separate producers, MMA issue and four
      epilogue warps, while flat FC2 streams single-stage items through three payload
      and metadata slots and two scale slots, serializing accumulator reuse with readout.
    phase:
      first_verify:
        resource:
          LocalDirty: {space: register, member_slot_shape: [{lane: VerifyWidth}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  All participating threads wait for predecessor grid completion and
                  visibility; warp 0 then grants dependent-grid launch permission. This
                  grants no data readiness. The entry executes even with no payload work.
                zero: |-
                  Submit zero stores for the shard's output packets, eight BF16
                  values per lane and packet. Done means store submission and consumption
                  of the zero register value; full output visibility is first_verify.kernel_done.
                inspect: |-
                  Initialize each lane's LocalDirty to zero, scan its payload words,
                  scale bytes, scores and expert parameters, and OR failures without early
                  exit. The optional clamp is read only when present. A CTA-wide predicate
                  reduction forms this shard's DirtyFirst; its rendezvous also follows every
                  lane's zero-store submission.
                arrive: |-
                  One elected lane atomically ORs a dirty contribution when nonzero,
                  orders it before its arrival increment with device visibility, and obtains
                  one unique arrival ticket. Nonlast arrivals finish without spinning.
                  The last arrival observes all contributions, writes CleanFirst, then resets
                  the dirty accumulator and arrival count to zero. When HasMirror=1 it
                  establishes system visibility before writing MirrorFirst. Done retires this
                  CTA's contribution; only kernel completion promises the complete verdict,
                  all zero stores and reset state to subsequent device consumers. The other
                  lanes perform no atomic publication, but remain part of this action.
                  Host observation of MirrorFirst is not a device completion event.
            pipe: {prologue: ['enter:Protocol'], steady: ['zero:Y', 'inspect:LocalDirty', 'arrive:Verdict']}
      verify:
        resource:
          LocalDirty: {space: register, member_slot_shape: [{lane: VerifyWidth}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  All participating threads wait for predecessor grid completion and
                  visibility; warp 0 then grants dependent-grid launch permission. This
                  grants no data readiness. The entry executes even with no payload work.
                zero: |-
                  Submit zero stores for the shard's output packets, eight BF16
                  values per lane and packet. Done means store submission and consumption
                  of the zero register value; full output visibility is verify.kernel_done.
                inspect: |-
                  Initialize each lane's LocalDirty to zero, scan its payload words,
                  scale bytes, scores and expert parameters, and OR failures without early
                  exit. The optional clamp is read only when present. A CTA-wide predicate
                  reduction forms this shard's Dirty; its rendezvous also follows every
                  lane's zero-store submission.
                arrive: |-
                  One elected lane atomically ORs a dirty contribution when nonzero,
                  orders it before its arrival increment with device visibility, and obtains
                  one unique arrival ticket. Nonlast arrivals finish without spinning.
                  The last arrival observes all contributions, writes Clean, then resets
                  the dirty accumulator and arrival count to zero. When HasMirror=1 it
                  establishes system visibility before writing Mirror. Done retires this
                  CTA's contribution; only kernel completion promises the complete verdict,
                  all zero stores and reset state to subsequent device consumers. The other
                  lanes perform no atomic publication, but remain part of this action.
            pipe: {prologue: ['enter:Protocol'], steady: ['zero:Y', 'inspect:LocalDirty', 'arrive:Verdict']}
      count:
        resource:
          Hist: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Zero Hist, synchronize the CTA, histogram valid routes, synchronize, then atomically add
                  nonzero Hist entries into Counts.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['enter:Protocol', 'guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady: [{steady: ['produce:Counts']}]
        milestone: {guard_done: ['Main/guard:Clean@done']}
      scan:
        resource:
          PrefixScratch: {space: SMEM, member_slot_shape: [{element: 386}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: PrefixScratch holds 257 tile-prefix entries, two 64-word scan arrays and the tile total.
                  Warp-local scans, the scan of warp totals and CTA rendezvous produce both prefixes. After their
                  publication within the CTA, threads enumerate tile IDs by binary search and write Offs, TilePrefix,
                  TileExpert and TileRow. J=0 still writes prefixes.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['enter:Protocol', 'guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady: [{steady: ['produce:TilePrefix']}]
        milestone: {guard_done: ['Main/guard:Clean@done']}
      scatter:
        resource:
          Reservation: {space: SMEM, member_slot_shape: [{table: 3}, {expert: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Reservation contains batch counts, reserved bases and local ranks. Zero counts/ranks, CTA
                  rendezvous, histogram, rendezvous, reserve intervals from Fill, rendezvous, then assign atomic
                  local ranks and write all four maps defined by routing. No thread exits before the last rendezvous;
                  invalid real routes still write RoutePos=-1.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['enter:Protocol', 'guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady: [{steady: ['produce:RoutePos']}]
        milestone: {guard_done: ['Main/guard:Clean@done']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries,
                  and loads a 16-byte source only if some route is valid. Replicate to those destinations; the same
                  registers hold this chunk through all route stores. No inter-thread exchange.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['enter:Protocol', 'guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady: [{repeat: t, steady: ['produce:GatherChunk(t)']}]
        milestone: {guard_done: ['Main/guard:Clean@done']}
      fc1:
        domain: {t: worktile, i: [0, H/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view:
              C1: {part: {column: [0, 128]}}
              ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                prime: Resolve this worktile's expert and row base. The activation-scale source is GatherS. Load
                  the first stage and, when the local stage count exceeds one, the second into APrefetch. All BM
                  rows are loaded, redirecting padding scales to the first valid row. Prefetch registers are restarted
                  per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy
                  is overwritten without use. Done includes this arrival, not completion of the independent payload/weight-scale
                  loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady:
                - repeat: t
                  prologue: ['enter:Protocol']
                  steady: ['prime:APrefetch(t)', {repeat: 'g[t]', steady: ['publish:AScale(g)']}]
                  epilogue: ['retire:TensorStorage']
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the
                  full-stage transaction count for 32768 payload bytes. Done covers both payload transfers. Payloads
                  use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done
                  is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint
                  two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady: [{repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'],
                    epilogue: ['retire:TensorStorage']}]
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                wait: {execution_mode: serial, meaning: 'Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes
                    after its explicit predecessors; q identifies the optional wait before the first scale copy
                    of a worktile.'}
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of all scale
                  copies; only then does this issuer advance to the MMA action. Done is covered by the following
                  cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1.
                  The first update initializes C1 without reading its old value. The fused 128-column product covers
                  both up and gate. Issue a cumulative completion commit after each stage; done covers scale copies,
                  payload reads and accumulator updates. The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites
                  that scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
                guard:
                  execution_mode: serial
                  meaning: |-
                    Wait for PDL predecessor completion before loading the device Clean
                    verdict. Done supplies this worker's current verdict and selects the
                    bounded run domain; the guard executes even with no assigned payload.
                    It neither reads routed scratch nor allocates TensorStorage.
            pipe:
              prologue: ['guard:Clean']
              steady:
              - repeat: {run: [0, 1-Clean]}
                steady:
                - repeat: t
                  prologue: ['enter:Protocol']
                  steady:
                  - {repeat: {q: [0, 'min(1,t)*(1-Hoist)']}, steady: ['wait:Drain(t,q)']}
                  - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
                  epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]): ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
                  c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue
                  both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register
                  fragment usable.
                emit: Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize
                  ScalePack and retain its first two scale bytes; c=1 adds the last two, stores the full four-byte
                  scale word on valid rows and resets it. Store valid payload bytes for each c. Done means local
                  computation and store submission consumed Fragment; global stores can still be in flight. Invalid
                  rows submit no output stores.
                release: This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases
                  only this warp's accumulator quadrant; MMA reuse waits for all four epilogue roles. This warp
                  immediately continues its final conversion/store tail without waiting for the other epilogue warps
