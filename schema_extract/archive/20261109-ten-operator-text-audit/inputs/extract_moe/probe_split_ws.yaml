meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: probe_split_ws
    parent: split_ws
    when: |-
      Let a be the ABI rebuilt by Model.forward after neither the identity cache
      nor the key cache returns a published ABI. All implementation controls and
      any reused graph follow the frozen default implementation scope.
      Let R=T*K; cfg and cfg2 are the rebuilt FC1/FC2 selections, and zero_ok
      is true only when moe_zero_probe returns 1. Select exactly when this
      rebuild reaches moe_run with cfg=99, cfg2=57, R<32, zero_ok=false,
      a.zflag=a.zflag_host=0, and a.small_thresh=6500; ensure_tables finds
      this device already ready, so this request submits no k_init_tables;
      one k_zero_scan is actually submitted before the main computation.
      The scan may reject the input or the helper may fail after submission;
      a pre-submission allocation/memset failure is outside this node.
      moe_run returns zero through one caller-stream run_pipeline or the
      ordinary full-graph arm of graph_replay. Any private-stream pipeline
      call is capture-only after successful BeginCapture, with no additional
      uncaptured private-stream computation in this request.
      Let h(e) count valid route_ids equal to e at the rebuild's host read,
      and Jbuild=sum_e ceil_div(h(e),128). In this R<32 domain the WS gate
      requires Jbuild*(H/128)*max(1,I/256)>=3072; the same cached histogram
      is nonempty, so the default MEGA gate does not replace cfg/cfg2.
      These host facts remain distinct from the execution-time routing map.
      Workspace lookup may reuse an
      allocation or create one, without changing the six computational launches.
      If an outer graph records the request, only actually executed prefixes
      produce events now; the recorded computation produces events on replay.
      Recorded ABI choices and bindings remain fixed, while each device read
      uses the contents at that execution.
design:
  math_reshape:
    thesis: Scan zero eligibility once while rebuilding the ABI, then retain the full split-K computation when the
      probe is not accepted. Compact routes, form two FP32 FC1 partials and merge/quantize them before packed FC2;
      the probe adds a full weight-scale pass without eliminating any main-path computation in this node.
    rewrite:
    - step: zero_probe
      name: Compute one-time zero eligibility without changing the output
      math: |
        Define a failed payload check for each byte q of hidden_states by
        (q bitwise_and 0x77) != 0; both signs of E2M1 zero pass.
        For each byte s of hidden_states_scale, gemm1_weights_scale and
        gemm2_weights_scale, the failed check is (s bitwise_and 0x7f) = 0x7f.
        For each route_weights, gemm1_alpha, gemm1_beta and enabled
        gemm1_clamp_limit element, the failed check is that it is not finite.
        Let HasClamp=0 when gemm1_clamp_limit is None, otherwise 1.
        Let W1ScaleBytes=E*2*I*(H/Block), W2ScaleBytes=E*H*(I/Block).
        ProbeGroups and the disjoint check sets ProbeSet(b) are bound by
        work_schedule; their union covers every listed check, including
        all weight scales and scores of invalid routes.
        ProbeContribution(b)=int32(1) if any check in ProbeSet(b) fails,
        otherwise int32(0), for b in [0,ProbeGroups).
        ProbeDirty is initialized to int32(0); every nonzero contribution
        sets it to int32(1), giving the logical OR over all contributions.
        ProbeDirty is retained for the host readback.
      symbol:
        ProbeGroups: {meaning: Number of independent probe check groups, binding: 'bind:design.work_schedule::ProbeGroups'}
        ProbeSet: {meaning: Partition of input checks among probe groups, binding: 'bind:design.work_schedule::ProbeSet'}
        ProbeContribution:
          meaning: One group's zero-eligibility failure flag
          shape: []
          dtype: int32
        ProbeDirty:
          meaning: Materialized zero-eligibility failure flag for host readback
          shape: []
          dtype: int32
          retention: keep_value invocation
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        R = T*K. Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist:
          meaning: Expert histogram for one route batch
          shape:
          - {expert: E}
          dtype: int32
        Counts:
          meaning: Current route count per expert
          shape:
          - {expert: E}
          dtype: int32
          retention: keep_value invocation
        Offs:
          meaning: Compact expert row prefix
          shape:
          - {prefix: E+1}
          dtype: int32
          retention: keep_value invocation
        TilePrefix:
          meaning: Prefix of expert row blocks
          shape:
          - {prefix: E+1}
          dtype: int32
          retention: keep_value invocation
        RoutePos:
          meaning: Inverse compact-route map used by finalize
          shape:
          - {token: T}
          - {slot: K}
          dtype: int32
          retention: keep_value invocation
        PackedToken:
          meaning: Compact token index used for direct FC1 input gathering
          shape:
          - {route: M}
          dtype: int32
          retention: keep_value invocation
        PackedSlot:
          meaning: Compact slot index written but not consumed by this path
          shape:
          - {route: M}
          dtype: int32
          retention: keep_value invocation
        PackedExpert:
          meaning: Compact expert index used by the separate activation pass
          shape:
          - {route: M}
          dtype: int32
          retention: keep_value invocation
        TileExpert:
          meaning: Expert for each row block
          shape:
          - {row_tile: J}
          dtype: int32
          retention: keep_value invocation
        TileRow:
          meaning: Expert-local row origin for each row block
          shape:
          - {row_tile: J}
          dtype: int32
          retention: keep_value invocation
    - step: fc1_partial
      name: Two independent joint up and gate contractions
      math: |-
        BN1, BK and SK are bound by work_schedule. For each row tile j,
        intermediate group n in [0,I/BN1), and slice s in [0,SK), let e=TileExpert[j].
        B1 concatenates W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:].
        For valid rows, X1[r,:]=A[PackedToken[base(j)+r],:].
        For each slice, C1(-1)=0 and
        C1(l)=mma32(X1[:,s*H/SK+l*64:s*H/SK+(l+1)*64],
                   B1[:,s*H/SK+l*64:s*H/SK+(l+1)*64]^T,C1(l-1)),
        for l=0..H/(64*SK)-1.
        Save the final C1 up/gate columns into
        Part[s,base(j)+r,n*BN1:(n+1)*BN1] and
        Part[s,base(j)+r,I+n*BN1:I+(n+1)*BN1], only for r<valid(j).
        All BM rows undergo contraction. Padded input rows contain retained,
        unspecified operand bytes; a final partially filled four-row payload group
        duplicates the first valid token in its extra rows, while their scales
        remain unspecified. No padded accumulator is stored.
        Part has an SK-by-R-by-2I backing allocation; its rows [M,R) retain prior
        bytes and have no current route meaning. C1 is local to its slice.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        SK: {meaning: Number of independent FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        C1:
          meaning: Joint up and gate accumulator of one FC1 slice worktile
          shape:
          - {row: BM}
          - {column: 2*BN1}
          dtype: fp32
          retention: carry_forward (j,n,s); l=-1..H/(64*SK)-1
        Part:
          meaning: FP32 slice partials for valid compact routes
          shape:
          - {slice: SK}
          - {route: M}
          - {channel: 2*I}
          dtype: fp32
          retention: keep_value invocation
      arithmetic:
        accumulate: Each 64-channel contraction uses native E2M1 payloads and E4M3 block scales with FP32 accumulation;
          four updates form a BK stage. Slice accumulators start independently, changing the reduction grouping.
          This notation does not assert FP32 products or reference-order bit equality.
    - step: merge_quantize
      name: Merge slices then apply non-folded activation and quantization
      math: |
        For every backing row r in [0,R) and block b in [0,I/Block), read all SK
        up/gate partial vectors before reading the stored compact expert ID.
        On r<M these are Part[:,r,:] and PackedExpert[r]; on r>=M both reads
        use retained backing bytes, without initialization in this invocation.
        Let Qrows={r in [0,R) | the read expert ID is in [0,E)} and Q=count(Qrows).
        Only Qrows proceeds to the following arithmetic and packed stores.
        For channel h=Block*b+c, c in [0,Block), up_partial(s) and gate_partial(s)
        denote the read slice-s entries at h and I+h. Set U(-1)=Vg(-1)=0;
        U(s)=U(s-1)+up_partial(s), Vg(s)=Vg(s-1)+gate_partial(s),
        s=0..SK-1 in ascending slice order, with FP32 addition.
        Take u=U(SK-1), v=Vg(SK-1), and apply Contract's asymmetric clamp
        when enabled for the read expert e.
        Let L=fp32(-1.44269504), ia=rcp_rn(gemm1_alpha[e]),
        ib=rcp_rn(gemm1_beta[e]), where rcp_rn is the correctly rounded FP32 reciprocal.
        Define S(x)=rcp_approx(1+exp2_ftz(x*L)).
        For activation_type=3, a=(v*S(v*gemm1_alpha[e]))*(u+gemm1_beta[e]).
        For type 10, xg=v*ia, xu=u*ib,
        g=gemm1_alpha[e]*fma32(S(xg+xg),2,-1),
        w=gemm1_beta[e]*fma32(S(xu+xu),2,-1), and a=(g*S(v))*w.
        The unused beta reciprocal for type 3 does not enter a.
        Within each 16-channel block, peak=max(abs(a)),
        scale=fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq=a*rcp_rn(max(scale,fp32(1.17549435e-38))).
        Round zq to E2M1 using Contract's RNE/saturation rule; even channels
        occupy low nibbles. For r<M save payload as ActQ and scale as ActS.
        Rows r>=M that pass the expert check undergo the same arithmetic and
        overwrite the corresponding unused ActQ/ActS backing rows; rejected
        rows retain their bytes. No tail value is a valid route result.
        Scale-zero blocks still execute the reciprocal, multiply and conversion.
        The merged FP32 up/gate and activated values are consumed locally.
      symbol:
        U:
          meaning: FP32 up partial sum for one backing row and channel
          shape: []
          dtype: fp32
          retention: carry_forward (r,h); s=-1..SK-1
        Vg:
          meaning: FP32 gate partial sum for one backing row and channel
          shape: []
          dtype: fp32
          retention: carry_forward (r,h); s=-1..SK-1
        ActQ:
          meaning: Packed quantized intermediate payload
          shape:
          - {route: M}
          - {packed_intermediate: I/2}
          dtype: uint8
          retention: keep_value invocation
        ActS:
          meaning: Intermediate quantization scales
          shape:
          - {route: M}
          - {intermediate_block: I/Block}
          dtype: fp8_e4m3fn
          retention: keep_value invocation
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32 and rcp_approx is rcp.approx.f32. Sigmoid-based tanh and reciprocal-multiply
          quantization replace the reference evaluation. The sigmoid arguments preserve the indicated intermediate
          rounding without folded prescales. unknown: no verified uniform output error bound for the declared domain
          is supplied.'
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows read consecutive ActQ backing rows base(j)+r; payload beyond
        R is zero-filled, while their scale row is redirected to base(j).
        In-bounds unused backing bytes are not assumed zero. Padded results are discarded.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2:
          meaning: Accumulator of one FC2 worktile
          shape:
          - {row: BM}
          - {column: BN2}
          dtype: fp32
          retention: carry_forward (j,n); l=-1..I/64-1
        RouteResult:
          meaning: BF16 result for each valid compact route
          shape:
          - {route: M}
          - {hidden: H}
          dtype: bf16
          retention: keep_value invocation
      arithmetic:
        accumulate: Native block-scaled multiplication and accumulation semantics are those of fc1_partial; FC2
          uses one uninterrupted reduction over I.
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol:
        Z:
          meaning: FP32 route accumulator for one output element
          shape: []
          dtype: fp32
          retention: carry_forward (t,h); k=-1..K-1
    ledger:
      baseline: Contract evaluation for M valid routes, materializing both FC1 outputs and the activated FP32 intermediate
        before QDQ, with the same BF16 route results.
      matmul:
      - item: Expert contractions
        change: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including discarded padded rows
        by: [fc1_partial, fc2]
      vector:
      - item: Merge and activation
        change: Add 2*SK*Q*I FP32 additions; M*I -> Q*I activation/quantization channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E))
          routing work per invocation
        by: [routing, merge_quantize]
      - item: Zero eligibility checks
        change: Add T*H/2 payload-byte checks, T*H/Block activation-scale checks, W1ScaleBytes+W2ScaleBytes weight-scale
          checks, and R+(2+HasClamp)*E finiteness checks per rebuilt request
        by: [zero_probe]
      footprint:
      - item: Intermediate materialization
        change: 12*M*I FP32 FC1/Act bytes -> 8*SK*M*I partial bytes plus 9*M*I/16 packed bytes per invocation; no
          gathered input slab; backing capacities use R in place of M
        by: [fc1_partial, merge_quantize]
      - item: Probe verdict
        change: Add one 4-byte scalar until the host readback or helper cleanup; no retained verification buffer
          in the main chain
        by: [zero_probe]
      traffic:
      - item: Partial exchange
        change: 16*M*I FC1 write/read bytes -> 8*SK*(M+R)*I partial write/read bytes per invocation; all R rows
          are read before expert rejection, excluding local activation and packed-output traffic
        by: [fc1_partial, merge_quantize]
      - item: Probe input pass
        change: Add 9*T*H/16+W1ScaleBytes+W2ScaleBytes+4*R+4*(2+HasClamp)*E input bytes per rebuilt request, plus
          O(ProbeGroups) scalar-service bytes; this is logical traffic, not measured DRAM traffic
        by: [zero_probe]
      depth:
      - item: FC1 reduction
        change: H/64 -> H/(64*SK) native accumulator updates per slice followed by SK FP32 merge additions per output
          channel
        by: [fc1_partial, merge_quantize]
      error:
      - item: Numerical evaluation
        change: Split accumulation and approximate non-folded activation change M*I valid channels; auxiliary tail
          arithmetic has no route output; final FMA reduction affects T*H outputs; uniform output error bound is
          not established
        by: [fc1_partial, merge_quantize, finalize]
  work_schedule:
    thesis: 'One ordinary zero-eligibility scan precedes the five-kernel PDL chain: cooperative routing, split FC1,
      merge/activation/quantization, direct-store FC2 and finalize. The rebuild pays host readback and conditional
      allocation services before computation; retained workspace and same-stream ordering provide no cross-stream
      exclusion.'
    flow:
      launch:
      - phase: [probe]
      - phase: [prepare]
        protocol: pdl
        start_after: probe.kernel_done
      - phase: [fc1]
        protocol: pdl
        start_after: prepare.launch_ready
      - phase: [activate]
        protocol: pdl
        start_after: fc1.launch_ready
      - phase: [fc2]
        protocol: pdl
        start_after: activate.launch_ready
      - phase: [finalize]
        protocol: pdl
        start_after: fc2.launch_ready
      handoff:
        Counts:
          producer: prepare
          consumer: [fc1, fc2]
          storage: global
          ready: prepare.kernel_done
        Offs:
          producer: prepare
          consumer: [fc1, fc2]
          storage: global
          ready: prepare.kernel_done
        TilePrefix:
          producer: prepare
          consumer: [fc1, fc2]
          storage: global
          ready: prepare.kernel_done
        TileExpert:
          producer: prepare
          consumer: [fc1, fc2]
          storage: global
          ready: prepare.kernel_done
        TileRow:
          producer: prepare
          consumer: [fc1, fc2]
          storage: global
          ready: prepare.kernel_done
        RoutePos:
          producer: prepare
          consumer: [finalize]
          storage: global
          ready: prepare.kernel_done
        ActQ:
          producer: activate
          consumer: [fc2]
          storage: global
          ready: activate.kernel_done
        ActS:
          producer: activate
          consumer: [fc2]
          storage: global
          ready: activate.kernel_done
        RouteResult:
          producer: fc2
          consumer: [finalize]
          storage: global
          ready: fc2.kernel_done
        PackedToken:
          producer: prepare
          consumer: [fc1]
          storage: global
          ready: prepare.kernel_done
        PackedExpert:
          producer: prepare
          consumer: [activate]
          storage: global
          ready: prepare.kernel_done
        Part:
          producer: fc1
          consumer: [activate]
          storage: global
          ready: fc1.kernel_done
    phase:
      probe:
        describe: Scan zero eligibility into one global verdict, then service the host decision before the main
          chain.
        decomposition:
          strategy: |-
            ProbeGroups=296. ProbeSet(b) contains all payload and activation-scale checks for
            tokens t=b+n*ProbeGroups<T, n>=0. It also contains score checks with flat
            indices 256*b+u+n*(256*ProbeGroups)<R, parameter checks at the same indices
            below E, and weight-scale checks for each four-byte group with index
            256*b+u+n*(256*ProbeGroups)<W1ScaleBytes/4 or W2ScaleBytes/4,
            where 0<=u<256 and n>=0. Each four-byte group covers its four scale bytes.
            These independent index families are traversed locally, not as a Cartesian product.
            All groups are submitted, even when one or more families are empty.
            The global ProbeDirty scalar starts at the zero_probe initial value before
            this launch; each group contributes only a possible write of one. There is
            no array of partial flags and no separate merge kernel.
          partition:
            probe_group: {size: ProbeGroups, tile: 1}
          worktile:
            iteration:
              hidden_states:
                shape:
                - {token: 1}
                - {packed_hidden: H/2}
                dtype: uint8
                direction: ascending
              hidden_states_scale:
                shape:
                - {token: 1}
                - {hidden_block: H/Block}
                dtype: fp8_e4m3fn
                direction: ascending
              route_weights:
                shape:
                - {element: 256}
                dtype: fp32
                direction: ascending
              gemm1_alpha:
                shape:
                - {expert: 256}
                dtype: fp32
                direction: ascending
              gemm1_beta:
                shape:
                - {expert: 256}
                dtype: fp32
                direction: ascending
              gemm1_clamp_limit:
                shape:
                - {expert: 256}
                dtype: fp32
                direction: ascending
              gemm1_weights_scale:
                shape:
                - {byte: 1024}
                dtype: fp8_e4m3fn
                direction: ascending
              gemm2_weights_scale:
                shape:
                - {byte: 1024}
                dtype: fp8_e4m3fn
                direction: ascending
          target:
            single_tile:
              ProbeContribution:
                shape: []
                dtype: int32
            tile_reduction: {dimension: probe_group, input: 'design.math_reshape::ProbeContribution', output: 'design.math_reshape::ProbeDirty',
              method: 'design.math_reshape::zero_probe'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ProbeGroups
        schedule:
          strategy: |-
            Before the probe, contiguous Contract inputs need no copies. The rebuild's
            route_hist reads route_ids to the host at most once, counts valid IDs and
            caches that statistic only for this rebuild's default selection gates.
            ensure_tables is already satisfied. Allocate a fresh four-byte ProbeDirty
            and submit its zero fill on the caller stream before the scan.
            After scan submission, the helper checks the launch status. On success it
            attempts a caller-stream synchronization; only if that succeeds does it
            attempt a four-byte device-to-host copy into a host integer initialized to 1.
            It frees the temporary on every post-submission exit. Launch/synchronization
            errors return -3/-4; the copy status is unchecked. Python accepts only return 1,
            and exceptions retain zero_ok=false. An error is not a completion guarantee.
            The device stream still orders the recorded scan before the main launch.
            After the helper returns, workspace lookup either reuses matching backing
            storage or allocates it and zero-initializes the 2*E Counts/Fill allocation.
            Preparation overwrites all Counts; Fill is unused by this small-route path.
            Other allocations retain unspecified bytes; no initialization of the partial
            or expert-ID tails is inferred. No zflag or pinned verification mirror is allocated.
            Tensor-map construction and ABI publication do not execute the expert computation.
            The five-kernel chain is submitted once, eagerly or by graph replay; successful
            private-stream capture records it without executing a second copy. After a zero
            moe_run status, the published ABI retains its tensor and workspace owners.
            The prefix's copies, fills and allocation services are preserved here without
            inventing implementation-specific computational kernels for those APIs.
            There is no host synchronization of the main chain added by this design.
            The source's concurrent verdict stores and unchecked readback do not establish a reliable probe result on error; zero_ok=false retains the complete main chain.
          worktile_order:
          - {by: probe_group, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: BM=128, RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover
            contiguous, clipped ranges of flattened route slots; these are local subdivisions of one worktile, not
            independent work. Stage all IDs once, form group histograms and their exclusive expert bases, scan expert
            counts and tile counts, then assign local atomic ranks and enumerate J tiles by binary search of TilePrefix.
            This worktile writes all Counts, both E+1 prefixes and every RoutePos; packed maps and tile maps write
            only their used prefixes. No separate count initialization or global reservation-counter update is needed.
          partition: {}
          worktile:
            invariant:
              route_ids:
                shape:
                - {token: T}
                - {slot: K}
                dtype: int32
          target:
            single_tile:
              Counts:
                shape:
                - {expert: E}
                dtype: int32
              Offs:
                shape:
                - {prefix: E+1}
                dtype: int32
              TilePrefix:
                shape:
                - {prefix: E+1}
                dtype: int32
              RoutePos:
                shape:
                - {token: T}
                - {slot: K}
                dtype: int32
              PackedToken:
                shape:
                - {route: M}
                dtype: int32
              PackedSlot:
                shape:
                - {route: M}
                dtype: int32
              PackedExpert:
                shape:
                - {route: M}
                dtype: int32
              TileExpert:
                shape:
                - {row_tile: J}
                dtype: int32
              TileRow:
                shape:
                - {row_tile: J}
                dtype: int32
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 1
        schedule:
          worker_assignment:
            preassigned: {start: 0, count: 1}
            refill: none
            exit: assigned_done
      fc1:
        describe: Contract one hidden-channel slice into raw FP32 up/gate partials.
        decomposition:
          strategy: BN1=64, BK=256, SK=2. One row tile, slice and intermediate column group form a worktile with
            H/(SK*BK) local stages, each containing four 64-channel updates. Slice s spans [s*H/SK,(s+1)*H/SK).
            PackedToken maps valid compact rows directly to hidden_states and hidden_states_scale; clipped padding
            follows fc1_partial. TileCap=ceil_div(R,BM)+min(E,R) is the saved row-tile upper bound. Let Cap be twice
            the queried SM count, or zero if that query failed. For Nx column/slice groups, G(Nx)=Nx*(max(1,floor(Cap/Nx))
            if Cap>0 and Nx*TileCap>Cap else TileCap). Submit G(SK*I/BN1) workers independently of J; when J=0 the
            submitted workers have empty work sequences.
          partition:
            row_tile: {size: J, tile: 1}
            slice: {size: SK, tile: 1}
            intermediate: {size: I, tile: BN1}
          worktile:
            invariant:
              Counts:
                shape:
                - {expert: 1}
                dtype: int32
              Offs:
                shape:
                - {prefix: 1}
                dtype: int32
              TilePrefix:
                shape:
                - {prefix: 1}
                dtype: int32
              TileExpert:
                shape:
                - {row_tile: 1}
                dtype: int32
              TileRow:
                shape:
                - {row_tile: 1}
                dtype: int32
              PackedToken:
                shape:
                - {row: BM}
                dtype: int32
            iteration:
              gemm1_weights:
                shape:
                - {column: 2*BN1}
                - {packed_hidden: BK/2}
                dtype: uint8
                direction: ascending
              gemm1_weights_scale:
                shape:
                - {column: 2*BN1}
                - {hidden_block: BK/Block}
                dtype: fp8_e4m3fn
                direction: ascending
              hidden_states:
                shape:
                - {row: BM}
                - {packed_hidden: BK/2}
                dtype: uint8
                direction: ascending
              hidden_states_scale:
                shape:
                - {row: BM}
                - {hidden_block: BK/Block}
                dtype: fp8_e4m3fn
                direction: ascending
          target:
            single_tile:
              Part:
                shape:
                - {row: BM}
                - {channel: 2*BN1}
                dtype: fp32
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(SK*I/BN1)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: slice, direction: ascending}
          - {by: intermediate, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      activate:
        describe: Merge all slice partials for a packet of quantization blocks and write packed activations.
        decomposition:
          strategy: Flatten (backing row r, intermediate block b) with b fastest into f=r*(I/Block)+b. A worktile
            covers up to 64 consecutive f values; it may span rows. Visit the entire R-row backing domain even when
            M=0. All slice loads precede expert validation; merge_quantize specifies which rows compute and store.
            The Part and PackedExpert handoffs supply their current valid prefixes; auxiliary tail reads use retained
            backing bytes, not a synthesized current route or a zero initializer. Per-block alpha, beta and optional
            clamp inputs are read only after expert validation.
          partition:
            quant_block: {size: R*I/Block, tile: 64}
          worktile:
            invariant:
              Part:
                shape:
                - {slice: SK}
                - {quant_block: 64}
                - {channel: 2*Block}
                dtype: fp32
              PackedExpert:
                shape:
                - {quant_block: 64}
                dtype: int32
              gemm1_alpha:
                shape:
                - {quant_block: 64}
                dtype: fp32
              gemm1_beta:
                shape:
                - {quant_block: 64}
                dtype: fp32
              gemm1_clamp_limit:
                shape:
                - {quant_block: 64}
                dtype: fp32
          target:
            single_tile:
              ActQ:
                shape:
                - {quant_block: 64}
                - {packed_intermediate: Block/2}
                dtype: uint8
              ActS:
                shape:
                - {quant_block: 64}
                dtype: fp8_e4m3fn
            tile_reduction:
              dimension: slice
              input: design.math_reshape::Part
              output: ['design.math_reshape::ActQ', 'design.math_reshape::ActS']
              method: design.math_reshape::merge_quantize
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: ceil_div(R*I/Block,64)
        schedule:
          worktile_order:
          - {by: quant_block, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only
            valid(j) output rows are stored. All submitted workers remain present when J=0, but their assigned sequences
            are empty.
          partition:
            row_tile: {size: J, tile: 1}
            hidden: {size: H, tile: BN2}
          worktile:
            invariant:
              Counts:
                shape:
                - {expert: 1}
                dtype: int32
              Offs:
                shape:
                - {prefix: 1}
                dtype: int32
              TilePrefix:
                shape:
                - {prefix: 1}
                dtype: int32
              TileExpert:
                shape:
                - {row_tile: 1}
                dtype: int32
              TileRow:
                shape:
                - {row_tile: 1}
                dtype: int32
            iteration:
              ActQ:
                shape:
                - {row: BM}
                - {packed_intermediate: BK/2}
                dtype: uint8
                direction: ascending
              ActS:
                shape:
                - {row: BM}
                - {intermediate_block: BK/Block}
                dtype: fp8_e4m3fn
                direction: ascending
              gemm2_weights:
                shape:
                - {column: BN2}
                - {packed_intermediate: BK/2}
                dtype: uint8
                direction: ascending
              gemm2_weights_scale:
                shape:
                - {column: BN2}
                - {intermediate_block: BK/Block}
                dtype: fp8_e4m3fn
                direction: ascending
          target:
            single_tile:
              RouteResult:
                shape:
                - {row: BM}
                - {hidden: BN2}
                dtype: bf16
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: G(H/BN2)
        schedule:
          worktile_order:
          - {by: row_tile, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: assigned_done
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: FinalWidth=4 for T<=128, otherwise 8. One worker produces up to 128*FinalWidth consecutive hidden
            elements of one token. Route slots are a local reduction; masked routes do not read the route-result
            slab.
          partition:
            token: {size: T, tile: 1}
            hidden: {size: H, tile: 128*FinalWidth}
          worktile:
            invariant:
              RoutePos:
                shape:
                - {slot: K}
                dtype: int32
              route_weights:
                shape:
                - {slot: K}
                dtype: fp32
            iteration:
              RouteResult:
                shape:
                - {slot: 1}
                - {hidden: 128*FinalWidth}
                dtype: bf16
                direction: ascending
          target:
            single_tile:
              Y:
                shape:
                - {hidden: 128*FinalWidth}
                dtype: bf16
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: T*ceil_div(H,128*FinalWidth)
        schedule:
          worktile_order:
          - {by: token, direction: ascending}
          - {by: hidden, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: The probe uses one cooperative scan role per CTA and a single host-readable verdict. The main chain
      retains clipped FC1 payload staging with independent scale reuse, and FC2's coupled two-stage reuse plus direct
      four-chunk epilogue; full epilogues release accumulators before next-work scale preparation.
    phase:
      probe:
        resource:
          LocalFlags:
            space: register
            member_slot_shape:
            - {lane: 256}
            dtype: uint32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                produce: |-
                  Initialize every lane's LocalFlags to zero, accumulate the zero_probe
                  checks over the assigned input families, and perform one CTA-wide Boolean OR.
                  Payload checks load four packed bytes together; weight-scale checks load four
                  scale bytes together. Lanes traverse their in-range indices with stride 256
                  within each token or their globally strided family. There is no early exit
                  after a failed check. Each nonzero group has its leader publish one to the
                  already initialized global ProbeDirty; zero groups issue no verdict store.
                  The action completes even for a group without failures. Kernel completion
                  covers all verdict stores; the helper's readback/cleanup is external to this role.
                  LocalFlags dies after the vote. The scalar's lifetime covers the scan's accesses
                  and any attempted host copy, without adding a cross-CTA barrier.
            pipe:
              steady: ['produce:ProbeDirty']
      prepare:
        resource:
          StagedIds:
            space: SMEM
            member_slot_shape:
            - {token: T}
            - {slot: K}
            dtype: int32
            slot_count: 1
            view:
              route_ids: {}
          GroupTable:
            space: SMEM
            member_slot_shape:
            - {group: RouteGroups}
            - {expert: 256}
            dtype: int32
            slot_count: 1
            view:
              Hist(g):
                part:
                  group: [g, g+1]
                  expert: [0, E]
              RankCursor(g):
                part:
                  group: [g, g+1]
                  expert: [0, E]
          Offs:
            space: SMEM
            member_slot_shape:
            - {prefix: 257}
            dtype: int32
            slot_count: 1
          TilePrefix:
            space: SMEM
            member_slot_shape:
            - {prefix: 257}
            dtype: int32
            slot_count: 1
          ScanScratch:
            space: SMEM
            member_slot_shape:
            - {element: 129}
            dtype: int32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Stage every route ID once into StagedIds and zero the full GroupTable, including the unused
                  expert columns. After CTA rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous
                  before expert-wise prefixing replaces Hist with RankCursor, the group-exclusive reservation bases
                  of routing, and writes Counts. Another rendezvous precedes the paired expert scans; ScanScratch
                  holds two 64-word scan arrays and J. Publish Offs and TilePrefix both globally and into their
                  local caches, then rendezvous before scatter and tile enumeration. Each warp advances its own
                  RankCursor by atomics while writing RoutePos and all three packed maps. Enumerate and store TileExpert
                  and TileRow from the cached tile prefix. StagedIds and the prefix caches survive through their
                  last reads; GroupTable is overwritten only after histogram production is complete. M=0 still writes
                  zero Counts/prefixes and RoutePos=-1, with no packed or tile stores.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['produce:RoutePos']
      fc1:
        domain:
          t: worktile
          i: [0, H/(SK*BK)]
          g:
            flatten: [t, i]
          c: [0, 2]
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadB(g): {slot_index: g%3}
          AScale:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              AScale(g): {slot_index: g%2}
          BScale:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              BScale(g): {slot_index: g%2}
          APrefetch:
            space: register
            member_slot_shape:
            - {row: BM}
            - {block: BK/Block}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              APrefetch(t,i): {slot_index: i%2}
          TensorStorage:
            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C1:
                part:
                  column: [0, 128]
              ScaleTM(g):
                part:
                  column: [128+32*(g%2), 160+32*(g%2)]
                dtype: uint8
          Fragment:
            space: register
            member_slot_shape:
            - {row: BM}
            - {column: 64}
            dtype: fp32
            slot_count: 1
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                prime: Resolve the worktile's expert, row base and reduction-slice origin. PackedToken selects hidden_states_scale
                  rows. Load the slice's first stage and, when its stage count exceeds one, the second into APrefetch.
                  Load only rows below valid(j); other register and shared scale rows are not initialized. Prefetch
                  registers restart per worktile.
                publish: Scatter only valid rows of the current APrefetch set into AScale and establish shared-to-async
                  visibility. If a next stage exists in this slice, load it into the other register set before the
                  warp rendezvous and full-stage arrival. Stage 1 is loaded again after priming; that first primed
                  copy is overwritten without use. Padding rows of AScale retain their old bytes. Done includes
                  the arrival, not the independent payload/weight-scale transfers.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady: ['publish:AScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                publish:AScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                load: Using PackedToken, issue ceil_div(valid(j),4) four-row gathers from hidden_states into PayloadA
                  and two contiguous up/gate weight boxes into PayloadB, at this slice's channel offset. In the
                  last partial four-row group, extra payload rows repeat the first valid token; later groups are
                  not fetched or initialized. Arm the full-stage transaction count for (2*BN1+4*ceil_div(valid(j),4))*(BK/2)
                  bytes. Done covers all these payload transfers; payload slots remain independent of scale-slot
                  reuse.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared
                  ABI permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done
                  is their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint
                  two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: g
              prologue: ['enter:Protocol']
              steady: ['load:PayloadPair(g)', 'stage:BScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                load:PayloadPair(g+3): ['MMA/mma:PayloadA(g)@PayloadB(g)']
                stage:BScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: Drain(t,q) completes after the four explicit prior-work accumulator releases. q identifies
                    the one noninitial-work wait; FC1 performs this wait before its first scale copy.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of all scale
                  copies; only then does this issuer advance to the MMA action. Done is covered by the following
                  cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1.
                  The first update initializes C1 without reading its old value. The fused 128-column product covers
                  both up and gate. Issue a cumulative completion commit after each stage; done covers scale copies,
                  payload reads and accumulator updates. The last stage also commits result readiness for the epilogue.
                  Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites
                  that scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - repeat:
                  q: [0, 'min(1,t)']
                steady: ['wait:Drain(t,q)']
              - repeat: g[t]
                steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                prepare:ScaleTM(g): ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']
              reuse:
                wait:Drain(t,q)@done: ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
                  c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue
                  both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register
                  fragment usable.
                emit: Store the 32 up and 32 gate FP32 Fragment values directly into the matching Part slice for
                  valid rows. Padding rows perform the reads but no stores. Done means store submission has consumed
                  Fragment; global stores may still be in flight.
                release: After both chunks have been drained and their raw partial stores submitted, rendezvous
                  this warp and arrive once to release its accumulator quadrant. Next-work scale preparation waits
                  for all four epilogue roles; global partial-store completion is provided by kernel completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)', 'emit:Part(t,1)', 'release:Accumulator(t)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
                  c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue
                  both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register
                  fragment usable.
                emit: Store the 32 up and 32 gate FP32 Fragment values directly into the matching Part slice for
                  valid rows. Padding rows perform the reads but no stores. Done means store submission has consumed
                  Fragment; global stores may still be in flight.
                release: After both chunks have been drained and their raw partial stores submitted, rendezvous
                  this warp and arrive once to release its accumulator quadrant. Next-work scale preparation waits
                  for all four epilogue roles; global partial-store completion is provided by kernel completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)', 'emit:Part(t,1)', 'release:Accumulator(t)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For
                  c=0 or 1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue
                  both reads before waiting, and wait for all their TMEM reads to retire. Done makes this register
                  fragment usable.
                emit: Store the 32 up and 32 gate FP32 Fragment values directly into the matching Part slice for
                  valid rows. Padding rows perform the reads but no stores. Done means store submission has consumed
                  Fragment; global stores may still be in flight.
                release: After both chunks have been drained and their raw partial stores submitted, rendezvous
                  this warp and arrive once to release its accumulator quadrant. Next-work scale preparation waits
                  for all four epilogue roles; global partial-store completion is provided by kernel completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
