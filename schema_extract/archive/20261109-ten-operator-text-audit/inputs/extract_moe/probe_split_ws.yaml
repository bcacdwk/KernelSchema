            space: TMEM
            member_slot_shape:
            - {row: BM}
            - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              C2:
                part:
                  column: [0, 128]
              ScaleTM(g):
                part:
                  column: [128+32*(g%2), 160+32*(g%2)]
                dtype: uint8
          Fragment:
            space: register
            member_slot_shape:
            - {row: BM}
            - {column: 32}
            dtype: fp32
            slot_count: 1
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent work
                  domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous once before entering their independent work loops. A worker with no
                  assigned item still participates.
                prime: Resolve this worktile's expert and row base. Load ActS for the first stage and, when the
                  stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting padding
                  scales to the first valid row. Prefetch registers restart per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility.
                  If a next stage exists in this worktile, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy
                  is overwritten without use. Done includes this arrival, not completion of the independent payload/weight-scale
                  loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                  TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                  or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - prime:APrefetch(t)
              - repeat: g[t]
                steady: ['publish:AScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                publish:AScale(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                load: Stage PayloadA from ActQ and PayloadB from the selected FC2 weights. Arm the full-stage protocol
                  for 32768 bytes; done covers both tensor transfers. Padding payload rows remain consecutive while
                  AProducer redirects their scale rows. The coupled reuse wait gates payload issue and the following
                  weight-scale staging at a two-stage distance, although payload storage has three slots. No weight-payload
                  L2 hint is issued here.
                stage: Copy the prepared FC2 scale image with 16-byte asynchronous copies, four per lane, into BScale.
                  Done includes the copy-completion arrival in the full-stage protocol; no independent scale-prefetch
                  hint.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: g
              prologue: ['enter:Protocol']
              steady: ['load:PayloadPair(g)', 'stage:BScale(g)']
              epilogue: ['retire:TensorStorage']
            waits_for:
              reuse:
                load:PayloadPair(g+2): ['MMA/mma:PayloadA(g)@PayloadB(g)']
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: Execute the PDL entry protocol. If global J=0, perform no local allocation; subsequent
                    work domains are empty. Otherwise warp 0 initializes the shared completion protocol and allocates
                    TensorStorage; all seven warps rendezvous once before entering their independent work loops.
                    A worker with no assigned item still participates.
                wait:
                  execution_mode: serial
                  meaning: Drain(t,q) completes after the four explicit prior-work accumulator releases. q identifies
                    the one noninitial-work wait, before the first scale copy.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into
                  ScaleTM: four scale-copy operations for each operand. Issuance includes submission of all scale
                  copies; only then does this issuer advance to the MMA action. Done is covered by the following
                  cumulative MMA completion.'
                mma: Execute four ordered 64-channel block-scaled updates of C2, with first-update initialization
                  and cumulative stage completion. Done covers preceding scale copies and operand reads; last-stage
                  commit also publishes the result. Same-issuer scale-copy/MMA ordering protects ScaleTM reuse and
                  copy-to-MMA visibility.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For global J=0 this action is a no-op. It does not insert a per-worktile drain
                    or a new global memory fence; kernel completion supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
