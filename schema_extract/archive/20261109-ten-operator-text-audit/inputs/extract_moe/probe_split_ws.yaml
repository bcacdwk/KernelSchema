      finalize:
        resource:
          Accumulator:
            space: register
            member_slot_shape:
            - {hidden: 128*FinalWidth}
            dtype: fp32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: All participating threads wait for predecessor grid completion and visibility; warp 0 then
                  grants dependent-grid launch permission. This grants no data readiness. The entry executes even
                  if this worker has no payload work.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices
                  and scores, initialize Accumulator, then consume valid BF16 route vectors in increasing slot order
                  using finalize's FMA recurrence. Convert and store Y once; no CTA reduction or inter-thread barrier
                  is required. Empty routing still writes zeros.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['produce:Y']
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: Use the source's tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale path, with cumulative
      tcgen05.commit completion and tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: Shared-slot reuse relies on the same issuer ordering scale copies before their MMA consumers, and on
      cumulative operand-read completion.
  - item: ['design.tile_pipeline::fc1', 'design.tile_pipeline::fc2']
    choice: For all epilogue roles, use tcgen05.ld with tcgen05.wait::ld before each final accumulator-release arrival,
      using the issuing warp's hardware quadrant.
    reason: TMEM register reads must retire before accumulator reuse; both contractions release only after all epilogue
      chunks have consumed their register fragments for store submission.
  - item: design.work_schedule::flow
    choice: For prepare, fc1, activate, fc2 and finalize, preserve programmatic-stream-serialization launches and
      griddepcontrol.wait / launch_dependents in eager and recorded execution. The separate probe uses an ordinary
      launch.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.tile_pipeline::fc1.BProducer
    choice: Use tensor-map gather4 with the clipped box count and its matching expect_tx byte count, joining payload
      transactions with both scale producers in the full-stage protocol.
    reason: The consumer readiness event must include every issued payload byte while excluding omitted padding
      boxes; a fixed full-tile transaction count would never complete on clipped work.
