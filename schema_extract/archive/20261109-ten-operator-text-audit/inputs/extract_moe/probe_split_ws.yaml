            waits_for:
              data:
                drain:Fragment(t,0): ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']
      activate:
        resource:
          PartialLoad:
            space: register
            member_slot_shape:
            - {slice: SK}
            - {quant_block: 64}
            - {channel: 2*Block}
            dtype: fp32
            slot_count: 1
          Merged:
            space: register
            member_slot_shape:
            - {quant_block: 64}
            - {channel: 2*Block}
            dtype: fp32
            slot_count: 1
          Activated:
            space: register
            member_slot_shape:
            - {quant_block: 64}
            - {channel: Block}
            dtype: fp32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: All threads wait for predecessor grid completion and visibility; warp 0 grants dependent-grid
                  launch permission. This does not grant data readiness.
                load: Four neighboring threads own each 16-channel quantization block, with four up and four gate
                  channels per thread. For every in-range backing row, load both slice vectors into PartialLoad
                  before the expert-ID test. Out-of-range packet lanes do no reads; unused route rows still load
                  allocated backing bytes. Done means these vectors are available locally.
                produce: Read PackedExpert's backing row and reject out-of-range IDs before any per-expert parameter
                  access. Accepted groups merge the retained slices into Merged in ascending order, then compute
                  merge_quantize into Activated. Four-lane maximum exchange combines all 16 absolute values; paired
                  neighbor exchange assembles packed payload words. Store ActQ and one ActS byte per accepted block,
                  including unused backing rows that pass the check. No cross-block or cross-CTA exchange is needed.
                  Rejected groups perform no arithmetic or stores, but the action still completes. PartialLoad is
                  dead after the merge; Merged is dead after activation; Activated is dead after quantization and
                  store submission.
            pipe:
              prologue: ['enter:Protocol']
              steady: ['load:PartialLoad', 'produce:ActQ']
      fc2:
        domain:
          t: worktile
          i: [0, I/BK]
          g:
            flatten: [t, i]
          c: [0, BN2/32]
        resource:
          PayloadA:
            space: SMEM
            member_slot_shape:
            - {row: BM}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
            view:
              PayloadA(g): {slot_index: g%3}
          PayloadB:
            space: SMEM
            member_slot_shape:
            - {row: 128}
            - {byte: BK/2}
            dtype: uint8
            slot_count: 3
