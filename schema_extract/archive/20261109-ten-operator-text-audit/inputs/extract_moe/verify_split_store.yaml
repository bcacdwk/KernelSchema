meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization
    and BF16 output.
  source: >-
    SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: verify_split_store
    parent: split_store
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg and
      cfg2 select FC1 and FC2, small_thresh is the saved routing preparation
      threshold, and zflag/zflag_host are the device verification state and
      its optional pinned host mirror. All implementation controls and any
      reused graph follow the frozen default implementation scope.
      Let R=T*K. Select exactly when the call reuses a, a.cfg=99, a.cfg2=81,
      a.zflag is nonzero, R<=1536, R<=a.small_thresh, and moe_run returns zero
      through a single caller-stream run_pipeline call or graph_replay's
      ordinary full-graph arm (exec_clean is absent or a.zflag_host is zero).
      Any private-stream run_pipeline in this request is capture-only after a
      successful BeginCapture; there is no extra uncaptured submission.
      This covers eager execution, replay after graph construction, and cache
      hits with this same work. The ABI's earlier zero probe accepted, but the
      current device verdict may be clean or dirty and is not a selection gate.
      The optional host mirror may be present during eager execution or a
      full-graph fallback; this arm does not submit a separate verify-only graph
      or spin on that mirror. Under outer capture, computation and events
      occur only when the recorded request executes. ABI choices and tensor
      bindings are fixed at recording; verification reads current tensor
      contents at execution. Reuse does not repeat the ABI probe, route_hist,
      table initialization or workspace construction.
design:
  math_reshape:
    thesis: >-
      Verify the current zero-input predicate and overwrite output with zero before the full split-store chain. A
      clean verdict avoids route preparation and expert arithmetic and a dirty verdict uses clipped split FC1, separate
      merge/quantization and bulk-store FC2. Verification adds a full input scan and output write.
    rewrite:
    - step: verify
      name: Recheck the zero predicate and provisionally zero output
      math: |
        R=T*K. HasLimit=1 when gemm1_clamp_limit is present, otherwise 0.
        Scan all hidden_states payload bytes b, requiring (b bitand 0x77)=0;
        bitand denotes bitwise AND, so both signed E2M1 zeros are accepted.
        Scan every raw hidden_states_scale byte s, requiring (s bitand 0x7f)!=0x7f.
        Also test every route_weights element and every gemm1_alpha, gemm1_beta
        and present gemm1_clamp_limit element for finiteness. For each group g,
        VerifyDirty(g) is the int32 OR of failed tests on VerifySet(g,L) for each
        input space of length L: payload words contain four bytes, while scales,
        scores and expert parameters use individual elements. Clean=1-OR_g VerifyDirty(g),
        g=0..VerifyGroups-1. There is no short-circuit of the tensor scans.
        Route IDs and weight tensors are not scanned here.
        Independently of Clean, overwrite Y[t,h]=bf16(0) for every output element.
        Retain Clean for every later guard in this invocation. If HostMirror=1,
        write CleanMirror[0]=Clean; otherwise the mirror has zero elements.
        When Clean=1, all following expert computations are bypassed and this
        zero output is final. When Clean=0, finalize overwrites it with the full
        route result. Return the existing one-element output list alias in both cases.
      symbol:
        Clean: {meaning: Device zero-verification verdict, shape: [], dtype: int32, retention: keep_value invocation}
        HostMirror: {meaning: Presence of the saved pinned verdict mirror, binding: 'bind:design.work_schedule::HostMirror'}
        CleanMirror: {meaning: Optional pinned host copy of the current verdict, shape: [{mirror: HostMirror}], dtype: int32,
          retention: keep_value invocation}
        VerifyGroups: {meaning: Number of verification reduction groups, binding: 'bind:design.work_schedule::VerifyGroups'}
        VerifyDirty: {meaning: Local failed-predicate OR for one verification group, shape: [], dtype: int32}
        VerifySet: {meaning: Partition of each verifier input index space, binding: 'bind:design.work_schedule::VerifySet'}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        If Clean=1, use logical active extents M=J=PaddedRows=0 without reading
        or updating any routing workspace. No current route maps are produced.
        Only when Clean=0 perform the following routing computation.
        Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value
            invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value
            invocation}
        RoutePos: {meaning: Inverse compact-route map used by finalize, shape: [{token: T}, {slot: K}], dtype: int32,
          retention: keep_value invocation}
        PackedToken: {meaning: Compact token index used for direct FC1 input gathering, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        PackedExpert: {meaning: Compact expert index used by the separate activation pass, shape: [{route: M}], dtype: int32,
          retention: keep_value invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value
            invocation}
    - step: fc1_partial
      name: Two independent joint up and gate contractions
      math: |-
        Only when Clean=0 perform the following computation; otherwise all
        associated backing storage retains its previous bytes.
        BN1, BK and SK are bound by work_schedule. For each row tile j,
        intermediate group n in [0,I/BN1), and slice s in [0,SK), let e=TileExpert[j].
        B1 concatenates W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:].
        For valid rows, X1[r,:]=A[PackedToken[base(j)+r],:].
        For each slice, C1(-1)=0 and
        C1(l)=mma32(X1[:,s*H/SK+l*64:s*H/SK+(l+1)*64],
                   B1[:,s*H/SK+l*64:s*H/SK+(l+1)*64]^T,C1(l-1)),
        for l=0..H/(64*SK)-1.
        Save the final C1 up/gate columns into
        Part[s,base(j)+r,n*BN1:(n+1)*BN1] and
        Part[s,base(j)+r,I+n*BN1:I+(n+1)*BN1], only for r<valid(j).
        All BM rows undergo contraction. Padded input rows contain retained,
        unspecified operand bytes; a final partially filled four-row payload group
        duplicates the first valid token in its extra rows, while their scales
        remain unspecified. No padded accumulator is stored.
        Part has an SK-by-R-by-2I backing allocation; its rows [M,R) retain prior
        bytes and have no current route meaning. C1 is local to its slice.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        SK: {meaning: Number of independent FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 slice worktile, shape: [{row: BM}, {column: 2*BN1}],
          dtype: fp32, retention: 'carry_forward (j,n,s); l=-1..H/(64*SK)-1'}
        Part: {meaning: FP32 slice partials for valid compact routes, shape: [{slice: SK}, {route: M}, {channel: 2*I}],
          dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: >-
          Each 64-channel contraction uses native E2M1 payloads and E4M3 block scales with FP32 accumulation; four
          updates form a BK stage. Slice accumulators start independently, changing the reduction grouping. This notation
          does not assert FP32 products or reference-order bit equality.
    - step: merge_quantize
      name: Merge slices then apply non-folded activation and quantization
      math: |
        Set Q=0 when Clean=1. Only when Clean=0 perform the following computation; otherwise all
        associated backing storage retains its previous bytes.
        For every backing row r in [0,R) and block b in [0,I/Block), read all SK
        up/gate partial vectors before reading the stored compact expert ID.
        On r<M these are Part[:,r,:] and PackedExpert[r]; on r>=M both reads
        use retained backing bytes, without initialization in this invocation.
        Let Qrows={r in [0,R) | the read expert ID is in [0,E)} and Q=count(Qrows).
        Only Qrows proceeds to the following arithmetic and packed stores.
        For channel h=Block*b+c, c in [0,Block), up_partial(s) and gate_partial(s)
        denote the read slice-s entries at h and I+h. Set U(-1)=Vg(-1)=0;
        U(s)=U(s-1)+up_partial(s), Vg(s)=Vg(s-1)+gate_partial(s),
        s=0..SK-1 in ascending slice order, with FP32 addition.
        Take u=U(SK-1), v=Vg(SK-1), and apply Contract's asymmetric clamp
        when enabled for the read expert e.
        Let L=fp32(-1.44269504), ia=rcp_rn(gemm1_alpha[e]),
        ib=rcp_rn(gemm1_beta[e]), where rcp_rn is the correctly rounded FP32 reciprocal.
        Define S(x)=rcp_approx(1+exp2_ftz(x*L)).
        For activation_type=3, a=(v*S(v*gemm1_alpha[e]))*(u+gemm1_beta[e]).
        For type 10, xg=v*ia, xu=u*ib,
        g=gemm1_alpha[e]*fma32(S(xg+xg),2,-1),
        w=gemm1_beta[e]*fma32(S(xu+xu),2,-1), and a=(g*S(v))*w.
        The unused beta reciprocal for type 3 does not enter a.
        Within each 16-channel block, peak=max(abs(a)),
        scale=fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq=a*rcp_rn(max(scale,fp32(1.17549435e-38))).
        Round zq to E2M1 using Contract's RNE/saturation rule; even channels
        occupy low nibbles. For r<M save payload as ActQ and scale as ActS.
        Rows r>=M that pass the expert check undergo the same arithmetic and
        overwrite the corresponding unused ActQ/ActS backing rows; rejected
        rows retain their bytes. No tail value is a valid route result.
        Scale-zero blocks still execute the reciprocal, multiply and conversion.
        The merged FP32 up/gate and activated values are consumed locally.
      symbol:
        U: {meaning: FP32 up partial sum for one backing row and channel, shape: [], dtype: fp32, retention: 'carry_forward
            (r,h); s=-1..SK-1'}
        Vg: {meaning: FP32 gate partial sum for one backing row and channel, shape: [], dtype: fp32, retention: 'carry_forward
            (r,h); s=-1..SK-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: >-
          exp2_ftz is ex2.approx.ftz.f32 and rcp_approx is rcp.approx.f32. Sigmoid-based tanh and reciprocal-multiply
          quantization replace the reference evaluation. The sigmoid arguments preserve the indicated intermediate
          rounding without folded prescales. unknown: no verified uniform output error bound for the declared domain
          is supplied.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        Only when Clean=0 perform the following computation; otherwise all
        associated backing storage retains its previous bytes.
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows read consecutive ActQ backing rows base(j)+r; payload beyond
        R is zero-filled, while their scale row is redirected to base(j).
        In-bounds unused backing bytes are not assumed zero. Padded results are discarded.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}
      arithmetic: {accumulate: Native block-scaled multiplication and accumulation semantics are those of fc1_partial;
          FC2 uses one uninterrupted reduction over I.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        When Clean=1, retain the zero Y written by verify without reading route
        workspace or scores again. Only when Clean=0 perform the following.
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol: {Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward
            (t,h); k=-1..K-1'}}
    ledger:
      baseline: >-
        Contract evaluation with materialized FP32 FC1/activation intermediates and BF16 route results, without the
        verification scan or preliminary zero output. Existing full-chain comparisons below apply on dirty inputs,
        where M is the compact valid-route count.
      matmul:
      - {item: Expert contractions, change: 'For Clean=0: 3*M*H*I -> 3*PaddedRows*H*I MAC per invocation, including
          discarded padded rows; Clean=1 executes zero expert MACs', by: [fc1_partial, fc2]}
      vector:
      - {item: Verification predicates, change: 'Add O(T*H+R+E) bit/finiteness tests and OR reductions per invocation;
          Clean=1 executes no routing, partial merge, activation or finalize arithmetic', by: [verify]}
      - item: Merge and activation
        change: >-
          For Clean=0: Add 2*SK*Q*I FP32 additions; M*I -> Q*I activation/quantization channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E))
          routing work per invocation
        by: [routing, merge_quantize]
      footprint:
      - item: Intermediate materialization
        change: >-
          For Clean=0: 12*M*I FP32 FC1/Act bytes -> 8*SK*M*I partial bytes plus 9*M*I/16 packed bytes per invocation;
          no gathered input slab; backing capacities use R in place of M
        by: [fc1_partial, merge_quantize]
      traffic:
      - item: Verification scan and zero write
        change: >-
          Add T*H/2 + T*H/Block + 4*R + (8+4*HasLimit)*E input bytes read and 2*T*H output bytes written per invocation,
          plus O(VerifyGroups) flag traffic; Clean=1 performs no full-chain payload traffic
        by: [verify]
      - item: Partial exchange
        change: >-
          For Clean=0: 16*M*I FC1 write/read bytes -> 8*SK*(M+R)*I partial write/read bytes per invocation; all R
          rows are read before expert rejection, excluding local activation and packed-output traffic
        by: [fc1_partial, merge_quantize]
      depth:
      - {item: FC1 reduction, change: 'For Clean=0: H/64 -> H/(64*SK) native accumulator updates per slice followed
          by SK FP32 merge additions per output channel', by: [fc1_partial, merge_quantize]}
      error:
      - item: Numerical evaluation
        change: >-
          For Clean=0: Split accumulation and approximate non-folded activation change M*I valid channels; auxiliary
          tail arithmetic has no route output; final FMA reduction affects T*H outputs; uniform output error bound
          is not established
        by: [fc1_partial, merge_quantize, finalize]
  work_schedule:
    thesis: >-
      Submit six kernels: zero verification, cooperative preparation, split FC1, merge/activation/quantization, bulk-store
      FC2 and finalize. All submissions and completion events remain for either verdict. Dirty execution retains static
      strided GEMM work; clean execution bypasses payload work after the guards. PDL separates launch permission from
      data visibility. Saved workspace and verification flags are reused with same-stream ordering, without cross-stream
      exclusion or a host completion wait.
    flow:
      launch:
      - {phase: [verify], protocol: pdl}
      - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: prepare.launch_ready}
      - {phase: [activate], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: activate.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        Clean:
          producer: verify
          consumer: [prepare, fc1, activate, fc2, finalize]
          storage: global
          ready: verify.kernel_done
          wait_at: [prepare.verdict_ready, fc1.verdict_ready, activate.verdict_ready, fc2.verdict_ready, finalize.verdict_ready]
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [finalize], storage: global, ready: prepare.kernel_done}
        ActQ: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        ActS: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        PackedToken: {producer: prepare, consumer: [fc1], storage: global, ready: prepare.kernel_done}
        PackedExpert: {producer: prepare, consumer: [activate], storage: global, ready: prepare.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
    phase:
      verify:
        describe: Zero caller output, scan current eligibility inputs, and fold local dirty bits into the device and
          optional host verdict.
        decomposition:
          strategy: >-
            VerifyGroups=min(T,296). HostMirror=1 if the saved ABI zflag_host pointer is nonzero, otherwise 0. One
            group g is one worktile. Define VerifySet(g,L)={256*g+u+256*VerifyGroups*v | 0<=u<256, v>=0, index<L}.
            Each input tensor has its own ascending grid-stride loop over this set. Payload uses L=T*H/8 four-byte
            words; scales use T*H/Block elements; scores use R; each parameter uses E. The same output-word indices
            as payload cover eight BF16 output elements each. These loops have different lengths and are not a Cartesian
            product. Every worker publishes its VerifyDirty into a global OR and takes one arrival ticket; the last
            arriving worker writes Clean and CleanMirror and resets both the OR and ticket words. Their initial zeros
            come from ABI publication or the preceding completed verification. No per-request initialization launch
            is added. All tensor regions are clipped to their logical bounds; output target shape is a capacity for
            the strided union, not a contiguous overwrite beyond Y. Absent clamp input is not read. Nonlast workers
            produce their output region and reduction contribution; only the last worker materializes the verdicts.
          partition: {verify_group: {size: VerifyGroups, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [{payload_word: 256}, {byte: 4}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{element: 256}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{element: 256}], dtype: fp32, direction: ascending}
              gemm1_alpha: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_beta: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
              gemm1_clamp_limit: {shape: [{expert: 256}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Y: {shape: [{element: '2048*ceil_div(T*H/8,256*VerifyGroups)'}], dtype: bf16}
              VerifyDirty: {shape: [], dtype: int32}
              Clean: {shape: [], dtype: int32}
              CleanMirror: {shape: [{mirror: HostMirror}], dtype: int32}
            tile_reduction: {dimension: verify_group, input: 'design.math_reshape::VerifyDirty', output: ['design.math_reshape::Clean',
                'design.math_reshape::CleanMirror'], method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyGroups}
        schedule: {worktile_order: [{by: verify_group, direction: ascending}], worker_assignment: {preassigned: {
              start: worker_id, count: 1}, refill: none, exit: assigned_done}}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: >-
            Every submitted worker reads Clean at its guarded entry before any payload access. Clean=1 bypasses all
            payload work and leaves scratch unchanged; the phase and its completion event remain. BM=128, RouteGroups=32
            and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover contiguous, clipped ranges of flattened
            route slots; these are local subdivisions of one worktile, not independent work. Stage all IDs once, form
            group histograms and their exclusive expert bases, scan expert counts and tile counts, then assign local
            atomic ranks and enumerate J tiles by binary search of TilePrefix. This worktile writes all Counts, both
            E+1 prefixes and every RoutePos; packed maps and tile maps write only their used prefixes. No separate
            count initialization or global reservation-counter update is needed.
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}, Clean: {shape: [], dtype: int32}}}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      fc1:
        describe: Contract one hidden-channel slice into raw FP32 up/gate partials.
        decomposition:
          strategy: >-
            Every submitted worker reads Clean at its guarded entry before any payload access. Clean=1 bypasses all
            payload work and leaves scratch unchanged; the phase and its completion event remain. BN1=64, BK=256,
            SK=2. One row tile, slice and intermediate column group form a worktile with H/(SK*BK) local stages, each
            containing four 64-channel updates. Slice s spans [s*H/SK,(s+1)*H/SK). PackedToken maps valid compact
            rows directly to hidden_states and hidden_states_scale; clipped padding follows fc1_partial. TileCap=ceil_div(R,BM)+min(E,R)
            is the saved row-tile upper bound. Let Cap be twice the queried SM count, or zero if that query failed.
            For Nx column/slice groups, G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and Nx*TileCap>Cap else TileCap).
            Submit G(SK*I/BN1) workers independently of J; when J=0 the submitted workers have empty work sequences.
            The logical J=0 on clean input does not require reading retained TilePrefix; the guard exits before that
            read.
          partition: {row_tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              PackedToken: {shape: [{row: BM}], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              hidden_states: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: BM}, {channel: 2*BN1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(SK*I/BN1)}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: slice, direction: ascending}, {by: intermediate,
              direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      activate:
        describe: Merge all slice partials for a packet of quantization blocks and write packed activations.
        decomposition:
          strategy: >-
            Every submitted worker reads Clean at its guarded entry before any payload access. Clean=1 bypasses all
            payload work and leaves scratch unchanged; the phase and its completion event remain. Flatten (backing
            row r, intermediate block b) with b fastest into f=r*(I/Block)+b. A worktile covers up to 64 consecutive
            f values; it may span rows. Visit the entire R-row backing domain even when M=0. All slice loads precede
            expert validation; merge_quantize specifies which rows compute and store. The Part and PackedExpert handoffs
            supply their current valid prefixes; auxiliary tail reads use retained backing bytes, not a synthesized
            current route or a zero initializer. Per-block alpha, beta and optional clamp inputs are read only after
            expert validation.
          partition: {quant_block: {size: R*I/Block, tile: 64}}
          worktile:
            invariant:
              Part: {shape: [{slice: SK}, {quant_block: 64}, {channel: 2*Block}], dtype: fp32}
              PackedExpert: {shape: [{quant_block: 64}], dtype: int32}
              gemm1_alpha: {shape: [{quant_block: 64}], dtype: fp32}
              gemm1_beta: {shape: [{quant_block: 64}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{quant_block: 64}], dtype: fp32}
              Clean: {shape: [], dtype: int32}
          target:
            single_tile: {ActQ: {shape: [{quant_block: 64}, {packed_intermediate: Block/2}], dtype: uint8}, ActS: {
                shape: [{quant_block: 64}], dtype: fp8_e4m3fn}}
            tile_reduction: {dimension: slice, input: 'design.math_reshape::Part', output: ['design.math_reshape::ActQ',
                'design.math_reshape::ActS'], method: 'design.math_reshape::merge_quantize'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(R*I/Block,64)'}
        schedule: {worktile_order: [{by: quant_block, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: >-
            Every submitted worker reads Clean at its guarded entry before any payload access. Clean=1 bypasses all
            payload work and leaves scratch unchanged; the phase and its completion event remain. BN2=128; reuse BM,
            BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only valid(j) output rows are stored.
            All submitted workers remain present when J=0, but their assigned sequences are empty. The logical J=0
            on clean input does not require reading retained TilePrefix; the guard exits before that read.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              Clean: {shape: [], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule: {worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: >-
            Every submitted worker reads Clean at its guarded entry before any payload access. Clean=1 bypasses all
            payload work and leaves scratch unchanged; the phase and its completion event remain. FinalWidth=4 for
            T<=128, otherwise 8. One worker produces up to 128*FinalWidth consecutive hidden elements of one token.
            Route slots are a local reduction; masked routes do not read the route-result slab.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*FinalWidth}}
          worktile:
            invariant: {RoutePos: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32},
              Clean: {shape: [], dtype: int32}}
            iteration: {RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule: {worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}}
  tile_pipeline:
    thesis: >-
      Verification streams output zeros and predicate inputs, then publishes one last-arriver verdict. Guard placement
      preserves the different PDL entry orders of simple kernels and GEMMs. Dirty work retains three payload slots,
      two scale slots, split partial drains and separate quantization; FC2 independently protects accumulator reuse,
      bulk-store source reuse and global completion.
    phase:
      verify:
        resource: {FailureBits: {space: register, member_slot_shape: [{element: 256}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: >-
                  Wait for predecessor grid completion and visibility, then let warp 0 signal dependent-grid launch
                  permission. This also orders reuse after the preceding request's guards; launch permission alone
                  does not expose the new verdict.
                inspect: >-
                  Write this worktile's zero-output region, then scan its independently strided input spaces and accumulate
                  predicate failures in per-thread FailureBits. A CTA-wide OR rendezvous combines these bits into
                  VerifyDirty after all threads have finished their scans and zero-store submissions. No weight or
                  route-ID access is added.
                publish: >-
                  The elected thread contributes a dirty bit with global atomic OR when needed, establishes global
                  ordering, then atomically increments the arrival counter. The last arrival reads the combined dirty
                  word, writes Clean, and resets dirty and arrival words to zero. If HostMirror=1 it establishes system
                  visibility before writing CleanMirror; nonlast workers do not write either final verdict. The saved
                  int32[4] zflag workspace holds Clean, dirty, arrival and one unused word. Publication initially
                  zeroes it; later invocations reuse the last-arrival reset only after prior guards have finished.
                  No worker spins waiting for other verifier CTAs. This action completes each worker's contribution;
                  verify.kernel_done, not one worker's done or launch_ready, exposes the complete output and verdict.
            pipe: {prologue: ['enter:Protocol'], steady: ['inspect:VerifyDirty', 'publish:Clean']}
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1, view: {
              route_ids: {}}}
          GroupTable:
            space: SMEM
            member_slot_shape: [{group: RouteGroups}, {expert: 256}]
            dtype: int32
            slot_count: 1
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g, g+1], expert: [
                    0, E]}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: &id005 >-
                  All threads wait for predecessor grid completion and visibility; warp 0 then grants dependent-grid
                  launch permission. All threads subsequently execute the guard wait and read Clean. On Clean=1, the
                  early exit makes the declared payload actions no-ops: they read or write no payload or scratch,
                  but their modeled issue/done and kernel completion remain. On Clean=0, payload work follows. Launch
                  permission itself supplies no data readiness.
                produce: >-
                  On Clean=1 this action is a no-op with no payload or scratch access. Otherwise: Stage every route
                  ID once into StagedIds and zero the full GroupTable, including the unused expert columns. After
                  CTA rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous before expert-wise
                  prefixing replaces Hist with RankCursor, the group-exclusive reservation bases of routing, and writes
                  Counts. Another rendezvous precedes the paired expert scans; ScanScratch holds two 64-word scan
                  arrays and J. Publish Offs and TilePrefix both globally and into their local caches, then rendezvous
                  before scatter and tile enumeration. Each warp advances its own RankCursor by atomics while writing
                  RoutePos and all three packed maps. Enumerate and store TileExpert and TileRow from the cached tile
                  prefix. StagedIds and the prefix caches survive through their last reads; GroupTable is overwritten
                  only after histogram production is complete. M=0 still writes zero Counts/prefixes and RoutePos=-1,
                  with no packed or tile stores.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:RoutePos']}
        milestone: {verdict_ready: ['Main/enter:Protocol']}
      fc1:
        domain: {t: worktile, i: [0, H/(SK*BK)], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1,
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: &id001 >-
                  First execute the guard wait and read Clean, before any tile-count read, explicit launch trigger,
                  shared protocol initialization or TMEM allocation. On Clean=1 there is no payload work or TMEM allocation;
                  dependent launch permission is supplied by grid completion. On Clean=0 execute the ordinary PDL
                  wait and warp-0 trigger, then read J. If J=0 no local protocol initialization or TMEM allocation
                  occurs. Otherwise warp 0 initializes the shared completion protocol and allocates TensorStorage;
                  all seven warps rendezvous before their independent loops, including workers with empty assigned
                  sequences. The declared entry and terminal no-op actions retain their events.
                prime: >-
                  Resolve the worktile's expert, row base and reduction-slice origin. PackedToken selects hidden_states_scale
                  rows. Load the slice's first stage and, when its stage count exceeds one, the second into APrefetch.
                  Load only rows below valid(j); other register and shared scale rows are not initialized. Prefetch
                  registers restart per worktile.
                publish: >-
                  Scatter only valid rows of the current APrefetch set into AScale and establish shared-to-async visibility.
                  If a next stage exists in this slice, load it into the other register set before the warp rendezvous
                  and full-stage arrival. Stage 1 is loaded again after priming; that first primed copy is overwritten
                  without use. Padding rows of AScale retain their old bytes. Done includes the arrival, not the independent
                  payload/weight-scale transfers.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage.
                  For Clean=1 or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new
                  global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['prime:APrefetch(t)', {repeat: 'g[t]', steady: [
                    'publish:AScale(g)']}], epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter: &id002
                  execution_mode: serial
                  meaning: *id001
                load: >-
                  Using PackedToken, issue ceil_div(valid(j),4) four-row gathers from hidden_states into PayloadA
                  and two contiguous up/gate weight boxes into PayloadB, at this slice's channel offset. In the last
                  partial four-row group, extra payload rows repeat the first valid token; later groups are not fetched
                  or initialized. Arm the full-stage transaction count for (2*BN1+4*ceil_div(valid(j),4))*(BK/2) bytes.
                  Done covers all these payload transfers; payload slots remain independent of scale-slot reuse.
                stage: >-
                  Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared ABI
                  permutation. The lane-permuted 4-byte asynchronous copies collectively stage 2048 bytes. Done is
                  their completion arrival to the full-stage protocol. Also issue an L2-only weight-scale hint two
                  stages ahead when that stage lies in the same worktile; the hint has no consumer or completion edge.
                retire: &id003
                  execution_mode: serial
                  meaning: >-
                    After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates
                    TensorStorage. For Clean=1 or global J=0 this action is a no-op. It does not insert a per-worktile
                    drain or a new global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'], epilogue: [
                'retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter: *id002
                wait:
                  execution_mode: serial
                  meaning: >-
                    Drain(t,q) completes after the four explicit prior-work accumulator releases. q identifies the
                    one noninitial-work wait; FC1 performs this wait before its first scale copy.
                prepare: &id006 >-
                  The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM:
                  four scale-copy operations for each operand. Issuance includes submission of all scale copies; only
                  then does this issuer advance to the MMA action. Done is covered by the following cumulative MMA
                  completion.
                mma: >-
                  Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1. The
                  first update initializes C1 without reading its old value. The fused 128-column product covers both
                  up and gate. Issue a cumulative completion commit after each stage; done covers scale copies, payload
                  reads and accumulator updates. The last stage also commits result readiness for the epilogue. Same-issuer
                  ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites that scale
                  slot, and makes each scale copy visible before the MMA that uses it.
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - {repeat: {q: [0, 'min(1,t)']}, steady: ['wait:Drain(t,q)']}
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse: {'wait:Drain(t,q)@done': ['Epilogue/release:Accumulator(t-1)', 'Epilogue0/release:Accumulator(t-1)',
                  'Epilogue1/release:Accumulator(t-1)', 'Epilogue2/release:Accumulator(t-1)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id004
                enter: *id001
                drain: >-
                  Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For c=0 or
                  1, load the matching 32 up and 32 gate values into this quadrant's rows of Fragment, issue both
                  reads before waiting, and wait for all their TMEM reads to retire. Done makes this register fragment
                  usable.
                emit: >-
                  Store the 32 up and 32 gate FP32 Fragment values directly into the matching Part slice for valid
                  rows. Padding rows perform the reads but no stores. Done means store submission has consumed Fragment;
                  global stores may still be in flight.
                release: >-
                  After both chunks have been drained and their raw partial stores submitted, rendezvous this warp
                  and arrive once to release its accumulator quadrant. Next-work scale preparation waits for all four
                  epilogue roles; global partial-store completion is provided by kernel completion.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage.
                  For Clean=1 or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new
                  global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)',
                'emit:Part(t,1)', 'release:Accumulator(t)'], epilogue: ['retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id004
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)',
                'emit:Part(t,1)', 'release:Accumulator(t)'], epilogue: ['retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id004
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)',
                'emit:Part(t,1)', 'release:Accumulator(t)'], epilogue: ['retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id004
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:Part(t,0)', 'drain:Fragment(t,1)',
                'emit:Part(t,1)', 'release:Accumulator(t)'], epilogue: ['retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
        milestone: {verdict_ready: ['AProducer/enter:Protocol', 'BProducer/enter:Protocol', 'MMA/enter:Protocol',
            'Epilogue/enter:Protocol', 'Epilogue0/enter:Protocol', 'Epilogue1/enter:Protocol', 'Epilogue2/enter:Protocol']}
      activate:
        resource:
          PartialLoad: {space: register, member_slot_shape: [{slice: SK}, {quant_block: 64}, {channel: 2*Block}],
            dtype: fp32, slot_count: 1}
          Merged: {space: register, member_slot_shape: [{quant_block: 64}, {channel: 2*Block}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{quant_block: 64}, {channel: Block}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: *id005
                load: >-
                  On Clean=1 this action is a no-op with no payload or scratch access. Otherwise: Four neighboring
                  threads own each 16-channel quantization block, with four up and four gate channels per thread.
                  For every in-range backing row, load both slice vectors into PartialLoad before the expert-ID test.
                  Out-of-range packet lanes do no reads; unused route rows still load allocated backing bytes. Done
                  means these vectors are available locally.
                produce: >-
                  On Clean=1 this action is a no-op with no payload or scratch access. Otherwise: Read PackedExpert's
                  backing row and reject out-of-range IDs before any per-expert parameter access. Accepted groups
                  merge the retained slices into Merged in ascending order, then compute merge_quantize into Activated.
                  Four-lane maximum exchange combines all 16 absolute values; paired neighbor exchange assembles packed
                  payload words. Store ActQ and one ActS byte per accepted block, including unused backing rows that
                  pass the check. No cross-block or cross-CTA exchange is needed. Rejected groups perform no arithmetic
                  or stores, but the action still completes. PartialLoad is dead after the merge; Merged is dead after
                  activation; Activated is dead after quantization and store submission.
            pipe: {prologue: ['enter:Protocol'], steady: ['load:PartialLoad', 'produce:ActQ']}
        milestone: {verdict_ready: ['Main/enter:Protocol']}
      fc2:
        domain: {t: worktile, i: [0, I/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {
              PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {'APrefetch(t,i)': {slot_index: i%2}}}
          TensorStorage: {space: TMEM, member_slot_shape: [{row: BM}, {column: 256}], dtype: fp32, slot_count: 1,
            view: {C2: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          Sink: {space: SMEM, member_slot_shape: [{quadrant: 4}, {row: 32}, {hidden: 32}], dtype: bf16, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: *id001
                prime: >-
                  Resolve this worktile's expert and row base. Load ActS for the first stage and, when the stage count
                  exceeds one, the second into APrefetch. All BM rows are loaded, redirecting padding scales to the
                  first valid row. Prefetch registers restart per worktile.
                publish: >-
                  Scatter the current APrefetch set into AScale, then establish shared-to-async visibility. If a next
                  stage exists in this worktile, load it into the other register set before the warp rendezvous and
                  full-stage arrival. Thus stage 1 is loaded again after being primed; the first primed copy is overwritten
                  without use. Done includes this arrival, not completion of the independent payload/weight-scale
                  loads.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage.
                  For Clean=1 or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new
                  global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['prime:APrefetch(t)', {repeat: 'g[t]', steady: [
                    'publish:AScale(g)']}], epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter: *id002
                load: >-
                  Stage PayloadA from ActQ and PayloadB from the selected FC2 weights. Arm the full-stage protocol
                  for 32768 bytes; done covers both tensor transfers. Padding payload rows remain consecutive while
                  AProducer redirects their scale rows. No weight-payload L2 hint is issued here.
                stage: >-
                  Copy the prepared FC2 scale image with 16-byte asynchronous copies, four per lane, into BScale.
                  Done includes the copy-completion arrival in the full-stage protocol; no independent scale-prefetch
                  hint.
                retire: *id003
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'], epilogue: [
                'retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': [
                  'MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter: *id002
                wait:
                  execution_mode: serial
                  meaning: >-
                    Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors;
                    q identifies the optional wait before the first scale copy of a worktile.
                prepare: *id006
                mma: >-
                  Execute four ordered 64-channel block-scaled updates of C2, with first-update initialization and
                  cumulative stage completion. Done covers preceding scale copies and operand reads; last-stage commit
                  also publishes the result. Same-issuer scale-copy/MMA ordering protects ScaleTM reuse and copy-to-MMA
                  visibility, including a hoisted first stage of the next worktile.
                retire: *id003
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - {repeat: {q: [0, 'min(1,t)*(1-Hoist)']}, steady: ['wait:Drain(t,q)']}
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done:
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]):
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id007
                enter: *id001
                drain: >-
                  Each warp owns its TMEM quadrant; for c=0 or 1, issue reads of the two adjacent 32-column chunks
                  into its own quadrant's 64-column Fragment, then wait once for both reads to retire. Padding rows
                  are read too.
                release: >-
                  This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases only this
                  warp's accumulator quadrant; MMA reuse waits for all four epilogue roles. This warp immediately
                  continues its final conversion/store tail without waiting for the other epilogue warps or for global
                  output-store completion.
                emit: >-
                  Process the two 32-column chunks in order. A quadrant whose entire 32-row group is valid converts
                  to BF16 and uses its own Sink region: wait until all earlier bulk stores by that warp have finished
                  reading Sink, rendezvous the warp, populate Sink, establish async-proxy visibility, rendezvous,
                  and issue/commit the bulk store. Repeat for the second chunk, reusing that same region. A partial
                  quadrant converts and directly stores only valid rows and never writes Sink. Done covers conversion,
                  Fragment consumption and store submission; it is not a global-completion event. The bulk read wait
                  also protects Sink across worktiles, even when intervening quadrants used direct stores.
                finish: >-
                  Each epilogue warp's issuing lane waits for every outstanding bulk store to complete globally. This
                  runs once after the whole work sequence. It is a no-op for Clean=1 or global J=0; for J>0 it runs
                  even if this worker had no items. It does not wait per worktile.
                retire: >-
                  After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage.
                  For Clean=1 or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new
                  global memory fence; kernel completion supplies the external visibility.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)',
                'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)'], epilogue: ['finish:BulkStores',
                'retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id007
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)',
                'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)'], epilogue: ['finish:BulkStores',
                'retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id007
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)',
                'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)'], epilogue: ['finish:BulkStores',
                'retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id007
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['drain:Fragment(t,0)', 'emit:RouteResult(t,0)',
                'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:RouteResult(t,1)'], epilogue: ['finish:BulkStores',
                'retire:TensorStorage']}
            waits_for: {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
        milestone: {verdict_ready: ['AProducer/enter:Protocol', 'BProducer/enter:Protocol', 'MMA/enter:Protocol',
            'Epilogue/enter:Protocol', 'Epilogue0/enter:Protocol', 'Epilogue1/enter:Protocol', 'Epilogue2/enter:Protocol']}
      finalize:
        resource: {Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *id005
                produce: >-
                  On Clean=1 this action is a no-op with no payload or scratch access. Otherwise: Each thread owns
                  FinalWidth independent output elements. Hoist its eight route indices and scores, initialize Accumulator,
                  then consume valid BF16 route vectors in increasing slot order using finalize's FMA recurrence.
                  Convert and store Y once; no CTA reduction or inter-thread barrier is required. Empty routing still
                  writes zeros.
            pipe: {prologue: ['enter:Protocol'], steady: ['produce:Y']}
        milestone: {verdict_ready: ['Main/enter:Protocol']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: >-
      Use the source's tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and tcgen05.cp scale path, with cumulative
      tcgen05.commit completion and tcgen05.fence::after_thread_sync at the recorded synchronization boundaries.
    reason: Shared-slot reuse relies on the same issuer ordering scale copies before their MMA consumers, and on cumulative
      operand-read completion.
  - item: ['design.tile_pipeline::fc1', 'design.tile_pipeline::fc2']
    choice: For all epilogue roles, use tcgen05.ld with tcgen05.wait::ld before each final accumulator-release arrival,
      using the issuing warp's hardware quadrant.
    reason: TMEM register reads must retire before accumulator reuse; FC1 releases after partial-store submission,
      while FC2 releases before its last conversion/store tail.
  - item: design.tile_pipeline::fc2
    choice: >-
      Bind bulk Sink reuse to cp.async.bulk.wait_group.read 0, its publication to fence.proxy.async.shared::cta, and
      terminal completion to cp.async.bulk.wait_group 0. The output tensor map is a byte view with a 64-byte by 32-row
      box; full quadrants use it and partial quadrants use direct stores.
    reason: Source-read completion permits Sink overwrite but does not make RouteResult globally visible to finalize.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents protocol
      for eager and recorded work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: design.tile_pipeline::fc1.BProducer
    choice: >-
      Use tensor-map gather4 with the clipped box count and its matching expect_tx byte count, joining payload transactions
      with both scale producers in the full-stage protocol.
    reason: >-
      The consumer readiness event must include every issued payload byte while excluding omitted padding boxes; a
      fixed full-tile transaction count would never complete on clipped work.
  - item: design.tile_pipeline::verify.Main
    choice: >-
      Use the global atomicOr / threadfence / atomicAdd last-arriver protocol for the saved dirty and ticket words;
      when present, publish the pinned mirror after threadfence_system.
    reason: >-
      The combined verdict and reset must follow all contributions, the optional mirror requires system visibility,
      and a dependent launch is not a completed verification.
