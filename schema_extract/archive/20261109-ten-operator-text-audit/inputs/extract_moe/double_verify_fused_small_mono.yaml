meta_data:
  name: nvfp4_fused_moe
  describe: Precomputed routed mixture of experts with prepared NVFP4 weights, gated activation, activation requantization and BF16 output.
  source: SchemaExtractSource_c98aa54e58ac@ce1b7d5e8e7560b5c80abd87549bc2328c52df34:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 2
  dispatch:
    id: double_verify_fused_small_mono
    parent: verify_fused_small_mono
    when: |
      Let a be the effective MoEABI passed to moe_run. Reuse means that
      Model.forward's identity/key cache, or its default C call wrapper,
      selects an already published ABI without rebuilding it. In a, cfg
      and cfg2 select FC1 and FC2, small_thresh is the saved routing
      preparation threshold (3000 or 6500 under the default controls), and
      zflag/zflag_host are device verification state and its pinned mirror.
      All implementation controls, including those used to construct a and
      its graphs, follow the frozen default scope. Let p be Params derived
      from a. FC2TMA means that launch_gemm<false> obtains a non-null map
      set from tma_set(p,false,128,0) and selects the cfg2=44 monolithic
      TMA/SFCP kernel; use the recorded selection for recorded work.
      Let R=T*K. Select exactly when the request reuses a, a.cfg=97,
      a.cfg2=44, FC2TMA, a.zflag!=0, a.zflag_host!=0, R<=a.small_thresh,
      and graph_replay successfully submits exec_clean followed by exec
      on the caller stream. The verify-only executable exists, and either
      the caller stream is being captured, or the final host-mirror read
      after polling is not 1. The latter can observe dirty (0) or still
      pending (-1); expiration of the polling limit alone does not select
      this path if the final read has become 1. Both graphs may have been
      constructed on this request or reused from a matching cache entry.
      Every private-stream run_pipeline call in this request, if present,
      is capture-only after successful cudaStreamBeginCapture; there is
      no additional uncaptured pipeline submission on that stream.
      Outer capture records both graphs without polling. The plan's work
      and completion events arise when that recorded request executes,
      with no replay-time host reset or poll. Use the ABI choices and
      tensor bindings fixed at recording, and device contents at execution.
      ABI reuse does not repeat route_hist, table/workspace initialization
      or the ABI zero probe. The pinned mirror implies its construction
      gate T*H>=2^20; neither verification verdict is fixed by that probe.
design:
  math_reshape:
    thesis: |-
      Evaluate zero eligibility twice, overwriting the same output with zero
      each time, before the packed routed computation. Only the second verdict
      controls routing and contractions; the first scan and write remain real
      costs even when the second verdict is clean.
    rewrite:
    - step: verify
      name: Two zero-eligibility evaluations with shared storage versions
      math: |
        Let VerifyParts and VerifyWidth be bound by work_schedule. For
        0<=b<VerifyParts, C(b,N)={x in integers | 0<=x<N and
        floor(x/VerifyWidth) mod VerifyParts=b}. All input indices below
        are flattened row-major indices. Define byte(bv) as its stored
        unsigned byte, and Word(x) as hidden_states bytes [4*x,4*x+4)
        combined into one little-endian uint32, for 0<=x<T*H/8.
        Perform the following evaluation twice, with instance v=0 followed
        by v=1 and fresh input reads for each instance. The local names
        (D_v,Z_v,S_v,C_v,H_v) denote respectively
        (FirstCheck,FirstZeroY,FirstState,FirstClean,FirstHostVerdict) at v=0
        and (Check,ZeroY,ZeroState,Clean,HostVerdict) at v=1.
        D_v[b] is int32(OR of the following predicates in this part):
          (Word(x) bitwise_and 0x77777777) != 0, x in C(b,T*H/8);
          (byte(hidden_states_scale[x]) bitwise_and 0x7f) = 0x7f,
            x in C(b,T*H/16);
          not finite(route_weights[x]), x in C(b,T*K);
          not finite(gemm1_alpha[e]) or not finite(gemm1_beta[e]), e in C(b,E);
          not finite(gemm1_clamp_limit[e]), e in C(b,E), only when non-None.
        An empty OR is false. Independently of these predicates, write
        Z_v[t,h]=bf16(0) to every output element.
        Dirty_v = bitwise_OR_{b=0}^{VerifyParts-1} D_v[b]; C_v=int32(Dirty_v=0).
        S_v denotes the four-word ABI workspace after this evaluation.
        Incoming words 1 and 2 are zero; they hold the accumulated dirty
        bit and arrival count during evaluation. After all parts contribute,
        write word 0=C_v, reset words 1 and 2 to zero, leave word 3 unchanged,
        and write H_v[0]=C_v. C_v is a view of word 0.
        FirstState is the incoming state for the second evaluation, whose
        old word 0 is not read. FirstState/ZeroState and FirstClean/Clean
        are successive versions of the same device storage; likewise
        FirstHostVerdict/HostVerdict share one existing pinned word.
        FirstZeroY, ZeroY and Y alias the caller output: the second zero
        write replaces the first without reading it, then finalize retains
        or overwrites ZeroY according to Clean alone. FirstClean never
        guards the second evaluation or the routed computation.
        These version names introduce no snapshots or additional buffers.
        The scans inspect neither route IDs nor current weight/weight-scale
        bytes. The ABI probe checked weight-scale finiteness; the Contract's
        finite weight-scale domain still applies. Let M0 be the input's
        valid-route count for cost comparison, not a verification result,
        and Lflag=1 for a non-None clamp limit, otherwise 0.
      symbol:
        VerifyParts: {meaning: Number of verification partitions, binding: 'bind:design.work_schedule::VerifyParts'}
        VerifyWidth: {meaning: Contiguous scan chunk width, binding: 'bind:design.work_schedule::VerifyWidth'}
        MirrorWords: {meaning: Number of words in the present ABI pinned verdict mirror, binding: 'bind:design.work_schedule::MirrorWords'}
        FirstCheck: {meaning: First evaluation's per-part dirty predicate without a global partial array, shape: [{part: VerifyParts}], dtype: int32}
        FirstZeroY: {meaning: First zero-write version of the caller output, shape: [{token: T}, {hidden: H}], dtype: bf16, retention: keep_value invocation}
        FirstState: {meaning: Device verification state handed to the second evaluation in the same four-word allocation, shape: [{word: 4}], dtype: int32, retention: keep_value invocation}
        FirstClean: {meaning: First evaluation's verdict in FirstState word 0, shape: [], dtype: int32, retention: keep_value invocation}
        FirstHostVerdict: {meaning: First verdict published to the pinned word used by the host submission gate, shape: [{word: MirrorWords}], dtype: int32, retention: keep_value invocation}
        Check: {meaning: Local dirty predicate for each verification partition; folded without a global partial array, shape: [{part: VerifyParts}],
          dtype: int32}
        ZeroY:
          meaning: Second zero-write version of caller output, aliasing FirstZeroY and Y storage
          shape: [{token: T}, {hidden: H}]
          dtype: bf16
          retention: keep_value invocation
        ZeroState: {meaning: 'ABI verdict and self-resetting reduction state, retained across requests', shape: [{word: 4}], dtype: int32, retention: keep_value
            invocation}
        Clean: {meaning: 'Current clean verdict in ZeroState word 0, consumed by every subsequent kernel', shape: [], dtype: int32, retention: keep_value
            invocation}
        HostVerdict: {meaning: 'Second verdict overwriting FirstHostVerdict in the pinned mirror; not polled by this request', shape: [{word: MirrorWords}],
          dtype: int32, retention: keep_value invocation}
    - step: routing
      name: Compact routes and enumerate expert row blocks
      math: |
        R=T*K. If Clean=1, the active routing extents are V=empty and
        M=J=PaddedRows=0 without reading route IDs or workspace metadata;
        all routing arrays retain their old contents. The following routing
        computation is evaluated only when Clean=0:
        Let V = {(t,k) | 0 <= t < T, 0 <= k < K, route_ids[t,k] >= 0}.
        For g = 0..RouteGroups-1, Hist(g)[e] counts routes to e among flattened slots
        [RouteBatch*g,RouteBatch*(g+1)), clipped to [0,R).
        Counts[e] = sum_g Hist(g)[e]; M = sum_e Counts[e].
        Offs[0] = TilePrefix[0] = 0;
        Offs[e+1] = Offs[e] + Counts[e];
        TilePrefix[e+1] = TilePrefix[e] + ceil_div(Counts[e],BM); J = TilePrefix[E].
        For each group g and expert e, the local reservation cursor starts at
        sum_{a=0}^{g-1} Hist(a)[e]. Each valid slot (t,k) routed to e in group g obtains q
        by fetch-and-add of 1 on that cursor; rho(t,k) = Offs[e]+q.
        Thus groups occupy disjoint expert intervals in ascending group order,
        while ranks within a group follow atomic arrival order. rho is a bijection
        from V onto [0,M), with rho(t,k) in [Offs[e],Offs[e+1]).
        RoutePos[t,k] = rho(t,k) on V and -1 otherwise.
        PackedToken[rho(t,k)] = t; PackedSlot[rho(t,k)] = k;
        PackedExpert[rho(t,k)] = route_ids[t,k].
        For TilePrefix[e] <= j < TilePrefix[e+1],
        TileExpert[j] = e; TileRow[j] = BM*(j-TilePrefix[e]).
        Define base(j) = Offs[TileExpert[j]] + TileRow[j],
        valid(j) = min(BM,Counts[TileExpert[j]]-TileRow[j]), and PaddedRows = BM*J.
        Only the used prefixes of the packed arrays and tile arrays are written.
      symbol:
        RouteGroups: {meaning: Number of contiguous routing groups, binding: 'bind:design.work_schedule::RouteGroups'}
        RouteBatch: {meaning: Contiguous slots per routing group, binding: 'bind:design.work_schedule::RouteBatch'}
        BM: {meaning: Expert row block size, binding: 'bind:design.work_schedule::BM'}
        Hist: {meaning: Expert histogram for one route batch, shape: [{expert: E}], dtype: int32}
        Counts: {meaning: Current route count per expert, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        Offs: {meaning: Compact expert row prefix, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        TilePrefix: {meaning: Prefix of expert row blocks, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        RoutePos: {meaning: Inverse compact-route map used by gather and finalize, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        PackedToken: {meaning: Compact token index written but not loaded by the selected kernels, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        PackedSlot: {meaning: Compact slot index written but not consumed by this path, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        PackedExpert: {meaning: Compact expert index written but not consumed by this path, shape: [{route: M}], dtype: int32, retention: keep_value
            invocation}
        TileExpert: {meaning: Expert for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value invocation}
        TileRow: {meaning: Expert-local row origin for each row block, shape: [{row_tile: J}], dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate packed input into compact route order
      math: |
        For (t,k) in the active V, GatherQ[rho(t,k),:] = hidden_states[t,:] and
        GatherS[rho(t,k),:] = hidden_states_scale[t,:].
        Let U=|{t | there exists k with (t,k) in V}|. Each such token supplies
        one logical input payload/scale copy, replicated to its active routes.
        For Clean=1, U=0 and no gather reads or writes occur. Unused rows of the R-row backing buffers retain old bytes.
        Nchunk = 9*H/256. For f = t*Nchunk+c, SourceChunk[f,:] denotes the
        c-th 16-byte chunk of hidden_states[t,:] followed by the byte encoding
        of hidden_states_scale[t,:]. GatherChunk[f,k,:] denotes its destination
        chunk in GatherQ or GatherS at rho(t,k), only when (t,k) is in V.
        These chunk names are views of the same copies, with no additional storage.
        Decoding valid GatherQ/GatherS rows uses Contract's Decode, A and W1/W2
        definitions; these decoded operands are mathematical views, not saved arrays.
      symbol:
        GatherQ: {meaning: Gathered packed input payload, shape: [{route: M}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value invocation}
        GatherS: {meaning: Gathered input block scales, shape: [{route: M}, {hidden_block: H/Block}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
        SourceChunk: {meaning: Byte view used by the flat gather, shape: [{chunk: T*Nchunk}, {byte: 16}], dtype: uint8}
        GatherChunk: {meaning: Sparse destination view of GatherQ and GatherS, shape: [{chunk: T*Nchunk}, {slot: K}, {byte: 16}], dtype: uint8}
    - step: fc1_quantize
      name: Joint up and gate contraction with fused approximate activation
      math: |
        BN1 and BK are bound by work_schedule. For 0<=j<J and n in [0,I/BN1),
        form the two BN1-column weight groups W1[e,n*BN1:(n+1)*BN1,:] and
        W1[e,I+n*BN1:I+(n+1)*BN1,:], e = TileExpert[j].
        C1(-1) = 0; C1(l) = mma32(X1[:,l*64:(l+1)*64],
        B1[:,l*64:(l+1)*64]^T,C1(l-1)), l = 0..H/64-1.
        B1 is the concatenation of those up and gate groups; X1's valid row r
        is A[PackedToken[base(j)+r],:]. The other BM-valid(j) rows are also
        contracted: their payload comes from consecutive backing-buffer rows
        base(j)+r, while their scale row is redirected to base(j).
        Payload outside the R-row domain is zero-filled; unused in-bounds
        backing bytes remain unspecified, not zeroed.
        For each row and intermediate channel, take u,v from the final C1
        up/gate columns and apply Contract's asymmetric clamp when enabled.
        Let L = fp32(-1.44269504), ia = rcp_rn(gemm1_alpha[e]),
        ib = rcp_rn(gemm1_beta[e]); rcp_rn is a correctly rounded FP32 reciprocal.
        Define S(x,z) = rcp_approx(1 + exp2_ftz(x*z)).
        For activation_type = 3, z = gemm1_alpha[e]*L and
        a = (v*S(v,z))*(u+gemm1_beta[e]).
        For type 10, zg = ia*(2*L), zu = ib*(2*L),
        g = gemm1_alpha[e]*fma32(S(v,zg),2,-1),
        w = gemm1_beta[e]*fma32(S(u,zu),2,-1), and a = (g*S(v,L))*w.
        The unused beta reciprocal for type 3 does not enter a.
        For each 16-channel block, peak = max(abs(a)),
        s = fp8_e4m3fn(min(peak*fp32(1/FP4Max),ScaleMax)),
        zq = a*rcp_rn(max(s,fp32(1.17549435e-38))).
        Round zq to E2M1 by Contract's RNE/saturation rule, packing the even
        channel into the low nibble. Save those bytes as ActQ and s as ActS,
        only for r < valid(j). Scale-zero blocks still evaluate reciprocal,
        multiplication and code conversion; they decode to zero scale.
        Padding rows also execute activation and quantization but are discarded.
        C1 and activated FP32 values are consumed locally, not globally materialized.
      symbol:
        BN1: {meaning: FC1 intermediate columns per worktile, binding: 'bind:design.work_schedule::BN1'}
        BK: {meaning: Reduction channels per staging iteration, binding: 'bind:design.work_schedule::BK'}
        C1: {meaning: Joint up and gate accumulator of one FC1 worktile, shape: [{row: BM}, {column: 2*BN1}], dtype: fp32, retention: 'carry_forward
            (j,n); l=-1..H/64-1'}
        ActQ: {meaning: Packed quantized intermediate payload, shape: [{route: M}, {packed_intermediate: I/2}], dtype: uint8, retention: keep_value
            invocation}
        ActS: {meaning: Intermediate quantization scales, shape: [{route: M}, {intermediate_block: I/Block}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
      arithmetic:
        approx: 'exp2_ftz is ex2.approx.ftz.f32; rcp_approx is rcp.approx.f32. Folded sigmoid arguments, the sigmoid-based tanh identity and reciprocal-multiply
          quantization replace the reference evaluation. unknown: no verified uniform error bound for the full declared domain is supplied; source
          comments and local probes are not an output guarantee.'
        accumulate: Each 64-channel contraction uses native E2M1 inputs and E4M3 block scales with FP32 accumulation; four such updates make one
          BK stage. The notation does not assert FP32 products or reference-order bit equality.
    - step: fc2
      name: Packed intermediate contraction and route materialization
      math: |
        For each row tile j and BN2-column group n in [0,H/BN2),
        X2's valid row r is Decode(ActQ[base(j)+r,:],ActS[base(j)+r,:]);
        B2 = W2[TileExpert[j],n*BN2:(n+1)*BN2,:].
        C2(-1) = 0; C2(l) = mma32(X2[:,l*64:(l+1)*64],
        B2[:,l*64:(l+1)*64]^T,C2(l-1)), l = 0..I/64-1.
        Padded rows use the same payload/scale-row rule as fc1_quantize,
        now with the ActQ/ActS backing buffers, and are discarded after contraction.
        Save RouteResult[base(j)+r,n*BN2:(n+1)*BN2] = bf16(C2(I/64-1)[r,:])
        for r < valid(j). Unused route-result rows retain old contents.
      symbol:
        BN2: {meaning: FC2 output columns per worktile, binding: 'bind:design.work_schedule::BN2'}
        C2: {meaning: Accumulator of one FC2 worktile, shape: [{row: BM}, {column: BN2}], dtype: fp32, retention: 'carry_forward (j,n); l=-1..I/64-1'}
        RouteResult: {meaning: BF16 result for each valid compact route, shape: [{route: M}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Native block-scaled input and accumulation semantics are those of fc1_quantize; only the reduction extent and output
          columns change.}
    - step: finalize
      name: Fixed route-order fused accumulation into caller output
      math: |
        If Clean=1, Y retains the ZeroY bytes written by verification;
        no route metadata, scores or RouteResult are read by this step.
        Otherwise evaluate the following recurrence and overwrite ZeroY:
        For every (t,h), Z(-1) = 0. For k = 0..K-1, if RoutePos[t,k] >= 0,
        Z(k) = fma32(RouteResult[RoutePos[t,k],h],route_weights[t,k],Z(k-1));
        otherwise Z(k) = Z(k-1), without reading RouteResult.
        Y[t,h] = bf16(Z(K-1)). Overwrite the caller output and return its
        existing one-element list alias as required by Contract.
      symbol: {Z: {meaning: FP32 route accumulator for one output element, shape: [], dtype: fp32, retention: 'carry_forward (t,h); k=-1..K-1'}}
    ledger:
      baseline: |-
        Contract evaluation for M0 valid routes, where M0 is the current
        valid-route count before any shortcut, saving decoded FP32 activations,
        both FC1 outputs and Act before QDQ, and the same BF16 route results.
      matmul:
      - item: Expert contractions
        change: 3*M0*H*I -> 3*PaddedRows*H*I MAC per invocation; PaddedRows=0 on clean, including discarded padded rows on dirty
        by: [fc1_quantize, fc2]
      vector:
      - item: Activation and quantization
        change: M0*I -> PaddedRows*I activation/quantization channel evaluations, plus O(R+RouteGroups*E+E+J*log2(E)) routing work only on dirty;
          add twice the T*H/8 payload-word, T*H/16 scale-byte, R score and E parameter checks per invocation
        by: [verify, routing, fc1_quantize]
      footprint:
      - item: Intermediate materialization
        change: 12*M0*I FP32 FC1/Act bytes -> 9*M*I/16 written packed intermediate bytes; add 9*M*H/16 written gathered bytes; written BF16 route
          bytes are 2*M*H. Existing R-row backing allocations persist even when clean; use one 16-byte device state and one 4*MirrorWords-byte pinned mirror shared by both evaluations
        by: [verify, gather, fc1_quantize, fc2]
      traffic:
      - {item: Gather, change: 'Add 9*(U+M)*H/16 logical bytes read/written per invocation, excluding later operand reads', by: [gather]}
      - item: Verification pass
        change: Add 2*(9*T*H/16 + 4*R + (8+4*Lflag)*E) scan bytes and 4*T*H zero-write bytes per invocation; dirty then pays the final output overwrite
        by: [verify]
      error:
      - item: Numerical evaluation
        change: Approximate activation, folded arguments and reciprocal multiplication affect PaddedRows*I channels on dirty; its fixed FMA route
          reduction affects T*H outputs. Clean retains the exact zero write; no uniform dirty-output error bound is established
        by: [fc1_quantize, finalize]
  work_schedule:
    thesis: |-
      Submit a verify-only graph, then a full graph containing a second
      verification and the five guarded computational kernels. The graph
      boundary orders both output writes and reuses the reset device state;
      polling expiration is not a device completion event. Within the full
      graph, PDL launch permission remains separate from data readiness.
      In graph_replay's dual-graph arm, write -1 to the pinned mirror and
      submit the first graph. Outside capture, poll while the word is -1
      for at most 200000000 loop tests; this node includes the full-graph
      submission selected by the final read not being 1. During capture,
      record both graphs without polling. That host reset is not a graph
      node and is not repeated by outer replay. Both verification grids
      always execute in this plan; only the second verdict controls the
      payload work. The seven submitted kernels and their completion
      events remain present even when that verdict is clean.
      Global workspace and verification state persist across requests.
      Same-stream execution orders their device reuse; this path adds
      neither cross-stream exclusion nor a host wait for output completion.
      A later request's host sentinel reset is not ordered by that stream.
    flow:
      launch:
      - {phase: [verify_first], protocol: pdl}
      - {phase: [verify], protocol: pdl, start_after: verify_first.kernel_done}
      - {phase: [prepare], protocol: pdl, start_after: verify.launch_ready}
      - {phase: [gather], protocol: pdl, start_after: prepare.launch_ready}
      - {phase: [fc1], protocol: pdl, start_after: gather.launch_ready}
      - {phase: [fc2], protocol: pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: pdl, start_after: fc2.launch_ready}
      handoff:
        FirstState: {producer: verify_first, consumer: [verify], storage: global, ready: verify_first.kernel_done}
        Clean:
          producer: verify
          consumer: [prepare, gather, fc1, fc2, finalize]
          storage: global
          ready: verify.kernel_done
          wait_at: [prepare.guard_ready, gather.guard_ready, fc1.guard_ready, fc2.guard_ready, finalize.guard_ready]
        Counts: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Offs: {producer: prepare, consumer: [gather, fc1, fc2], storage: global, ready: prepare.kernel_done}
        TilePrefix: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileExpert: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        TileRow: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        RoutePos: {producer: prepare, consumer: [gather, finalize], storage: global, ready: prepare.kernel_done}
        GatherQ: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        GatherS: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        ActQ: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        ActS: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        RouteResult: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      verify_first:
        describe: First verification evaluation, executed by the verify-only graph.
        decomposition:
          strategy: |-
            VerifyParts=min(T,296), VerifyWidth=256 and MirrorWords=1.
            This phase owns verification instance v=0. One worktile owns
            all C(b,N) indices from each independently traversed flat tensor.
            Each tensor is visited in increasing grid-stride chunks; the input
            and output block shapes bound this disjoint chunk union, with each
            range clipped to its own N. No input-dependent short circuit skips
            another tensor's scan. Clamp parameters are read only when non-None.
            For FirstZeroY, N=T*H/8 and each x in C(b,N) selects flattened output
            elements [8*x,8*x+8). All worktiles write these subsets and compute
            FirstCheck[b]. A shared atomic dirty accumulator and arrival ticket fold the parts;
            the last arriving worktile alone writes FirstClean, resets FirstState's
            two reduction words and writes FirstHostVerdict. The other
            worktiles leave those final results untouched. State words 1 and 2
            start at zero from ABI initialization or the preceding completed
            verification; the old verdict is not used in this scan. The first
            mirror publication may satisfy the host's poll, but is not a
            completion guarantee for this grid or for the output.
          partition: {part: {size: VerifyParts, tile: 1}}
          worktile:
            invariant:
              hidden_states: {shape: [{packed_byte: '4*VerifyWidth*ceil_div(T*H/8,VerifyParts*VerifyWidth)'}], dtype: uint8}
              hidden_states_scale: {shape: [{scale_byte: 'VerifyWidth*ceil_div(T*H/16,VerifyParts*VerifyWidth)'}], dtype: fp8_e4m3fn}
              route_weights: {shape: [{route: 'VerifyWidth*ceil_div(R,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_alpha: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
          target:
            single_tile:
              FirstCheck: {shape: [{part: 1}], dtype: int32}
              FirstZeroY: {shape: [{element: '8*VerifyWidth*ceil_div(T*H/8,VerifyParts*VerifyWidth)'}], dtype: bf16}
              FirstClean: {shape: [], dtype: int32}
              FirstState: {shape: [{word: 4}], dtype: int32}
              FirstHostVerdict: {shape: [{word: MirrorWords}], dtype: int32}
            tile_reduction: {dimension: part, input: FirstCheck, output: FirstClean, method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyParts}
        schedule: {worktile_order: [{by: part, direction: ascending}], worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none,
            exit: assigned_done}}
      verify:
        describe: Second verification evaluation at the head of the full graph; its verdict guards the following work.
        decomposition:
          strategy: |-
            Use VerifyParts, VerifyWidth and MirrorWords from verify_first.
            This phase owns verification instance v=1. One worktile owns
            all C(b,N) indices from each independently traversed flat tensor.
            Each tensor is visited in increasing grid-stride chunks; the input
            and output block shapes bound this disjoint chunk union, with each
            range clipped to its own N. No input-dependent short circuit skips
            another tensor's scan. Clamp parameters are read only when non-None.
            For ZeroY, N=T*H/8 and each x in C(b,N) selects flattened output
            elements [8*x,8*x+8). All worktiles write these subsets and compute
            Check[b]. A shared atomic dirty accumulator and arrival ticket fold the parts;
            the last arriving worktile alone writes Clean, resets ZeroState's
            two reduction words and writes HostVerdict. The other
            worktiles leave those final results untouched. State words 1 and 2
            are supplied reset to zero in FirstState by verify_first. Read
            neither its verdict nor its output contents. The first grid's
            kernel_done orders all previous accesses before reusing the same
            device state, pinned word and output; FirstClean cannot skip this
            evaluation. No host polling follows this second publication.
          partition: {part: {size: VerifyParts, tile: 1}}
          worktile:
            invariant:
              FirstState: {shape: [{word: 4}], dtype: int32}
              hidden_states: {shape: [{packed_byte: '4*VerifyWidth*ceil_div(T*H/8,VerifyParts*VerifyWidth)'}], dtype: uint8}
              hidden_states_scale: {shape: [{scale_byte: 'VerifyWidth*ceil_div(T*H/16,VerifyParts*VerifyWidth)'}], dtype: fp8_e4m3fn}
              route_weights: {shape: [{route: 'VerifyWidth*ceil_div(R,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_alpha: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 'VerifyWidth*ceil_div(E,VerifyParts*VerifyWidth)'}], dtype: fp32}
          target:
            single_tile:
              Check: {shape: [{part: 1}], dtype: int32}
              ZeroY: {shape: [{element: '8*VerifyWidth*ceil_div(T*H/8,VerifyParts*VerifyWidth)'}], dtype: bf16}
              Clean: {shape: [], dtype: int32}
              ZeroState: {shape: [{word: 4}], dtype: int32}
              HostVerdict: {shape: [{word: MirrorWords}], dtype: int32}
            tile_reduction: {dimension: part, input: Check, output: Clean, method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: VerifyParts}
        schedule: {worktile_order: [{by: part, direction: ascending}], worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none,
            exit: assigned_done}}
      prepare:
        describe: Count, compact and enumerate all routes within one cooperative worktile.
        decomposition:
          strategy: |-
            Read Clean at the kernel entry before any routing metadata. Clean=1
            leaves this phase's payload work empty without accessing stale metadata;
            all submitted workers and their completion events remain present.
            BM=128, RouteGroups=32 and RouteBatch=32*ceil_div(ceil_div(R,RouteGroups),32). Groups cover
            contiguous, clipped ranges of flattened route slots; these are local subdivisions of one worktile,
            not independent work. Stage all IDs once, form group histograms and their exclusive expert bases,
            scan expert counts and tile counts, then assign local atomic ranks and enumerate J tiles by binary
            search of TilePrefix. This worktile writes all Counts, both E+1 prefixes and every RoutePos; packed
            maps and tile maps write only their used prefixes. No separate count initialization or global
            reservation-counter update is needed.
          partition: {guard: {size: 1-Clean, tile: 1}}
          worktile: {invariant: {Clean: {shape: [], dtype: int32}, route_ids: {shape: [{token: T}, {slot: K}], dtype: int32}}}
          target:
            single_tile:
              Counts: {shape: [{expert: E}], dtype: int32}
              Offs: {shape: [{prefix: E+1}], dtype: int32}
              TilePrefix: {shape: [{prefix: E+1}], dtype: int32}
              RoutePos: {shape: [{token: T}, {slot: K}], dtype: int32}
              PackedToken: {shape: [{route: M}], dtype: int32}
              PackedSlot: {shape: [{route: M}], dtype: int32}
              PackedExpert: {shape: [{route: M}], dtype: int32}
              TileExpert: {shape: [{row_tile: J}], dtype: int32}
              TileRow: {shape: [{row_tile: J}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, step: 1}, refill: none, exit: assigned_done}, worktile_order: [{by: guard, direction: ascending}]}
      gather:
        describe: Load each source byte chunk once and replicate it to the token's valid routes.
        decomposition:
          strategy: |-
            Read Clean at the kernel entry before any routing metadata. Clean=1
            leaves this phase's payload work empty without accessing stale metadata;
            all submitted workers and their completion events remain present.
            Read Offs[E] to detect an empty route set. Worktiles are 128 consecutive flattened
            (token,16-byte-chunk) coordinates, with chunk fastest; a tile can cross token boundaries. All work
            is empty when M=0. Otherwise chunks whose token has no routes are visited without payload reads or
            writes; the final packet is clipped.
          partition: {chunk: {size: 'T*Nchunk*min(1,M)', tile: 128}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              SourceChunk: {shape: [{chunk: 128}, {byte: 16}], dtype: uint8}
              RoutePos: {shape: [{chunk: 128}, {slot: K}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
          target: {single_tile: {GatherChunk: {shape: [{chunk: 128}, {slot: K}, {byte: 16}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'min(1184,ceil_div(T*Nchunk,128))'}
        schedule:
          worktile_order: [{by: chunk, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc1:
        describe: Joint up/gate contraction and fused activation plus packed quantization.
        decomposition:
          strategy: |-
            Read Clean at the kernel entry before any routing metadata. Clean=1
            leaves this phase's payload work empty without accessing stale metadata;
            all submitted workers and their completion events remain present.
            BN1=64, BK=256; each row tile and intermediate column group is one worktile, with H/BK local
            iterations and four 64-channel updates per iteration. Valid rows are base(j)..base(j)+valid(j);
            padded arithmetic follows fc1_quantize. Metadata selects one expert and remains invariant; the clamp
            slice is read only when gemm1_clamp_limit is not None. TileCap=ceil_div(R,BM)+min(E,R) is the ABI's
            row-tile upper bound. Let Cap be the cached automatic grid cap: twice the queried SM count, or zero
            if that query failed. For Nx column groups define G(Nx)=Nx*(max(1,floor(Cap/Nx)) if Cap>0 and
            Nx*TileCap>Cap else TileCap). The submitted grid uses G(I/BN1), independent of the current J.
          partition: {row_tile: {size: J, tile: 1}, intermediate: {size: I, tile: BN1}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
              gemm1_alpha: {shape: [{expert: 1}], dtype: fp32}
              gemm1_beta: {shape: [{expert: 1}], dtype: fp32}
              gemm1_clamp_limit: {shape: [{expert: 1}], dtype: fp32}
            iteration:
              GatherQ: {shape: [{row: BM}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              GatherS: {shape: [{row: BM}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{column: 2*BN1}, {packed_hidden: BK/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{column: 2*BN1}, {hidden_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BN1/2}], dtype: uint8}
              ActS: {shape: [{row: BM}, {intermediate_block: BN1/Block}], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(I/BN1)}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: intermediate, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: Packed FC2 contraction with BF16 materialization in compact route order.
        decomposition:
          strategy: |-
            Read Clean at the kernel entry before any routing metadata. Clean=1
            leaves this phase's payload work empty without accessing stale metadata;
            all submitted workers and their completion events remain present.
            BN2=128; reuse BM, BK, TileCap and G from fc1. Each worktile traverses I/BK local stages. Only
            valid(j) output rows are stored. All submitted workers remain present when J=0, but their assigned
            sequences are empty.
          partition: {row_tile: {size: J, tile: 1}, hidden: {size: H, tile: BN2}}
          worktile:
            invariant:
              Clean: {shape: [], dtype: int32}
              Counts: {shape: [{expert: 1}], dtype: int32}
              Offs: {shape: [{prefix: 1}], dtype: int32}
              TilePrefix: {shape: [{prefix: 1}], dtype: int32}
              TileExpert: {shape: [{row_tile: 1}], dtype: int32}
              TileRow: {shape: [{row_tile: 1}], dtype: int32}
            iteration:
              ActQ: {shape: [{row: BM}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              ActS: {shape: [{row: BM}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{column: BN2}, {packed_intermediate: BK/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{column: BN2}, {intermediate_block: BK/Block}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {RouteResult: {shape: [{row: BM}, {hidden: BN2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: G(H/BN2)}
        schedule:
          worktile_order: [{by: row_tile, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Gather BF16 route results and execute the fixed K-slot FP32 FMA chain.
        decomposition:
          strategy: |-
            Read Clean at the kernel entry before any routing metadata. Clean=1
            leaves this phase's payload work empty without accessing stale metadata;
            all submitted workers and their completion events remain present.
            FinalWidth=16 if 2*R*H >= 40*2^20 bytes, else FinalWidth=8 in this node's T range. One worker
            produces up to 128*FinalWidth consecutive hidden elements of one token. Route slots are a local
            reduction, not independently assigned work; masked routes do not read the route-result slab.
          partition: {token: {size: T*(1-Clean), tile: 1}, hidden: {size: H, tile: 128*FinalWidth}}
          worktile:
            invariant: {Clean: {shape: [], dtype: int32}, RoutePos: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {RouteResult: {shape: [{slot: 1}, {hidden: 128*FinalWidth}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*FinalWidth}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*FinalWidth)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      Two distinct verification grids stream the same zero write and scans,
      each folding its own verdict through a self-resetting last-arrival
      protocol. They have separate worker-local accumulators and share the
      ABI state, pinned mirror and output across the ordered graph boundary.
      Only the second verdict feeds the five downstream entry guards.
      Dirty work retains FC1's separate producers and early accumulator
      release, and FC2's four-warp monolithic TMA/SFCP loop. Clean work
      retains entry and kernel events without using operand rings or TMEM.
    phase:
      verify_first:
        resource: {DirtyAccumulator: {space: register, member_slot_shape: [{element: 256}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  All threads wait for predecessor-grid completion and visibility;
                  warp 0 grants dependent-grid launch permission before the scans.
                  The current verdict is not read and no old output value participates.
                scan: |-
                  Each thread initializes its DirtyAccumulator word to zero, submits
                  its strided 16-byte FirstZeroY stores, and accumulates dirty bits over
                  its assigned payload words, scale bytes, scores and parameters.
                  All threads participate in the CTA OR vote after the independent
                  scans, producing FirstCheck for this worktile. Done covers the vote and
                  zero-store submission; it does not claim global output completion.
                publish: |-
                  Thread 0 atomically ORs the shared global dirty word when FirstCheck is
                  nonzero, establishes device visibility, and atomically increments
                  the arrival word. The last ticket holder reads the accumulated dirty
                  word, writes FirstClean, then resets both reduction words for the next
                  verification. Establish system visibility before storing
                  FirstHostVerdict; this is not an output-completion signal.
                  Other ticket holders do not publish the final verdict. This protocol does not spin or require all CTAs to be
                  resident together. Kernel completion covers every zero store and
                  state update. The following graph starts after this kernel_done,
                  so the second verification reuses fully reset FirstState and may
                  overwrite FirstZeroY and FirstHostVerdict. A host timeout creates
                  no completion event and permits no concurrent device reuse.
                  This phase's DirtyAccumulator is worker-local; the next kernel
                  establishes independent worker and register-resource instances.
            pipe: {prologue: ['enter:Protocol'], steady: ['scan:FirstCheck', 'publish:FirstClean']}
      verify:
        resource: {DirtyAccumulator: {space: register, member_slot_shape: [{element: 256}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  All threads wait for predecessor-grid completion and visibility;
                  warp 0 grants dependent-grid launch permission before the scans.
                  The current verdict is not read and no old output value participates.
                scan: |-
                  Each thread initializes its DirtyAccumulator word to zero, submits
                  its strided 16-byte ZeroY stores, and accumulates dirty bits over
                  its assigned payload words, scale bytes, scores and parameters.
                  All threads participate in the CTA OR vote after the independent
                  scans, producing Check for this worktile. Done covers the vote and
                  zero-store submission; it does not claim global output completion.
                publish: |-
                  Thread 0 atomically ORs the shared global dirty word when Check is
                  nonzero, establishes device visibility, and atomically increments
                  the arrival word. The last ticket holder reads the accumulated dirty
                  word, writes Clean, then resets both reduction words for the next
                  verification. Establish system visibility before overwriting
                  the pinned word with HostVerdict; no host poll follows it.
                  Other ticket holders do not publish the final verdict. This protocol does not spin or require all CTAs to be
                  resident together. Kernel completion covers every zero store and
                  state update; downstream guards wait for that full completion.
                  ZeroState remains available to downstream guards; same-stream
                  kernel order protects its next device use. HostVerdict has no
                  downstream device consumer here; a later graph_replay may reset
                  the pinned word from the host without waiting for this request
                  to complete. Publication consumes
                  FirstState's reset reduction words under the graph-boundary
                  dependency, without reading FirstClean or FirstZeroY.
            pipe: {prologue: ['enter:Protocol'], steady: ['scan:Check', 'publish:Clean']}
      prepare:
        resource:
          StagedIds: {space: SMEM, member_slot_shape: [{token: T}, {slot: K}], dtype: int32, slot_count: 1, view: {route_ids: {}}}
          GroupTable:
            space: SMEM
            member_slot_shape: [{group: RouteGroups}, {expert: 256}]
            dtype: int32
            slot_count: 1
            view: {Hist(g): {part: {group: [g, g+1], expert: [0, E]}}, RankCursor(g): {part: {group: [g, g+1], expert: [0, E]}}}
          Offs: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          TilePrefix: {space: SMEM, member_slot_shape: [{prefix: 257}], dtype: int32, slot_count: 1}
          ScanScratch: {space: SMEM, member_slot_shape: [{element: 129}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: |-
                  All threads wait for predecessor-grid completion and visibility;
                  warp 0 grants dependent-grid launch permission. Then all threads
                  repeat the predecessor wait and read Clean. On Clean=1 this entry
                  completes without reading routing metadata; the payload work
                  domain is empty. Entry and kernel completion events still occur.
                produce: Stage every route ID once into StagedIds and zero the full GroupTable, including the unused expert columns. After CTA
                  rendezvous, warp g forms Hist(g) for its contiguous route group. Rendezvous before expert-wise prefixing replaces Hist with
                  RankCursor, the group-exclusive reservation bases of routing, and writes Counts. Another rendezvous precedes the paired expert
                  scans; ScanScratch holds two 64-word scan arrays and J. Publish Offs and TilePrefix both globally and into their local caches,
                  then rendezvous before scatter and tile enumeration. Each warp advances its own RankCursor by atomics while writing RoutePos
                  and all three packed maps. Enumerate and store TileExpert and TileRow from the cached tile prefix. StagedIds and the prefix
                  caches survive through their last reads; GroupTable is overwritten only after histogram production is complete. M=0 still writes
                  zero Counts/prefixes and RoutePos=-1, with no packed or tile stores.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:RoutePos(t)']}
        milestone: {guard_ready: ['Main/enter:Protocol']}
        domain: {t: worktile}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  All threads wait for predecessor-grid completion and visibility;
                  warp 0 grants dependent-grid launch permission. Then all threads
                  repeat the predecessor wait and read Clean. On Clean=1 this entry
                  completes without reading routing metadata; the payload work
                  domain is empty. Entry and kernel completion events still occur.
                produce: Each of the 128 threads handles one SourceChunk, reads its token's eight RoutePos entries, and loads a 16-byte source
                  only if some route is valid. Replicate to those destinations; the same registers hold this chunk through all route stores. No
                  inter-thread exchange.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:GatherChunk(t)']}
        milestone: {guard_ready: ['Main/enter:Protocol']}
      fc1:
        domain: {t: worktile, i: [0, H/BK], g: {flatten: [t, i]}, c: [0, 2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: 128}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2, view: {AScale(g): {slot_index: g%2}}}
          BScale: {space: SMEM, member_slot_shape: [{row: 128}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2, view: {BScale(g): {slot_index: g%2}}}
          APrefetch: {space: register, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 2, view: {'APrefetch(t,i)': {
                slot_index: i%2}}}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view: {C1: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%2), 160+32*(g%2)]}, dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 64}], dtype: fp32, slot_count: 1}
          ScalePack: {space: register, member_slot_shape: [{row: BM}, {block: 4}], dtype: uint8, slot_count: 1}
        role:
          AProducer:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  First wait for predecessor-grid completion and read Clean. Clean=1
                  completes this entry without an explicit launch trigger, J read or
                  local allocation; launch_ready is then supplied by kernel completion.
                  Otherwise execute the PDL wait/trigger pair, then read global J.
                  For J=0 perform no local allocation and leave work domains empty.
                  For J>0 warp 0 initializes completion state and allocates TensorStorage;
                  all seven warps rendezvous before their independent work loops,
                  including workers with no assigned item. Ring positions persist
                  across the worker's worktiles.
                prime: Resolve this worktile's expert and row base. The activation-scale source is GatherS. Load the first
                  stage and, when the local stage count exceeds one, the second into APrefetch. All BM rows are loaded, redirecting padding scales
                  to the first valid row. Prefetch registers are restarted per worktile.
                publish: Scatter the current APrefetch set into AScale, then establish shared-to-async visibility. If a next stage exists in this
                  worktile, load it into the other register set before the warp rendezvous and full-stage arrival. Thus stage 1 is loaded again
                  after being primed; the first primed copy is overwritten without use. Done includes this arrival, not completion of the independent
                  payload/weight-scale loads.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage. For Clean=1
                  or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new global memory fence; kernel completion
                  supplies the external visibility.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['prime:APrefetch(t)', {repeat: 'g[t]', steady: ['publish:AScale(g)']}], epilogue: [
                'retire:TensorStorage']}
            waits_for: {reuse: {'publish:AScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          BProducer:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                enter:
                  execution_mode: serial
                  meaning: |-
                    First wait for predecessor-grid completion and read Clean. Clean=1
                    completes this entry without an explicit launch trigger, J read or
                    local allocation; launch_ready is then supplied by kernel completion.
                    Otherwise execute the PDL wait/trigger pair, then read global J.
                    For J=0 perform no local allocation and leave work domains empty.
                    For J>0 warp 0 initializes completion state and allocates TensorStorage;
                    all seven warps rendezvous before their independent work loops,
                    including workers with no assigned item. Ring positions persist
                    across the worker's worktiles.
                load: Stage PayloadA from GatherQ and PayloadB as the two contiguous up/gate weight boxes. Arm the full-stage transaction count
                  for 32768 payload bytes. Done covers both payload transfers. Payloads use three slots independently of the two scale slots.
                stage: Copy prepared weight scales into BScale's fused 128-row up/gate image, preserving the prepared ABI permutation. The lane-permuted
                  4-byte asynchronous copies collectively stage 2048 bytes. Done is their completion arrival to the full-stage protocol. Also
                  issue an L2-only weight-scale hint two stages ahead when that stage lies in the same worktile; the hint has no consumer or completion
                  edge.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage. For Clean=1
                    or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new global memory fence; kernel completion
                    supplies the external visibility.
            pipe: {repeat: g, prologue: ['enter:Protocol'], steady: ['load:PayloadPair(g)', 'stage:BScale(g)'], epilogue: ['retire:TensorStorage']}
            waits_for: {reuse: {'load:PayloadPair(g+3)': ['MMA/mma:PayloadA(g)@PayloadB(g)'], 'stage:BScale(g+2)': ['MMA/mma:PayloadA(g)@PayloadB(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                enter:
                  execution_mode: serial
                  meaning: |-
                    First wait for predecessor-grid completion and read Clean. Clean=1
                    completes this entry without an explicit launch trigger, J read or
                    local allocation; launch_ready is then supplied by kernel completion.
                    Otherwise execute the PDL wait/trigger pair, then read global J.
                    For J=0 perform no local allocation and leave work domains empty.
                    For J>0 warp 0 initializes completion state and allocates TensorStorage;
                    all seven warps rendezvous before their independent work loops,
                    including workers with no assigned item. Ring positions persist
                    across the worker's worktiles.
                wait:
                  execution_mode: serial
                  meaning: Hoist=1 when R>=16*E, otherwise Hoist=0. Drain(t,q) completes after its explicit predecessors; q identifies the optional
                    wait before the first scale copy of a worktile.
                prepare: 'The elected issuer waits for the full-stage protocol and copies AScale and BScale into ScaleTM: four scale-copy operations
                  for each operand. Issuance includes submission of all scale copies; only then does this issuer advance to the MMA action. Done
                  is covered by the following cumulative MMA completion.'
                mma: Consume PayloadA/PayloadB and ScaleTM in four ordered 64-channel block-scaled updates to C1. The first update initializes
                  C1 without reading its old value. The fused 128-column product covers both up and gate. Issue a cumulative completion commit
                  after each stage; done covers scale copies, payload reads and accumulator updates. The last stage also commits result readiness
                  for the epilogue. Same-issuer ordering ensures an earlier MMA has consumed ScaleTM before a later scale copy overwrites that
                  scale slot, and makes each scale copy visible before the MMA that uses it.
                retire:
                  execution_mode: serial
                  meaning: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage. For Clean=1
                    or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new global memory fence; kernel completion
                    supplies the external visibility.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - {repeat: {q: [0, 'min(1,t)*(1-Hoist)']}, steady: ['wait:Drain(t,q)']}
              - {repeat: 'g[t]', steady: ['prepare:ScaleTM(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'prepare:ScaleTM(g)': ['AProducer/publish:AScale(g)', 'BProducer/load:PayloadPair(g)', 'BProducer/stage:BScale(g)']}
              reuse:
                wait:Drain(t,q)@done:
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
                mma:PayloadA(g[t,0])@PayloadB(g[t,0]):
                - Epilogue/release:Accumulator(t-1)
                - Epilogue0/release:Accumulator(t-1)
                - Epilogue1/release:Accumulator(t-1)
                - Epilogue2/release:Accumulator(t-1)
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:4]
              verb: &id001
                enter: |-
                  First wait for predecessor-grid completion and read Clean. Clean=1
                  completes this entry without an explicit launch trigger, J read or
                  local allocation; launch_ready is then supplied by kernel completion.
                  Otherwise execute the PDL wait/trigger pair, then read global J.
                  For J=0 perform no local allocation and leave work domains empty.
                  For J>0 warp 0 initializes completion state and allocates TensorStorage;
                  all seven warps rendezvous before their independent work loops,
                  including workers with no assigned item. Ring positions persist
                  across the worker's worktiles.
                drain: Each warp owns its hardware TMEM quadrant (warp index modulo four), one row per lane. For c=0 or 1, load the matching 32
                  up and 32 gate values into this quadrant's rows of Fragment, issue both reads before waiting, and wait for all their TMEM reads
                  to retire. Done makes this register fragment usable.
                emit: Evaluate fc1_quantize for this 32-channel Fragment, including padding rows. For c=0 initialize ScalePack and retain its
                  first two scale bytes; c=1 adds the last two, stores the full four-byte scale word on valid rows and resets it. Store valid
                  payload bytes for each c. Done means local computation and store submission consumed Fragment; global stores can still be in
                  flight. Invalid rows submit no output stores.
                release: This warp arrives once after its last TMEM-read wait and warp rendezvous. Done releases only this warp's accumulator
                  quadrant; MMA reuse waits for all four epilogue roles. This warp immediately continues its final conversion/store tail without
                  waiting for the other epilogue warps or for global output-store completion.
                retire: After this role's whole assigned sequence, rendezvous with all seven warps; warp 0 deallocates TensorStorage. For Clean=1
                  or global J=0 this action is a no-op. It does not insert a per-worktile drain or a new global memory fence; kernel completion
                  supplies the external visibility.
            pipe: &id002
              repeat: t
              prologue: ['enter:Protocol']
              steady: ['drain:Fragment(t,0)', 'emit:ActQ(t,0)', 'drain:Fragment(t,1)', 'release:Accumulator(t)', 'emit:ActQ(t,1)']
              epilogue: ['retire:TensorStorage']
            waits_for: &id003 {data: {'drain:Fragment(t,0)': ['MMA/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}}
          Epilogue0:
            info:
              execution_mode: serial
              member: warp[4:5]
              verb: *id001
            pipe: *id002
            waits_for: *id003
          Epilogue1:
            info:
              execution_mode: serial
              member: warp[5:6]
              verb: *id001
            pipe: *id002
            waits_for: *id003
          Epilogue2:
            info:
              execution_mode: serial
              member: warp[6:7]
              verb: *id001
            pipe: *id002
            waits_for: *id003
        milestone:
          guard_ready:
          - AProducer/enter:Protocol
          - BProducer/enter:Protocol
          - MMA/enter:Protocol
          - Epilogue/enter:Protocol
          - Epilogue0/enter:Protocol
          - Epilogue1/enter:Protocol
          - Epilogue2/enter:Protocol
      fc2:
        domain: {t: worktile, i: [0, I/BK], g: {flatten: [t, i]}, s: [0, I/BK+2]}
        resource:
          PayloadA: {space: SMEM, member_slot_shape: [{row: BM}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {PayloadA(g): {slot_index: g%3}}}
          PayloadB: {space: SMEM, member_slot_shape: [{row: BN2}, {byte: BK/2}], dtype: uint8, slot_count: 3, view: {PayloadB(g): {slot_index: g%3}}}
          AScale: {space: SMEM, member_slot_shape: [{row: BM}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 3, view: {AScale(g): {slot_index: g%3}}}
          BScale: {space: SMEM, member_slot_shape: [{row: BN2}, {block: BK/Block}], dtype: fp8_e4m3fn, slot_count: 3, view: {BScale(g): {slot_index: g%3}}}
          ScaleRow: {space: SMEM, member_slot_shape: [{row: BM}], dtype: int32, slot_count: 1}
          TensorStorage:
            space: TMEM
            member_slot_shape: [{row: BM}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view: {C2: {part: {column: [0, 128]}}, ScaleTM(g): {part: {column: [128+32*(g%3), 160+32*(g%3)]}, dtype: uint8}}
          Fragment: {space: register, member_slot_shape: [{row: BM}, {column: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  First wait for predecessor-grid completion and read Clean. Clean=1
                  completes this entry without an explicit launch trigger, J read or
                  local allocation; launch_ready is then supplied by kernel completion.
                  Otherwise execute the PDL wait/trigger pair before reading J.
                  For J=0 there is no local allocation and work domains are empty.
                  For J>0 initialize completion state and allocate TensorStorage via
                  warp 0, then rendezvous all four warps, including idle workers.
                  Ring position and completion parity start once per worker and
                  continue across its worktiles.
                setup: Resolve the expert, row base and valid row count. Fill ScaleRow with base(j)+r for valid rows and base(j) for padding,
                  then rendezvous the CTA. Keep it until this worktile's last scale copy.
                stage:
                  execution_mode: async
                  meaning: Operands(t,s) is one copy group. For s<count(i), stage ActQ into PayloadA and the prepared FC2 weight payload into
                    PayloadB by two tensor transfers, with 32768 total expected bytes. All four warps asynchronously copy ActS and prepared weight
                    scales directly into AScale and BScale, using ScaleRow for the activation scales. Each scale image has 2048 bytes. These four
                    buffers hold version g[t,s] in its three-slot ring. Commit one scale-copy group; done covers both payload transfers and all
                    scale copies. For s>=count(i), commit an empty group without operand access; its issue/done still exist. The first two groups
                    prime the worktile; later groups refill two stages ahead, after the preceding MMA's completion.
                wait: Ready(g) waits for the matching scale-copy group and payload transaction, then rendezvous all four warps and establish shared-to-async
                  visibility. The two later committed groups, including empty terminal groups, make the scale wait select this stage. Product(t)
                  waits for the final cumulative MMA completion and rendezvous the CTA before any accumulator drain.
                mma:
                  execution_mode: async_ordered_completion
                  meaning: Warp 0's elected issuer copies AScale and BScale to ScaleTM, four scale-copy operations per operand, then issues four
                    ordered 64-channel block-scaled updates to C2. The first update of each worktile initializes C2 without reading it. A cumulative
                    completion commit covers scale copies, payload consumption and accumulator updates. Same-issuer ordering makes each scale
                    copy visible to its consuming MMA.
                emit: Each warp drains its hardware TMEM quadrant, one row per lane, in BN2/32 successive 32-column chunks. Wait for each TMEM
                  read, convert valid rows to BF16 and submit direct global vector stores to RouteResult. Padding rows are read but not stored.
                  Reuse that warp's Fragment only after its current store instructions have consumed it. A final CTA rendezvous follows all chunks;
                  done guarantees all TMEM reads and store submissions are finished, permitting the next worktile to reuse C2 and the operand
                  rings. Global stores may remain in flight.
                retire: Warp 0 deallocates TensorStorage after the whole assigned sequence; for J>0 even an idle worker allocates and deallocates.
                  For Clean=1 or J=0 this is a no-op. Kernel completion supplies global RouteResult visibility; no bulk-store sink or separate
                  bulk completion protocol is used.
            pipe:
              repeat: t
              prologue: ['enter:Protocol']
              steady:
              - setup:ScaleRow(t)
              - {repeat: {p: [0, 2]}, steady: ['stage:Operands(t,p)']}
              - {repeat: 'g[t]', steady: ['stage:Operands(t,i+2)', 'wait:Ready(g)', 'mma:PayloadA(g)@PayloadB(g)']}
              - wait:Product(t)
              - emit:RouteResult(t)
              epilogue: ['retire:TensorStorage']
            waits_for:
              data: {'wait:Ready(g)@done': ['Main/stage:Operands(t,i)'], 'wait:Product(t)@done': ['Main/mma:PayloadA(g[t,last(i)])@PayloadB(g[t,last(i)])']}
              reuse: {'stage:Operands(t,i+2)': ['Main/mma:PayloadA(g[t,i-1])@PayloadB(g[t,i-1])']}
        milestone: {guard_ready: ['Main/enter:Protocol']}
      finalize:
        resource: {Accumulator: {space: register, member_slot_shape: [{hidden: 128*FinalWidth}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  All threads wait for predecessor-grid completion and visibility;
                  warp 0 grants dependent-grid launch permission. Then all threads
                  repeat the predecessor wait and read Clean. On Clean=1 this entry
                  completes without reading routing metadata; the payload work
                  domain is empty. Entry and kernel completion events still occur.
                produce: Each thread owns FinalWidth independent output elements. Hoist its eight route indices and scores, initialize Accumulator,
                  then consume valid BF16 route vectors in increasing slot order using finalize's FMA recurrence. Convert and store Y once; no
                  CTA reduction or inter-thread barrier is required. Empty routing still writes zeros.
            pipe: {repeat: t, prologue: ['enter:Protocol'], steady: ['produce:Y(t)']}
        milestone: {guard_ready: ['Main/enter:Protocol']}
        domain: {t: worktile}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: Use tcgen05 block_scale.scale_vec::4X E2M1/E4M3 MMA and the tcgen05.cp scale path, with cumulative tcgen05.commit completion and tcgen05.fence::after_thread_sync
      at the stated synchronization boundaries.
    reason: Ordered scale consumption and cumulative operand-read completion implement both phases' ring and accumulator reuse protocols.
  - item: ['design.tile_pipeline::fc1', 'design.tile_pipeline::fc2.Main']
    choice: Use tcgen05.ld and tcgen05.wait::ld for register materialization, respecting each issuing warp's hardware quadrant. Retire the reads
      before FC1's early release or FC2's end-of-work rendezvous.
    reason: Accumulator reuse requires completed TMEM reads, independently of the later global store completion.
  - item: design.tile_pipeline::fc2.Main
    choice: Bind payload staging to TMA boxes over ActQ and the prepared FC2 weight byte map. Bind scale staging to cp.async.ca 4-byte copies,
      with cp.async.commit_group for every Operands group, including empty terminal groups, and cp.async.wait_group 2 for the current stage. Use
      the matching TMA transaction completion and CTA rendezvous before shared-to-async publication.
    reason: The two-stage lookahead and direct scale ring rely on distinct payload and scale completion mechanisms selecting the same stage.
  - item: design.work_schedule::flow
    choice: Preserve programmatic-stream-serialization launches and the griddepcontrol.wait / launch_dependents protocol for eager and recorded
      work.
    reason: Launch permission and visible predecessor results are separate guarantees.
  - item: [design.tile_pipeline::verify_first.Main, design.tile_pipeline::verify.Main]
    choice: |-
      Bind the CTA dirty vote to __syncthreads_or, the dirty fold and
      arrival ticket to device atomicOr/atomicAdd with __threadfence
      before arrival, and each pinned-mirror publication to
      __threadfence_system followed by the mapped host-word store.
    reason: The last-arrival fold requires published dirty contributions before the ticket is visible; the mirror crosses the device/host
      visibility boundary.
  - item: [design.math_reshape::FirstHostVerdict, design.math_reshape::HostVerdict]
    choice: Use the ABI-owned pinned host tensor at a device-accessible address, with volatile host loads and stores for graph_replay's sentinel and polling.
    reason: The submission gate observes a word written directly by device verification; an ordinary pageable copy or cached host load does not implement that communication.
