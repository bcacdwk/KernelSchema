meta_data:
  name: mxfp8_qkv_attention
  describe: Dense grouped-query attention on block-scaled FP8 Q/K/V with FP8 probability rounding, BF16 output, and optional FP32 natural-log LSE.
  source: source@6e4ca91bd91d998cac99e8dadd83838e153c679d:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/solution.py::Model.forward
  version: 2
  dispatch:
    id: tcg_d128_segmented_cp_direct_wide
    parent: tcg_d128_segmented_cp_direct_narrow
    when: |
      Let active mean window_left is not None and window_left>=0, and wl be
      window_left when active, otherwise 0. Let HostPlan be the actual Plan returned
      by fmha_mxfp8::plan_geometry(B,H,KH,Sq,Skv,D,is_causal,wl,active) in
      source@6e4ca91bd91d998cac99e8dadd83838e153c679d:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/fmha_mxfp8_qkv.cu::fmha_mxfp8::plan_geometry.
      Let SmCount be that source's actual device_sm_count() result, including its
      fallback. Let MapsValid be the actual short-circuit conjunction of its K/V
      encode_tile_map results, including descriptor-cache hits.
      Let split mean HostPlan.use_tc and HostPlan.nsplit>1 and W>0 and
      W>=HostPlan.workspace. Let scan2p mean HostPlan.T>=128 and
      HostPlan.rows_total<=512 and not active. Let psk mean
      2*Sq*(H/KH)<=128*HostPlan.qtiles128. Let wide mean
      (HostPlan.rows_total<2*SmCount and HostPlan.nsplit>=8) or HostPlan.nsplit>128.
      Select exactly when HostPlan.use_tcg and split and D=128 and not MapsValid
      and not HostPlan.scan_fused and scan2p and psk and wide.
      The fixed defaults select QK128, one warpgroup per matrix CTA, FP32 partials,
      PSK direct stores, cp.async staging, segment-max/replay scan and four-group wide combine.
design:
  math_reshape:
    thesis: Save group and segment maxima, then skip constant prefixes while replaying the ordered delayed-max scan. Independent
      key splits shorten numerator recurrences at the cost of a second QK evaluation and global FP32 partials; segment summaries
      add storage and a pass to avoid some group-max reloads. Native MXFP8 and probability rounding remain explicit.
    rewrite:
      - step: domain
        name: Grouped rows and split intervals
        math: |
          Let G=H/KH, Qph=Br/G, R=B*H*Sq, T=ceil_div(Skv,KeyGroup).
          For (b,kh,a), 0<=a<ceil_div(Sq,Qph), q0=a*Qph,
          U=G*min(Qph,Sq-q0), and C=32*ceil_div(U,32).
          Row u=0,...,Br-1 maps to i=q0+floor(u/G), h=kh*G+(u mod G).
          Rows u<U are valid. For mask calculation set ic=min(i,Sq-1),
          lo(u)=max(0,ic+Skv-Sq-wl) when active, otherwise 0, and
          hi(u)=ic+Skv-Sq when is_causal, otherwise Skv-1.
          Use the Contract's operand scale addressing and inclusive masks.
          Let gLo=floor((active ? max(0,q0+Skv-Sq-wl) : 0)/KeyGroup),
          gHi=floor((is_causal ? min(q0+Qph-1,Sq-1)+Skv-Sq : Skv-1)/KeyGroup),
          Span=gHi-gLo+1. For split count n and split s=0,...,n-1 define
          per(n)=ceil_div(Span,n), L(n,s)=gLo+s*per(n),
          Hlast(n,s)=min(L(n,s)+per(n)-1,gHi),
          Count(n,s)=max(0,Hlast(n,s)-L(n,s)+1).
          The group-max evaluation uses n=Ngm; the numerator evaluation uses n=Ns.
          For an evaluated group g, j=g*KeyGroup+v, 0<=v<KeyGroup.
          Qb, Kb and Vb are original E4M3 payloads with their E8M0 block scales,
          without separately rounded FP32 decoding. Invalid Q rows have zero
          payload and unit scales; K/V payload is zero for j>=Skv, but allocated
          final-group scale padding bytes are still read. Matrix evaluations cover
          Br rows and KeyGroup keys. Scalar score/probability/PV readout covers
          u<C, including padded rows; the remaining rows have no probability writes
          or scalar PV accumulation. Only u<U produces global results.
          Let r=(b*H+h)*Sq+i for valid rows, otherwise r=(b*H+h)*Sq.
        symbol:
          Br: {meaning: Grouped query-row capacity, binding: 'bind:design.work_schedule::Br'}
          Ngm: {meaning: Group-max split count, binding: 'bind:design.work_schedule::Ngm'}
          Ns: {meaning: Numerator split count, binding: 'bind:design.work_schedule::Ns'}
      - step: scores
        name: Repeated native QK and saved group maxima
        math: |
          For each group g in a nonempty split, A(-1)=0 by overwrite and
          A(k)=mma32(Qb[:,32*k:32*k+32],Kb[:,32*k:32*k+32]^T,A(k-1)), k=0,...,3.
          DotTile=A(3). For u<C, Score[u,v]=DotTile[u,v] when
          lo(u)<=g*KeyGroup+v<=hi(u), otherwise -inf. Let scale=fp32(D^(-1/2)).
          In the group-max evaluation, GroupMax[g,r]=scale*fmax(Score[u,:])
          for valid rows. Reduce from -inf with source fmaxf NaN behavior:
          four 32-value chunk maxima followed by fmaxf across chunks; masked chunks
          use a halving tree, wholly unmasked chunks can use the native max reduction.
          GroupMax[g,r]=-inf for g<gLo or g>gHi, explicitly filled by the first
          or last group-max split. No matrix product evaluates those groups.
          The numerator evaluation recomputes DotTile with the same contractions
          but consumes Score in probability chunks without a maximum reduction.
        symbol:
          DotTile: {meaning: Unscaled QK tile in either evaluation, shape: [{row: Br}, {key: KeyGroup}], dtype: fp32, retention: 'keep_value
              (evaluation,b,kh,a,s,g)'}
          GroupMax: {meaning: Complete group-major maxima consumed by scan, shape: [{group: T}, {row: R}], dtype: fp32, retention: keep_value
              invocation}
        arithmetic:
          accumulate: mma32 consumes native E4M3 payloads and E8M0 block scales through four ordered 32-channel tcgen05 contractions.
            FP32 accumulation does not assert decoded FP32 operands, reference reduction order or a bound on native internal rounding;
            no BF16 conversion intervenes.
      - step: segment_max
        name: Segment summaries
        math: |
          Let Nseg=ceil_div(T,Seg). For row r and segment z=0,...,Nseg-1,
          initialize SegAcc(-1)=-inf. For j=0,...,Seg-1 set sx[j]=GroupMax[Seg*z+j,r]
          when Seg*z+j<T, otherwise -inf, and SegAcc(j)=fmaxf(SegAcc(j-1),sx[j]).
          SegMax[z,r]=SegAcc(Seg-1), using the scores step's fmaxf NaN behavior.
          All segments are materialized; replay does not consume SegMax[0,r].
        symbol:
          Seg: {meaning: Number of group maxima summarized per segment, value: 16}
          SegMax: {meaning: Segment-major maxima screening replay prefixes, shape: [{segment: Nseg}, {row: R}], dtype: fp32,
            retention: keep_value invocation}
      - step: scan
        name: Constant prefixes and ordered suffix replay
        math: |
          Define update(x,m)=x if x-m>fp32(2.7725887222397812), otherwise m;
          the comparison is false for NaN. For each row r initialize ScanState(-1)=-inf.
          For g=0,...,min(Seg,T)-1 set ScanState(g)=update(GroupMax[g,r],ScanState(g-1)).
          Then process c=0,...,ceil_div(Nseg-1,SegBatch)-1 in order. Let
          z0=1+c*SegBatch, g0=Seg*z0, g1=min(Seg*(z0+SegBatch),T),
          incoming=ScanState(g0-1), and sx_batch[j]=SegMax[z0+j,r] when z0+j<Nseg,
          otherwise -inf, for j=0,...,SegBatch-1.
          Let Jump={j in integers | 0<=j<SegBatch and
          sx_batch[j]-incoming>fp32(2.7725887222397812)}.
          Cut(c,r)=g1 when Jump is empty, otherwise min(g0+Seg*min(Jump),g1).
          For g=g0,...,Cut(c,r)-1 set ScanState(g)=incoming without reading GroupMax.
          For g=Cut(c,r),...,g1-1 set ScanState(g)=update(GroupMax[g,r],ScanState(g-1)).
          Later segments in that suffix are not retested against updated states.
          Store MState[g,r]=ScanState(g) for every g=0,...,T-1 and MTail[r]=ScanState(T-1).
          Let WalkCount(r)=min(Seg,T)+sum_c(g1-Cut(c,r)), using each c's g1.
        symbol:
          SegBatch: {meaning: Segment summaries tested against one incoming state, value: 16}
          ScanState: {meaning: Delayed maximum carried through one row, shape: [], dtype: fp32, retention: carry_forward (r); g=-1..T-1}
          MState: {meaning: Snapshots replayed by numerator splits, shape: [{group: T}, {row: R}], dtype: fp32, retention: keep_value invocation}
          MTail: {meaning: Final delayed maximum used for weighting and LSE, shape: [{row: R}], dtype: fp32, retention: keep_value invocation}
      - step: normalize
        name: Replay the scan and round probabilities
        math: |
          For a numerator split let cLo=L(Ns,s), cHi=Hlast(Ns,s),
          end=max(cLo-1,cHi). Initialize DenState(cLo-1)[u]=0 for u<C.
          In a nonempty split initialize MaxState(cLo-1)[u] from MState[cLo-1,r]
          when cLo>0, otherwise -inf. For g=cLo,...,cHi set
          MaxState(g)[u]=MState[g,r], safe[u]=MaxState(g)[u] if finite, otherwise 0,
          and alpha[u]=expf(MaxState(g-1)[u]-safe[u]) if the old state is finite,
          otherwise 0. Compute x=Score[u,v]*scale-safe[u] with separate FP32
          multiply and subtract. The actual E16 approximation is
          t=sat01(fma32(x,fp32(0.0057249800302088261),0.5)),
          w=fma_rm32(t,252,12582917), e=fma32(x,fp32(1.4426950216293335),12583043-w),
          d=bitcast_f32((bitcast_u32(w)<<23) mod 2^32), E16(x)=d*ex2_ftz(e).
          fma_rm32 rounds toward negative infinity; sat01 saturates to [0,1]
          with NaN-to-zero; ex2_ftz is the source approximate base-two exponential
          with flush-to-zero. No low log2(e) correction is added.
          Prob[u,v]=E16(x), Prob8[u,v]=satfinite_e4m3_rne(Prob[u,v]), the source
          hardware saturating RNE cast with unit scale; for nonnegative finite
          values this rounds min(Prob,ProbabilityMax) to E4M3FN.
          For chunk c=0,...,3, partition z=0,...,3 and pair p=0,1, let F[c,z,p]
          be the left-to-right FP32 sum from zero of Prob[u,32*c+8*z+2*j+p],
          j=0,...,3. Sum (F[c,0,p]+F[c,1,p])+(F[c,2,p]+F[c,3,p]) over
          increasing c from zero to E[p]. Then
          DenState(g)[u]=DenState(g-1)[u]*alpha[u]+(E[0]+E[1]).
          This scalar update uses source compiler defaults without an additional
          contraction restriction; the denominator never uses Prob8.
          An empty split has no probability evaluation and leaves its denominator zero.
        symbol:
          MaxState: {meaning: Replayed maximum in a nonempty split, shape: [{row: C}], dtype: fp32, retention: 'carry_forward (b,kh,a,s);
              g=cLo-1..cHi'}
          DenState: {meaning: Split-local unrounded denominator, shape: [{row: C}], dtype: fp32, retention: 'carry_forward (b,kh,a,s);
              g=cLo-1..end'}
          Prob8: {meaning: Generated probability rows for the current PV, shape: [{row: C}, {key: KeyGroup}], dtype: fp8_e4m3fn,
            retention: 'keep_value (b,kh,a,s,g)'}
        arithmetic:
          approx: 'E16 is expf2_bias<4> with FMHA_BIAS_MAGIC_FOLD=1 and FMHA_EXP_NO_KTINY=1; alpha uses CUDA expf. unknown: a reliable
            bound for this path and its probability-rounding effects is not supplied. The shared tolerance source records do not
            provide a design guarantee.'
      - step: partials
        name: Per-group PV and FP32 weighted partials
        math: |
          Initialize NumState(cLo-1)[u,d]=0 for u<C. For every nonempty-split group,
          VAcc(-1)=0 by overwrite and VAcc(k)=mma32(Prob8[:,32*k:32*k+32],
          Vb[32*k:32*k+32,:],VAcc(k-1)), k=0,...,3. Let GroupPV=VAcc(3).
          Rescale NumState(g-1) by alpha unless alpha=1, then separately add
          GroupPV in FP32 to obtain NumState(g). The native PV accumulator is
          fresh each group, not carried through groups.
          For each valid row of a nonempty split, weight=expf(MaxState(cHi)[u]-MTail[r])
          when both maxima are finite, otherwise 0. Store
          PartA[s,r,d]=NumState(cHi)[u,d]*weight and PartB[s,r]=DenState(cHi)[u]*weight
          in FP32, without BF16 narrowing. A nonempty split's multiplication by
          zero does not suppress NaN/Inf. Empty splits store zero PartA and PartB.
          Discard local states after the stores.
        symbol:
          NumState: {meaning: Split-local numerator carried between groups, shape: [{row: C}, {channel: D}], dtype: fp32, retention: 'carry_forward
              (b,kh,a,s); g=cLo-1..end'}
          GroupPV: {meaning: Fresh PV result before register-state addition, shape: [{row: C}, {channel: D}], dtype: fp32, retention: 'keep_value
              (b,kh,a,s,g)'}
          PartA: {meaning: Weighted split numerators consumed by combine, shape: [{split: Ns}, {row: R}, {channel: D}], dtype: fp32,
            retention: keep_value invocation}
          PartB: {meaning: Weighted split denominators consumed by combine, shape: [{split: Ns}, {row: R}], dtype: fp32, retention: keep_value
              invocation}
        arithmetic:
          accumulate: PV uses the scores step's native block-scaled contraction with E4M3 Prob8 and unit E8M0 scales, and original
            E4M3 V with its key-axis scales. Register rescaling is a multiply and the later PV addition is separate, as selected
            by FMHA_RESCALE_LAYOUT=0.
          approx: 'weight uses CUDA expf; unknown: no matched end-to-end bound is supplied.'
      - step: combine
        name: Grouped FP32 merge and caller writes
        math: |
          For each real row r let Cmerge=ceil_div(Ns,MergeGroups). For
          z=0,...,MergeGroups-1 set a_z=min(z*Cmerge,Ns), b_z=min(a_z+Cmerge,Ns).
          MergeA[z,d] is the left-to-right FP32 sum from zero of PartA[s,r,d]
          over increasing s=a_z,...,b_z-1. Empty intervals give zero;
          nonexistent entries cause no additions.
          For each z and w=0,...,3 define Y(32)[l]=PartB[a_z+32*w+l,r]
          when a_z+32*w+l<b_z, otherwise zero, for l=0,...,31.
          For k=16,8,4,2,1 set Y(k)[l]=Y(2*k)[l]+Y(2*k)[l+k], 0<=l<k,
          with FP32 additions, then MergeB[z,w]=Y(1)[0].
          TotalB is the left-to-right FP32 sum from zero of MergeB[z,w],
          ordered by increasing z then increasing w. TotalA[d] is the
          left-to-right FP32 sum from zero of MergeA[z,d] in increasing z.
          Let live=(TotalB>0), inv=1/TotalB when live, otherwise 0.
          Write O[b,h,i,d]=bf16(TotalA[d]*inv) when live, otherwise bf16(0), using RNE.
          When LSE is present write MTail[r]+logf(TotalB/16) if live and MTail[r]
          is finite, otherwise -inf. Initial destination bytes are not read.
          All valid caller destinations are written and the host returns None.
          Workspace retains intermediates; no mathematical scratch output or
          scratch-zero initialization is required.
        symbol:
          MergeGroups: {meaning: Split intervals reduced before the final merge, binding: 'bind:design.work_schedule::MergeGroups'}
          MergeA: {meaning: Numerator sums of the merge intervals, shape: [{merge_group: MergeGroups}, {channel: D}], dtype: fp32,
            retention: keep_value (r)}
          MergeB: {meaning: Denominator sums of each interval's four 32-entry blocks, shape: [{merge_group: MergeGroups}, {block: 4}], dtype: fp32,
            retention: keep_value (r)}
          TotalA: {meaning: Final merged numerator, shape: [{channel: D}], dtype: fp32, retention: keep_value (r)}
          TotalB: {meaning: Final merged denominator, shape: [], dtype: fp32, retention: keep_value (r)}
        arithmetic:
          approx: 'Reciprocal/division and CUDA logf retain the source compilation path; unknown: no matched final-output bound
            is supplied.'
    ledger:
      baseline: Direct Contract evaluation with full FP32 scores/probabilities and E4M3 probabilities materialized; logical payload
        bytes, including the source padding and useful-group traversal in the worktile comparison.
      footprint:
        - {item: Global intermediates, change: '9*R*Skv -> 4*R*(2*T+Nseg+1+Ns*(D+1)) bytes, excluding alignment
            reservations', by: [scores, segment_max, scan, partials]}
      matmul:
        - {item: Repeated score evaluation, change: 'Per (b,kh,a), 2*U*Skv*D -> 3*Br*KeyGroup*Span*D MACs including padded and
            masked boundary products', by: [domain, scores, partials]}
      depth:
        - {item: Numerator recurrence, change: 'T -> max_s Count(Ns,s) group steps; scan retains WalkCount(r) ordered group updates, at most T,
            and combine uses at most Cmerge local additions followed by MergeGroups final additions per channel', by: [scan, partials, combine]}
      vector:
        - {item: Segment screening, change: '0 -> Seg*Nseg fmax evaluations and SegBatch*ceil_div(Nseg-1,SegBatch) comparisons per row',
          by: [segment_max, scan]}
      error:
        - {item: Evaluation changes, change: 'Native contractions, E16, denominator trees, fresh per-group PV, split weights and
            grouped merge replace reference evaluation choices; no end-to-end bound asserted', by: [scores, normalize, partials,
            combine]}
  work_schedule:
    thesis: Allocate independent CTAs along the useful key span while reusing Q within each CTA and K/V across grouped heads. Group-max,
      segment summaries, row replay, numerator splits and wide merge are five submissions linked by global FP32 values.
      Wide merge divides each row's split traversal into four local intervals, paying for a shared partial-sum exchange.
    flow:
      launch:
        - {phase: [group_max]}
        - {phase: [segment_max], start_after: group_max.launch_ready, protocol: pdl}
        - {phase: [segmented_scan], start_after: segment_max.launch_ready, protocol: pdl}
        - {phase: [split], start_after: segmented_scan.launch_ready, protocol: pdl}
        - {phase: [combine], start_after: split.launch_ready, protocol: pdl}
      handoff:
        GroupMax: {producer: group_max, consumer: [segment_max, segmented_scan], storage: global, ready: group_max.kernel_done,
          wait_at: [segment_max.inputs_ready, segmented_scan.inputs_ready]}
        SegMax: {producer: segment_max, consumer: [segmented_scan], storage: global, ready: segment_max.kernel_done,
          wait_at: segmented_scan.inputs_ready}
        MState: {producer: segmented_scan, consumer: [split], storage: global, ready: segmented_scan.kernel_done, wait_at: split.scan_ready}
        MTail: {producer: segmented_scan, consumer: [split, combine], storage: global, ready: segmented_scan.kernel_done, wait_at: [split.scan_ready,
            combine.inputs_ready]}
        PartA: {producer: split, consumer: [combine], storage: global, ready: split.kernel_done, wait_at: combine.inputs_ready}
        PartB: {producer: split, consumer: [combine], storage: global, ready: split.kernel_done, wait_at: combine.inputs_ready}
    phase:
      group_max:
        describe: Compute GroupMax, including explicit -inf outside useful intervals. Model.forward resolves HostPlan and MapsValid.
          A cached graph, or an eligible capture/instantiation followed by successful graph launch, executes this same five-kernel
          sequence. Capture records without executing kernels; otherwise launch_sequence submits directly on the caller stream.
          The host does not wait for this sequence to finish.
        decomposition:
          strategy: |
            Br=128, Ns=HostPlan.nsplit, Ngm=HostPlan.gm_nsplit,
            nx=ceil_div(Sq,Qph), ny=B*KH. Each tile is (s,kvflat=b*KH+kh,a).
            Use domain's row map and set cLo=L(Ngm,s), cHi=Hlast(Ngm,s),
            Ng=Count(Ngm,s). WrittenG contains integers cLo<=g<=cHi, also
            0<=g<gLo for s=0 and gHi<g<T for s=Ngm-1; empty ranges add nothing.
            Long means Ng>=8. Maxima are local reductions. Empty splits still
            perform their assigned outside fills, setup and teardown.
          partition:
            split: {size: Ngm, tile: 1}
            kvflat: {size: B*KH, tile: 1}
            query: {size: Sq, tile: Qph}
          worktile:
            invariant:
              q_tensor: {shape: [{head: G}, {query: Qph}, {channel: D}], dtype: 'ref:contract.algorithm_requirement::q_tensor.dtype'}
              sf_q: {shape: [{scale_row: Br}, {scale_column: D/Block}], dtype: 'ref:contract.algorithm_requirement::sf_q.dtype'}
            iteration:
              k_tensor: {shape: [{key: KeyGroup}, {channel: D}], dtype: 'ref:contract.algorithm_requirement::k_tensor.dtype', direction: ascending}
              sf_k: {shape: [{scale_row: KeyGroup}, {scale_column: D/Block}], dtype: 'ref:contract.algorithm_requirement::sf_k.dtype',
                direction: ascending}
          target:
            single_tile:
              GroupMax: {shape: [{group: count(WrittenG)}, {row: U}], dtype: 'ref:design.math_reshape::GroupMax.dtype'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: nx*ny*Ngm
        schedule:
          strategy: Grid=(nx,ny,Ngm); worker_id=x+nx*(y+ny*z) owns (s=z,kvflat=y,a=x). p.lpt=0, without mask-dependent remapping.
          worktile_order:
            - {by: split, direction: ascending}
            - {by: kvflat, direction: ascending}
            - {by: query, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      segment_max:
        describe: Materialize every segment summary, including the unconsumed summary for segment zero.
        decomposition:
          strategy: ScanThreads=256 for both scan phases; nr=ceil_div(R,ScanThreads). A tile (z,x) starts at r0=x*ScanThreads,
            contains ScanRows=min(ScanThreads,R-r0) rows, and traverses g=Seg*z through min(Seg*(z+1),T)-1. Each segment reduction is local.
          partition:
            segment: {size: Nseg, tile: 1}
            row: {size: R, tile: ScanThreads}
          worktile:
            iteration:
              GroupMax: {shape: [{group: 1}, {row: ScanRows}], dtype: 'ref:design.math_reshape::GroupMax.dtype', direction: ascending}
          target:
            single_tile:
              SegMax: {shape: [{segment: 1}, {row: ScanRows}], dtype: 'ref:design.math_reshape::SegMax.dtype'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: nr*Nseg
        schedule:
          strategy: Grid=(nr,Nseg); worker_id=x+nr*z owns one segment and row block.
          worktile_order:
            - {by: segment, direction: ascending}
            - {by: row, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      segmented_scan:
        describe: Replay segment zero, then fill constant prefixes and replay suffixes selected by summary batches for each row.
        decomposition:
          strategy: Use segment_max's ScanThreads, nr and ScanRows with x=worker_id. A tile scans its rows across all groups.
            Traverse SegMax from segment one in SegBatch-sized batches and read GroupMax for segment zero and the suffixes defined by scan.
            These are local traversals; every MState entry and MTail is written.
          partition:
            row: {size: R, tile: ScanThreads}
          worktile:
            iteration:
              SegMax: {shape: [{segment: 1}, {row: ScanRows}], dtype: 'ref:design.math_reshape::SegMax.dtype', direction: ascending}
              GroupMax: {shape: [{group: 1}, {row: ScanRows}], dtype: 'ref:design.math_reshape::GroupMax.dtype', direction: ascending}
          target:
            single_tile:
              MState: {shape: [{group: T}, {row: ScanRows}], dtype: 'ref:design.math_reshape::MState.dtype'}
              MTail: {shape: [{row: ScanRows}], dtype: 'ref:design.math_reshape::MTail.dtype'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: nr
        schedule:
          worktile_order:
            - {by: row, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      split:
        describe: Recompute QK, replay scan states and write weighted FP32 PartA and PartB for one numerator split.
        decomposition:
          strategy: Use group_max's Br, Ns, nx and ny and domain's row map. Each tile (s,kvflat,a) sets cLo=L(Ns,s), cHi=Hlast(Ns,s),
            Ng=Count(Ns,s). Key groups are a local traversal. Empty splits still write zero partials for every valid row. The entrance
            snapshot is MState[cLo-1,r] when cLo>0; extra discarded reads by padded rows or empty splits are recorded in the pipeline
            rather than treated as mathematical inputs.
          partition:
            split: {size: Ns, tile: 1}
            kvflat: {size: B*KH, tile: 1}
            query: {size: Sq, tile: Qph}
          worktile:
            invariant:
              q_tensor: {shape: [{head: G}, {query: Qph}, {channel: D}], dtype: 'ref:contract.algorithm_requirement::q_tensor.dtype'}
              sf_q: {shape: [{scale_row: Br}, {scale_column: D/Block}], dtype: 'ref:contract.algorithm_requirement::sf_q.dtype'}
              MTail: {shape: [{row: U}], dtype: 'ref:design.math_reshape::MTail.dtype'}
            iteration:
              k_tensor: {shape: [{key: KeyGroup}, {channel: D}], dtype: 'ref:contract.algorithm_requirement::k_tensor.dtype', direction: ascending}
              v_tensor: {shape: [{key: KeyGroup}, {channel: D}], dtype: 'ref:contract.algorithm_requirement::v_tensor.dtype', direction: ascending}
              sf_k: {shape: [{scale_row: KeyGroup}, {scale_column: D/Block}], dtype: 'ref:contract.algorithm_requirement::sf_k.dtype',
                direction: ascending}
              sf_v: {shape: [{channel: D}, {sequence_block: KeyGroup/Block}], dtype: 'ref:contract.algorithm_requirement::sf_v.dtype',
                direction: ascending}
              MState: {shape: [{group: 1}, {row: U}], dtype: 'ref:design.math_reshape::MState.dtype', direction: ascending}
          target:
            single_tile:
              PartA: {shape: [{row: U}, {channel: D}], dtype: 'ref:design.math_reshape::PartA.dtype'}
              PartB: {shape: [{row: U}], dtype: 'ref:design.math_reshape::PartB.dtype'}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: nx*ny*Ns
        schedule:
          strategy: Grid=(nx,ny,Ns); worker_id=x+nx*(y+ny*z) owns (s=z,kvflat=y,a=x), without CTA remapping.
          worktile_order:
            - {by: split, direction: ascending}
            - {by: kvflat, direction: ascending}
            - {by: query, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      combine:
        describe: Merge all weighted splits for one real output row and write O and optional LSE.
        decomposition:
          strategy: One row per CTA on grid=(Sq,H,B); worker_id=r=i+Sq*(h+H*b). MergeGroups=4; the intervals a_z..b_z-1
            and their final merge are local to this worktile. HostPlan clamps Ns<=128*MergeGroups, so Cmerge<=128 and every
            denominator entry is covered. D=128 uses one channel slice and no further reduction follows. MTail is consumed
            only when LSE has a caller destination.
          partition:
            row: {size: R, tile: 1}
          worktile:
            invariant:
              MTail: {shape: [], dtype: 'ref:design.math_reshape::MTail.dtype'}
            iteration:
              PartA: {shape: [{channel: D}], dtype: 'ref:design.math_reshape::PartA.dtype', direction: ascending}
              PartB: {shape: [], dtype: 'ref:design.math_reshape::PartB.dtype', direction: ascending}
          target:
            single_tile:
              O: {shape: [{channel: D}], dtype: 'ref:contract.algorithm_requirement::O.dtype'}
              LSE: {shape: [], dtype: 'ref:contract.algorithm_requirement::LSE.dtype'}
            tile_reduction:
              dimension: split
              input:
                - ref:design.math_reshape::PartA
                - ref:design.math_reshape::PartB
              output:
                - ref:contract.algorithm_requirement::O
                - ref:contract.algorithm_requirement::LSE
              method: ref:design.math_reshape::combine
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: R
        schedule:
          worktile_order:
            - {by: row, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: Cooperative warps retain Q and stream cp.async payload/scale rings. Copy-group waits and CTA joins publish operands;
      empty commits preserve lookahead and retire the last payload. Long group-max spans issue QK one group early. Split
      uses one overlapping score/PV TMEM region and a register numerator, waiting each PV before readback; PDL lets its independent
      prologue start before the scan data is ready. Wide merge exchanges four groups' numerator and warp-denominator partials
      in shared memory before group zero writes the row.
    phase:
      group_max:
        domain:
          g:
            - cLo
            - max(cLo,cHi+1)
        resource:
          Query: {space: SMEM, member_slot_shape: [{row: Br}, {channel: D}], dtype: fp8_e4m3fn, slot_count: 1}
          Key:
            space: SMEM
            member_slot_shape:
              - {key: KeyGroup}
              - {channel: D}
            dtype: fp8_e4m3fn
            slot_count: 3
            view:
              Key(g): {slot_index: (g-cLo)%RingUsed}
          KeyAtom:
            space: SMEM
            member_slot_shape:
              - {element: 512}
            dtype: uint8
            slot_count: 3
            view:
              KeyAtom(g): {slot_index: (g-cLo)%RingUsed}
          TensorMemory:
            space: TMEM
            member_slot_shape:
              - {row: Br}
              - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              DotTile: {part: {column: [0, 128]}}
              QueryScale: {part: {column: [128, 136]}, dtype: uint8}
              KeyScale(g): {part: {column: [ScaleCol(g), ScaleCol(g)+8]}, dtype: uint8}
          QueryPrefetch: {space: register, member_slot_shape: [{element: Br*D+Br*(D/Block)}], dtype: uint8, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                setup: Establish coordinates, masks and initially zero completion parities. RingUsed=3 for Long, otherwise 2; ScaleCol(g)=136+8*(g%2)
                  for Long, otherwise 136. Three shared slots remain allocated in both cases. Valid rows of the first/last split
                  issue the outside -inf fills. Thread zero initializes matrix completion barriers and issues MMA; all four warps
                  stage Q, copy payloads/scales and synchronize. Only warps with a valid row perform scalar score readout. q0>=Sq is
                  unreachable.
                prime: For Ng>0 cooperatively enqueue K(cLo) and its 512-byte scale atom into slot zero, then commit each thread's
                  copy group. Payload copies zero-fill beyond Skv; atoms include allocated scale padding without a key-valid guard.
                  For Ng=0 issue no copy or commit. done means enqueue, not arrival.
                prepare: Prefetch Q and scale words into QueryPrefetch, even for empty splits. First warp allocates TMEM; a CTA
                  barrier publishes its base before that warp relinquishes the permit. Write Query/QueryScale, wait for TMEM stores
                  and discard QueryPrefetch. Q survives all groups.
                start: For Ng>0 commit the empty copy group left by the hoisted prime. For Long additionally enqueue K(cLo+1)
                  and atom, commit, then wait for all but the newest copy group. Fence shared async access and CTA-sync to publish
                  slot zero's payload and atom. Publish the first KeyScale, wait for its TMEM stores, fence and CTA-sync, then enqueue
                  and commit QK(cLo). Non-Long issues no product or wait; Ng=0 also issues no commit.
                prefetch: Enqueue K(g+2) and atom for Long, otherwise K(g+1) and atom, only when that group is <=cHi. Otherwise
                  issue no transfer, but always commit a copy group, including an empty one at the tail. done means enqueue;
                  previous QK completion and atom-reader joins protect ring reuse.
                stage: Every thread waits for all but its newest copy group, then fences shared async access and CTA-syncs.
                  For Long this proves K(g+1) and atom when g<cHi; write its alternating KeyScale. At g=cHi the wait still executes
                  and the next physical atom slot's stale bytes are still copied to the alternate scale slot, with no later QK
                  consumer. Ng>=8 ensures that shared slot was filled earlier. For non-Long the wait proves current K(g) and atom;
                  write KeyScale at its fixed base. Wait for TMEM stores, fence and CTA-sync. These joins also publish Q. Tail
                  empty commits make all actual copies complete without a separate wait-for-zero operation.
                score: Non-Long enqueues and commits QK(g) here; Long uses the product already issued by start/advance. Wait for
                  its QK completion phase, toggle parity and apply the completion fence. K and KeyScale reads have retired and
                  DotTile is readable; each group's first contraction overwrites the score region.
                reduce: Live warps reduce scores in 32-key chunks, using masked readout or native unmasked max readout, each with
                  its TMEM-load wait. Only valid rows issue GroupMax stores. A CTA barrier joins all score readers before the next
                  QK overwrites DotTile; no full-group score register array, PV or cross-warpgroup reduction is needed.
                advance: For Long and g<cHi enqueue and commit QK(g+1) using next K and its alternating scale; done means enqueue.
                  Otherwise perform no product or wait. This permits QK(g+1) under the next prefetch/stage.
                finish: All issued K/atom copies and QK products have been waited. Fence and CTA-sync join final TMEM users, then
                  the first warp deallocates 256 columns. Each CTA signals PDL launch completion after its stores and teardown;
                  launch_ready is the grid-wide protocol event. Global visibility comes from kernel completion and the successor
                  wait.
            pipe:
              prologue:
                - setup:Local
                - prime:Inputs
                - prepare:Query
                - start:FirstQK
              steady:
                - repeat: g
                  steady:
                    - prefetch:FutureK(g)
                    - stage:Scales(g)
                    - score:DotTile(g)
                    - reduce:GroupMax(g)
                    - advance:NextQK(g)
              epilogue:
                - finish:Local
      segment_max:
        milestone:
          inputs_ready: [Main/dependency:GroupMax@done]
        resource:
          GroupBatch: {space: register, member_slot_shape: [{row: ScanRows}, {group: Seg}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:ScanThreads/32]
              verb:
                signal: All threads signal segmented_scan launch permission at entry, before the wait and row guard. This is
                  launch_ready only; it does not publish SegMax.
                dependency: All threads wait for group_max completion and global visibility before any row guard or GroupMax load.
                produce: Each valid thread loads its segment's Seg entries into GroupBatch, substituting -inf beyond T, reduces
                  them as segment_max specifies and issues one SegMax store. Out-of-range rows do no arithmetic or memory access
                  after the entry protocol. There is no cross-thread reduction; kernel completion supplies global visibility.
            pipe:
              steady:
                - signal:ScanPermission
                - dependency:GroupMax
                - produce:SegMax
      segmented_scan:
        milestone:
          inputs_ready: [Main/dependency:Summaries@done]
        resource:
          ScanState: {space: register, member_slot_shape: [{row: ScanRows}], dtype: fp32, slot_count: 1}
          SummaryBatch: {space: register, member_slot_shape: [{row: ScanRows}, {segment: SegBatch}], dtype: fp32, slot_count: 1}
          ReplayBatch: {space: register, member_slot_shape: [{row: ScanRows}, {group: Seg}], dtype: fp32, slot_count: 1}
          ReplayStart: {space: register, member_slot_shape: [{row: ScanRows}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:ScanThreads/32]
              verb:
                dependency: All threads wait for segment_max completion before signaling or testing the row guard. done guarantees
                  SegMax and transitively GroupMax are visible.
                signal: All threads signal split launch permission after the wait but before scan arithmetic. This does not publish
                  snapshots or tails. Out-of-range rows also signal; their later arithmetic and stores have no data effects.
                first: Each valid thread initializes ScanState and replays segment zero without reading SegMax[0,r]. Replay loads
                  full Seg-sized GroupMax batches into ReplayBatch before ordered updates/stores, then handles a partial tail with
                  scalar loads and updates. ScanState persists through the worktile.
                test: For chunk c load SegBatch summaries into SummaryBatch, with -inf for missing terminal segments. Test every
                  summary against the same incoming ScanState and retain Cut(c,r) in ReplayStart. All summary values are consumed
                  before entering the replay walk; updated states do not cause further summary tests within the chunk.
                replay: Fill the prefix before ReplayStart with unchanged ScanState, without GroupMax loads. Replay the entire
                  remaining suffix as in first. Empty suffixes issue no walk loads or updates. Consume each ReplayBatch before reuse
                  and ReplayStart before the next test overwrites it. Each row progresses independently, without CTA scan reduction.
                tail: Issue MTail after the final snapshot. All R*T snapshots and R tails are rewritten; kernel completion supplies
                  visibility. This CTA has no further worktile and discards its local state.
            pipe:
              prologue:
                - dependency:Summaries
                - signal:SplitPermission
                - first:SegmentZero
              steady:
                - repeat: {c: [0, 'ceil_div(Nseg-1,SegBatch)']}
                  steady:
                    - test:Prefix(c)
                    - replay:Chunk(c)
              epilogue:
                - tail:MTail
      split:
        domain:
          g:
            - cLo
            - max(cLo,cHi+1)
        milestone:
          scan_ready:
            - Main/dependency:Scan@done
        resource:
          Query: {space: SMEM, member_slot_shape: [{row: Br}, {channel: D}], dtype: fp8_e4m3fn, slot_count: 1}
          Key:
            space: SMEM
            member_slot_shape:
              - {key: KeyGroup}
              - {channel: D}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              Key(g): {slot_index: (g-cLo)%2}
          Value:
            space: SMEM
            member_slot_shape:
              - {key: KeyGroup}
              - {channel: D}
            dtype: fp8_e4m3fn
            slot_count: 2
            view:
              Value(g): {slot_index: (g-cLo)%2}
          KeyAtom:
            space: SMEM
            member_slot_shape:
              - {element: 512}
            dtype: uint8
            slot_count: 2
            view:
              KeyAtom(g): {slot_index: (g-cLo)%2}
          ValueAtom:
            space: SMEM
            member_slot_shape:
              - {element: 512}
            dtype: uint8
            slot_count: 2
            view:
              ValueAtom(g): {slot_index: (g-cLo)%2}
          TensorMemory:
            space: TMEM
            member_slot_shape:
              - {row: Br}
              - {column: 256}
            dtype: fp32
            slot_count: 1
            view:
              DotTile: {part: {column: [0, 128]}}
              GroupPV: {part: {column: [0, 128]}}
              QueryScale: {part: {column: [128, 136]}, dtype: uint8}
              KeyScale: {part: {column: [136, 144]}, dtype: uint8}
              UnitScale: {part: {column: [144, 152]}, dtype: uint8}
              ValueScale: {part: {column: [152, 160]}, dtype: uint8}
              Prob8: {part: {column: [192, 224]}, dtype: fp8_e4m3fn}
          QueryPrefetch: {space: register, member_slot_shape: [{element: Br*D+Br*(D/Block)}], dtype: uint8, slot_count: 1}
          NumState: {space: register, member_slot_shape: [{row: Br}, {channel: D}], dtype: fp32, slot_count: 1}
          DenState: {space: register, member_slot_shape: [{row: Br}], dtype: fp32, slot_count: 1}
          Replay:
            space: register
            member_slot_shape:
              - {row: Br}
              - {column: 3}
            dtype: fp32
            slot_count: 1
            view:
              MaxState: {part: {column: [0, 1]}}
              CurrentMax: {part: {column: [1, 2]}}
              NextMax: {part: {column: [2, 3]}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                setup: Establish coordinates and PSK valid/live-warp predicates. Initialize QK/PV completion barriers at parity
                  zero. All four warps copy payloads/scales, commit/wait copy groups and synchronize; one thread maps to each row,
                  and thread zero issues MMA. q0>=Sq is unreachable.
                prime: For Ng>0 cooperatively enqueue K/V(cLo) and their atoms into slot zero and commit each thread's copy group.
                  Payload copies zero-fill beyond Skv; atoms include allocated scale padding. For Ng=0 issue no copy or commit.
                  done is enqueue, not arrival.
                prepare: Prefetch Q/scales, then first-warp allocate 256 TMEM columns, CTA-publish the base and relinquish the
                  permit. Write Query, QueryScale and UnitScale, wait for TMEM stores, discard QueryPrefetch and clear NumState.
                  This also occurs for empty splits and precedes the scan wait, allowing independent work before scan completion.
                dependency: Execute the PDL scan-dependency wait before the first snapshot load. done guarantees the scan's MState
                  and MTail regions are visible; it does not initialize or extend either region.
                replay: 'Initialize DenState to zero and MaxState to -inf. Every thread loads MState at (cLo-1)*R+rowG when cLo>0,
                  including empty splits; load CurrentMax at cLo only when Ng>0. rowG is domain''s r. The source has no any_compute
                  guard or T-bound clamp on the entrance load: a logically out-of-range empty-split read is not given an initialization
                  or safety guarantee here. Its loaded value is discarded from empty-split results; dead-warps'' loads likewise
                  do not affect output or subsequent addresses. After these loads, Ng>0 commits the empty copy group left by
                  the hoisted prime; Ng=0 issues no commit.'
                prefetch: Load NextMax for g+1 when g<cHi, otherwise use -inf, including in dead warps. Enqueue next K/V and atoms
                  in the alternate slot only when g<cHi, then always commit a copy group, including an empty one at the tail.
                  Prior QK/PV completion retired that slot's old operand reads and CTA joins retired its atom readers; done does
                  not wait for new copies.
                stage: Every thread waits for all but its newest copy group, proving current K/V plus atoms. The final empty
                  commit makes this wait retire the last payload. Fence shared async access and CTA-sync,
                  write current KeyScale and ValueScale, wait for TMEM stores, fence and CTA-sync. Prior PV was already waited,
                  protecting the scale/operand slots. These joins retire the previous GroupPV readers before QK overwrites the
                  same region.
                qk: Enqueue four QK contractions with first-contraction overwrite, commit, wait for completion and fence. No maximum
                  readout occurs.
                probability: Live warps advance Replay, rescale DenState/NumState, consume DotTile in 32-key chunks and write Prob8.
                  Dead warps skip scalar readout, rescaling and probability writes; their P rows remain uninitialized. All warps
                  wait for their TMEM stores, fence and CTA-sync, retiring all DotTile readers before PV overwrites it. PV evaluates
                  all 128 rows; unwritten P rows feed only discarded result rows and are not filled with invented zeros.
                pv: Enqueue four native PV contractions into GroupPV, overwriting on the first contraction of every group. Commit,
                  wait, toggle parity and fence. Value, ValueScale and Prob8 operand reads are retired.
                accumulate: 'Live warps read GroupPV in 32-channel chunks with TMEM-load waits and add into NumState; dead warps
                  skip readback. No tail CTA barrier is added: next stage''s joins protect reuse, or finish joins the last group.'
                write: Nonempty valid rows load MTail and compute weight. Valid rows directly issue 16-byte FP32 stores from weighted
                  NumState to PartA and a scalar weighted DenState store to PartB. Empty splits still store zeros. No shared transpose
                  staging or O/LSE store occurs. done means ordinary stores issued and register sources consumed.
                finish: Fence and CTA-sync join final TMEM users; first warp deallocates. All requested transfers and products
                  were already waited. Signal PDL completion after partial stores and teardown. No CTA receives another tile; later
                  kernels have fresh local resources. Global intermediates survive all declared readers, and caller-stream completion
                  orders subsequent invocations without retaining numerical state.
            pipe:
              prologue:
                - setup:Local
                - prime:Inputs
                - prepare:Query
                - dependency:Scan
                - replay:Entrance
              steady:
                - repeat: g
                  steady:
                    - prefetch:Next(g)
                    - stage:Operands(g)
                    - qk:DotTile(g)
                    - probability:Prob8(g)
                    - pv:GroupPV(g)
                    - accumulate:NumState(g)
              epilogue:
                - write:Partials
                - finish:Local
      combine:
        milestone:
          inputs_ready:
            - Main/dependency:Partials@done
        resource:
          MergeA: {space: SMEM, member_slot_shape: [{merge_group: MergeGroups}, {channel: D}], dtype: fp32, slot_count: 1}
          MergeB: {space: SMEM, member_slot_shape: [{merge_group: MergeGroups}, {block: 4}], dtype: fp32, slot_count: 1}
          NumeratorBatch: {space: register, member_slot_shape: [{merge_group: MergeGroups}, {channel: D}, {split: 8}], dtype: fp32, slot_count: 1}
          NumeratorState: {space: register, member_slot_shape: [{merge_group: MergeGroups}, {channel: D}], dtype: fp32, slot_count: 1}
          Totals:
            space: register
            member_slot_shape:
              - {channel: D}
              - {column: 2}
            dtype: fp32
            slot_count: 1
            view:
              TotalA: {part: {column: [0, 1]}}
              TotalB: {part: {column: [1, 2]}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4*MergeGroups]
              verb:
                dependency: All threads execute the PDL wait at entry. done guarantees every PartA/PartB producer has completed;
                  scan and MTail are complete transitively.
                sum_a: Four consecutive warps form group z, owning interval a_z..b_z-1; its thread d owns channel d. Initialize
                  NumeratorState to zero, load full eight-split batches into NumeratorBatch and consume each batch before reuse.
                  Read the terminal suffix one split at a time. Write MergeA[z,d] to shared memory, including zero for empty intervals.
                  done guarantees each thread's own store; cross-thread publication occurs at join.
                sum_b: Each group's 128 threads load PartB[a_z+d,r] when a_z+d<b_z, otherwise use zero. Apply combine's 32-entry
                  tree with shuffle-down offsets 16,8,4,2,1; each warp's lane zero writes MergeB[z,w]. Even warps containing
                  only padding contribute their zero partials. No fused-scan weight array is read or written.
                join: All sixteen warps execute a CTA barrier, publishing every MergeA and MergeB entry before cross-group reads.
                write: Group zero alone reads the shared partials and performs combine's final sums. Each thread retains TotalA
                  and a replicated TotalB, then writes its BF16 channel; thread zero also reads MTail and writes LSE when present.
                  Other groups perform no further data accesses. Shared partials remain unchanged until every group-zero reader
                  finishes. Initial destinations are never read; kernel completion supplies visibility. No next tile is assigned.
            pipe:
              steady:
                - dependency:Partials
                - sum_a:MergeA
                - sum_b:MergeB
                - join:Partials
                - write:Output
realization:
  require:
    - item: ["design.tile_pipeline::group_max", "design.tile_pipeline::split"]
      choice: >-
        Bind matrix completion to tcg_commit plus parity mbar_wait; TMEM
        readout to tcg_ld32/tcg_ld32_redmax with their wait::ld; stores to
        wait::st; and publication to before/after-thread-sync fences at the
        stated CTA joins. Bind payload/atom copies to 16-byte cp.async.cg
        with commit_group and wait_group 1, preserving the empty commits
        and payload zero-fill source-size predicate. Copy completion is per
        issuing thread; shared-proxy fences and CTA joins publish all copies.
        Preserve SWIZZLE_128B shared
        operands, 1024-byte shared alignment and replicated E8M0 atoms for
        native block_scale.scale_vec::1X descriptors: QK is K-major; PV uses
        TMEM A with MN-major V.
      reason: >-
        CTA barriers alone do not complete asynchronous matrix or copy work.
        These bindings protect score/PV aliasing, scale/probability reuse and
        matching payload, scale and probability contractions.
    - item: "design.work_schedule::flow"
      choice: >-
        Use cudaLaunchKernelEx/ExC with programmatic stream serialization for
        the four successors, cudaTriggerProgrammaticLaunchCompletion at the
        stated signal points and cudaGridDependencySynchronize at dependency
        waits. group_max itself uses an ordinary launch.
      reason: >-
        Launch permission is separate from producer visibility; split's
        independent preparation remains before its scan wait.
  prefer:
    - item: ["design.tile_pipeline::group_max.TensorMemory", "design.tile_pipeline::split.TensorMemory"]
      choice: >-
        launch_tcg starts with dynamic shared requests of 69632 bytes for
        group-max and 102912 for split. Besides live buffers these reserve
        512 bytes of Q scales, 1024 bytes of exchange and 1024 bytes of
        alignment; split also reserves an unused 16384-byte shared P tile.
        tmem_safe_smem queries occupancy and increases the request by 4096
        while blocks*256>512, up to 96 attempts, stopping on API error or
        a still-failing request >=220000. It retries an unpublished attribute,
        clears the error, and returns/caches the last request without a
        residency guarantee.
      reason: >-
        Shared reservations affect capacity even when probabilities occupy
        TMEM; the helper compensates for occupancy accounting that omits TMEM.
