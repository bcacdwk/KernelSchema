meta_data:
  name: mxfp8_qkv_attention
  describe: Dense grouped-query attention on block-scaled FP8 Q/K/V with FP8 probability rounding, BF16 output, and optional FP32 natural-log LSE.
  source: source@6e4ca91bd91d998cac99e8dadd83838e153c679d:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/fmha_tc.cuh::fmha_tc_kernel
  version: 3
  dispatch:
    id: tc_fused
    parent: root
    when: |
      Let active mean window_left is not None and window_left >= 0,
      and let wl be window_left when active, otherwise 0.
      Let HostPlan be the actual Plan returned by
      fmha_mxfp8::plan_geometry(B,H,KH,Sq,Skv,D,is_causal,wl,active), from
      source@6e4ca91bd91d998cac99e8dadd83838e153c679d:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/fmha_mxfp8_qkv.cu::plan_geometry.
      It uses the prepared binary's cached tcg_available probe and device
      queries, including their source fallbacks.
      Let split mean HostPlan.use_tc and HostPlan.nsplit>1 and W>0 and
      W>=HostPlan.workspace, matching the actual forward workspace guard.
      Select exactly when HostPlan.use_tc and not HostPlan.use_tcg and
      not HostPlan.use_tcv and not split. This selects
      fmha_tc_kernel<D,4,PASS_FUSED> with its default PVMODE=0.
design:
  math_reshape:
    thesis: >-
      Fuse the useful 128-key groups without global score or probability arrays.
      Raw FP8 block products receive separate scale corrections; rounded
      probabilities and BF16 V feed a carried FP32 numerator. Four denominator
      partials remain separate until output, changing summation order while
      eliminating split-state traffic.
    rewrite:
      - step: domain
        name: Grouped query rows and useful key groups
        math: |
          Let G=H/KH, Qph=Br/G, q0=a*Qph and 0<=a<ceil_div(Sq,Qph).
          For each batch b and KV head kh, row u=0,...,Br-1 maps to
          h=kh*G+floor(u/Qph), i=q0+(u mod Qph). A row is valid iff i<Sq.
          Let active mean window_left is neither None nor -1.
          For valid rows, lo(u)=max(0,i+Skv-Sq-window_left) if active, otherwise 0;
          hi(u)=min(i+Skv-Sq,Skv-1) if is_causal, otherwise Skv-1.
          For invalid rows set lo(u)=0 and hi(u)=Skv-1.
          Let imin=q0, imax=min(q0+Qph-1,Sq-1),
          cLo=floor((active ? max(0,imin+Skv-Sq-window_left) : 0)/KeyGroup),
          cHi=floor((is_causal ? imax+Skv-Sq : Skv-1)/KeyGroup),
          Ng=cHi-cLo+1. Process this positive-length interval in increasing g.
          Within group g, v=0,...,KeyGroup-1 denotes key j=g*KeyGroup+v.
          Qraw[u,d], Kraw[v,d] and Vraw[v,d] are the stored E4M3 payloads
          at these coordinates. Zero-fill Qraw for invalid queries and Kraw/Vraw
          for j>=Skv. Use the Contract's packed scale-byte addressing.
          QueryScale[u,k] and KeyScale[v,k] are 2^(byte-ExponentBias)
          for k=0,...,D/Block-1, but zero for invalid queries and j>=Skv
          respectively. QueryScale is computed once per row tile.
          ValueScale[c,d], c=0,...,KeyGroup/Block-1, is the BF16 scale for
          this group's key-axis block c. Its byte decodes as 2^(byte-ExponentBias):
          byte 0 gives 2^-127 and padding byte 255 gives +inf. Allocated padding
          V-scale bytes are still used; padded V is not zeroed after scaling.
          All Br rows and KeyGroup keys in each visited group are evaluated.
          Wholly excluded groups are skipped; only valid rows are stored.
        symbol:
          Br: {meaning: Grouped query rows per worktile, binding: "bind:design.work_schedule::Br"}
          Qraw: {meaning: Query payload view for the grouped row tile, shape: [row: Br, channel: D], dtype: "ref:contract.algorithm_requirement::q_tensor.dtype"}
          Kraw: {meaning: Key payload view for the current key group, shape: [key: KeyGroup, channel: D], dtype: "ref:contract.algorithm_requirement::k_tensor.dtype"}
          Vraw: {meaning: Value payload view for the current key group, shape: [key: KeyGroup, channel: D], dtype: "ref:contract.algorithm_requirement::v_tensor.dtype"}
          QueryScale: {meaning: Decoded query block scales, shape: [row: Br, channel_block: "D/Block"], dtype: fp32, retention: "keep_value (b,kh,a)"}
          KeyScale: {meaning: Decoded key block scales, shape: [key: KeyGroup, channel_block: "D/Block"], dtype: fp32, retention: "keep_value (b,kh,a,g)"}
          ValueScale: {meaning: BF16 key-axis value scales, shape: [sequence_block: "KeyGroup/Block", channel: D], dtype: bf16, retention: "keep_value (b,kh,a,g)"}
      - step: scores
        name: Raw FP8 block products with rank-one scale corrections
        math: |
          Initialize A(-1)[u,v]=0. For k=0,...,D/Block-1:
          T_k=mm32(Qraw[:,Block*k:Block*(k+1)],
                   Kraw[:,Block*k:Block*(k+1)]^T).
          A(k)[u,v]=fma32(T_k[u,v]*QueryScale[u,k],
                         KeyScale[v,k],A(k-1)[u,v]).
          The multiplication before fma32 rounds separately to FP32.
          Let scale=fp32(D^(-1/2)). Set Score[u,v]=A(D/Block-1)[u,v]*scale,
          then replace entries outside lo(u)<=g*KeyGroup+v<=hi(u) by -inf.
          For r=0,...,3, reduce the pairs Score[u,8*n+2*r:8*n+2*r+2]
          for n=0,...,15 with fmax starting at -inf, obtaining R[r].
          GroupMax[u]=fmax(fmax(R[0],R[1]),fmax(R[2],R[3])).
          fmax selects the non-NaN argument when only one argument is NaN,
          following the source fmaxf behavior.
        symbol:
          Score: {meaning: Scaled and masked scores for the current group, shape: [row: Br, key: KeyGroup], dtype: fp32, retention: "keep_value (b,kh,a,g)"}
        arithmetic:
          accumulate: >-
            Each 32-channel FP8 product starts at zero. The scale correction
            is ordered by channel block, without separately decoded FP32 Q/K
            operands. FP32 MMA accumulation does not assert the reference's
            internal reduction order or rounding.
      - step: normalize
        name: Delayed maximum and four carried denominator partials
        math: |
          Initialize MaxState(cLo-1)[u]=-inf and DenPart(cLo-1)[u,r]=0
          for r=0,...,3. Let beta=16 when D=128, otherwise 1.
          MaxState(g)[u]=GroupMax[u] if GroupMax[u]-MaxState(g-1)[u]>
          fp32(2.7725887222397812), otherwise MaxState(g-1)[u]; NaN comparisons
          are false. safe[u]=MaxState(g)[u] if finite, otherwise 0.
          alpha[u]=expf(MaxState(g-1)[u]-safe[u]) if the old state is finite,
          otherwise 0. Prob[u,v]=expf(Score[u,v]-safe[u])*beta,
          with separate FP32 subtraction, exponential and bias multiplication.
          Prob8[u,v]=satfinite_e4m3_rne(Prob[u,v]), the hardware saturating
          RNE conversion; finite nonnegative values saturate at ProbabilityMax.
          For each r=0,...,3 and p=0,1, compute
          E[u,r,p]=sum_{n=0}^{15} Prob[u,8*n+2*r+p] using increasing n,
          left-to-right FP32 additions starting from zero.
          DenPart(g)[u,r]=DenPart(g-1)[u,r]*alpha[u]+(E[u,r,0]+E[u,r,1]),
          following the source scalar FP32 update under compiler defaults;
          no additional contraction restriction is imposed on this update.
          Multiplication of carried state by exactly one may be skipped.
          The four partials are not merged between groups. Only unrounded
          Prob supplies DenPart. Fully masked entries have Prob=Prob8=0;
          their value products are still evaluated.
        symbol:
          MaxState: {meaning: Delayed row maximum, shape: [row: Br], dtype: fp32, retention: "carry_forward (b,kh,a); g=cLo-1..cHi"}
          DenPart: {meaning: Four separately carried unrounded-probability sums, shape: [row: Br, partial: 4], dtype: fp32, retention: "carry_forward (b,kh,a); g=cLo-1..cHi"}
          E: {meaning: Two ordered probability sums per partial in the current group, shape: [row: Br, partial: 4, component: 2], dtype: fp32}
        arithmetic:
          approx: >-
            alpha and Prob use scalar CUDA expf under the source's -O3 build
            without --use_fast_math. unknown: no matched error bound for this
            fused path or its probability-rounding boundaries is supplied.
            The shared scoped BF16-partial margin record supplies no guarantee
            for these computations.
      - step: value_output
        name: BF16 value product and direct outputs
        math: |
          For the current group,
          Vbf[v,d]=bf16(bf16(Vraw[v,d])*ValueScale[floor(v/Block),d]),
          using a BF16 multiplication and retaining its rounded result.
          Initialize NumState(cLo-1)[u,d]=0. For each g, start
          C(-1)[u,d]=NumState(g-1)[u,d]*alpha[u], with a multiply by one
          skipped when selected by the source. For t=0,...,KeyGroup/16-1,
          Pfrag[u,v]=bf16(Prob8[u,16*t+v]), 0<=v<16, and
          C(t)=mma32(Pfrag,Vbf[16*t:16*t+16,:],C(t-1)).
          E4M3-to-BF16 widening is exact for finite values and preserves NaN.
          NumState(g)=C(KeyGroup/16-1). Pfrag is consumed before the next chunk;
          no full rounded-probability tile is retained.
          After g=cHi, let Z[u]=(DenPart(g)[u,0]+DenPart(g)[u,1])+
                                (DenPart(g)[u,2]+DenPart(g)[u,3]).
          Set live[u]=(Z[u]>0), inv[u]=1/Z[u] when live, otherwise 0.
          Write valid rows as O[b,h,i,d]=bf16(NumState(g)[u,d]*inv[u])
          when live, otherwise bf16(0), using RNE.
          When LSE is present write MaxState(g)[u]+logf(Z[u]/beta)
          if live and MaxState is finite, otherwise -inf.
          Vbf is discarded after the group's last PV use; carried states are
          discarded after output. Zero probabilities do not suppress products
          with Inf/NaN Vbf. Workspace remains untouched; the host returns None
          without reading initial output contents.
        symbol:
          Vbf: {meaning: Decoded and scaled BF16 values, shape: [key: KeyGroup, channel: D], dtype: bf16, retention: "keep_value (b,kh,a,g)"}
          Pfrag: {meaning: BF16-widened rounded probabilities for the current chunk, shape: [row: Br, key: 16], dtype: bf16}
          NumState: {meaning: FP32 numerator from rounded probabilities and BF16 values, shape: [row: Br, channel: D], dtype: fp32, retention: "carry_forward (b,kh,a); g=cLo-1..cHi"}
        arithmetic:
          accumulate: >-
            PV uses ordered 16-key BF16 products directly accumulating into
            the rescaled FP32 numerator. BF16 V scaling can round subnormal
            products differently from FP32 reference decoding.
          approx: >-
            The final reciprocal and scalar CUDA logf follow the source build.
            unknown: no matched end-to-end O/LSE error bound is supplied.
    ledger:
      baseline: >-
        Direct Contract evaluation retaining full FP32 score/probability and
        E4M3 probability arrays; logical payload bytes are counted. Worktile
        counts below include padded rows and the visited key groups.
      footprint:
        - {item: Scores and probabilities, change: "9*B*H*Sq*Skv global bytes -> no global intermediate; per worktile retain 4*Br*KeyGroup Score bytes, 2*KeyGroup*D Vbf bytes and 4*Br*(D+5) logical carried-state bytes", by: [scores, normalize, value_output]}
      matmul:
        - {item: Products including padding and masks, change: "Per (b,kh,a), 2*G*min(Qph,Sq-q0)*Skv*D MACs -> 2*Br*KeyGroup*Ng*D MACs", by: [domain, scores, value_output]}
      vector:
        - {item: Post-dot scale corrections, change: "0 -> Br*KeyGroup*(D/Block)*Ng FP32 multiplications and the same number of FMAs per worktile; KeyGroup*D*Ng V scale multiplications use BF16 instead of FP32", by: [scores, value_output]}
      depth:
        - {item: Delayed state recurrence, change: "ceil_div(Skv,KeyGroup) -> Ng ordered transitions per worktile", by: [domain, normalize]}
      error:
        - {item: Numerical departures, change: "Blockwise post-dot Q/K scaling, BF16 V scaling, direct carried PV accumulation and final-only denominator reduction replace reference evaluation choices; no end-to-end bound is asserted", by: [scores, normalize, value_output]}
  work_schedule:
    thesis: >-
      Assign one CTA all grouped heads for a query tile and its complete useful
      key interval. Q is reused across groups and K/V across heads; the full
      recurrence remains local, avoiding split workspace and combine work at
      the cost of a sequential key-group traversal per CTA.
    flow:
      launch: [{phase: [main]}]
    phase:
      main:
        describe: >-
          One fused kernel computes scores, normalization, PV, O and optional
          LSE. The prepared Model.forward resolves HostPlan as in when; this
          path does not encode tensor maps. The host may replay a cached graph,
          capture and instantiate this sequence, or submit directly if no graph
          launch succeeds. Capture records without executing kernels. Each
          successful route executes the same single main phase on the caller
          stream without a host completion wait or scratch-initialization kernel.
        decomposition:
          strategy: >-
            Br=64. Use the domain step's G, Qph, row map and cLo..cHi interval.
            Each (kvflat,a) tile has kvflat=b*KH+kh and covers G heads with Qph
            queries per head. The last tile computes padding but writes only
            i<Sq. All maxima, denominator reductions and channel contractions
            are local to this worktile. LSE is written only when its destination
            exists. D/Block QK contractions and D/128 V-scale atoms parameterize
            both supported channel dimensions.
          partition:
            kvflat: {size: "B*KH", tile: 1}
            query: {size: Sq, tile: Qph}
          worktile:
            invariant:
              q_tensor: {shape: [head: G, query: Qph, channel: D], dtype: "ref:contract.algorithm_requirement::q_tensor.dtype"}
              sf_q: {shape: [scale_row: Br, scale_column: "D/Block"], dtype: "ref:contract.algorithm_requirement::sf_q.dtype"}
            iteration:
              k_tensor: {shape: [key: KeyGroup, channel: D], dtype: "ref:contract.algorithm_requirement::k_tensor.dtype", direction: ascending}
              v_tensor: {shape: [key: KeyGroup, channel: D], dtype: "ref:contract.algorithm_requirement::v_tensor.dtype", direction: ascending}
              sf_k: {shape: [scale_row: KeyGroup, scale_column: "D/Block"], dtype: "ref:contract.algorithm_requirement::sf_k.dtype", direction: ascending}
              sf_v: {shape: [channel: D, sequence_block: "KeyGroup/Block"], dtype: "ref:contract.algorithm_requirement::sf_v.dtype", direction: ascending}
          target:
            single_tile:
              O: {shape: [head: G, query: "min(Qph,Sq-q0)", channel: D], dtype: "ref:contract.algorithm_requirement::O.dtype"}
              LSE: {shape: [head: G, query: "min(Qph,Sq-q0)"], dtype: "ref:contract.algorithm_requirement::LSE.dtype"}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: "B*KH*ceil_div(Sq,Qph)"
        schedule:
          strategy: >-
            Physical grid=(ceil_div(Sq,Qph),B*KH,1), with x=a and y=kvflat.
            worker_id=x+ceil_div(Sq,Qph)*y is the logical worktile number.
            Each CTA finishes its one assigned tile; masks do not remap CTAs.
            Different CTAs share no writable intermediate state.
          worktile_order:
            - {by: kvflat, direction: ascending}
            - {by: query, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: >-
      Four cooperative warps retain Q in shared memory and full score/numerator
      fragments in registers. Two raw K/V slots overlap next-group cp.async
      transfers with current work. One decoded BF16 V slot is reused after the
      group-end CTA barrier joins all synchronous PV readers.
    phase:
      main:
        domain:
          g: [cLo, "cHi+1"]
        resource:
          Query:
            space: SMEM
            member_slot_shape: [row: Br, channel: D]
            dtype: fp8_e4m3fn
            slot_count: 1
            view: {Qraw: {}}
          Key:
            space: SMEM
            member_slot_shape: [key: KeyGroup, channel: D]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"Kraw(g)": {slot_index: "(g-cLo)%2"}}
          Value:
            space: SMEM
            member_slot_shape: [key: KeyGroup, channel: D]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {"Vraw(g)": {slot_index: "(g-cLo)%2"}}
          KeyAtom:
            space: SMEM
            member_slot_shape: [element: "KeyGroup*(D/Block)"]
            dtype: uint8
            slot_count: 2
            view: {"KeyAtom(g)": {slot_index: "(g-cLo)%2"}}
          ValueAtom:
            space: SMEM
            member_slot_shape: [element: "512*(D/128)"]
            dtype: uint8
            slot_count: 2
            view: {"ValueAtom(g)": {slot_index: "(g-cLo)%2"}}
          QueryScale: {space: SMEM, member_slot_shape: [row: Br, channel_block: "D/Block"], dtype: fp32, slot_count: 1}
          KeyScale: {space: SMEM, member_slot_shape: [key: KeyGroup, channel_block: "D/Block"], dtype: fp32, slot_count: 1}
          ValueScale: {space: SMEM, member_slot_shape: [sequence_block: "KeyGroup/Block", channel: D], dtype: bf16, slot_count: 1}
          Vbf: {space: SMEM, member_slot_shape: [key: KeyGroup, channel: D], dtype: bf16, slot_count: 1}
          Score: {space: register, member_slot_shape: [row: Br, key: KeyGroup], dtype: fp32, slot_count: 1}
          NumState: {space: register, member_slot_shape: [row: Br, channel: D], dtype: fp32, slot_count: 1}
          RowState:
            space: register
            member_slot_shape: [row: Br, partial: 4, field: 2]
            dtype: fp32
            slot_count: 1
            view:
              MaxState: {part: {field: [0, 1]}}
              DenPart: {part: {field: [1, 2]}}
          E: {space: register, member_slot_shape: [row: Br, partial: 4, component: 2], dtype: fp32, slot_count: 1}
          Pfrag: {space: register, member_slot_shape: [row: Br, key: 16], dtype: bf16, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:4]"
              verb:
                setup: >-
                  Establish this CTA's coordinates and masks. The q0>=Sq guard
                  precedes copying; the exact launch grid cannot take it. Each
                  warp owns 16 rows; each four-lane subgroup shares two rows
                  and partitions paired key/output columns across its lanes.
                  MaxState has four replicas per row, while DenPart has four
                  distinct partials. All four warps stage data and join CTA barriers.
                prime: >-
                  Enqueue Kraw, Vraw, KeyAtom and ValueAtom for cLo into slot 0
                  and commit a copy group. done means enqueue and commit, not
                  copy completion. Payloads zero-fill keys outside Skv through
                  the source-size operand; atoms include all allocated padding bytes.
                prepare: >-
                  Load/store Qraw into Query and decode QueryScale, publishing
                  both at a CTA barrier. Invalid query payloads and scales are
                  zero. Initialize NumState, MaxState and DenPart as in math_reshape.
                  Query and QueryScale survive all groups. Ordinary Q loads may
                  overlap the primed copies.
                prefetch: >-
                  For g<cHi, enqueue next-group K/V payloads and atoms into
                  slot (g+1-cLo)%2. Commit on every iteration, including an empty
                  group at g=cHi. The last action reads/writes no payload but
                  retains issue/done events; done means enqueue/commit only.
                  The first target slot is unused. Later, the previous group-end
                  barrier has joined all readers of its old g-1 version.
                land: >-
                  Wait until only the newest committed group may remain pending,
                  then join the CTA. Current K/V payloads and atoms become readable
                  to all warps while next-group copies may continue. On the last
                  iteration the newest commit is empty; no final wait_group<0>
                  is added.
                decode: >-
                  Decode KeyAtom to KeyScale, zeroing j>=Skv entries. Decode
                  ValueAtom to packed BF16 ValueScale, including padding scales.
                  Publish scales at a CTA barrier, then convert and scale Vraw
                  into Vbf and publish it at another CTA barrier. The preceding
                  group-end barrier protects the single Vbf and decoded-scale
                  slots against overwriting earlier readers.
                qk: >-
                  Load Q/K fragments and perform scores with synchronous FP8 MMA,
                  in D/Block channel blocks and 8-key result fragments. Retain
                  the entire scaled Score in registers. A warp-wide mask
                  intersection skips individual mask tests only when the whole
                  group lies inside every row's bounds. Local pair maxima and
                  two four-lane shuffle stages produce the full-group maximum.
                  done includes current Q/K reads and the register score result.
                advance: >-
                  Apply normalize's maximum update. If any lane in a warp has
                  a nonunit alpha for either owned row, rescale that warp's
                  NumState and DenPart; otherwise leave them unchanged. Initialize
                  E to zero. Score survives all current probability chunks.
                probability_value: >-
                  For chunk t, compute Prob and Pfrag from Score, append the
                  two 8-key halves to E in the defined order, and consume Pfrag
                  with synchronous BF16 PV MMA over all D output channels.
                  done includes this fragment's Pfrag/Vbf reads and updated
                  register numerator. Pfrag can then be overwritten for t+1.
                close: >-
                  Add E's component pairs to the rescaled DenPart. A CTA barrier
                  joins current raw-input, decoded-scale and Vbf readers before
                  the next prefetch/decode. Score and E are dead; NumState,
                  MaxState and DenPart carry forward.
                write: >-
                  Merge DenPart with two four-lane shuffle-add stages and perform
                  value_output. Each lane writes paired BF16 output channels;
                  one lane per subgroup writes optional LSE for each valid owned
                  row. Padding issues no output stores. done means ordinary stores
                  consumed their register sources, without a host or device-wide
                  completion wait. No next worktile is assigned. All payload copies
                  were waited before use; the last empty commit adds no payload
                  to drain. Kernel completion provides caller-stream visibility.
                  Later invocations initialize fresh CTA numerical state.
            pipe:
              prologue: ["setup:Local", "prime:Inputs", "prepare:Query"]
              steady:
                - repeat: g
                  steady:
                    - "prefetch:Next(g)"
                    - "land:Inputs(g)"
                    - "decode:Values(g)"
                    - "qk:Score(g)"
                    - "advance:RowState(g)"
                    - repeat: {t: [0, "KeyGroup/16"]}
                      steady: ["probability_value:Chunk(g,t)"]
                    - "close:Group(g)"
              epilogue: ["write:Output"]
realization:
  require:
    - item: "design.tile_pipeline::main.Main"
      choice: >-
        Bind enqueue/land to fmha_common.cuh's cp_async16, cp_async_commit and
        cp_async_wait<1>, with __syncthreads at the stated publication and reuse
        boundaries. Preserve the final empty commit. Use compatible
        fp8_tile_offset and bf16_tile_offset layouts with ldmatrix loads,
        mma_fp8_16832 and mma_bf16_16816 for register-result QK and PV.
      reason: >-
        Copy-group counting establishes current-slot readiness while the next
        transfer may continue. Compatible layouts and synchronous register-result
        products supply the operand mapping and completed-read guarantees needed
        by the single Vbf slot and register lifetimes.
