material_format: kernelschema.row_softmax.materials.v1
publication_status: unbound_materials
task_id: row_softmax_fp32_v1
abi:
  source_format: single_file
  entrypoint: kernel.py::Model
  base_class: torch.nn.Module
  constructor: Model()
  method: forward(self, x, out)
  keyword_arguments: [x, out]
  return: identical out object
tensors:
  x:
    dtype: float32
    device: cuda
    shape: [M, N]
    stride: [N, 1]
    storage_offset: any legal offset
    requires_grad: false
    range: finite values in [-20, 20]
    mutability: none
  out:
    dtype: float32
    device: same CUDA device as x
    shape: [M, N]
    stride: [N, 1]
    storage_offset: any legal offset
    requires_grad: false
    initial_contents: arbitrary, including NaN
    mutability: original logical output region only
domain:
  M: [1, 32]
  N: [128, 1024]
  storage_aliasing: x and out must not share storage
  unsupported_inputs: reject at trusted Task preparation or adapter admission
execution:
  inference_mode: true
  eager: true
  single_call_stream: true
  cuda_graph: unsupported
  concurrent_streams: unsupported
  repeated_calls: recompute changed legal x after preparation and warmup
  prohibited_dependencies: [test number, invocation order, precomputed outputs]
math:
  snapshot: save x FP32 bytes before the candidate call
  golden_dtype: CPU IEEE binary64
  formula: 'z=FP64(x_before); m[i]=max_j z[i,j]; g[i,j]=exp(z[i,j]-m[i])/sum_k exp(z[i,k]-m[i])'
  actual_conversion: promote original out region values to FP64 for comparison
  finite_output_required: true
  elementwise_error: 'abs(FP64(actual[i,j])-g[i,j]) <= 2e-6 + 2e-5*abs(g[i,j])'
hard_postconditions:
  - returned object is the supplied out object
  - original out storage and view signature are unchanged
  - original output region is fully written and passes every element comparison
  - x object, original storage, view signature and bytes are unchanged
  - all backing bytes outside the original out output region are unchanged
  - evaluator files are not writable by the candidate
view_signature: [object identity, storage identity, storage_offset, shape, stride, dtype, device]
storage_verification: retain live original storage and backing references across the call
limits: finite canary and offset samples do not prove arbitrary layout or device memory safety
