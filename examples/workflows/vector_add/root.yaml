META_DATA:
  Name: vector_add
  Describe: Elementwise y = x + alpha * residual over two equal-length bfloat16 one-dimensional tensors.
  Version: 2
CONTRACT:
  Algorithm_requirement:
    Input:
      x:
        meaning: first addend tensor
        shape: [{elem: n}]
        dtype: bfloat16
      residual:
        meaning: tensor scaled by alpha before being added to x
        shape: [{elem: n}]
        dtype: bfloat16
      alpha:
        meaning: scalar multiplier of residual; Model init argument, default 1.0, passed as a Python float; task cases use 1.0, 0.5, 2.0
        shape: []
        dtype: float32
    Output:
      y:
        meaning: y[i] = x[i] + alpha * residual[i]
        shape: [{elem: n}]
        dtype: bfloat16
    Compute:
      - Name: scaled_add
        Math: |
          y[i] = x[i] + alpha * residual[i], i in [0, n)
          x and residual are separate contiguous one-dimensional CUDA tensors,
          both bfloat16, with the same length n; alpha is a runtime scalar.
          Task cases (shape ID, n, alpha): (0, 1024, 1.0), (1, 65536, 0.5),
          (2, 1048576, 2.0).
          The public call surface is Model(alpha).forward(x, residual); the
          delivered Model wrapper keeps this signature and returns the
          bfloat16 tensor y without changing dtype or shape.
    Golden_reference:
      Source: reference.py::Model.forward
      Tolerance:
        output: unknown; assessed by the standard AKA Atrex-Bench evaluator, explicit threshold not supplied
  Hardware_specification:
    Device: AKA L20D
    Architecture: unknown; CUDA platform, microarchitecture details not supplied
    Execution:
      unit: Triton program on CUDA
    Feature:
      mechanism: none required beyond coalesced global memory load and store
    Stack:
      Language: Triton
      Toolchain: AKA native runtime with Triton on CUDA; versions unknown
    Wiki:
      Hardware: unknown; not supplied
      Programming:
        Language: unknown; not supplied
      Microbench: unknown; not supplied
      Sota:
        Kernel: unknown; not supplied
        Schema: unknown; not supplied
      Profile: unknown; not supplied
DESIGN:
  Math_reshape:
    Thesis: >
      Direct elementwise evaluation is retained: one fused kernel reads x and
      residual once each and writes y once, the minimum possible traffic
      (2 reads + 1 write per element), with no reduction, recurrence or reuse
      across indices, so no rewrite can remove work or materialization. The
      numerical path deliberately follows the eager reference instead of one
      fused expression: PyTorch evaluates alpha * residual first as a bfloat16
      elementwise op whose product is rounded to bfloat16, then adds x as a
      second bfloat16 op whose sum is rounded to bfloat16. The kernel
      reproduces these two rounding boundaries explicitly; wider internal
      arithmetic is acceptable inside each step, but the intermediate product
      must be rounded to bfloat16 before the addition so results match the
      reference.
    Rewrite:
      - Name: direct_elementwise
        Math: |
          alpha_bf16 = bf16_round(alpha)
          product[i] = bf16_round(alpha_bf16 * residual[i])
          y[i] = bf16_round(x[i] + product[i]), i in [0, n)
          All memory traffic is bfloat16; product lives only in registers and
          is never materialized to global memory. No constants are fixed at
          this layer; alpha is a runtime scalar argument.
  Work_schedule:
    Thesis: >
      The single one-dimensional axis is cut into contiguous tiles of 1024
      elements; each Triton program computes exactly one tile end to end, so
      there are no partial results, no cross-tile reduction and no handoff.
      Elementwise indexing is offsets = program_id(0) * 1024 + arange(0, 1024),
      guarded by offsets < n. Worker count ceil_div(n, 1024) gives grid sizes
      1, 64 and 1024 for the three task cases; a masked tail keeps the kernel
      valid for any n. Tile size 1024 is an unmeasured first-cut starting
      point: the supplied stage feedback records no Triton candidate (the only
      implementation attempt timed out without source changes and the v1 pass
      and timings are carried forward from the incumbent), so block size, warp
      count and latency are assumptions to check with the standard AKA
      evaluator, not demonstrated tuning results.
    Step:
      MAIN:
        Describe: >
          One program per tile: form the offset range program_id(0) * 1024 +
          [0, 1024), mask lanes beyond n, load the x and residual slices with
          contiguous masked loads, evaluate the two-step bfloat16 expression,
          store the y slice with a contiguous masked store.
        Decomposition:
          Partition:
            elem:
              meaning: element index over the three one-dimensional tensors
              size: n
              tile: 1024
          Target:
            Single_tile:
              y:
                meaning: contiguous 1024-element slice of the output for one tile, tail lanes masked
                shape: [{elem: 1024}]
                dtype: bfloat16
        Mapping:
          Worker:
            unit: Triton program
            unit_count: 1
          Worker_count: "ceil_div(n, 1024)"
        Schedule:
          Worktile_order: [{by: elem, direction: ascending}]
          Worker_assignment:
            Refill: none; each program statically owns the tile indexed by program_id(0)
            Exit: after the masked store of the tile is issued; no shared state or reusable resources to release
    Flow:
      Launch: [{step: [MAIN]}]
  Tile_pipeline:
    Thesis: >
      A single MAIN role executes the whole tile in registers; no shared
      memory, no events and no multi-buffering are needed for this
      bandwidth-bound elementwise kernel. The two loads are independent and
      may complete in any order; compute consumes both, and the store consumes
      the computed tile. Overlap of memory and math is left to the compiler
      and hardware. This is the deliberately simple single-kernel approach the
      task asks for; splitting roles or deepening buffers has no identified
      benefit and no measurement backing.
    Step:
      MAIN:
        Role:
          MAIN:
            Info:
              Describe: >
                Every participating lane loads its x and residual elements,
                evaluates the elementwise bfloat16 math and stores its output
                element, all masked to the valid range.
              Member: all threads of the Triton program
              Using_verb:
                load:
                  x:
                    execution_mode: vectorized global load
                    describe: masked contiguous bfloat16 slice of x, one element per lane
                  residual:
                    execution_mode: vectorized global load
                    describe: masked contiguous bfloat16 slice of residual, one element per lane
                compute:
                  output:
                    execution_mode: elementwise bfloat16
                    describe: >
                      product = bf16(alpha) * residual rounded to bfloat16,
                      then y = x + product rounded to bfloat16; two separate
                      rounding steps as in the reference
                store:
                  output:
                    execution_mode: vectorized global store
                    describe: masked contiguous bfloat16 write of the y tile
            Pipe:
              - load:x
              - load:residual
              - compute:output
              - store:output
            Waiting:
              "compute:output":
                after: [load:x, load:residual]
                state: Prepared
              "store:output":
                after: [compute:output]
                state: Prepared
REALIZATION:
  Require:
    - Expose the public interface unchanged - a Model(nn.Module) wrapper whose __init__(alpha, default 1.0) stores the Python float and whose forward(x, residual) launches the kernel over the full length n and returns the bfloat16 output tensor with the input shape.
    - Mask tail lanes in both loads and the store so out-of-range elements are neither read nor written for arbitrary n.
    - Keep two separate bfloat16 rounding steps, product first then sum, to reproduce reference numerics; cast alpha to bfloat16 inside the kernel before the multiply, matching PyTorch promotion of the Python scalar to the common dtype.
  Prefer:
    - Let the Triton compiler choose the concrete vector width for the contiguous bfloat16 accesses; no manual memory intrinsics are needed for this first implementation.
    - Treat tile size 1024 and the resulting grid sizes as an unmeasured starting point; revisit launch choices only after the standard AKA evaluator reports real correctness and latency for an actual Triton kernel.
  Forbid:
    - Do not fuse the expression into one multiply-add rounded only once at the end; it changes the per-op bfloat16 rounding of the reference.
