meta_data:
  name: paged_grouped_query_decode_attention
  describe: Compute right-aligned causal attention against a paged FP8 KV cache; overwrite BF16 out.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_decode/aka_solution/solution.py::Model.forward
  version: 2
  dispatch:
    id: fa4_decode.q1_direct
    when: |
      Select exactly when q_len_per_req=1 and ceil(max_seq_len/256)=1.
contract:
  algorithm_requirement:
    constant:
      HeadCount: {value: 16, meaning: Query head count.}
      KVHeadCount: {value: 1, meaning: KV head count.}
      D: {value: 256, meaning: 'Query, key and value dimension.'}
      PageSize: {value: 64, meaning: Tokens per cache page.}
      TableWidth: {value: 16434, meaning: Block-table entries per request.}
    input:
      query: {meaning: Query tail, shape: [{query: TotalQuery}, {head: HeadCount}, {d: D}], dtype: fp8_e4m3fn}
      kv_cache: {meaning: HND cache with key at selector 0 and value at selector 1, shape: [{page: PageCount}, {selector: 2}, {kv_head: KVHeadCount}, {page_token: PageSize}, {d: D}],
        dtype: fp8_e4m3fn}
      workspace_buffer: {meaning: Scratch zeroed before first isolated use; not a semantic output., shape: [{byte: WorkspaceBytes}], dtype: uint8}
      block_tables: {meaning: Logical-to-physical page map., shape: [{batch: BatchCount}, {page_index: TableWidth}], dtype: int32, range: -1 <= block_tables < PageCount; valid pages
          are nonnegative}
      seq_lens: {meaning: KV lengths including the query tails., shape: [{batch: BatchCount}], dtype: int32, range: q_len_per_req <= seq_lens <= PageSize*TableWidth}
      max_seq_len: {meaning: Maximum entry of seq_lens, shape: [], dtype: python_int}
      bmm1_scale: {meaning: Composite score scale including captured quantization scales., shape: [], dtype: fp64, range: [0.0625, 0.0625]}
      bmm2_scale: {meaning: Composite value-output scale, shape: [], dtype: fp64, range: [1.0, 1.0]}
      window_left: {meaning: Full-attention sentinel, shape: [], dtype: python_int, range: [-1, -1]}
      sinks: {meaning: Required None sentinel; sinks disabled., shape: [], dtype: '<schema-abi@pending:Python-None-sentinel>', range: None}
      o_sf_scale: {meaning: Required None sentinel; output scaling tensor disabled., shape: [], dtype: '<schema-abi@pending:Python-None-sentinel>', range: None}
      out: {meaning: Destination; incoming contents are ignored., shape: [{query: TotalQuery}, {head: HeadCount}, {d: D}], dtype: bf16, range: Any BF16 bit pattern; never read before
          overwrite.}
      q_len_per_req: {meaning: Number of query-tail tokens per request, shape: [], dtype: python_int, range: [1, 1]}
    output:
      output: {meaning: 'Returned tensor, aliasing out.', shape: [{query: TotalQuery}, {head: HeadCount}, {d: D}], dtype: bf16}
      out_after: {meaning: In-place replacement of input out; identical to output., shape: [{query: TotalQuery}, {head: HeadCount}, {d: D}], dtype: bf16}
    compute:
    - name: Interpret the captured callable boundary
      math: |
        python_int denotes a Python integer; fp64 scalar arguments are Python binary64 floats.
        TotalQuery=BatchCount*q_len_per_req; max_seq_len=max_b seq_lens[b]; L_b=seq_lens[b].
        All tensors are contiguous on one CUDA device; sinks=None and o_sf_scale=None.
        For 0<=b<BatchCount, the first ceil(L_b/PageSize) block-table entries are valid pages.
        For 0<=k<L_b and 0<=d<D, let page=block_tables[b,floor(k/PageSize)]:
          K[b,k,d]=kv_cache[page,0,0,k%PageSize,d]; V[b,k,d]=kv_cache[page,1,0,k%PageSize,d].
        The timed boundary includes any partial-result combination; cache construction is outside it.
      symbol:
        K: {meaning: Logical keys after page lookup, shape: [{batch: BatchCount}, {kv: max_seq_len}, {d: D}], dtype: fp8_e4m3fn}
        V: {meaning: Logical values after page lookup, shape: 'ref:K.shape', dtype: fp8_e4m3fn}
    - name: Attend to the right-aligned query tail
      math: |
        For independent b,t,h with 0<=b<BatchCount, 0<=t<q_len_per_req, 0<=h<HeadCount:
          visible_key(b,t)={k in integers | 0<=k<=L_b-q_len_per_req+t}.
          score[b,t,h,k]=bmm1_scale*sum_{d=0}^{D-1} query[b*q_len_per_req+t,h,d]*K[b,k,d].
          m=max_{k in visible_key(b,t)} score[b,t,h,k]; Z=sum_{k in visible_key(b,t)} exp(score[b,t,h,k]-m).
          probability[b,t,h,k]=exp(score[b,t,h,k]-m)/Z on visible_key(b,t), and zero otherwise.
          output[b*q_len_per_req+t,h,d]=bf16(bmm2_scale*sum_{k in visible_key(b,t)} probability[b,t,h,k]*V[b,k,d]).
        All visible sets are nonempty. out_after=output; return the same tensor object as out; no LSE is returned.
      symbol:
        visible_key: {meaning: Valid causal keys for one tail token, shape: not_applicable, dtype: not_applicable}
        score: {meaning: Scaled query-key score on valid logical keys, shape: [{batch: BatchCount}, {query_tail: q_len_per_req}, {head: HeadCount}, {kv: max_seq_len}], dtype: fp32}
        probability: {meaning: Softmax probability on valid logical keys, shape: 'ref:score.shape', dtype: fp32}
    golden_reference:
      source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_decode/reference.py::Model.forward
      tolerance: {output: 'atol=0.06, rtol=0.04', out_after: 'atol=0.06, rtol=0.04'}
  hardware_specification:
    device: NVIDIA L20D
    arch: SM103
    execution: {warp: '<hardware-execution@pending:L20D/warp>', CTA: '<hardware-execution@pending:L20D/CTA>', cluster: '<hardware-execution@pending:L20D/cluster>'}
    feature: {SMEM: '<hardware-feature@pending:L20D/SMEM>', TMEM: '<hardware-feature@pending:L20D/TMEM>', register: '<hardware-feature@pending:L20D/register>'}
    stack: {language: 'CuTe DSL, nvidia-cutlass-dsl 4.6.1', toolchain: 'nvidia-cutlass-dsl 4.6.1 compiler; torch>=2.9 and cuda-python as declared; <toolchain@pending:CUDA-and-cuda-python-versions>'}
    wiki:
      hardware: <wiki-hardware@pending:L20D/SM103.md>
      programming: {language: '<wiki-language@pending:CuTe-DSL/4.6.1/>', virtual_isa: '<wiki-virtual-isa@pending:PTX/pending/>', machine_isa: '<wiki-machine-isa@pending:SASS/SM103/>'}
      microbench: <wiki-microbench@pending:L20D/>
      sota: {kernel: '<wiki-sota-kernel@pending:L20D/>', schema: '<wiki-sota-schema@pending:L20D/>'}
      profile: <wiki-profile@pending:NVIDIA/>
design:
  math_reshape:
    thesis: Stream the sole key block without score/probability materialization. Pack heads and query tokens into matrix columns; two FP8 probability components feed the numerator
      while its denominator remains FP32.
    rewrite:
    - step: block
      name: Pack the query and retain one key block
      math: |
        For request b and query block q, x=h+HeadCount*t, 0<=t<QueryTile, 0<=h<HeadCount,
        t_abs=q*QueryTile+t, and Qpack[x,:]=query[b*q_len_per_req+t_abs,h,:].
        For 0<=u<Bk, let page=floor(u/PageSize), id=block_tables[b,page].
          Kblk[u,:]=kv_cache[id,0,0,u%PageSize,:], Vblk[u,:]=kv_cache[id,1,0,u%PageSize,:] if id>=0; otherwise zero.
        The speculative first-page lookup includes unused table entries; visibility is enforced on S, not on gathered K/V.
        ScoreBlock=mm32(Kblk,Qpackᵀ).
      symbol:
        Bk: {meaning: Key-block length., binding: 'bind:design.work_schedule::Bk'}
        QueryTile: {meaning: Queries sharing a KV traversal., binding: 'bind:design.work_schedule::QueryTile'}
        PackedColumns: {meaning: Packed query-head column count., binding: 'bind:design.work_schedule::PackedColumns'}
        Qpack: {meaning: Packed query rows., shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn, life: 'stored (b,q)'}
        Kblk: {meaning: Padded logical key block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        Vblk: {meaning: Padded logical value block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        ScoreBlock: {meaning: Raw key-query product before the softmax mask., shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32}
    - step: exponent
      name: Split scaled probabilities into leading and residual FP8 components
      math: |
        c=fp32(bmm1_scale*log2(e)); rho=448; MinFinite=-3.4028234663852886e38.
        S[u,x]=ScoreBlock[u,x] if u is in visible_key(b,q*QueryTile+floor(x/HeadCount)), otherwise -inf.
        m[x]=c*max(MinFinite,max_u S[u,x]).
        E[u,x]=exp2_fast(c*S[u,x]-m[x]) for visible keys; otherwise zero.
        P_hi=fp8_e4m3fn(rho*E); P_lo=fp8_e4m3fn(rho*E-P_hi).
        ExponentialSum[v,x]=E[v,x]+E[v+128,x], 0<=v<128; Llocal[x]=sum32_v ExponentialSum[v,x].
      symbol:
        m: {meaning: Running base-two maximum., shape: [{packed_query: PackedColumns}], dtype: fp32}
        P_hi: {meaning: Leading scaled probability., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        P_lo: {meaning: Independently rounded residual., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        ExponentialSum: {meaning: FP32 probability partial sums., shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32}
        Llocal: {meaning: Split denominator., shape: 'ref:m.shape', dtype: fp32}
      arithmetic: {approx: 'exp2_fast is the source fast-math base-two exponential; unknown: <error-bound@pending:fa4_decode/fast-exp2>.'}
    - step: normalize
      name: Normalize the two-component numerator locally
      math: |
        Y=mma32(Vblkᵀ,P_lo,mm32(Vblkᵀ,P_hi)).
        Normalization[x]=rcp_fast(Llocal[x])*fp32(bmm2_scale/rho).
        output[b*q_len_per_req+q*QueryTile+t,h,d]=bf16(Y[d,x]*Normalization[x]); out_after=output.
      symbol:
        Y: {meaning: Scaled local numerator., shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32}
        Normalization: {meaning: Final multiplier., shape: [{packed_query: PackedColumns}], dtype: fp32}
      arithmetic:
        approx: 'rcp_fast is the source approximate reciprocal; unknown: <error-bound@pending:fa4_decode/reciprocal>.'
        accumulate: Each reduction slice accumulates its leading product then its residual into the same FP32 Y; Llocal sums four warp partials.
    ledger:
      baseline: Dense FP32 scores/probabilities in global memory, with one value contraction.
      traffic:
      - {item: Dense intermediates, change: '-16*q_len_per_req*HeadCount*seq_lens[b] bytes per request of score/probability writes and reads.', by: [block, exponent]}
      matmul:
      - {item: Contractions, change: '2*D*seq_lens[b] -> 3*D*Bk MAC per query head; padding and the residual product add work.', by: [block, normalize]}
      error:
      - {item: Probability representation, change: +two FP8 roundings per exponential; denominator remains FP32; fast exp2 and reciprocal add approximation., by: [exponent, normalize]}
  work_schedule:
    thesis: Keep the one-block KV reduction inside one CTA; no split workspace or collective is needed.
    flow: {launch: [{phase: [attention]}]}
    phase:
      attention:
        describe: Compute and normalize one query block within its assigned worker.
        decomposition:
          strategy: Bk=256; QueryTile=1; PackedColumns=HeadCount*QueryTile. The dispatch domain has exactly one KV block per request; load its four logical pages directly from HND
            storage.
          partition: {batch: {size: BatchCount, tile: 1}, query_tail: {size: q_len_per_req, tile: QueryTile}}
          worktile:
            invariant: {Qpack: {shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}, seq_lens: {shape: [{batch: 1}], dtype: int32}}
            iteration: {block_tables: {shape: [{page_index: 4}], dtype: int32, direction: ascending}, Kblk: {shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn, direction: ascending},
              Vblk: {shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn, direction: ascending}}
          target: {single_tile: {output: {shape: [{query_tail: QueryTile}, {head: HeadCount}, {d: D}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, count: 1}, count: worktile_count}
        schedule: {worktile_order: [{by: batch, direction: ascending}, {by: query_tail, direction: ascending}], worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none,
            exit: assigned_done}}
  tile_pipeline:
    thesis: Retain dedicated load and matrix-issue warps for the one-block path; the unused parity still participates in the common drain protocol.
    phase:
      attention:
        resource:
          Qpack: {space: SMEM, shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}
          PageIndex: {space: SMEM, shape: [{page_index: 4}], dtype: int32, slot: 4, view: {PageIndex: {slot: 0}}}
          KV:
            space: SMEM
            shape: [{element: 16384*KVStageCount}]
            dtype: fp8_e4m3fn
            view:
              Kslice(u): {part: {element: [16384*(u%KVStageCount), 16384*(u%KVStageCount+1)]}}
              Vslice(u): {part: {element: [16384*((4+u)%KVStageCount), 16384*((4+u)%KVStageCount+1)]}}
              Ostage: {part: {element: [0, 2*D*PackedColumns]}, dtype: bf16}
          ScoreBlock: {space: TMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32, slot: ScoreStageCount, view: {ScoreBlock: {slot: 0}}}
          P_hi: {space: SMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot: 4, view: {P_hi: {slot: 0}}}
          P_lo: {space: SMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot: 4, view: {P_lo: {slot: 0}}}
          Y: {space: TMEM, shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, slot: 2, view: {Y: {slot: 0}, EmptyY: {slot: 1}}}
          ExponentialSum: {space: TMEM, shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32, slot: 2, view: {ExponentialSum: {slot: 0}, EmptySum: {slot: 1}}}
          Maximum: {space: SMEM, shape: [{packed_query: PackedColumns}], dtype: fp32, view: {m: {}, Normalization: {}}}
          FinalSum: {space: SMEM, shape: [{packed_query: PackedColumns}, {warp: 4}], dtype: fp32}
          TailNumerator: {space: register, shape: [{age: 2}, {d: D}, {packed_query: PackedColumns}], dtype: fp32}
        domain: {u: [0, 4]}
        lane:
          LoadK:
            info:
              member: warp[2:3]
              mode: async
              verb:
                load: Issue Q first, independently of the prefetched page table. K uses four slices; a reused slice waits for its previous matrix operand read.
                turn: {mode: sync, meaning: Release the V issue turn after the last K slice is acquired; transfers need not have completed.}
                prepare:
                  mode: sync
                  meaning: |
                    Use the fixed TableWidth stride to prefetch the first four page indices while the
                    sequence-length fetch, descriptor prefetch and TMEM/pipeline setup progress.
                    The initial lookup does not wait for seq_lens; unused entries may be -1 or name finite cache data,
                    which the subsequent score mask excludes. Join CTA setup, including initialized statistics,
                    before any stream work or empty-split handling; Q is then issued independently of later page lookups.
                    The first page-table address is b*TableWidth.
                    Let R=PackedColumns, T=<cutlass-capacity@pending:4.6.1/get_max_tmem_alloc_cols(sm_100)>,
                    Csm=<cutlass-capacity@pending:4.6.1/get_smem_capacity_in_bytes(sm_100)>.
                    ScoreStageCount=min(4,floor((T-6*R)/(2*R))); allocate next_power_of_two((6+2*ScoreStageCount)*R) TMEM columns.
                    A=180+2324*R+16*ScoreStageCount; pad=128-A%128; K0=floor((Csm-A-pad)/16384);
                    KVStageCount=K0-int(16*K0>pad). Each KV slice is 128-key by 128-d FP8; u orders key-half then d-half.
            pipe: {prologue: ['prepare:Startup'], steady: ['load:Qpack', 'load:Kblk', 'turn:Kready']}
            edge: {data: {'load:Kblk': ['prepare:Startup'], 'prepare:Startup': ['SoftmaxEven/initialize:Statistic']}}
          LoadV:
            info: {member: 'warp[3:4]', mode: async, verb: {load: Load four V slices through the shared per-slice acquire protocol; use the same completed PageIndex as K., store: Transfer
                  BF16 Ostage to out and complete its asynchronous store before worker exit.}}
            pipe: {steady: ['load:Vblk'], epilogue: ['store:output']}
            edge: {data: {'load:Vblk': ['LoadK/prepare:Startup'], 'store:output': ['Correction/publish:Ostage']}, sync: {'load:Vblk': ['LoadK/turn:Kready']}}
          Score:
            info: {member: 'warp[0:1]', mode: async, verb: {turn: {mode: sync, meaning: 'Release Value after the final K operand is acquired, before score completion is required.'},
                wait: {mode: sync, meaning: Join Correction's existing final-sum rendezvous; allow its final Y capture only after this peer arrival.}, publish: {mode: sync, meaning: Reduce
                    four FinalSum warp entries and publish Normalization over the captured maximum storage.}, score: Complete both key halves and both reduction slices into ScoreBlock;
                  return K slices after their operand reads. Wait for each operand slice separately; later transfers may overlap earlier products.}}
            pipe: {steady: ['score:ScoreBlock', 'turn:ScoreReady'], epilogue: ['wait:FinalSum', 'publish:Normalization']}
            edge: {data: {'wait:FinalSum': ['Correction/publish:FinalSum'], 'score:ScoreBlock': ['LoadK/load:Qpack']}}
          Value:
            info: {member: 'warp[1:2]', mode: async, verb: {retire: {mode: sync, meaning: Free TMEM after Correction has captured and returned both Y parities; normalization and
                    Ostage publication may still be pending.}, accumulate: P_pair comprises P_hi and P_lo; accumulate both per V reduction slice into Y parity 0; return V/P after
                  both reads and signal completion of empty parity 1. Wait for each operand slice separately; later transfers may overlap earlier products.}}
            pipe: {steady: ['accumulate:Y'], epilogue: ['retire:TMEM']}
            edge: {data: {'accumulate:Y': ['Correction/zero:Y', 'SoftmaxEven/publish:P_pair']}, sync: {'accumulate:Y': ['Score/turn:ScoreReady']}, reuse: {'retire:TMEM': ['Correction/capture:Y']}}
          SoftmaxEven:
            info: {member: 'warp[4:8]', verb: {read: 'Capture raw ScoreBlock in registers and immediately return its TMEM slot. Let last=ceil(seq_lens[b]/Bk)-1. Apply the contract
                  mask in registers only for logical block last when q_len_per_req>1 or seq_lens[b]%Bk!=0, and also last-1 when 0<seq_lens[b]%Bk<q_len_per_req; interior blocks are
                  mask-free.', publish_max: Update the masked maximum and rendezvous with Correction so it captures m before that shared storage is reused., publish: Publish both
                  FP8 P components together; then publish 128 FP32 partial sums per column in ExponentialSum parity 0., initialize: During CTA setup initialize the shared maximum
                  to -inf and FinalSum to zero.}}
            pipe: {steady: ['read:ScoreBlock', 'publish_max:m', 'publish:P_pair', 'publish:ExponentialSum'], prologue: ['initialize:Statistic']}
            edge: {data: {'read:ScoreBlock': ['Score/score:ScoreBlock']}, sync: {'publish_max:m': ['Correction/zero:Y']}}
          SoftmaxOdd:
            info: {member: 'warp[8:12]', verb: {signal: Signal the initialized empty ExponentialSum parity 1; this role computes no score block in this domain.}}
            pipe: {steady: ['signal:EmptySum']}
            edge: {data: {'signal:EmptySum': ['LoadK/prepare:Startup']}}
          Correction:
            info: {member: 'warp[12:16]', verb: {zero: Zero both Y parities and ExponentialSum parity 1; fence initialization before admitting softmax., read: Capture the sole maximum;
                  drain empty sum parity 1 then the valid parity 0., publish: 'FinalSum publishes four warp partials and arrives at Score''s rendezvous; Ostage normalizes the valid
                  Y, casts to BF16 and aliases the retired KV region.', capture: 'Capture empty parity 1 and valid Y parity 0 into TailNumerator[0:2] (older, newer), returning both
                  TMEM slots; retain these registers through Ostage formation.'}}
            pipe: {steady: ['zero:Y', 'read:m', 'read:ExponentialSum', 'publish:FinalSum', 'capture:Y', 'publish:Ostage']}
            edge:
              data: {'read:m': ['SoftmaxEven/publish_max:m'], 'read:ExponentialSum': ['SoftmaxEven/publish:ExponentialSum', 'SoftmaxOdd/signal:EmptySum'], 'capture:Y': ['Value/accumulate:Y'],
                'publish:Ostage': ['Score/publish:Normalization'], 'zero:Y': ['LoadK/prepare:Startup']}
              sync: {'capture:Y': ['Score/wait:FinalSum']}
              reuse: {'publish:Ostage': ['Score/score:ScoreBlock', 'Value/accumulate:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::attention.Score', 'design.tile_pipeline::attention.Value']
    choice: tcgen05.mma with FP8 E4M3FN operands and FP32 TMEM accumulation; completion-aware operand release.
    reason: The pipeline exchanges TMEM accumulators and reuses KV slices after operand reads.
  - item: ['design.tile_pipeline::attention.LoadK', 'design.tile_pipeline::attention.LoadV']
    choice: TMA query/KV/output transfers; cp.async page-table prefetch; per-slice producer/consumer barriers.
    reason: Paged HND inputs are consumed directly through the shared KV ring.
