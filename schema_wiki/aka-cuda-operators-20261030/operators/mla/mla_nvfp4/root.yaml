META_DATA:
  Name: mla_nvfp4
  Describe: Dense NVFP4 MLA decode/MTP attention over a paged shared K=V 512-dim latent KV cache, producing BF16 output and optional natural-log lse
  Source: KernelSchema@484902855fe7be82a74fe7c394503d1d7d222dbb:kernel_wiki/aka-cuda-operators-20261030/operators/mla/mla_nvfp4/candidate/solution.py::Model.forward
  Version: 2
  Dispatch:
    when: max_b seq_lens[b] < 8192, so the host plan applies the Uniform_split_policy of the shared Contract and every 2-CTA cluster receives exactly one (request, row group, KV split) piece. Also requires compute capability (10, 3) and a workspace_buffer large enough for the planned split partials, split lse, work table, unit offsets, per-token split counts, request offsets and sink copy
CONTRACT:
  Algorithm_requirement:
    Constant:
      head_dim: {value: 512, meaning: 'Latent channels shared by Q, K, V and output'}
      page_size: {value: 64, meaning: KV tokens held in one physical cache page}
      scale_group: {value: 16, meaning: Channels sharing one E4M3 NVFP4 block scale}
      kv_tile: {value: 128, meaning: KV tokens per softmax group and split granularity}
      row_tile: {value: 128, meaning: Query rows per row group sharing one split list}
      p_log2_offset: {value: 6, meaning: log2 prescale of P before E4M3; sink seeds z=2^6}
      e4m3_max: {value: 448, meaning: Max finite E4M3 magnitude; clamp bound of V and P}
    Input:
      query: {meaning: 'Packed E2M1 query payload, two codes per byte', shape: [{token: total_q}, {head: num_heads}, {packed_byte: head_dim/2}], dtype: uint8}
      query_scale: {meaning: 'Query E4M3 block-scale bytes, one per scale_group', shape: [{token: total_q}, {head: num_heads}, {group: head_dim/scale_group}], dtype: uint8}
      kv_cache: {meaning: Paged packed E2M1 payload of shared K=V latent KV, shape: [{page: num_pages}, {slot: page_size}, {packed_byte: head_dim/2}], dtype: uint8}
      kv_scale: {meaning: 'KV E4M3 block-scale bytes, one per scale_group', shape: [{page: num_pages}, {slot: page_size}, {group: head_dim/scale_group}], dtype: uint8}
      block_tables: {meaning: Physical page ids; only used slots are read, shape: [{request: batch_count}, {page_slot: max_pages}], dtype: int32}
      seq_lens: {meaning: KV context length of each request in tokens, shape: [{request: batch_count}], dtype: int32, range: [1, 262144]}
      workspace_buffer: {meaning: Mutable scratch; contents are not outputs, shape: [{byte: workspace_bytes}], dtype: uint8}
      sm_scale: {meaning: Softmax scale multiplied into QK scores, shape: [], dtype: python_float}
      sinks: {meaning: Per-head attention-sink logit in ln domain, shape: [{head: num_heads}], dtype: fp32, nullable: true, default: None}
      out_buffer: {meaning: 'Caller out parameter, written in place, returned', shape: [{token: total_q}, {head: num_heads}, {d: head_dim}], dtype: bf16, nullable: true, default: None}
      lse_buffer: {meaning: 'Caller lse parameter, written in place if present', shape: [{token: total_q}, {head: num_heads}], dtype: fp32, nullable: true, default: None}
      return_lse: {meaning: 'Selects returning (out, lse) instead of out alone', shape: [], dtype: python_bool, default: false}
      seq_lens_cpu: {meaning: Host replica of seq_lens for planning; must match, shape: [{request: batch_count}], dtype: int32, nullable: true, default: None}
      backend: {meaning: 'Backend selector; unused by math, fixed impl cake', shape: [], dtype: python_str, default: cake}
    Output:
      out: {meaning: Attention output; always the first returned value, shape: [{token: total_q}, {head: num_heads}, {d: head_dim}], dtype: bf16}
      lse: {meaning: Natural-log lse per row; returned iff return_lse, shape: [{token: total_q}, {head: num_heads}], dtype: fp32}
    Compute:
      - Name: Domain
        Math: |
          batch_count = seq_lens row count = block_tables row count, with 1 <= batch_count <= 32.
          total_q = query token row count and query_len = total_q / batch_count, which must be an integer: every request carries the same number of query tokens, 1 <= query_len <= 16.
          num_heads in {16, 32, 64, 128} and total_q * num_heads >= 128.
          num_pages = kv_cache page count and max_pages = block_tables column count, with max_pages >= ceil(seq_lens[b] / page_size) for every request b.
          1 <= seq_lens[b] <= 262144, seq_lens[b] >= query_len and sum_b seq_lens[b] <= 1048576.
          block_tables[b, i] in [0, num_pages) for every used slot i < ceil(seq_lens[b] / page_size); unused entries hold arbitrary int32 values and are never read.
          All device tensors are contiguous and resident on one CUDA device; when seq_lens_cpu is present it equals seq_lens elementwise.
        Symbol: {query_len: {meaning: Integer query tokens per request, shape: [], dtype: not_applicable}}
      - Name: Decode_nvfp4
        Math: |
          For a 4-bit code c: e2m1(c) = (-1 if c >= 8 else 1) * lut[c mod 8] with lut = [0, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0], so e2m1(8) = -0. sf(u) is the exact FP32 value of the fp8_e4m3fn byte u. nibble(byte, 0) and nibble(byte, 1) are the low and high 4-bit codes stored in that byte.
          q_dec[r, h, d] = e2m1(nibble(query[r, h, d // 2], d mod 2)) * sf(query_scale[r, h, d // scale_group])
          k_dec[p, j, d] = e2m1(nibble(kv_cache[p, j, d // 2], d mod 2)) * sf(kv_scale[p, j, d // scale_group])
          for 0 <= r < total_q, 0 <= h < num_heads, 0 <= p < num_pages, 0 <= j < page_size, 0 <= d < head_dim.
          Every product is exact in FP32. K and V read the same decoded latent rows: one shared KV head serves all query heads (MQA over the 512-dim latent).
        Symbol:
          q_dec: {meaning: Decoded query latent values, shape: [{token: total_q}, {head: num_heads}, {d: head_dim}], dtype: fp32}
          k_dec: {meaning: Decoded shared K=V latent cache values, shape: [{page: num_pages}, {slot: page_size}, {d: head_dim}], dtype: fp32}
      - Name: Prepare_v
        Math: |
          v_pv[p, j, d] = fp32(fp8_e4m3fn(clamp(fp16(k_dec[p, j, d]), -e4m3_max, e4m3_max)))
          Both conversions round to nearest even; the E4M3 step saturates at the clamp bounds. QK scoring keeps the unrounded decoded values k_dec; only the PV value operand uses v_pv.
        Symbol: {v_pv: {meaning: E4M3-rounded value operand used by PV, shape: 'ref:k_dec.shape', dtype: fp32}}
      - Name: Addressing
        Math: |
          each request flattens its query rows (token, head) token-major: row r in [0, query_len * num_heads) has token t = r // num_heads and head h = r mod num_heads, and its global output row is g = b * query_len + t.
          Key j of request b, 0 <= j < seq_lens[b], is gathered through the page table at page = block_tables[b, j // page_size] and slot = j mod page_size:
          k_row(b, j, d) = k_dec[page, slot, d] and v_row(b, j, d) = v_pv[page, slot, d].
          each row (b, t, h) sees exactly the keys j <= visible(b, t) = seq_lens[b] - query_len + t; later keys are masked. seq_lens[b] >= query_len leaves every row at least one visible key.
      - Name: Score
        Math: |
          Notation: exp2(x) = 2^x, log2 is its inverse and ln is the natural logarithm.
          s(g, h, j) = ( sum_{d=0}^{head_dim-1} q_dec[g, h, d] * k_row(b, j, d) ) * sm_scale / ln 2 for visible keys, and s(g, h, j) = -inf for masked keys j > visible(b, t), where g = b * query_len + t.
          each dot product is evaluated in FP32 over the exact decoded values with TF32 disabled; scores are carried in the log2 domain. No approximate hardware exp or reciprocal instruction defines the reference truth.
        Symbol: {s: {meaning: Log2-domain row score; -inf on masked keys, shape: [{key: 'seq_lens[b]'}], dtype: fp32}}
      - Name: Split_partition
        Math: |
          tiles(b) = ceil(seq_lens[b] / kv_tile); row_groups = ceil(query_len * num_heads / row_tile); num_sms is the SM count of the executing device.
          Row group gg of request b covers flattened rows [gg * row_tile, min((gg + 1) * row_tile, query_len * num_heads)).
          Each (b, gg) gets an ordered list splits(b, gg) of half-open KV token intervals (left, right) partitioning [0, tiles(b) * kv_tile); key iteration inside an interval stops at seq_lens[b].
          These boundaries are numerically binding: multi-split rows round their partials to BF16 (step Split_partial). The reference reconstructs them from the public shape and device policy given by the next two steps.
        Symbol:
          num_sms: {meaning: 'Device SM count integer, read at runtime', shape: [], dtype: not_applicable}
          splits: {meaning: 'Ordered KV intervals of one (request, row group)', shape: not_applicable, dtype: not_applicable}
      - Name: Uniform_split_policy
        Math: |
          Applies when max_b seq_lens[b] < 8192; every row group of request b shares the same intervals.
          width = max_b tiles(b); kv_bytes = (sum_b seq_lens[b]) * (head_dim/2 + head_dim/scale_group); partial_bytes = batch_count * query_len * num_heads * head_dim * 4.
          While (sum_b ceil(tiles(b) / width)) * row_groups * 2 < 2 * num_sms: cand = max(8, ceil(width / 2)); stop refining when cand >= width or ceil(max_b tiles(b) / cand) * partial_bytes > 0.35 * kv_bytes; otherwise width = cand.
          splits(b, gg) = [ (q * width * kv_tile, min((q + 1) * width, tiles(b)) * kv_tile) for 0 <= q < ceil(tiles(b) / width) ].
      - Name: Balanced_split_policy
        Math: |
          Applies when max_b seq_lens[b] >= 8192.
          total = (sum_b tiles(b)) * row_groups; units = max(1, min(num_sms // 2, total // 8)); while units > 1 and ceil(max_b tiles(b) / (total / units)) + 1 > 64: units = units // 2.
          cuts(u) = u * total // units for 0 <= u <= units.
          each (b, gg) pair occupies the consecutive tile span [off, off + tiles(b)) of the concatenated sequence in request-major, row-group-minor order, with off(b, gg) = sum_{b2 < b} row_groups * tiles(b2) + gg * tiles(b).
          splits(b, gg) = [ ((max(cuts(u), off) - off) * kv_tile, (min(cuts(u + 1), off + tiles(b)) - off) * kv_tile) for every u with cuts(u) < off + tiles(b) and cuts(u + 1) > off ]; never empty since tiles(b) >= 1.
      - Name: Split_state_init
        Math: |
          Fix query row (g, h) with token t of request b, row group gg, and one interval (left, right) of splits(b, gg).
          FP32 state: m = -inf (log2-domain running maximum), z = 0 (unrounded denominator), a[d] = 0 for 0 <= d < head_dim.
          If sinks is present and this is the first interval: m = sinks[h] / ln 2 and z = 2^p_log2_offset, seeding a zero-value virtual key of natural-log score sinks[h] into the first split only.
        Symbol:
          m: {meaning: Delayed log2-domain running maximum per row/split, shape: [], dtype: fp32}
          z: {meaning: Unrounded denominator per row and split, shape: [], dtype: fp32}
          a: {meaning: FP32 value accumulator of one row and split, shape: [{d: head_dim}], dtype: fp32}
      - Name: Block_update
        Math: |
          Loop over key blocks [begin, min(begin + kv_tile, seq_lens[b], right)) for begin = left, left + kv_tile, ... while begin < min(seq_lens[b], right):
            block_max = max_j s(g, h, j) over the block, or -inf when every key of the block is masked;
            m_next = m if max(m, block_max) - m <= 2 else max(m, block_max); at m = block_max = -inf the test is false and m_next = -inf, so the log2 maximum advances only on a rise of more than 2;
            safe = m_next if finite else 0; rescale = exp2(m - safe), which is 0 at m = -inf;
            p(j) = exp2(s(g, h, j) - safe + p_log2_offset), masked keys giving 0; p_q(j) = fp32(fp8_e4m3fn(clamp(p(j), 0, e4m3_max))), saturating RNE;
            a[d] = a[d] * rescale + sum_j p_q(j) * v_row(b, j, d); z = z * rescale + sum_j p(j) with the unrounded p; m = m_next.
      - Name: Split_partial
        Math: |
          live = z > 0.
          partial[d] = a[d] / (z if live else 1).
          If splits(b, gg) holds more than one interval, partial[d] = fp32(bf16(partial[d])): a BF16 partial materializes at every split boundary, while a single-split row keeps its FP32 partial.
          lse_split = (m + log2(z) - p_log2_offset) * ln 2 when live, otherwise -inf; this is the natural-log lse statistic of the split, and a seeded sink contributes exp(sinks[h]) to its sum.
        Symbol:
          partial: {meaning: 'Normalized output row of one split, BF16 if multi', shape: [{d: head_dim}], dtype: fp32}
          lse_split: {meaning: Natural-log lse of one split; -inf when not live, shape: [], dtype: fp32}
      - Name: Merge_output
        Math: |
          For each query row, over the (lse_split, partial) pairs of its intervals:
          total_lse = ln( sum_s exp(lse_split_s) ), evaluated in FP32 after subtracting max_s lse_split_s; an interval with lse_split = -inf contributes weight w_s = exp(lse_split_s - total_lse) = 0.
          merged[d] = sum_s w_s * partial_s[d] in FP32.
          out[g, h, d] = bf16(merged[d]) with RNE rounding, where g = b * query_len + t.
          When present, the lse buffer receives lse[g, h] = total_lse.
          A single-split row reduces to w = 1: out = bf16(partial) and lse = lse_split.
        Symbol: {total_lse: {meaning: Merged natural-log lse of one row over its splits, shape: [], dtype: fp32}}
      - Name: Call_semantics
        Math: |
          All inputs are bound at model construction and forward takes no arguments.
          forward returns (out, lse) when return_lse is true and out alone otherwise; a provided out_buffer or lse_buffer is written in place with its storage identity preserved and its full logical tensor overwritten, the split partition covering every query row exactly once. The returned out is that out_buffer and the returned lse is that lse_buffer; an absent buffer is allocated fresh and carries the same values.
          workspace_buffer may be read and written freely and its contents after the call are unspecified; every other input is read-only.
    Golden_reference:
      Source: KernelSchema@484902855fe7be82a74fe7c394503d1d7d222dbb:kernel_wiki/aka-cuda-operators-20261030/operators/mla/mla_nvfp4/problem/reference.py::Model.forward
      Tolerance:
        out: Source only; atol=.01, rtol=.05, mismatch_frac=0, relative_to=candidate; no formula; no defaults
        lse: Source only; atol=.01, rtol=.05, mismatch_frac=0, relative_to=candidate; no formula; no defaults
      Gap: Reference needs out buffer, returns None lse if return_lse without lse; contract allocates fresh
  Hardware_specification:
    Device:
    Architecture:
    Execution:
      thread: Single hardware thread of a warp owning private register storage; elected single threads issue the TMA copies and the tcgen05 MMA of the main kernel, and per-lane indexing drives row statistics, split merges and vector loads
      warp: 32 threads of one CTA executing in lockstep with shuffle reductions; the main kernel fixes per-warp roles (softmax warps 0-3, correction warps 4-7, transform warps 8-13, load warp 14, mma warp 15) and the combine kernel assigns one warp per (query token, head) row
      warpgroup: Four consecutive warps (128 threads) of one CTA, the aligned scope of the setmaxnreg register-budget redistribution that raises the softmax warpgroup to 208 registers and lowers correction to 112 and the transform, load and mma warpgroups to 96
      cta: Thread block resident on one SM; owns the smem and tmem storage referenced by Storage.location, the main kernel running 512 threads with 189440 bytes of dynamic smem and a 512-column tmem allocation of which 480 columns hold scores, PV accumulators, scales and transformed Q, and the combine kernel running 256 threads without dynamic smem
      cluster: Two CTAs co-scheduled as one pair (__cluster_dims__(2,1,1) with spread scheduling preference); the pair shares one cta_group::2 tcgen05 MMA over the jointly allocated TMEM, synchronizes with cluster barriers and addresses peer smem through mapa
    Feature:
      mechanism: null
    Stack:
      Language:
      Toolchain:
    Wiki:
      Hardware:
      Programming:
        Language:
      Microbench:
      Sota:
