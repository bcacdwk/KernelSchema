META_DATA:
  Name: mla_absorbed_fp8
  Describe: Absorbed MLA attention over FP8 E4M3 paged Q/KV with bottom-right causal masking, writing BF16 output and optional FP32 natural-log lse in place
  Source: KernelSchema@484902855fe7be82a74fe7c394503d1d7d222dbb:kernel_wiki/aka-cuda-operators-20261030/operators/mla/mla_absorbed_fp8/candidate/solution.py::Model.forward
  Version: 2
  Dispatch:
    id: split_kv
    when: >-
      Calls that take the tcgen05 path - the device reports compute capability 10.0, 10.1 or 10.3, or the implementation is forced to v1 - whose host split policy of DESIGN.Work_schedule resolves to splits >= 2: workspace_buffer has elements, items < 148, and the capped count of Partition.split stays >= 2, with the default 1024 CTA target and the hi/lo E4M3 probability words enabled
DESIGN:
  Math_reshape:
    Thesis: >-
      The single-worker core - E4M3 products, log2-folded scale, lazy shift, hi/lo words - plus range decomposition: each window publishes a self-normalised fp16 partial with its shift and denominator; the merge reweights by 2^(ms-m) and applies bmm2_scale, sinks and the only bf16 narrowing
    Rewrite:
      - Name: Work-item rows, key range and score tile
        Math: |
          A work item covers 128 consecutive packed (token, head) rows of one request: row0 = tile*128, valid_rows = min(128, qlen*head_count - row0), row r has q_idx = (row0+r)/head_count, head = (row0+r) - q_idx*head_count, token = q_start + q_idx, q_start being the request's first packed token.
          With kv_length = seq_lens[b] and max_q_idx = (row0+valid_rows-1)/head_count: last_key = kv_length - qlen + max_q_idx + 1, ntiles = ceil_div(last_key, bk). Query-major rows make the last valid row the most visible: every tile is scanned and a row whose visible_max falls inside it is masked.
          For tile t, row r, local key u and j = bk*t + u:
            s_tile(t)[r, u] = sum_{d=0}^{head_dim-1} query[token, head, d] * k_row(b, j)[d]
          s_tile is un-scaled: the Contract's s[j] = ln(2)*s_tile(t)[r,u]*qk_scale, qk_scale = bmm1_scale*log2(e). qk_scale never multiplies s_tile; it enters as fma32(s_tile, qk_scale, .) in step 4 and max(s_tile)*qk_scale in step 3, exact since qk_scale > 0 commutes with max.
        Symbol:
          s_tile: {meaning: Un-scaled FP32 score tile of one key tile, shape: [{row: 128}, {key: bk}], dtype: fp32}
          qk_scale: {meaning: Softmax scale folded with the base change to log2, value: bmm1_scale * 1.4426950408889634}
          bk: {meaning: Keys per recurrence tile, binding: 'bind:DESIGN.Work_schedule::bk'}
        Arithmetic:
          Accumulate: The head_dim-term product accumulates in FP32 as 18 sequential 32-dim tensor-core steps; the grouping inside a step is the E4M3 path's, not serial
        Ledger:
          Baseline: Contract s[j] = bmm1_scale * sum_d query*k_row as head_dim FP32 multiply-adds per (row, key)
          Gain: Score MACs move to the E4M3 tensor core, 128*bk*head_dim = 4718592 per tile per item, and the scale multiply folds into the exponential argument
          Cost: Keys outside visible_key_set and rows past valid_rows are still gathered and multiplied, up to 128*bk*head_dim = 4718592 MACs per tile
      - Name: Window decomposition of the key range
        Math: |
          Each item's ntiles tiles cut into s_item consecutive windows, device-resolved. With rt(b) = ceil_div(qlen(b)*head_count,128), nt(b) = ceil_div(seq_lens[b],bk), work = sum_b rt(b)*nt(b), rows_rt = sum_b rt(b), est(g) = sum_b rt(b)*ceil_div(nt(b),g) and one-wave target 148:
            ctas_host = floor(work/tiles_per_cta) + floor(rows_rt/2); waves = ceil_div(ctas_host,148)
            tpc = tiles_per_cta when ctas_host <= 148, waves*148*4 < ctas_host*5 or waves*tiles_per_cta*8 <= ceil_div(work,148)*9; else refine up to four times from cand = max(tiles_per_cta, ceil_div(work, max(1, 148 - floor(rows_rt/2)))), growing cand by 1 + floor(cand*(est(cand)-148)/296) while est(cand) > 148, taking tpc = cand only when cand < waves*tiles_per_cta, else tiles_per_cta
            s_item = min(max(ceil_div(ntiles,tpc),1), splits); chunk = ceil_div(ntiles,s_item)
            t_begin = split*chunk and t_end = min(ntiles,t_begin+chunk) when s_item > 1, else t_begin = 0 and t_end = ntiles; t_begin >= t_end arises only when s_item > 1
        Symbol:
          splits: {meaning: Host-resolved split count of the launch, binding: 'bind:DESIGN.Work_schedule::splits'}
          tiles_per_cta: {meaning: Host target of key tiles per split CTA, binding: 'bind:DESIGN.Work_schedule::tiles_per_cta'}
          tpc: {meaning: Device-coarsened tile granularity per split CTA}
          s_item: {meaning: Splits that publish partials for one item, shape: [], dtype: int32}
          t_begin: {meaning: First key tile of this split window}
          t_end: {meaning: One past the last key tile of the window}
      - Name: Lazy log2-domain shift for the row maximum
        Math: |
          Per row r, carried over the tiles of its split window, m_shift(t_begin-1)[r] = NEG_INF = -3.402823466e38, and the tile maximum runs only over visible keys:
            mrow(t)[r] = max{ s_tile(t)[r,u] : bk*t+u in visible_key_set(b, q_idx) }, NEG_INF when empty
            mx(t)[r] = NEG_INF when mrow(t)[r] = NEG_INF, else mrow(t)[r]*qk_scale
            need(t)[r] = mx(t)[r] > m_shift(t-1)[r] + rescale_thresh
            m_shift(t)[r] = mx(t)[r] + shift_head if need(t)[r], else m_shift(t-1)[r]
            alpha(t)[r] = 0 if need(t)[r] and m_shift(t-1)[r] = NEG_INF; exp2(m_shift(t-1)[r] - m_shift(t)[r]) if need(t)[r]; else 1
          alpha rescales the carried denominator and accumulation of the same row (steps 5 and 6), so a row starts from alpha = 0 with an untouched accumulator. m_shift is a shift, not the running maximum: it trails by shift_head, moves only on growth past rescale_thresh, and step 8 recovers base_lse from the published values. A tile where the row sees no key leaves mrow at NEG_INF and changes nothing.
        Symbol:
          m_shift: {meaning: Log2-domain softmax shift of one row, shape: [], dtype: fp32, retention: 'carry_forward (token,head,split); t=t_begin-1..t_end-1'}
          alpha: {meaning: Rescale factor of one row at one tile, shape: [], dtype: fp32}
          rescale_thresh: {meaning: log2 growth that triggers a shift update, value: 2.75}
          shift_head: {meaning: log2 headroom above the tile maximum, value: 2.0}
        Ledger:
          Baseline: Online softmax rescaling the carried output accumulator at every key tile
          Gain: Accumulator rescale passes drop from the window tile count to the tiles whose maximum grows past rescale_thresh; one pass moves 448*128 FP32 values
          Cost: Weights in one accumulator span rescale_thresh + shift_head = 4.75 more log2 units, pushing weights 12 below the shift into E4M3 subnormals
      - Name: Probability as an E4M3 word plus a residual
        Math: |
          For row r, tile t and each local key u, with j = bk*t + u:
            e(t)[r,u] = 0 when j is not in visible_key_set(b, q_idx)
                      = exp2(fma32(s_tile(t)[r,u], qk_scale, log2_p_scale - m_shift(t)[r])) otherwise
            p_hi(t)[r,u] = fp8_e4m3fn(e(t)[r,u]), saturating and round to nearest even
            p_lo(t)[r,u] = fp8_e4m3fn(fp16(e(t)[r,u]) - fp16(p_hi(t)[r,u]))
          so e = p_scale * exp(s[j] - ln(2)*m_shift): the Contract's unnormalised weight times a fixed prescale, measured from the shift instead of the maximum. Both factors cancel in the ratio step 8 forms. p_scale*2^rescale_thresh = 430 stays under the E4M3 maximum 448, so no weight saturates, and a rescale tile's largest weight is p_scale*2^-shift_head = 16. Step 5 uses p_hi and p_lo as two E4M3 operands accumulated into the same FP32 column.
        Symbol:
          e: {meaning: Prescaled unnormalised weight before quantisation, shape: [], dtype: fp32}
          p_hi: {meaning: Saturating E4M3 word of a weight, shape: [{row: 128}, {key: bk}], dtype: fp8_e4m3fn}
          p_lo: {meaning: E4M3 word holding the fp16 residual of a weight, shape: [{row: 128}, {key: bk}], dtype: fp8_e4m3fn}
          p_scale: {meaning: Fixed prescale keeping weights in E4M3 range, value: 64}
          log2_p_scale: {meaning: log2 of the prescale, value: 6}
        Arithmetic:
          Approx: 'exp2 is the device approximate base-2 exponential, subnormal results flushed; unknown: no bound in the source, sampled relative L2 1.04e-3 of 1e-2'
          Accumulate: e is summed into the group denominator in four FP32 chains of eight weights, merged once per tile
        Ledger:
          Baseline: Contract o_acc = sum_j p[j]*v_row(j) with FP32 probabilities against FP8 values
          Gain: Value MACs move to the E4M3 tensor core, 128*bk*value_dim = 4194304 per tile per item
          Cost: 'Two E4M3 words per weight: the probability tile doubles to 16384 bytes per tile, the value product doubles, and weight error becomes fp16-level'
      - Name: Value accumulation with the tail regrouped
        Math: |
          Per row r, carried over the window tiles and zero before the first, u over the tile's visible local keys, v_row the Contract's alias:
            o_un(t)[r,c] = alpha(t)[r]*o_un(t-1)[r,c] + sum_u p_hi(t)[r,u]*v_row(bk*t+u)[c] + sum_u p_lo(t)[r,u]*v_row(bk*t+u)[c]
          for 0 <= c < value_dim - tail_dims; the last tail_dims dims form their tile product separately, added in registers:
            tail_tile(t)[r,c] = sum_u p_hi(t)[r,u]*v_row(bk*t+u)[value_dim-tail_dims+c] + sum_u p_lo(t)[r,u]*v_row(bk*t+u)[value_dim-tail_dims+c]
            o_tail(t)[r,c] = alpha(t)[r]*o_tail(t-1)[r,c] + tail_tile(t)[r,c]
          Masked keys contribute nothing because their e is 0. After the window's last tile:
            o_part[r,c] = o_un(t_end-1)[r,c] for c < value_dim - tail_dims, else o_tail(t_end-1)[r, c - value_dim + tail_dims]
          o_part/dsum is the window's weighted value average at shift m_shift(t_end-1); step 7 publishes it, step 8 divides the merged denominator out.
        Symbol:
          o_un: {meaning: Unnormalised accumulation of the kept output dims, shape: [{dim: value_dim - tail_dims}], dtype: fp32, retention: 'carry_forward (token,head,split); t=t_begin-1..t_end-1'}
          tail_tile: {meaning: One tile product of the last tail_dims output dims, shape: [{dim: tail_dims}], dtype: fp32}
          o_tail: {meaning: Unnormalised accumulation of the tail output dims, shape: [{dim: tail_dims}], dtype: fp32, retention: 'carry_forward (token,head,split); t=t_begin-1..t_end-1'}
          o_part: {meaning: Unnormalised accumulation of all dims of one split, shape: [{dim: value_dim}], dtype: fp32}
          tail_dims: {meaning: Output dims re-accumulated once per tile, value: 64}
        Arithmetic:
          Accumulate: FP32 throughout. Dims below value_dim - tail_dims form one chain over the window; the tail dims sum per tile, so grouping differs
        Ledger:
          Baseline: All value_dim output dims accumulated in one tensor-memory accumulator
          Gain: The accumulator fits 448 of the 512 tensor-memory columns, leaving the score tile's 64 columns to serve as the tail destination
          Cost: tail_dims dims per row are read out and re-added once per tile, 128*64 FP32 reads and adds per tile, and their grouping becomes per-tile
      - Name: Both groups reduce the maximum, one merge
        Math: |
          Two column groups quantise one 128 x bk score tile, group g owning key columns [32g, 32g+32). Both reduce mrow(t)[r] over all bk raw columns, own half first, so mrow, mx, need, m_shift and alpha of a row take identical values in both groups without any exchange. Each group then quantises and sums only its own columns:
            dsum_local(g)(t)[r] = alpha(t)[r]*dsum_local(g)(t-1)[r] + sum_{u in [32g, 32g+32)} e(t)[r,u]
          from 0, and the denominator is merged once per split after the window's last tile:
            dsum[r] = dsum_local(0)(t_end-1)[r] + dsum_local(1)(t_end-1)[r]
          Both groups apply the same alpha sequence, so dsum is the sum of every e of the row in this window up to FP32 regrouping, and step 8 divides it out exactly once through the merged denominator.
        Symbol:
          dsum_local: {meaning: Group-local sum of the prescaled weights, shape: [], dtype: fp32, retention: 'carry_forward (token,head,group,split); t=t_begin-1..t_end-1'}
          dsum: {meaning: Merged denominator of one row of one split, shape: [], dtype: fp32}
        Ledger:
          Baseline: One worker reduces the row maximum and quantises all bk keys in a single denominator chain
          Gain: Exponential and quantisation work per group per tile halves to 128*32 weights
          Cost: Both groups reduce all bk raw columns, 128*64 comparisons per tile, and dsum sums two 32-column partials, so its rounding differs
      - Name: Per-split partial normalisation and publication
        Math: |
          Per valid row r (r < valid_rows) of a split with a nonempty window, ms = m_shift(t_end-1)[r] and dz = dsum[r]:
            pnrm[r] = 1/dz when dz > 0, else 1
            part_o[r,c] = fp16(o_part[r,c] * pnrm[r]) for 0 <= c < value_dim
            part_ms[r] = ms; part_ds[r] = dz
          dz = 0 exactly when the window holds no key visible to the row, which leaves ms = NEG_INF: the words mark the split absent, part_o[r,c] = fp16(0), and step 8 skips it. A live split whose window is empty publishes part_ms[r] = NEG_INF and part_ds[r] = 0 for valid rows and writes no part_o at all.
          q_len_max = uniform_query_length in the uniform layout, else max_q_len when positive, else total_query_count; the partial buffers hold rows_cap rows per (item, split) and valid_rows <= rows_cap keeps every publication in bounds. o_part/dz is a weighted average of gathered FP8 value rows, so fp16 is representable; bmm2_scale, sinks and bf16 act only in step 8.
        Symbol:
          q_len_max: {meaning: Declared longest query length of the call}
          rows_cap: {meaning: Row capacity of the partial buffer slabs, value: 'min(max(q_len_max*head_count, 1), 128)'}
          part_o: {meaning: Row-normalised fp16 partial output of one split, shape: [{dim: value_dim}], dtype: fp16, retention: 'keep_value (token,head,split)'}
          part_ms: {meaning: Published log2-domain shift of one split row, shape: [], dtype: fp32, retention: 'keep_value (token,head,split)'}
          part_ds: {meaning: Published denominator of one split row, shape: [], dtype: fp32, retention: 'keep_value (token,head,split)'}
        Ledger:
          Baseline: One worker per item narrowing o_total*iscale straight to bf16 and writing both outputs from a single epilogue
          Gain: 'Windows split the key range s_item-fold: serial tiles per CTA shrink alike and items*splits workers fill the machine when items < 148'
          Cost: 'Splits publish and the merge re-reads 2*value_dim + 8 bytes per row plus one extra fp16 narrowing; source: ~100 MB partials added 0.6 ms on 384 items'
      - Name: Cross-split merge, sink and output narrowing
        Math: |
          Per valid row r with (t,h) = (token,head), sig over [0, s_item):
            m_all[r] = max_{sig < s_item} part_ms(sig)[r]
            w(sig)[r] = 0 when part_ms(sig)[r] = NEG_INF, else exp2(part_ms(sig)[r] - m_all[r])
            wd(sig)[r] = w(sig)[r]*part_ds(sig)[r]; dsum_all[r] = sum_sig wd(sig)[r]; acc[r,c] = sum_{sig: w(sig)[r] != 0} wd(sig)[r]*part_o(sig)[r,c]
            inv[r] = bmm2_scale/dsum_all[r], 0 when dsum_all[r] <= 0 (defensive; valid rows reach dsum_all > 0)
            base_lse[r] = ln(2)*(m_all[r] + log2(dsum_all[r]) - log2_p_scale)
            sinks None: oscale[r] = 1, attention_lse[t,h] = base_lse[r]; else sink = sinks[h], g = max(base_lse[r],sink): attention_lse[t,h] = g + ln(exp2((base_lse[r]-g)*log2(e)) + exp2((sink-g)*log2(e))), oscale[r] = exp2((base_lse[r]-attention_lse[t,h])*log2(e))
            attention_output[t,h,c] = bf16(acc[r,c]*inv[r]*oscale[r])
          Zero-weight splits add nothing and their part_o is never read; wd*part_o rebases each window to m_all, so base_lse is the Contract's m + ln(z), acc/dsum_all its o_acc.
        Arithmetic:
          Approx: 'exp2, log2 and ln are device approximations; exp2 flushes subnormals, dropping shifts about 126 log2 below m_all; unknown: no bound in the source'
          Accumulate: dsum_all sums strided per-thread partials via shuffle and cross-warp trees; acc sums in per-thread split order; fp16 inputs widen to FP32
        Ledger:
          Baseline: One worker's epilogue dividing o_total by dsum and narrowing to bf16 once
          Cost: Per row, value_dim FMA per split plus an O(s_item) reduction; fp16 rounding (relative 2^-11) enters the sums and key order differs from one pass
  Work_schedule:
    Thesis: >-
      Splitting each item's key range over an items x splits grid fills the machine on decode shapes, at the measured cost of partial traffic plus one launch; 188416 shared bytes and 512 tmem columns keep one attention worker resident per SM. Per-item granularity is device-resolved and published
    Step:
      ATTENTION:
        Describe: >-
          Scan this split's key-tile window for 128 packed (token,head) rows and publish per-row fp16 partials with shift and denominator words
        Decomposition:
          Strategy: >-
            bk=64; tiles_cap=max(1,ceil_div(max_seq_len,bk)); tiles_per_cta=max(1,ceil_div(tiles_cap,splits)); item->(b,tile) by Token_layout; surplus: ntiles=0
          Partition:
            item: {meaning: 'One 128-row (token, head) block of one request', size: items, tile: 1, range: [1, null]}
            split: {meaning: Key-tile window index within every item, size: splits, tile: 1, range: [2, 148]}
          Worktile:
            Invariant:
              query_rows: {meaning: The item's FP8 query rows; padding rows are zero, shape: [{row: 128}, {dim: head_dim}], dtype: 'ref:CONTRACT.Algorithm_requirement::query.dtype'}
              page_table_row: {meaning: Page ids of the item's request, shape: [{entry: table_stride}], dtype: 'ref:CONTRACT.Algorithm_requirement::block_tables.dtype'}
            Iteration: {kv_tile: {meaning: 'Window keys [bk*t, bk*t+bk) gathered via the table', shape: [{key: bk}, {dim: head_dim}], dtype: 'ref:CONTRACT.Algorithm_requirement::kv_cache.dtype', direction: ascending}}
          Target:
            Single_tile:
              part_rows: {meaning: Row-normalised fp16 partial output of valid rows, shape: [{row: valid_rows}, {dim: value_dim}], dtype: fp16}
              ms_rows: {meaning: Published shift word per row; NEG_INF when absent, shape: [{row: valid_rows}], dtype: fp32}
              ds_rows: {meaning: Published denominator word per row; 0 when absent, shape: [{row: valid_rows}], dtype: fp32}
              pub_words: {meaning: Two int32 words published by the split-0 worktile, shape: [{word: 2}], dtype: int32}
        Mapping:
          Strategy: >-
            splits = max(1, min(max(min(by_ws, by_grid, 1024, by_traffic, 148, floor(296/items)), ceil_div(tiles_cap,64)), by_grid, by_ws, 148))
          Worker: {unit: cta, unit_count: 1}
          Worker_count: items*splits
        Schedule:
          Strategy: >-
            by_ws=floor((floor(workspace_byte_count/4)-1-items)/(rows_cap*258*items)); by_grid=ceil_div(2048,items); by_traffic=floor(9*max_seq_len/(32*rows_cap))
          Worktile_order:
            - {by: split, direction: ascending}
            - {by: item, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: [assigned_done]
      COMBINE:
        Describe: >-
          Merge one row's s_item published partials: weights from the merged maximum, reweighted fp16 sums, bmm2_scale, sink merge, bf16 out and the row's lse
        Decomposition:
          Strategy: >-
            Single 512-dim slab: one split group of 128 threads, thread dt owns dims [4*dt,4*dt+4); rows >= valid_rows retire before reading words
          Partition:
            item: {meaning: 'The same (token, head) row block as in ATTENTION', size: items, tile: 1, range: [1, null]}
            row: {meaning: 'One packed (token, head) row below rows_cap', size: rows_cap, tile: 1, range: [1, 128]}
          Worktile:
            Invariant:
              part_row: {meaning: 'fp16 partial output of this row, per split', shape: [{split: s_item}, {dim: value_dim}], dtype: fp16}
              ms_words: {meaning: Published shift of this row per split, shape: [{split: s_item}], dtype: fp32}
              ds_words: {meaning: Published denominator of this row per split, shape: [{split: s_item}], dtype: fp32}
          Target:
            Single_tile:
              out_row: {meaning: attention_output of this row, shape: [{dim: value_dim}], dtype: 'ref:CONTRACT.Algorithm_requirement::attention_output.dtype'}
              lse_value: {meaning: 'attention_lse of this row, when provided', shape: [], dtype: 'ref:CONTRACT.Algorithm_requirement::attention_lse.dtype'}
            Tile_reduction: {dimension: split, input: ['ref:DESIGN.Math_reshape::part_o', 'ref:DESIGN.Math_reshape::part_ms', 'ref:DESIGN.Math_reshape::part_ds'], output: ['ref:CONTRACT.Algorithm_requirement::attention_output', 'ref:CONTRACT.Algorithm_requirement::attention_lse'], method: 'ref:DESIGN.Math_reshape::Cross-split merge, sink and output narrowing'}
        Mapping:
          Strategy: >-
            One worker per (item,row): four warps reduce the statistics, each thread owns four dims end to end; 8 KiB static smem admits ~12 residents per SM
          Worker: {unit: cta, unit_count: 1}
          Worker_count: items*rows_cap
        Schedule:
          Strategy: >-
            items = batch_count*ceil_div(qlen*head_count,128) uniform, else ceil_div(total_query_count*head_count,128) + batch_count; surplus: valid_rows = 0
          Worktile_order:
            - {by: row, direction: ascending}
            - {by: item, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: [assigned_done]
    Flow:
      Launch:
        - {step: [ATTENTION]}
        - {step: [COMBINE], start_after: [ATTENTION.kernel_done]}
      Handoff:
        part_o: {producer: ATTENTION, consumer: [COMBINE], storage: global}
        part_ms: {producer: ATTENTION, consumer: [COMBINE], storage: global}
        part_ds: {producer: ATTENTION, consumer: [COMBINE], storage: global}
        s_item: {producer: ATTENTION, consumer: [COMBINE], storage: global}
  Tile_pipeline:
    Thesis: >-
      ATTENTION keeps the shared body pace with window-local buffer slots and stages fp16 partial rows in the freed query/key bytes. COMBINE is fully synchronous: statistics gathered once behind a speculative load, CTA-uniform weights from two block reductions, one streaming pass per thread
    Step:
      ATTENTION:
        Index:
          t: {meaning: Key-tile ordinal within the current split window, definition: [t_begin, t_end]}
          c: {meaning: Epilogue output chunk drained by one group, definition: [0, 7]}
        Storage:
          tmem: {meaning: Output accumulator and shared score/tail columns, depth: 1, location: tmem, shape: [{row: 128}, {column: 512}],
            dtype: fp32, total_size: 262144, view: {o_un: {region: {column: [0, 448]}}, s_tile(t): {region: {column: [448, 512]}}, tail_tile(t): {region: {column: [448, 512]}}}}
          smem_q: {meaning: Query block in the descriptor's swizzled layout, depth: 1, location: smem, shape: [{row: 128}, {dim: head_dim}],
            dtype: fp8_e4m3fn, total_size: 73728, view: {query_rows: {}}}
          smem_kv: {meaning: 'Double-buffered gathered key tile, also the value', depth: 2, location: smem, shape: [{key: bk}, {dim: head_dim}],
            dtype: fp8_e4m3fn, total_size: 73728, view: {kv_tile(t): {slot_index: (t - t_begin)%2}}}
          smem_p: {meaning: 'Double-buffered probability tile, two E4M3 words', depth: 2, location: smem, shape: [{row: 128}, {key: bk}, {word: 2}],
            dtype: fp8_e4m3fn, total_size: 32768, view: {p_hi(t): {slot_index: (t - t_begin)%2, region: {word: [0, 1]}}, p_lo(t): {slot_index: (t - t_begin)%2, region: {word: [1, 2]}}}}
          smem_dsum: {meaning: Cross-group exchange of group-local denominators, depth: 1, location: smem, shape: [{group: 2}, {row: 128}],
            dtype: fp32, total_size: 1024, view: {dsum_local: {}}}
          smem_stage: {meaning: Staged fp16 rows aliasing freed query/key bytes, depth: 1, location: smem, shape: [{row: 128}, {byte: 1048}],
            dtype: uint8, total_size: 134144}
          reg_tail: {meaning: Register accumulator of the tail output dims, depth: 1, location: register, shape: [{row: 128}, {dim: tail_dims}],
            dtype: fp32, total_size: 32768, view: {o_tail: {}}}
          reg_state: {meaning: Carried shift and group-local denominator per row, depth: 1, location: register, shape: [{row: 128}, {group: 2}, {stat: 2}],
            dtype: fp32, total_size: 2048, view: {m_shift: {region: {stat: [0, 1]}}, dsum_local: {region: {stat: [1, 2]}}}}
        Role:
          MAIN:
            Info:
              Describe: >-
                Eight warps in two column groups of four: warp w is group w/4 covering rows [32*(w mod 4), +32), so each group spans all 128 rows, one row per lane
              Member: warp[0:8]
              Using_verb:
                compute:
                  barrier_init: {execution_mode: serial, describe: 'One lane sets the completion words bar_s, bar_pv and bar_pv2 to expect one arrival each and releases them cluster-wide; reads no input or old value'}
                  granularity: {execution_mode: serial, describe: 'Walk seq_lens and cum_seq_lens_q to derive tpc, s_item, chunk and the window by the Window decomposition step; done covers the values ready'}
                  softmax: {execution_mode: serial, describe: 'Read all bk columns of s_tile(t), apply step 3 to dsum_local, o_tail and the output columns, write p_hi(t)/p_lo(t) to smem_p and add e to dsum_local'}
                  tail_drain: {execution_mode: serial, describe: 'Each group reads its own 32 of the 64 scratch columns holding tail_tile(t) by a warp-synchronous load closed by its wait, and adds them to o_tail'}
                  dsum_merge: {execution_mode: serial, describe: 'Write dsum_local to smem_dsum at (group, row), CTA barrier, then add the other group word: dsum = dsum_local(0) + dsum_local(1) at one shared shift'}
                  part_scale: {execution_mode: serial, describe: 'Per row from the merged dsum: pnrm = 1/dsum when dsum > 0, else 1; inv, base_lse and iscale are evaluated but no store of this path consumes them'}
                  o_chunk: {execution_mode: serial, describe: 'Group g drains tmem output columns [32*(g+2c), +32) by a warp-synchronous load and its wait, multiplies the row 32 values by pnrm and packs fp16 pairs'}
                  o_tail: {execution_mode: serial, describe: Multiply the row's 32 register-held tail dims of o_tail by pnrm and pack fp16 pairs}
                matmul:
                  query_rows@kv_tile: {execution_mode: async_unordered, describe: 'One lane issues 18 products of 32 query dims from smem_q and smem_kv slot (t-t_begin)%2 into tmem [448,512), first clearing them; done covers reads'}
                  p@v_tail: {execution_mode: async_unordered, describe: 'One lane issues per 32-key step a product of p_hi(t) and one of p_lo(t) against dims [448,512) of kv_tile(t) into tail_tile(t), the first clearing it'}
                  p@v_main: {execution_mode: async_unordered, describe: 'One lane issues per 32-key step p_hi(t) and p_lo(t) products against dims [0,448) of kv_tile(t) into o_un; the window''s first clears, later accumulate'}
                load:
                  q_tile: {execution_mode: async_unordered, describe: 'Copy query_rows into smem_q by 16-byte asynchronous copies, zeroing the rows past valid_rows so padded lanes multiply zeros and results are dropped'}
                  kv_tile: {execution_mode: async_unordered, describe: 'Per key, four threads resolve bk*t+u via page_table_row, clamped past kv_length, and async-copy its head_dim bytes into smem_kv slot (t-t_begin)%2'}
                store:
                  pub_words: {execution_mode: async_unordered, describe: 'The split-0 worker writes the workspace tail words: resolved tpc, which this configuration never reads, and the item''s s_item consumed by COMBINE'}
                  part_chunk: {execution_mode: async_unordered, describe: 'Write the chunk''s packed fp16 64 bytes, dims [32*(g+2c), +32) of the part_o row, into the smem_stage row when valid_rows > 32, else straight to part_o'}
                  part_tail: {execution_mode: async_unordered, describe: 'Write those packed 64 bytes for dims [448+32*group, +32) into the smem_stage row when valid_rows > 32, else straight to part_o'}
                  part_stats: {execution_mode: async_unordered, describe: 'Group 0 lanes write m_shift and dsum of their own valid rows as the part_ms and part_ds words of this (item, split, row) slot, each row once'}
                  empty_stats: {execution_mode: async_unordered, describe: 'For a live empty window with s_item > 1, group 0 lanes write part_ms = NEG_INF and part_ds = 0 for their own valid rows; no part_o is written'}
                  row_dst: {execution_mode: async_unordered, describe: 'Group 0 lanes publish each valid row''s part_o workspace address into the smem_stage destination words, so the row copy needs no per-row division'}
                  o_rows: {execution_mode: async_unordered, describe: 'Warp w copies staged rows w, w+8 and on below valid_rows, each 1024 bytes in two passes of 32 lanes x 16 bytes, into the published part_o addresses'}
                await:
                  kv_ready: {execution_mode: serial, describe: 'Wait for every outstanding copy group, then a CTA barrier and after-sync fence: smem_q, smem_kv slot (t-t_begin)%2 and the tmem base become readable'}
                  s_ready: {execution_mode: serial, describe: 'Wait on bar_s; done covers s_tile(t) complete in tmem columns [448,512) and readable by the warp-synchronous loads of compute:softmax(t)'}
                  pv_main: {execution_mode: serial, describe: 'Wait on bar_pv for the argument tile: its dims [0,448) products are accumulated into the tmem output columns, so the next rescale may rewrite them'}
                  pv_tail: {execution_mode: serial, describe: 'Wait on bar_pv2; done covers tail_tile(t) readable in the scratch columns, while the same tile dims [0,448) products may still be queued'}
                  stage_ready: {execution_mode: serial, describe: CTA barrier; done covers every staged row byte in smem_stage and every published destination word being readable by all eight warps}
                signal: {p_ready: {execution_mode: serial, describe: 'Before-sync fence, async-proxy publication of p_hi(t) and p_lo(t), CTA barrier, after-sync fence; done covers both groups'' words visible to products'}}
                acquire: {tmem: {execution_mode: serial, describe: Warp 0 reserves all 512 tensor-memory columns as one allocation and gives up the CTA's allocation permit; the base is read after the first barrier}}
                release: {tmem: {execution_mode: serial, describe: 'Before-sync fence and CTA barrier, then warp 0 returns all 512 columns; done covers all warps tensor-memory reads, the last being compute:o_chunk(6)'}}
            Pipe:
              - if(split < min(ceil_div(ntiles,tiles_per_cta), splits)):
                  - compute:granularity
                  - if(split == 0):
                      - store:pub_words
                  - if(split < s_item):
                      - if(t_begin < t_end):
                          - acquire:tmem
                          - compute:barrier_init
                          - load:q_tile
                          - load:kv_tile(t_begin)
                          - for(t):
                              - await:kv_ready(t)
                              - matmul:query_rows@kv_tile(t)
                              - if(t > t_begin):
                                  - await:pv_main(t-1)
                              - if(t + 1 < t_end):
                                  - load:kv_tile(t+1)
                              - await:s_ready(t)
                              - compute:softmax(t)
                              - signal:p_ready(t)
                              - matmul:p(t)@v_tail(t)
                              - matmul:p(t)@v_main(t)
                              - await:pv_tail(t)
                              - compute:tail_drain(t)
                          - await:pv_main(last(t))
                          - compute:dsum_merge
                          - compute:part_scale
                          - for(c):
                              - compute:o_chunk(c)
                              - store:part_chunk(c)
                          - compute:o_tail
                          - store:part_tail
                          - store:part_stats
                          - if(valid_rows > 32):
                              - store:row_dst
                              - await:stage_ready
                              - store:o_rows
                          - release:tmem
                      - if(t_begin >= t_end and s_item > 1):
                          - store:empty_stats
            Waiting:
              Prepared:
                - '{done await:kv_ready(t)} ← [{done load:kv_tile(t)}]'
                - '{done await:s_ready(t)} ← [{done matmul:query_rows@kv_tile(t)}]'
                - '{done await:pv_tail(t)} ← [{done matmul:p(t)@v_tail(t)}]'
                - '{done await:pv_main(t)} ← [{done matmul:p(t)@v_main(t)}]'
                - '{done await:stage_ready} ← [{done store:part_chunk(c)}, {done store:part_tail}, {done store:row_dst}]'
              Released:
                - '{issue load:kv_tile(t)} ← [{done matmul:query_rows@kv_tile(t-2)}, {done matmul:p(t-2)@v_tail(t-2)}, {done matmul:p(t-2)@v_main(t-2)}]'
                - '{issue compute:softmax(t)} ← [{done matmul:p(t-2)@v_tail(t-2)}, {done matmul:p(t-2)@v_main(t-2)}]'
                - '{issue matmul:p(t)@v_tail(t)} ← [{done compute:softmax(t)}]'
                - '{issue matmul:query_rows@kv_tile(t)} ← [{done compute:tail_drain(t-1)}]'
      COMBINE:
        Storage:
          s_ms: {meaning: Gathered published shifts of the row's splits, depth: 1, location: smem, shape: [{split: 512}],
            dtype: fp32, total_size: 2048, view: {part_ms(sig): {}}}
          s_ds: {meaning: Gathered published denominators of the row, depth: 1, location: smem, shape: [{split: 512}],
            dtype: fp32, total_size: 2048, view: {part_ds(sig): {}}}
          s_w: {meaning: Merge weights wd of the row's splits, depth: 1, location: smem, shape: [{split: 512}],
            dtype: fp32, total_size: 2048, view: {wd(sig): {}}}
          s_acc: {meaning: Group merge staging; idle in this configuration, depth: 1, location: smem, shape: [{group: 1}, {dim: 512}],
            dtype: fp32, total_size: 2048}
        Role:
          MAIN:
            Info:
              Describe: >-
                All four warps cooperate on one row: statistics are gathered once and reduced CTA-wide, then each thread merges and stores its four dims
              Member: warp[0:4]
              Using_verb:
                compute:
                  gather_stats: {execution_mode: serial, describe: 'Read the published s_item as ns, store prefetched pairs for tid < ns into s_ms/s_ds, stride-load splits [128, ns), barrier; arrays readable CTA-wide'}
                  row_max: {execution_mode: serial, describe: 'Each thread strides s_ms for sig < ns taking m_all, reduced by warp shuffles and a cross-warp pass with two barriers; done covers m_all CTA-uniform'}
                  row_weights: {execution_mode: serial, describe: 'Each thread strides sig < ns: w = exp2(part_ms - m_all), 0 at NEG_INF, wd = w*part_ds into the s_w view, dsum_all accumulated and CTA-reduced uniform'}
                  row_scale: {execution_mode: serial, describe: 'Every thread computes inv, base_lse, the sink merge when provided and scale = inv*oscale in registers by the merge step; done covers scale ready'}
                  merged_dims: {execution_mode: serial, describe: 'Each thread walks sig < ns in unrolled batches of four: s_w weights, then 8-byte fp16 part_o loads, then wd*part_o FP32 accumulates; wd = 0 skips'}
                load: {spec_stats: {execution_mode: async_unordered, describe: 'Each thread tid < splits loads split tid''s (part_ms, part_ds) pair for this (item, row) before resolving; in bounds grid-wide, dropped if unused'}}
                store:
                  out_row: {execution_mode: async_unordered, describe: 'Scale the four merged dims by scale, pack two bf16 pairs and write one 8-byte vector store into dims [4*dt, 4*dt+4) of the attention_output row'}
                  lse: {execution_mode: async_unordered, describe: Thread 0 writes the row's base_lse after the sink merge to attention_lse; with no lse buffer the action writes nothing}
            Pipe:
              - load:spec_stats
              - if(row < valid_rows):
                  - compute:gather_stats
                  - compute:row_max
                  - compute:row_weights
                  - compute:row_scale
                  - compute:merged_dims
                  - store:out_row
                  - store:lse
            Waiting:
              Prepared: ['{issue compute:gather_stats} ← [{done load:spec_stats}]']
REALIZATION:
  Require:
    - Item: DESIGN.Work_schedule::ATTENTION.Mapping
      Choice: 256 threads per attention CTA, __launch_bounds__(256, 1), and a 188416-byte dynamic shared memory request raised through cudaFuncAttributeMaxDynamicSharedMemorySize, set once per kernel instantiation and outside any stream capture.
      Reason: The raised attribute makes the 188416-byte dynamic request grantable and __launch_bounds__(256, 1) keeps register pressure within one resident worker per SM; setting the attribute outside capture keeps it off the graph replay path the launcher prewarms for.
    - Item: DESIGN.Work_schedule::COMBINE.Mapping
      Choice: Combine CTAs launch 128 threads with __launch_bounds__(128) and statically sized shared arrays for the 512-split ceiling
      Reason: The single-group 512-dim member fixes the thread count at one thread per four output dims, and static sizing keeps the short-lived combine CTAs free of dynamic shared memory setup
    - Item: DESIGN.Tile_pipeline::ATTENTION.MAIN
      Choice: tcgen05.alloc cta_group::1 of all 512 columns once in the prologue, tcgen05.relinquish_alloc_permit immediately after it, and one tcgen05.dealloc after the epilogue barrier.
      Reason: acquire:tmem and release:tmem hold the whole tensor memory for one work item, and the relinquish makes any later allocation by this CTA undefined, so it cannot be deferred or repeated
    - Item: DESIGN.Tile_pipeline::ATTENTION.MAIN
      Choice: tcgen05.mma.cta_group::1.kind::f8f6f4 with shared-memory descriptors for all three products, each closed by tcgen05.commit to its own mbarrier initialised to one arrival.
      Reason: Provides the FP32 tensor-memory accumulation the math requires and the per-product completion the three awaits consume; separate commits let the tail drain run while the 448-dim products stay queued
    - Item: DESIGN.Tile_pipeline::ATTENTION.MAIN
      Choice: tcgen05.ld and tcgen05.st .sync.aligned 32x32b for every tensor-memory access, with a warp vote making the rescale branch uniform across each warp
      Reason: The rescale reads, scales and writes back whole 32-column chunks; divergence inside a warp-synchronous access is undefined, and the vote keeps one path with factor 1 where unneeded
    - Item: DESIGN.Tile_pipeline::ATTENTION.MAIN
      Choice: fence.proxy.async.shared::cta before every product reading the probability tile, and tcgen05.fence::before_thread_sync plus after_thread_sync around each barrier ordering tensor-memory accesses.
      Reason: The probability words are written through the generic proxy and read through the async proxy, so without these fences the products may read stale operands or the drains may reorder across the barriers
    - Item:
        - DESIGN.Tile_pipeline::ATTENTION.Storage.smem_q
        - DESIGN.Tile_pipeline::ATTENTION.Storage.smem_kv
        - DESIGN.Tile_pipeline::ATTENTION.Storage.smem_p
      Choice: A shared-memory tile layout the tcgen05 descriptor can encode, using 64-byte swizzle atoms with the chunk index swizzled inside each eight-row block
      Reason: The products take descriptors rather than addresses, so a layout the descriptor cannot describe reads the wrong operands; every copy and store address must match it.
    - Item: DESIGN.Work_schedule::Flow
      Choice: Submit ATTENTION and COMBINE on one caller stream with no intervening work
      Reason: The kernel-completion boundary is the only mechanism making the workspace partials and the published s_item word visible to the combine plain global loads; the source relies on same-stream order instead of events or flags
  Prefer:
    - Item: DESIGN.Tile_pipeline::ATTENTION.MAIN
      Choice: 16-byte cp.async.cg copies for load:q_tile and load:kv_tile, with each key's page-table entry loaded before its copy burst is issued.
      Reason: A key's address depends on an independent table entry and page_size can be 1, so no bulk tensor copy describes the tile; splitting the table load keeps its latency off the tensor pipe's feed path.
    - Item: DESIGN.Tile_pipeline::COMBINE.MAIN
      Choice: Run the merge loop in unrolled batches of four splits, reading the four s_w weights before issuing the four 8-byte fp16 vector loads and accumulating afterwards
      Reason: Batching keeps the scalar weight reads off the partial-load latency chain; the source exposes the batch width as a tuned knob defaulted to four
