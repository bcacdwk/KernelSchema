        Storage:
          weights_slot: {meaning: Per-split merge weights published by one thread, depth: 1, location: smem, shape: [{split: 8}],
            dtype: fp32, total_size: 32, view: {merge_weight(s): {region: {split: [s, s+1]}}}}
          norm_slot: {meaning: Row normalization published by the leading thread, depth: 1, location: smem, shape: [],
            dtype: fp32, total_size: 4, view: {norm: {}}}
        Role:
          MAIN:
            Info:
              Describe: Form the row's merge weights and normalization on the leading thread, then aggregate the partial rows into the BF16 output row
              Member: warp[0:8]
              Using_verb:
                compute: {weights: {execution_mode: serial, describe: The leading thread derives merge_max and forms merge_weight(s) and norm into both slots from the nonempty splits' stats; done covers the CTA barrier}}
                store: {out: {execution_mode: serial, describe: Each thread aggregates its two value columns over the positive-weight splits with fused multiply-adds; scales by norm and writes the rounded BF16 pair}}
            Pipe:
              - compute:weights
              - store:out
REALIZATION:
  Require:
    - Item:
        - DESIGN.Tile_pipeline::ATTENTION.QK
        - DESIGN.Tile_pipeline::ATTENTION.PV
      Choice: tcgen05.mma.cta_group::1.kind::f8f6f4 with FP32 tensor-memory accumulators, each burst closed by tcgen05.commit to the mbarrier named by the consuming role
      Reason: The Released edges free the KV, score and probability slots on one notification covering both the accumulator update and the operand reads, which only the tensor-core commit provides
    - Item: DESIGN.Tile_pipeline::ATTENTION.PV
      Choice: Read the value operand from the same kv_ring slot through an MN-major transposed operand descriptor instead of the K-major form the score product uses, and stage no separate value tile
      Reason: Storage registers one KV region for both operands; a separate value copy would double the 131072-byte ring and break the single release shared by the two products
    - Item: DESIGN.Tile_pipeline::ATTENTION.LOAD
      Choice: cp.async.bulk.tensor gather4 loads against a 2-D tensor map of the physical cache rows and a 4-D tiled map for the query block, both announcing their byte counts to the receiving mbarrier
      Reason: The selection is an arbitrary list of physical rows, so only a gather form fills a dense 128-row tile; the announced 65536 and 32768 bytes are the publication the score product waits on
    - Item: DESIGN.Work_schedule::ATTENTION.Schedule
      Choice: Launch through cudaLaunchKernelExC with an explicit single-CTA cluster dimension so that clusterlaunchcontrol.try_cancel can reclaim not-yet-started CTAs of the same grid
      Reason: Refill is the only source of work after the preassigned coordinate, so without a cluster launch neither the claim sequence nor the refill_exhausted exit condition is available
    - Item: CONTRACT.Hardware_specification.Execution.cta
      Choice: Launch the attention step with 512 threads and 191104 bytes of dynamic shared memory, raise the max dynamic shared memory attribute once per device and keep one CTA resident per SM
      Reason: All 16 warps hold a role, and the registered regions with barriers and alignment padding reach 191104 bytes, including 1536 bytes of exchange regions this design does not use
    - Item: DESIGN.Tile_pipeline::ATTENTION.Storage.tmem_acc
      Choice: Allocate all 512 tensor-memory columns from one warp before the roles start, publish the base address in shared memory, relinquish the alloc permit and deallocate from the score-product role
      Reason: The score phases and the output accumulator are views of one allocation that outlives every work item, and the closing signal of all tensor-memory users is the only return point
    - Item: DESIGN.Math_reshape::prob
      Choice: Evaluate exp2 with ex2.approx.ftz.f32, keeping the flush-to-zero behaviour of the declared path
      Reason: Arithmetic.Approx declares it as an approximate flush-to-zero operation, so exact or subnormal-preserving substitutes would realize a different numeric path
    - Item: DESIGN.Math_reshape::prob_e4m3
      Choice: Narrow with cvt.rn.satfinite.e4m3x2.f32
      Reason: The declared round-to-nearest saturating narrowing is what bounds the weight error at 2^-4 and keeps the 2^8-prescaled weights finite in E4M3
    - Item: DESIGN.Math_reshape::merge_weight
      Choice: Evaluate the merge weights with exp2f, the approximate base-2 exponential of the CUDA math library
      Reason: The merge step's Arithmetic.Approx declares this exp2 as approximate, so an exact substitute would realize a different numeric path
    - Item: DESIGN.Work_schedule::Flow
      Choice: Submit the merge step as a second kernel of 256 threads per output row on the same CUDA stream, immediately after the attention kernel
      Reason: Same-stream submission realizes the start_after ATTENTION.kernel_done edge and the global visibility of partial, split_max and split_sum that the merge reads require
  Prefer:
    - Item:
        - DESIGN.Math_reshape::row_sum
        - DESIGN.Math_reshape::value_acc
      Choice: Evaluate the row-sum accumulation and the accumulator rescale with packed two-element FP32 instructions, preserving each element's operations and rounding
      Reason: Both are per-tile passes over 64 and 512 elements per row, so packing halves the instruction count without touching the declared numeric path
  Forbid:
    - Item:
        - DESIGN.Tile_pipeline::ATTENTION.LOAD
        - DESIGN.Tile_pipeline::ATTENTION.PV
      Choice: Reviving the loader's disabled separate value-load branch that survives as dead code in the fixed source
      Reason: The value operand is the kv_ring slot read transposed by the value product, so a second value buffer would double the 131072-byte ring and change the registered storage account
    - Item:
        - DESIGN.Tile_pipeline::ATTENTION.SOFTMAX
        - DESIGN.Math_reshape::row_sum
      Choice: Seeding row_sum from the disabled sink path that survives in the softmax role's row initialization
      Reason: row_sum(-1) = 0 is the declared initial state and the Contract has no sink input, so a seed would change every normalized weight with no defined source
