            Waiting:
              Prepared:
                - '{issue compute:rescale(n)} ← [{done SOFTMAX::compute:acc_scale(n)}, {done PV::matmul:p(n-1)@v(n-1)}]'
                - '{issue compute:row_stats(t)} ← [{done SOFTMAX::compute:final_stats(t)}, {done PV::matmul:p(n[t, split_tiles-1])@v(n[t, split_tiles-1])}]'
                - '{issue await:next_work(u)} ← [{done SCHED::compute:claim(u)}]'
              Released: ['{issue release:o_slot(n)} ← [{done SOFTMAX::compute:acc_scale(n)}]']
          QK:
            Info:
              Describe: Issue the score products of the item's query block against each KV tile; the first product of a tile initializes its score block
              Member: warp[8:9]
              Register: 136
              Using_verb:
                matmul: {q@k: {execution_mode: async_ordered, describe: Sixteen 32-feature E4M3 products of q_slot by kv_ring slot n%2 into tmem_acc raw_score(n); done covers the block and both operand reads}}
                await:
                  s_drain: {execution_mode: serial, describe: Per-item drain waiting until the softmax role has finished reading the item's last score tile before this role advances}
                  next_work: {execution_mode: serial, describe: Read the round-u reply from reply_ring slot u%2 and return the slot; done covers both and an empty reply ends the item sequence}
                  all_tmem_free: {execution_mode: serial, describe: Wait until every tensor-memory user of this CTA has signalled}
                signal: {tmem_free: {execution_mode: serial, describe: Signal that this role has issued its last tensor-core product and no longer uses tmem_acc}}
                release:
                  q_slot: {execution_mode: serial, describe: Return q_slot to the loader role; done covers the tensor-core commit proving this role's reads of q_slot for the item are finished}
                  tmem: {execution_mode: serial, describe: Return the 512-column tensor-memory allocation; done covers the deallocation}
            Pipe:
              - for(u):
                  - for(t[u]):
                      - for(n[t]):
