    - Item: DESIGN.Tile_pipeline::MAIN.Storage.tmem_acc
      Choice: Read and write both accumulators through the M=128 cta_group::2 tensor-memory layout, in which each CTA holds its own 64 rows with the columns of the product folded into two 64-lane halves
      Reason: The four softmax warps take head-half by KV-half pairs and the four epilogue warps head-half by value-half pairs, so both cross-half merges and the output group of a box resolve only against that fold
    - Item: DESIGN.Tile_pipeline::MAIN.Storage.tmem_acc
      Choice: Allocate the 512 tensor-memory columns from one warp of each CTA with tcgen05.alloc.cta_group::2, publish the base address in shared memory, relinquish the alloc permit and deallocate as a pair
      Reason: The score phases and the output accumulator are views of one paired allocation outliving every work item, and a cta_group::2 deallocation is only legal once the tensor-memory users of both CTAs retired
    - Item:
        - DESIGN.Tile_pipeline::MAIN.LOAD_K
        - DESIGN.Tile_pipeline::MAIN.LOAD_V
      Choice: cp.async.bulk.tensor gather4 loads with multicast::cluster.cta_group::2 against a 2-D map of the physical cache rows, a 4-D tiled map for the query block and 3-D maps for the two 64-feature tails
      Reason: The selection is an arbitrary list of physical rows, so only a gather form fills a dense tile, and the announced 40960, 40960 and 65536 bytes are the publication the products of the pair wait on
    - Item: DESIGN.Tile_pipeline::MAIN.CORRECTION
      Choice: Stage each normalized 32x64 BF16 box in shared memory and write out with a 3-D bulk tensor store against an output map of 64-feature groups, draining the box with cp.async.bulk.wait_group.read
      Reason: The 64-row halves of the accumulator and the 32-row boxes of the output share no layout, so a staged bulk store reaches the rows of the caller without a global scatter, and the drain frees the single slot
    - Item: DESIGN.Tile_pipeline::MAIN.SCHED
      Choice: Count the reply-slot return and the per-CTA tensor-memory retirement over the 15 and 14 warps that actually arrive them in each CTA, including warps 8 and 11 of the peer CTA that carry no design action there
      Reason: The reply ring of the pair is released only once every consumer of both CTAs has read it and each CTA retires on its own count, so those peer warps must still arrive both even though the peer issues no product
    - Item: DESIGN.Work_schedule::MAIN.Schedule
      Choice: Launch through cudaLaunchKernelExC with a two-CTA cluster dimension and the spread scheduling policy so that clusterlaunchcontrol.try_cancel can reclaim not-yet-started clusters of the same grid
      Reason: Refill is the only source of work after the preassigned item and its reply must reach both CTAs of a pair, so without a cluster launch neither the claim sequence nor the exit condition is available
    - Item: CONTRACT.Hardware_specification.Execution.cta
      Choice: Launch 512 threads with 232448 bytes of dynamic shared memory in each CTA of the pair, raise the max dynamic shared memory attribute once per device and keep one cluster per two SMs
      Reason: Each CTA launches 16 warps and the registered regions with barriers reach 232448 bytes per CTA, including 1024 bytes of barrier and tmem base storage and a 480-byte unused pad
