      Reason: >-
        load:kv's done is the landing barrier's transaction count and gather4's hardware swizzle writes byte-for-byte the layout the MMA descriptors assume; one instruction may name one tensor map, so the pool-major union and the analytic straddle test keep it legal
    - Item:
        - DESIGN.Tile_pipeline::MAIN.SOFTMAX
