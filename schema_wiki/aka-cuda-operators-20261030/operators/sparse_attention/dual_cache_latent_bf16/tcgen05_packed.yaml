      Reason: >-
        Every await/signal done guarantee of both roles resolves to these primitives, and the parity discipline is what lets the two-slot ring recycle its barriers safely across chunks
    - Item: DESIGN.Tile_pipeline::MAIN
      Choice: >-
        Exactly 512 TMEM columns per CTA - accumulator [0, 256) as two lane-offset M=64 halves, score buffers [256, 384) and [384, 512) - and a 227,188-byte dynamic smem request, the unpacked tile's account plus the 12,816-byte union working set, against the device opt-in minus ~1 KiB static
      Reason: >-
