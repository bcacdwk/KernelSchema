meta_data:
  name: dual_cache_latent_bf16
  describe: Joint sparse attention over prepared sliding-window and compressed shared key/value latents, with an optional zero-value softmax sink.
  source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/sparse_attention/dual_cache_latent_bf16/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: probe_dual
    parent: tc_grouped
    when: |
      Use the shipped automatic policy: force_cfg=0, force_s=0, normal non-diagnostic
      builds and unchanged default extension switches. Let W be the workspace byte
      capacity selected by Model.forward and N the cached value of dsv4::nsm_cached().
      Let P be the initial dsv4::make_plan(H,T,IndexWidth,W,0,0,N,true) in the fixed
      candidate/dsv4_kernel.cu, including its no-tcgen05 compile-time fallback.
      Select exactly when P.dual!=0, before any probe or token-range launch.
      This requires a built tcgen05 path, H<64, GT=pack_gt>2.6 and the saved non-tc
      alternative having splits=1. pack_gt starts at 64/H, halves while g>1 and
      either g*IndexWidth>2560 or ceil_div(T,g)<N, and returns 1 if g>T.
      Here GT is 4 or 8, H is 8 or 16, P.cfg=90 and both algorithms have one split.
      The whole invocation remains this node whether the probe accepts packed,
      rejects it, produces no positive samples or times out; parent when is not applied.
design:
  math_reshape:
    thesis: >-
      Probe sampled index overlap to choose packed 64-key tcgen05 attention or
      per-token 128-key mma.sync attention. Both use base-2 online softmax and BF16
      PV operands; packed work shares gathers but adds union construction, masked
      products and a different QK/normalizer order. A hidden probe commits a packed
      prefix before the decision, so one call can contain both numerical paths.
    rewrite:
      - step: probe
        name: Sample a multiplicity-aware overlap estimate and select the arithmetic path
        math: |
          GT=P.gt and NG=ceil_div(T,GT). Sample s in [0,8) addresses group g=s if
          NG<=8, otherwise floor(s*NG/8). For an existing full group let
          items_s=sum_{t=g*GT}^{g*GT+GT-1} Klen(t), using select's compact lengths.
          A missing group, a tail or cross-request group, items_s<=0 or items_s>2560
          produces Ratio[s]=-1. Invalid IDs count in items_s but do not enter the hash.
          For a usable group let c_v(e) count valid occurrences of pool-aware key e
          in member v, and Ustar=sum_e (1+sum_v max(c_v(e)-1,0)).
          The shipped probe can instead count Uhat=Ustar-sum_e delta_e:
          delta_e=1 when another occurrence belonging to the installing occurrence's
          token sets its membership bit before that installer's own bit update,
          otherwise 0. Key publication precedes this update; it is not one transaction.
          Ratio[s]=fp32(fp32(Uhat)*fp32(GT)/fp32(items_s)), including a possible zero.
          This records the source's repeat-count race, not an exact union guarantee.
          Ratio is initialized to -2 before each probe. After at most 2000000 polling
          passes, read each slot once in ascending s; let v_s be that read. Accumulate
          only v_s>0 in FP64, then ratio=fp32(sum_s fp64(v_s)/count_positive), or -1
          when no positive slot was read. Allocation/mapping failure also gives -1.
          Timeout does not force rejection: completed positive samples can still vote.
          Concurrent or late writes may change slots during these reads or a later reset;
          no coherent eight-sample snapshot or cross-call isolation is asserted.
          Accept packed exactly when 0<ratio<=fp32(2.6). The host assigns disjoint token
          regions below: a hidden prefix always uses select/gather/online/finalize;
          the remaining region, or the full batch without hiding, uses those steps on
          acceptance and mma on rejection. No attention kernel consumes Ratio itself.
        arithmetic:
          approx: 'The probe device ratio uses FP32 division under --use_fast_math; unknown: no supplied error bound. The host mean uses FP64 accumulation and division, then narrows to FP32.'
        symbol:
          Ratio: {meaning: Mapped probe slots consumed by host selection; -2 pending and -1 unusable., shape: [sample: 8], dtype: fp32, retention: 'keep_value invocation'}
      - step: select
        name: Form query rows and a multiplicity-preserving key sequence
        math: |
          These four steps apply to every packed region. M, KC, GT and NB are bound
          below. A work instance is (grp,hb), with t0=grp*GT and hb=0.
          Row r maps to (t0+floor(r/H),r mod H),
          toks=min(GT,T-t0), nrows=min(M,toks*H). Groups can cross request boundaries.
          Q[r,:] is the mapped query row for r<nrows, otherwise bf16(0).
          For each real token use the Contract request lookup and visible length:
          A(t)=min(max(visible,0),SW), Klen(t)=A(t)+max(min(sparse_topk_lens[t],IndexWidth)-SW,0).
          Its compact position k<Klen(t) reads original slot j=k for k<A(t),
          otherwise j=SW+k-A(t), with pool SWA or compressed respectively.
          Discard id<0 and identify each key by (pool,id), even when pools alias.
          If key e occurs c_g(e) times in member g, construct one shared entry with bits
          for every g with c_g(e)>0, plus max(c_g(e)-1,0) private entries with only bit g.
          Thus L=sum_e (1+sum_g max(c_g(e)-1,0)); e ranges over keys present in the group.
          UnionKey and Member store these entries, SWA first then compressed; let Us be
          the SWA count. Within each pool allocation is atomic-order dependent, and the
          compressed allocation order is reversed by the logical traversal. C=ceil_div(L,KC).
          The fixed source later overwrites part of UnionKey with barrier state; the
          execution limitation in gather and tile_pipeline is part of this design.
        symbol:
          M: {meaning: Matrix rows per worktile., binding: 'bind:design.work_schedule::M'}
          KC: {meaning: Keys per iteration., binding: 'bind:design.work_schedule::KC'}
          GT: {meaning: Consecutive tokens per group., binding: 'bind:design.work_schedule::GT'}
          NB: {meaning: Head blocks per token group., binding: 'bind:design.work_schedule::NB'}
          Q: {meaning: Query rows including zero padded rows., shape: [row: M, latent: D], dtype: bf16}
          UnionKey: {meaning: Packed build result encoding pool and physical row; intended retention is violated by the recorded control overlap., shape: [key: L], dtype: int32, retention: 'keep_value (grp,hb)'}
          Member: {meaning: Entry membership bits; private entries retain repeated slots., shape: [key: L], dtype: uint8, retention: 'keep_value (grp,hb)'}
      - step: gather
        name: Gather actual cache rows including masked work
        math: |
          For c in [0,C), u in [0,KC), k=c*KC+u. Read encoded keys from the live
          UnionKey storage (zero for k>=L),
          decode the pool from its upper bits and row from its low 24 bits, and use
          valid[r,u]=(k<L and bit floor(r/H) of Member[k] is set).
          The pool boundary is Us. A chunk whose boundary
          lies strictly inside it and is not aligned to four keys uses individual-row
          copies. Other chunks gather four rows from the pool chosen by the first
          position of each four-row group. Padding uses encoding zero; padding
          in a group starting with a compressed entry reads compressed row 0,
          whereas an all-padding group reads SWA row 0. The copied row is Gather[c,u,:].
          Neither padding nor a false member bit makes this BF16 latent zero; QK and PV
          still execute on all M*KC positions. Only the score mask removes a value term.
          Source limitation: control initialization/allocation and later barrier updates
          overlap the packed key storage and the TMEM-base word. The constructed
          UnionKey is not guaranteed to reach these loads unchanged, nor are the landing
          waits reliable. The equations describe reached arithmetic on the loaded values;
          they do not assert successful completion or Contract equivalence for this source.
        symbol:
          Gather: {meaning: BF16 rows actually loaded by the selected gather mechanism., shape: [slot: KC, latent: D], dtype: bf16}
      - step: online
        name: Split QK summation and lazy-maximum softmax recurrence
        math: |
          a1=fp32(bmm1_scale), a2=fp32(bmm2_scale), L2=fp32(1.4426950408889634),
          neg=fp32(-3.0e38), qs=a1*L2. E2 is the compiled fast exp2f.
          sink2[r]=sinks[head(r)]*L2 for a real row with a sink, neg for a padded row
          with a sink, and -inf without a sink. For C>0 initialize m(-1)[r]=sink2[r]
          if present, otherwise neg; l(-1)[r]=0 and Acc(-1)[r,:]=0.
          At iteration c, compute Z0=mm32(Q[:,0:256],Gather[c,:,0:256]^T) and
          Z1=mm32(Q[:,256:512],Gather[c,:,256:512]^T), each as sixteen successive
          16-wide BF16-input products with an independent FP32 accumulator.
          Z=fp32(Z0+Z1); X[r,u]=Z[r,u]*qs when valid[r,u], otherwise -inf.
          Let maxnum be FP32 fmaxf. z=maxnum(m(c-1)[r],maxnum_u X[r,u]);
          z=z if z>neg*0.5, otherwise neg. Set m(c)[r]=m(c-1)[r] if
          z-m(c-1)[r]<=1, otherwise z. This is RD=1, not an exact running maximum.
          alpha[r]=E2(m(c-1)[r]-m(c)[r]); E[r,u]=E2(X[r,u]-m(c)[r]).
          Prob[r,u]=bf16(E[r,u]). For each half b=0,1 form four FP32 sums
          q[b,a]=sum_{j=0..7 in ascending order} E[r,32*b+4*j+a], a=0..3,
          each starting at zero; rs[b]=(q[b,0]+q[b,1])+(q[b,2]+q[b,3]).
          l(c)[r]=l(c-1)[r]*alpha[r]+(rs[0]+rs[1]); the denominator uses unrounded E.
          Acc(c)=mma32(Prob,Gather[c,:,:],alpha[:,None]*Acc(c-1)).
          PV advances through four 16-key products for each of two disjoint 256-column
          output halves. On c=0 its first product overwrites rather than reading Acc(-1).
          For c>0 the existing accumulator is separately multiplied by alpha before PV;
          a block of sixteen rows skips this round trip only if all its alpha values equal 1.
        symbol:
          m: {meaning: Lazy base-2 row maximum., shape: [row: M], dtype: fp32, retention: 'carry_forward (grp,hb); c=-1..C-1'}
          l: {meaning: Normalizer excluding the sink term., shape: [row: M], dtype: fp32, retention: 'carry_forward (grp,hb); c=-1..C-1'}
          Acc: {meaning: Full unnormalized value accumulator., shape: [row: M, latent: D], dtype: fp32, retention: 'carry_forward (grp,hb); c=-1..C-1'}
          Prob: {meaning: Rounded exponential operands for PV., shape: [row: M, slot: KC], dtype: bf16}
        arithmetic:
          approx: 'E2 and division use --use_fast_math; unknown: no source-provided error bound. RD=1 permits exponentials above 1; the finite sentinel/clamp supplies no input-magnitude guarantee.'
          accumulate: 'Scalar FP32 expressions may contract under fast-math compilation. Atomic union order, the two QK partials, the half-wise normalizer and lazy maximum change rounding; no bitwise or external-tolerance guarantee is inferred.'
      - step: finalize
        name: Add the sink once and overwrite real output rows
        math: |
          If C=0, write bf16(0) for every owned real (token,head,latent) element.
          Otherwise, after the last PV, z[r]=l(C-1)[r]+E2(sink2[r]-m(C-1)[r]);
          inv[r]=a2/z[r] for a real row with z[r]>0, otherwise 0.
          Write out[token(r),head(r),d]=bf16(Acc(C-1)[r,d]*inv[r]) for r<nrows.
          The sink has no value contribution. No split partials, combine, or numerical
          global scratch are produced. E2, division and scalar arithmetic follow online.
          These are the source's reached stores; gather's recorded execution defect
          prevents treating full writeback or termination as a guarantee.
      - step: mma
        name: Per-token synchronous alternative with a full-latent QK chain
        math: |
          Only for tokens assigned the rejected region, bind HBm and KCm below.
          Cm(t)=ceil_div(Klen(t),KCm). Qm[r,:]=query[t,r,:] for r<H, otherwise bf16(0),
          r in [0,HBm). Write Cm=Cm(t). At chunk c and u in [0,KCm), k=c*KCm+u, j=k if k<A(t), else SW+k-A(t).
          id=sparse_indices[t,j] when k<Klen(t), otherwise -1.
          Vm[c,u,:] reads row max(id,0) from SWA if k<A(t), else compressed.
          Thus repeated slots remain separate and invalid/padded positions still gather.
          Use a1,a2,L2,neg,E2 from online. For Cm>0, sinkm[r] is sinks[r]*L2 for
          real heads with a sink, neg for padded heads with a sink, and -inf without.
          Initialize mm(-1)=sinkm if a sink is present, otherwise neg; lm(-1)=0,
          Om(-1)=0. For c=0..Cm-1, Zm=mm32(Qm,Vm[c,:,:]^T) is one FP32 chain
          of 32 successive 16-wide BF16-input products along the whole D axis.
          Xm[r,u]=Zm[r,u]*(a1*L2), replaced by -inf where id<0.
          z=maxnum(mm(c-1)[r],maxnum_u Xm[r,u]); mm(c)[r]=z if z>neg*0.5 else neg.
          am[r]=E2(mm(c-1)[r]-mm(c)[r]); Em[r,u]=E2(Xm[r,u]-mm(c)[r]);
          Pm[r,u]=bf16(Em[r,u]). For v=0..7, a=0..3, initialize R[v,a]=0,
          then add Em[r,16*v+8*n+2*a]+Em[r,16*v+8*n+2*a+1] for n=0,1.
          rs starts at zero and adds (R[v,0]+R[v,1])+(R[v,2]+R[v,3]) in ascending v.
          lm(c)[r]=lm(c-1)[r]*am[r]+rs;
          Om(c)=mma32(Pm,Vm[c,:,:],am[:,None]*Om(c-1)), eight 16-key PV products.
          After the last chunk, last=Cm-1 and z=lm(last)+E2(sinkm-mm(last)); inv=a2/z for real
          heads with z>0, otherwise 0. Store out[t,r,d]=bf16(Om(last)[r,d]*inv[r])
          for r<H. Cm=0 writes bf16(0) over the token's output without the recurrence.
          No KV split, output-column split, global partial state or combine is used.
          E2, division, fmaxf and scalar contraction follow online's arithmetic exceptions;
          mma does not use its RD=1 update, two QK partials or packed member masking.
        symbol:
          HBm: {meaning: Heads in an alternative worktile., binding: 'bind:design.work_schedule::HBm'}
          KCm: {meaning: Slots per alternative iteration., binding: 'bind:design.work_schedule::KCm'}
          Qm: {meaning: Alternative query rows with padded heads., shape: [head: HBm, latent: D], dtype: bf16}
          Vm: {meaning: Alternative gathered BF16 values including row-zero substitutions., shape: [slot: KCm, latent: D], dtype: bf16}
          Pm: {meaning: Alternative BF16 PV probabilities., shape: [head: HBm, slot: KCm], dtype: bf16}
          mm: {meaning: Alternative running maximum., shape: [head: HBm], dtype: fp32, retention: 'carry_forward (t); c=-1..Cm-1'}
          lm: {meaning: Alternative normalizer excluding the sink., shape: [head: HBm], dtype: fp32, retention: 'carry_forward (t); c=-1..Cm-1'}
          Om: {meaning: Alternative unnormalized full-latent result., shape: [head: HBm, latent: D], dtype: fp32, retention: 'carry_forward (t); c=-1..Cm-1'}
    ledger:
      baseline: Direct FP32 Contract evaluation of each real token/head, fetching each selected BF16 cache row once and retaining its widened value for QK/PV, with full logits and probabilities materialized.
      footprint:
        - {item: Probe and alternative state, change: 'Probe adds 32 logical result bytes per call and transient hashing; each alternative worktile retains HBm*KCm FP32 scores, HBm*KCm BF16 probabilities and 4*HBm*(D+2) bytes of recurrence state instead of full-row scores/probabilities.', by: [probe, mma]}
        - {item: Score materialization, change: 'Full 8*H*sum_t count(J(t)) bytes -> per active packed worktile, two FP32 M*KC QK partials and one BF16 M*KC probability tile per live chunk, plus 4*M*(D+2) bytes of recurrence state; physical buffering is below.', by: [online]}
        - {item: Packed union, change: '0 -> 5*L logical bytes per group plus transient hash/index construction; the control overlap is not counted as safe reuse.', by: [select]}
      matmul:
        - {item: Alternative contractions, change: '2*H*count(J(t))*D -> 2*HBm*Cm(t)*KCm*D MACs per alternative token, including head/key padding.', by: [mma]}
        - {item: Padded and masked products, change: 'Per worktile 2*D*sum over owned real rows count(J(token(r))) -> 2*M*C*KC*D MACs; QK adds M*C*KC FP32 partial pairs. No output partition repeats QK.', by: [gather, online]}
      traffic:
        - {item: Probe index reread, change: 'Adds 4*sum_usable_samples items_s bytes of index reads plus 32 result bytes; attention rereads its own indices and rebuilds packed unions rather than consuming probe state.', by: [probe, select]}
        - {item: Alternative gathers, change: '2*D*H*count(J(t)) -> 2*Cm(t)*KCm*D logical cache bytes per alternative token, shared by heads and QK/PV.', by: [mma]}
        - {item: Cache gathers, change: 'Direct independent-head evaluation requests 2*D*sum over owned real rows count(J(token(r))) bytes of BF16 cache data -> 2*C*KC*D bytes per worktile, reused for QK and PV; excludes cache-line effects and index reads.', by: [select, gather, online]}
      error:
        - {item: Content-dependent numerical path, change: 'A call can mix the packed and alternative reduction orders; sample/repeat-count/timeout behavior selects that path without a numerical error guarantee. The alternative also narrows each PV probability to BF16.', by: [probe, mma]}
        - {item: Numerical changes, change: 'M*KC exponentials per chunk narrow FP32 -> BF16 only for PV; QK half-sums, union order, RD=1, grouped sums, fast exponentials and FP32 scale casts alter rounding without a supplied error bound.', by: [select, online, finalize]}
  work_schedule:
    thesis: |
      Eight probe CTAs inform a host choice. When hiding is available, an unconditional
      packed prefix on the caller stream overlaps the probe and selected remainder on
      a side stream; otherwise the whole selected batch follows the probe on the caller.
      Bind M=64, KC=64, GT=P.gt, NB=1; the saved alternative is cfg8 with HBm=16,
      KCm=128, one split and no D partition. Its original full-batch plan is retained
      even if the selected remainder is short; the planner is not rerun for that range.
      Let K=N-8. Hidden is true exactly when g_probe_hide!=0, GT>1, both splits=1,
      the incoming range is full (tok0=tok1=0), side stream/fork/join/gate resources
      exist, K>=1, NG>=2*K, fork record/wait succeed and probe_begin succeeds.
      If Hidden, prefix covers [0,K*GT), and the selected packed or mma phase covers
      [K*GT,T). Otherwise prefix is absent and the selected phase covers [0,T).
      The host polls after submitting prefix; acceptance is defined by math probe.
      Flow lists conditional kernel submissions. Only one of packed/mma is submitted.
      If probe_begin lacks its mapped buffer, probe is absent and its completion edge
      is absent too; ratio=-1 selects mma directly. Failed hiding gates precede prefix
      submission and lead to the serial probe path, not a partially recomputed prefix.
      In the hidden route fork orders side behind prior caller work. Probe and prefix
      have no mutual completion wait. The remainder follows probe on side without
      waiting for prefix; a recorded join after the remainder is waited by caller
      after prefix. In the serial route the selected phase follows probe on caller.
      Thus caller-stream completion covers all reached output writes. CPU polling
      is not a device-completion fence, and no reserved SM placement is promised.
    flow:
      launch:
        - {phase: [probe]}
        - {phase: [prefix]}
        - {phase: [packed], start_after: probe.kernel_done}
        - {phase: [mma], start_after: probe.kernel_done}
    phase:
      probe:
        describe: Estimate overlap for eight spaced groups; each CTA writes one Ratio slot, consumed only by host polling and reduction.
        decomposition:
          strategy: |
            Sample s uses math probe's group mapping over the original full batch,
            including groups in prefix. Each CTA scans its GT tokens' compact index
            lists and hashes their keys; this is one whole sample worktile. Request
            lookup, integer counting and the hash reduction are CTA-local; unusable
            samples still publish -1. No Q or cache latent data is read by the probe.
          partition:
            sample: {size: 8, tile: 1}
          worktile:
            invariant:
              sparse_indices: {shape: [token: GT, slot: IndexWidth], dtype: int32}
              sparse_topk_lens: {shape: [token: GT], dtype: int32}
              seq_lens: {shape: [request: B], dtype: int32}
              cum_seq_lens_q: {shape: [boundary: 'B+1'], dtype: int32}
          target:
            single_tile:
              Ratio: {shape: [sample: 1], dtype: fp32}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 8
        schedule:
          worktile_order: [{by: sample, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      prefix:
        describe: 'Unconditional packed work only when Hidden; this phase binds [a,b)=[0,K*GT).'
        decomposition: &packed_decomposition
          strategy: |
            Each worktile owns all H heads and D columns of up to GT consecutive
            tokens in this phase's [a,b). Each member does its own request lookup;
            request boundaries do not restrict packed groups. nrows=min(M,toks*H)
            masks the tail and unused matrix rows but their products still execute.
            Build the pool-aware union once and walk c=0..C-1. There is no KV split,
            output-column partition, inter-CTA reduction or persistent work queue.
            C=0 writes zeros. Ownership does not promise completion despite the
            packed control-storage defect recorded in tile_pipeline.
          partition:
            token: {size: 'b-a', tile: GT}
          worktile:
            invariant:
              Q: {shape: [row: M, latent: D], dtype: bf16}
              sparse_indices: {shape: [token: GT, slot: IndexWidth], dtype: int32}
              sparse_topk_lens: {shape: [token: GT], dtype: int32}
              seq_lens: {shape: [request: B], dtype: int32}
              cum_seq_lens_q: {shape: [boundary: 'B+1'], dtype: int32}
              sinks: {shape: [head: H], dtype: fp32}
            iteration:
              Gather: {shape: [slot: KC, latent: D], dtype: bf16, direction: ascending}
          target:
            single_tile:
              out: {shape: [token: GT, head: H, latent: D], dtype: bf16}
        mapping: &packed_mapping
          worker: {unit: CTA, unit_count: 1}
          worker_count: 'ceil_div(b-a,GT)'
        schedule: &packed_schedule
          strategy: |
            run_tc requires a%GT=0 and sets tile0=a/GT. Physical block bidx maps to
            global group a/GT+gridDim.x-1-bidx (REV=true). Reversal is local to this
            submission, not an execution-order or co-residency guarantee.
          worktile_order: [{by: token, direction: descending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      packed:
        describe: 'Selected packed work on acceptance; [a,b)=[K*GT,T) if Hidden, otherwise [0,T).'
        decomposition: *packed_decomposition
        mapping: *packed_mapping
        schedule: *packed_schedule
      mma:
        describe: Per-token alternative on rejection over [a,b)=[K*GT,T) if Hidden, otherwise [0,T).
        decomposition:
          strategy: |
            One CTA owns a token, all H real heads and all D output columns; H<HBm
            pads its query rows to HBm. It walks c=0..Cm(t)-1 without splitting KV
            or deduplicating indices. No global scratch or combine is produced.
          partition:
            token: {size: 'b-a', tile: 1}
          worktile:
            invariant:
              Qm: {shape: [head: HBm, latent: D], dtype: bf16}
              sparse_indices: {shape: [token: 1, slot: IndexWidth], dtype: int32}
              sparse_topk_lens: {shape: [token: 1], dtype: int32}
              seq_lens: {shape: [request: B], dtype: int32}
              cum_seq_lens_q: {shape: [boundary: 'B+1'], dtype: int32}
              sinks: {shape: [head: H], dtype: fp32}
            iteration:
              Vm: {shape: [slot: KCm, latent: D], dtype: bf16, direction: ascending}
          target:
            single_tile:
              out: {shape: [token: 1, head: H, latent: D], dtype: bf16}
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: 'b-a'
        schedule:
          strategy: run_cfg sets tile0=a and grid=b-a; physical block bidx owns t=a+bidx.
          worktile_order: [{by: token, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: >-
      Probe CTAs overlap their next index load with shared hashing. Packed prefix
      and remainder instantiate the same two-slot producer/consumer KV pipeline,
      with separate QK/PV issuers; the alternative uses eight cooperative warps and
      one KV slot. Packed landing-barrier aliasing remains a source defect. Separate
      launches have independent local resources, even where YAML aliases share text.
    phase:
      probe:
        domain:
          j: [0, Jp]
        resource:
          Hash: {space: SMEM, member_slot_shape: [slot: 4096], dtype: uint64, slot_count: 1}
          Mask: {space: SMEM, member_slot_shape: [word: 1024], dtype: uint32, slot_count: 1}
          Meta: {space: SMEM, member_slot_shape: [element: 25], dtype: int32, slot_count: 1}
          IndexFlight: {space: register, member_slot_shape: [thread: 1024, record: 2, field: 3], dtype: int32, slot_count: 1}
          LocalCount: {space: register, member_slot_shape: [thread: 1024], dtype: int32, slot_count: 1}
        role:
          Sample:
            info:
              member: 'warp[0:32]'
              execution_mode: serial
              verb:
                prepare: |
                  A missing group immediately publishes -1 from thread 0 and returns.
                  Otherwise the first GT threads compute per-token compact counts,
                  SWA counts and request IDs into Meta; CTA-barrier before testing
                  tail/cross-request or invalid-size samples, which publish -1 and
                  return. All rejected samples set Jp=0; later actions are no-ops.
                  Otherwise Jp=ceil_div(items_s,1024). Clear 4096 64-bit Hash entries,
                  1024 packed Mask words and Meta's shared counter; CTA-barrier.
                  Initialize LocalCount=0 and prefetch item tid for tid<items_s.
                visit: |
                  At j, thread tid owns compact item tid+1024*j. Threads outside
                  items_s do nothing. Keep its ready (member,pool,id) in current
                  registers and issue the next item's index load before hashing this
                  one. That prefetch may overlap hashing and is consumed at the next
                  visit; it does not survive the final visit. Negative IDs skip hashing.
                  Encode pool/id as in select, store key+1 in Hash's upper 32 bits,
                  and linear-probe collisions. CAS success increments LocalCount then
                  ORs this token's bit into the hash-slot Mask byte. A same-key hit
                  ORs its bit and increments LocalCount only when the old bit was set.
                  No dense-position publication spin exists in this probe. In particular
                  the installing CAS is visible before its Mask update, which permits
                  math probe's repeat undercount; no ordering is inserted to repair it.
                finish: |
                  Each thread with nonzero LocalCount atomically adds it to the shared
                  counter, then all threads rendezvous. Evaluate the FP32 sample ratio;
                  thread 0 makes one final store to its mapped Ratio slot. No device
                  reduction across samples or second kernel follows. Hash/Mask/Meta
                  are not reused for attention. This CTA owns no next sample; host
                  visibility follows actual mapped observations, not a fabricated
                  per-slot event or CPU wait for kernel_done.
            pipe:
              prologue: ['prepare:Sample']
              steady:
                - repeat: j
                  steady: ['visit:Index(j)']
              epilogue: ['finish:Ratio']
      prefix: &packed_pipeline
        domain:
          c: [0, C]
        resource:
          Q: {space: SMEM, member_slot_shape: [row: M, latent: D], dtype: bf16, slot_count: 1}
          Ring:
            space: SMEM
            member_slot_shape: [byte: 131072]
            dtype: uint8
            slot_count: 1
            view:
              'Gather(c)': {part: {byte: ['65536*(c%2)', '65536*(c%2+1)']}, dtype: bf16}
              Hash: {part: {byte: [0, 65536]}, dtype: uint64}
              IndexStage: {part: {byte: [65536, 75776]}, dtype: int32}
              OutputStage: {part: {byte: [0, 66560]}, dtype: bf16}
          Prob:
            space: SMEM
            member_slot_shape: [row: M, slot: KC]
            dtype: bf16
            slot_count: 2
            view:
              'Prob(c)': {slot_index: 'c%2'}
          Flags:
            space: SMEM
            member_slot_shape: [slot: KC]
            dtype: uint8
            slot_count: 2
            view:
              'Flags(c)': {slot_index: 'c%2'}
          RowControl:
            space: SMEM
            member_slot_shape: [element: '4*M']
            dtype: fp32
            slot_count: 1
            view:
              InitialMax: {part: {element: [0, M]}}
              UnusedZero: {part: {element: [M, '2*M']}}
              Sink: {part: {element: ['2*M', '3*M']}}
              Scale: {part: {element: ['3*M', '4*M']}}
          ControlTail:
            space: SMEM
            member_slot_shape: [byte: 'max(16,4+5*UC)']
            dtype: uint8
            slot_count: 1
            view:
              LandingBarrier: {part: {byte: [0, 16]}, dtype: uint64}
              TmemBase: {part: {byte: [0, 4]}, dtype: uint32}
              UnionKey: {part: {byte: [4, '4+4*UC']}, dtype: int32}
              Member: {part: {byte: ['4+4*UC', '4+5*UC']}, dtype: uint8}
          TensorMemory:
            space: TMEM
            member_slot_shape: [lane: 128, column: 512]
            dtype: fp32
            slot_count: 1
            view:
              Acc: {part: {column: [0, 256]}}
              'Z0(c)': {part: {column: ['256+64*(c%2)', '320+64*(c%2)']}}
              'Z1(c)': {part: {column: ['384+64*(c%2)', '448+64*(c%2)']}}
          RowState: {space: register, member_slot_shape: [copy: 2, statistic: 2, row: M], dtype: fp32, slot_count: 1}
          ScoreRead: {space: register, member_slot_shape: [partial: 2, row: M, slot: KC], dtype: fp32, slot_count: 1}
          AccWindow: {space: register, member_slot_shape: [thread: 128, element: 64], dtype: fp32, slot_count: 1}
        role:
          Loaders:
            info:
              member: 'warp[4:8]'
              execution_mode: serial
              verb:
                prepare: &prepare |
                  Both roles execute their parts of this common 256-thread prologue.
                  Bind UC=2560. The first GT threads determine each member's request, A and Klen,
                  publish tokN/tokSwa, and all threads rendezvous. All issue/commit Q copies,
                  writing zero for padded rows, before the packed union build.
                  Clear 8192 hash words, all membership bytes and the two pool counters;
                  barriers separate initialization and consumption. Stage all toks*IndexWidth
                  indices after Hash with cp.async, commit, wait all and CTA-barrier. This wait
                  also retires Q. Each thread prefetches its next compact item before hashing
                  the current one. CAS installs encoded key+1; same-key contenders wait for
                  its position publication. Atomic mask tests create private repeat entries.
                  SWA entries grow from slot 0; compressed entries grow down from UC-1.
                  Logical compressed key k>=Us uses slot UC-(L-Us)+(k-Us). A CTA barrier
                  ends the build and frees Hash/IndexStage before any KV gather.
                  C=0 waits Q, writes the owned zero output and returns; every later action
                  of both roles is a no-op and the c repeat is empty.
                  For C>0 thread 0 initializes two stages of bar_kv/bar_qk/bar_pr/bar_pv/
                  bar_land with arrival counts 1/2/4/1/128 and an init fence. Warp 4 allocates
                  512 TMEM columns and relinquishes its allocation permit; a CTA barrier
                  precedes reading tb. Initialize RowControl, including UnusedZero which is
                  never consumed later. Wait Q, proxy-fence and CTA-barrier before the ring.
                  SOURCE DEFECT: bar_land=mbar+4*2 and tmem_base_s points to the same bytes;
                  ukey starts four bytes later. LandingBarrier[0] overlaps TmemBase and
                  physical ukey[0]; LandingBarrier[1] overlaps ukey[1:3]. Barrier initialization
                  follows the packed build and overwrites these keys. Initialization and
                  warp-4 allocation have no intervening CTA rendezvous and can overwrite
                  the same base word. Later arrivals mutate those still-live key words.
                  The source provides no separation, restoration or ordering that repairs
                  this. The views preserve the overlap; no data-ready guarantee is inferred
                  from the affected waits, and no deterministic corrupted value is invented.
                prime: |
                  For C>0 enqueue Gather(0) and commit one copy group. Enqueue means copy
                  issue only. The gather mechanism and completion accounting are defined
                  by next; it does not block this role for data landing.
                announce: |
                  Publish this chunk's Flags through a proxy fence, a 128-loader rendezvous
                  and one bar_kv arrival. Under MBA there is no copy-group wait here:
                  bar_kv publishes validity/membership bytes, not KV transfer completion.
                next: |
                  At c, if c+1<C, enqueue that next chunk; for c>=1 first execute the
                  bar_pv wait for chunk c-1, protecting the same KV slot and its Flags
                  after QK, softmax and PV have consumed them. At the tail enqueue nothing.
                  Every iteration commits a group, including an empty tail commit.
                  The pool-boundary test in gather chooses gather4 or the source's
                  individual-row copy path for the entire chunk. gather4 emits 128
                  requests of four rows by 64 BF16 columns; each loader arrives and arms
                  its own 512-byte transaction count on bar_land before its request.
                  The boundary chunk instead issues cp.async 16-byte copies and each
                  loader attaches a cp.async.mbarrier.arrive on bar_land. Both forms
                  write one 64-key chunk and Flags, including masked/padded rows.
                  The two landing barriers alternate parity floor(c/2) mod 2, like
                  the other stage barriers. Their physical corruption in prepare is
                  preserved; no completion edge from enqueue to a QK read is fabricated.
                finish: |
                  After the loader loop, join the final CTA barrier with the compute warps.
                  No extra copy wait-all is inserted. On the intended protocol every real
                  gather has been consumed before the last PV, but the recorded landing
                  alias prevents claiming that as an unconditional source guarantee.
                copyout: &copyout |
                  After the final CTA barrier, all 256 threads copy the staged real rows
                  in contiguous 16-byte units to their mapped out addresses. Nothing
                  overwrites the ring again and copy-out does not touch TMEM. Warp 4
                  deallocates the saved tb's 512 columns after its own copy work; other
                  warps may still store global output. There is no second CTA barrier,
                  next worktile or retained numerical state. Visibility is kernel_done,
                  if reached. C=0 already stored zeros and skips this action.
            pipe:
              prologue: ['prepare:Work', 'prime:FirstGather']
              steady:
                - repeat: c
                  steady: ['announce:Flags(c)', 'next:Future(c)']
              epilogue: ['finish:Work', 'copyout:out']
          Compute:
            info:
              member: 'warp[0:4]'
              execution_mode: serial
              verb:
                prepare: *prepare
                score: |
                  Wait bar_kv for this chunk's Flags. Threads 32 and 64 separately wait
                  bar_pr from c-2 when c>=2 to release both score slots, then execute the
                  affected bar_land wait. They issue Z0 and Z1 respectively and each
                  commits its own group to bar_qk. The two arrivals are required before
                  all four warps read scores. This is the literal protocol, not proof
                  that the corrupted bar_land actually certified the KV operands.
                  Each warp owns sixteen rows; lane halves read disjoint 32-key halves
                  with 16x32bx2 TMEM loads and wait-load before adding Z0/Z1. Flags select
                  the member bit for packed rows. Compute online's max, RD=1 update and
                  grouped exponent sum, exchanging the two key halves by a shuffle.
                  Both lane halves carry m/l; the lower half publishes alpha in Scale
                  and a warp rendezvous makes it available to both output halves.
                rescale: |
                  For c>0 always wait bar_pv(c-1) before touching Acc, even if alpha=1.
                  Each lane owns 256 output columns of one row, with the upper lane half
                  owning latent 256:512. If any of the warp's sixteen row scales differs
                  from 1, all lanes load/store Acc in pairs of 32-column windows, waiting
                  for each TMEM load/store and multiplying by their row's alpha. c=0
                  performs no Acc read; first PV products initialize their own halves.
                probability: |
                  Convert each lane's 32 exponentials to BF16 and write its half of the
                  stage's Prob. Proxy-fence, warp-rendezvous, then one lane per warp
                  arrives on bar_pr. This releases the score read and publishes Prob
                  and all Acc rescaling to the PV issuer. Prob(c) cannot overwrite a
                  live PV(c-2) operand: the preceding rescale wait for PV(c-1), itself
                  dependent on the earlier iteration, already retires that older PV.
                value:
                  execution_mode: async
                  meaning: >-
                    Thread 0 waits all four bar_pr arrivals and issues both output halves'
                    four 16-key PV products, then commits to bar_pv. Done means that
                    per-thread group has completed its reads and TMEM writes. QK issuers
                    are different threads, so their commits do not include these PVs.
                    The next iteration's score work need not wait for this done.
                stage: |
                  Wait the last bar_pv when C>0. The lower lane half adds the sink once,
                  publishes inv in Scale and rendezvouses within the warp. All lanes
                  issue convergent TMEM loads, including padded rows; only real rows
                  convert/store. Stage scaled BF16 results into the now-retired ring
                  using 1040 bytes per row, then join the final CTA barrier. The last
                  PV's wait is the source's ring-retirement condition, with prepare's
                  landing defect still applying. C=0 skips all TMEM work and this barrier.
                copyout: *copyout
            pipe:
              prologue: ['prepare:Work']
              steady:
                - repeat: c
                  steady: ['score:Scores(c)', 'rescale:Acc(c)', 'probability:Prob(c)', 'value:Acc(c)']
              epilogue: ['stage:OutputStage', 'copyout:out']
            waits_for:
              data:
                'score:Scores(c)': ['Loaders/announce:Flags(c)']
      packed: *packed_pipeline
      mma:
        domain:
          c: [0, 'Cm(t)']
        resource:
          KV:
            space: SMEM
            member_slot_shape: [byte: '2*KCm*D']
            dtype: uint8
            slot_count: 1
            view:
              Vm: {part: {byte: [0, '2*KCm*D']}, dtype: bf16}
              OutputStage: {part: {byte: [0, '2*HBm*D']}, dtype: bf16}
          Qm: {space: SMEM, member_slot_shape: [head: HBm, latent: D], dtype: bf16, slot_count: 1}
          Qcached: {space: register, member_slot_shape: [copy: 8, head: HBm, latent: D], dtype: bf16, slot_count: 1}
          Scores: {space: register, member_slot_shape: [head: HBm, slot: KCm], dtype: fp32, slot_count: 1}
          Pm: {space: SMEM, member_slot_shape: [head: HBm, slot: KCm], dtype: bf16, slot_count: 1}
          Om: {space: register, member_slot_shape: [head: HBm, latent: D], dtype: fp32, slot_count: 1}
          Control:
            space: SMEM
            member_slot_shape: [element: 320]
            dtype: fp32
            slot_count: 1
            view:
              mm: {part: {element: [0, 16]}}
              lm: {part: {element: [16, 32]}}
              am: {part: {element: [32, 48]}}
              sinkm: {part: {element: [48, 64]}}
              RowMax: {part: {element: [64, 192]}}
              RowSum: {part: {element: [192, 320]}}
              RequestBounds: {part: {element: [64, 192]}, dtype: int32}
              RequestLengths: {part: {element: [192, 320]}, dtype: int32}
          Validity: {space: SMEM, member_slot_shape: [slot: KCm], dtype: uint8, slot_count: 1}
          IndexPrefetch: {space: register, member_slot_shape: [element: 1280], dtype: int32, slot_count: 1}
          IndexShared: {space: SMEM, member_slot_shape: [element: 1152], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              member: 'warp[0:8]'
              execution_mode: serial
              verb:
                metadata: |
                  cfg8 uses QKS=32, one KV stage, KSPLIT=1 and EI_IDXPRE|EI_METAPAR.
                  Prefetch the entire index row into registers before the request
                  lookup (IndexWidth<=640 in this node). Cooperatively stage request
                  boundaries, lengths and topk into future RowMax/RowSum storage;
                  CTA-barrier, then all threads determine the token's A,Klen,Cm.
                  Empty Cm stores zeros and returns before Q/KV copies; prefetched
                  indices are discarded and every following action is a no-op.
                prepare: |
                  Issue and commit Qm copies with zero-padded heads. Initialize row
                  control and publish the prefetched row to IndexShared. Wait all Q
                  copies and CTA-barrier, ending the metadata-slab reads. Only then
                  enqueue Vm(0) and its Validity and commit a group, since its address
                  lookup consumes IndexShared. Cache all 32 Q slices in registers,
                  duplicated across eight key groups, while the KV copy may be in
                  flight. Zero Om. Qcached and IndexShared are retained for all chunks;
                  Qm has separate storage and is not overwritten by the KV slot.
                gather: |
                  For c>0 enqueue this chunk into the single KV slot; c=0 was already
                  issued by prepare. Resolve IDs in batches, record Validity and issue
                  16-byte row copies, including invalid/padded row-zero reads. Commit,
                  wait all copy groups and CTA-barrier before score reads. For c=0
                  only wait and barrier are needed. Previous retire protects the slot;
                  one stage provides no next-chunk transfer overlap with current PV.
                score: |
                  Eight warps each compute HBm by 16 keys, reading Qcached and Vm.
                  Finish synchronous QK, scale/mask, reduce within four lanes and
                  publish per-warp RowMax. CTA-barrier; row-owner threads fold the
                  eight maxima and publish mm/am, followed by another CTA-barrier.
                softmax: |
                  Evaluate mma's exponentials, retain unrounded sums and store BF16
                  Pm. Four-lane reductions publish RowSum. CTA-barrier publishes Pm
                  and RowSum; row-owner threads update lm, followed by CTA-barrier.
                  Scores and RowSum may then be discarded or overwritten next chunk.
                value: |
                  Rescale register Om by am, then synchronous PV consumes Pm and the
                  same Vm as QK. Each warp owns all HBm rows and 64 distinct latent
                  columns. The full accumulator remains in registers across chunks.
                retire: |
                  CTA-barrier joins all PV readers before the next writes to the
                  single KV slot, Validity, Pm and row-control scratch.
                finish: |
                  After final retire, all real copies have been waited for and used;
                  no additional wait-all is inserted. Add the sink and stage scaled
                  BF16 results into the retired KV prefix, including padded-head
                  arithmetic. CTA-barrier, then all threads copy real heads to out
                  in contiguous 16-byte units. Nothing writes the stage again. This
                  CTA owns no next token; global visibility is kernel_done, and no
                  numerical local state survives into another launch or invocation.
            pipe:
              prologue: ['metadata:Work', 'prepare:Work']
              steady:
                - repeat: c
                  steady: ['gather:Vm(c)', 'score:Scores(c)', 'softmax:Pm(c)', 'value:Om(c)', 'retire:Vm(c)']
              epilogue: ['finish:out']
realization:
  require:
    - item: ['design.tile_pipeline::prefix', 'design.tile_pipeline::packed']
      choice: >-
        Bind Q/index staging to cp.async commit/wait groups and CTA rendezvous.
        Bind KV to TMA gather4 with per-request arrive.expect_tx, or the unaligned
        pool-boundary chunk to cp.async.mbarrier.arrive. Use matching SWIZZLE_128B
        operand layouts, proxy fences and BF16-input/FP32-accumulator tcgen05 MMA
        with per-issuer commits. Keep TMEM loads/stores warp-convergent and retain
        their waits. The documented control overlap remains a source defect.
      reason: >-
        Copy issue, flag publication, data landing and matrix retirement are
        distinct events in this two-stage protocol; synchronous MMA release rules
        cannot replace them.
    - item: design.tile_pipeline::mma.Main
      choice: >-
        Bind copies to cp.async.cg.shared.global 16-byte transfers and commit/wait
        groups, publications and reuse to CTA __syncthreads, and products to ldmatrix
        plus mma.sync.aligned.m16n8k16.row.col.f32.bf16.bf16.f32.
      reason: >-
        The alternative waits each gathered chunk and releases its one KV slot
        only after all synchronous matrix readers have reached the PV barrier.
    - item: design.work_schedule::flow
      choice: |
        Model.forward preserves the supplied output object, substitutes an empty
        FP32 tensor for absent sinks and caches workspace selection by argument
        identity. An unsuitable workspace selects its cached 32 MiB allocation.
        P.ws_bytes=0 here; neither attention algorithm reads/writes numerical global
        scratch. build_params binds input pointers and narrows Python scales to FP32.
        Registered fast-call replay is off by default. CUDA graph eligibility tests
        the initial pl.dual, so even serial rejection to mma does not enable a graph.
        Every call probes current indices when its mapped resources are available.
        The probe gate allocates one static 64-float mapped pinned buffer; only its
        first eight slots carry Ratio. Host reset writes -2 through volatile pointers,
        and bounded volatile polling is followed by ordinary loads for the FP64 mean.
        probe_begin does not check probe kernel completion or launch success before
        returning true. There is no stream synchronize, generation tag or lock around
        reset/read/reuse; a pending old probe or overlapping call can race with the
        next sentinel reset. The static nonblocking side stream and timing-disabled
        fork/join events also persist across calls; no additional isolation is inferred.
        Fork record/wait failure before prefix returns to serial selection. Once
        prefix is submitted, dispatch errors are not converted into a serial retry;
        join record/wait failures raise. Stream events order GPU work, not the host's
        writes to the mapped gate.
        run_tc checks GT/range and dynamic shared-memory capacity including a 1024-byte
        static reserve, and encodes a fresh BF16 tensor map for each nonempty pool per
        packed launch. An empty compressed pool leaves a zero map. run_cfg checks its
        range and shared-memory size. Neither map nor launch failure supplies a compute
        fallback. Exhausting the shipped compilation target chain raises; a build
        without tcgen05 is excluded by the initial-plan selection before this node.
      reason: >-
        These bindings determine cross-call resource lifetime, host selection and
        caller-stream visibility. They preserve the fixed source's failure and race
        surfaces without adding external numerical or completion guarantees.
