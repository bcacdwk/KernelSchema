META_DATA:
  Name: fmha_fp8_per_token_head
  Describe: Bottom-right causal multi-head attention over paged FP8-E4M3 KV with inline per-(token, kv-head) FP32 scales; BF16 Q in, BF16 out written in place
  Source: KernelSchema@484902855fe7be82a74fe7c394503d1d7d222dbb:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_fp8_per_token_head/candidate/solution.py::Model.forward
  Version: 5
  Dispatch:
    when: 'head_dim = 128 and rows = max_seqlen_q * g >= 64, and the merged tcgen05 prefill does not claim the shape: rows = 64, or peer_ctas = (ceil_div(total_q,128) + batch_count) * head_count < 128 with neither short-KV relaxation (max_seqlen_k <= 512 and peer_ctas >= 12, or <= 1024 and >= 96). With n_split > 1 the block merge runs: not (tile_count*kv_head_count*128 >= 8*sms and ceil_div(n_split,256/dc) <= 3). Unchecked prerequisites: power-of-two page_size and g, batch_count <= 32'
CONTRACT:
  Algorithm_requirement:
    Constant:
      segm_rows_base: {value: 128, meaning: Row-budget base of segmented-softmax scratch}
      segm_count: {value: 16, meaning: Segment count of segmented-softmax scratch}
    Input:
      q: {meaning: 'BF16 query tokens, row-major, packed by request', shape: [{token: total_q}, {head: head_count}, {d: head_dim}], dtype: bf16}
      k: {meaning: FP8-E4M3 paged key payload; strided cache view, shape: [{block: block_count}, {slot: page_size}, {kv_head: kv_head_count}, {d: head_dim}], dtype: fp8_e4m3fn}
      v: {meaning: FP8-E4M3 paged value payload; strided cache view, shape: [{block: block_count}, {slot: page_size}, {kv_head: kv_head_count}, {d: head_dim}], dtype: fp8_e4m3fn}
      out: {meaning: Caller-owned BF16 buffer written in place, shape: [{token: total_q}, {head: head_count}, {d: head_dim}], dtype: bf16}
      cu_seqlens_q: {meaning: Exclusive prefix offsets of request query rows, shape: [{prefix: batch_count + 1}], dtype: int32}
      max_seqlen_q: {meaning: Host hint max_b q_len(b); ignored by reference, shape: [], dtype: python_int}
      seqused_k: {meaning: Per-request KV length kv_len(b), shape: [{batch: batch_count}], dtype: int32}
      max_seqlen_k: {meaning: Host hint max_b kv_len(b); ignored by reference, shape: [], dtype: python_int}
      softmax_scale: {meaning: Scalar multiplier of QK scores before masking, shape: [], dtype: python_float}
      causal: {meaning: ABI selector; reference fixes causal regardless, shape: [], dtype: python_bool}
      window_size: {meaning: ABI window pair; reference fixes window_left=-1, shape: [{component: 2}], dtype: python_int}
      block_table: {meaning: Logical-page to physical-block map per request, shape: [{batch: batch_count}, {page: max_pages}], dtype: int32}
      softcap: {meaning: 'ABI softcap; ignored, frozen call passes 0.0', shape: [], dtype: python_float}
      q_descale: {meaning: 'ABI option, None; reference fixes q_scale=1.0', shape: [], dtype: python_none}
      k_descale: {meaning: 'ABI option, None; k_scale_cache is used instead', shape: [], dtype: python_none}
      v_descale: {meaning: 'ABI option, None; v_scale_cache is used instead', shape: [], dtype: python_none}
      seq_threshold_3d: {meaning: Segmented-softmax hint; ignored by reference, shape: [], dtype: python_int}
      num_par_softmax_segments: {meaning: Segment-count hint; ignored by reference, shape: [], dtype: python_int}
      softmax_segm_output: {meaning: 'Segmented-softmax scratch; writable, untouched', shape: [{row: floor(segm_rows_base / kv_head_count)}, {head: head_count}, {segment: segm_count}, {d: head_dim}], dtype: fp32}
      softmax_segm_max: {meaning: 'Segment max scratch; writable, untouched', shape: [{row: floor(segm_rows_base / kv_head_count)}, {head: head_count}, {segment: segm_count}], dtype: fp32}
      softmax_segm_expsum: {meaning: 'Segment exp-sum scratch; writable, untouched', shape: [{row: floor(segm_rows_base / kv_head_count)}, {head: head_count}, {segment: segm_count}], dtype: fp32}
      alibi_slopes: {meaning: 'ABI option; frozen call passes None, ignored', shape: [], dtype: python_none}
      output_scale: {meaning: 'ABI option, None; output stays plain BF16', shape: [], dtype: python_none}
      qq_bias: {meaning: 'ABI option; frozen call passes None, ignored', shape: [], dtype: python_none}
      sinks: {meaning: 'ABI option, None; reference fixes sinks=None', shape: [], dtype: python_none}
      mm_prefix_range: {meaning: 'ABI option; frozen call passes None, ignored', shape: [], dtype: python_none}
      rswa_prefix_lens: {meaning: 'ABI option; frozen call passes None, ignored', shape: [], dtype: python_none}
      rswa_window: {meaning: 'ABI option; frozen call passes None, ignored', shape: [], dtype: python_none}
      use_alibi_sqrt: {meaning: 'ABI flag; frozen call passes False, ignored', shape: [], dtype: python_bool}
      kv_quant_mode: {meaning: ABI mode; frozen 3 = per-token/head FP8 KV, shape: [], dtype: python_int}
      k_scale_cache: {meaning: Inline FP32 key descale per block/slot/kv-head, shape: [{block: block_count}, {slot: page_size}, {kv_head: kv_head_count}], dtype: fp32}
      v_scale_cache: {meaning: Inline FP32 value descale per block/slot/kv-head, shape: [{block: block_count}, {slot: page_size}, {kv_head: kv_head_count}], dtype: fp32}
      chunk_lookback: {meaning: 'ABI option; frozen call passes -1, ignored', shape: [], dtype: python_int}
      use_td: {meaning: 'ABI flag; frozen call passes False, ignored', shape: [], dtype: python_bool}
      mm_prefix_clamp_sliding_window: {meaning: 'ABI flag; frozen call passes False, ignored', shape: [], dtype: python_bool}
    Output: {attention_out: {meaning: BF16 result written in place into the input out, shape: [{token: total_q}, {head: head_count}, {d: head_dim}], dtype: bf16}}
    Compute:
      - Name: Request geometry and head mapping
        Math: |
          For request b (0 <= b < batch_count): q_start(b) = cu_seqlens_q[b],
          q_len(b) = cu_seqlens_q[b+1] - cu_seqlens_q[b], kv_len(b) = seqused_k[b], and
          cu_seqlens_q[batch_count] = total_q; later steps write b, q_len, kv_len for the current request.
          Domain (shape_range.json): 1 <= batch_count <= 32; 1 <= q_len(b) <= 8192; 1 <= kv_len(b) <= 262144;
          q_len(b) <= kv_len(b); total_q <= 16384; sum_b kv_len(b) <= 1048576; head_dim in {64, 128, 256};
          page_size in {16, 32, 64, 128}; head_count % kv_head_count == 0; (head_count, kv_head_count, head_dim)
          in {(4,1,128), (8,1,256), (8,2,64), (12,12,64), (32,8,128), (32,32,128)}.
          g = head_count / kv_head_count; query head h uses kv_head floor(h / g). Query row q_start(b) + i
          (0 <= i < q_len) is bottom-right aligned: visible(i) = kv_len - q_len + i >= 0, so the visible set is
          never empty. Frozen hints: max_seqlen_q = max_b q_len(b); max_seqlen_k = max_b kv_len(b).
      - Name: Paged KV gather
        Math: |
          max_pages = max_b ceil(kv_len(b) / page_size) is the width of block_table. For the current request
          and key position j (0 <= j < kv_len):
            pg = block_table[b, floor(j / page_size)], slot = j - page_size * floor(j / page_size)
            kvec(j)[hk, e] = k[pg, slot, hk, e]; kscale(j)[hk] = k_scale_cache[pg, slot, hk]
            vvec(j)[hk, e] = v[pg, slot, hk, e]; vscale(j)[hk] = v_scale_cache[pg, slot, hk]
          Referenced entries satisfy 0 <= pg < block_count; columns of row b beyond ceil(kv_len / page_size)
          are padding (-1 in the frozen call) and are never referenced. FP8 payloads participate at their
          exact values; scales are FP32. HND and NHD physical page layouts differ only in the strides of
          k, v and the two scale views, not in this logical indexing.
        Symbol:
          kvec: {meaning: FP8-E4M3 key payload gathered at key position j, shape: [{kv_head: kv_head_count}, {d: head_dim}], dtype: fp8_e4m3fn}
          kscale: {meaning: FP32 key descale at key position j, shape: [{kv_head: kv_head_count}], dtype: fp32}
          vvec: {meaning: FP8-E4M3 value payload gathered at key position j, shape: [{kv_head: kv_head_count}, {d: head_dim}], dtype: fp8_e4m3fn}
          vscale: {meaning: FP32 value descale at key position j, shape: [{kv_head: kv_head_count}], dtype: fp32}
      - Name: QK scores
        Math: |
          For the current request, query i (0 <= i < q_len), head h (0 <= h < head_count) and key j
          (0 <= j < kv_len), with h_kv = floor(h / g):
            s[i, h, j] = (sum_{e=0}^{head_dim-1} q[q_start(b) + i, h, e] * kvec(j)[h_kv, e]) * softmax_scale * kscale(j)[h_kv]
          The dot product and both scale multiplications are FP32 with TF32 disabled; the per-key FP32 scale
          is applied after the QK dot product, and no rounding occurs before masking. The frozen call passes
          softmax_scale = head_dim^(-1/2).
        Symbol: {s: {meaning: Unmasked FP32 scores of the current request, shape: [{query: q_len}, {head: head_count}, {key: kv_len}], dtype: fp32}}
      - Name: Bottom-right causal masking
        Math: |
          allowed(i, j) = (j <= visible(i)); sm[i, h, j] = s[i, h, j] if allowed(i, j), otherwise -inf.
          -inf is a mask value only: visible(i) >= 0, so every query row keeps at least the finite score of
          key 0 and no row is entirely masked.
        Symbol: {sm: {meaning: Causally masked FP32 scores of the request, shape: 'ref:s.shape', dtype: fp32}}
      - Name: Softmax with BF16-rounded weighted values
        Math: |
          For each query row i and head h of the current request, over 0 <= j < kv_len, h_kv = floor(h / g):
            m[i, h] = max_j sm[i, h, j]
            p[i, h, j] = exp(sm[i, h, j] - m[i, h]); masked entries give p = 0
            l[i, h] = sum_{j=0}^{kv_len-1} p[i, h, j]; the denominator accumulates the unrounded p, and the
              maximum entry contributes exp(0) = 1, so l >= 1 and the division below is defined
            pw[i, h, j] = bf16(p[i, h, j] * vscale(j)[h_kv]); the product is rounded to BF16 (RNE) before PV
            acc[i, h, e] = sum_{j=0}^{kv_len-1} pw[i, h, j] * vvec(j)[h_kv, e], accumulated in FP32
            o[i, h, e] = acc[i, h, e] / l[i, h], in FP32
          exp is the natural exponential; all sums and the final division are FP32 with TF32 disabled.
        Symbol:
          p: {meaning: Unrounded FP32 softmax weights of one request, shape: 'ref:sm.shape', dtype: fp32}
          pw: {meaning: p times value scale rounded to BF16 before PV, shape: 'ref:sm.shape', dtype: bf16}
          l: {meaning: Softmax denominator from unrounded p, shape: [{query: q_len}, {head: head_count}], dtype: fp32}
          o: {meaning: Normalized FP32 output before BF16 rounding, shape: [{query: q_len}, {head: head_count}, {d: head_dim}], dtype: fp32}
      - Name: In-place output and side effects
        Math: |
          The output attention_out is delivered only by an in-place write into the input tensor out:
            out[q_start(b) + i, h, e] = bf16(o[i, h, e]) for every request b, 0 <= i < q_len(b),
            0 <= h < head_count, 0 <= e < head_dim; every element of out is written exactly once.
          forward returns Python None; the write preserves the identity of out and all caller storage
          outside the written region. All other inputs are read-only, and the softmax_segm_* buffers
          declared as permitted scratch are neither read nor written by the frozen reference or the
          pinned candidate.
    Golden_reference:
      Source: KernelSchema@484902855fe7be82a74fe7c394503d1d7d222dbb:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_fp8_per_token_head/problem/reference.py::Model.forward
      Tolerance:
        attention_out: Source-only; atol=0.01, rtol=0.05, max_mismatch_fraction=0.001, max_rel_l2=0.01; no formula/defaults
      Gap: Reference fixes causal=True, window=-1, sinks=None, q_scale=1; 32x32 online order differs
  Hardware_specification:
    Device:
    Architecture:
    Execution:
      thread: Single execution lane of a warp; owns the private per-thread register file (register)
      warp: 32 lockstep threads within a CTA; scope of shuffle, warp reduction and warp-wide tensor-core issue
      cta: Thread block of a fixed warp count resident on one SM; owns dynamic smem and tcgen05 tmem columns
    Feature:
      mechanism: null
    Stack:
      Language:
      Toolchain:
    Wiki:
      Hardware:
      Programming:
        Language:
      Microbench:
      Sota:
        Kernel:
        Schema:
      Profile:
DESIGN:
  Math_reshape:
    Thesis: 'The Contract computation is kept, but evaluated in the log2 domain on narrowed tensor-core operands and cut into KV chunks, so a long key range reduces in parallel: online rescaling inside a chunk and a log-sum-exp merge across chunks'
    Rewrite:
      - Name: Packed tile rows and causal bounds
        Math: |
          A worktile holds 128 packed rows of one request b and one kv head hy. Row r (0 <= r < 128) is query
          index tok(r) = tok0 + floor(r / g) of request b and query head hy * g + (r mod g), with
          tok0 = m_blk * (128 / g) and g = head_count / kv_head_count, so the row's query vector is
          q_row(r) = q[q_start(b) + tok(r), hy * g + (r mod g)] of the Contract's q. Valid rows are
          r < n_rows = min(128, (q_len(b) - tok0) * g); rows r >= n_rows gather the duplicate query index
          q_len(b) - 1 and are never written. A valid row's inclusive key bound is the Contract's visible(tok(r)),
          so the tile's exclusive key bound is
          hi = visible(tok0 + n_rows / g - 1) + 1 = kv_len(b) - q_len(b) + tok0 + n_rows / g >= 1.
        Symbol:
          tok: {meaning: Query index of a packed tile row}
          tok0: {meaning: First query index of this tile}
          n_rows: {meaning: Valid packed rows of this tile}
          hi: {meaning: Exclusive key bound of this tile}
      - Name: Operand narrowing and score scaling
        Math: |
          qk_scale = softmax_scale * log2(e) is folded once on the host in FP32, and each gathered key scale
          becomes kst(j) = kscale(j) * qk_scale in FP32. The QK product narrows its operands: the gathered
          E4M3 key payload converts to FP16, exact for every finite E4M3 value, and the BF16 query rows widen
          to FP16 once per tile, so score(r, j) = mma32(f16(q_row(r)), f16(kvec(j))) * kst(j) with an FP32
          accumulator over the head_dim-deep k steps, for 0 <= j < hi. Keys with j > visible(tok(r)) take
          score = -inf, and the value payload keeps its exact BF16 form bf16(vvec(j)) as the B operand of PV.
          That widening is exact only inside the FP16 normal range: below 2^-14 it rounds into FP16 subnormals,
          above 65504 it overflows to +-inf and score stops being finite. Frozen |q| is of order one (peaked x4):
          the overflow side is unreached but the subnormal side is, which Cost records. The Contract leaves q
          unbounded, so the overflow deviation is a source limitation, not a proven equivalence.
        Symbol:
          qk_scale: {meaning: Host-folded log2-domain score scale, value: softmax_scale * 1.44269504088896340736}
          score: {meaning: Log2-domain scores of one KV block, shape: [{row: 128}, {key: 32}], dtype: fp32}
        Arithmetic:
          Accumulate: FP32 accumulation over head_dim/16 ascending matrix-multiply steps of depth 16; each product of the narrowed operands is exact in FP32
        Ledger:
          Baseline: BF16 key image and BF16 QK operands, with softmax_scale and the key scale applied as two separate FP32 products
          Gain: Key payload conversion drops from four arithmetic steps per pair to one and stays exact for every finite E4M3 value
          Cost: Widening Q to FP16 rounds below 2^-14 into subnormals and overflows above 65504 to +-inf; kst adds one FP32 rounding
      - Name: KV chunk split
        Math: |
          The tile's keys [0, hi) are cut into n_split contiguous chunks. chunk_bn = ceil_div(ceil_div(hi,
          n_split), 32) * 32 and chunk s covers [s * chunk_bn, min((s + 1) * chunk_bn, hi)), so it is non-empty
          exactly when s < nse = min(n_split, ceil_div(hi, chunk_bn)). A non-empty chunk holds
          ntot = ceil_div(min((s + 1) * chunk_bn, hi) - s * chunk_bn, 32) blocks of 32 keys; an empty chunk runs
          no block and publishes nothing.
        Symbol:
          chunk_bn: {meaning: 'Key length of one chunk, block aligned'}
          nse: {meaning: Chunks of this tile that hold keys}
          ntot: {meaning: KV blocks in this chunk}
      - Name: Block-online softmax in the log2 domain
        Math: |
          A chunk walks its keys in 32-key blocks n, ascending. Per row, with m_run(-1) = -inf, l_run(-1) = 0,
          o_run(-1) = 0 and mx = max_j score(r, j) over block n (a fully masked block gives mx = -inf):
            nm = max(m_run, mx); sf = nm if nm is finite else 0; alpha = 2^(m_run - sf); p(r,j) = 2^(score(r,j) - sf)
            l_run' = l_run * alpha + sum32_j p(r,j); m_run' = nm; pw_run(r,j) = bf16(p(r,j) * vscale(j))
            o_run'(r, e) = o_run(r, e) * alpha + mma32(pw_run, bf16(vvec))(r, e)
          2^x maps -inf to 0, so an all-masked block leaves the state unchanged, and sf rules out (-inf)-(-inf):
          when no key of this chunk is visible to the row, nm = -inf gives alpha = 0 and p = 0, so the state stays
          (-inf, 0, 0) for the rest of the chunk, which the merge discards. Chunk 0 never reaches that case for a
          valid row, whose block 0 holds the always-visible key 0; in a chunk s >= 1 every row whose visible bound
          is below s * chunk_bn does. pw_run is the Contract's pw at the chunk-relative, not global, maximum.
        Symbol:
          m_run: {meaning: Running row maximum in the log2 domain, shape: [{row: 128}], dtype: fp32, retention: 'carry_forward (tile, kv_head, split); n=-1..ntot-1'}
          l_run: {meaning: Running row denominator from unrounded weights, shape: [{row: 128}], dtype: fp32, retention: 'carry_forward (tile, kv_head, split); n=-1..ntot-1'}
          o_run: {meaning: Unnormalized running output rows, shape: [{row: 128}, {d: head_dim}], dtype: fp32, retention: 'carry_forward (tile, kv_head, split); n=-1..ntot-1'}
        Arithmetic:
          Approx: Every 2^x is one MUFU exponential with about 2^-22 relative error that maps -inf to exactly 0
          Accumulate: l_run sums the unrounded weights in FP32, block after block in ascending key order
        Ledger:
          Baseline: One pass over the row's keys against the global maximum, as the Contract defines
          Cost: Each block multiplies o_run and l_run by alpha, adding head_dim FP32 multiplies per row whenever alpha differs from 1
      - Name: Chunk merge and output
        Math: |
          A non-empty chunk publishes part_m = m_run, part_l = l_run and part_o = o_run at its last block, for
          its valid rows. The merge over the non-empty chunks is, per row r and dim e: m_all = max_s part_m(s);
          w(s) = 2^(part_m(s) - m_all), so a chunk left at -inf weighs 0; l_all = sum32_s w(s) * part_l(s);
          inv = 1 / l_all, or 0 when l_all <= 0; and attention_out(r, e) = bf16(inv * sum32_s w(s) * part_o(s, r, e)).
          With n_split = 1 the chunk is the whole range, nothing is materialized, and attention_out(r, e) =
          bf16(o_run(r, e) * inv) with inv = 1 / l_run(r, e), or 0 when l_run <= 0.
        Symbol:
          part_m: {meaning: Chunk row maximum in the log2 domain, shape: [{row: 128}], dtype: fp32, retention: 'keep_value (tile, kv_head, split)'}
          part_l: {meaning: Chunk row denominator, shape: [{row: 128}], dtype: fp32, retention: 'keep_value (tile, kv_head, split)'}
          part_o: {meaning: Unnormalized chunk output rows, shape: [{row: 128}, {d: head_dim}], dtype: fp32, retention: 'keep_value (tile, kv_head, split)'}
        Arithmetic:
          Approx: The merge weight reuses the exponential declared in Block-online softmax in the log2 domain
          Accumulate: Both sums are FP32 over the nse chunks, regrouped by the merge work decomposition instead of one ascending chain
        Ledger:
          Baseline: One softmax pass over the tile's whole key range, with no materialized intermediate
          Cost: Weights narrow to BF16 at the chunk-relative scale, so a PV term can differ by one BF16 ulp from the globally scaled value
  Work_schedule:
    Thesis: BM = 128 rows, BN = 32 keys; one CTA per (tile, kv head, chunk), heaviest tile first. tile_count = ceil_div(max_seqlen_q*g,128)*batch_count; unit = tile_count*kv_head_count; cap = min(1024,max(1,floor(2*sms/unit))) or 1024 if floor(2*sms/unit) < 8; ws_cap = floor(96*2^20/(unit*130*128))
    Step:
      MAIN:
        Describe: One CTA scores 128 packed query rows of one request against its KV chunk and writes the output rows or a partial record
        Decomposition:
          Strategy: nt(b)=ceil_div(q_len(b)*g,128); p(b)=sum_{a<b}nt(a); p(b)<=tile<p(b+1) fixes b; m_blk=nt(b)-1-(tile-p(b))
          Partition:
            tile: {meaning: 'One (request, m-block) tile of the launch bound', size: tile_count, tile: 1}
            kv_head: {meaning: 'One kv head, shared by g query heads', size: kv_head_count, tile: 1}
            split: {meaning: One KV chunk of the tile's visible keys, size: '1 if base>=sms else max(1,min(ceil_div(6*sms,base),ceil_div(max_seqlen_k,chunk),cap,ws_cap))', tile: 1, range: [1, 1024]}
          Worktile:
            Invariant: {q_tile: {meaning: Packed query rows gathered for this tile, shape: [{row: 128}, {d: head_dim}], dtype: bf16}}
            Iteration:
              k_block: {meaning: Gathered FP8 key payload of one block, shape: [{key: 32}, {d: head_dim}], dtype: fp8_e4m3fn, direction: ascending}
              v_block: {meaning: Gathered FP8 value payload of the same block, shape: [{key: 32}, {d: head_dim}], dtype: fp8_e4m3fn, direction: ascending}
              ks_block: {meaning: FP32 key descale of the block's keys, shape: [{key: 32}], dtype: fp32, direction: ascending}
              vs_block: {meaning: FP32 value descale of the block's keys, shape: [{key: 32}], dtype: fp32, direction: ascending}
          Target:
            Single_tile:
              attention_out: {meaning: 'Final rows, written in place when n_split is 1', shape: [{row: 128}, {d: head_dim}], dtype: bf16}
              part_o: {meaning: 'Unnormalized chunk output, when n_split > 1', shape: [{row: 128}, {d: head_dim}], dtype: fp32}
              part_m: {meaning: Chunk row maximum in the log2 domain, shape: [{row: 128}], dtype: fp32}
              part_l: {meaning: Chunk row denominator, shape: [{row: 128}], dtype: fp32}
        Mapping:
          Strategy: sms = the device multiprocessor count; the 4 warps load 8 keys each per block, and each warp scores its own 32 rows against all 32 keys
          Worker: {unit: cta, unit_count: 1}
          Worker_count: tile_count * kv_head_count * n_split
        Schedule:
          Strategy: n_split = the split partition size; base=ceil_div(total_q*g,128)*kv_head_count; chunk=256 halved to 64 while max_seqlen_k>=1024 and base*n_split<sms
          Worktile_order:
            - {by: split, direction: ascending}
            - {by: kv_head, direction: ascending}
            - {by: tile, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: [assigned_done]
      COMBINE:
        Describe: Merge the chunk partials of one tile and kv head into the final BF16 output rows, one row group and dim chunk per CTA
        Decomposition:
          Strategy: dc = 64 halved toward 8 while the merge grid is under 2*sms; rpt = clamp(floor(tile_count*kv_head_count*128*ceil_div(128,dc)/(8*sms)), 1, 128)
          Partition:
            tile: {meaning: 'Same (request, m-block) tile as the MAIN step', size: tile_count, tile: 1}
            kv_head: {meaning: 'One kv head, shared by g query heads', size: kv_head_count, tile: 1}
            row_group: {meaning: Block of packed rows of the tile, size: 128, tile: rpt}
            dim: {meaning: Block of output dimensions, size: head_dim, tile: dc}
          Worktile:
            Iteration:
              part_o: {meaning: Chunk output partials of these rows and dims, shape: [{split: nse}, {row: rpt}, {d: dc}], dtype: fp32, direction: ascending}
              part_m: {meaning: Chunk maxima of these rows, shape: [{split: nse}, {row: rpt}], dtype: fp32, direction: ascending}
              part_l: {meaning: Chunk denominators of these rows, shape: [{split: nse}, {row: rpt}], dtype: fp32, direction: ascending}
          Target:
            Single_tile: {attention_out: {meaning: Merged output rows of this dim chunk, shape: [{row: rpt}, {d: dc}], dtype: bf16}}
            Tile_reduction: {dimension: split, input: ['ref:DESIGN.Math_reshape::part_o', 'ref:DESIGN.Math_reshape::part_m', 'ref:DESIGN.Math_reshape::part_l'], output: 'ref:CONTRACT.Algorithm_requirement::attention_out', method: 'ref:DESIGN.Math_reshape::Chunk merge and output'}
        Mapping:
          Strategy: '256 threads: SG = 256/dc of them share one output dim and split the chunk range between them, and a block tree merges their partials'
          Worker: {unit: cta, unit_count: 1}
          Worker_count: tile_count * kv_head_count * ceil_div(128, rpt) * ceil_div(head_dim, dc)
        Schedule:
          Strategy: Submitted only when n_split > 1; a tile beyond the request table, or a row group starting beyond n_rows, exits before the wait and writes nothing
          Worktile_order:
            - {by: row_group, direction: ascending}
            - {by: dim, direction: ascending}
            - {by: kv_head, direction: ascending}
            - {by: tile, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: [assigned_done]
    Flow:
      Launch:
        - {step: [MAIN]}
        - {step: [COMBINE], start_after: MAIN.launch_ready}
      Handoff:
        part_o: &partials {producer: MAIN, consumer: [COMBINE], storage: global, ready: MAIN.kernel_done, wait_at: COMBINE.partials_wait}
        part_m: *partials
        part_l: *partials
  Tile_pipeline:
    Thesis: 'Each CTA runs one software pipeline: page metadata two blocks ahead in registers, the FP8 payload one block ahead in registers, and one shared K/V image converted just before use, so computing block n hides both latencies behind CTA-wide publish and release of that single image'
    Step:
      MAIN:
        Index: {n: {meaning: KV block ordinal inside this worktile's chunk, definition: [0, ntot]}}
        Storage:
          row_meta: {meaning: 'Staged cu_seqlens, row offsets and bounds', depth: 1, location: smem, shape: [{word: 417}],
            dtype: int32, total_size: 1668}
          key_meta: {meaning: 'Per-key byte offsets and scales, two slots', depth: 2, location: smem, shape: [{key: 32}, {word: 6}],
            dtype: int32, total_size: 1536, view: {key_table(n): {slot_index: n % 2}}}
          q_image: {meaning: Query rows widened to FP16 at a padded 136 pitch, depth: 1, location: smem, shape: [{row: 128}, {d: 136}],
            dtype: fp16, total_size: 34816}
          k_image: {meaning: One block's K payload as FP16 at a 136 pitch, depth: 1, location: smem, shape: [{key: 32}, {d: 136}],
            dtype: fp16, total_size: 8704}
          v_image: {meaning: One block's V payload as BF16 at a 136 pitch, depth: 1, location: smem, shape: [{key: 32}, {d: 136}],
            dtype: bf16, total_size: 8704}
          page_regs: {meaning: Four warp copies of page metadata and scales, depth: 1, location: register, shape: [{warp_copy: 4}, {key: 32}, {word: 4}],
            dtype: int32, total_size: 2048}
          kv_raw: {meaning: 'Raw FP8 K and V of one block, prefetched', depth: 1, location: register, shape: [{key: 32}, {d: 128}, {payload: 2}],
            dtype: fp8_e4m3fn, total_size: 8192}
          score: {meaning: Scores of the block being processed, depth: 1, location: register, shape: [{row: 128}, {key: 32}],
            dtype: fp32, total_size: 16384, view: {score(n): {}}}
          o_run: {meaning: Unnormalized output accumulator of the tile, depth: 1, location: register, shape: [{row: 128}, {d: 128}],
            dtype: fp32, total_size: 65536}
          m_run: {meaning: Row maxima; four independent lane copies, depth: 1, location: register, shape: [{row: 128}, {lane_copy: 4}],
            dtype: fp32, total_size: 2048}
          l_run: {meaning: Row denominators; four independent lane copies, depth: 1, location: register, shape: [{row: 128}, {lane_copy: 4}],
            dtype: fp32, total_size: 2048}
        Role:
          MAIN:
            Info:
              Describe: All four warps stage each KV block and score their own 32 rows, cooperating through the single shared K and V image
              Member: warp[0:4]
              Using_verb:
                compute:
                  tile_coord: {execution_mode: serial, describe: 'Map the tile index to the request b and m-block from the staged cu_seqlens, redundantly per warp so the pair is CTA-uniform; b < 0 means no work'}
                  row_map: {execution_mode: serial, describe: 'Publish each packed row''s query offset and inclusive causal bound into row_meta, which each warp then copies for its own 32 rows'}
                  q_image: {execution_mode: serial, describe: 'Retire this thread''s query copies, widen the BF16 rows it copied to FP16 in place, then publish q_image CTA-wide'}
                  key_table: {execution_mode: serial, describe: 'Publish block n''s K and V byte offsets and the folded scale kst into key_meta slot n%2, warp-local then CTA-visible'}
                  score_mask: {execution_mode: serial, describe: Scale score(n) by kst and set keys above each row's bound to -inf; a warp skips the select when its block is below its minimum bound}
                  row_softmax: {execution_mode: serial, describe: 'Update m_run and l_run, turn score(n) into the unrounded weights, and rescale o_run by alpha unless every lane votes alpha == 1'}
                matmul:
                  q_image@k_image: {execution_mode: serial, describe: 'QK of block n: read both m-tiles of q_image and the 32 keys of k_image as fragments and multiply into score(n), FP32 accumulate'}
                  pw@v_image: {execution_mode: serial, describe: 'PV of block n: A is score(n) as weights times vscale rounded to BF16, B is the transposed v_image, FP32 accumulate into o_run'}
                load:
                  q_tile: {execution_mode: async_unordered, describe: Issue asynchronous 16-byte copies of the 128 packed query rows into q_image; rows beyond n_rows duplicate the last token}
                  page_meta: {execution_mode: async_unordered, describe: 'Read block n''s page indices and both FP32 scales into this warp''s private page_regs, two blocks ahead of use; keys at or beyond hi clamp to hi-1'}
                  kv_payload: {execution_mode: async_unordered, describe: 'Issue this warp''s 8 keys of block n as 4-byte FP8 K and V global loads into kv_raw, addressed from key_meta slot n%2'}
                store:
                  kv_image: {execution_mode: serial, describe: Convert kv_raw(n) into the FP16 K and BF16 V images and write k_image and v_image; done covers CTA-wide visibility}
                  attention_out: {execution_mode: serial, describe: Write bf16(o_run * (1 / l_run)) for the n_rows valid rows into the caller's out tensor}
                  split_partial: {execution_mode: serial, describe: 'Write this chunk''s unnormalized o_run rows, plus one (m_run, l_run) pair per row, into its workspace record'}
                signal: {dependents: {execution_mode: serial, describe: One elected lane per CTA grants the dependent grid leave to launch; CTAs that exited earlier satisfy it by completing}}
            Pipe:
              - compute:tile_coord
              - if (b >= 0):
                  - signal:dependents
                  - if (ntot > 0):
                      - compute:row_map
                      - load:q_tile
                      - load:page_meta(0)
                      - compute:q_image
                      - compute:key_table(0)
                      - load:kv_payload(0)
                      - if (ntot > 1):
                          - load:page_meta(1)
                      - store:kv_image(0)
                      - for(n):
                          - if (n + 1 < ntot):
                              - compute:key_table(n+1)
                              - load:kv_payload(n+1)
                          - if (n + 2 < ntot):
                              - load:page_meta(n+2)
                          - matmul:q_image@k_image(n)
                          - compute:score_mask(n)
                          - compute:row_softmax(n)
                          - matmul:pw@v_image(n)
                          - if (n + 1 < ntot):
                              - store:kv_image(n+1)
                      - if (n_split == 1):
                          - store:attention_out
                      - if (n_split > 1):
                          - store:split_partial
            Waiting:
              Prepared:
                - '{issue compute:q_image} ← [{done load:q_tile}]'
                - '{issue compute:key_table(n)} ← [{done load:page_meta(n)}]'
                - '{issue store:kv_image(n)} ← [{done load:kv_payload(n)}]'
                - '{issue matmul:q_image@k_image(n)} ← [{done store:kv_image(n)}]'
                - '{issue matmul:pw@v_image(n)} ← [{done store:kv_image(n)}, {done compute:row_softmax(n)}]'
              Released:
                - '{issue store:kv_image(n+1)} ← [{done matmul:q_image@k_image(n)}, {done matmul:pw@v_image(n)}]'
                - '{issue compute:key_table(n+2)} ← [{done matmul:pw@v_image(n)}]'
      COMBINE:
        Event:
          partials_wait: ['{done MAIN[0]::await:partials}']
        Storage:
          tile_meta: {meaning: Staged cu_seqlens and the resolved tile coordinate, depth: 1, location: smem, shape: [{word: 35}],
            dtype: int32, total_size: 140}
          split_stat: {meaning: 'Chunk maxima, denominators and merge weights', depth: 1, location: smem, shape: [{split: 1024}, {field: 3}],
            dtype: fp32, total_size: 12288}
          thread_partial: {meaning: Per-thread numerator partial of one row, depth: 1, location: smem, shape: [{thread: 256}],
            dtype: fp32, total_size: 1024}
          warp_partial: {meaning: Warp partials of the row maximum and denominator, depth: 1, location: smem, shape: [{warp: 8}],
            dtype: fp32, total_size: 32}
        Role:
          MAIN:
            Info:
              Describe: 256 threads merge the chunk partials of rpt rows and dc dims, one row at a time, with block-wide maximum, denominator and numerator reductions
              Member: warp[0:8]
              Using_verb:
                load:
                  tile_meta: {execution_mode: serial, describe: Stage cu_seqlens into tile_meta}
                  split_stat: {execution_mode: serial, describe: Read the nse chunk maxima and denominators of row r from its workspace records into split_stat}
                compute:
                  tile_coord: {execution_mode: serial, describe: 'Resolve the tile index to the request b and m-block from the staged cu_seqlens, then to this CTA''s row bounds r_lo, r_hi and dim chunk'}
                  row_stat: {execution_mode: serial, describe: 'Block-reduce the row maximum m_all, publish w(s) = 2^(part_m(s) - m_all) into split_stat, then block-reduce l_all and inv'}
                  row_dot: {execution_mode: serial, describe: Each of the SG threads of one dim accumulates its strided chunks of row r into thread_partial}
                store: {attention_out: {execution_mode: serial, describe: The SG threads of one dim merge their partials and write bf16(value * inv) into out for row r}}
                await: {partials: {execution_mode: serial, describe: 'Wait until the primary grid''s partial records are device-visible, as granted by the dependent-launch protocol'}}
            Pipe:
              - load:tile_meta
              - compute:tile_coord
              - if (b >= 0):
                  - if (r_lo < n_rows):
                      - await:partials
                      - for(r=r_lo:r_hi):
                          - load:split_stat(r)
                          - compute:row_stat(r)
                          - compute:row_dot(r)
                          - store:attention_out(r)
REALIZATION:
  Require:
    - Item: DESIGN.Tile_pipeline::MAIN.MAIN
      Choice: Warp-level 16x8x16 matrix multiply with FP16 operands for QK and BF16 operands for PV, fed by fragment loads from the shared images
      Reason: The Design keeps the whole output accumulator and one block of scores in registers and reuses one key fragment across both m-tiles; a shared-accumulator engine would change the roles, the storage account and the release edges
    - Item:
        - DESIGN.Tile_pipeline::MAIN.Storage.k_image
        - DESIGN.Tile_pipeline::MAIN.Storage.v_image
      Choice: A CTA-wide barrier after the block's last fragment read and after the converting stores that refill the single slot
      Reason: Four warps write 8 keys each and read all 32, so the Prepared and Released edges on kv_image span warps; nothing else in this kernel orders them
    - Item: DESIGN.Work_schedule::MAIN.Mapping
      Choice: Launch 128 threads per CTA with 55440 bytes of dynamic shared memory, raised by a one-time function attribute and checked against the 232448-byte budget
      Reason: The role member count and storage account do not give the launch size; the metadata block rounds up to a 16-byte multiple, and the register regions are 179 of the 253 registers per thread that leave 2 resident CTAs per SM
    - Item:
        - DESIGN.Tile_pipeline::MAIN.MAIN
        - DESIGN.Tile_pipeline::COMBINE.MAIN
      Choice: griddepcontrol.launch_dependents from one elected lane of every MAIN CTA that reaches it, and griddepcontrol.wait in COMBINE before its first workspace read
      Reason: Supplies the launch permission and the visibility the Handoff declares; without the wait the merge could read partial records that are not yet device-visible
    - Item: DESIGN.Work_schedule::MAIN.Decomposition.Partition.split
      Choice: Reject n_split above 1024 before the merge launch
      Reason: split_stat holds 1024 chunk entries and nse is not clamped, so a larger count would index past the shared arrays and silently return wrong values
    - Item: DESIGN.Work_schedule.Flow.Launch
      Choice: Record the two submissions once per input binding into a CUDA graph on a private non-blocking stream, after the direct launch of the same work, and replay it on the current stream
      Reason: A replay re-runs the same kernels over the current buffer contents, so the work, the events and the workspace pointer baked into the graph are unchanged; the binding cache keeps that pointer alive
    - Item: DESIGN.Math_reshape::Block-online softmax in the log2 domain
      Choice: ex2.approx.f32 for every power of two in the softmax and the merge, with no flush-to-zero or fast-math change to the surrounding FP32 arithmetic
      Reason: The declared 2^-22 bound and the exact -inf to 0 mapping are what the masked recurrence and the merge weights of an empty chunk rely on
  Forbid:
    - Item: DESIGN.Work_schedule::MAIN.Mapping
      Choice: A minimum-blocks-per-multiprocessor argument on this kernel's launch bounds
      Reason: The compiler reads it as permission to spend more registers; the source records 166 to 190 registers at 128 threads, two resident CTAs per SM instead of three, and a spill on this tile
    - Item: DESIGN.Tile_pipeline::MAIN.Storage.q_image
      Choice: Hoisting the Q fragments into registers instead of reloading them from q_image for every KV block
      Reason: The rows are loop invariant, but the source records hoisting them as neutral at head_dim 64 and worse at 128 and 256, because the registers come out of occupancy
