meta_data:
  name: mxfp8_qkv_attention
  describe: Dense grouped-query attention on block-scaled FP8 Q/K/V with FP8 probability rounding, BF16 output, and optional FP32 natural-log LSE.
  source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/solution.py::Model.forward
  version: 4
  dispatch:
    when: |
      Let HeadGroup=H/KH, QueriesPerTile=128/HeadGroup and
      CtaCount=B*KH*ceil_div(Sq,QueriesPerTile).
      Let active mean window_left is neither None nor -1, and let wl be
      window_left when active, otherwise 0.
      Let HostPlan be the actual Plan returned by
      fmha_mxfp8::plan_geometry(B,H,KH,Sq,Skv,D,is_causal,wl,active), from
      source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/candidate/fmha_mxfp8_qkv.cu::fmha_mxfp8::plan_geometry.
      HostPlan includes the fixed source's split-cost and workspace policy and its
      cached runtime probe/capacity results; do not replace them with assumed
      device capabilities. Let SmCount be that source's device_sm_count() result.
      Let split mean HostPlan.use_tc and HostPlan.nsplit>1 and W>0 and
      W>=HostPlan.workspace,
      matching the actual forward workspace guard.
      Select exactly when HostPlan.use_tcg and not split and D=128 and
      CtaCount>SmCount.
      With the fixed build defaults this selects
      launch_tcg<128,PASS_FUSED,1,true>: the single-warpgroup QK64 fused path.
      Descriptor success selects TMA staging; descriptor failure retains the
      source's cp.async staging variant within this same path.
contract:
  algorithm_requirement:
    constant:
      Block: {value: 32, meaning: Elements sharing one MXFP8 scale}
      ScaleRows: {value: 128, meaning: Rows in one scale-layout atom}
      ScaleCols: {value: 4, meaning: Columns in one scale-layout atom}
      KeyGroup: {value: 128, meaning: Consecutive keys in one reference probability-rounding group}
      ExponentBias: {value: 127, meaning: Bias of the stored E8M0 exponent}
      ProbabilityMax: {value: 448, meaning: Saturation limit before the probability E4M3FN cast}
    input:
      q_tensor: {meaning: Stored query payload, shape: [batch: B, head: H, query: Sq, channel: D], dtype: fp8_e4m3fn}
      k_tensor: {meaning: Stored key payload, shape: [batch: B, kv_head: KH, key: Skv, channel: D], dtype: fp8_e4m3fn}
      v_tensor: {meaning: Stored value payload, shape: [batch: B, kv_head: KH, key: Skv, channel: D], dtype: fp8_e4m3fn}
      sf_q:
        meaning: Packed F8_128x4 E8M0 bytes scaling query channels in groups of Block
        shape: [scale_row: "B*H*ScaleRows*ceil_div(Sq,ScaleRows)", scale_column: "D/Block"]
        dtype: uint8
        range: Active E8M0 codes are 0 through 254; padding bytes do not define extra queries.
      sf_k:
        meaning: Packed F8_128x4 E8M0 bytes scaling key channels in groups of Block
        shape: [scale_row: "B*KH*ScaleRows*ceil_div(Skv,ScaleRows)", scale_column: "D/Block"]
        dtype: uint8
        range: Active E8M0 codes are 0 through 254; padding bytes do not define extra keys.
      sf_v:
        meaning: Packed F8_128x4 E8M0 bytes scaling values along the key axis in groups of Block
        shape: [sequence_block: "B*KH*ScaleCols*ceil_div(Skv,ScaleRows)", channel: D]
        dtype: uint8
        range: Active E8M0 codes are 0 through 254; padding bytes do not define extra keys.
      o_tensor:
        meaning: Caller-owned output destination; its initial contents are not operands
        shape: [batch: B, head: H, query: Sq, channel: D]
        dtype: bf16
        range: Arbitrary initial contents, including nonfinite bit patterns; fully overwritten.
      lse_tensor:
        meaning: Optional caller-owned LSE destination; shape and dtype describe the tensor when present
        shape: [batch: B, head: H, query: Sq]
        dtype: fp32
        range: Python None, or a tensor with arbitrary initial contents; all logical elements are overwritten when present.
        default: Python None (no LSE destination)
      is_causal: {meaning: Prepared-model bottom-right causal-mask selector, shape: [], dtype: bool, range: "{false, true}"}
      window_left:
        meaning: Prepared-model left-window width; optional_int denotes a Python integer or Python None
        shape: []
        dtype: optional_int
        range: Python None or an integer from -1 through 262143; None and -1 both disable the left bound.
        default: Python None (no left-window restriction)
      seq_kv_lens:
        meaning: Prepared call's optional sequence-length tensor; shape and dtype describe it when present
        shape: [batch: B]
        dtype: int32
        range: Python None for causal calls; otherwise every element equals Skv. Ragged lengths are outside this task.
      workspace: {meaning: Caller-provided mutable scratch with no mathematical output value, shape: [byte: W], dtype: uint8}
      sinks: {meaning: Python None disables attention sinks, shape: [], dtype: python_none, default: Python None}
      seq_q_lens: {meaning: Python None selects rectangular query lengths, shape: [], dtype: python_none, default: Python None}
      scale_softmax: {meaning: Python None uses the prepared scale defined in compute, shape: [], dtype: python_none, default: Python None}
      current_stream: {meaning: Python None uses the caller's current stream, shape: [], dtype: python_none, default: Python None}
      amax_o: {meaning: Python None disables output-amax reporting, shape: [], dtype: python_none, default: Python None}
      descale_q: {meaning: Python None disables a separate per-tensor query scale, shape: [], dtype: python_none, default: Python None}
      descale_k: {meaning: Python None disables a separate per-tensor key scale, shape: [], dtype: python_none, default: Python None}
      descale_v: {meaning: Python None disables a separate per-tensor value scale, shape: [], dtype: python_none, default: Python None}
      scale_o: {meaning: Python None disables output scaling, shape: [], dtype: python_none, default: Python None}
      block_table: {meaning: Python None selects dense key storage, shape: [], dtype: python_none, default: Python None}
      block_table_v: {meaning: Python None selects dense value storage, shape: [], dtype: python_none, default: Python None}
      gate: {meaning: Python None disables output gating, shape: [], dtype: python_none, default: Python None}
      sf_o: {meaning: Python None disables block-scaled output, shape: [], dtype: python_none, default: Python None}
    output:
      O: {meaning: Attention result written into the full logical o_tensor region without replacing the caller's storage, shape: [batch: B, head: H, query: Sq, channel: D], dtype: bf16}
      LSE: {meaning: Natural-log softmax normalizer written into the full logical lse_tensor region only when that destination is present, shape: [batch: B, head: H, query: Sq], dtype: fp32}
    compute:
      - name: Domain and external storage
        math: |
          B, H, KH, Sq, Skv and D are positive integers. 1 <= B <= 16,
          1 <= Sq <= 8192, 1 <= Skv <= 262144, Sq <= Skv,
          B*Sq <= 16384, B*Skv <= 1048576, and H % KH = 0.
          (H,KH,D) belongs to {(8,2,128), (8,2,256), (8,8,128), (8,8,256),
          (16,1,128), (16,1,256), (16,4,128), (32,8,128)}.
          These are dynamic ranges; the ten fixed shape cases are only samples.
          Q/K/V and O use logical batch-head-sequence-channel axes with dense
          batch-sequence-head-channel physical storage. LSE is contiguous B,H,Sq.
          Scale tensors have the packed storage shapes above; sequence padding
          affects scale storage only and does not extend the logical attention domain.
          The prepared scale is D^(-1/2). window_left=-1 is canonicalized to None.
          No paged, ragged, sink, gate, per-tensor scaling or quantized-output mode
          is part of this contract. The normal/tiny/peaked/zero input-construction
          families do not supply any hidden unquantized operands to the answer.
          W is a nonnegative integer, allocated from the prepared implementation's
          scratch_workspace_bytes(); scratch initialization is unspecified.
          The call returns Python None. Only O, present LSE, and workspace may be
          written; preserve caller buffer identities and all other storage,
          including guards. O and LSE do not depend on their initial contents.
      - name: Decode the stored block-scaled operands
        math: |
          All following numerical arithmetic is FP32 between explicit casts;
          the reference disables TF32. Indices and byte addresses are integers.
          For a padded logical scale matrix whose column count C is a multiple
          of ScaleCols, define its byte offset
          f(r,c,C) = floor(r/ScaleRows)*(C/ScaleCols)*(ScaleRows*ScaleCols)
                     + floor(c/ScaleCols)*(ScaleRows*ScaleCols)
                     + (r % Block)*(ScaleRows/Block)*ScaleCols
                     + floor((r % ScaleRows)/Block)*ScaleCols + c % ScaleCols.
          Byte addressing below starts at each scale tensor's first logical byte.
          Let Rq=ScaleRows*ceil_div(Sq,ScaleRows),
          Rk=ScaleRows*ceil_div(Skv,ScaleRows), Cq=D/Block, Cv=Rk/Block.
          For 0 <= b < B, 0 <= h < H, 0 <= k < KH,
          0 <= i < Sq, 0 <= j < Skv, 0 <= d < D:
          Qd[b,h,i,d] = q_tensor[b,h,i,d] *
            2^(sf_q.flat[(b*H+h)*Rq*Cq + f(i,floor(d/Block),Cq)]-ExponentBias).
          Kd[b,k,j,d] = k_tensor[b,k,j,d] *
            2^(sf_k.flat[(b*KH+k)*Rk*Cq + f(j,floor(d/Block),Cq)]-ExponentBias).
          Vd[b,k,j,d] = v_tensor[b,k,j,d] *
            2^(sf_v.flat[f(d,(b*KH+k)*Cv+floor(j/Block),B*KH*Cv)]-ExponentBias).
          Thus V's scale matrix packs batch/head groups across columns, while
          Q/K pack them across rows. E8M0 byte 0 means 2^(-ExponentBias), not zero.
        symbol:
          Qd: {meaning: Decoded queries, shape: "ref:q_tensor.shape", dtype: fp32}
          Kd: {meaning: Decoded keys, shape: "ref:k_tensor.shape", dtype: fp32}
          Vd: {meaning: Decoded values, shape: "ref:v_tensor.shape", dtype: fp32}
      - name: Grouped-query scores and bottom-right masks
        math: |
          Batch b and query head h are independent; h uses KV head
          k=floor(h/(H/KH)). For each query i, let center=i+Skv-Sq.
          A key j is visible iff 0 <= j < Skv, either is_causal=false or
          j <= center, and either window_left is None/-1 or j >= center-window_left.
          S[b,h,i,j] = D^(-1/2) * sum_{d=0}^{D-1} Qd[b,h,i,d]*Kd[b,k,j,d]
          for visible keys, and -inf otherwise. Both mask bounds are inclusive.
        symbol:
          S: {meaning: Scaled and masked FP32 attention scores, shape: [batch: B, head: H, query: Sq, key: Skv], dtype: fp32}
      - name: Probability rounding and normalized value sum
        math: |
          For each (b,h,i), process numerical groups t=0,...,ceil_div(Skv,KeyGroup)-1
          with J_t={j | t*KeyGroup <= j < min((t+1)*KeyGroup,Skv)} in increasing order.
          This order defines rounding semantics, not a required execution schedule.
          Initialize M(-1)=-inf, Z(-1)=0, N(-1,d)=0 for 0 <= d < D.
          Let beta=16 when D=128, otherwise beta=1. For each group:
          a=max_{j in J_t} S[b,h,i,j].
          M(t)=a if a-M(t-1) > 4*ln(2), otherwise M(t-1);
          the comparison is false for NaN, including -inf-(-inf).
          safe=M(t) if M(t) is finite, otherwise 0.
          alpha=exp(M(t-1)-safe) if M(t-1) is finite, otherwise 0.
          For j in J_t, P[b,h,i,j]=beta*exp(S[b,h,i,j]-safe) and
          Pq[b,h,i,j]=fp8_e4m3fn(clamp(P[b,h,i,j],0,ProbabilityMax)), using RNE.
          N(t,d)=alpha*N(t-1,d)+sum_{j in J_t} Pq[b,h,i,j]*Vd[b,k,j,d].
          Z(t)=alpha*Z(t-1)+sum_{j in J_t} P[b,h,i,j].
          Pq has unit scale; Z uses the unrounded probabilities. Fully masked
          groups contribute zero. After the last group T=ceil_div(Skv,KeyGroup)-1,
          O[b,h,i,d]=bf16(N(T,d)/Z(T)) if Z(T)>0, otherwise bf16(0).
          Independently, when lse_tensor is present,
          LSE[b,h,i]=logsumexp_{j=0}^{Skv-1} S[b,h,i,j] in natural-log units,
          without probability rounding or beta scaling. An entirely masked row
          has O=0 and LSE=-inf. The valid rectangular mask domain always includes
          the center key for finite inputs, but the empty-row rule fixes the boundary.
        symbol:
          M: {meaning: Delayed normalizer after numerical group t, shape: [batch: B, head: H, query: Sq], dtype: fp32}
          Z: {meaning: Unrounded softmax denominator after numerical group t, shape: [batch: B, head: H, query: Sq], dtype: fp32}
          N: {meaning: Rounded-probability value numerator after numerical group t, shape: "ref:O.shape", dtype: fp32}
          P: {meaning: Unrounded probabilities in each key's numerical group and normalizer, shape: "ref:S.shape", dtype: fp32}
          Pq: {meaning: Saturated E4M3FN probabilities used in the value numerator, shape: "ref:S.shape", dtype: fp8_e4m3fn}
    golden_reference:
      source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/fmha/fmha_mxfp8_qkv/problem/reference.py::Model.forward
      tolerance:
        O: >-
          Source record for candidate versus reference mutated o_tensor:
          metadata.benchmark_contract.correctness_tolerances.default declares
          atol=0.01, rtol=0.05 and max_mismatch_fraction=0.0. CERTIFIED_BEST records
          unchanged comparator/tolerances but does not supply the comparator.
          The formula, relative-error basis, comparator precision and NaN/Inf
          handling are unspecified; no schema-default criterion is adopted.
          This record preserves the known settings without claiming numerical
          guarantees or reproduction of the external acceptance boundary.
        LSE: >-
          Source record for candidate versus reference mutated lse_tensor when
          present: metadata.benchmark_contract.correctness_tolerances.default
          declares atol=0.01, rtol=0.05 and max_mismatch_fraction=0.0.
          CERTIFIED_BEST records unchanged comparator/tolerances but does not
          supply the comparator. The formula, relative-error basis, comparator
          precision and NaN/Inf handling are unspecified; no schema-default
          criterion is adopted. This record preserves the known settings without
          claiming numerical guarantees or reproduction of the external
          acceptance boundary.
