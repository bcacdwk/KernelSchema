      Reason: Each thread owns one row segment, so 16-byte stores would write half sectors; the source measures 3.9x write amplification without them
    - Item: DESIGN.Tile_pipeline::GEMM1.MAIN
      Choice: Row-index XOR swizzle for the staged codes and a 128-byte swizzle for the operand stages
      Reason: A plain row stride puts all lanes of a store phase in one bank group, which the source measures at 22 to 27-way conflicts
