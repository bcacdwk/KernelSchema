      Choice: tcgen05.mma kind::f8f6f4 writing an FP32 accumulator into a per-CTA 512-column tensor-memory allocation, committed to an mbarrier per k block
      Reason: The promote reads 32 lanes by 128 columns per warp from that allocation and the buffer-release edges assume the commit covers the operand reads
    - Item: DESIGN.Tile_pipeline::GEMM1.MAIN
      Choice: 258 barrier arrivals per macro-stage, being one arrival per thread on completion of its own copies plus one arrival per k block announcing the bulk byte count
      Reason: The stage barrier of a macro-stage must cover the per-thread copies and the bulk transfers of both of its k blocks
    - Item:
        - DESIGN.Work_schedule::GEMM1.Mapping
        - DESIGN.Work_schedule::GEMM2.Mapping
      Choice: Opt in to 203124 bytes of dynamic smem and keep at most 255 registers per thread so exactly one 256-thread CTA resides per SM
      Reason: The 4-deep 48KB stage ring, the whole tensor-memory allocation and the persistent stripe all assume one worker per SM
    - Item: DESIGN.Work_schedule::Flow.Launch
      Choice: Launch every submission with programmatic stream serialization allowed and place the wait and launch-permission instructions where the pipe declares them
      Reason: The start_after permissions let GEMM1 scan the payload inside the shadow of the routing grid while its data wait still gates the metadata reads
    - Item:
        - DESIGN.Math_reshape::pre_code
        - DESIGN.Math_reshape::act_code
      Choice: Form the codes with a saturating round-to-nearest-even FP32 to fp8_e4m3fn conversion and the scale reciprocals with an approximate FP32 reciprocal
      Reason: The declared Approx bound and the clamp of the Contract both assume this pair of primitives
    - Item: CONTRACT.Algorithm_requirement::act
      Choice: Evaluate its sigmoid as 0.5*tanh(0.5*x)+0.5 with the hardware tanh approximation
      Reason: The declared error bound of about 3.2e-4 is measured for this form; the exponential and reciprocal form is a different approximation
