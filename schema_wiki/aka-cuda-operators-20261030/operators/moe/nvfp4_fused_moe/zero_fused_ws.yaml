"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 2
  "dispatch":
    "id": "zero_fused_ws"
    "parent": "ws_fused_ws"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or the
      cached ABI reused by its host fast path; use the launch choices baked into a replayed graph.
      Select exactly when a.zflag is non-null, a.cfg=97, and the actual FC2 is f4_body_ws
      with GEMM1=false (a.cfg2 in {57,81}), subject to actual map and launch dispatch.
      A rejected submission does not acquire a fallback. These conditions apply independently
      over the shared Contract, without the parent's when.
      A fresh ABI gets zflag only when NVFP4_MOE_ZERO is neither "0" nor empty, neither cfg
      has an explicit nonnegative override, K=8, the validated automatic pair is eligible,
      and moe_zero_probe returns 1. That probe tests the verify predicate below plus both
      full weight-scale arrays for finite E4M3 encodings; it does not inspect route IDs.
      In-place changes do not recompute cached eligibility: current nonzero inputs remain
      in this node and take its dirty chain. Eager, single-graph and two-graph execution
      are parameters, not additional selection conditions.
      Let S be a.small_thresh when positive, otherwise native small_threshold(); on replay
      use the preparation choice baked into the graph. A pinned verdict is allocated only
      for zero mode "2" with T*H>=2^20; the two-graph path also requires an actual exec_clean.
design:
  math_reshape:
    thesis: |-
      Verify current zero-input bytes and overwrite the output with zeros before deciding whether to compute. Clean inputs bypass expert arithmetic; dirty inputs retain expert compaction, pre-gather, fused paired FC1/activation/quantization, WS FC2 and slot-order reduction. Verification adds a full input scan and output write even when the dirty chain runs.
    rewrite:
    - step: verify
      name: Recheck current zero inputs and seed the output
      math: |
        Rcap=T*K. has_limit=1 when gemm1_clamp_limit is present, else 0.
        At each verifier execution, Dirty is the OR of these predicates:
        any hidden_states byte q with (q & 0x77)!=0;
        any hidden_states_scale byte s with (s & 0x7f)==0x7f;
        any nonfinite route_weights entry, gemm1_alpha or gemm1_beta entry;
        and any nonfinite gemm1_clamp_limit entry when that tensor is present.
        All slots and experts are tested, including inactive ones. Signed FP4 zero is accepted.
        Route IDs, weight payloads and weight scales are not read by this repeated verifier.
        The initial probe additionally checks every byte of both prepared weight-scale arrays
        with the same E4M3 predicate; replay adds no weight-content check or stability guarantee.
        Unconditionally set Y[:,:]=bf16(+0), then publish Clean=1 if Dirty=0, else 0.
        VerifyDirty(u) denotes the Boolean OR over verification work u, bound by work_schedule;
        Dirty=OR_u VerifyDirty(u). ZState is the cached int32[4] allocation, initially all zero:
        word 0 holds Clean, word 1 combines dirty contributions, word 2 counts completed works,
        and word 3 is unused. Each verifier resets words 1 and 2 to zero for reuse; Clean stays
        available to all guarded consumers until the next verifier overwrites it.
        If present, HostVerdict is initialized to -1 and receives the published Clean; host
        replay resets it to -1 before a verify-only graph launch. A verdict is not stream completion.
        When Clean=1, return [output] after verification without evaluating routing through finalize.
        Clean=0 executes every following rewrite and replaces the seeded zeros at finalize.
        The full graph includes this verifier; a verify-only graph followed by the full graph
        therefore evaluates the predicate and writes Y twice. Each execution uses its own current bytes.
        Projection/gather scratch remains unchanged on clean execution; large-chain count/fill
        reset still occurs when the full chain is submitted.
      symbol:
        Clean: {meaning: Current verifier verdict stored in ZState word 0, shape: [], dtype: int32, retention: keep_value verification_epoch}
        VerifyDirty: {meaning: Per-work Boolean dirty contribution, shape: [], dtype: int32}
        ZState: {meaning: Cached verifier verdict and self-resetting reduction state, shape: [{word: 4}], dtype: int32, retention: keep_value cached_ABI}
        HostVerdict: {meaning: Optional pinned CPU verdict mirror, shape: [], dtype: int32, retention: keep_value cached_ABI}
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Only for Clean=0, V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation and gather policies are bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per fused FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok is consumed only by route-major gather
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate stored activation bytes into compact route order
      math: |
        For (t,k) in V and r=route_of[t,k], Xq[r,:]=hidden_states[t,:]
        and Xs[r,:]=hidden_states_scale[t,:], with no conversion.
        Flat and token-major gather load each active token's bytes once for all its routes;
        route-major gather loads them once per active route.
        Let Tv=count({t | exists k: (t,k) in V}). Rows [Rv,Rcap) are not initialized or cleared.
        Decode weights exactly as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
      symbol:
        Xq: {meaning: Gathered activation payload, shape: [{route: Rcap}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value
            invocation}
        Xs: {meaning: Gathered activation scales, shape: [{route: Rcap}, {hidden_block: H/G}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
    - step: fc1
      name: Paired projection with dense padded rows
      math: |
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        Row m uses payload row b+m of Xq; its scale row is b+m for m<v
        and b otherwise. Payload reads may cross into another expert or unwritten capacity;
        outside the Rcap-row byte matrix the payload is zero-filled.
        Extra rows are evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. D1(-1)=0;
        D1(s)=mma32(Xtile[:,64*s:64*(s+1)],Wpair[:,64*s:64*(s+1)]^T,D1(s-1)),
        s=0..H/64-1. up=D1(H/64-1)[:,:Bn1]; gate=D1(H/64-1)[:,Bn1:].
      symbol: {D1: {meaning: Paired up and gate projection accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,n1); s=-1..H/64-1'}}
      arithmetic:
        accumulate: |-
          mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage; the first update disables the previous accumulator. Native internal product/reduction rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Folded activation and branchless packed quantization
      math: |
        Apply Contract's asymmetric clamp to up and gate, including the padded rows.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), and F(x,c)=rcp_approx(1+ex2_approx_ftz(x*c)).
        For activation_type=3, c=a*L2E and Ap=(gate*F(gate,c))*(up+bpar).
        For activation_type=10, cg=ia*(2*L2E), cu=ib*(2*L2E),
        tg=a*fma32(F(gate,cg),2,-1), tu=bpar*fma32(F(up,cu),2,-1),
        and Ap=(tg*F(gate,L2E))*tu. Parenthesized FP32 operations retain their shown order.
        ia and ib are evaluated per workitem even for SwiGLU, where they are unused (ib may be infinite).
        For every row and G-channel block, amax is the max of eight pairwise absolute maxima;
        combine pairs (0,1),(2,3),(4,5),(6,7), then the first/second halves and finally both halves.
        Use fmax semantics, including ignoring a NaN operand when the other operand is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))).
        q[i]=Q4(Ap[i]*inv), using Contract's RNE saturating E2M1 code rule and low-even-nibble packing.
        This multiplication is evaluated also when s8=0; do not replace it by a guarded division.
        For m<v only, store Aq[b+m,n/2:(n+Bn1)/2] as packed q and As[b+m,n/G:(n+Bn1)/G]=s8.
        Rows [Rv,Rcap) retain their prior bytes. The decoded operand is d(q)*s8; a zero scale
        therefore need not have a zero payload code. Padded-row activation and quantization are computed without stores.
      symbol:
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32; folded prescales, the sigmoid identity for tanh, and multiply-by-rounded-reciprocal normalization replace the reference evaluation. unknown: no verified bound for the composed error over this entire path is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, QTile uses Aq payload row b+m and As scale row b+m for m<v, b otherwise,
        with the capacity and zero-fill behavior defined in fc1. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item activation parameters, reciprocals and folded constants above, but does not use them.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        For every (t,h), Z(-1)=0. For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection or gather payload work and still overwrites Y with zeros.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs. Except for verification, the following counts apply only to dirty execution; clean execution performs zero projection MACs and zero activation evaluations.
      footprint:
      - {item: FC1 intermediates, change: 16*Rv*I bytes of FP32 intermediates -> 9*Rv*I/16 live payload/scale bytes;
          physical act allocation remains 2*Rcap*I bytes, by: [fc1, activate]}
      - {item: Route gather, change: '0 -> 9*Rv*H/16 written bytes and 9*Rcap*H/16 capacity', by: [gather]}
      - {item: Verifier state, change: '0 -> 16 device bytes plus 4 pinned host bytes when enabled; dirty-chain scratch remains allocated even on clean calls', by: [verify]}
      traffic:
      - {item: Verify and zero, change: "Per verifier execution scan 9*T*H/16 + 4*T*K + 4*E*(2+has_limit) input bytes and write 2*T*H output bytes, plus flag traffic. These add to the dirty chain; on clean input the zero write replaces finalize. Initial eligibility makes the same input scan plus 3*E*H*I/16 weight-scale bytes, without writing output", by: [verify]}
      - item: Gather copy
        change: |-
          Flat/token-major add 9*(Tv+Rv)*H/16 logical bytes; route-major adds 18*Rv*H/16
        by: [gather, fc1]
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs, including discarded rows under the bound worktile
          geometry', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> P*I elements for clamp/activation/quantization, including
          discarded rows', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: Affects P*I evaluations through the explicitly defined approximations; no established full-domain output
          error bound
        by: [activate]
  work_schedule:
    thesis: |-
      The full chain is verify -> prepare -> gather -> fc1 -> fc2 -> finalize for Small,
      or verify -> memset -> count -> scan -> scatter -> gather -> fc1 -> fc2 -> finalize otherwise.
      Small means Rcap<=S as defined in when. FC1 is cfg97; FC2 is cfg57 or cfg81. Each projection owns a full reduction and strides a capped static work sequence.
      Eager execution and single-graph replay submit the full chain. With an actual exec_clean and HostVerdict, graph replay first submits verify_only on the invocation stream after setting HostVerdict=-1. Outside an outer capture, host spins while the verdict is -1 for fewer than 200000000 iterations, then submits the full graph iff the observed verdict is not 1. This is a bounded poll, not stream synchronization. During an outer capture it records verify_only then the full graph without polling. Without exec_clean it launches only the full graph. A failed clean launch returns immediately.
      verify_only and verify are distinct submissions of the same work definition, sharing the cached ZState and optional HostVerdict. The full graph's verifier rechecks and rezeros even after verify_only. Same-stream execution orders these uses; no cross-stream exclusion is added. Graph creation/failure cases are specified in realization.
      In a submitted full chain, all kernels after verify test Clean and return on 1 before routing/gather/projection/finalize work. They are still launched. The large-chain memset is unconditional and clears counts/fill even on clean input; the small-chain guard leaves scratch unchanged. A verify-only clean return submits neither memset nor the guarded chain. Dirty execution uses every applicable phase below; no separate activation kernel is launched.
      The launch and handoff entries enumerate conditional submissions: prepare applies only for Small and count/scan/scatter only otherwise. Every actual successor waits for its actual predecessor grid before reading; no absent phase creates a wait. Routing/data handoffs are used only on dirty execution. The Route handoff applies only to route-major gather. Prepared carries the same routing arrays in the small chain.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission, not early consumption; otherwise stream order serializes kernels. The API enable_pdl argument does not select this policy. ZGUARD performs its own predecessor wait before reading Clean. In WS GEMMs it precedes their normal wait/trigger, so clean CTAs return without that trigger; routing/gather/finalize trigger before their guard. No early launch event is promised where the kernel returns before triggering.
    flow:
      launch:
      - {phase: [verify_only], protocol: source_pdl}
      - {phase: [verify], protocol: source_pdl}
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: source_pdl}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl}
      - {phase: [finalize], protocol: source_pdl}
      handoff:
        Clean: {producer: verify, consumer: [prepare, count, scan, scatter, gather, fc1, fc2, finalize], storage: global, ready: verify.kernel_done}
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        Xq: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Xs: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Aq: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        As: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [gather, fc1, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [gather], storage: global, ready: scatter.kernel_done}
    phase:
      verify_only: &verify_work
        describe: Scan assigned current bytes, overwrite assigned output elements with zero, and contribute to the verifier verdict.
        decomposition:
          strategy: |-
            Zg=min(max(T,1),296). One work u owns, in each independent flat index space of length N, Idx(u,N)={256*(u+r*Zg)+v | r>=0, 0<=v<256, index<N}; Nv(u,N)=count(Idx(u,N)). Nq=T*H/8 indexes four-byte payload words and eight-element output vectors; Ns=T*H/16 indexes scale bytes; Rcap indexes scores; E indexes each parameter array. These local traversals are not separate worktiles. Every CTA has 256 threads and contributes exactly one arrival, even if its tested-input slices are empty. The CTA receiving the last arrival folds all dirty contributions, writes Clean, resets reduction state, and optionally publishes HostVerdict. There is no grid-wide rendezvous.
          partition: {stripe: {size: Zg, tile: 1}}
          worktile:
            iteration:
              hidden_states: {shape: [{byte: '4*Nv(u,Nq)'}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{byte: 'Nv(u,Ns)'}], dtype: fp8_e4m3fn, direction: ascending}
              route_weights: {shape: [{slot: 'Nv(u,Rcap)'}], dtype: fp32, direction: ascending}
              Parameters: {shape: [{value: '(2+has_limit)*Nv(u,E)'}], dtype: fp32, direction: ascending}
          target:
            single_tile: {VerifyDirty: {shape: [], dtype: int32}, Y: {shape: [{element: '8*Nv(u,Nq)'}], dtype: bf16}}
            tile_reduction: {dimension: stripe, input: VerifyDirty, output: Clean, method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Zg}
        schedule:
          worktile_order: [{by: stripe, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      verify: *verify_work
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: Copy stored bytes into route order using the effective flat, token-major or route-major policy.
        decomposition:
          strategy: |-
            Flat takes precedence over token-major. Let C=9*H/256, Gg=max(1,min(ceil_div(T*C,128),gatherf_cap())) and Ncopy=ceil_div(T*C,128) for flat: unit u covers flattened token/chunk coordinates [128*u,128*(u+1)). Each chunk makes up to K copies.
            For token-major, Gg=max(1,min(T,gather_grid_cap())), Ncopy=Gg*floor(T/(2*Gg))+min(Gg,T%(2*Gg)); unit u uses tokens (u%Gg)+2*floor(u/Gg)*Gg and that token+Gg, masking the second past T. For route-major, Gg=min(ceil_div(Rcap,4),1184), Ncopy=ceil_div(Rv,4); unit u covers routes [4*u,min(4*u+4,Rv)).
            Flat and route-major use 128 threads. Token-major uses Nt=gather_threads(), default 64, clamped to [32,1024] and rounded down to a warp multiple. The effective flat cap defaults to 1184, token cap to 2368; both clamp to [1,65536]. InputBytes is respectively 128*16, 2*9*H/16 or 4*9*H/16; CopyBytes is respectively K*InputBytes, K*InputBytes or InputBytes. CopyMaps denotes the corresponding route_of entries, or four ptok entries for route-major.
          partition: {unit: {size: Ncopy, tile: 1}}
          worktile: {invariant: {Input_bytes: {shape: [{byte: InputBytes}], dtype: uint8}, CopyMaps: {shape: [{word: 128*K
                      if flat else 2*K if token_major else 4}], dtype: int32}}}
          target: {single_tile: {Gathered: {shape: [{byte: CopyBytes}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Gg}
        schedule: {worktile_order: [{by: unit, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: One expert tile and Bn1 paired channels over the full hidden reduction, then fused activation and QDQ.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256. cfg97 has STAGES=3,SFS=2,AMODE=2,EPI=4,SK=1; BRLESS,DEEP,CPHOIST,EARLYDONE,SFCH,NPAIR are true and SFPF=2. PP,TSTORE,EPITB,FUSE,SELFPREP are false; NIPRE=PFTMA=MBH=0.
            For either GEMM let Nx be its output channel tile count. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. Each CTA has 224 threads and strides flattened work IDs with channel fastest. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Xq: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              Xs: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Aq: {shape: [{row: Bm}, {packed_intermediate: Bn1/2}], dtype: uint8}, As: {shape: [
                  {row: Bm}, {intermediate_block: Bn1/G}], dtype: fp8_e4m3fn}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(I/Bn1)}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm, Bk and Grid from fc1. Bn2=128,STAGES=3,SFS=2,EPI=4,AMODE=0,SK=1,BRLESS=true; PP,NPAIR,SFCH,FUSE,SELFPREP are false; PFTMA=NIPRE=MBH=SFPF=0.
            cfg57 has DEEP,TSTORE,EPITB,CPHOIST,EARLYDONE=false. cfg81 sets all five true and requires the drain tensor map. Complete 32-row quadrants use bulk stores only with TSTORE; partial quadrants and all cfg57 stores use masked vector stores. Map/attribute/launch failures return errors without a substituted WS implementation.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      The two verifier phases follow the same local pipe. Their global state persists across calls, with self-resetting reduction words and stream-ordered reuse; a host verdict publication is not a device-stream completion event.
      All other pipes describe dirty execution after an entry ZGUARD reads Clean. In prepare/count/scan/scatter/gather/finalize, the existing wait and first-warp trigger precede the guard's own wait. In FC1/FC2 the guard is first, before the usual wait/trigger and any metadata read or TMEM allocation. Clean skips every subsequent action in that CTA. No routing or projection scratch is read to decide a clean return.
      On dirty execution, warp 0 supplies activation scales, warp 1 payload and weight scales, warp 2 ordered MMA, and four independent epilogue warps drain TMEM. Payload/scale rings persist across worktiles; DEEP separates their reuse waits. One accumulator is reused after all four epilogue warps release its last TMEM reads, independently of their conversion/store tails.
      Projection parameters are local as fixed in work_schedule. Nrow=2*Bn1 for FC1 or Bn2 for FC2; AccCols=Nrow; Acount=1; NSFB=1; TCOLS=AccCols+32*SFS and TALLOC=256. Dpayload=STAGES if DEEP else SFS. FC1 has Chunks=2,DrainWidth=64; FC2 has Chunks=2,DrainWidth=64 when EPITB, otherwise Chunks=4,DrainWidth=32. ReleaseAt=0 if EARLYDONE else 1.
      Each epilogue warp follows its pipe independently, with quadrant=warp_id%4. Chunk c selects one 32-column portion (up and gate together for FC1), or adjacent FC2 portions 2*c and 2*c+1 when EPITB. There is no inter-warp epilogue rendezvous. The release predecessor consumed by MMA covers all four epilogue warps.
      Gather instantiates warp[0:Nt/32]; other members of its listed maximum range have no action or event. Each projection instantiates warp[0:7].
    phase:
      verify_only: &verify_pipe
        resource:
          LocalDirty: {space: register, member_slot_shape: [{lane: 256}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for preceding grid work, then let the first warp trigger successor admission; initialize each lane's local dirty mask to zero.
                produce: |-
                  Follow the work's independent flat loops: write uint4 zeros to the assigned output vectors, OR payload magnitude bits, test activation-scale bytes, scores, then alpha/beta/optional limit. No early stop on a dirty element. Each lane accumulates LocalDirty across all loops, including zero iterations, and a CTA syncthreads_or produces its VerifyDirty contribution.
                publish: |-
                  Only thread 0 acts after the CTA reduction. If VerifyDirty is nonzero, atomicOr ZState[1] with 1. Both clean and dirty CTA leaders execute a device threadfence then atomicAdd ZState[2] by 1. Non-last leaders return without waiting for others. The leader whose old ticket is Zg-1 reads volatile ZState[1], writes ZState[0]=Clean, resets words 1 and 2, and, if HostVerdict exists, executes threadfence_system before its volatile host-mirror store. Word 3 is untouched. There is no additional grid barrier or host acknowledgment. Guarded consumers rely on verifier kernel completion before their flag read; host polling only controls whether to enqueue the full graph and does not replace device ordering or add cross-stream safety.
            pipe: {prologue: ['enter:Input'], steady: ['produce:VerifyDirty', 'publish:Clean']}
      verify: *verify_pipe
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: |-
                  Nt=128 for flat/route-major, otherwise the bound gather_threads value. Wait for actual preceding preparation and trigger admission. Flat/token-major return if Rv=0; route-major has an empty row loop.
                produce: |-
                  Flat assigns each lane one 16-byte input chunk and copies its vector to all active destinations. Token-major holds two route lists, loads the second token vector before the first, then interleaves their stores; payload precedes scales. Skip input loads for tokens without active routes. Route-major visits four valid rows in order, loading ptok and copying payload then scales in block-strided 16-byte vectors. Mask tails, leave spare capacity untouched, and reuse register vectors after store issue.
            pipe: {prologue: ['enter:Input'], steady: [{repeat: t, steady: ['produce:Gathered(t)']}]}
      fc1:
        domain: {t: worktile, k: [0, H/Bk], g: {flatten: [t, k]}, c: [0, Chunks]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}
              TScale(g): {part: {column: [Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
          ScaleWord: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {byte: 4}], dtype: uint8, slot_count: 1}
        role:
          AScale: &projection_scales
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles wait for predecessor grid completion. Warp 0 triggers successor admission. If J=0 all return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and publish setup with one CTA rendezvous. Surplus CTAs still initialize and retire. The continuous stage counter never resets between worktiles.
                prime: |-
                  Resolve tile/expert/route bases. Padded rows use the first valid row scales. FC1 uses gathered scales; FC2 uses As. Read local stages 0 and 1 when present into the two register sets before the stage loop.
                produce: |-
                  After scale-ring reuse, write the current registers into AScale(g), fence shared writes, then load k+1 into the alternate register set when present. The primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish this readiness contribution. No load passes the worktile end.
                retire: Join the final CTA rendezvous after every role's assigned sequence and any bulk global store
                  drain; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload: &projection_payload
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue A/B TMA payloads. FC1 uses one gathered 128-row A box and two Bn1-row B boxes. FC2 uses one 128-row A box and one Bn2-row B box. Completion covers 128*(Bm+Nrow) bytes.
                stage: |-
                  DEEP waits for the scale slot after payload issue; without DEEP the preceding SFS-distance wait covers both. Issue weight-scale cp.async copies and 32 completion arrivals. FC1 SFCH groups the copies into contiguous source spans and NPAIR combines both halves into one 128-row scale image. FC2 uses contiguous 16-byte pieces. FC1 also hints weight scales k+SFPF only within this worktile; the hint has no readiness event or pipeline slot. Full-stage readiness joins completed TMA bytes, completed weight-scale copies and the activation-scale release arrival. Payload arrival alone does not publish a stage.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'],
                'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA: &projection_mma
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: |-
                    If CPHOIST, t>0 and Rcap>=16*E, first wait for stage 0 readiness and issue its scale copies into disjoint TScale, then wait for the prior accumulator release. Otherwise wait for accumulator release before stage 0 readiness and scale copies. The prior user is t-Acount; the first Acount worktiles have no such wait. Done means scale copies issued and accumulator reusable, not copies completed.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale unless begin already issued stage 0 copies. One elected lane issues four ascending 64-channel updates, each spanning all 128 result columns, including the paired up/gate columns in FC1. First update initializes Acc. Cumulative stage completion covers preceding scale copies and all MMA input reads, releasing shared slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data:
                begin:Acc(t)@done: ['AScale/produce:AScale(g[t,0])', 'Payload/load:Payload(g[t,0])', 'Payload/stage:BScale(g[t,0])']
                compute:Stage(g): ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']
              reuse: {'begin:Acc(t+Acount)@done': ['Epilogue/release:Acc(t,Chunks-1,ReleaseAt)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Each epilogue warp resolves expert parameters and folded activation constants (also in FC2, where unused), waits for Acc(t), and loads its quadrant/chunk into private Drain. FC1 reads up and gate together; FC2 EPITB reads adjacent chunks together; plain FC2 reads one chunk. Wait for every issued TMEM read before use.
                release: |-
                  Point 0 is immediately after the TMEM read wait; point 1 is after this chunk stores issue. Only c=Chunks-1 and point=ReleaseAt performs a warp rendezvous and one release arrival. Other instances are no-ops. MMA waits for all EPI arrivals on the chosen accumulator; no inter-warp rendezvous occurs here and global stores may remain in flight.
                produce: |-
                  Apply activate to all rows including padding; store packed payload only for valid rows. Hold two scale bytes from the first chunk, combine a four-byte word at the second chunk and clear ScaleWord. Done covers conversion/store issue, not kernel-global publication.
            pipe: {steady: [{repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'release:Acc(t,c,0)', 'produce:Aq(t,c)',
                        'release:Acc(t,c,1)']}]}]}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      fc2:
        domain: {t: worktile, k: [0, I/Bk], g: {flatten: [t, k]}, c: [0, Chunks], h: [0, DrainWidth/32]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}
              TScale(g): {part: {column: [Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
          Sink: {space: SMEM, member_slot_shape: [{quadrant: 4 if TSTORE else 0}, {row: 32}, {hidden: 32}], dtype: bf16,
            slot_count: 1}
        role:
          AScale: *projection_scales
          Payload: *projection_payload
          MMA: *projection_mma
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Each epilogue warp resolves expert parameters and folded activation constants (also in FC2, where unused), waits for Acc(t), and loads its quadrant/chunk into private Drain. FC1 reads up and gate together; FC2 EPITB reads adjacent chunks together; plain FC2 reads one chunk. Wait for every issued TMEM read before use.
                release: |-
                  Point 0 is immediately after the TMEM read wait; point 1 is after this chunk stores issue. Only c=Chunks-1 and point=ReleaseAt performs a warp rendezvous and one release arrival. Other instances are no-ops. MMA waits for all EPI arrivals on the chosen accumulator; no inter-warp rendezvous occurs here and global stores may remain in flight.
                pack: Convert this 32-channel half of Drain to BF16 output registers, preserving route rounding before
                  weighting.
                recycle: |-
                  Only TSTORE and a full valid quadrant use Sink: the issuing lane waits until ALL previous bulk stores have consumed their shared source, including the previous worktile, then the warp rendezvous permits overwrite. This is not global completion. Partial quadrants neither touch Sink nor clear pending groups.
                store:
                  execution_mode: async
                  meaning: |-
                    TSTORE full quadrants stage 32x32 BF16 values, fence to the async proxy, rendezvous, and issue/commit a bulk store from one lane. All other cases use valid-row-masked vector global stores. Done means global completion; bulk completion is established by drain, not recycle.
                drain: |-
                  After all worktiles, every bulk issuing lane waits for ALL stores to complete globally, then joins the final CTA rendezvous. Non-TSTORE and empty sequences have no bulk groups. There is no per-worktile global drain.
            pipe:
              steady:
              - repeat: t
                steady:
                - {repeat: c, steady: ['load:Drain(t,c)', 'release:Acc(t,c,0)', {repeat: h, steady: ['pack:Rout(t,c,h)',
                        'recycle:Sink(t,c,h)', 'store:Rout(t,c,h)']}, 'release:Acc(t,c,1)']}
              epilogue: ['drain:Rout']
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding grid, including global bulk-store completion, then trigger admission.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and the single accumulator.
  - item: ['design.tile_pipeline::fc1.Payload', 'design.tile_pipeline::fc2.Payload']
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight row permutation, with matching scale images. FC1 uses gathered-row maps and FC2 uses route activation maps. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Epilogue
    choice: |-
      For TSTORE use cp.async.bulk.tensor.2d.global.shared::cta.bulk_group with the 64-byte by 32-row byte-view map, async-proxy fence, per-issuer wait_group.read 0 for source reuse and wait_group 0 before the final CTA rendezvous.
    reason: Source reuse permits outstanding global stores; finalize requires their stronger final completion.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains ABI/scratch/ZState/HostVerdict ownership on host-cache hits and refreshes the invocation stream. Return does not imply device completion, including after a successful host verdict poll.
      Native moe_run uses eager full-chain execution when graphs are disabled, capture has been disabled after failure, or the matching signature has only one pending hit. The second identical signature attempts full-chain capture on a private nonblocking stream. A matching full graph replays its baked parameters. Full capture/instantiation failure sets pending_hits=-1 and returns to eager execution; capture-stream creation failure does likewise. If full capture succeeds and HostVerdict exists, it additionally attempts verify-only capture. Failure there leaves exec_clean null, preserving full-graph replay. Neither failure path substitutes another projection implementation.
      The graph signature includes ABI pointers and controls but excludes the invocation stream; it does not hash tensor contents. The initial probe synchronizes its input stream before host readback. Subsequent replay validation tests only the operands in verify; no weight immutability assumption is introduced. Cached eligibility and host configuration are not rebuilt by in-place tensor changes.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. These WS configurations return 733 on operand-map refusal; cfg81 also returns 738 on drain-map refusal. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. Attribute/launch errors propagate to Model.forward; output may already have been zeroed before a later submission error. Scratch and process-global graph/map caches have no added lock or cross-stream completion protocol; this extraction supplies none.
    reason: Cached allocation lifetime, actual graph state and failure behavior determine which verifier and guarded chain execute; submission does not establish completion or mutual exclusion.
