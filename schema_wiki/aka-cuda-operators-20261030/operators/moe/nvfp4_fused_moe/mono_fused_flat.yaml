"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "mono_fused_flat"
    "parent": "ws_fused_flat"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or
      the cached ABI reused by its host fast path; use the launch choices baked into
      a replayed graph. Select exactly when a.zflag=0, the actual FC1 is f4_body with
      GEMM1=true and SK=1, and FC2 is f4_flat_g2. FC2 requires a.cfg2=23 and acceptance
      of its 128-row operand maps. Its map refusal continues through local cfg12 and
      belongs to the node for the actual terminal FC2. FC1 may use either its selected
      TMA instance or the source's cp.async map-refusal fallback; classify by the
      resulting template arguments. Attribute or submission rejection adds no fallback.
      NK1 is selected exactly when I=256; explicit cfg2=23 also covers I>256.
      Parent is only the copying origin; this condition is independent over the shared
      Contract. In-place tensor changes do not rebuild cached configuration or probe
      eligibility. Rcap=T*K. Let S be a.small_thresh when positive, otherwise native
      small_threshold(); a replay keeps the preparation choice baked into its graph.
design:
  math_reshape:
    thesis: |-
      Compact active routes by expert and retain packed FP4 operands through both projections. Fuse the paired up/gate projection, approximate activation and block quantization, avoiding full FP32 intermediates at the cost of dense padded arithmetic and an optional route-order gather and repeated in-kernel operand reads.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation and gather policies are bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per fused FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok is consumed by route-major gather and direct
            FC1 token gather
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate stored activation bytes into compact route order
      math: |
        When Pregather is selected, for (t,k) in V and r=route_of[t,k], Xq[r,:]=hidden_states[t,:]
        and Xs[r,:]=hidden_states_scale[t,:], with no conversion.
        Flat and token-major gather load each active token's bytes once for all its routes;
        route-major gather loads them once per active route. Pregather is a host/pipeline
        choice, distinct from FC1's actual AMODE: a map-refusal fallback can leave the
        gathered buffers written but unused. AMODE=0 or 1 reads original tensors via Route;
        AMODE=2 reads Xq/Xs. Without Pregather, Xq/Xs are neither allocated nor written.
        Let Tv=count({t | exists k: (t,k) in V}). Rows [Rv,Rcap) are not initialized or cleared.
        Decode weights exactly as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
      symbol:
        Xq: {meaning: Gathered activation payload, shape: [{route: Rcap}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value
            invocation}
        Xs: {meaning: Gathered activation scales, shape: [{route: Rcap}, {hidden_block: H/G}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
    - step: fc1
      name: Paired projection with dense padded rows
      math: |
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        With AMODE=2, row m uses payload row b+m of Xq; its scale row is b+m for m<v
        and b otherwise. Payload reads may cross into another expert or unwritten capacity;
        outside the Rcap-row byte matrix the payload is zero-filled.
        With AMODE=0 or 1, row m reads both payload and scales from hidden token
        Route[b+(m if m<v else 0),0]. All 128 rows are fetched, including repeated padding.
        Extra rows in either mode are evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. D1(-1)=0;
        D1(s)=mma32(Xtile[:,64*s:64*(s+1)],Wpair[:,64*s:64*(s+1)]^T,D1(s-1)),
        s=0..H/64-1. up=D1(H/64-1)[:,:Bn1]; gate=D1(H/64-1)[:,Bn1:].
      symbol: {D1: {meaning: Paired up and gate projection accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,n1); s=-1..H/64-1'}}
      arithmetic:
        accumulate: |-
          mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage; the first update disables the previous accumulator. Native internal product/reduction rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Folded activation and packed quantization
      math: |
        Apply Contract's asymmetric clamp to up and gate, including the padded rows.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), and F(x,c)=rcp_approx(1+ex2_approx_ftz(x*c)).
        For activation_type=3, c=a*L2E and Ap=(gate*F(gate,c))*(up+bpar).
        For activation_type=10, cg=ia*(2*L2E), cu=ib*(2*L2E),
        tg=a*fma32(F(gate,cg),2,-1), tu=bpar*fma32(F(up,cu),2,-1),
        and Ap=(tg*F(gate,L2E))*tu. Parenthesized FP32 operations retain their shown order.
        ia and ib are evaluated per workitem even for SwiGLU, where they are unused (ib may be infinite).
        For every row and G-channel block, start amax(-1)=0 and, for q=0..7 in order,
        amax(q)=fmax(amax(q-1),fmax(abs(Ap[2*q]),abs(Ap[2*q+1]))).
        Use fmax semantics, including ignoring a NaN operand when the other operand is numeric.
        s8=fp8_e4m3fn(min(amax(7)*fp32(1/6),448)). BRLESS is bound by the actual FC1 instance.
        If BRLESS, inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))) and q[i]=Q4(Ap[i]*inv),
        even for s8=0. Otherwise, initialize all payload codes to zero and evaluate
        inv=rcp_rn(fp32(s8)), q[i]=Q4(Ap[i]*inv) only when fp32(s8)>0.
        Q4 uses Contract's RNE saturating E2M1 code rule and low-even-nibble packing.
        For m<v only, store Aq[b+m,n/2:(n+Bn1)/2] as packed q and As[b+m,n/G:(n+Bn1)/G]=s8.
        Rows [Rv,Rcap) retain their prior bytes. The decoded operand is d(q)*s8; a zero scale
        need not have zero payload codes in the BRLESS form. Padded-row activation and quantization are computed without stores.
      symbol:
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32; folded prescales, the sigmoid identity for tanh, and multiply-by-rounded-reciprocal normalization replace the reference evaluation. unknown: no verified bound for the composed error over this entire path is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        Evaluate all Bm rows. As uses row b+m for m<v, b otherwise. Aq uses row b+m:
        payload reads may cross into another expert or unwritten capacity, with zero-fill
        outside the Rcap-row byte matrix. Let QTile decode these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        After completing fc2, including J=0, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection or gather payload work and still overwrites Y with zeros.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: 16*Rv*I bytes of FP32 intermediates -> 9*Rv*I/16 live payload/scale bytes;
          physical act allocation remains 2*Rcap*I bytes, by: [fc1, activate]}
      - {item: Route gather, change: 'With Pregather, 0 -> 9*Rv*H/16 written bytes and 9*Rcap*H/16 capacity, even
          if unused after map fallback; otherwise no gather allocation', by: [gather]}
      traffic:
      - item: Gather copy
        change: |-
          Flat/token-major add 9*(Tv+Rv)*H/16 logical bytes; route-major adds 18*Rv*H/16; direct FC1 modes additionally fetch their padded operands per tile; Pregather may remain unused
        by: [gather, fc1]
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> P*I elements for clamp/activation/quantization, including
          discarded rows', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: Affects P*I evaluations through the explicitly defined approximations; no established full-domain output
          error bound
        by: [activate]
  work_schedule:
    thesis: |-
      Compact routes using one small preparation kernel or count/scan/scatter kernels, optionally pre-gather, then submit four-warp monolithic fused FC1, flat-stream FC2 and finalize. Each projection owns a full reduction and strides a capped static work sequence. FC2 carries operand staging across workitems, overlapping later operands with current computation at the cost of a metadata ring and a boundary route-writeback pause.
      Let Small mean Rcap<=S with S defined in when. Only prepare is submitted for Small; only count/scan/scatter are submitted otherwise. Pregather means a.cfg in {27,30,33,39,41,45,48,49,50,51,82} within this node, including cfg33 only through its mono map-refusal fallback. Gather is submitted exactly for Pregather, even when FC1 subsequently ignores its result after map refusal or a native fallthrough. The launch and handoff entries enumerate these conditional alternatives, not extra no-op kernels: entries for absent phases do not apply.
      The actual stream chain is prepare -> optional gather -> fc1 -> fc2 -> finalize, or memset -> count -> scan -> scatter -> optional gather -> fc1 -> fc2 -> finalize. Every successor waits for its actual predecessor grid before reading; no bypassed phase creates an event or wait. All routing handoffs from count/scan/scatter apply only to the large chain; Prepared carries the same arrays in the small chain. Handoff operand views apply only when the selected consumer mode actually reads them.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise the stream serializes kernels; the in-kernel grid dependency controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: source_pdl}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        Xq: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Xs: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Aq: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        As: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [gather, fc1, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [gather, fc1], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: 'Only for Pregather: copy stored bytes into route order using the effective flat, token-major
          or route-major policy, including copies left unused by the actual FC1.'
        decomposition:
          strategy: |-
            Flat takes precedence over token-major. Let C=9*H/256, Gg=max(1,min(ceil_div(T*C,128),gatherf_cap())) and Ncopy=ceil_div(T*C,128) for flat: unit u covers flattened token/chunk coordinates [128*u,128*(u+1)). Each chunk makes up to K copies.
            For token-major, Gg=max(1,min(T,gather_grid_cap())), Ncopy=Gg*floor(T/(2*Gg))+min(Gg,T%(2*Gg)); unit u uses tokens (u%Gg)+2*floor(u/Gg)*Gg and that token+Gg, masking the second past T. For route-major, Gg=min(ceil_div(Rcap,4),1184), Ncopy=ceil_div(Rv,4); unit u covers routes [4*u,min(4*u+4,Rv)).
            Flat and route-major use 128 threads. Token-major uses Nt=gather_threads(), default 64, clamped to [32,1024] and rounded down to a warp multiple. The effective flat cap defaults to 1184, token cap to 2368; both clamp to [1,65536]. InputBytes is respectively 128*16, 2*9*H/16 or 4*9*H/16; CopyBytes is respectively K*InputBytes, K*InputBytes or InputBytes. CopyMaps denotes the corresponding route_of entries, or four ptok entries for route-major.
          partition: {unit: {size: Ncopy, tile: 1}}
          worktile: {invariant: {Input_bytes: {shape: [{byte: InputBytes}], dtype: uint8}, CopyMaps: {shape: [{word: 128*K
                      if flat else 2*K if token_major else 4}], dtype: int32}}}
          target: {single_tile: {Gathered: {shape: [{byte: CopyBytes}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Gg}
        schedule: {worktile_order: [{by: unit, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: |-
          One expert tile and Bn1 paired channels over the full hidden reduction, then fused activation and QDQ; Xq/Xs entries denote original-token slices through Route for AMODE=0 or 1. The Route invariant is read only in those modes.
        decomposition:
          strategy: |-
            Bm=128 and Bk=256. Bind Bn1, STAGES, TMA, AMODE, SFS, SFPRE, BRLESS, SFCP and PIPE to the actual terminal f4_body template arguments after native map handling. SK=1 and FUSE=false; no partial-sum or last-arriver phase occurs. Bn1 is 64 or 128, STAGES is 2, 3 or 4, SFS is 1..STAGES, and SFPRE is 0, 1 or 2. Only source-instantiated combinations apply.
            k_gemm_f4 defaults to TMA=false, AMODE=0, SFS=STAGES, SFPRE=0 and BRLESS=SFCP=PIPE=false. k_gemm_f4_tma sets TMA=true; omitted arguments use those same defaults. In TMA instances, AMODE=0 gathers A by cp.async and uses TMA only for B; AMODE=1 uses un-clipped TMA gather4; AMODE=2 uses gathered-row A boxes. SFCP copies scales by cp.async; otherwise SFPRE selects direct scale staging or one/two prefetched register sets. PIPE occurs only with TMA=true, SFPRE=2 and SFCP=false.
            Explicit mono variants: cfg16=(64,3,0,2,1), cfg17 or 23=(64,2,0,2,1), cfg18=(128,3,0,3,1), cfg24=(64,2,1,2,1), cfg25=(64,3,0,1,1), cfg27=(64,2,2,2,1), cfg30=(64,3,2,2,1), cfg39=(64,2,2,2,2), cfg40=(64,2,0,2,2), where tuples mean (Bn1,STAGES,AMODE,SFS,SFPRE), with TMA=true and other flags false. cfg41 adds BRLESS to cfg27; cfg45 starts from cfg41 and uses SFPRE=0,SFCP=true. cfg48/49=(128,3/2,2,2,2) with BRLESS; cfg50/51=(64,2/3,2,2,2) with BRLESS and PIPE. Map fallback uses wrapper defaults, not these requested flags.
            For either GEMM let Nx be its output channel tile count. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. Both FC1 and FC2 use 128-thread CTAs, striding flattened work IDs with channel fastest. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              Xq: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              Xs: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Aq: {shape: [{row: Bm}, {packed_intermediate: Bn1/2}], dtype: uint8}, As: {shape: [
                  {row: Bm}, {intermediate_block: Bn1/G}], dtype: fp8_e4m3fn}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(I/Bn1)}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm=128, Bn2=128, Bk=256 and Grid from fc1. FC2-local STAGES=3, SFS=2 and Nk=I/Bk. The selected instance is k_gemm_f4_flat<128,3,2,NK1>, with NK1=(I=256). Both A and B TMA boxes have 128 rows, matching the expected (Bm+Bn2)*(Bk/2) bytes. No cp.async operand path or activation-parameter evaluation occurs in this FC2.
            Worktiles remain full intermediate reductions; flattening their stages does not create independently assigned reduction slices. Each CTA processes its static worktile sequence with one accumulator, three payload slots, two scale slots and three workitem metadata slots. Future operands may cross workitem boundaries; route writeback finishes its TMEM reads before the next workitem initializes that accumulator.
            Four cooperating warps stage and consume operands and read TMEM in 32-channel chunks, converting valid rows to BF16 with vector stores. There are no separate epilogue warps or bulk-store sink. Empty or surplus CTAs return before allocation. Attribute/launch rejection propagates; map refusal selects a different implementation outside this node.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1's four warps cooperate on copies, scale staging, ordered MMA and fused writeback, using one accumulator. Each workitem primes its own operands and finishes all TMEM reads before the next item. PIPE moves the previous-stage retirement wait after current MMA issue, allowing adjacent bursts in flight while still protecting overwritten slots; other variants retire the prior burst before refill and issue.
      FC1 has Nrow=2*Bn1, TCOLS1=2*Bn1+48*SFS, and TALLOC1=256 if TCOLS1<=256 else 512. Payload and scale slot indices use g for TMA and k for cp.async-only instances; TMA transaction parity and MMA completion counters persist between workitems. Register scale staging uses one set for SFPRE=1 or two sets indexed by local-stage parity for SFPRE=2; it is absent for SFPRE=0. Only the first Bn1 rows of each 128-row B-scale image are initialized/used; full images still transfer to TMEM.
      FC2 uses one cooperative four-warp loop and one accumulator. Its continuous domain g spans all Nk stages of each assigned worktile t, with k the local stage. Payload(g) uses g%STAGES and Scale(g) uses g%SFS; neither ring resets at workitem boundaries. TCOLS2=Bn2+32*SFS and TALLOC2=256. Three private metadata records plus one pending record keep future operands live while the previous workitem drains. STAGES and SFS in each phase refer to that phase's bound parameters. Gather instantiates only warp[0:Nt/32] from its listed member range.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: |-
                  Nt=128 for flat/route-major, otherwise the bound gather_threads value. Wait for actual preceding preparation and trigger admission. Flat/token-major return if Rv=0; route-major has an empty row loop.
                produce: |-
                  Flat assigns each lane one 16-byte input chunk and copies its vector to all active destinations. Token-major holds two route lists, loads the second token vector before the first, then interleaves their stores; payload precedes scales. Skip input loads for tokens without active routes. Route-major visits four valid rows in order, loading ptok and copying payload then scales in block-strided 16-byte vectors. Mask tails, leave spare capacity untouched, and reuse register vectors after store issue.
            pipe: {prologue: ['enter:Input'], steady: [{repeat: t, steady: ['produce:Gathered(t)']}]}
      fc1:
        domain: {t: worktile, k: [0, H/Bk], g: {flatten: [t, k]}, c: [0, Bn1/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {Payload(g): {slot_index: '(g if TMA else k)%STAGES'}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 3}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {Scale(g): {slot_index: '(g if TMA else k)%SFS'}}
          ScaleRegisters:
            space: register
            member_slot_shape: [{row: Bm+2*Bn1 if SFPRE else 0}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 2 if SFPRE>=2 else 1
            view: {ScaleRegisters(k): {slot_index: 'k%2 if SFPRE>=2 else 0'}}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC1}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, 2*Bn1]}}
              TScale(g): {part: {column: ['2*Bn1+48*((g if TMA else k)%SFS)', '2*Bn1+48*((g if TMA else k)%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: 64}], dtype: fp32, slot_count: 1}
          ScaleWord: {space: register, member_slot_shape: [{row: Bm}, {byte: 4}], dtype: uint8, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the actual predecessor grid, then warp 0 triggers successor admission. If J=0 return before allocation; otherwise initialize completion protocols, allocate Tensor and rendezvous. A surplus CTA with no assigned item still allocates and deallocates. Completion phase starts at zero and persists across items; PIPE uses two alternating cumulative-commit channels with persistent commit count.
                prime: |-
                  Resolve expert, row and channel bases and per-item activation constants. Each lane writes one Rows entry, clamping padding to the first valid row, then all rendezvous before gathered reads. Retain source-row/weight offsets throughout the item. Let nk=H/Bk and g0 be this item's first g for TMA, otherwise zero. All following future-stage operations stop at nk; none prefetches another workitem.
                  SFPRE=1 fetches and lands stages 0..min(SFS-2,nk-1) sequentially. SFPRE=2 batches those fetches into parity registers before landing them. With SFPRE=0, scales instead stage alongside each payload prime: cp.async for SFCP, ordinary loads/stores plus an async-proxy fence otherwise.
                  Issue payload stages 0..min(STAGES-2,nk-1), committing STAGES-1 cp.async groups even when empty. TMA uses two Bn1-row B boxes plus one Bm-row A box for AMODE=2, or 32 gather4 A boxes for AMODE=1; AMODE=0 copies A by 16-byte cp.async requests. Without TMA both A and permuted B use cp.async. TMA byte accounting covers B and only the A bytes copied by TMA. Finally prefetch scale stage SFS-1 for SFPRE=1, or stages SFS-1 and SFS for SFPRE=2, when present.
                base_refill: |-
                  Only when PIPE=false: for k>0 wait for cumulative MMA(k-1) completion and rendezvous, releasing all its shared operand reads. Land prefetched scales for k+SFS-1, or issue that stage's SFCP copies, if present. Then issue payload stage k+STAGES-1 if present and commit one cp.async group, including empty tail groups. At k=0 refill targets unused slots. Done covers copy issue and ordinary scale stores, not async transfer completion.
                advance: |-
                  With PIPE=false, every thread waits until at most STAGES-1 cp.async groups remain; with TMA, thread 0 also waits for current payload transaction bytes. PIPE needs only the TMA wait. Rendezvous publishes those bytes and the fenced scale stores. One elected warp-0 lane fences, copies all three scale images to TScale(g), issues four ascending 64-channel updates separately for up and gate, and commits cumulative completion. Only the first update of k=0 initializes Acc(t). The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it. Done means issue of the burst, not MMA completion.
                pipe_refill: |-
                  Only when PIPE=true: after current MMA issue, for k>0 wait for cumulative MMA(k-1) completion on its alternating channel and rendezvous. Land prefetched scales for k+SFS-1 and issue payload stage k+STAGES-1 when present. Their overwritten slots were last read by stage k-1; k=0 fills unused slots. Current MMA can remain in flight. Done covers store/copy issue only.
                prefetch: |-
                  SFCP does nothing here. SFPRE=2 fetches scale stage k+SFS+1 into its parity register set, whose old value has landed; SFPRE=1 fetches k+SFS into its single set. Without either, ordinary loads and fenced shared stores stage k+SFS-1 after current MMA issue. All targets are bounded by nk. These operations overlap current MMA but do not publish its completion.
                close: |-
                  Wait for the item's last cumulative MMA completion, update the persistent completion phase/counter, fence and rendezvous. All issued operand transfers have been consumed. TMA advances its continuous stage position by nk; cp.async-only slot indices restart at zero for the next item. No extra cp.async wait-all is inserted for the remaining empty groups.
                load: |-
                  Each warp owns 32 rows. Issue the paired 32-channel up/gate TMEM reads into Drain, then wait for both before using or overwriting those registers. All rows, including padding, are read.
                produce: |-
                  Apply activate to both 16-channel blocks, reusing the now-dead gate registers for Ap and normalized codes. Valid rows issue a 16-byte packed Aq store. Accumulate two scale bytes per chunk in ScaleWord, store the completed four-byte As word every second chunk, then clear it. Bn1 is a multiple of 64, so no partial scale word survives the item. Padding computes the same arithmetic without stores. Done covers conversion and store issue.
                release: |-
                  Rendezvous after all chunks' TMEM reads and stores issue, making Rows, operand storage and the single accumulator reusable for the next item. Global output stores may remain in flight; kernel completion publishes Aq/As to FC2.
                retire: |-
                  After the assigned sequence, warp 0 deallocates Tensor. No-op for the J=0 early return.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'prime:Operands(t)'
                - repeat: 'g[t]'
                  steady: ['base_refill:Operands(g)', 'advance:Stage(g)', 'pipe_refill:Operands(g)', 'prefetch:Scales(g)']
                - 'close:Acc(t)'
                - repeat: c
                  steady: ['load:Drain(t,c)', 'produce:Aq(t,c)']
                - 'release:Work(t)'
              epilogue: ['retire:Pipeline']
      fc2:
        domain: {t: worktile, k: [0, Nk], g: {flatten: [t, k]}}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {Payload(g): {slot_index: g%STAGES}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {Scale(g): {slot_index: g%SFS}}
          ScaleRegisters:
            space: register
            member_slot_shape: [{row: Bm+Bn2}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 1
          Metadata:
            space: register
            member_slot_shape: [{copy: Bm}, {word: 5}]
            dtype: uint32
            slot_count: 3
            view: {Metadata(t): {slot_index: t%3}}
          Pending: {space: register, member_slot_shape: [{copy: Bm}, {word: 5}], dtype: uint32, slot_count: 1}
          Cursor: {space: register, member_slot_shape: [{copy: Bm}, {index: 3}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC2}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(g): {part: {column: ['Bn2+32*(g%SFS)', 'Bn2+32*(g%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the FC1 grid and let warp 0 trigger successor admission. If J=0 or the CTA has no assigned work, return before allocation; all later actions are no-ops for this empty sequence. Otherwise initialize completion protocols, allocate Tensor and rendezvous. Payload transaction parity and the MMA completion phase persist across the entire stage stream.
                prime: |-
                  Resolve the first min(3,count(t)) workitems into Metadata slots. Each thread retains a five-word record: route base, valid-row count, output-channel base, weight-box expert coordinate and its own weight-scale byte offset. Cursor holds the next tile/channel coordinates and a pending-item index initialized to -1. NK1 resolves consecutive workitems by incrementing tile/channel coordinates according to the CTA's static stride; generic Nk resolves each requested work ID independently, permitting repeated resolves of the same item.
                  Fetch stage 0 scales into ScaleRegisters, land them in Scale(0) and fence shared writes. Issue payload boxes for stages 0 and 1 when they exist, then fetch stage 1 scales into the same registers when present. Every scale fetch clamps padded activation rows to the first valid route; payload boxes retain the dense padding defined in fc2. Each payload issue arms exactly (Bm+Bn2)*(Bk/2) transaction bytes.
                retire: |-
                  At g>0, the elected thread waits for the cumulative completion of stage g-1, advances the completion phase, and all four warps rendezvous. This releases the operand slots needed by refill and makes the prior accumulator updates complete. At g=0 no prior-stage wait or rendezvous is inserted.
                boundary: |-
                  Only when k=0 and g>0, drain Acc(t-1) using Metadata(t-1). Each warp owns 32 rows, reads one 32-channel chunk at a time and waits for its TMEM loads; valid rows convert to BF16 and issue 16-byte Rout stores, while padding is read and discarded. A CTA rendezvous after all chunks makes the single accumulator and the old metadata slot reusable. Done covers TMEM reads and store issue, not global store completion. Other stages do no boundary writeback.
                install: |-
                  If a pending item exists, copy Pending to its Metadata slot and clear the pending index. This happens after boundary writeback, whose previous-item metadata may occupy that same slot. Fields remain private to each thread; the weight-scale offset is thread-specific.
                refill: |-
                  Land the prefetched scales for g+1 in Scale(g+1) when present, fencing shared writes; then issue A/B payload boxes for g+2 when present. The preceding retire covers MMA(g-1), which has consumed the old contents of both overwritten slots; g=0 only fills previously unused slots. This action completes at issue of the payload transactions; they may remain in flight across a workitem boundary. ScaleRegisters is reusable once its prior values have landed.
                advance: |-
                  Wait for the current payload transaction bytes and rendezvous, publishing the current payload and fenced scale stores. One elected warp-0 lane fences, copies both scale images into TScale(g), issues four ascending 64-channel MMAs and commits cumulative completion. Only the first update of k=0 initializes Acc(t). The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it. Done means this burst has been issued, not that its MMA or operand reads have completed.
                prefetch: |-
                  Fetch g+2 scales into ScaleRegisters when that stage exists. Then let L be the workitem containing g+3, if it exists. If L%3 differs from the workitem containing g+1 modulo 3, resolve L into Pending and retain its index for the next install. These reads can overlap the current MMA. NK1 requests consecutive new items; the generic path can redundantly resolve a primed item and uses stateless work-ID lookup. No fetch or resolve passes the assigned sequence end.
                finish: |-
                  For a nonempty sequence, wait for the final cumulative MMA completion, fence and rendezvous. Drain the last Acc using its Metadata with the same chunked BF16 Rout stores as boundary; rendezvous after all TMEM reads and store issues, then warp 0 deallocates Tensor. Every issued payload and scale transfer was consumed; no speculative tail stages remain to drain. Kernel completion supplies Rout visibility to finalize. Empty sequences do none of these operations.
            pipe:
              prologue: ['enter:Pipeline', 'prime:Stream']
              steady:
              - repeat: g
                steady: ['retire:Stage(g)', 'boundary:Work(g)', 'install:Metadata(g)', 'refill:Operands(g)', 'advance:Stage(g)', 'prefetch:Future(g)']
              epilogue: ['finish:Stream']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including its route stores, then trigger admission.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.Main', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind result reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect shared-slot reuse and each phase's single accumulator.
  - item: design.tile_pipeline::fc1.Main
    choice: |-
      Use the source's 128-byte-swizzled payload and matching scale-copy images. TMA maps undo the prepared weight permutation; AMODE=1 uses gather4 and AMODE=2 uses gathered-row maps. AMODE=0 and the cp.async-only wrapper gather original token rows explicitly. Bind current-stage readiness to cp.async group waits when used, transaction-counted TMA completion when used, and async-proxy fences plus CTA rendezvous for ordinary scale stores.
    reason: The mixed-copy variants must join all transfers actually feeding the current MMA, while map fallback preserves the prepared operand interpretation.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Encode the FC2 UINT8 maps with a 128-row A box and 128-row prepared-weight B box, retaining the prepared-row permutation and 128-byte-swizzled shared payload. Bind payload readiness to transaction-counted TMA completion, and shared scale publication to the async-proxy fence and CTA rendezvous.
    reason: Payloads and scale images must describe the same logical operands before each MMA burst.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1's permitted mono map-refusal fallback chooses cp.async wrapper defaults (wide -> cfg8, narrow -> cfg10); source refusal classes still return their error. Flat FC2 is selected only after its operand maps encode and uses no drain map. No rejected attribute or submission creates a fallback; errors detected by the source propagate. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced threshold is not converted to large preparation. Scratch and process-global graph/map caches have no added lock or cross-stream completion protocol.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather than implicitly rebuilt.
