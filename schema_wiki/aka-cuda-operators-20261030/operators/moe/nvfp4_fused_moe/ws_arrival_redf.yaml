"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "ws_arrival_redf"
    "parent": "ws_split_redf"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or
      the cached ABI reused by its host fast path; use choices baked into a replayed graph.
      Select exactly when a.zflag=0, actual FC1 is f4_body_ws with GEMM1=true and
      FUSE=true (a.cfg=88), and actual FC2 is f4_body with GEMM1=false and REDF=true
      (a.cfg2 in {46,47}). Map refusal or rejected submission propagates an error;
      this launch pair has no fallback. Parent is only the copying origin and its
      condition is not conjoined. In-place changes do not rebuild cached configuration.
      Let S be a.small_thresh when positive, otherwise native small_threshold();
      for graph replay use the preparation choice baked into the graph. Rcap=T*K.
design:
  math_reshape:
    thesis: |-
      Compact routes by expert and split FC1 into two hidden-reduction slices. Retain FP32 partials and sum them in slice order, then apply folded activation and guarded quantization only to valid routes. FC1 itself completes this group reduction, removing the separate activation pass while retaining partial traffic. FC2 weights BF16-rounded routes directly into a cleared FP32 token accumulator.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation policy is bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per FC1 slice worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        SK: {meaning: Number of equal hidden-reduction slices, binding: 'bind:design.work_schedule::SK'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok drives direct FC1 gather4
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: fc1
      name: Independent paired projection slices
      math: |
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        Decode weights as in Contract's Decode the stored operands; W1/W2 are those values
        without decoded tensor materialization. FC1 uses clipped direct gather4, with no
        Xq/Xs allocation or pre-gather pass. For m<v, payload and scales use hidden token
        Route[b+m,0]. Payload fetches extend through row 4*ceil_div(v,4), repeating the
        first valid token in the last partial group. Other payload rows and all scales
        for m>=v retain unspecified local bytes. All Bm rows are evaluated; padded
        accumulators are discarded without partial stores or activation.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. For slice l=0..SK-1, let h0=l*H/SK.
        D1(-1)=0; D1(s)=mma32(Xtile[:,h0+64*s:h0+64*(s+1)],
          Wpair[:,h0+64*s:h0+64*(s+1)]^T,D1(s-1)), s=0..H/(64*SK)-1.
        For m<v, let last=H/(64*SK)-1 and write Part[l,b+m,n:n+Bn1]=D1(last)[m,:Bn1]
        and Part[l,b+m,I+n:I+n+Bn1]=D1(last)[m,Bn1:].
        Part[:,Rv:Rcap,:] is neither initialized nor overwritten by FC1. Each group's
        partials have no further consumers after its activation; their bytes are not cleared.
      symbol:
        D1: {meaning: One slice's paired projection accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,n1,l); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw FP32 slice partials retained until this tile/channel group is reduced within FC1, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage; the first update of each slice disables the previous accumulator. Native internal product/reduction rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Ordered slice sum with folded activation and guarded quantization
      math: |
        For each valid row r=b+m, m<v, and channel i in [n,n+Bn1), after all SK
        partial slices of this (j,n1) group are available, initialize Sum1(-1)=(0,0)
        and Sum1(l)=add32(Sum1(l-1),(Part[l,r,i],Part[l,r,I+i])), l=0..SK-1.
        Let (up,gate)=Sum1(SK-1) and use expert e from Tile[j]. Apply Contract's
        asymmetric clamp. Rows r>=Rv are neither visited nor stored by activation.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), and Sg(x,k)=rcp_approx(1+ex2_approx_ftz(x*k)).
        For activation_type=3, ksw=fp32(a*L2E), kgu=kuu=ksw,
        and Ap=(gate*Sg(gate,ksw))*(up+bpar).
        For activation_type=10, ksw=L2E, kgu=fp32(ia*fp32(2*L2E)),
        kuu=fp32(ib*fp32(2*L2E)), tg=a*fma32(Sg(gate,kgu),2,-1),
        tu=bpar*fma32(Sg(up,kuu),2,-1), and Ap=(tg*Sg(gate,ksw))*tu.
        Parenthesized FP32 operations retain their shown order. Every slice work item
        evaluates ia/ib and these constants, including non-last slices; ia/ib are unused
        for SwiGLU and ib may be infinite.
        For each valid row and G-channel block, start amax=0 and successively update
        amax=fmax(amax,fmax(abs(Ap[2*q]),abs(Ap[2*q+1]))), q=0..7 in block-local indices.
        Use fmax semantics, ignoring a NaN operand when the other is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)). If fp32(s8)>0, set inv=rcp_rn(fp32(s8))
        and q[i]=Q4(Ap[i]*inv), using Contract's RNE saturating E2M1 rule. Otherwise
        set all payload codes to zero without reciprocal or normalization evaluation.
        Store low-even-nibble packed q and s8 for this block. Aq/As rows [Rv,Rcap)
        retain prior bytes; decoded activation operands are d(q)*s8.
      symbol:
        Sum1: {meaning: Ordered FP32 up and gate slice sum, shape: [{pair: 2}], dtype: fp32,
          retention: 'carry_forward (r,i); l=-1..SK-1'}
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          Sg uses ex2.approx.ftz.f32 and rcp.approx.f32; folded prescales, the sigmoid identity for tanh, and multiply-by-rounded-reciprocal normalization replace the reference evaluation. unknown: no verified bound for the composed error over this entire path is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Project and atomically combine BF16-rounded routes
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. TMA reads Aq row b+m,
        including rows from later experts or unwritten capacity; payload beyond the Rcap-row
        byte matrix is zero-filled. Let QTile decode these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For each m<v, let (t,k,e)=Route[b+m,:] and
        C[b+m,n:n+Bn2]=fp32(fp32(bf16(D2(I/64-1)[m,:]))*route_weights[t,k]).
        BF16 rounding precedes weighting; C is consumed immediately without a route tensor store.
        Padded rows are read from D2 and discarded. FC2 evaluates the per-item activation
        parameters and reciprocals without using them, plus the unused folded constants
        (a*L2E,a*L2E,a*L2E) for SwiGLU or (L2E,ia*(2*L2E),ib*(2*L2E)) for SiTU.
        Acc32(-1)=zeros([T,H]) each invocation. Let pi enumerate all Rv*H scalar updates
        ((t,k),h) for (t,k) in V, preserving each output element's actual atomic order.
        For u=0..Rv*H-1, with ((t,k),h)=pi[u], update
        Acc32(u)[t,h]=add_native32(Acc32(u-1)[t,h],C[route_of[t,k],h]);
        all other elements keep their preceding value. Vector components need not share
        a route order. The allocated BF16 rout scratch is neither written nor read.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        C: {meaning: Logical weighted route contributions consumed immediately without materialization, shape: [{route: Rcap}, {hidden: H}], dtype: fp32}
        Acc32: {meaning: Token output sum retained through conversion, shape: [{token: T}, {hidden: H}], dtype: fp32,
          retention: 'carry_forward invocation; u=-1..Rv*H-1'}
      arithmetic:
        accumulate: |-
          D2 uses native block-scaled arithmetic and ascending updates across its full reduction. add_native32 is component-wise red.global.add.v4.f32 with its native global FP32 reduction semantics. The FP32 product is rounded separately from addition; atomic arrival order is not fixed.
    - step: convert
      name: Round the completed token accumulator
      math: |
        After the zero initialization and all FC2 updates, Y[t,h]=bf16(Acc32(Rv*H-1)[t,h]).
        Overwrite every element of the supplied output view and return [output].
        Empty routing has no projection or activation work; initialized Acc32(-1) produces
        all-zero Y. Acc32 is not self-cleared after conversion.
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: '16*Rv*I baseline bytes -> 8*SK*Rv*I valid partial bytes plus 9*Rv*I/16 written payload/scale bytes; reserved partial and act capacity is 8*SK*Rcap*I + 2*Rcap*I bytes', by: [fc1, activate]}
      - {item: Route reduction storage, change: '2*Rv*H live BF16 route bytes -> 4*T*H FP32 token bytes; host still reserves the unused 2*Rcap*H-byte rout buffer, so reserved capacity increases by 4*T*H bytes', by: [fc2, convert]}
      traffic:
      - {item: Split partial handoff, change: '8*Rv*I baseline projection-result bytes written and read each -> 8*SK*Rv*I written and read each; only the completed group reads its partials, within FC1', by: [fc1, activate]}
      - {item: Route reduction traffic, change: 'Remove 4*Rv*H BF16 route write/read bytes; add 8*T*H zero/write-and-convert/read bytes and Rv*H FP32 atomic read-modify-writes, excluding unchanged output stores and without a DRAM traffic claim', by: [fc2, convert]}
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I activation/quantization elements retained, plus 2*SK*Rv*I FP32 slice additions; no capacity-tail activation', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: Affects Rv*I evaluations through the explicitly defined approximations; no established full-domain output
          error bound
        by: [activate]
      - {item: Split reduction ordering, change: 'Each FC1 output channel uses SK independently initialized native reduction chains and an ascending FP32 slice sum; no bitwise equivalence to the unsplit chain is promised', by: [fc1, activate]}
      - {item: Route sum ordering, change: 'Rv*H contributions use separately rounded FP32 products and native atomic addition in unspecified per-element order; no established full-domain output error bound', by: [fc2]}
  work_schedule:
    thesis: |-
      Prepare compact routes, then submit WS last-arriver FC1, monolithic REDF FC2 and convert. Each FC1 worktile owns one hidden slice; the last completed slice of each tile/channel group also reduces all partials and produces Aq/As. This removes the separate activation launch at the cost of a per-group epilogue tail and arrival protocol.
      Let Small mean Rcap<=S with S defined in when. Only prepare is submitted for Small; only count/scan/scatter otherwise. The main stream chain is prepare -> fc1 -> fc2 -> convert, or counts/fill/cnt memset -> count -> scan -> scatter -> fc1 -> fc2 -> convert. Absent phases introduce no event. Routing handoffs from count/scan/scatter apply only to the large chain; Prepared carries the same arrays in the small chain. Every consumer waits for its actual predecessor grid before reading. No pre-gather or in-grid routing preparation occurs.
      The host appends CntCap=Jcap*I/Bn1 int32 arrival counters to the counts/fill allocation. Small preparation clears all counters; the large-path memset clears them together with counts/fill. Each (j,n1) has one counter initially zero, incremented once by each slice worktile after its partial stores are published. The old value SK-1 selects the sole reducer; non-last worktiles continue without waiting for other slices. Active counters end at SK, unused capacity stays zero, and counters are not self-reset. Their next reset is the next invocation's preparation. This adds 4*CntCap reserved bytes and SK*J*I/Bn1 counter increments per invocation.
      Before preparation, record ze0 on invocation stream s. A persistent nonblocking side stream zs waits for ze0, clears all 4*T*H Acc32 bytes and records ze1. After submitting FC1, s waits for ze1 immediately before FC2 submission. The clear may overlap preparation/FC1 and must finish before any FC2 atomic update, including on empty routing. Under graph capture the same fork/join is captured; these events do not synchronize unrelated invocation streams.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise the stream serializes kernels and in-kernel grid dependency controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [convert], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Aq: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        As: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Acc32: {producer: fc2, consumer: [convert], storage: global, initialize: 0, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, fc2], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [fc1, fc2], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts, E fill words and CntCap arrival counters before this kernel.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc1:
        describe: |-
          One expert tile, one hidden slice and Bn1 paired channels, producing raw FP32 partials. The last arriving worktile for each (j,n1) additionally sums the slices, clamps, activates and quantizes valid rows. Hidden operands are original-token views through Route; local MMA stages cover H/SK channels.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256, SK=2. cfg88 uses STAGES=3, SFS=2, EPI=4, AMODE=3 (clipped direct gather4), BRLESS=DEEP=SFCH=FUSE=true, SFPF=2; SELFPREP=PP=CPHOIST=EARLYDONE=TSTORE=EPITB=NPAIR=false and NIPRE=PFTMA=MBH=0. H/(Bk*SK) is integral in the shared domain.
            Part is global scratch, addressed by slice, compact route and channel. After the counter elects the reducer, it traverses Bn1/G blocks; for each block it reads both halves from all SK slabs in ascending order, then produces Aq/As. This group-local merge is part of the FC1 worktile's epilogue, not an independently assigned phase. Other groups need not be complete.
            Let Nx=SK*I/Bn1 for FC1 and H/Bn2 for FC2. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 CTAs have 224 threads; FC2 CTAs have 128. Both stride flattened work IDs with channel fastest. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              hidden_states: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              Part: {shape: [{row: Bm}, {channel: G}, {pair: 2}], dtype: fp32, direction: ascending}
          target:
            single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}
            tile_reduction: {dimension: slice, input: Part, output: [Aq, As], method: 'design.math_reshape::activate'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the full intermediate reduction, then BF16 rounding,
          weighting and atomic accumulation into the corresponding token rows.
        decomposition:
          strategy: |-
            Use Bm=Bn2=128, Bk=256 and Grid from fc1. FC2-local parameters are STAGES=SFS=3, TMA=REDF=true, AMODE=0, SK=1, FUSE=BRLESS=PIPE=false. cfg46 uses SFCP=true and SFPRE=0; cfg47 uses SFCP=false and SFPRE=1. Both encode a 128-row A box and a 128-row B box, matching the 32768-byte stage transaction count. A map refusal returns 732, with no cp.async or rout-writing fallback; attribute/launch failures propagate.
            The same four warps stage operands, issue the full reduction and drain TMEM in 32-channel chunks. For every valid row, use its ptok/pslot to fetch the routing weight once per worktile; BF16-round and weight each chunk, then atomically merge into global Acc32. The side-stream clear and join in flow establish its zero initial state. Overlapping expert tiles merge at the addressed token/channel elements, without a slot-order reduction kernel. There are no separate epilogue warps, ping-pong accumulators or bulk-store sink.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 2}], dtype: int32}
              route_weights: {shape: [{route: Bm}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {C: {shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32}}
            tile_reduction: {dimension: tile, input: C, output: Acc32, method: 'design.math_reshape::fc2'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      convert:
        describe: Read the completed token accumulator and overwrite the caller view with BF16 results.
        decomposition:
          strategy: |-
            Flatten (token,hidden) with hidden fastest. Each 128-thread CTA covers 1024 elements; each lane converts eight adjacent elements. H is divisible by 1024 in the shared domain, so every submitted worktile is full.
          partition: {element: {size: T*H, tile: 1024}}
          worktile:
            invariant: {Acc32: {shape: [{element: 1024}], dtype: fp32}}
          target: {single_tile: {Y: {shape: [{element: 1024}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(T*H,1024)'}
        schedule:
          worktile_order: [{by: element, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1 assigns warp 0 to activation scales, warp 1 to payload and weight scales, warp 2 to ordered MMA, and EPI independent epilogue warps to TMEM drain. Its continuous payload/scale rings and all-epilogue accumulator release permit producer and epilogue overlap.
      For FC1 only, Nk1=H/(Bk*SK), Nrow=2*Bn1, AccCols=Nrow, NSFB=2, TCOLS=AccCols+16*SFS*(1+NSFB), TALLOC=256. Dpayload=STAGES, Chunks=Bn1/32=2, DrainWidth=64. For worktile t with slice l, local stage k reads global reduction stage l*Nk1+k; flattened g advances across the CTA's assigned work sequence without resetting rings.
      FC1 epilogue quadrant=warp_id%4. Four warps drain paired 32-channel chunks, issue partial stores and release the single accumulator before their arrival/reduction tail. The next item's MMA may overlap that tail; its epilogue must still follow the preceding tail. The ticket flag is shared only among the epilogue warps.
      FC2 uses one cooperative four-warp loop and one accumulator. Nk=I/Bk and TALLOC2=256, covering Bn2+32*SFS columns. Payload and scale slots use (t*Nk+k)%3; transaction and MMA completion parity continue across worktiles. All real copies and MMA reads finish before TMEM drain; global atomic updates can remain in flight after the worktile closes. No FC1 epilogue parameter applies to FC2.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched. All 1024 threads also clear cnt in steps of 1024 before publishing the preparation; FC1 waits for this kernel, including these resets.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill/cnt memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      fc1:
        domain: {t: worktile, k: [0, Nk1], g: {flatten: [t, k]}, c: [0, Chunks], b: [0, Bn1/G]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, AccCols]}}
              TScale(g): {part: {column: [AccCols+16*(1+NSFB)*(g%SFS), AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
          Arrival: {space: SMEM, member_slot_shape: [], dtype: int32, slot_count: 1}
          Sums: {space: register, member_slot_shape: [{row: Bm}, {channel: G}, {pair: 2}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{row: Bm}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles wait for predecessor grid completion. Warp 0 triggers successor admission. If J=0 all return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and publish setup with one CTA rendezvous. Surplus CTAs still initialize and retire. The continuous stage counter never resets between worktiles.
                prime: |-
                  Resolve tile/expert/route bases and slice stage offset. Follow ptok into input scales, but skip register loads and shared writes for padded rows, retaining old slot bytes. Read local stages 0 and 1 when present into two register sets before the stage loop.
                produce: |-
                  After scale-ring reuse, write the current registers into AScale(g), fence shared writes, then load k+1 into the alternate register set when present. The primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish this readiness contribution. No load passes the worktile end.
                retire: Join the final CTA rendezvous after every role's assigned sequence; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue nbox=ceil_div(v,4) A gather4 boxes at the slice-offset stage. The last box's padded rows repeat the first valid token; unissued rows keep old slot bytes. Resolve ptok for all 128 rows, using the first valid route for padding, even when some boxes are not issued. Issue two Bn1-row B boxes. Completion covers 128*(4*nbox+Nrow) payload bytes.
                stage: |-
                  Wait for the scale slot after payload issue. Issue weight-scale cp.async copies and 32 completion arrivals. SFCH groups copies into contiguous source spans. Each of the two B-scale images allocates 128 rows but writes/uses only 64; remaining bytes are uninitialized, although full images are copied to TMEM. SFCH/SFPF hints weight scales k+SFPF only within this slice. Full-stage readiness joins completed TMA bytes, completed weight-scale copies and the activation-scale release arrival, including when some A rows are skipped.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'],
                'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: |-
                    For t>0, wait for all four epilogue arrivals releasing the previous worktile's accumulator. The first worktile has no such wait. Done means the single accumulator is reusable; stage readiness is awaited by compute.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale. One elected lane issues four ascending 64-channel updates, each with separate up/gate MMAs. The first update of each slice initializes Acc. Cumulative stage completion covers preceding scale copies and all MMA input reads, releasing shared slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data:
                compute:Stage(g): ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']
              reuse: {'begin:Acc(t+1)@done': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  At the worktile start, evaluate expert parameters, reciprocals and folded constants even for non-last slices, then wait for Acc(t). Each warp owns 32 rows in quadrant warp_id%4; each lane owns one row. Each chunk loads its up/gate quadrant into private Drain and waits for both TMEM reads, including padded rows.
                produce: |-
                  Valid rows issue eight float4 stores per up/gate half into Part at this slice's slab and route row. Padded rows issue no stores. Done covers store issue, not peer visibility.
                release: |-
                  After both chunks' TMEM reads and partial-store issues, each warp independently rendezvouses and contributes one release arrival. MMA waits for all four arrivals before reusing Acc. No inter-warp wait occurs in release; each warp proceeds to its own fence in arrive. This release does not publish Part to other CTAs.
                arrive: |-
                  Every epilogue lane executes __threadfence after its partial stores, then the four epilogue warps rendezvous with bar.sync 1,128. Quadrant 0 lane 0 atomically increments cnt[j*I/Bn1+n1], writes Arrival=(old==SK-1), and executes the source's second __threadfence. A second bar.sync 1,128 broadcasts Arrival before any peer-slice read. This is the source's last-arriver publication sequence; producer/MMA warps never join these barriers or poll cnt. Non-last worktiles do not wait for peers. The first rendezvous on the next item also prevents overwriting Arrival before all epilogue warps finish this item's tail.
                reduce: |-
                  Only if Arrival is true and the lane's row is valid, initialize its 16 up/gate Sums to zero, load paired float4 values from each SK slab in ascending order, and accumulate. All other lanes perform no reads or arithmetic. Sums are private to each lane and retained through this block's quantization.
                quantize: |-
                  Under the same predicate, apply math_reshape.activate, retaining the 16 values in Activated through the serial amax fold and guarded normalization. Store eight packed payload bytes and one scale byte for this G-channel block. Each lane reuses Sums/Activated only after its block stores are issued. Part is no longer read once all blocks finish and is not cleared. Aq/As become visible to FC2 at FC1 grid completion, including every last-arriver tail; accumulator release alone does not publish them.
            pipe:
              repeat: t
              steady:
                - {repeat: c, steady: ['load:Drain(t,c)', 'produce:Part(t,c)']}
                - 'release:Acc(t)'
                - 'arrive:Arrival(t)'
                - {repeat: b, steady: ['reduce:Sums(t,b)', 'quantize:Aq_As(t,b)']}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      fc2:
        domain: {t: worktile, k: [0, Nk], c: [0, Bn2/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {'Payload(t,k)': {slot_index: '(t*Nk+k)%STAGES'}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {'Scale(t,k)': {slot_index: '(t*Nk+k)%SFS'}}
          ScaleRegisters:
            space: register
            member_slot_shape: [{row: 'Bm+Bn2 if SFPRE>0 else 0'}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 1
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC2}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(t,k): {part: {column: ['Bn2+32*((t*Nk+k)%SFS)', 'Bn2+32*((t*Nk+k)%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
          RouteToken: {space: register, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          RouteWeight: {space: register, member_slot_shape: [{row: Bm}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  The stream join has made Acc32 initialization complete. Wait for the complete FC1 grid, including all last-arriver activation stores, and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor and rendezvous. Surplus CTAs with no assigned work still allocate and retire. Initialize counters once per CTA, not once per worktile.
                begin: |-
                  Resolve expert, channel and route bases; form Rows with padded entries repeating the first valid route, then rendezvous. Evaluate the unused activation parameters/reciprocals/constants specified in fc2. Keep row and weight addresses through the worktile.
                prime: |-
                  cfg47 sequentially fetches and lands scale stages 0 and 1 when present through one ScaleRegisters set, then prefetches stage 2 after payload priming. cfg46 copies scales asynchronously in the same groups as payload priming and has no scale-register prefetch.
                  Prime two payload groups, issuing only stages below Nk but committing empty cp.async groups for short loops. Each stage issues the two 128-row TMA payload boxes and arms 32768 bytes. All scale and payload targets are bounded by Nk; row padding uses Rows for scales and contiguous rows for TMA payload.
                advance: |-
                  At k>0 wait for MMA(k-1) completion and rendezvous, freeing shared slots for refill. For stage k+2 when present, cfg46 issues scale cp.async copies and cfg47 lands its prefetched scales; issue that stage's payload TMA boxes. Commit a cp.async group even when empty. Wait until at most two groups remain, wait for the current payload transaction and rendezvous so all current operands are readable.
                  One elected warp-0 lane fences shared writes to the async proxy, copies both current scale images to TScale, issues four ascending 64-channel MMAs and commits cumulative completion. The first update initializes Acc. Ordered scale-copy/MMA reads preserve TMEM scales until consumed. cfg47 then fetches stage k+3 when present into the single register set, after its old values have landed. Done covers these waits, refills and instruction issues; the current MMA may still be in flight.
                drain: |-
                  Wait for the last cumulative MMA commit, fence and rendezvous before reading Acc. Carry completion parity across worktiles. All real payload/scale copies have been consumed; only empty cp.async groups may remain. Load ptok and the score addressed by ptok/pslot once for each valid route, retaining RouteToken and RouteWeight through all channel chunks. Padded rows use zero metadata and issue no metadata reads.
                produce: |-
                  Each warp owns 32 route rows. Read the current 32-channel chunk from TMEM and wait for its reads, including padded rows. Valid rows round to BF16, widen, multiply by RouteWeight, and issue eight four-component FP32 atomic reductions into Acc32[RouteToken]. Padded rows are discarded. Done covers arithmetic and atomic issue, not completion of the global additions.
                close: |-
                  Rendezvous after all four warps finish their TMEM reads and atomic issues. Rows, Drain, route metadata and the single Acc can then be reused; global atomic updates may still be outstanding. This rendezvous does not publish the token sums.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. FC2 grid completion supplies visibility of all atomic updates to convert; the J=0 path leaves the cleared token buffer intact.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: k, steady: ['advance:Stage(t,k)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:C(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      convert:
        resource: {Values: {space: register, member_slot_shape: [{element: 1024}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including all atomic additions, then trigger admission.
                produce: |-
                  Each lane loads eight adjacent Acc32 values as two float4 vectors, converts four pairs to BF16 and stores one 16-byte output vector. The source grid-stride loop visits one vector per lane for this launch size. No route metadata, routing weight or previous output is read; Acc32 is retained until the next invocation's explicit clear.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and each projection's single accumulator.
  - item: design.tile_pipeline::fc1.Payload
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight row permutation, with matching scale images. FC1's AMODE=3 uses the direct-token gather4 map. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Use UINT8 TMA operand maps with the prepared-row permutation and 128-byte-swizzled shared payload. Bind payload readiness to transaction completion and scale readiness to cp.async commit/wait for cfg46 or fenced register-to-shared writes for cfg47.
    reason: Both operand paths must reach the same logical scale/payload pairing before the ordered MMA consumes them.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1's WS configurations return 733 on operand-map refusal; FC2 uses no drain map. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. Attribute/launch errors propagate to Model.forward. The REDF side stream and DisableTiming events persist process-wide; normal capture rejoins before EndCapture. Scratch, events and graph/map caches have no added lock or general cross-stream completion protocol; this extraction supplies none.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
