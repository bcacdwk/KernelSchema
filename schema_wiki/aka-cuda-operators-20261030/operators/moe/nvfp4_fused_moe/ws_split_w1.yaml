"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "ws_split_w1"
    "parent": "ws_fused_w1"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or
      the cached ABI reused by its host fast path; use the launch choices baked into
      a replayed graph. Select exactly when a.zflag=0, the actual FC1 is f4_body_ws
      with GEMM1=true, SK>1, FUSE=false and SELFPREP=false, and the actual FC2 is
      f4_body_w1 with GEMM1=false. FC1 cfg is in {58,59,64,75,78,79,95,98,99};
      FC2 is cfg36 with successfully encoded operand maps. Its map-refusal fallback
      runs f4_body and is outside this node. Attribute or launch rejection does not
      acquire a replacement kernel. Parent is only the copying origin; this condition
      applies independently over the shared Contract. In-place tensor changes do not
      rebuild cached configuration or probe eligibility.
      Let S be a.small_thresh when positive, otherwise native small_threshold(); for
      graph replay use the preparation choice baked into the graph. Rcap=T*K.
design:
  math_reshape:
    thesis: |-
      Compact routes by expert and split each paired FC1 projection into contiguous hidden-channel slices. Materialize FP32 partials, sum them in fixed slice order, then apply approximate activation and packed quantization for FC2; shorter independent reductions cost a partial slab, another kernel and changed rounding.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation and gather policies are bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per paired FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        SK: {meaning: Independent contiguous FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok supplies gather and pexp supplies independent activation
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate stored activation bytes into compact route order
      math: |
        When pre-gather is selected, for (t,k) in V and r=route_of[t,k], Xq[r,:]=hidden_states[t,:]
        and Xs[r,:]=hidden_states_scale[t,:], with no conversion.
        Flat and token-major gather load each active token's bytes once for all its routes;
        route-major gather loads them once per active route. With direct gather4 there
        is no Xq/Xs allocation or pre-gather operation; FC1 reads the original tensors via Route.
        Let Tv=count({t | exists k: (t,k) in V}). Rows [Rv,Rcap) are not initialized or cleared.
        Decode weights exactly as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
      symbol:
        Xq: {meaning: Gathered activation payload, shape: [{route: Rcap}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value
            invocation}
        Xs: {meaning: Gathered activation scales, shape: [{route: Rcap}, {hidden_block: H/G}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
    - step: fc1
      name: Split paired projection and materialize raw partials
      math: |
        For j<J, slice l=0..SK-1 and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), n=n1*Bn1 and C=H/SK. Evaluate all Bm rows.
        With pre-gather, payload row m uses Xq[b+m]; scales use Xs[b+m] for m<v
        and Xs[b] otherwise. Payload may cross experts or unwritten capacity;
        outside the Rcap-row matrix the payload is zero-filled.
        Direct gather4 uses hidden token Route[b+m,0] for m<v. AMODE=1 repeats
        token Route[b,0] for both padded payload and scales. AMODE=3 fetches
        4*ceil_div(v,4) payload rows, repeating that token in the last partial group;
        other padded payload and all padded scale values retain unspecified prior
        local bytes. These extra rows are still evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. D1(-1)=0;
        D1(s)=mma32(Xtile[:,l*C+64*s:l*C+64*(s+1)],
                   Wpair[:,l*C+64*s:l*C+64*(s+1)]^T,D1(s-1)), s=0..C/64-1.
        For m<v, Part[l,b+m,n:n+Bn1]=D1(C/64-1)[m,:Bn1] and
        Part[l,b+m,I+n:I+n+Bn1]=D1(C/64-1)[m,Bn1:].
        Part[:,Rv:Rcap,:] remains unwritten and is not initialized on allocation.
        Each FC1 workitem also evaluates per-expert reciprocals and folded constants:
        alpha=gemm1_alpha[e], beta=gemm1_beta[e], ia=rcp_rn(alpha), ib=rcp_rn(beta),
        L2E=fp32(-1.44269504);
        for type 3, alpha*L2E; for type 10, ia*(2*L2E), ib*(2*L2E).
        It reads the optional clamp limit but uses none of these in the partial stores.
      symbol:
        D1: {meaning: Paired slice accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,l,n1); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw up and gate partials consumed by independent reduction, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32,
          retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator. Four ascending 64-channel updates form each 256-channel stage; the first update of each slice disables the previous accumulator. Native internal rounding and the separate slice sum do not promise bitwise equality with an unsplit or decoded-FP32 GEMM.
    - step: reduce
      name: Sum partials in slice order over capacity rows
      math: |
        Inspect every capacity row r<Rcap. Let Arows={r | 0<=r<Rcap and 0<=Route[r,2]<E} and Nr=count(Arows).
        For r in Arows, U(-1)=0 and U(l)=fp32(U(l-1)+Part[l,r,:]), l=0..SK-1.
        Set up=U(SK-1)[:I], gate=U(SK-1)[I:], e=Route[r,2].
        All r<Rv are in Arows. Spare rows use the unchanged, unspecified pexp and Part bytes;
        a stale in-range expert permits their reduction and activation. Other rows are skipped.
        ACTV2 loads all slices before the expert check; its off form checks first and reads
        one slice at a time. Both perform the same ascending sum, starting with addition to zero.
      symbol:
        U: {meaning: Running sum of paired partials for one capacity row, shape: [{channel: 2*I}], dtype: fp32,
          retention: 'carry_forward (r); l=-1..SK-1'}
    - step: activate
      name: Non-folded activation and branchless packed quantization
      math: |
        For each r in Arows, apply Contract's asymmetric clamp to up and gate.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        F(x)=rcp_approx(1+ex2_approx_ftz(x*fp32(-1.44269504))),
        and Q(x)=fma32(F(fp32(x+x)),2,-1).
        For activation_type=3, Ap=(gate*F(gate*a))*(up+bpar).
        For activation_type=10, tg=a*Q(gate*ia), tu=bpar*Q(up*ib),
        and Ap=(tg*F(gate))*tu. Parenthesized FP32 operations retain this order;
        the activation prescales are not folded. ia and ib are evaluated even for
        SwiGLU, where unused ib may be infinite.
        For each G-channel block, split its values into four consecutive quarters.
        Each quarter takes fmax(fmax(abs(x0),abs(x1)),fmax(abs(x2),abs(x3))).
        Combine neighboring quarters (0,1) and (2,3), then both halves to obtain amax,
        using fmax semantics, including ignoring a NaN operand when the other is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))).
        q[i]=Q4(Ap[i]*inv), with Contract's RNE saturating E2M1 codes and low-even-nibble packing.
        Multiplication is evaluated also when s8=0; there is no guarded division.
        Store the block's packed q in Aq[r,:] and scale in As[r,:]. Rows outside Arows
        retain prior bytes; stores can include spare capacity rows. FC2 consumes only
        valid rows for retained results. Decode as d(q)*s8, so zero scale need not have zero payload.
      symbol:
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32. The sigmoid identity for tanh and multiplication by rounded reciprocals replace the reference evaluation. unknown: no verified bound for the composed full-domain output error is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. Aq uses row b+m,
        with the capacity and zero-fill behavior defined for pre-gather in fc1.
        Let QTile decode these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item alpha/beta reciprocals and reads the optional clamp limit, but uses
        none of them; it does not form FC1's folded activation constants.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        After completing fc2, including J=0, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection or gather payload work; the independent reduction/activation still scans capacity rows and may process stale scratch. Finalize nevertheless overwrites Y with zeros because every route_of is negative.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: 16*Rv*I bytes of baseline FP32 intermediates -> 8*SK*Rv*I valid partial bytes plus 9*Nr*I/16 written activation bytes; physical allocations total 8*SK*Rcap*I+2*Rcap*I bytes, by: [fc1, activate]}
      - {item: Route gather, change: 'With pre-gather, 0 -> 9*Rv*H/16 written bytes and 9*Rcap*H/16 capacity; direct
          gather4 omits this materialization', by: [gather]}
      traffic:
      - {item: Partial materialization, change: '8*Rv*I-byte unsplit up/gate buffer written and read -> 8*SK*Rv*I partial bytes written plus 8*SK*Nr*I read with ACTV2 off; ACTV2 reads 8*SK*Rcap*I bytes', by: [fc1, reduce]}
      - item: Gather copy
        change: |-
          Flat/token-major add 9*(Tv+Rv)*H/16 logical bytes; route-major adds 18*Rv*H/16; direct gather4 has no copy pass and fetches padded operands within each FC1 tile
        by: [gather, fc1]
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> Nr*I elements for clamp/activation/quantization; spare rows passing the expert check are included', by: [activate]}
      - {item: Slice reduction, change: 'Add 2*SK*Nr*I FP32 additions, including the initial zero plus slice 0', by: [reduce]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - {item: Split accumulation order, change: 'H/64 updates per output become SK chains of H/(64*SK) updates plus SK FP32 additions for each valid up/gate result; rounding can differ', by: [fc1, reduce]}
      - item: Approximate activation and normalization
        change: Affects Nr*I evaluations through the explicitly defined approximations; no established full-domain output
          error bound
        by: [activate]
  work_schedule:
    thesis: |-
      Compact routes using small preparation or count/scan/scatter, optionally pre-gather, then submit WS split-K FC1, independent reduction/activation/QDQ, single-warp-mainloop FC2 and finalize. FC1 slices increase independent work; the separate reduction consumes the complete partial grid. Both projections stride capped static work sequences.
      Let Small mean Rcap<=S with S defined in when. Only prepare is submitted for Small; only count/scan/scatter are submitted otherwise. Gather is submitted only for AMODE=2. The launch and handoff entries enumerate these conditional alternatives, not extra no-op kernels: entries for absent phases do not apply.
      The actual stream chain is prepare -> optional gather -> fc1 -> reduce_act -> fc2 -> finalize, or memset -> count -> scan -> scatter -> optional gather -> fc1 -> reduce_act -> fc2 -> finalize. Every successor waits for its actual predecessor grid before reading; no bypassed phase creates an event or wait. All routing handoffs from count/scan/scatter apply only to the large chain; Prepared carries the same arrays in the small chain. Handoff operand views apply only when the selected consumer mode actually reads them.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise the stream serializes kernels; the in-kernel grid dependency controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: source_pdl}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [reduce_act], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: source_pdl, start_after: reduce_act.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        Xq: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Xs: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Part: {producer: fc1, consumer: [reduce_act], storage: global, ready: fc1.kernel_done}
        Aq: {producer: reduce_act, consumer: [fc2], storage: global, ready: reduce_act.kernel_done}
        As: {producer: reduce_act, consumer: [fc2], storage: global, ready: reduce_act.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [gather, fc1, reduce_act, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [gather, fc1, reduce_act], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: 'Only for pre-gather AMODE=2: copy stored bytes into route order using the effective flat, token-major
          or route-major policy.'
        decomposition:
          strategy: |-
            Flat takes precedence over token-major. Let C=9*H/256, Gg=max(1,min(ceil_div(T*C,128),gatherf_cap())) and Ncopy=ceil_div(T*C,128) for flat: unit u covers flattened token/chunk coordinates [128*u,128*(u+1)). Each chunk makes up to K copies.
            For token-major, Gg=max(1,min(T,gather_grid_cap())), Ncopy=Gg*floor(T/(2*Gg))+min(Gg,T%(2*Gg)); unit u uses tokens (u%Gg)+2*floor(u/Gg)*Gg and that token+Gg, masking the second past T. For route-major, Gg=min(ceil_div(Rcap,4),1184), Ncopy=ceil_div(Rv,4); unit u covers routes [4*u,min(4*u+4,Rv)).
            Flat and route-major use 128 threads. Token-major uses Nt=gather_threads(), default 64, clamped to [32,1024] and rounded down to a warp multiple. The effective flat cap defaults to 1184, token cap to 2368; both clamp to [1,65536]. InputBytes is respectively 128*16, 2*9*H/16 or 4*9*H/16; CopyBytes is respectively K*InputBytes, K*InputBytes or InputBytes. CopyMaps denotes the corresponding route_of entries, or four ptok entries for route-major.
          partition: {unit: {size: Ncopy, tile: 1}}
          worktile: {invariant: {Input_bytes: {shape: [{byte: InputBytes}], dtype: uint8}, CopyMaps: {shape: [{word: 128*K
                      if flat else 2*K if token_major else 4}], dtype: int32}}}
          target: {single_tile: {Gathered: {shape: [{byte: CopyBytes}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Gg}
        schedule: {worktile_order: [{by: unit, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: |-
          One expert tile, one contiguous hidden slice and Bn1 paired channels produce raw FP32 partials. Xq/Xs denote original-token slices through Route when AMODE is 1 or 3; the Route invariant is read only in those modes.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256, STAGES=3, SFS=2, EPI=4. BRLESS=true; PP, FUSE, SELFPREP, TSTORE, EPITB, CPHOIST and EARLYDONE are false; NIPRE=PFTMA=MBH=0 throughout.
            Base cfg58: SK=2, AMODE=2, DEEP=false, SFCH=false, SFPF=0, NPAIR=false. cfg59 changes SK=4; cfg64 changes AMODE=1. cfg75 adds DEEP to cfg58; cfg79 adds DEEP to cfg64.
            cfg78 starts from cfg75 and sets AMODE=3, SFCH=true, SFPF=2; cfg95 changes SK=4 from cfg78. cfg98 adds NPAIR to cfg75; cfg99 adds NPAIR to cfg78. Each slice traverses H/(Bk*SK) stages, starting at hidden channel l*H/SK. These divisions are exact for all shared Contract tuples.
            For either GEMM let Nx be the submitted x-width: SK*I/Bn1 for FC1 and H/Bn2 for FC2. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 CTAs have 224 threads; FC2 CTAs have 128. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              Xq: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              Xs: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      reduce_act:
        describe: Reduce raw slices, clamp and activate, then quantize one block using four cooperating lanes.
        decomposition:
          strategy: |-
            A unit is 64 consecutive flattened (capacity row, G-channel block) pairs, block fastest; the final unit masks pairs beyond Rcap*I/G. Each 256-thread CTA owns one unit. Four lanes jointly cover each G=16 block, four consecutive elements per lane. No route-count bound replaces the pexp check.
            ACTV2 means effective act_v2()!=0 (default enabled), using compile-time SK slice loads before the expert check; otherwise the runtime slice loop checks first. Part and Route spare capacity are deliberately uninitialized or retained, as specified in reduce; no arrival counters or partial memset exist on this path.
          partition: {unit: {size: 'ceil_div(Rcap*I/G,64)', tile: 1}}
          worktile:
            invariant:
              Route: {shape: [{block: 64}, {field: 1}], dtype: int32}
              Parameters: {shape: [{block: 64}, {value: 3}], dtype: fp32}
            iteration:
              Part: {shape: [{block: 64}, {pair: 2}, {channel: G}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Aq: {shape: [{block: 64}, {packed_intermediate: G/2}], dtype: uint8}
              As: {shape: [{block: 64}], dtype: fp8_e4m3fn}
            tile_reduction: {dimension: slice, input: Part, output: U, method: 'design.math_reshape::reduce'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap*I/G,64)'}
        schedule:
          worktile_order: [{by: unit, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm=128, Bn2=128, Bk=256 and Grid from fc1. The only FC2 instantiation is f4_body_w1<128,false,3,3,1>: three payload slots, three scale slots and no reduction split. Both TMA boxes have 128 rows, matching the expected (Bm+Bn2)*(Bk/2)=32768 payload bytes per stage.
            Each CTA has 128 threads. Warp 0 stages payload and both scale operands and issues the full MMA reduction; all four warps then drain 32-channel chunks and issue valid-row BF16 vector stores. One accumulator serves successive worktiles; there is no bulk-store sink or fused route reduction.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1 assigns warp 0 to activation scales, warp 1 to payload and weight scales, warp 2 to ordered MMA, and EPI independent epilogue warps to TMEM drain. Its continuous payload/scale rings and all-epilogue accumulator release permit producer and epilogue overlap.
      For FC1, Nrow=2*Bn1, AccCols=Nrow, NSFB=1 if NPAIR else 2, TCOLS=AccCols+16*SFS*(1+NSFB), TALLOC=256, Dpayload=STAGES if DEEP else SFS, Chunks=Bn1/32. Four epilogue warps cover row quadrants warp_id%4. The accumulator release joins all four warps after their raw partial stores issue; those stores may remain in flight.
      Independent reduce_act uses eight warps with four lanes per quantization block and no CTA barrier. ACTV2 holds all slice loads in registers through the expert check; the runtime form reuses one slice register set after each sum. Gather instantiates only warp[0:Nt/32].
      FC2 uses warp 0 for its mainloop and all four warps for TMEM drain. Nk=I/Bk; three payload and scale slots use a continuous stage index across worktiles. The single 256-column TMEM allocation holds Bn2 accumulator columns plus 96 scale columns. One register set carries both scale operands ahead of their use. FC2 stage waits are warp-local; CTA rendezvous surround the mainloop and complete each worktile's drain.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: |-
                  Nt=128 for flat/route-major, otherwise the bound gather_threads value. Wait for actual preceding preparation and trigger admission. Flat/token-major return if Rv=0; route-major has an empty row loop.
                produce: |-
                  Flat assigns each lane one 16-byte input chunk and copies its vector to all active destinations. Token-major holds two route lists, loads the second token vector before the first, then interleaves their stores; payload precedes scales. Skip input loads for tokens without active routes. Route-major visits four valid rows in order, loading ptok and copying payload then scales in block-strided 16-byte vectors. Mask tails, leave spare capacity untouched, and reuse register vectors after store issue.
            pipe: {prologue: ['enter:Input'], steady: [{repeat: t, steady: ['produce:Gathered(t)']}]}
      fc1:
        domain: {t: worktile, k: [0, H/(Bk*SK)], g: {flatten: [t, k]}, c: [0, Chunks]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, AccCols]}}
              TScale(g): {part: {column: [AccCols+16*(1+NSFB)*(g%SFS), AccCols+16*(1+NSFB)*(g%SFS+1)]}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: 64}], dtype: fp32, slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles wait for predecessor grid completion. Warp 0 triggers successor admission. If J=0 all return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and rendezvous. Surplus CTAs still initialize and retire. Stage counters and parity continue across assigned worktiles without resetting.
                prime: |-
                  Resolve tile, slice, expert and route bases; source stage k is slice*H/(Bk*SK)+k. AMODE=1/3 follows ptok into input scales; AMODE=2 uses gathered scales. AMODE=3 reads only valid-row scales; other modes repeat the first valid row for padding. Prime local stages 0 and 1 when present into the two register sets.
                produce: |-
                  After scale-slot reuse, write current registers into AScale(g), skipping padded rows only for AMODE=3. Fence shared writes, then load local k+1 into the alternate registers when present; primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish the readiness contribution. No load passes this slice's end.
                retire: Join the final CTA rendezvous after all roles finish their assigned sequences; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]', steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue payloads at this slice's stage offset. AMODE=2 uses one 128-row A box; AMODE=1 uses 32 gather4 boxes. AMODE=3 uses ceil_div(v,4) gather4 boxes, with repeated first-token rows in the final partial box; unissued payload rows retain old local bytes. Both paired Bn1-row B boxes are always issued. The transaction covers (2*Bn1+Afetched)*Bk/2 bytes, where Afetched is 128 except 4*ceil_div(v,4) for AMODE=3.
                stage: |-
                  DEEP waits for the scale slot after payload issue; otherwise the preceding SFS-distance wait covers both. Issue weight-scale cp.async copies and 32 completion arrivals. SFCH changes source grouping; NPAIR combines both halves in one 128-row scale image, otherwise two images each write/use only 64 rows although full images are copied to TMEM. SFCH/SFPF hints local k+SFPF only inside this slice, without a readiness event.
                  Full-stage readiness joins completed TMA bytes, weight-scale copies and the activation-scale release arrival. Unstaged padded A scales in AMODE=3 and unused B-scale image rows are not cleared.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'], 'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: Wait for the prior worktile's all-epilogue accumulator release before consuming this worktile's first stage. The first worktile has no prior-accumulator wait.
                compute: |-
                  Wait for full-stage readiness, copy scales to TScale, and issue four ascending 64-channel updates. Without NPAIR each update uses separate up/gate MMAs; otherwise one MMA spans both halves. The slice's first update initializes Acc. Cumulative stage completion covers scale copies and MMA input reads, releasing shared slots. Ordered scale-copy/MMA operations read each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update of the slice.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data: {'compute:Stage(g)': ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']}
              reuse: {'begin:Acc(t+1)': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Resolve expert parameters, reciprocals and unused folded constants as specified in fc1. Wait for Acc(t), load this warp's up/gate quadrant/chunk together into Drain, and wait for all issued TMEM reads before use.
                store: Only valid rows issue FP32 vector stores to the disjoint slice/route/channel region of Part. Padded rows are read and discarded; no clamp, activation or quantization occurs here. Done covers store issue.
                release: |-
                  After both chunks, each warp rendezvouses and contributes one release arrival. MMA waits for all four arrivals before reusing Acc; the other warps need not finish their stores before this warp proceeds. Part stores may still be in flight until FC1 grid completion. FUSE=false introduces no last-arriver counter, inter-CTA polling or reduction here.
            pipe: {repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'store:Part(t,c)']}, 'release:Acc(t)']}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      reduce_act:
        resource:
          SliceRegisters: {space: register, member_slot_shape: [{slice: SK if ACTV2 else 1}, {block: 64}, {pair: 2}, {channel: G}], dtype: fp32, slot_count: 1}
          Sum: {space: register, member_slot_shape: [{block: 64}, {pair: 2}, {channel: G}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{block: 64}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the FC1 grid, including all Part stores, then the first warp triggers successor admission. This kernel is still launched for J=0.
                reduce: |-
                  Mask capacity-tail lanes. With ACTV2, vector-load all SK up/gate slices into SliceRegisters before checking pexp; without ACTV2 check first, then load/sum/reuse one slice at a time. Out-of-range experts return before parameter reads. The four lanes of a block share its expert check. Initialize Sum to zero and add slices in ascending order; held loads retire before use or register reuse. No Rv test or scratch initialization is added.
                produce: |-
                  Evaluate the non-folded activation into Activated, retaining values through the four-lane amax exchange and scale conversion. Each lane quantizes four values with the shared scale; shuffle adjacent packed halves so two even quarter lanes issue one 32-bit payload store each. Quarter 0 alone stores the scale byte. Groups do not exchange data, need no CTA rendezvous, and have no later worktile; kernel completion publishes all activation stores to FC2.
            pipe: {prologue: ['enter:Input'], steady: ['reduce:Sum', 'produce:Aq_As']}
      fc2:
        domain: {t: worktile, k: [0, I/Bk], g: {flatten: [t, k]}, c: [0, Bn2/32]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}], dtype: uint8, slot_count: 3,
            view: {Payload(g): {slot_index: g%3}}}
          Scale: {space: SMEM, member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 3, view: {Scale(g): {slot_index: g%3}}}
          ScaleRegisters: {space: register, member_slot_shape: [{row: Bm+Bn2}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(g): {part: {column: ['Bn2+32*(g%3)', 'Bn2+32*(g%3+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the reduce_act grid and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor from warp 0 and rendezvous. Surplus CTAs with no assigned work still allocate and retire. Warp 0 initializes stage and MMA completion counters once per CTA.
                begin: |-
                  Resolve expert, channel and route bases. All four warps fill Rows, repeating the first valid route for padding, then rendezvous. Read alpha/beta and optional clamp and evaluate the unused reciprocals specified in fc2. Warp 0 keeps the prepared weight-scale addresses through the worktile.
                prime: |-
                  Only warp 0 executes prime and advance; the other warps proceed to the drain rendezvous. Fetch scale stages 0 and 1 when present into the single ScaleRegisters set, landing each into its continuous Scale slot before overwriting the registers. Fence each shared scale image to the async proxy. Lane 0 issues the corresponding leading payload stages, each with one 128-row A box and one 128-row B box and a 32768-byte transaction count. Fetch stage 2 into ScaleRegisters when present. Done covers scale staging and payload issue, not payload arrival.
                advance: |-
                  At k>0, lane 0 waits for the preceding MMA commit and the warp rendezvouses before any shared-slot refill. That cumulative completion protects both payload and scale reuse. Land the held scales for k+2 and issue payload k+2 when it exists. Lane 0 waits for the current payload transaction phase, then the warp rendezvouses, making current payload and scales readable.
                  One elected lane fences, copies current scale images to TScale(g), issues four ascending 64-channel MMAs and commits completion. The first update of the worktile initializes Acc. Ordered scale-copy/MMA reads protect each TMEM scale operand. After a warp rendezvous, fetch scale stage k+3 when present into ScaleRegisters, whose prior values have landed. Every fetch/refill stays inside this worktile. Done covers these issues and the tail fetch; the current MMA can remain in flight. No per-stage CTA rendezvous or cp.async group exists.
                drain: |-
                  Warp 0 advances its continuous stage counter and waits for the final cumulative MMA commit, toggling the carried completion parity. All four warps execute the tensor fence and a CTA rendezvous before TMEM reads. Every issued payload and scale stage has been consumed; no extra tail transaction is issued or drained.
                produce: |-
                  Each warp owns 32 route rows. Load the current 32-channel chunk into Drain and wait for the TMEM read. Only valid rows convert to BF16 and issue four 16-byte vector Rout stores; padded rows are read and discarded. Done covers conversion and store issue; grid completion publishes Rout to finalize.
                close: |-
                  Rendezvous after all four warps finish their TMEM reads and vector store issues. Rows, Drain and the single Acc may then serve the next worktile. This is not a separate global-store completion event; payload/scale slot positions and transaction/MMA parity continue without reset.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. Kernel completion supplies the route-store visibility required by finalize.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: 'g[t]', steady: ['advance:Stage(g)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:Rout(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including its route stores, then trigger admission.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and the single accumulator in each projection.
  - item: design.tile_pipeline::fc1.Payload
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight row permutation, with matching scale images. AMODE=1/3 uses gather4 maps and AMODE=2 gathered-row maps. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Encode UINT8 128-row A/B TMA boxes with the prepared weight-row permutation and 128-byte payload swizzle. Use transaction-counted mbarrier completion for the 32768 payload bytes; direct register loads and shared scale stores use the matching f4_sf_off image, async-proxy fences and warp rendezvous.
    reason: Payload and scale rows must agree, while TMA readiness and the separate cumulative MMA completion protect different parts of staging and reuse.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1's WS configurations return 733 on operand-map refusal. FC2 uses no drain map. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. Attribute/launch errors propagate to Model.forward. Scratch and process-global graph/map caches have no added lock or cross-stream completion protocol; this extraction supplies none.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
