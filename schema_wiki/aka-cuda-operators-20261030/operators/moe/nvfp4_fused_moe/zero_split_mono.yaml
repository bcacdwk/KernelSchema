"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "zero_split_mono"
    "parent": "ws_split_mono"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates,
      or the cached ABI on a host-cache hit; replay uses its baked launch choices.
      Select exactly when a.zflag is a non-null pointer, a.cfg=99, and the actual
      FC2 selected by launch_gemm is f4_body with GEMM1=false and REDF=false.
      The zero-probe pairings reaching this node are cfg2=44 and cfg2=23 after
      its flat-map refusal; cfg2=57/81 map refusal returns an error, not a
      monolithic replacement. Attribute/launch rejection creates no extra fallback.
      a.zflag denotes allocated verification state, not its current clean/dirty
      value: dirty replays remain in this node. Parent is only the copying origin.
      Qualification initially requires NVFP4_MOE_ZERO outside {"0",""}, no explicit
      nonnegative CFG or CFG2 override, the supported auto-pair and successful
      moe_zero_probe. Cached qualification/configuration is not recomputed for
      in-place changes. Only mode "2" with T*H>=2^20 allocates zflag_host; actual
      graph state determines single-graph versus two-graph submission.
      Rcap=T*K. Let S be a.small_thresh when positive, otherwise native
      small_threshold(); replay uses the preparation choice baked into its graph.
design:
  math_reshape:
    thesis: |-
      Verify current zero eligibility and overwrite Y with zero before the guarded chain. Clean skips expert arithmetic; dirty compacts routes, uses clipped gather4 and two FP32 FC1 partials, then separately reduces/quantizes, runs monolithic FC2 and finalizes. Verification adds a full input scan and output write; the dirty path retains split storage and dense padding.
    rewrite:
    - step: verify
      name: Recheck current bytes and establish the zero output
      math: |
        For each submitted verification, Dirty is the OR of:
        (hidden_states byte AND 0x77)!=0 over all T*H/2 bytes;
        (hidden_states_scale byte AND 0x7f)==0x7f over all T*H/G bytes;
        not finite(route_weights[t,k]) over all slots; not finite(gemm1_alpha[e])
        or not finite(gemm1_beta[e]); and, when present, not finite(gemm1_clamp_limit[e]).
        Signed-zero FP4 codes pass. Route IDs and weight payloads are not inspected.
        Weight scales are checked for the same E4M3 NaN code only at initial
        moe_zero_probe qualification, not in this repeated check.
        DirtyShard is the local OR of these predicates over one verification shard,
        whose index sets are bound in work_schedule; Dirty=OR_shards(DirtyShard).
        Unconditionally overwrite Y[:,:]=bf16(+0), including on Dirty.
        Clean=int32(not Dirty), stored in ZeroState[0]; ZeroState[1] and [2]
        collect dirty bits and verification arrivals and are reset to zero after
        folding the last contribution. All four words start at zero; word 3 is unused.
        With a host mirror, each verification also writes Clean to HostClean.
        The optional preliminary verification and the full-chain verification
        each recompute their own Clean and overwrite the same Y and ZeroState.
        The full chain uses its own verdict, not the earlier host observation.
        Steps routing through finalize below execute only when that verdict is 0.
        On Clean=1 they leave route maps, partials, packed activation and Rout
        unchanged. A submitted large-preparation chain still clears counts/fill
        to zero; a verify-only graph does not. Y remains the zero result.
      symbol:
        DirtyShard: {meaning: One verification shard's predicate OR, shape: [], dtype: int32}
        Clean: {meaning: "Current verification verdict, stored as ZeroState word 0", shape: [], dtype: int32, retention: keep_value verification}
        ZeroState: {meaning: Cached device verdict and self-resetting dirty/arrival words, shape: [{word: 4}], dtype: int32, retention: keep_value ABI_lifetime}
        HostClean: {meaning: "Optional pinned host mirror, initialized and reset by the host to -1 before a verify-only replay", shape: [], dtype: int32, retention: keep_value ABI_lifetime}
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation policy is bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per paired FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok feeds FC1 gather4 and pexp feeds activation
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: fc1
      name: Paired projection with dense padded rows
      math: |
        For each j<J, sl<SK and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        Decode W1 and W2 as in Contract's Decode the stored operands; neither is materialized.
        FC1 fetches clipped gather4 payload rows m<4*ceil_div(v,4) from token
        Route[b+(m if m<v else 0),0], but refreshes scales only for m<v.
        Unissued payload rows and padded scale rows retain uninitialized or prior
        ring-slot bytes. All Bm rows are evaluated; padded results are discarded.
        No pre-gather allocation or copy exists on this path.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. Let h0=sl*H/SK. D1(-1)=0;
        D1(s)=mma32(Xtile[:,h0+64*s:h0+64*(s+1)],Wpair[:,h0+64*s:h0+64*(s+1)]^T,D1(s-1)),
        s=0..H/(64*SK)-1. For m<v, store Part[sl,b+m,n:n+Bn1]=D1(last)[m,:Bn1]
        and Part[sl,b+m,I+n:I+n+Bn1]=D1(last)[m,Bn1:]. No activation or narrowing
        occurs here. Part[:,Rv:Rcap,:] retains unspecified prior bytes.
        FC1 still evaluates per-item a=gemm1_alpha[e], bpar=gemm1_beta[e],
        ia=rcp_rn(a),ib=rcp_rn(bpar) and unused
        folded constants: a*L2E for SwiGLU, or (L2E,ia*(2*L2E),ib*(2*L2E)) for SiTU,
        where L2E=fp32(-1.44269504). The selected activation below does not use those constants.
      symbol:
        SK: {meaning: Independent FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        D1: {meaning: Paired up and gate slice accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,sl,n1); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw FC1 slice partials with up then gate channels, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage; the first update of each slice disables the previous accumulator. Native internal product/reduction rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Ordered slice reduction and non-folded activation quantization
      math: |
        Let Rp={r | 0<=r<Rcap and 0<=Route[r,2]<E} after preparation, and Nr=count(Rp).
        It contains every r<Rv, but may include spare rows with an in-range stale expert ID.
        For every r in Rp and block B=[G*bq,G*(bq+1)), 0<=bq<I/G, initialize U(-1)=0 and compute
        U(sl)=U(sl-1)+concat(Part[sl,r,B],Part[sl,r,I+B]) in ascending sl=0..SK-1,
        rounding each addition to FP32. Split U(SK-1) into up and gate; e=Route[r,2].
        ACTV2, bound in work_schedule, loads every slice for every r<Rcap before checking
        e; the other form checks e before loading. Rejected rows do not perform the sums
        or stores. Spare partials and expert IDs are not initialized for this pass.
        Apply Contract's asymmetric clamp to up and gate on the processed rows.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        F(x)=rcp_approx(1+ex2_approx_ftz(x*L2E)), and Th(x)=fma32(F(x+x),2,-1).
        For activation_type=3, Ap=(gate*F(a*gate))*(up+bpar).
        For activation_type=10, tg=a*Th(gate*ia), tu=bpar*Th(up*ib),
        and Ap=(tg*F(gate))*tu. Parenthesized FP32 operations retain their shown order;
        the prescales are not folded across these multiplications.
        ia and ib are evaluated for each processed quarter-block even for SwiGLU, where they are unused (ib may be infinite).
        For every processed row and G-channel block, amax is the max of eight pairwise absolute maxima;
        combine pairs (0,1),(2,3),(4,5),(6,7), then the first/second halves and finally both halves.
        Use source fmax/fmin semantics for maxima, clamp and scale saturation, including
        selecting the numeric operand when the other is NaN.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))).
        q[i]=Q4(Ap[i]*inv), using Contract's RNE saturating E2M1 code rule and low-even-nibble packing.
        This multiplication is evaluated also when s8=0; do not replace it by a guarded division.
        For r in Rp, store packed q in Aq[r,G*bq/2:G*(bq+1)/2] and s8 in As[r,bq]. Other rows
        retain their prior bytes. FC2 consumes only active rows for stored results;
        processed spare rows can change discarded FC2 padding. The decoded operand is
        d(q)*s8; a zero scale therefore need not have a zero payload code. Spare-row
        results remain unspecified, including native conversion of nonfinite scratch values.
      symbol:
        U: {meaning: Ordered sum of up and gate partials for one quantization block, shape: [{channel: 2*G}], dtype: fp32, retention: 'carry_forward (r,B); sl=-1..SK-1'}
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32; the sigmoid identity for tanh and multiply-by-rounded-reciprocal normalization replace the reference evaluation. unknown: no verified bound for the composed error over this entire path is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. With TMA, Aq uses
        row b+m: reads can cross into another expert or spare capacity; reads
        outside the Rcap-row payload matrix are zero-filled. With cp.async,
        Aq uses row b+(m if m<v else 0). Let QTile decode these operands.
        TMA is the FC2-local selector bound in work_schedule. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item activation parameters, reciprocals and folded constants above, but does not use them.
      symbol:
        TMA: {meaning: FC2 box-payload selector, binding: 'bind:design.work_schedule::TMA'}
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        After completing fc2, including J=0, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection work and still overwrites Y with zeros;
        the Rcap-sized activation pass may nevertheless read and process spare scratch rows.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: Verification state, change: '0 -> 16 device bytes and optionally 4 pinned host bytes per cached ABI; clean retains the allocated dirty-chain scratch', by: [verify]}
      - {item: FC1 intermediates, change: 'For dirty, 16*Rv*I bytes of FP32 intermediates -> 8*SK*Rv*I bytes of valid raw partials plus 9*Nr*I/16 packed bytes; physical capacities are 8*SK*Rcap*I for Part and 2*Rcap*I for act, retained together', by: [fc1, activate]}
      traffic:
      - {item: Verification scan and zero write, change: '+9*T*H/16 + 4*T*K + 8*E bytes read, plus 4*E when clamp is present, and 2*T*H bytes written per submitted verification; a two-graph dirty/timeout submission repeats this scan and write', by: [verify]}
      - {item: Slice materialization, change: 'For dirty, +8*SK*Rv*I bytes written and 8*SK*I*(Rcap if ACTV2 else Nr) bytes read for raw partials', by: [fc1, activate]}
      matmul:
      - {item: Dense expert padding, change: 'For dirty, 3*Rv*H*I -> 3*P*H*I MACs including discarded rows; for clean, 3*Rv*H*I -> 0 MACs', by: [fc1, fc2]}
      vector:
      - {item: Slice sum and activation, change: 'For dirty, +2*SK*Nr*I FP32 additions from zero; Rv*I -> Nr*I clamp/activation/quantization elements, possibly including spare scratch rows', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          For dirty, + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: On dirty, affects Nr*I evaluations through the explicitly defined approximations and changes FC1 reduction grouping; no established full-domain output
          error bound
        by: [activate]
  work_schedule:
    thesis: |-
      Verify first; guarded kernels return on clean, while dirty executes small preparation or count/scan/scatter, WS split-K FC1, activation, monolithic FC2 and finalize. No gather or REDF side stream belongs to this path. Small means Rcap<=S as defined in when. The large chain includes an unconditional 8*E-byte counts/fill memset after verify, even when clean; cnt_n=0 here.
      Eager execution and a single full graph submit verify -> prepare -> fc1 -> activate -> fc2 -> finalize, or verify -> memset -> count -> scan -> scatter -> fc1 -> activate -> fc2 -> finalize. Only the applicable preparation phases are submitted. Downstream data handoffs apply only on dirty; clean never consumes stale route or scratch data.
      With an instantiated exec_clean and non-null zflag_host, graph_replay resets HostClean=-1 and submits verify_clean alone. Outside outer capture it spins while HostClean=-1 for fewer than 200000000 iterations; only an observed 1 omits the full graph. Dirty or timeout submits the full graph, including its own verify. Under outer capture it records verify_clean then the full graph without spinning. Without exec_clean, replay submits the full graph directly. A preliminary graph launch error returns immediately. These launch entries are conditional submissions; absent phases create no events.
      Both graph submissions use the current stream. When both verification phases run, verify waits for the actual preceding work before overwriting their shared output/verdict state. A host verdict is not a kernel-completion fence. Each submitted guarded kernel waits for its actual predecessor grid before consuming the final verification verdict or data; launch_ready only permits admission. The chains and kernel-entry contracts supply the dynamic predecessor relations where absent phases prevent a single static start_after.
      Projection guards return before their explicit trigger on clean; subsequent kernels proceed through normal stream completion. Clean handoff still applies on clean; data handoffs and dirty worktile descriptions do not. Part and Route handoffs publish current valid rows only; spare rows consumed by activate retain unspecified history. source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. Otherwise stream order serializes kernels and griddepcontrol is inert. The API enable_pdl argument does not select this policy.
    flow:
      launch:
      - {phase: [verify_clean], protocol: source_pdl}
      - {phase: [verify], protocol: source_pdl}
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [activate], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl, start_after: activate.launch_ready}
      - {phase: [finalize], protocol: source_pdl}
      handoff:
        Clean: {producer: verify, consumer: [prepare, count, scan, scatter, fc1, activate, fc2, finalize], storage: global, ready: verify.kernel_done}
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [finalize], storage: global, ready: scatter.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
        Aq: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        As: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, activate, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [fc1, activate], storage: global, ready: scatter.kernel_done}
    phase:
      verify_clean: &verification_work
        describe: Optional verify-only graph; scan current operands, clear Y and fold a global clean verdict.
        decomposition:
          strategy: |-
            Zg=min(T,296). One 256-thread CTA owns one shard: in each independent tensor space it visits chunks u=shard,shard+Zg,..., each of 256 entries with a masked tail. Output uses T*H/8 uint4 entries; payload uses the same number of uint32 entries; scales use T*H/G bytes; scores use Rcap floats; parameters use E experts. Each lane issues its output stores before its own predicate scans, without a CTA barrier between loops.
            Qz=256*ceil_div(T*H/8,256*Zg), Sz=256*ceil_div(T*H/G,256*Zg), Wz=256*ceil_div(Rcap,256*Zg), Ez=256*ceil_div(E,256*Zg) are per-shard capacity bounds, not extra evaluated entries. Parameters means alpha/beta and the optional limit column. The last arriving CTA folds all dirty contributions and resets the arrival state; it is not another launch.
          partition: {shard: {size: Zg, tile: 1}}
          worktile:
            invariant:
              hidden_states: {shape: [{byte: 4*Qz}], dtype: uint8}
              hidden_states_scale: {shape: [{byte: Sz}], dtype: fp8_e4m3fn}
              route_weights: {shape: [{slot: Wz}], dtype: fp32}
              Parameters: {shape: [{expert: Ez}, {value: 3}], dtype: fp32}
          target:
            single_tile:
              Y: {shape: [{element: 8*Qz}], dtype: bf16}
              DirtyShard: {shape: [], dtype: int32}
            tile_reduction: {dimension: shard, input: DirtyShard, output: Clean, method: 'design.math_reshape::verify'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Zg}
        schedule:
          worktile_order: [{by: shard, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      verify:
        <<: *verification_work
        describe: Full-chain verification; its current Clean verdict guards every downstream computation.
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc1:
        describe: One expert tile, one hidden-reduction slice and Bn1 paired channels produce raw FP32 partials, gathering the original hidden tensors through Route.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256, SK=2; H/Bk is divisible by SK in the shared domain. cfg99 binds STAGES=3, SFS=2, AMODE=3, EPI=4, BRLESS=DEEP=NPAIR=SFCH=true, SFPF=2; FUSE=SELFPREP=PP=CPHOIST=EARLYDONE=TSTORE=EPITB=false, NIPRE=PFTMA=MBH=0.
            One slice visits Nk1=H/(Bk*SK) stages starting at sl*Nk1. Let Nx=SK*I/Bn1 for FC1 or H/Bn2 for FC2. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 CTAs have 224 threads; FC2 CTAs have 128. Runtime J bounds work; surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              hidden_states: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      activate:
        describe: Reduce all FC1 slices in order, clamp, evaluate non-folded activation and quantize complete G-channel blocks.
        decomposition:
          strategy: |-
            Flatten (r,bq) with bq fastest over Rcap*(I/G) blocks. Each 256-thread CTA owns 64 consecutive complete blocks, masking the final capacity tail. Four lanes cooperate per block; slice is a local ascending reduction, not another work assignment. ACTV2 means effective act_v2()!=0 (default true in the getter), using compile-time SK slice loads before the expert check; otherwise use the runtime slice loop. BRLESS=true. The domain includes spare rows exactly as defined in activate math.
          partition: {block: {size: Rcap*I/G, tile: 64}}
          worktile:
            invariant:
              Route: {shape: [{block: 64}, {field: 1}], dtype: int32}
              Parameters: {shape: [{block: 64}, {value: 3}], dtype: fp32}
            iteration:
              Part: {shape: [{block: 64}, {channel: 2*G}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Aq: {shape: [{block: 64}, {packed: G/2}], dtype: uint8}
              As: {shape: [{block: 64}], dtype: fp8_e4m3fn}
            tile_reduction: {dimension: slice, input: Part, output: [Aq, As], method: 'design.math_reshape::activate'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap*I/G,64)'}
        schedule:
          worktile_order: [{by: block, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Bn2=128 with Bm, Bk and Grid from fc1. FC2-local STAGES=SFS=3, AMODE=0, SK=1, SFPRE=0, FUSE=BRLESS=REDF=PIPE=false. TMA=true and SFCP=true for cfg2=44 with accepted maps. Its MapBn=128 equals Bn2 and arms exactly (Bm+Bn2)*(Bk/2) bytes per stage.
            cfg2=23 belongs here only after flat-map refusal retries local cfg12: an accepted retry uses TMA=true, SFCP=false; otherwise it uses cp.async. cfg2=44 map refusal also selects cp.async. Both cp.async forms have TMA=SFCP=false and the same 128-channel, three-stage geometry. cfg2=57/81 refusal returns 733 and does not enter this family. Attribute/launch failures propagate rather than choosing another implementation.
            The same four warps stage operands, execute the stage loop and then read TMEM in 32-channel chunks, convert valid rows to BF16 and issue vector stores. There are no separate epilogue warps, ping-pong accumulators or bulk-store sink.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      Each verification folds shard predicates through self-resetting global state. Guarded entry prevents every dirty-chain data read on clean. Dirty FC1 uses two producer warps, one ordered-MMA warp and four partial-store epilogue warps; continuous payload/scale rings overlap adjacent work, while the independent activation grid waits for all partials.
      For FC1, Nrow=2*Bn1, AccCols=Nrow, Acount=NSFB=1, TCOLS=AccCols+16*SFS*(1+NSFB), TALLOC=256, Dpayload=STAGES, Chunks=Bn1/32, DrainWidth=64; epilogue quadrant=warp_id%4. FC1-local parameter bindings come from its work_schedule strategy.
      FC2 is a cooperative four-warp loop with one accumulator. Nk=I/Bk, TCOLS2=Bn2+32*SFS, TALLOC2=256. Its rings use base=t*Nk for TMA, base=0 for cp.async; TMA stage and MMA completion counters continue across worktiles. cp.async slots restart after the prior worktile's real copies and MMA reads complete. FC2-local parameters come from its own strategy.
    phase:
      verify_clean: &verification_pipeline
        resource:
          DirtyRegisters: {space: register, member_slot_shape: [{lane: 256}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding stream work, then the first warp triggers successor admission. No zero guard applies to verification.
                scan: |-
                  Start each lane's dirty accumulator at zero. First issue uint4 zero stores over its flattened output indices, then independently scan uint32 payload words, byte scales, FP32 scores and expert parameters with grid-stride loops. Mask each space at its own bound. A CTA-wide OR/rendezvous produces DirtyShard after all lanes have issued their output stores and finished the predicate reads.
                publish: |-
                  Thread 0 atomically ORs 1 into ZeroState[1] when its shard is dirty, then executes a device fence and takes an atomic arrival ticket in ZeroState[2]. Other lanes issue no global counter operations. The last ticket reads the accumulated dirty word, writes Clean to word 0 and resets words 1/2 to zero; word 3 stays unused. If HostClean exists, that thread executes a system fence then a volatile host-mirror store. Other CTAs exit without folding. This is the source's publication sequence; the host mirror is not a full-grid completion event.
                  Downstream device guards read Clean only after preceding-grid completion. Same-stream ordering separates completed verification/guard uses from the next verification's reuse of this allocation; no extra per-call memset of ZeroState is issued. Overlapping calls on different streams have no added protection.
            pipe: {prologue: ['enter:Input'], steady: ['scan:DirtyShard', 'publish:Clean']}
      verify:
        <<: *verification_pipeline
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission, then ZGUARD waits again and returns on Clean=1 before reading IDs or initializing local state.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the unconditional counts/fill memset, trigger successor admission from the first warp, then ZGUARD waits again and returns on Clean=1. Trigger does not publish data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, trigger admission from the first warp, then ZGUARD waits again and returns on Clean=1 before reading any route data.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, trigger admission from the first warp, then ZGUARD waits again and returns on Clean=1 before reading any route data.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      fc1:
        domain: {t: worktile, k: [0, Nk1], g: {flatten: [t, k]}, c: [0, Chunks]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}
              TScale(g): {part: {column: [Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles first execute ZGUARD: wait for predecessor completion and return on Clean=1 before trigger, J read or allocation. On dirty, the ordinary wait/warp-0 trigger follows. If J=0 all return before allocation; otherwise allocate Tensor, initialize protocols and publish setup with one CTA rendezvous. Surplus CTAs still initialize and retire. Stage counters continue across worktiles.
                prime: |-
                  Resolve tile/expert/route bases and absolute slice start sl*Nk1. Follow ptok into input scales, skipping every m>=v load/store and preserving padded slot bytes. Read local stages 0 and 1 into the two register sets before the loop.
                produce: |-
                  After scale-ring reuse, write the current registers into AScale(g), skipping padded rows; fence shared writes, then load k+1 into the alternate register set when present, retaining that row guard. The primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish this readiness contribution. No load passes the slice end.
                retire: Join the final CTA rendezvous after every role's assigned sequence; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue A/B TMA payloads at absolute stage sl*Nk1+k: ceil_div(v,4) gather4 boxes and both Bn1-row weight boxes. Issued padding repeats the first valid token; unissued rows retain old slot bytes. Completion counts exactly (Nrow+4*ceil_div(v,4))*(Bk/2) bytes.
                stage: |-
                  Wait for scale-slot reuse after payload issue. Issue chunked weight-scale cp.async copies and 32 completion arrivals, combining up/gate into one 128-row scale image. SFPF hints weight scales k+SFPF only inside this slice, without allocating a slot or publishing readiness. Full-stage readiness joins completed TMA bytes, completed weight-scale copies and the activation-scale release arrival; payload completion alone is insufficient.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'],
                'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: |-
                    Wait for the preceding worktile's accumulator release before entering the current stage loop; the first worktile has no such wait. Done means the single accumulator is reusable; no scale copy is hoisted across this wait.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale. One elected lane issues four ascending 64-channel updates, each one MMA spanning both up/gate result columns. The first update of each slice initializes Acc. Cumulative stage completion covers preceding scale copies and all MMA input reads, releasing shared slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data:
                compute:Stage(g): ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']
              reuse: {'begin:Acc(t+1)@done': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Each epilogue warp resolves its expert and unused activation constants, waits for Acc(t), and loads its up/gate quadrant/chunk together into private Drain. Wait for every issued TMEM read before use.
                release: |-
                  After all chunks' TMEM reads and partial-store issues, perform a warp rendezvous and one release arrival. MMA waits for all four arrivals before reusing Acc; there is no inter-warp rendezvous here and global stores may remain in flight. No last-arriver counter or in-grid slice reduction exists on this path.
                produce: |-
                  For valid rows only, issue float4 stores to the slice's up and gate regions of Part. Padded TMEM rows are read and discarded. Done covers store issue, not global publication; Drain can then be reused for the next chunk. Full grid completion publishes partials to activate.
            pipe: {steady: [{repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'produce:Part(t,c)']}, 'release:Acc(t)']}]}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      activate:
        resource:
          PartialRegisters: {space: register, member_slot_shape: [{block: 64}, {channel: 2*G}], dtype: fp32, slot_count: 'SK if ACTV2 else 1', view: {'PartialRegisters(sl)': {slot_index: 'sl if ACTV2 else 0'}}}
          Sum: {space: register, member_slot_shape: [{block: 64}, {channel: 2*G}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for full FC1 completion, trigger successor admission from the first warp, then ZGUARD waits again and returns on Clean=1 before partial or expert reads.
                produce: |-
                  Assign four neighboring lanes per complete G-channel block, each owning four adjacent channels. Bound the flat index by Rcap, not Rv. ACTV2 batches all SK float4 up/gate loads before reading and checking pexp; the runtime form checks pexp first and then loads/adds one slice at a time. All lanes of a block share its validity; an out-of-range expert returns before parameter reads, arithmetic and stores. Only current active rows have initialized partials guaranteed by FC1.
                  Initialize private up/gate sums to zero, add slices in ascending order, and apply activate. Each lane forms its four-element maximum; XOR-1 then XOR-2 shuffles combine the block. Neighboring quarter-lanes exchange packed halfwords: even quarters issue two disjoint four-byte payload stores per block, and quarter zero stores the scale byte. No CTA shared state or barrier is needed. Register operands remain live until their sums/quantization finish; kernel completion publishes all Aq/As writes to FC2.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Aq_As']}
      fc2:
        domain: {t: worktile, k: [0, Nk], c: [0, Bn2/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {'Payload(t,k)': {slot_index: '((t*Nk if TMA else 0)+k)%STAGES'}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {'Scale(t,k)': {slot_index: '((t*Nk if TMA else 0)+k)%SFS'}}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC2}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(t,k): {part: {column: ['Bn2+32*(((t*Nk if TMA else 0)+k)%SFS)', 'Bn2+32*(((t*Nk if TMA else 0)+k)%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  ZGUARD first waits for the activation grid and returns on Clean=1 before trigger, J read or allocation. On dirty, perform the ordinary wait/warp-0 trigger. If J=0 return before allocation; otherwise initialize protocols, allocate Tensor and rendezvous. Surplus CTAs still allocate and retire. Initialize counters once per CTA.
                begin: |-
                  Resolve expert, channel and route bases; form Rows with padded entries repeating the first valid route, then rendezvous. Evaluate the unused activation parameters/reciprocals/constants specified in fc2. Keep row and weight addresses through the worktile.
                prime: |-
                  Prime STAGES-1 payload groups, issuing only stages below Nk but committing empty cp.async groups for short loops. TMA uses a Bm-row A box and a Bn2-row B box; cp.async cooperatively copies the logical rows with clamped Aq padding. SFCP puts four-byte scale copies in these groups; otherwise direct loads/stores fill the leading scale slots. No scale-register prefetch exists here.
                advance: |-
                  For k>0 wait for MMA(k-1) completion and rendezvous before reusing slots. If SFCP, issue scale copies for k+SFS-1 when present. Issue payload k+STAGES-1 when present, committing a cp.async group even when empty. Wait until only STAGES-1 groups may remain, additionally wait for the current TMA transaction when used, and rendezvous to make current payload/scales readable.
                  An elected warp-0 lane copies current A/B scale images to disjoint TScale columns, issues four ascending 64-channel MMAs and commits cumulative completion. The first update initializes Acc. Ordered scale-copy/MMA reads preserve TMEM scale operands until consumed. Without SFCP, the tail directly loads/stores scale k+SFS-1 when present, fencing shared writes to the async proxy. Done covers this issue/refill sequence; the current MMA may still be in flight.
                drain: |-
                  Wait for the last cumulative MMA commit, covering current worktile scale copies and MMA input reads, then fence and rendezvous before reading Acc. Carry completion parity across worktiles. Real payload/scale copies have been consumed; only empty cp.async groups can remain, with no extra drain inserted.
                produce: |-
                  Each warp owns 32 route rows. Load the current 32-channel chunk for all its rows and wait for those TMEM reads. Only valid rows convert to BF16 and issue 16-byte vector Rout stores; padded rows are read and discarded. Done covers conversion and store issue, while grid completion publishes Rout to finalize.
                close: |-
                  Rendezvous after all four warps finish the worktile's TMEM reads and vector store issues. This permits Rows, Drain and the single Acc to be reused by the next worktile; it is not a separate global-store completion event.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. Kernel completion supplies the route-store visibility required by finalize.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: k, steady: ['advance:Stage(t,k)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:Rout(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for FC2 grid completion, trigger admission, then ZGUARD waits again and returns on Clean=1 before any route-map, weight or Rout read.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and each projection's single accumulator.
  - item: design.tile_pipeline::fc1.Payload
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle and the prepared weight row permutation, with matching scale images; A uses gather4. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Bind the FC2 UINT8 TMA map to the prepared-row permutation, 128-row box and 128-byte-swizzled shared payload. The cp.async form writes the same operand layout. Bind group commit/wait to Main's readiness sequence, including SFCP's four-byte scale copies when selected.
    reason: Payload/scales must match the native operand image, and a stage cannot be consumed until every participating copy is ready.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch, ABI, ZeroState and optional pinned HostClean, and refreshes the invocation stream on host-cache hits. moe_zero_probe performs a separate 296x256 eligibility scan and stream synchronization at ABI publication. Its weight-scale scan is not repeated during replay; no general content-stability guarantee is inferred from the source's timed-protocol comment.
      Native moe_run executes eagerly on the first matching signature, attempts full-graph capture on the second, and replays matching graph state thereafter. Full capture/create/instantiate failure selects eager execution. The capture attempt calls run_pipeline on its private stream even after BeginCapture failure; its fallback adds no explicit join with that stream. Verification-only capture/instantiate failure leaves exec_clean absent and keeps the full graph. Graph launch errors propagate. HostClean polling never substitutes for a CUDA completion fence; return supplies [output] without a device-completion guarantee.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1 cfg99 returns 733 on operand-map refusal; FC2 follows work_schedule and uses no drain map. Small preparation requests 4*Rcap dynamic shared bytes with fixed 4*32768-byte opt-in; an oversized forced threshold is not converted to large preparation. Attribute/launch errors propagate. Scratch and process-global graph/map caches provide no lock or cross-stream completion protocol. The host reset also has no wait for an earlier mirror writer, including across calls using the same stream.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
