meta_data:
  name: Paged causal grouped-query attention prefill
  describe: Compute ragged right-aligned causal attention from FP8 queries and a paged FP8 KV cache into a caller-owned BF16
    output.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_prefill/aka_solution/solution.py::Model.forward
  version: 2
  dispatch:
    id: fa4_prefill.small_persistent_shared_rescale
    when: |-
      Use the packaged default selectors within the fixed numeric contract below.
      Let B=BatchCount, T=TotalQ, Q=max_q_len, K=64*ceil(max_kv_len/64),
      and SM be the runtime device multiprocessor count.
      C=ceil(T/16)*B; G=max(1,floor(SM/2)).
      Split = (2*C<=G and ceil(K/128)>=16 and 2*T*16*256*4<=24000000).
      nc=ceil((T+15*(B-1))/16); g=max(1,min(floor(SM/2),nc)); w=T*T/(4096*B).
      qlo=min(max(1,T-(B-1)*Q),Q); A=w+T/256;
      F=max(0,min(qlo*(K-63-qlo),Q*(K-63-Q)))/2048.
      PersistSmall = (ceil(nc/g)>=4 and
        (ceil(K/128)*g/w<=0.30 or (B*K-T)*8<=K or
         (K<=8*Q and ceil((K+15)/128)*g/(A+F)<=0.60))).
      Select this file exactly when not Split and B=4 and T=16384 and PersistSmall.
contract:
  algorithm_requirement:
    constant:
      Hq: {value: 16, meaning: Number of query heads.}
      Hkv: {value: 1, meaning: Number of KV heads.}
      D: {value: 256, meaning: 'Query, key and value channel count.'}
      PageSize: {value: 64, meaning: Tokens in one physical KV page.}
    input:
      query: {meaning: Concatenated queries in request order., shape: [{token: TotalQ}, {head: Hq}, {channel: D}], dtype: fp8_e4m3fn}
      kv_cache: {meaning: HND cache; KV index zero holds keys and index one holds values., shape: [{page: Pages}, {kv: 2},
          {head: Hkv}, {token: PageSize}, {channel: D}], dtype: fp8_e4m3fn}
      workspace_buffer: {meaning: 'Caller-owned scratch, zeroed before first isolated use; this implementation does not read
          or write it.', shape: [{byte: WorkspaceBytes}], dtype: uint8}
      block_tables:
        meaning: Request-relative logical page to physical page mapping.
        shape: [{request: BatchCount}, {page: BlockTableColumns}]
        dtype: int32
        range: Valid entries are in [0, Pages); unused entries may be -1.
      seq_lens:
        meaning: Actual KV token count for each request.
        shape: [{request: BatchCount}]
        dtype: int32
        range: Positive; at least the corresponding query length.
      max_q_len:
        meaning: Maximum query length supplied as a Python integer.
        shape: []
        dtype: python_int
        range: Equals the maximum adjacent difference of cum_seq_lens_q.
      max_kv_len:
        meaning: Maximum actual KV length supplied as a Python integer.
        shape: []
        dtype: python_int
        range: Equals max(seq_lens).
      bmm1_scale:
        meaning: Composite QK scale, already including the quantization scale factors.
        shape: []
        dtype: fp64
        range: [0.0625, 0.0625]
      bmm2_scale:
        meaning: Composite output scale supplied as a Python float.
        shape: []
        dtype: fp64
        range: [1.0, 1.0]
      batch_size:
        meaning: Redundant request count in the callable ABI.
        shape: []
        dtype: python_int
        range: Equals BatchCount.
      cum_seq_lens_q:
        meaning: Prefix offsets into the concatenated query and output tensors.
        shape: [{boundary: BatchCount + 1}]
        dtype: int32
        range: Starts at zero, strictly increases and ends at TotalQ.
      cum_seq_lens_kv:
        meaning: Prefix counts of allocated KV pages, not token offsets.
        shape: [{boundary: BatchCount + 1}]
        dtype: int32
        range: Starts at zero; adjacent differences equal ceil(seq_lens[b] / PageSize).
      window_left:
        meaning: Window sentinel for unrestricted causal history.
        shape: []
        dtype: python_int
        range: [-1, -1]
      out:
        meaning: Caller-owned output buffer; initial contents are ignored.
        shape: [{token: TotalQ}, {head: Hq}, {channel: D}]
        dtype: bf16
        range: Any BF16 bit pattern; never read before overwrite.
    output:
      result: {meaning: 'Returned tensor, identical to the mutated input out.', shape: [{token: TotalQ}, {head: Hq}, {channel: D}],
        dtype: bf16}
      out_after: {meaning: 'Final contents of input out, checked independently by the benchmark.', shape: [{token: TotalQ},
          {head: Hq}, {channel: D}], dtype: bf16}
    compute:
    - name: Callable boundary and page interpretation
      math: |
        The dtype python_int denotes an arbitrary-precision signed Python integer; fp64 scalar inputs are Python float values.
        The required ABI arguments sinks and o_sf_scale are both the Python sentinel None.
        This task fixes bmm1_scale=0.0625 and bmm2_scale=1; batch and positive sequence lengths may vary.
        For 0 <= b < BatchCount, let Qlen_b = cum_seq_lens_q[b+1] - cum_seq_lens_q[b]
        and L_b = seq_lens[b]. For 0 <= k < L_b, page_b(k) = block_tables[b, floor(k/PageSize)].
        Kref_b[k,d] = fp32(kv_cache[page_b(k),0,0,k % PageSize,d]).
        Vref_b[k,d] = fp32(kv_cache[page_b(k),1,0,k % PageSize,d]).
        Only the first ceil(L_b/PageSize) entries of each block-table row are valid.
        The callable, including any dispatch or auxiliary kernels, is the timing boundary.
      symbol:
        Qlen_b: {meaning: Query length of request b., shape: [], dtype: not_applicable}
        L_b: {meaning: KV length of request b., shape: [], dtype: not_applicable}
        Kref_b: {meaning: Logical keys of request b., shape: [{key: L_b}, {channel: D}], dtype: fp32}
        Vref_b: {meaning: Logical values of request b., shape: [{key: L_b}, {channel: D}], dtype: fp32}
    - name: Right-aligned causal attention
      math: |
        For 0 <= q < Qlen_b, 0 <= h < Hq and 0 <= k < L_b:
        R[b,q,h,k] = fp32(bmm1_scale) * sum_d(fp32(query[cum_seq_lens_q[b]+q,h,d]) * Kref_b[k,d])
          if k <= L_b - Qlen_b + q, and -inf otherwise.
        W[b,q,h,k] = exp(R[b,q,h,k] - max_j R[b,q,h,j])
          / sum_j exp(R[b,q,h,j] - max_u R[b,q,h,u]).
        out_after[cum_seq_lens_q[b]+q,h,d] = bf16(fp32(bmm2_scale) * sum_k W[b,q,h,k] * Vref_b[k,d]).
        result aliases out_after and the original input out; workspace_buffer is not an output.
    golden_reference:
      source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_prefill/reference.py::Model.forward
      tolerance:
        result: Elementwise |actual - reference| <= 0.06 + 0.04 * |reference|.
        out_after: Elementwise |actual - reference| <= 0.06 + 0.04 * |reference|; corresponds to mutated_inputs.out.
  hardware_specification:
    device: NVIDIA L20D
    arch: SM103
    execution: {warp: '<hardware-execution@pending:L20D/warp>', CTA: '<hardware-execution@pending:L20D/CTA>', cluster: '<hardware-execution@pending:L20D/cluster>'}
    feature:
      SMEM: <hardware-feature@pending:L20D/SMEM>
      TMEM: <hardware-feature@pending:L20D/TMEM>
      register: <hardware-feature@pending:L20D/register>
      TMA: <hardware-feature@pending:L20D/TMA>
      tcgen05.mma: <hardware-feature@pending:L20D/tcgen05.mma>
      mbarrier: <hardware-feature@pending:L20D/mbarrier>
      setmaxnreg: <hardware-feature@pending:L20D/setmaxnreg>
      cp.async: <hardware-feature@pending:L20D/cp.async>
      PDL: <hardware-feature@pending:L20D/PDL>
    stack:
      language: Python with CuTe DSL, nvidia-cutlass-dsl==4.6.1.
      toolchain: torch>=2.9; cuda-python; CUDA Toolkit <toolchain-version@pending:CUDA-Toolkit>; Python and cuda-python versions
        are unpinned in requirements.txt.
    wiki:
      hardware: <wiki-hardware@pending:L20D/SM103.md>
      programming: {language: '<wiki-language@pending:CuTe-DSL/4.6.1/>', virtual_isa: '<wiki-virtual-isa@pending:PTX/pending/>',
        machine_isa: '<wiki-machine-isa@pending:SASS/SM103/>'}
      microbench: <wiki-microbench@pending:L20D/>
      sota: {kernel: '<wiki-sota-kernel@pending:L20D/>', schema: '<wiki-sota-schema@pending:L20D/>'}
      profile: <wiki-profile@pending:NVIDIA/>
design:
  math_reshape:
    thesis: Pack all sixteen heads into query rows and stream page-backed KV through lagged-max online softmax with offset
      FP8 probabilities.
    rewrite:
    - step: '1'
      name: Pack heads and expose page-backed blocks
      math: |-
        For query block m in request b, 0<=r<M and 0<=d<D, let u=floor(r/Hq), h=r%Hq and q=16*m+u.
        Qc(b,m)[r,d]=query[cum_seq_lens_q[b]+q,h,d] for q<Qlen_b; inactive rows are excluded from all row-wise results below.
        For 0<=k<Bk, let kglobal=Bk*sigma(i)+k and p=floor(kglobal/PageSize).
        Use pg=block_tables[b,p] if p*PageSize<L_b, otherwise block_tables[b,floor(Bk*sigma(i)/PageSize)], repeating this block's first page.
        Kc(b,i)[k,d]=kv_cache[pg,0,0,kglobal % PageSize,d].
        Vc(b,i)[k,d]=kv_cache[pg,1,0,kglobal % PageSize,d].
        These are block views, not a materialized full-cache gather.
        A valid packed row sees key k exactly when kglobal<L_b and kglobal<=L_b-Qlen_b+16*m+floor(r/Hq).
        Visit local block indices i=0..N-1 in ascending order.
      symbol:
        M: {meaning: Packed query rows per attention worktile., binding: 'bind:design.work_schedule::M'}
        Bk: {meaning: Keys per local attention iteration., binding: 'bind:design.work_schedule::Bk'}
        sigma: {meaning: Local iteration to request-relative KV-block index., binding: 'bind:design.work_schedule::sigma'}
        N: {meaning: Number of KV blocks in this worktile., binding: 'bind:design.work_schedule::N'}
        Qc: {meaning: Packed query block., shape: [{row: M}, {channel: D}], dtype: fp8_e4m3fn, life: 'stored (b,m)'}
        Kc: {meaning: Page-backed key block., shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn}
        Vc: {meaning: Page-backed value block., shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn}
    - step: '2'
      name: Form scores with two channel contractions
      math: |-
        S(i,0)=mm32(Qc[:,0:128],transpose(Kc(i)[:,0:128])).
        S(i,1)=mma32(Qc[:,128:256],transpose(Kc(i)[:,128:256]),S(i,0)).
        X(i)[r,k]=S(i,1)[r,k] for visible keys, and -inf otherwise.
        Blocks with sigma(i)<floor((L_b-Qlen_b+16*m)/Bk) have no causal or KV-tail mask;
        remaining blocks apply the row-dependent causal bound and the KV tail bound.
      symbol:
        S: {meaning: Raw score accumulator after channel half d., shape: [{row: M}, {key: Bk}], dtype: fp32}
        X: {meaning: Scores after the visibility mask., shape: [{row: M}, {key: Bk}], dtype: fp32}
    - step: '3'
      name: Lagged online normalization with FP8 probabilities
      math: |-
        c=fp32(bmm1_scale*log2(e)). Fix (b,m) and omit these instance indices below.
        Initialize mhat(-1)[r]=-inf and ell(-1)[r]=0.
        For each row and i, a=max(mhat(i-1)[r],max_k X(i)[r,k]); safe=0 if a=-inf, otherwise a.
        delta=mhat(i-1)[r]-safe; keep=(c*delta>=-tau).
        mhat(i)[r]=mhat(i-1)[r] if keep, otherwise a; base(i)[r]=mhat(i-1)[r] if keep, otherwise safe.
        alpha(i)[r]=1 if keep, otherwise exp2_fast(c*delta).
        E(i)[r,k]=exp2_fast(fma32(c,X(i)[r,k],offset-c*base(i)[r])); invisible keys have E=0.
        P(i)[r,k]=fp8_e4m3fn(E(i)[r,k]).
        ell(i)[r]=alpha(i)[r]*ell(i-1)[r]+sum_k E(i)[r,k].
        Stats(i)[r,0]=alpha(i)[r]. The denominator uses E before FP8 conversion.
      symbol:
        c: {meaning: Base-two softmax scale., shape: [], dtype: fp32}
        tau: {meaning: Maximum lag in base-two score units., value: 4}
        offset: {meaning: Base-two exponent offset before FP8 conversion., value: 4}
        mhat: {meaning: Lagged raw-score maximum., shape: [{row: M}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        base: {meaning: 'Finite normalization base, including the all-masked guard.', shape: [{row: M}], dtype: fp32}
        alpha: {meaning: Numerator and denominator correction factor., shape: [{row: M}], dtype: fp32}
        E: {meaning: Unrounded exponentials., shape: [{row: M}, {key: Bk}], dtype: fp32}
        P: {meaning: Quantized unnormalized probabilities., shape: [{row: M}, {key: Bk}], dtype: fp8_e4m3fn}
        ell: {meaning: Unquantized online denominator., shape: [{row: M}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        Stats: {meaning: Shared correction factor., shape: [{row: M}, {stat: 1}], dtype: fp32}
      arithmetic:
        approx: 'exp2_fast uses native fast exp2 on SM103; masked -inf maps to zero. unknown: the source supplies no standalone
          error bound; <numeric-bound@pending:SM103/fast-exp2>. FP8 rounding is explicit in P.'
        accumulate: 'For the denominator, form half_alpha=alpha*0.5 in FP32, then seed both components of one packed pair with
          ell(i-1)*half_alpha. Add the grouped E sums in FP32 packed pairs and finally add the two components; the mathematical
          recurrence does not prescribe a scalar summation order.'
    - step: '4'
      name: Carry the numerator and normalize the local reduction
      math: |-
        Fix (b,m); initialize Y(-1)[r,d]=0.
        Yscaled(i)[r,d]=alpha(i)[r]*Y(i-1)[r,d].
        For e in {0,1}, Y(i)[:,128*e:128*(e+1)]=mma32(P(i),Vc(i)[:,128*e:128*(e+1)],Yscaled(i)[:,128*e:128*(e+1)]).
        After the final block, invell[r]=1/ell(N-1)[r] when ell is nonzero and not NaN, otherwise zero.
        Oblock[r,d]=bf16(Y(N-1)[r,d]*invell[r]).
        Store valid rows into out by undoing r=h+Hq*u; bmm2_scale=1. Return out; no LSE is emitted.
      symbol:
        Y: {meaning: Online FP32 numerator., shape: [{row: M}, {channel: D}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        Yscaled: {meaning: Corrected numerator before PV accumulation., shape: [{row: M}, {channel: D}], dtype: fp32}
        Oblock: {meaning: Final valid-row output block., shape: [{row: M}, {channel: D}], dtype: bf16}
    ledger:
      baseline: Materialize FP32 scores and probabilities for every request, with each query head handled separately.
      traffic:
      - item: KV reuse across query heads
        change: One packed 16-head row tile consumes each KV block once, versus 16 separate head tiles.
        by: ['1']
      footprint:
      - item: Full score and probability arrays
        change: Remove 8*Hq*sum_b(Qlen_b*L_b) bytes of invocation-wide FP32 score/probability materialization; retain block-local
          data and M*(D+2) FP32 recurrent scalars per active worktile.
        by: ['1', '3', '4']
      error:
      - item: PV multiplicand precision
        change: Reduce probability multiplicands from 32 to 8 bits; the denominator remains FP32 and the numerator includes
          FP8 rounding.
        by: ['3', '4']
  work_schedule:
    thesis: Reuse persistent two-CTA clusters over folded flattened query work. Keep ragged request segments ordered by KV
      length.
    flow:
      launch:
      - phase: [attention]
    phase:
      attention:
        describe: Produce the final BF16 output. A persistent cluster processes several query tiles.
        decomposition:
          strategy: |-
            M=256 packed rows and Bk=128 keys: one worktile covers 16 query tokens and all Hq heads of one request.
            Nfull=min(ceil(L_b/Bk),ceil((L_b-Qlen_b+16*(m+1))/Bk)).
            N=Nfull and sigma(i)=i; KV is a sequential local reduction.
            Let C_b=ceil(Qlen_b/16) and Cpad=ceil((TotalQ+15*(BatchCount-1))/16).
            Flatten request segments of C_b query clusters into Cpad logical positions; both cluster members reject the padded tail before pipeline actions.
          partition:
            cluster_tile: {size: Cpad, tile: 1}
          worktile:
            invariant:
              Qc: {shape: [{row: M}, {channel: D}], dtype: fp8_e4m3fn}
            iteration:
              Kc: {shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn, direction: ascending}
              Vc: {shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              Oblock: {shape: [{row: M}, {channel: D}], dtype: bf16}
        mapping:
          strategy: |-
            SMCount is the runtime device multiprocessor count.
            Cluster rank a owns packed rows [128*a,128*(a+1)); only rank zero issues the pair MMA.
            For each QK channel half, rank a supplies keys [64*a,64*(a+1)).
            For each PV output-channel half, rank a supplies its 64-channel half of V.
          worker: {unit: CTA, count: 2}
          placement: {unit: cluster, count: 1}
          count: ceil(min(SMCount,2*Cpad)/2)
          member:
          - row: [0, 128]
          - row: [128, 256]
        schedule:
          strategy: |-
            Order request segments by descending seq_lens with the source's fixed compare-swap network.
            Within a segment of C_b clusters, ordinal j maps to m=2*j for j<ceil(C_b/2), otherwise m=2*(C_b-1-j)+1.
            Build the request-id/prefix map once per CTA and reuse it across worktiles.
            Physical CTA x belongs to worker_id=floor(x/2); each cluster advances by worker_count in the flattened sequence, without dynamic work stealing.
          worktile_order:
          - {by: cluster_tile, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: worker_count}
            refill: none
            exit: The next flattened position is outside Cpad; padded positions perform no computation.
  tile_pipeline:
    thesis: Overlap independent K and V TMA producers with pair-MMA and softmax/correction. Two aliased score/probability
      slots let QK lead PV by one block; the single numerator passes between MMA and correction. Keep rings live across persistent
      worktiles.
    phase:
      attention:
        domain:
          t: worktile
          i: [0, N]
          n:
            flatten: [t, i]
          later: [1, 'max(1,N)']
          d: [0, 2]
        resource:
          Query:
            space: SMEM
            shape: [{row: 128}, {channel: 128}]
            dtype: fp8_e4m3fn
            slot: 2
            view:
              Qc(t,d): {slot: d}
          KeyRing:
            space: SMEM
            shape: [{key: 64}, {channel: 128}]
            dtype: fp8_e4m3fn
            slot: 4
            view:
              Kc(n,d): {slot: (2*n+d) % 4}
          ValueRing:
            space: SMEM
            shape: [{key: 128}, {channel: 64}]
            dtype: fp8_e4m3fn
            slot: 4
            view:
              Vc(n,d): {slot: (2*n+d) % 4}
          ScoreProbability:
            space: TMEM
            shape: [{row: 128}, {column: 128}]
            dtype: fp32
            slot: 2
            view:
              S(n,d): {slot: n % 2}
              P(n): {slot: n % 2, part: {column: [0, 32]}, dtype: fp8_e4m3fn}
              Stats(n): {slot: n % 2, part: {column: [32, 33]}}
          Numerator:
            space: TMEM
            shape: [{row: 128}, {channel: D}]
            dtype: fp32
            view:
              Y(n): {part: {channel: [0, 256]}}
              Yscaled(n): {part: {channel: [0, 256]}}
          Denominator:
            space: SMEM
            shape: [{row: 128}]
            dtype: fp32
            view:
              ell(t): {part: {row: [0, 128]}}
          OutputStage:
            space: SMEM
            shape: [{row: 128}, {channel: 128}]
            dtype: bf16
            view:
              Oblock(t,d): {part: {channel: [0, 128]}}
          OnlineState:
            space: register
            shape: [{row: 128}, {state: 2}]
            dtype: fp32
            view:
              mhat(n): {part: {state: [0, 1]}}
              ell(n): {part: {state: [1, 2]}}
          RequestMap:
            space: SMEM
            shape: [{element: 36}]
            dtype: int32
        lane:
          LoadQK:
            info:
              member: warp[9:10]
              mode: async
              register: 32
              verb:
                load: Issue native page-64 TMA into the member-local operand slice; done makes it visible to the pair MMA.
                  Each K channel half uses one 64-token page per member; Q remains resident for the whole KV traversal.
            pipe:
              repeat: t
              steady:
              - repeat: d
                steady: ['load:Qc(t,d)']
              - repeat: n[t]
                steady:
                - repeat: d
                  steady: ['load:Kc(n,d)']
            edge:
              reuse:
                load:Kc(n,d): ['MMA/qk:S(n-2,d)']
                load:Qc(t+1,d): ['MMA/qk:S(n[t,last(i)],d)']
          LoadV:
            info:
              member: warp[10:11]
              mode: async
              register: 32
              verb: {load: Issue two page-64 TMA transfers for a member-local V slice; done covers both. Missing second-page
                  payload is irrelevant because its keys are masked.}
            pipe:
              repeat: t
              steady:
              - repeat: n[t]
                steady:
                - repeat: d
                  steady: ['load:Vc(n,d)']
            edge:
              reuse:
                load:Vc(n,d): ['MMA/pv:Y(n-2,d)']
          MMA:
            info:
              member: CTA[0].warp[8:9]
              mode: ordered
              register: 32
              verb:
                qk: Issue the channel-half contraction in rewrite 2; d=0 initializes S and d=1 accumulates. Completion returns
                  the K slice, and the last QK returns its Q slice. Ordered pair-MMA reads of earlier P finish before later
                  QK overwrites its aliased TMEM slot.
                pv: Issue the output-channel-half contraction in rewrite 4; the first block initializes Y and later blocks
                  use Yscaled. Completion returns the V slice; d=1 publishes the full numerator and returns P.
            pipe:
              repeat: t
              steady:
              - repeat: d
                steady: ['qk:S(n[t,0],d)']
              - repeat: n[t,1:]
                steady:
                - repeat: d
                  steady: ['qk:S(n,d)']
                - repeat: d
                  steady: ['pv:Y(n-1,d)']
              - repeat: d
                steady: ['pv:Y(n[t,last(i)],d)']
            edge:
              data:
                qk:S(n,d): ['LoadQK/load:Qc(t,d)', 'LoadQK/load:Kc(n,d)']
                pv:Y(n,d): ['Softmax/publish:P(n)', 'LoadV/load:Vc(n,d)']
                pv:Y(n[t,later],d): ['Correction/rescale:Yscaled(n[t,later])']
              reuse:
                qk:S(n,0): ['Softmax/capture:S(n-2,1)']
              sync:
                pv:Y(n[t,0],0): ['Correction/release:Y(t-1)']
          Softmax:
            info:
              member: warp[0:4]
              register: 256
              verb:
                capture: Read scores into registers and return the score slot before masking or exponentiation. Native TMEM
                  load-reduce supplies the maximum only for the unmasked prefix; boundary blocks reduce after masking.
                compute: Apply rewrite 3; reset mhat and ell for each worktile. Use native exp2 for every probability on SM103.
                  Compute alpha once and send the same FP32 value to correction.
                publish: Publish Stats before the whole FP8 P block; update the denominator from unrounded E after publishing
                  P. The final ell publication supplies correction.
            pipe:
              repeat: t
              steady:
              - repeat: n[t]
                steady: ['capture:S(n,1)', 'compute:Stats(n)', 'publish:Stats(n)', 'compute:P(n)', 'publish:P(n)', 'compute:ell(n)']
              - publish:ell(t)
            edge:
              data:
                capture:S(n,1): ['MMA/qk:S(n,1)']
              reuse:
                publish:Stats(n): ['Correction/capture:Stats(n-2)']
                publish:P(n): ['MMA/pv:Y(n-2,1)']
                publish:ell(t): ['Correction/capture:ell(t-1)']
          Correction:
            info:
              member: warp[4:8]
              register: 160
              verb:
                capture: Copy nonfirst-block Stats or the final denominator into registers and return its slot. First-block
                  Stats is acknowledged without reading its payload.
                rescale: Read alpha directly from the one-column Stats payload. After the previous PV, apply Yscaled and return
                  ownership to MMA. A warp-wide no-alpha-below-one vote skips TMEM rewriting while retaining the handshake.
                publish: Read one numerator channel half, normalize, convert to BF16 and stage it in OutputStage; done covers
                  all correction warps.
                store: Coalesced valid-row stores undo head packing; done includes source reads and the correction-group barrier
                  before OutputStage reuse.
                release: All numerator reads for this worktile are complete; the next worktile may initialize Y while the
                  final staged half is still being stored.
            pipe:
              repeat: t
              steady:
              - capture:Stats(n[t,0])
              - repeat: n[t,1:]
                steady: ['capture:Stats(n)', 'rescale:Yscaled(n)']
              - capture:ell(t)
              - publish:Oblock(t,0)
              - store:Oblock(t,0)
              - publish:Oblock(t,1)
              - release:Y(t)
              - store:Oblock(t,1)
            edge:
              data:
                rescale:Yscaled(n[t,later]): ['MMA/pv:Y(n[t,later-1],1)']
                publish:Oblock(t,0): ['MMA/pv:Y(n[t,last(i)],1)']
realization:
  require:
  - item: design.tile_pipeline::attention.MMA
    choice: Use two-CTA tcgen05 MMA with cumulative completion, including earlier-PV-read-before-later-QK-write ordering on
      aliased S/P storage.
    reason: The two TMEM slots and operand returns require this ordering.
  - item: ['design.tile_pipeline::attention.LoadQK', 'design.tile_pipeline::attention.LoadV']
    choice: Use native page-64 TMA descriptors for HND FP8 cache pages and descriptor views for Q; keep K and V in physically
      separate SMEM allocations.
    reason: Independent producers and distinct physical rings permit K and V traffic to progress separately.
  - item: design.tile_pipeline::attention
    choice: Launch 384 threads per CTA; implement the lane register budgets with setmaxnreg and reserve one contiguous
      512-column two-CTA TMEM allocation for ScoreProbability and Numerator.
    reason: Idle warps also relinquish registers; the two TMEM resources share one allocator lifetime.
