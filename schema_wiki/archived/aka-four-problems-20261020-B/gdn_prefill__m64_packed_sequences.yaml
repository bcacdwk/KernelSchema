meta_data:
  name: gated_delta_rule_prefill
  describe: Apply gated delta updates to packed variable-length sequences and overwrite the supplied output and final-state buffers.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/gdn_prefill/aka_solution/solution.py::Model.forward
  version: 1
  dispatch:
    id: gdn_prefill.m64_packed_sequences
    when: >
      SM103; B=cu_seqlens.numel()-1 and 2 <= B <= 16; all sequence lengths are positive and T<=16384.
      q and k are BF16 [T,4,128], v and output are BF16 [T,32,128], alpha and beta are FP32 [T,32],
      initial_state and output_state are present FP32 [B,32,128,128]; scale=1/sqrt(128).
      The selected Model.forward forces M64 and exposes neither checkpoints nor state-pool indices.
contract:
  algorithm_requirement:
    constant:
      HQ: {value: 4, meaning: Query and key head count.}
      HV: {value: 32, meaning: Value and recurrent-state head count.}
      DK: {value: 128, meaning: Key dimension.}
      DV: {value: 128, meaning: Value dimension.}
      epsilon: {value: 1.0e-10, meaning: Additive stabilizer before the logarithm of the linear decay.}
    input:
      q: {meaning: Unnormalized queries, shape: [token: T, head: HQ, dk: DK], dtype: bf16}
      k: {meaning: Keys normalized before the timed call, shape: [token: T, head: HQ, dk: DK], dtype: bf16}
      v: {meaning: Values, shape: [token: T, head: HV, dv: DV], dtype: bf16}
      alpha: {meaning: Linear decay factors, shape: [token: T, head: HV], dtype: fp32, range: "0 <= alpha < 1"}
      beta: {meaning: Delta-update strengths, shape: [token: T, head: HV], dtype: fp32, range: "0 <= beta < 1"}
      initial_state: {meaning: Always-present state in value-by-key order, shape: [batch: B, head: HV, dv: DV, dk: DK], dtype: fp32}
      cu_seqlens: {meaning: Exclusive packed-sequence offsets, shape: [boundary: B+1], dtype: int64, range: "Starts at 0, strictly increases, ends at T; 1 <= B <= 16 and T <= 16384."}
      scale: {meaning: Python floating-point output scale, shape: [], dtype: fp64, range: "scale = 1/sqrt(DK)"}
      output: {meaning: Preallocated output buffer, shape: [token: T, head: HV, dv: DV], dtype: bf16, range: "Any BF16 bit pattern including NaN; previous contents ignored."}
      output_state: {meaning: Preallocated final-state buffer, shape: [batch: B, head: HV, dv: DV, dk: DK], dtype: fp32, range: "Any FP32 bit pattern including NaN; previous contents ignored."}
    output:
      O: {meaning: Returned first tensor; aliases and fully overwrites output, shape: [token: T, head: HV, dv: DV], dtype: bf16}
      S_final: {meaning: Returned second tensor; aliases and fully overwrites output_state, shape: [batch: B, head: HV, dv: DV, dk: DK], dtype: fp32}
    compute:
      - name: Advance each independent value-head state before readout
        math: |
          All tensor inputs and output buffers are contiguous CUDA tensors.
          For 0 <= b < B and 0 <= h < HV, let L_b=cu_seqlens[b+1]-cu_seqlens[b]
          and hq=floor(h/(HV/HQ)). Initialize State(-1)=initial_state[b,h,:,:].
          For 0 <= t < L_b, 0 <= j < DV and 0 <= d < DK, let x=cu_seqlens[b]+t:
            StateDecay(t)[j,d] = (alpha[x,h]+epsilon)*State(t-1)[j,d].
            delta(t)[j] = beta[x,h]*(v[x,h,j]-sum_d k[x,hq,d]*StateDecay(t)[j,d]).
            State(t)[j,d] = StateDecay(t)[j,d]+delta(t)[j]*k[x,hq,d].
            O[x,h,j] = bf16(scale*sum_d State(t)[j,d]*q[x,hq,d]).
          S_final[b,h,:,:] = State(L_b-1).
          The reference promotes q, k and v to FP32 and evaluates its chunked rule
          with block_size=32. Q and K are not normalized inside this operation.
          The timed Model.forward includes conversion of cu_seqlens to int32;
          input construction, key normalization, prefix-state generation and output allocation are outside.
        symbol:
          State: {meaning: Per-token updated state, shape: [batch: B, head: HV, dv: DV, dk: DK], dtype: fp32}
          StateDecay: {meaning: State after applying the current decay, shape: "ref:State.shape", dtype: fp32}
          delta: {meaning: Delta update vector, shape: [batch: B, head: HV, dv: DV], dtype: fp32}
    golden_reference:
      source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/gdn_prefill/reference.py::Model.forward
      tolerance:
        O: "atol=0.01, rtol=0.01; check the returned tensor and mutated_inputs.output."
        S_final: "atol=0.005, rtol=0.001; check the returned tensor and mutated_inputs.output_state."
  hardware_specification:
    device: NVIDIA L20D
    arch: SM103
    execution: {warp: '<hardware-execution@pending:L20D/warp>', CTA: '<hardware-execution@pending:L20D/CTA>', cluster: '<hardware-execution@pending:L20D/cluster>'}
    feature:
      SMEM: <hardware-feature@pending:L20D/SMEM>
      TMEM: <hardware-feature@pending:L20D/TMEM>
      register: <hardware-feature@pending:L20D/register>
      TMA: <hardware-feature@pending:L20D/TMA>
      tcgen05.mma: <hardware-feature@pending:L20D/tcgen05.mma>
      mbarrier: <hardware-feature@pending:L20D/mbarrier>
      setmaxnreg: <hardware-feature@pending:L20D/setmaxnreg>
      cp.async: <hardware-feature@pending:L20D/cp.async>
      PDL: <hardware-feature@pending:L20D/PDL>
    stack:
      language: CuTe DSL, nvidia-cutlass-dsl[cu13]>=4.5.0
      toolchain: CuTe DSL bundled compiler; torch>=2.9 and cuda-python>=13.0; <toolchain@pending:resolved-package-and-CUDA-versions>
    wiki:
      hardware: "<wiki-hardware@pending:L20D/SM103.md>"
      programming:
        language: "<wiki-language@pending:CuTe-DSL/pending/>"
        virtual_isa: "<wiki-virtual-isa@pending:PTX/pending/>"
        machine_isa: "<wiki-machine-isa@pending:SASS/SM103/>"
      microbench: "<wiki-microbench@pending:L20D/>"
      sota:
        kernel: "<wiki-sota-kernel@pending:L20D/>"
        schema: "<wiki-sota-schema@pending:L20D/>"
      profile: "<wiki-profile@pending:NVIDIA/>"
design:
  math_reshape:
    thesis: >
      Replace token-by-token state updates with chunk matrix products and a hierarchical
      unit-triangular inverse. Carry the state in FP32 while narrowing matrix operands
      to BF16, paying local quadratic work and explicit rounding to shorten the recurrent chain.
    rewrite:
      - step: chunk
        name: Pad each sequence to complete chunk pairs
        math: |
          Cu32 = int32(cu_seqlens).
          For each (b,h), let hq=floor(h/(HV/HQ)), L_b=Cu32[b+1]-Cu32[b],
          and Np=2*ceil(L_b/(2*C)). For 0 <= c < Np and 0 <= i < C,
          x=Cu32[b]+c*C+i. If c*C+i<L_b:
            Q(c)[i,:]=q[x,hq,:]; K(c)[i,:]=k[x,hq,:]; V(c)[i,:]=v[x,h,:];
            Alpha(c)[i]=alpha[x,h]; Beta(c)[i]=beta[x,h].
          Otherwise Q(c)[i,:]=K(c)[i,:]=V(c)[i,:]=0, Alpha(c)[i]=1 and Beta(c)[i]=0.
          S(-1)=initial_state[b,h,:,:].
        symbol:
          C: {meaning: Mathematical chunk length, value: 64}
          Cu32: {meaning: Exact compact sequence offsets, shape: [boundary: B+1], dtype: int32, life: stored invocation}
          Np: {meaning: Even padded chunk count for the current sequence.}
          Q: {meaning: Query chunk, shape: [token: C, dk: DK], dtype: bf16}
          K: {meaning: Key chunk, shape: [token: C, dk: DK], dtype: bf16}
          V: {meaning: Value chunk, shape: [token: C, dv: DV], dtype: bf16}
          Alpha: {meaning: Neutral-padded decay chunk, shape: [token: C], dtype: fp32}
          Beta: {meaning: Zero-padded update strength, shape: [token: C], dtype: fp32}
          S: {meaning: State at successive chunk boundaries, shape: [dv: DV, dk: DK], dtype: fp32, life: "carried (b,h); c=-1..Np-1"}
      - step: inverse
        name: Form a BF16 inverse by recursive block merging
        math: |
          For each chunk c, omit c on the right-hand side:
            G[i] = sum32_{j=0}^{i} log2_fast(Alpha[j]+epsilon).
            Gamma[i] = exp2_fast(G[i]).
            W[i,j] = exp2_fast(G[i]-G[j]) if j<=i; otherwise 0.
            KK = mm32(K,Kᵀ).
            A[i,j] = bf16(KK[i,j]*W[i,j]*Beta[i]).
          For each diagonal 8x8 block a, initialize F[r,s]=fp32(A[8*a+r,8*a+s]) for s<r,
          F[r,r]=1 and F[r,s]=0 for s>r, with 0<=r,s<8.
          In FP32, for pivots p=0..6 and each row r>p:
            w=-F[r,p]; F[r,s]=F[r,s]+w*F[p,s] for s<p; F[r,p]=w.
          Round each completed diagonal block to BF16.
          For block widths 16, 32 and 64, merge inverse diagonal halves IL and IR
          with the original lower-left block Aoff:
            Ioff = bf16(mm32(bf16(-mm32(IR,Aoff)),IL)).
          The upper half is zero. With the resulting inverse I:
            Tinv[i,j] = bf16(I[i,j]*Beta[j]).
        symbol:
          G: {meaning: Inclusive base-two log-decay prefix, shape: [token: C], dtype: fp32}
          Gamma: {meaning: Inclusive decay product, shape: [token: C], dtype: fp32}
          W: {meaning: Lower-triangular within-chunk decay ratios reused for two products, shape: [token: C, source_token: C], dtype: fp32, life: "stored (b,h,c)"}
          KK: {meaning: Key Gram matrix, shape: [token: C, source_token: C], dtype: fp32}
          A: {meaning: BF16 weighted Gram matrix and in-place inverse workspace, shape: [token: C, source_token: C], dtype: bf16}
          Tinv: {meaning: BF16 unit-triangular inverse with column beta scaling, shape: [token: C, source_token: C], dtype: bf16}
        arithmetic:
          approx: "log2_fast and exp2_fast use the implementation's approximate FP32 functions; unknown: <error-bound@pending:gdn_prefill/log2-exp2>."
          accumulate: >
            Prefix sums scan each 32-element half in FP32 and add the first half's total
            into the second half. Inverse diagonal elimination is FP32; all merge operands
            are BF16 with the two explicit rounding points shown above.
      - step: chunk_recurrence
        name: Reuse state products for output and the next chunk
        math: |
          For each chunk c, omit c from local values:
            QK = mm32(Q,Kᵀ).
            Bmat = bf16(QK ⊙ W * fp32(scale)).
            Sbar = bf16(S(c-1)); Sdec = Gamma[C-1]*S(c-1).
            KS = mm32(Sbar,Kᵀ); QS = mm32(Sbar,Qᵀ).
            R = bf16(Vᵀ-bf16(KS ⊙ Gamma[None,:])).
            U = mm32(R,Tinvᵀ).
            Ubar = bf16(U).
            Decay[i] = exp2_fast(G[C-1]-G[i]).
            Udec = bf16(U ⊙ Decay[None,:]).
            QSscaled = QS ⊙ Gamma[None,:] * fp32(scale).
            Y = mma32(Ubar,Bmatᵀ,QSscaled).
            S(c) = mma32(Udec,K,Sdec).
          For c*C+i<L_b, O[Cu32[b]+c*C+i,h,:]=bf16(Y[:,i]).
          S_final[b,h,:,:]=S(Np-1).
        symbol:
          QK: {meaning: Query-key product, shape: [token: C, source_token: C], dtype: fp32}
          Bmat: {meaning: Causal decay-weighted and output-scaled query-key product, shape: [token: C, source_token: C], dtype: bf16}
          Sbar: {meaning: BF16 snapshot of the incoming state before decay, shape: [dv: DV, dk: DK], dtype: bf16}
          Sdec: {meaning: FP32 incoming state scaled to the end of the chunk, shape: [dv: DV, dk: DK], dtype: fp32}
          KS: {meaning: Incoming-state key projections, shape: [dv: DV, token: C], dtype: fp32}
          QS: {meaning: Incoming-state query projections, shape: [dv: DV, token: C], dtype: fp32}
          R: {meaning: BF16 value residual after separately rounding the state projection, shape: [dv: DV, token: C], dtype: bf16}
          U: {meaning: Corrected value update before either BF16 conversion, shape: [dv: DV, token: C], dtype: fp32}
          Ubar: {meaning: BF16 update used for readout, shape: [dv: DV, token: C], dtype: bf16}
          Decay: {meaning: Remaining decay from each token to the chunk end, shape: [token: C], dtype: fp32}
          Udec: {meaning: Independently rounded decayed FP32 update used for state accumulation, shape: [dv: DV, token: C], dtype: bf16}
          QSscaled: {meaning: Rescaled incoming-state readout, shape: [dv: DV, token: C], dtype: fp32}
          Y: {meaning: FP32 output chunk before its BF16 store, shape: [dv: DV, token: C], dtype: fp32}
        arithmetic:
          approx: "exp2_fast follows step inverse."
    ledger:
      baseline: Direct FP32 token recurrence with the current DV-by-DK state retained locally and no global intermediate states.
      depth:
        - {item: State dependency per sequence and head, change: "L_b token updates become Np chunk updates, each covering C tokens including neutral padding.", by: [chunk, inverse, chunk_recurrence]}
      matmul:
        - {item: Chunk computation, change: "Adds seven dense matrix products and one C-by-C hierarchical triangular inverse per padded chunk; replaces L_b state projections and rank-one updates.", by: [inverse, chunk_recurrence]}
      footprint:
        - {item: Local intermediates, change: "Adds O(C*C + C*(DK+DV)) elements beyond the carried DV*DK FP32 state, independent of sequence length.", by: [inverse, chunk_recurrence]}
      error:
        - {item: Numerical path, change: "Introduces approximate logarithms/exponentials and BF16 inverse, state-projection and update operands; final state remains FP32.", by: [inverse, chunk_recurrence]}
  work_schedule:
    thesis: >
      Assign a persistent CTA to one sequence, value head and 64-value slice, keeping all
      chunk intermediates local. Splitting the value dimension doubles independent work
      while duplicating Q/K loads, Gram products and inverses across the two slices.
    flow:
      launch:
        - phase: [index_cast]
        - phase: [gdn]
          start_after: index_cast.kernel_done
      handoff:
        Cu32: {producer: index_cast, consumer: [gdn], storage: global}
    phase:
      index_cast:
        describe: Timed PyTorch conversion of packed-sequence offsets to int32.
        decomposition:
          partition:
            boundary: {size: B+1, tile: "<cast-tile@pending:PyTorch/to-int32>"}
          target:
            single_tile:
              Cu32: {shape: [boundary: "<cast-tile@pending:PyTorch/to-int32>"], dtype: int32}
        mapping:
          worker: {unit: CTA, count: 1}
          count: "<cast-grid@pending:PyTorch/to-int32>"
        schedule:
          worktile_order:
            - {by: boundary, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: "<cast-grid-stride@pending:PyTorch/to-int32>"}
            refill: none
            exit: assigned_done
      gdn:
        describe: Fused chunk inverse, readout and state recurrence for the BF16 M64 dynamic-descriptor branch, B>1.
        decomposition:
          strategy: >
            Each worktile traverses Np even-padded chunks in increasing order;
            chunk pairs share local inverse preparation. There is no global chunk workspace.
          partition:
            batch: {size: B, tile: 1}
            head: {size: HV, tile: 1}
            dv: {size: DV, tile: 64}
          worktile:
            invariant:
              Cu32: {shape: [boundary: 2], dtype: int32}
              initial_state: {shape: [dv: 64, dk: DK], dtype: fp32}
              scale: {shape: [], dtype: fp64}
            iteration:
              Q: {shape: [token: C, dk: DK], dtype: bf16, direction: ascending}
              K: {shape: [token: C, dk: DK], dtype: bf16, direction: ascending}
              V: {shape: [token: C, dv: 64], dtype: bf16, direction: ascending}
              Alpha: {shape: [token: C], dtype: fp32, direction: ascending}
              Beta: {shape: [token: C], dtype: fp32, direction: ascending}
          target:
            single_tile:
              O: {shape: [token: L_b, dv: 64], dtype: bf16}
              S_final: {shape: [dv: 64, dk: DK], dtype: fp32}
        mapping:
          strategy: P=min(B*HV*(DV/64), num_sm), where num_sm is read from the current device at runtime.
          worker: {unit: CTA, count: 1}
          count: P
        schedule:
          strategy: All roles follow the same static work sequence; buffer cursors continue across worktiles while the recurrent state is reinitialized from each tile's initial_state.
          worktile_order:
            - {by: batch, direction: ascending}
            - {by: head, direction: ascending}
            - {by: dv, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, step: P}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: >
      Two four-warp compute groups prepare inverses and recurrent-state operands while
      separate issuer warps drive their matrix products. Unequal input rings and early
      TMEM reads let these paths overlap; one scalar/output warp prefetches four chunks
      ahead and drains each single-slot output before reuse.
    phase:
      index_cast:
        lane:
          Convert:
            info:
              member: "<cast-lane@pending:PyTorch/to-int32>"
              verb:
                produce: "Convert assigned offsets exactly and expose Cu32 after completion; <cast-lowering@pending:PyTorch/to-int32>."
            pipe:
              prologue: [produce:Cu32]
      gdn:
        domain:
          t: worktile
          c: [0, Np]
          p: [0, Np/2]
          n: {flatten: [t, c]}
          m: {flatten: [t, p]}
        resource:
          Qring:
            space: SMEM
            shape: [token: C, dk: DK]
            dtype: bf16
            slot: 3
            view:
              Q(n): {slot: n%3}
          Kring:
            space: SMEM
            shape: [token: C, dk: DK]
            dtype: bf16
            slot: 4
            view:
              K(n): {slot: n%4}
          Vring:
            space: SMEM
            shape: [dv: 64, token: C]
            dtype: bf16
            slot: 2
            view:
              V(n): {slot: n%2}
          Tring:
            space: SMEM
            shape: [token: C, source_token: C]
            dtype: bf16
            slot: 3
            view:
              A(n): {slot: n%3}
              Tinv(n): {slot: n%3}
          Bring:
            space: SMEM
            shape: [token: C, source_token: C]
            dtype: bf16
            slot: 2
            view:
              Bmat(n): {slot: n%2}
          O:
            space: SMEM
            shape: [dv: 64, token: C]
            dtype: bf16
          Gring:
            space: SMEM
            shape: [token: C]
            dtype: fp32
            slot: 5
            view:
              G(n): {slot: n%5}
          GammaRing:
            space: SMEM
            shape: [token: C]
            dtype: fp32
            slot: 5
            view:
              Gamma(n): {slot: n%5}
          BetaRing:
            space: SMEM
            shape: [token: C]
            dtype: fp32
            slot: 5
            view:
              Beta(n): {slot: n%5}
          Wpair:
            space: register
            shape: [token: C, source_token: C]
            dtype: fp32
            slot: 2
            view:
              W(n): {slot: n%2}
          Arena:
            space: TMEM
            shape: [row: 128, column: 512]
            dtype: fp32
            view:
              S(n): {part: {column: [0, 128]}}
              Sdec(n): {part: {column: [0, 128]}}
              QS(n): {part: {column: [128, 192]}}
              QSscaled(n): {part: {column: [128, 192]}}
              Y(n): {part: {column: [128, 192]}}
              Sbar(n): {part: {column: [192, 256]}, dtype: bf16}
              KK(n): {part: {column: ["256+64*(n%2)", "320+64*(n%2)"]}}
              QK(n): {part: {column: ["256+64*(n%2)", "320+64*(n%2)"]}}
              KS(n): {part: {column: [384, 448]}}
              U(n): {part: {column: [384, 448]}}
              R(n): {part: {column: [448, 480]}, dtype: bf16}
              Ubar(n): {part: {column: [448, 480]}, dtype: bf16}
              Udec(n): {part: {column: [480, 512]}, dtype: bf16}
        lane:
          Load:
            info:
              member: warp[9:10]
              mode: async
              register: 24
              verb:
                prepare:
                  mode: sync
                  meaning: Bind Q/K/V descriptors to the current sequence end; out-of-range rows return zero, including the synthetic final chunk.
            pipe:
              repeat: t
              steady:
                - prologue: [prepare:InputDescriptor(t)]
                  steady:
                    - repeat: n[t]
                      steady: [load:K(n), load:Q(n), load:V(n)]
            edge:
              reuse:
                load:K(n+4): ["MMA0/mma:QK(n+1-n%2)@done", "MMA1/mma:S(n)@done"]
                load:Q(n+3): ["MMA0/mma:QK(n+1-n%2)@done", "MMA1/mma:QS(n)@done"]
                load:V(n+2): ["CG1/read:U(n)@done"]
          MMA0:
            info:
              member: warp[8:9]
              mode: ordered
              register: 24
              verb:
                mma: Issue the named upstream product into its FP32 TMEM slot with a fresh zero accumulator; completion covers all operand reads.
            pipe:
              repeat: t
              steady:
                - repeat: p
                  steady:
                    - mma:KK(n[t,2*p])
                    - mma:KK(n[t,2*p+1])
                    - mma:QK(n[t,2*p])
                    - mma:QK(n[t,2*p+1])
            edge:
              data:
                mma:KK(n): ["Load/load:K(n)@done"]
                mma:QK(n): ["Load/load:Q(n)@done", "Load/load:K(n)@done"]
              reuse:
                mma:KK(n): ["CG0/read:QK(n-2)@done"]
                mma:QK(n): ["CG0/read:KK(n)@done"]
          CG0:
            info:
              member: warp[0:4]
              register: 224
              verb:
                prepare: Form W for both chunks and retain it through both weighted QK publications; release G after the last read.
                capture: Keep both chunks' row beta in registers; column beta remains in its SMEM slot until Tinv publication.
                read: Copy the named TMEM accumulator to registers and release that TMEM slot immediately; subsequent arithmetic uses the register copy.
                invert: >
                  Perform the hierarchical inverse in-place for both chunks. Two warps per chunk
                  invert the 8x8 diagonal blocks; each warp handles one 16x16 diagonal block in
                  each chunk; two warps per chunk then form its two 32x32 diagonal blocks and
                  cooperate on the 64x64 merge. Synchronize this four-warp group between levels.
                publish: Tinv publication applies column beta and releases Beta; Bmat publication consumes the retained W and makes its SMEM slot available to MMA1.
            pipe:
              repeat: t
              steady:
                - repeat: p
                  steady:
                    - prepare:Pair(m[t,p])
                    - capture:BetaPair(m[t,p])
                    - read:KK(n[t,2*p])
                    - compute:A(n[t,2*p])
                    - read:KK(n[t,2*p+1])
                    - compute:A(n[t,2*p+1])
                    - invert:Pair(m[t,p])
                    - publish:Tinv(n[t,2*p])
                    - publish:Tinv(n[t,2*p+1])
                    - read:QK(n[t,2*p])
                    - publish:Bmat(n[t,2*p])
                    - read:QK(n[t,2*p+1])
                    - publish:Bmat(n[t,2*p+1])
            edge:
              data:
                prepare:Pair(m[t,p]): ["ScalarOutput/publish:Gate(n[t,2*p])@done", "ScalarOutput/publish:Gate(n[t,2*p+1])@done"]
                capture:BetaPair(m[t,p]): ["ScalarOutput/load:Beta(n[t,2*p])@done", "ScalarOutput/load:Beta(n[t,2*p+1])@done"]
                read:KK(n): ["MMA0/mma:KK(n)@done"]
                read:QK(n): ["MMA0/mma:QK(n)@done"]
              reuse:
                read:KK(n): ["MMA1/mma:U(n-3)@done"]
                read:QK(n): ["MMA1/mma:Y(n-2)@done"]
          MMA1:
            info:
              member: warp[10:11]
              mode: ordered
              register: 24
              verb:
                mma: >
                  Issue the named upstream product. KS, QS and U start from zero;
                  Y accumulates into QSscaled and S into Sdec. Ordered completion
                  covers earlier operand reads, allowing each shared TMEM accumulator
                  or operand slot to be reused after its consumer completes.
                  StateOperand, R, Ubar and Udec have separate input streams; Y and S
                  wait on the corresponding Ubar and Udec publications within UpdateOperand.
            pipe:
              repeat: t
              steady:
                - repeat: n[t]
                  steady: [mma:KS(n), mma:QS(n), mma:U(n), mma:Y(n), mma:S(n)]
            edge:
              data:
                mma:KS(n): ["CG1/publish:StateOperand(n)@done", "Load/load:K(n)@done", "Load/load:Q(n)@done"]
                mma:QS(n): ["CG1/publish:StateOperand(n)@done", "Load/load:Q(n)@done"]
                mma:U(n): ["CG1/publish:R(n)@done", "CG0/publish:Tinv(n)@done"]
                mma:Y(n): ["CG1/publish:UpdateOperand(n)@done", "CG1/rescale:QS(n)@done", "CG0/publish:Bmat(n)@done"]
                mma:S(n): ["CG1/publish:UpdateOperand(n)@done"]
              reuse:
                mma:QS(n): ["CG1/publish:O(n-1)@done"]
          CG1:
            info:
              member: warp[4:8]
              register: 256
              verb:
                load: Initialize the local FP32 S from this worktile's initial_state, including explicitly supplied all-zero states.
                publish: >
                  StateOperand snapshots Sbar before updating S in place to Sdec;
                  UpdateOperand publishes both Ubar and Udec from the same FP32 U;
                  O converts Y to BF16 in the sole output slot and releases its TMEM accumulator.
                compute: Capture Gamma and Decay in registers for the current chunk; release G and Gamma after their last read.
                read: Copy U to registers and release its TMEM accumulator and V slot before publishing the two update operands.
                rescale: Apply the upstream QSscaled formula in place and publish the FP32 accumulator for Y.
            pipe:
              repeat: t
              steady:
                - prologue: [load:initial_state(t)]
                  steady:
                    - repeat: n[t]
                      steady:
                        - publish:StateOperand(n)
                        - compute:Decay(n)
                        - publish:R(n)
                        - rescale:QS(n)
                        - read:U(n)
                        - publish:UpdateOperand(n)
                        - publish:O(n)
                  epilogue: [store:S_final(t)]
            edge:
              data:
                publish:StateOperand(n): ["ScalarOutput/publish:Gate(n)@done"]
                publish:StateOperand(n[t,c+1]): ["MMA1/mma:S(n[t,c])@done"]
                publish:R(n): ["MMA1/mma:KS(n)@done", "Load/load:V(n)@done"]
                rescale:QS(n): ["MMA1/mma:QS(n)@done"]
                read:U(n): ["MMA1/mma:U(n)@done"]
                publish:O(n): ["MMA1/mma:Y(n)@done"]
                store:S_final(t): ["MMA1/mma:S(n[t,Np-1])@done"]
              reuse:
                publish:O(n): ["ScalarOutput/release:O(n-1)@done"]
          ScalarOutput:
            info:
              member: warp[11:12]
              mode: async
              register: 24
              verb:
                prepare:
                  mode: sync
                  meaning: Bind the output descriptor to the current sequence end, suppressing stores of padded rows.
                publish:
                  mode: sync
                  meaning: Load Alpha to registers, form G and Gamma, and publish both to their paired SMEM slots; padded alpha is one.
                load: Copy Beta asynchronously to SMEM, with explicit zero for padded elements.
                store: Issue a bulk store of O to global memory; done denotes completion of its global writes.
                release:
                  mode: sync
                  meaning: Wait for the preceding bulk-store group, then return the single SMEM output slot.
            pipe:
              repeat: t
              steady:
                - prologue:
                    - prepare:OutputDescriptor(t)
                    - repeat: {j: [0, "min(4,Np)"]}
                      steady: ["publish:Gate(n[t,j])", "load:Beta(n[t,j])"]
                  steady:
                    - repeat: {j: [0, "max(Np-4,0)"]}
                      steady: ["publish:Gate(n[t,j+4])", "load:Beta(n[t,j+4])", "store:O(n[t,j])", "release:O(n[t,j])"]
                    - repeat: {j: ["max(Np-4,0)", Np]}
                      steady: ["store:O(n[t,j])", "release:O(n[t,j])"]
            edge:
              data:
                store:O(n): ["CG1/publish:O(n)@done"]
                release:O(n): ["ScalarOutput/store:O(n)@done"]
              reuse:
                publish:Gate(n[t,c]+5): ["CG0/prepare:Pair(m[t,floor(c/2)])@done", "CG1/compute:Decay(n[t,c])@done"]
                load:Beta(n+5): ["CG0/publish:Tinv(n)@done"]
realization:
  require:
    - item: [design.tile_pipeline::gdn.MMA0, design.tile_pipeline::gdn.MMA1]
      choice: CuTe tcgen05.mma with asynchronous completion signaling and TMEM accumulator access.
      reason: Supplies the ordered matrix-product completion and separate issuer/compute roles required by the TMEM handoffs.
    - item: design.tile_pipeline::gdn.CG0
      choice: BF16 warp-level mma.sync for the hierarchical inverse merges.
      reason: Keeps the inverse merges in the compute group's SMEM/register path while the two issuer warps use TMEM products independently.
    - item: [design.tile_pipeline::gdn.Load, design.tile_pipeline::gdn.ScalarOutput]
      choice: Per-worktile bounded TMA descriptors for Q/K/V and O; cp.async for Beta; cp_async_bulk_commit_group and cp_async_bulk_wait_group(0) before releasing O.
      reason: Supplies sequence-tail isolation and the asynchronous producer/consumer guarantees used by the input and output rings.
