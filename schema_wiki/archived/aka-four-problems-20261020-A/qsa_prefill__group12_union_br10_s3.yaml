meta_data:
  name: paged_sparse_grouped_query_attention
  describe: Paged sparse GQA with supplied token selection and a fused output gate.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/qsa_prefill/aka_solution/solution.py::Model.forward
  dispatch: group12_union_br10_s3
  version: 2
contract:
  algorithm_requirement:
    constant:
      R: {value: 4096, meaning: CP-local query row count.}
      H: {value: 24, meaning: Query head count.}
      Hkv: {value: 2, meaning: KV head count.}
      Group: {value: "H/Hkv", meaning: Query heads sharing one KV head.}
      D: {value: 256, meaning: Head dimension.}
      PageSize: {value: 128, meaning: Tokens per cache page.}
      Pages: {value: 2626, meaning: Physical cache page count.}
      TableWidth: {value: 2054, meaning: Logical page-table width.}
      W: {value: 2051, meaning: Selection slots before the appended valid-count word.}
    input:
      q: {meaning: Query, shape: [row: R, head: H, d: D], dtype: bf16}
      k_cache: {meaning: Paged keys., shape: [page: Pages, token: PageSize, head: Hkv, d: D], dtype: bf16, range: "Mapped pages are finite; unmapped locations may contain arbitrary bit patterns including NaN and infinity."}
      v_cache: {meaning: Paged values., shape: [page: Pages, token: PageSize, head: Hkv, d: D], dtype: bf16, range: "Mapped pages are finite; unmapped locations may contain arbitrary bit patterns including NaN and infinity."}
      logical_indices:
        meaning: W logical token indices followed by valid_count.
        shape: [row: R, packed: "W+1"]
        dtype: int32
        range: |
          For one invocation-wide CP rank rho in {0,1}, let c_r=floor((15*8192+rho*4096+r+1)/4) and t_r=(r+1)%4.
          The first 2048 slots are 512 quads 4*g+[0,1,2,3] with distinct 0<=g<c_r.
          logical_indices[r,2048+l]=4*c_r+l for 0<=l<t_r; selection slots 2048+t_r<=j<W are -1; logical_indices[r,W]=2048+t_r.
      block_table: {meaning: Request-to-physical-page lookup., shape: [request: 1, logical_page: TableWidth], dtype: int32, range: "block_table[0,p]=1352+p for 0<=p<1024; -1 otherwise"}
      token_to_req: {meaning: Request owning each query row., shape: [row: R], dtype: int32, range: [0, 0]}
      use_prefill_config: {meaning: Configuration hint with no mathematical effect., shape: [], dtype: bool, range: "true in the scored domain"}
      output_gate: {meaning: Per-output sigmoid gate logits., shape: [row: R, head: H, d: D], dtype: bf16}
      out: {meaning: Optional destination buffer; its initial contents are never read., shape: [row: R, head: H, d: D], dtype: bf16, range: "Arbitrary bit patterns, including NaN and infinity.", default: "allocate a new buffer with q.shape and q.dtype"}
    output:
      out_result: {meaning: Contents written in place to out and returned as that same tensor., shape: [row: R, head: H, d: D], dtype: bf16}
    compute:
      - name: Resolve the supplied selection and compute gated attention
        math: |
          The scored ABI requires contiguous logical_indices with a 16-byte-aligned base; output_gate and out have unit last-axis stride and outer element strides divisible by 8.
          K/V share one allocation and element strides [2157376,512,256,1]; v_cache starts 65536 BF16 elements after k_cache.
          Each row r and query head h is independent; let v = floor(h/Group), valid_count(r)=logical_indices[r,W].
          J(r) = {0,...,valid_count(r)-1}. For c in J(r), j=logical_indices[r,c], req=token_to_req[r], p=floor(j/PageSize).
          K(r,c,:) = k_cache[block_table[req,p],j%PageSize,v,:]; V(r,c,:) is the corresponding v_cache row.
          For c in J(r), score[c] = sum_{d=0}^{D-1} q[r,h,d]*K(r,c,d)/sqrt(D).
          z = max_{c in J(r)} score[c], E[c] = exp(score[c]-z), A[d] = bf16(sum_{c in J(r)} E[c]*V(r,c,d) / sum_{c in J(r)} E[c]).
          out_result[r,h,d] = bf16(A[d]/(1+exp(-output_gate[r,h,d]))).
          Write every element of out; other inputs are unchanged. No additional causal mask is applied.
          The timed boundary is the complete standalone attention-plus-gate callable, including union preprocessing and all main-kernel work.
        symbol:
          J: {meaning: Function returning the valid supplied selection slots of a row., shape: not_applicable, dtype: not_applicable}
          valid_count: {meaning: Function reading the appended valid-count word of a row., shape: not_applicable, dtype: not_applicable}
    golden_reference:
      source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/qsa_prefill/reference.py::Model.forward
      tolerance: {out_result: "Both the returned output and mutated out satisfy atol=3.2e-5, rtol=0.02."}
  hardware_specification:
    device: NVIDIA L20D
    arch: SM103
    execution: {CTA: "<hardware-execution@pending:L20D/CTA>", cluster: "<hardware-execution@pending:L20D/cluster>", warp: "<hardware-execution@pending:L20D/warp>"}
    feature: {memory: "<hardware-feature@pending:L20D/SMEM-TMEM-register>"}
    stack:
      language: CuTe DSL, nvidia-cutlass-dsl>=4.6.1
      toolchain: "nvidia-cutlass-dsl>=4.6.1; cuda-python>=13.0; torch>=2.9; <stack@pending:resolved_versions>"
    wiki:
      hardware: "<wiki-hardware@pending:Blackwell/L20D.md>"
      programming: {language: "<wiki-language@pending:CuTe-DSL/resolved-version/>", virtual_isa: "<wiki-virtual-isa@pending:PTX/version/>", machine_isa: "<wiki-machine-isa@pending:SASS/SM103/>"}
      microbench: "<wiki-microbench@pending:L20D/>"
      sota: {kernel: "<wiki-sota-kernel@pending:L20D/>", schema: "<wiki-sota-schema@pending:L20D/>"}
      profile: "<wiki-profile@pending:NVIDIA/>"
design:
  math_reshape:
    thesis: Deduplicate neighboring rows' selected four-token groups, then reuse one union traversal across their grouped heads. Online state removes global probabilities, at the cost of masked union products, a preprocessing workspace, and BF16 numerator operands.
    rewrite:
      - step: union
        name: Materialize row-block unions with per-row membership bits
        math: |
          Nb = ceil(R/Br), MaxEntry = Br*(floor(W/4)+1). Block b contains rows [b*Br,min((b+1)*Br,R)).
          Union[b] contains each distinct (req,g=floor(j/4)) selected by a valid slot of any row in b exactly once.
          Entry e stores (req,g,lo,hi); bit 4*r+l of the two-word mask is one iff local row r selects token 4*g+l.
          Count[b] is its entry count; Union has no sorting requirement.
          For each KV head v, pack (local row r, grouped query head h) as a=r*Group+h in Qpack.
          Qpack[a,:] = q[b*Br+r,v*Group+h,:] for active a. Inactive rows contain unspecified BF16 values, including possible NaN or infinity.
          N = ceil(Count[b]/Etile). In tile i, column u uses entry e=i*Etile+floor(u/4), token offset u%4.
          Kblk(i)[u,:] and Vblk(i)[u,:] gather that entry's page and token; e >= Count[b] rereads entry zero.
          selected(a,i,u) is the entry mask bit for a's row, and is false for e >= Count[b] or inactive a.
        symbol:
          Br: {meaning: Rows sharing a union., binding: "bind:design.work_schedule::Br"}
          M: {meaning: Packed query capacity., binding: "bind:design.work_schedule::M"}
          Bk: {meaning: Gathered tokens per local tile., binding: "bind:design.work_schedule::Bk"}
          Etile: {meaning: Union entries per local tile., binding: "bind:design.work_schedule::Etile"}
          Union: {meaning: Compacted request/group/membership entries., shape: [entry: MaxEntry, word: 4], dtype: int32, life: "stored (b)"}
          Count: {meaning: Number of occupied entries., shape: [], dtype: int32, life: "stored (b)"}
          Qpack: {meaning: Packed query rows and grouped heads., shape: [packed_query: M, d: D], dtype: bf16}
          Kblk: {meaning: Gathered key tile., shape: [kv: Bk, d: D], dtype: bf16}
          Vblk: {meaning: Gathered value tile., shape: [kv: Bk, d: D], dtype: bf16}
      - step: online
        name: Use a shared lagged reference and two half-tile denominators
        math: |
          For every packed row 0 <= a < M, including inactive rows, c = log2(e)/sqrt(D), m(-1)=-inf, L(-1)[0:2]=0.
          For 0 <= i < N, S(i)[u]=dot32(Qpack[a,:],Kblk(i)[u,:]), vmax(i)=c*max_{0<=u<Bk} S(i)[u].
          The maximum includes gathered columns masked from this row. first(a,i)=(m(i-1)==-inf); drift(a,i)=0 if first(a,i); otherwise vmax(i)-m(i-1).
          m(i)=vmax(i) if first(a,i) or move_ref(a,i); otherwise m(i-1). alpha=exp2_native(m(i-1)-m(i)) if move_ref(a,i); otherwise 1.
          Evaluate Eraw(i)[u]=exp2_native(c*S(i)[u]-m(i)) for every column, then E(i)[u]=Eraw(i)[u] if selected(a,i,u); otherwise 0. P(i)=bf16(E(i)).
          L(i)[w]=alpha*L(i-1)[w]+sum32_{w*Bk/2<=u<(w+1)*Bk/2} E(i)[u], w in {0,1}.
          The first PV initializes Y(0)=mma32(P(0),Vblk(0),0); for i>0, Y(i)=mma32(P(i),Vblk(i),alpha*Y(i-1)).
        symbol:
          tau: {meaning: Base-two reference-update threshold., value: 8.0}
          move_ref: {meaning: Warp-shared reference-update predicate., binding: "bind:design.tile_pipeline::move_ref"}
          m: {meaning: Current scaled reference score., shape: [], dtype: fp32, life: "carried (b,v,a); i=-1..N-1"}
          L: {meaning: Separate denominator sums for the two column halves., shape: [half: 2], dtype: fp32, life: "carried (b,v,a); i=-1..N-1"}
          Y: {meaning: Unnormalized attention numerator., shape: [d: D], dtype: fp32, life: "carried (b,v,a); i=0..N-1"}
          P: {meaning: Numerator weights., shape: [kv: Bk], dtype: bf16}
          S: {meaning: Unscaled QK scores., shape: [kv: Bk], dtype: fp32}
        arithmetic:
          approx: "exp2_native uses fast approximate FP32 exp2; unknown: <numerics@pending:certified_exp2_error_bound>."
      - step: gate
        name: Preserve the two external BF16 roundings
        math: |
          For each active packed row, ell=L(N-1)[0]+L(N-1)[1]. inv=rcp_native(ell) if ell!=0; otherwise 0.
          A=bf16(Y(N-1)*inv) if ell!=0; otherwise 0.
          sig[d]=1/(1+exp2_native(-output_gate[b*Br+r,v*Group+h,d]*log2(e))).
          out_result[b*Br+r,v*Group+h,d]=bf16(A[d]*sig[d]).
        arithmetic:
          approx: "exp2_native follows online; rcp_native uses approximate FP32 reciprocal; unknown: <numerics@pending:certified_reciprocal_error_bound>."
    ledger:
      baseline: Independent per-row and per-query-head attention over J(r), with FP32 scores and probabilities materialized globally before the same BF16 gate boundary.
      traffic:
        - {item: KV payload, change: "4*D*Group*sum_r valid_count(r) -> 4*D*Bk*N bytes per row block and KV head; excludes cache effects", by: [union]}
        - {item: Score and probability round trips, change: "-16*H*sum_{r=0}^{R-1} valid_count(r) bytes per invocation", by: [online]}
      matmul:
        - {item: Padded union products, change: "2*D*Group*sum_r valid_count(r) -> 2*D*M*Bk*N MAC per row block and KV head", by: [union, online]}
      footprint:
        - {item: Union workspace, change: "+16*sum_b Count[b]+4*Nb bytes of materialized entries and counts per invocation", by: [union]}
        - {item: Online state, change: "8*valid_count(r) score/probability bytes -> 4*(D+3) carried-state bytes per active query/head row, excluding transient tiles", by: [online]}
      error:
        - {item: Numerator and elementary functions, change: "+1 BF16 rounding per P entry; approximate exp2 and reciprocal; union-order reduction and shared reference changes", by: [union, online, gate]}
  work_schedule:
    thesis: Preprocess row-block unions, then distribute their variable-length block/head traversals through a bounded persistent grid.
    flow:
      launch: [{phase: [preprocess]}, {phase: [attention], start_after: preprocess.kernel_done}]
      handoff:
        Union: {producer: preprocess, consumer: [attention], storage: global}
        Count: {producer: preprocess, consumer: [attention], storage: global}
    phase:
      preprocess:
        describe: Build the shared row-block union.
        decomposition:
          strategy: Br=10.
          partition: {row: {size: R, tile: Br}}
          worktile:
            invariant:
              logical_indices: {shape: [row: Br, packed: "W+1"], dtype: int32}
              token_to_req: {shape: [row: Br], dtype: int32}
              block_table: {shape: [request: 1, logical_page: TableWidth], dtype: int32}
          target: {single_tile: {Union: {shape: [entry: MaxEntry, word: 4], dtype: int32}, Count: {shape: [], dtype: int32}}}
        mapping: {worker: {unit: CTA, count: 1}, count: worktile_count}
        schedule:
          worktile_order: [{by: row, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      attention:
        describe: Compute all grouped query heads of one row block and one KV head.
        decomposition:
          strategy: M=128; Etile=16; Bk=4*Etile.
          partition: {row: {size: R, tile: Br}, head: {size: Hkv, tile: 1}}
          worktile:
            invariant:
              Qpack: {shape: [packed_query: M, d: D], dtype: bf16}
              Union: {shape: [entry: MaxEntry, word: 4], dtype: int32}
              Count: {shape: [], dtype: int32}
              output_gate: {shape: [row: Br, head: Group, d: D], dtype: bf16}
            iteration:
              Kblk: {shape: [kv: Bk, d: D], dtype: bf16, direction: ascending}
              Vblk: {shape: [kv: Bk, d: D], dtype: bf16, direction: ascending}
          target: {single_tile: {out_result: {shape: [row: Br, head: Group, d: D], dtype: bf16}}}
        mapping:
          strategy: SMCount is queried from runtime device properties.
          worker: {unit: CTA, count: 1}
          count: "min(SMCount,worktile_count)"
        schedule:
          strategy: The cached global ticket counter and host invocation base both start at zero; each eager call consumes worktile_count+worker_count tickets and advances the next call's base by that amount, using wrap-safe signed-int32 subtraction without resetting the counter.
          worktile_order: [{by: row, direction: descending}, {by: head, direction: ascending}]
          worker_assignment:
            refill: {atomic_counter: "Claim one globally incrementing ticket minus the invocation base; tickets below worktile_count name worktiles in worktile_order, and each claimant stops on its first terminal ticket."}
            exit: terminal_ticket_received_and_assigned_work_and_inflight_operations_done
  tile_pipeline:
    thesis: Overlap two softmax column halves with QK issued ahead of PV; continue gathers and Q refill while prior outputs drain.
    phase:
      preprocess:
        resource:
          Hash: {space: SMEM, shape: [entry: 16384, word: 3], dtype: int32}
          Table: {space: SMEM, shape: [logical_page: TableWidth], dtype: int32}
          RowMetadata: {space: SMEM, shape: [row: Br, word: 2], dtype: int32}
        lane:
          Main:
            info:
              member: "warp[0:16]"
              verb:
                build: |
                  Clear Hash and the append cursor, cache Table and per-row valid_count/request, then rendezvous.
                  Stream 16-byte index quads one ahead; combine each nonempty quad into one CAS/linear-probing hash insertion and OR its row membership bits. Rendezvous before compaction.
                compact: Each warp prefix-scans its contiguous hash-slot ranges, atomically reserves an output interval, and writes occupied Union entries; publish Count after all writes complete.
            pipe: {steady: ["build:Hash", "compact:Union_Count"]}
      attention:
        domain: {t: worktile, i: [0, N], n: {flatten: [t, i]}}
        resource:
          Ticket: {space: SMEM, shape: [], dtype: int32, view: {Ticket0: {slot: 0}, "Next(t)": {slot: 0}}}
          Qpack: {space: SMEM, shape: [packed_query: M, d: D], dtype: bf16}
          KRing: {space: SMEM, shape: [kv: Bk, d: D], dtype: bf16, slot: 2, view: {"Kblk(n)": {slot: "n%2"}}}
          VRing: {space: SMEM, shape: [kv: Bk, d: D], dtype: bf16, slot: 2, view: {"Vblk(n)": {slot: "n%2"}}}
          TensorMemory:
            space: TMEM
            shape: [row: M, column: "<capacity@pending:CuTe_get_max_tmem_alloc_cols_sm100>"]
            dtype: fp32
            view:
              "S(n)": {part: {column: ["(n%3)*Bk", "(n%3+1)*Bk"]}}
              "P(n)": {part: {column: ["(n%3)*Bk", "(n%3)*Bk+Bk/2"]}, dtype: bf16}
              Y: {part: {column: [192, 448]}}
          HalfMax: {space: SMEM, shape: [half: 2, packed_query: M], dtype: fp32}
          HalfSum: {space: SMEM, shape: [half: 2, packed_query: M], dtype: fp32}
          L: {space: register, shape: [half: 2, packed_query: M], dtype: fp32}
          m: {space: register, shape: [half: 2, packed_query: M], dtype: fp32}
          Mask: {space: register, shape: [half: 2, packed_query: M], dtype: int32, view: {"Mask_A(t)": {part: {half: [0, 1]}}, "Mask_B(t)": {part: {half: [1, 2]}}}}
          MaskAhead: {space: register, shape: [half: 2, packed_query: M, entry: "Etile/2"], dtype: int32, view: {"MaskAhead_A(n)": {part: {half: [0, 1]}}, "MaskAhead_B(n)": {part: {half: [1, 2]}}}}
        lane:
          Scheduler:
            info:
              member: "warp[11:12]"
              verb: {publish: "Claim and publish a ticket; before overwriting Ticket, wait for the other eleven warps to acknowledge its previous value. Terminal tickets also require acknowledgement."}
            pipe: {repeat: t, prologue: ["publish:Ticket0"], steady: ["publish:Next(t)"]}
          GatherK:
            info:
              member: "warp[9:10]"
              mode: async
              verb: 
                accept: {mode: sync, meaning: Copy and acknowledge the published ticket.}
                load: |
                  Prime address lookahead per worktile, then read Union two tiles ahead and the page table one ahead, clamped to its last tile.
                  Issue the current paged copy; after issuing the next copy group, publish this tile. Copy groups continue across worktiles; drain publishes the final tile.
                drain: {mode: sync, meaning: Complete and publish the last outstanding gather before worker exit.}
            pipe:
              repeat: t
              prologue: ["accept:Ticket0"]
              steady: [{repeat: "n[t]", steady: ["load:Kblk(n)"]}, "accept:Next(t)"]
              epilogue: ["drain:KRing"]
            edge: {reuse: {"load:Kblk(n+2)": ["MMA/mma:Qpack(t)@Kblk(n)"]}}
          GatherV:
            info:
              member: "warp[10:11]"
              mode: async
              verb:
                accept: {"mode": "sync", "meaning": "Copy and acknowledge the published ticket."}
                load: |
                  Prime address lookahead per worktile, then read Union two tiles ahead and the page table one ahead, clamped to its last tile.
                  Issue the current paged copy; after issuing the next copy group, publish this tile. Copy groups continue across worktiles; drain publishes the final tile.
                drain: {"mode": "sync", "meaning": "Complete and publish the last outstanding gather before worker exit."}
            pipe:
              repeat: t
              prologue: ["accept:Ticket0"]
              steady: [{repeat: "n[t]", steady: ["load:Vblk(n)"]}, "accept:Next(t)"]
              epilogue: ["drain:VRing"]
            edge: {reuse: {"load:Vblk(n+2)": ["MMA/mma:P(n)@Vblk(n)"]}}
          MMA:
            info:
              member: "warp[8:9]"
              mode: ordered
              verb:
                accept: {"mode": "sync", "meaning": "Copy and acknowledge the published ticket."}
                wait: {mode: sync, meaning: Wait for Qpack0 publication.}
                mma: Cumulative completion includes operand reads; PV(n) reads P before QK(n+3) overwrites its aliased S/P stage.
            pipe:
              repeat: t
              prologue: ["accept:Ticket0", "wait:Qpack0"]
              steady:
                - repeat: "n[t,0:count(i)-2]"
                  prologue: ["mma:Qpack(t)@Kblk(n[t,0])", "mma:Qpack(t)@Kblk(n[t,1])"]
                  steady: ["mma:Qpack(t)@Kblk(n+2)", "mma:P(n)@Vblk(n)"]
                  epilogue: ["mma:P(n[t,count(i)-2])@Vblk(n[t,count(i)-2])", "mma:P(n[t,last(i)])@Vblk(n[t,last(i)])"]
                - "accept:Next(t)"
            edge:
              data:
                "mma:Qpack(t)@Kblk(n[t,i])": ["SoftmaxA/publish:Qnext(t-1)"]
                "mma:P(n)@Vblk(n)": ["SoftmaxA/publish:P_A(n)", "SoftmaxB/publish:P_B(n)"]
              reuse:
                "mma:P(n[t+1,0])@Vblk(n[t+1,0])": ["SoftmaxA/release:Y_A(t)", "SoftmaxB/release:Y_B(t)"]
          SoftmaxA:
            info:
              member: "warp[0:4]"
              verb:
                accept: {"mode": "sync", "meaning": "Copy and acknowledge the published ticket."}
                prime_mask: Initialize Mask at each worktile entry by loading and packing selected(a,0,u) for this role's column half.
                prefetch_mask: {mode: async, meaning: "Prefetch Union membership words for local tile min(i+1,N-1) into this role's MaskAhead half; done means all raw words are ready."}
                pack_mask: {mode: sync, meaning: "Replace Mask with the selected bits for the prefetched local tile; completion ends all reads of MaskAhead."}
                publish: |
                  Qpack0 loads Q for min(Ticket0,worktile_count-1), even for an initial terminal ticket; only active rows are copied. Qnext publishes completion of the conditional refill.
                  half_max_A reads S columns [0,Bk/2), stores its HalfMax half, and joins B in a 256-thread rendezvous; done marks completion of those stores and the rendezvous.
                  P_A/P_B capture the peer HalfMax value, form the shared maximum, consume the current Mask, and update their L half. move_ref(a,i) is vote-any(drift(a,i)>tau) over each 32 packed-row warp, including inactive rows.
                  HalfMax reuse across iterations depends on <synchronization@pending:QSA_HalfMax_peer_read_before_next_store>.
                  On move_ref, A waits for PV(n-1) when i>0, then rescales all Y columns before publishing P_A.
                prefetch: {mode: async, meaning: "If Next(t) is valid, start loading its Q into Qpack; otherwise do nothing."}
                combine: Exchange L halves through a 256-thread rendezvous and prepare gate's reciprocal/zero-denominator choice for this role's output drain.
                produce: {mode: async, meaning: "Normalize, gate, and directly store Y columns [0,D/2) in 32-column pieces."}
                release: {mode: sync, meaning: Return Y after this role's last TMEM piece has been read; its last gated global store may remain in flight.}
            pipe:
              repeat: t
              prologue: ["accept:Ticket0", "publish:Qpack0"]
              steady:
                - "prime_mask:Mask_A(t)"
                - repeat: "n[t]"
                  steady: ["prefetch_mask:MaskAhead_A(n)", "publish:half_max_A(n)", "publish:P_A(n)", "pack_mask:MaskAhead_A(n)"]
                - "accept:Next(t)"
                - "prefetch:Qnext(t)"
                - "combine:Normalization_A(t)"
                - "produce:out_A(t)"
                - "release:Y_A(t)"
                - "publish:Qnext(t)"
            edge:
              data:
                "publish:half_max_A(n)": ["MMA/mma:Qpack(t)@Kblk(n)"]
                "publish:P_A(n)": ["SoftmaxB/publish:half_max_B(n)"]
                "pack_mask:MaskAhead_A(n)": ["prefetch_mask:MaskAhead_A(n)"]
                "produce:out_A(t)": ["MMA/mma:P(n[t,last(i)])@Vblk(n[t,last(i)])"]
                "publish:Qnext(t)": ["prefetch:Qnext(t)"]
          SoftmaxB:
            info:
              member: "warp[4:8]"
              verb:
                accept: {"mode": "sync", "meaning": "Copy and acknowledge the published ticket."}
                prime_mask: "Initialize Mask at each worktile entry by loading and packing selected(a,0,u) for this role's column half."
                prefetch_mask: {"mode": "async", "meaning": "Prefetch Union membership words for local tile min(i+1,N-1) into this role's MaskAhead half; done means all raw words are ready."}
                pack_mask: {"mode": "sync", "meaning": "Replace Mask with the selected bits for the prefetched local tile; completion ends all reads of MaskAhead."}
                publish: Follow SoftmaxA's HalfMax store/rendezvous completion, subsequent peer-load, pending reuse guarantee, and reference predicate for S columns [Bk/2,Bk); update this half of L and P without modifying Y.
                combine: "Exchange L halves through a 256-thread rendezvous and prepare gate's reciprocal/zero-denominator choice for this role's output drain."
                produce: {mode: async, meaning: "Follow SoftmaxA's gated output drain for columns [D/2,D)."}
                release: {"mode": "sync", "meaning": "Return Y after this role's last TMEM piece has been read; its last gated global store may remain in flight."}
            pipe:
              repeat: t
              prologue: ["accept:Ticket0"]
              steady:
                - "prime_mask:Mask_B(t)"
                - repeat: "n[t]"
                  steady: ["prefetch_mask:MaskAhead_B(n)", "publish:half_max_B(n)", "publish:P_B(n)", "pack_mask:MaskAhead_B(n)"]
                - "accept:Next(t)"
                - "combine:Normalization_B(t)"
                - "produce:out_B(t)"
                - "release:Y_B(t)"
            edge:
              data:
                "publish:half_max_B(n)": ["MMA/mma:Qpack(t)@Kblk(n)"]
                "publish:P_B(n)": ["SoftmaxA/publish:half_max_A(n)"]
                "pack_mask:MaskAhead_B(n)": ["prefetch_mask:MaskAhead_B(n)"]
                "produce:out_B(t)": ["MMA/mma:P(n[t,last(i)])@Vblk(n[t,last(i)])"]
realization:
  require:
    - item: design.tile_pipeline::attention.MMA
      choice: tcgen05.mma with single-CTA group, TMEM P operands and accumulators, and cumulative tcgen05 completion commits.
      reason: The S/P alias and three-stage reuse depend on the declared read-before-overwrite order and deferred operand release.
    - item: [design.tile_pipeline::attention.GatherK, design.tile_pipeline::attention.GatherV]
      choice: cp.async groups with wait_group(1) publication, wait_group(0) exit drain, and deferred tcgen05 completion for slot return.
      reason: The two-stage cross-unit gather rings separate copy issue, data readiness, and the end of MMA operand reads.
