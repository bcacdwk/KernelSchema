realization:
  require:
  - item: ['design.tile_pipeline::prefix.Soft0', 'design.tile_pipeline::prefix.Soft1', 'design.tile_pipeline::prefix.Soft2',
      'design.tile_pipeline::prefix.Soft3', 'design.tile_pipeline::remainder.Soft0', 'design.tile_pipeline::remainder.Soft1',
      'design.tile_pipeline::remainder.Soft2', 'design.tile_pipeline::remainder.Soft3']
    choice: Bind the matrix products to tcgen05.mma.cta_group::1 with BF16 operands and FP32 accumulators, using
      per-issuer tcgen05.commit notifications. Use warp-convergent tcgen05.ld/st and their completion waits; the
      score load uses the 16x32bx2 form, while accumulator access uses 32x32b.
    reason: Independent issuer groups preserve QK/PV overlap; the score-load shape supplies both key halves, and
      convergent accumulator access is required even when only some rows need rescaling.
  - item: ['design.tile_pipeline::prefix.Loader', 'design.tile_pipeline::remainder.Loader']
    choice: Build each pool's two-dimensional BF16 CUtensorMap with row stride 2*D, a 64-element-wide box and
      SWIZZLE_128B; pass maps by value to the kernel. Bind gather4 completion to mbarrier transaction bytes and
      the mixed-pool chunk's cp.async completion to cp.async.mbarrier.arrive. Preserve the separate membership
      publication and data-landing notifications.
    reason: Both loaders feed the same shared operand layout while membership becomes visible independently of
      transfer completion. Maps are bound to the current pool pointers for each launch.
  - item: ['design.tile_pipeline::prefix.Setup', 'design.tile_pipeline::remainder.Setup']
    choice: Bind hash installation/publication to shared-memory 64-bit atomicCAS/atomicExch and membership updates
      to 32-bit atomicOr on the word containing four mask bytes. Bind index staging and query prefetch to cp.async,
      retiring their groups with cp.async.wait_group before the CTA rendezvous.
    reason: A competing inserter must observe a complete canonical position, and same-query duplicates must remain
      private entries. The staged indices and asynchronous query copies must be retired before ring reuse or an
      empty-group return.
  - item: design.tile_pipeline::probe.Main
    choice: |-
      Bind hash insertion to shared-memory 64-bit atomicCAS, membership updates
      to 32-bit atomicOr on four packed mask bytes, and count flushing to integer
      atomicAdd. Keep probe storage static and separate from attention's
      1024-byte-aligned dynamic shared storage; the probe fits the 48-KiB static
      limit without a dynamic shared-memory opt-in.
    reason: The count uses returned atomic membership bits; static probe storage avoids weakening the alignment
      required by attention operand descriptors.
  - item: design.work_schedule::probe
    choice: |-
      Use the process-lifetime 64-float cudaHostAllocMapped buffer and its
      cudaHostGetDevicePointer alias; only its first PS slots carry samples.
      Arm them through volatile host stores, submit the probe, poll with volatile
      host reads, then perform the ordinary FP32 final reads used for R.
      Retain storage through all pending probe writes even if polling stops early.
      The source reuses this one gate without per-invocation isolation; it provides
      no cross-call completion guarantee at poll exit.
    reason: Mapped storage permits the bounded host decision without cudaStreamSynchronize. The actual observations,
      including partial results, determine this node.
  - item: design.work_schedule::flow
    choice: |-
      Bind the fork and join to the cached cudaEventDisableTiming events and
      cudaEventRecord/cudaStreamWaitEvent. Use the cached cudaStreamNonBlocking side
      stream so the legacy default stream cannot introduce a prefix-to-probe or
      prefix-to-remainder barrier. Use the initial GT for both token ranges.
      The side stream, events and mapped gate persist across calls. Event waits queue
      device ordering, not a host completion wait; their reuse does not isolate gate
      contents between calls. Return out after successfully queuing the join.
    reason: The nonblocking stream and event pair implement the declared fork/join while preserving overlap and
      caller-stream output visibility.
  - item: design.work_schedule::flow
    choice: |-
      Model.forward caches workspace selection by object identity, substituting
      private scratch for a non-CUDA or smaller-than-32-MiB buffer. P.ws_bytes=0 needs
      no further allocation. The successful hidden path returns before the extension's
      private graph machinery. External capture records the three submissions and event
      relationships; actual replay uses those bindings without repeating host polling.
    reason: Workspace identity participates in the initial plan, and capture must not be counted as an extra execution
      of the probe or attention.
