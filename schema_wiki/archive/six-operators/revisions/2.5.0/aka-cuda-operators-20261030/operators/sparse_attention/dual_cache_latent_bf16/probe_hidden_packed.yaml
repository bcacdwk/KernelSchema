meta_data:
  name: dual_cache_latent_bf16
  describe: Joint sparse attention over prepared sliding-window and compressed shared key/value latents, with
    a per-head zero-value softmax sink.
  source: source@6e4ca91bd91d998cac99e8dadd83838e153c679d:kernel_wiki/aka-cuda-operators-20261030/operators/sparse_attention/dual_cache_latent_bf16/candidate/solution.py::Model.forward
  version: 2
  dispatch:
    id: probe_hidden_packed
    parent: probe_serial_packed
    when: |
      Let W be the byte capacity of the workspace actually passed by Model.forward
      following its identity cache or private scratch selection, and N=dsv4::nsm_cached().
      Let P=dsv4::make_plan(H,T,IndexWidth,W,0,0,N,true) in the fixed source,
      including its compile-time fallback when tcgen05 is not built. P is the initial
      plan; dual denotes probe-gated packing, cfg the kernel, and gt queries per CTA.
      Select exactly when the shipped automatic policy is active (force_cfg=0,
      force_s=0, Model.fast is false, normal non-diagnostic build and unchanged default
      extension switches), P.dual=1, dual_dispatch_hidden passes its prechecks and
      successfully records the caller fork, queues the side-stream wait and submits
      probe_begin, and the actual R returned by probe_end satisfies 0<R<=fp32(2.6).
      The hidden prechecks require P.gt>1, P.splits=P.alt_splits=1, the original full
      input token range, available nonblocking side stream, fork/join events and mapped
      gate, and K=N-8>=1 with ceil_div(T,P.gt)>=2*K. The prefix owns [0,K*P.gt);
      the accepted packed remainder owns [K*P.gt,T). Both dispatches clear dual.
      P.gt starts at 64/H and halves until P.gt*IndexWidth<=2560 and
      ceil_div(T,P.gt)>=N, returning one if the result exceeds T. Dual packing requires
      the alternative allow_tc=false plan to have splits=1 and P.gt>2.6, so GT is 4 or 8.
      R is the FP32 mean, accumulated in FP64, of the positive values actually read
      from the eight mapped sample slots after the bounded poll. A timeout can still
      produce an accepted partial mean; selection uses observed R, not final samples.
      The extension returns directly after the hidden join is queued, without its
      private graph cache. External capture, if performed, fixes host selection at
      recording; replay executes the recorded kernels with recorded bindings and current
      device tensor contents, without rerunning host polling. Pure capture produces
      no GPU completion events.
design:
  math_reshape:
    thesis: |-
      Count sampled packing overhead and use the observed host mean to select the
      remainder, while the prefix already uses packing. Attention retains the pool-major
      multiplicity-preserving union, two QK partials, BF16 probabilities and chunked
      base-2 softmax, including padding and the runtime union order.
    rewrite:
    - step: gather
      name: Build a multiplicity-preserving union and pack query rows
      math: |
        GT, MR and KC are bound below. For group grp let t0=grp*GT,
        G=min(GT,T-t0), nrows=G*H, and t_g=t0+g for g in [0,G).
        For each real token use the Contract's request lookup and visible length:
        A(t)=min(max(visible,0),SW);
        Klen(t)=A(t)+max(min(sparse_topk_lens[t],IndexWidth)-SW,0).
        For each distinct (pool,id) among the group's valid slots J(t_g), let
        m_g(pool,id) count its occurrences in query g. Pools remain distinct even
        when their pointers or row numbers coincide; pool 0 is SWA, pool 1 compressed.
        Create one shared entry carrying all bits g with m_g>0, then m_g-1 private
        entries carrying only bit g for each g with m_g>1. Every entry encodes
        UnionKey[k]=int32(pool*16777216+id) and UnionMask[k]=uint8(sum_g bit_g*2^g).
        Let Ns and Ng be the entry counts for pools 0 and 1, Nu(grp)=Ns+Ng, and
        C(grp)=ceil_div(Nu(grp),KC). Nu(grp)<=sum_g count(J(t_g))<=GT*IndexWidth.
        Entries are ordered with all SWA entries first and all compressed entries
        second. Within each pool preserve the runtime union-construction permutation;
        no stable order across executions is assumed. For each (pool,id) its number
        of entries is 1+sum_g max(m_g(pool,id)-1,0), not max_g m_g(pool,id).
        For r in [0,MR), Q[r,:]=query[t0+floor(r/H),r mod H,:] when r<nrows,
        otherwise bf16(0). For c in [0,C(grp)) and u in [0,KC), let k=c*KC+u.
        Mask(c)[u]=UnionMask[k] if k<Nu(grp), otherwise uint8(0).
        Define pool(k)=floor(UnionKey[k]/16777216) for k<Nu(grp), otherwise 0;
        id(k)=UnionKey[k] mod 16777216 for k<Nu(grp), otherwise 0.
        Let mixed(c) mean 0<Ns-c*KC<KC and (Ns-c*KC) mod 4 != 0.
        The gathered pool is pool(k) if mixed(c), otherwise pool(c*KC+4*floor(u/4));
        Gather(c)[u,:] is row id(k) of that pool. Thus padding still fetches row zero;
        a padded tail sharing a four-row group with compressed entries uses compressed
        row zero, while wholly padded groups and mixed-chunk padding use SWA row zero.
        a1=fp32(bmm1_scale); a2=fp32(bmm2_scale);
        L2=fp32(1.4426950408889634); neg=fp32(-3.0e38); scale=a1*L2.
      symbol:
        GT: {meaning: Queries grouped into one worktile., binding: 'bind:design.work_schedule::GT'}
        MR: {meaning: Matrix rows including padding., binding: 'bind:design.work_schedule::MR'}
        KC: {meaning: Union entries per local chunk., binding: 'bind:design.work_schedule::KC'}
        UnionKey:
          meaning: Pool-tagged row IDs in the realized union order.
          shape: [{entry: Nu(grp)}]
          dtype: int32
          retention: keep_value (grp)
        UnionMask:
          meaning: Membership bits selecting which queries consume each union entry.
          shape: [{entry: Nu(grp)}]
          dtype: uint8
          retention: keep_value (grp)
        Q:
          meaning: Packed query rows with zero padding.
          shape: [{row: MR}, {latent: D}]
          dtype: bf16
        Gather:
          meaning: Shared cache rows including padding substitutes.
          shape: [{slot: KC}, {latent: D}]
          dtype: bf16
        Mask:
          meaning: Per-chunk query membership before score masking.
          shape: [{slot: KC}]
          dtype: uint8
    - step: probe
      name: Count sampled updates and retain the observed host decision
      math: |
        PS is bound below and NG=ceil_div(T,GT). For sample b in [0,PS),
        if b>=NG set ProbeRatio[b]=fp32(-1). Otherwise let
        sg(b)=b if NG<=PS, else floor(b*NG/PS), st(b)=sg(b)*GT,
        pg(b)=min(GT,T-st(b)), and Items(b)=sum_{g=0}^{pg(b)-1} Klen(st(b)+g).
        A sample is usable when pg(b)=GT, all its tokens belong to the same Contract
        request, and 0<Items(b)<=2560. If unusable set ProbeRatio[b]=fp32(-1).
        For a usable sample, enumerate occurrences x=(g,j) with g in [0,GT)
        and j in J(st(b)+g). Let g(x)=g and
        e(x)=uint32(sparse_indices[st(b)+g,j]) bitwise-OR
             (0 if j<SW, otherwise 16777216).
        For each encoded key e, Creator(e) is its first entry-creating occurrence;
        for each (e,g), First(e,g) is its first membership-marking occurrence
        in the actual concurrent update order. These two orders need not agree.
        ProbeCount(b)=sum_x (1 if x=Creator(e(x)) else
                            (0 if x=First(e(x),g(x)) else 1)).
        Invalid IDs are absent from J, but Items includes their selected slots.
        ProbeRatio[b]=(fp32(ProbeCount(b))*fp32(GT))/fp32(Items(b)).
        Only the count is retained locally; no attention union or KV is produced.

        Before this computation, the mapped sample slots contain fp32(-2).
        For each b let observed[b] be the actual FP32 value read by the host's final
        scan after its bounded poll; the scan need not observe all final sample values.
        Starting sum64=fp64(0), visit b=0..PS-1 and add fp64(observed[b]) in FP64
        only when observed[b]>0. Let npos count these additions.
        R=fp32(sum64/fp64(npos)) if npos>0, otherwise fp32(-1).
        R selects only the remainder implementation; the prefix uses packing
        independently of R. This node accepts the same packing for the remainder.
        No probe value enters an attention score, probability or output.
      symbol:
        PS: {meaning: Number of independent probe samples., binding: 'bind:design.work_schedule::PS'}
        ProbeCount:
          meaning: Actual integer numerator accumulated for one usable sample.
          shape: []
          dtype: int32
        ProbeRatio:
          meaning: Per-sample FP32 control results published to the mapped gate.
          shape: [{sample: PS}]
          dtype: fp32
          retention: keep_value invocation
        R:
          meaning: Actual positive-sample mean read by the host for selection.
          shape: []
          dtype: fp32
          retention: keep_value invocation
      arithmetic:
        approx: 'ProbeRatio division uses the shipped --use_fast_math build; unknown: no source-provided error
          bound. R follows the explicit FP64 host accumulation and final FP32 conversion.'
    - step: online
      name: Two QK partials and a lazy maximum recurrence
      math: |
        E2(x) is the compiled fast exp2f(x), with E2(-inf)=0;
        maxnum is FP32 fmaxf, where a single NaN loses to the numeric operand.
        For each grp with C(grp)>0, initialize sink2[r]=sinks[r mod H]*L2
        for r<nrows and neg for padded rows; m(-1)[r]=sink2[r].
        l(-1)[r]=0 and Acc(-1)[r,:]=0.
        For c=0..C(grp)-1:
          Partial(c,a)=mm32(Q[:,a*D/2:(a+1)*D/2],
                            Gather(c)[:,a*D/2:(a+1)*D/2]^T), a in {0,1}.
          Each partial accumulates D/32 successive 16-wide products from zero.
          Z=Partial(c,0)+Partial(c,1), with one FP32 addition per score.
          Scores(c)[r,u]=Z[r,u]*scale if floor(Mask(c)[u]/2^floor(r/H)) mod 2 != 0, otherwise -inf.
          For b in {0,1} and q in {0,1,2,3}, reduce Scores[r,b*32+4*n+q]
          for n=0..7 by successive maxnum from -inf, obtaining M[b,q].
          Mhalf[b]=maxnum(maxnum(M[b,0],M[b,1]),maxnum(M[b,2],M[b,3]));
          candidate=maxnum(m(c-1)[r],maxnum(Mhalf[0],Mhalf[1]));
          clamped=candidate if candidate>neg*0.5, otherwise neg;
          m(c)[r]=m(c-1)[r] if clamped-m(c-1)[r]<=1, otherwise clamped.
          alpha(c)[r]=E2(m(c-1)[r]-m(c)[r]);
          E[r,u]=E2(Scores(c)[r,u]-m(c)[r]); Prob(c)[r,u]=bf16(E[r,u]).
          For each b,q form SumPart[b,q] by adding E[r,b*32+4*n+q] from zero for n=0..7;
          Rhalf[b]=(SumPart[b,0]+SumPart[b,1])+(SumPart[b,2]+SumPart[b,3]);
          l(c)[r]=l(c-1)[r]*alpha(c)[r]+(Rhalf[0]+Rhalf[1]).
          Acc(0)=mm32(Prob(0),Gather(0));
          Acc(c)=mma32(Prob(c),Gather(c),alpha(c)[:,None] ⊙ Acc(c-1)) for c>0.
        Each PV output half traverses KC/16 successive 16-wide products.
        Partition the rows into consecutive groups of RG rows, with RG bound below.
        Rescaling is omitted for a row group when every alpha is exactly 1;
        otherwise all its rows are multiplied, including those with alpha=1.
        The two key halves evaluate duplicate m,l updates; the lower half's l
        supplies the final denominator. Unrounded E supplies l, and Prob supplies PV.
      symbol:
        RG: {meaning: Rows sharing the conditional rescale decision., binding: 'bind:design.tile_pipeline::RG'}
        Partial:
          meaning: FP32 QK sum for one latent half a of one chunk.
          shape: [{row: MR}, {slot: KC}]
          dtype: fp32
        Scores:
          meaning: Added, scaled and masked chunk scores.
          shape: [{row: MR}, {slot: KC}]
          dtype: fp32
        E:
          meaning: Unrounded exponentials used for the normalizer and probability conversion.
          shape: [{row: MR}, {slot: KC}]
          dtype: fp32
        Prob:
          meaning: BF16 probability operands for PV.
          shape: [{row: MR}, {slot: KC}]
          dtype: bf16
        alpha:
          meaning: Rescaling factor for the current chunk.
          shape: [{row: MR}]
          dtype: fp32
        sink2:
          meaning: Base-2 sink logit for each packed row, with a finite sentinel for padding.
          shape: [{row: MR}]
          dtype: fp32
          retention: keep_value (grp)
        m:
          meaning: Lagging base-2 row maximum.
          shape: [{row: MR}]
          dtype: fp32
          retention: carry_forward (grp); c=-1..C(grp)-1
        l:
          meaning: FP32 exponential sum excluding the sink.
          shape: [{row: MR}]
          dtype: fp32
          retention: carry_forward (grp); c=-1..C(grp)-1
        Acc:
          meaning: Unnormalized full-latent value sum.
          shape: [{row: MR}, {latent: D}]
          dtype: fp32
          retention: carry_forward (grp); c=-1..C(grp)-1
      arithmetic:
        approx: 'E2 and division use the shipped --use_fast_math build; unknown: no source-provided error bound.
          The finite sentinel, clamp and maximum lag are retained without a magnitude guarantee for the full Contract
          domain.'
        accumulate: Scalar multiply/add expressions may contract under fast-math compilation. The half-latent
          addition and the specified sum grouping do not imply bitwise equivalence to the reference.
    - step: finalize
      name: Write zero for an empty union or normalize real packed rows
      math: |
        If C(grp)=0, overwrite out[t0+floor(r/H),r mod H,d]=bf16(0)
        for r in [0,nrows), d in [0,D), without evaluating online or final normalization.
        Otherwise, last=C(grp)-1 and for r in [0,MR):
          z[r]=l(last)[r]+E2(sink2[r]-m(last)[r]);
          inv[r]=a2/z[r] if r<nrows and z[r]>0, otherwise 0.
        For r<nrows and d in [0,D), Result[r,d]=bf16(Acc(last)[r,d]*inv[r]);
        overwrite out[t0+floor(r/H),r mod H,d]=Result[r,d].
        No Result value is formed for padded rows. All matrix products and online
        updates still include those rows. A query with J(t_g) empty inside a nonempty
        union follows online and normalization rather than the empty-union shortcut.
        E2, division and scalar contraction follow online's arithmetic exception.
      symbol:
        inv:
          meaning: Final per-row multiplier shared by both output halves, zero for padding.
          shape: [{row: MR}]
          dtype: fp32
        Result:
          meaning: Normalized BF16 rows for the real tokens of the group.
          shape: [{row: nrows}, {latent: D}]
          dtype: bf16
    ledger:
      baseline: Direct FP32 evaluation per query over valid slots, gathering each BF16 latent once for both QK
        and PV and materializing full logits and probabilities. Counts below include every padded product actually
        evaluated.
      traffic:
      - item: Cache payload
        change: 2*D*sum_g count(J(t_g)) -> 2*D*C(grp)*KC bytes per group, for the gather shared by QK and PV;
          sharing saves rows only when overlap exceeds chunk padding.
        by: [gather]
      - item: Probe control payload
        change: +4*sum_b Items(b) index bytes for usable samples and 4*PS published bytes per invocation; host
          polling adds at most 2000000*PS scalar reads and a PS-element final scan. These do not reuse attention
          data.
        by: [probe]
      footprint:
      - item: Intermediate values
        change: 8*H*sum_g count(J(t_g)) full-row logit/probability bytes -> 5*Nu(grp) retained union bytes and
          no full attention matrices; chunk operands include 2*MR*KC FP32 QK partials and MR*KC BF16 probabilities,
          with 4*MR*(D+2) recurrence bytes per group.
        by: [gather, online]
      - item: Probe results
        change: +4*PS retained control bytes per invocation; the host consumes observations without materializing
          an attention matrix.
        by: [probe]
      matmul:
      - item: Packed contractions
        change: 2*H*sum_g count(J(t_g))*D -> 2*MR*C(grp)*KC*D MACs per group; C(grp)=0 executes no products.
        by: [gather, online]
      vector:
      - item: QK partial merge
        change: +MR*C(grp)*KC FP32 additions per group.
        by: [online]
      - item: Probe update count
        change: +sum_b Items(b) selected-index inspections over usable samples per invocation, with runtime-dependent
          hash-collision work and at most PS*GT*IndexWidth inspected slots.
        by: [probe]
      error:
      - item: Numerical changes
        change: The realized union permutation reorders reductions. Each chunk narrows MR*KC exponentials to BF16
          only for PV; split QK, grouped normalizer sums, a one-unit base-2 maximum-update threshold and fast
          exponentials change rounding. No global output error bound is supplied.
        by: [gather, online, finalize]
  work_schedule:
    thesis: |-
      Fork after the caller's preceding work, run the full-batch probe on a side stream
      and a packed prefix on the caller stream, then submit the accepted packed remainder
      behind the probe. The remainder need not wait for the prefix. Queue a side-to-caller
      join after the remainder and behind the prefix, so subsequent caller work observes
      all output rows. One probe and two attention launches
      plus the event pair permit overlap without promising simultaneous residency.
    flow:
      launch:
      - phase: [probe]
      - phase: [prefix]
      - phase: [remainder]
        start_after: probe.kernel_done
    phase:
      probe:
        describe: |-
          The caller first records a fork after its prior work; the side stream waits for
          that fork before reading input tensors. The host arms the mapped slots with -2
          and submits this full-batch probe to the side stream. It then submits prefix to
          the caller stream before polling at most 2000000 passes, stopping when a pass
          finds no -2. The final scan reads each slot once and computes probe's positive-only
          R. This node accepts packing and submits remainder using the initial P parameters.
          Polling may finish before probe.kernel_done. Side-stream order still prevents
          remainder from starting before probe completion; prefix has no probe completion
          wait. ProbeRatio is consumed only by the host, not by either attention kernel,
          so no tensor handoff connects these phases. ProbeCount follows probe's actual
          update order and can differ from the attention union count. The source also permits
          pending probe writes to race a later gate reset; selection uses the actual observed R.
        decomposition:
          strategy: |-
            PS=8. Sample b is the ascending sample coordinate; sg(b), Items(b) and
            usability are defined by probe. Set PG=0 for b>=NG, otherwise PG=min(GT,T-sg(b)*GT).
            All PS samples receive a worker, including out-of-range, cross-request and
            partial-tail samples; those still publish -1. A usable sample examines every
            selected slot of its PG tokens and publishes one scalar, with no KV access.
            The probe hash/membership state is private to its worktile and is not reused
            by attention.
          partition:
            sample: {size: PS, tile: 1}
          worktile:
            invariant:
              sparse_indices:
                shape: [{token: PG}, {slot: IndexWidth}]
                dtype: int32
              sparse_topk_lens:
                shape: [{token: PG}]
                dtype: int32
              cum_seq_lens_q:
                shape: [{boundary: B+1}]
                dtype: int32
              seq_lens:
                shape: [{request: B}]
                dtype: int32
          target:
            single_tile:
              ProbeRatio:
                shape: []
                dtype: fp32
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: PS
        schedule:
          worktile_order:
          - {by: sample, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      prefix:
        describe: Build packed unions and write all outputs for the first K full groups on the caller stream.
        decomposition:
          strategy: |-
            For all phases, GT=P.gt in {4,8}, MR=64, KC=64, NG=ceil_div(T,GT),
            and K=N-PS, where N is the SM count used by the initial plan. Both range
            launches retain P.cfg=90, splits=1, nb=1 and ws_bytes=0, and clear dual.
            The alternative is never submitted. H is 8 or 16 and GT*H<=MR.
            Prefix's local token coordinate equals the batch token coordinate and covers
            [0,K*GT), giving global groups grp in [0,K). Each group owns all H heads and
            D columns for its GT tokens. This range ends on a complete group boundary.
            For both attention phases, resolve each real token's request independently;
            groups may cross request boundaries although probe samples exclude those groups.
            A nonempty union traverses c=0..C(grp)-1; an empty union still writes zeros.
            All H sinks are shared across queries, and padded matrix rows produce no stores.
            The two phases have disjoint outputs, no cross-phase KV/state reuse, and no combine.
          partition:
            token: {size: K*GT, tile: GT}
          worktile: &id001
            invariant:
              Q:
                shape: [{row: MR}, {latent: D}]
                dtype: bf16
              sparse_indices:
                shape: [{token: G}, {slot: IndexWidth}]
                dtype: int32
              sparse_topk_lens:
                shape: [{token: G}]
                dtype: int32
              cum_seq_lens_q:
                shape: [{boundary: B+1}]
                dtype: int32
              seq_lens:
                shape: [{request: B}]
                dtype: int32
              sinks:
                shape: [{head: H}]
                dtype: fp32
            iteration:
              Gather:
                shape: [{slot: KC}, {latent: D}]
                dtype: bf16
                direction: ascending
          target: &id002
            single_tile:
              out:
                shape: [{token: G}, {head: H}, {latent: D}]
                dtype: bf16
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: K
        schedule:
          strategy: For block index worker_id, grp=K-1-worker_id. Reverse ordering is local to this range; each
            worker receives one full group.
          worktile_order:
          - {by: token, direction: descending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
      remainder:
        describe: |-
          Build packed unions and write outputs for the remaining groups on the side stream.
          After this kernel, record the join on the side stream and queue its wait on the
          caller stream behind prefix. The join covers remainder.kernel_done, which also
          follows probe.kernel_done; caller order covers prefix.kernel_done. Return does
          not block the host for either output producer. The join is an external completion
          boundary, not a fourth compute kernel or an output merge.
        decomposition:
          strategy: |-
            Use the shared GT, MR, KC, NG and K fixed by prefix. The remainder partition's
            local token coordinate u maps to batch token K*GT+u, covering [K*GT,T).
            Its local group coordinate j maps to global grp=K+j. Each group owns all H
            heads and D columns for G=min(GT,T-grp*GT) real tokens, with a possible partial
            group only at the batch tail. The full-batch pointers and T remain unchanged;
            only the launch range and its group offset change. Resolve request crossings,
            iterate nonempty unions and handle empty unions exactly as prefix defines.
            Together the two partitions produce every real output element exactly once.
          partition:
            token: {size: T-K*GT, tile: GT}
          worktile: *id001
          target: *id002
        mapping:
          worker: {unit: CTA, unit_count: 1}
          worker_count: NG-K
        schedule:
          strategy: For block index worker_id, grp=NG-1-worker_id. Descend only within the remainder range; no
            prefix work is reassigned or repeated.
          worktile_order:
          - {by: token, direction: descending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: |-
      Probe CTAs own independent counting state while prefix CTAs may run concurrently.
      Both attention phases use the same per-CTA pipeline with separate resource instances:
      union construction reuses the idle KV ring, four loader warps overlap four softmax
      warps, and final PV completion releases the ring for output staging. The two phases
      share no local buffers or completion notifications.
    phase:
      probe:
        resource:
          ProbeHash:
            space: SMEM
            member_slot_shape: [{entry: 4096}]
            dtype: uint64
            slot_count: 1
          ProbeMembership:
            space: SMEM
            member_slot_shape: [{entry: 4096}]
            dtype: uint8
            slot_count: 1
          ProbeMeta:
            space: SMEM
            member_slot_shape: [{element: 24}]
            dtype: int32
            slot_count: 1
            view:
              SelectedCount:
                part:
                  element: [0, 8]
              SwaCount:
                part:
                  element: [8, 16]
              RequestId:
                part:
                  element: [16, 24]
          ProbeCount:
            space: SMEM
            member_slot_shape: []
            dtype: int32
            slot_count: 1
          PrefetchedId:
            space: register
            member_slot_shape: [{element: 1024}]
            dtype: int32
            slot_count: 1
          LocalCount:
            space: register
            member_slot_shape: [{element: 1024}]
            dtype: int32
            slot_count: 1
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                produce: |-
                  For an in-range sample, the first GT participants resolve SelectedCount,
                  SwaCount and RequestId into ProbeMeta; rendezvous before checking usability.
                  An out-of-range or unusable sample writes the final -1 from one participant,
                  without initializing or reading the hash state. A usable sample clears
                  ProbeHash, ProbeMembership and ProbeCount, then rendezvous before inserting.
                  All participants share a 4096-entry open-addressed table of pool-tagged keys.
                  A slot has one membership byte for up to eight queries. Apply probe's
                  Creator/First contribution rule to LocalCount: atomicCAS publishes a new
                  entry before its creator sets the membership bit; matching participants
                  use the previous bit returned by atomicOr, without waiting for the creator.
                  Each nonzero local count is flushed into ProbeCount once.
                  Each participant prefetches one next selected index into PrefetchedId before
                  processing the current key; invalid IDs skip the hash operation. No index row,
                  query or latent is staged for reuse by either attention phase.
                  After the counting rendezvous, form probe's scalar ratio and write only this
                  sample's mapped slot once from one participant. There is no device reduction
                  across samples. This publication does not assert that every CTA has finished;
                  all local reads and stores retire by probe.kernel_done. The static resources
                  are per CTA, and no next worktile reuses them.
            pipe:
              steady: ['produce:ProbeRatio']
