"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "selfprep_redf"
    "parent": "ws_split_redf"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or
      the cached ABI reused by its host fast path; use launch choices baked into a
      replayed graph. Select exactly when a.zflag=0, a.cfg=96 and a.cfg2 in {46,47}:
      actual FC1 is f4_body_ws with GEMM1=true, SK=2, FUSE=false and SELFPREP=true,
      and FC2 is f4_body with GEMM1=false and REDF=true. Rcap=T*K<=256 is enforced
      by rung_ok(96), together with the native FP4 geometry and H/512 integrality.
      Let S be a.small_thresh when positive, otherwise native small_threshold();
      for graph replay use the preparation choice baked into the graph. PREP2 and
      KEEP_PREP mean effective prep2_on()!=0 and the cached NVFP4_MOE_SP_KEEP_PREP
      value beginning with '1'. Neither these controls nor Rcap<=S further restrict
      this node. Map refusals and rejected submissions propagate errors.
      Parent is only the copying origin; this condition applies independently over
      the shared Contract. In-place input changes do not rebuild cached choices.
design:
  math_reshape:
    thesis: |-
      Recompute a stable expert route map for every FC1 worker, potentially removing a preparation launch at the cost of redundant routing work and writes. Split FC1 into two hidden slices, materialize FP32 partials and separately sum/activate/quantize them. FC2 weights BF16-rounded routes directly into a cleared FP32 token accumulator.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        Every FC1 worker recomputes the complete map, even if it has no projection work.
        Divide slots i=t*K+k into Nc=ceil_div(Rcap,64)<=4 consecutive chunks.
        ChunkCount[c,e]=count({i in chunk c | route_ids[i]=e});
        ChunkBase[c,e]=offs[e]+sum_{d<c} ChunkCount[d,e]. For an active slot i,
        route_of[i]=ChunkBase[floor(i/64),route_ids[i]]+
          count({j | 64*floor(i/64)<=j<i and route_ids[j]=route_ids[i]}).
        This is stable ascending slot order within each expert. Invalid slots map to -1.
        Each recomputation writes counts,offs,toffs,Route,route_of and Tile into the
        same allocations; it leaves fill unchanged. There is no private global map copy.
        Optional independent preparation is still submitted as bound in work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Each preparation algorithm alone maps V bijectively onto [0,Rv), grouped by expert;
        the independent preparation's atomic ranks need not match the stable map.
        Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile)
        in these allocations. When self-preparation overlaps independent preparation,
        unprotected reads/writes can observe mixed map versions: the source provides
        no guarantee of a consistent Route/route_of tuple across consumers in that case.
        Counts and prefix totals agree arithmetically; the route permutation can differ.
        The projection equations below describe coherent map reads; they do not repair
        or define deterministic outputs for that source race. Without such overlap,
        the repeated stable map supplies their indices.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per FC1 slice worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        SK: {meaning: Number of equal hidden-reduction slices, binding: 'bind:design.work_schedule::SK'}
        Nprep: {meaning: Number of full routing recomputations, binding: 'bind:design.work_schedule::Nprep'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok drives FC1 gather4 and FC2 weighting
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of routing outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: operands
      name: Consume stored operands through the compact route map
      math: |
        No activation pre-gather buffer is allocated or copied. FC1 follows Route to
        hidden_states and hidden_states_scale, keeping their stored representation.
        Xq and Xs below are views of these original token tensors, not materialized route rows.
        Decode weights exactly as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
      symbol:
        Xq: {meaning: Original packed activation payload view, shape: 'ref:contract.algorithm_requirement.input.hidden_states.shape', dtype: 'ref:contract.algorithm_requirement.input.hidden_states.dtype', binding: 'ref:contract.algorithm_requirement.input.hidden_states'}
        Xs: {meaning: Original activation scale view, shape: 'ref:contract.algorithm_requirement.input.hidden_states_scale.shape', dtype: 'ref:contract.algorithm_requirement.input.hidden_states_scale.dtype', binding: 'ref:contract.algorithm_requirement.input.hidden_states_scale'}
    - step: fc1
      name: Independent paired projection slices
      math: |
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        With clipped gather4, row m uses hidden token Route[b+(m if m<v else 0),0].
        Scales are fetched only for m<v and payload rows only
        through 4*ceil_div(v,4), repeating the first valid token in the last partial
        group. Other scale/payload rows retain unspecified local bytes from prior use.
        Extra rows are evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. For slice l=0..SK-1, let h0=l*H/SK.
        D1(-1)=0; D1(s)=mma32(Xtile[:,h0+64*s:h0+64*(s+1)],
          Wpair[:,h0+64*s:h0+64*(s+1)]^T,D1(s-1)), s=0..H/(64*SK)-1.
        For m<v, let last=H/(64*SK)-1 and write Part[l,b+m,n:n+Bn1]=D1(last)[m,:Bn1]
        and Part[l,b+m,I+n:I+n+Bn1]=D1(last)[m,Bn1:].
        Part[:,Rv:Rcap,:] is neither initialized nor overwritten by FC1.
      symbol:
        D1: {meaning: One slice's paired projection accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,n1,l); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw FP32 slice partials consumed by the separate activation pass, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage; the first update of each slice disables the previous accumulator. Native internal product/reduction rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Ordered slice sum and non-folded activation with packed quantization
      math: |
        Visit every capacity row r<Rcap, not just r<Rv. Let er=Route[r,2],
        Vact={r | 0<=r<Rcap and 0<=er<E}, Nact=count(Vact).
        For each r in Vact and i<I, Sum1(-1)=(0,0);
        Sum1(l)=add32(Sum1(l-1),(Part[l,r,i],Part[l,r,I+i])), l=0..SK-1.
        Let (up,gate)=Sum1(SK-1), and e=er. Apply Contract's asymmetric clamp.
        Rows r>=Rv have unspecified er and Part bytes. An out-of-range er skips
        activation and stores; an in-range stale er computes and writes Aq/As from
        those bytes. These rows do not enter valid FC2 results. With ACTV2 enabled,
        partials are read even before er is checked; otherwise only Vact reads them.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), Sg(x)=rcp_approx(1+ex2_approx_ftz(x*L2E)),
        and Th(x)=fma32(Sg(x+x),2,-1).
        For activation_type=3, Ap=(gate*Sg(gate*a))*(up+bpar).
        For activation_type=10, tg=a*Th(gate*ia), tu=bpar*Th(up*ib),
        and Ap=(tg*Sg(gate))*tu. Parenthesized FP32 operations retain their shown order;
        argument scaling is not folded into L2E. ia and ib are evaluated even for
        SwiGLU, where they are unused (ib may be infinite).
        For every row and G-channel block, amax is the max of eight pairwise absolute maxima;
        combine pairs (0,1),(2,3),(4,5),(6,7), then the first/second halves and finally both halves.
        Use fmax semantics, including ignoring a NaN operand when the other operand is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))).
        q[i]=Q4(Ap[i]*inv), using Contract's RNE saturating E2M1 code rule and low-even-nibble packing.
        This multiplication is evaluated also when s8=0; do not replace it by a guarded division.
        Store packed q and s8 for all blocks of each r in Vact; other rows retain
        prior Aq/As bytes. The decoded operand is d(q)*s8; a zero scale therefore
        need not have a zero payload code. Discarded padded FC1 accumulators never enter activation.
      symbol:
        Sum1: {meaning: Ordered FP32 up and gate slice sum, shape: [{pair: 2}], dtype: fp32,
          retention: 'carry_forward (r,i); l=-1..SK-1'}
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          Sg uses ex2.approx.ftz.f32 and rcp.approx.f32; the sigmoid identity for tanh and multiply-by-rounded-reciprocal normalization replace the reference evaluation. unknown: no verified bound for the composed error over this entire path is supplied; source comments and external acceptance records do not establish one.
    - step: fc2
      name: Project and atomically combine BF16-rounded routes
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. TMA reads Aq row b+m,
        which may cross into another expert or unwritten capacity; outside the Rcap-row
        byte matrix payload is zero-filled. Let QTile decode
        these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For each m<v, let (t,k,e)=Route[b+m,:] and
        C[b+m,n:n+Bn2]=fp32(fp32(bf16(D2(I/64-1)[m,:]))*route_weights[t,k]).
        BF16 rounding precedes weighting; C is consumed immediately without a route tensor store.
        Padded rows are read from D2 and discarded. FC2 evaluates the per-item activation
        parameters and reciprocals without using them, plus the unused folded constants
        (a*L2E,a*L2E,a*L2E) for SwiGLU or (L2E,ia*(2*L2E),ib*(2*L2E)) for SiTU.
        FC1's partial-store epilogue also evaluates these unused constants.
        Acc32(-1)=zeros([T,H]) each invocation. Let pi enumerate all Rv*H scalar updates
        ((t,k),h) for (t,k) in V, preserving each output element's actual atomic order.
        For u=0..Rv*H-1, with ((t,k),h)=pi[u], update
        Acc32(u)[t,h]=add_native32(Acc32(u-1)[t,h],C[route_of[t,k],h]);
        all other elements keep their preceding value. Vector components need not share
        a route order. The allocated BF16 rout scratch is neither written nor read.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        C: {meaning: Logical weighted route contributions consumed immediately without materialization, shape: [{route: Rcap}, {hidden: H}], dtype: fp32}
        Acc32: {meaning: Token output sum retained through conversion, shape: [{token: T}, {hidden: H}], dtype: fp32,
          retention: 'carry_forward invocation; u=-1..Rv*H-1'}
      arithmetic:
        accumulate: |-
          D2 uses native block-scaled arithmetic and ascending updates across its full reduction. add_native32 is component-wise red.global.add.v4.f32 with its native global FP32 reduction semantics. The FP32 product is rounded separately from addition; atomic arrival order is not fixed.
    - step: convert
      name: Round the completed token accumulator
      math: |
        After the zero initialization and all FC2 updates, Y[t,h]=bf16(Acc32(Rv*H-1)[t,h]).
        Overwrite every element of the supplied output view and return [output].
        Empty routing has no projection or gather payload work, but still runs the
        capacity-sized activation pass over unspecified scratch; initialized Acc32(-1)
        still produces all-zero Y. Acc32 is not self-cleared after conversion.
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: '16*Rv*I baseline bytes -> 8*SK*Rv*I valid partial bytes plus 9*Nact*I/16 written payload/scale bytes; reserved partial and act capacity is 8*SK*Rcap*I + 2*Rcap*I bytes', by: [fc1, activate]}
      - {item: Route reduction storage, change: '2*Rv*H live BF16 route bytes -> 4*T*H FP32 token bytes; host still reserves the unused 2*Rcap*H-byte rout buffer, so reserved capacity increases by 4*T*H bytes', by: [fc2, convert]}
      traffic:
      - {item: Split partial handoff, change: '8*Rv*I baseline projection-result bytes written and read each -> 8*SK*Rv*I written plus 8*SK*Nact*I read, or 8*SK*Rcap*I read with ACTV2; slice materialization separates FC1 from activation', by: [fc1, activate]}
      - {item: Repeated route publication, change: 'Nprep full map publications, each writing 4*(3*E+2+3*Rv+Rcap+2*J) logical bytes, plus any independently submitted preparation; concurrent stores may target the same bytes', by: [routing]}
      - {item: Route reduction traffic, change: 'Remove 4*Rv*H BF16 route write/read bytes; add 8*T*H zero/write-and-convert/read bytes and Rv*H FP32 atomic read-modify-writes, excluding unchanged output stores and without a DRAM traffic claim', by: [fc2, convert]}
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> Nact*I elements for clamp/activation/quantization, plus 2*SK*Nact*I FP32 additions from zero to merge slices; capacity metadata visits cover Rcap rows', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          Per recomputation: two Rcap-slot histogram/scatter traversals, Nc*E chunk prefixes, two E-wide prefixes and J tile searches; each active slot also counts up to 63 earlier positions within its 64-slot chunk. Repeat Nprep times, including workers with no projection work. Independently submitted preparation adds its own histogram, prefixes and scatter.
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: Affects Nact*I evaluations through the explicitly defined approximations; no established full-domain output
          error bound
        by: [activate]
      - {item: Split reduction ordering, change: 'Each FC1 output channel uses SK independently initialized native reduction chains and an ascending FP32 slice sum; no bitwise equivalence to the unsplit chain is promised', by: [fc1, activate]}
      - {item: Route sum ordering, change: 'Rv*H contributions use separately rounded FP32 products and native atomic addition in unspecified per-element order; no established full-domain output error bound', by: [fc2]}
  work_schedule:
    thesis: |-
      Every FC1 CTA first recomputes the complete map, then runs its strided WS split-K work. A separate activation pass merges the two slices; monolithic REDF FC2 and convert finish the token output.
      Let Small mean Rcap<=S. If Small and PREP2, submit prepare using k_prepare_small2; otherwise if Small and KEEP_PREP, submit k_prepare_small; otherwise Small omits independent preparation. Outside Small, always submit counts/fill memset -> count -> scan -> scatter. cfg96 never submits gather. Optional phases and their handoffs exist only in the selected chain.
      The selfprep and fc1 phases are one kernel with per-worker order: each of Nprep CTAs finishes its own full-map recomputation before projection setup, without a grid barrier. All CTAs do this, including surplus workers and empty routing. No split-K last-arriver counter exists (cnt_n=0). Prepared is the union of the same global arrays; its local_map event is only a CTA rendezvous. Specific map components reach downstream kernels at the shared selfprep/fc1 kernel_done.
      selfprep runs before the FC1 pdl_wait. If independent preparation is present, that wait occurs only after selfprep's global map reads/writes, before projection setup. Under PDL, independent preparation can still be writing those allocations; its atomic ranking need not equal the stable map. No pre-selfprep wait, cross-CTA map handshake or corrective rerun exists. Thus the source race documented in routing remains within this node; launch selection is not a correctness guarantee. With PDL off, stream ordering completes independent preparation first.
      Before any preparation, record ze0 on invocation stream s. Persistent nonblocking side stream zs waits for ze0, clears all 4*T*H Acc32 bytes and records ze1. After activate submission, s waits for ze1 immediately before FC2. The clear may overlap preparation and FC1/activate; it must finish before any FC2 atomic update, including empty routing. The memset is not a computation phase. Graph capture retains the fork/join; these events do not synchronize unrelated invocation streams.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. launch_ready permits early admission; each kernel's griddepcontrol wait supplies its stated predecessor completion, with the selfprep exception above. Otherwise the stream serializes kernels and the controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [selfprep, fc1], order: per_worker, protocol: source_pdl}
      - {phase: [activate], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: source_pdl, start_after: activate.launch_ready}
      - {phase: [convert], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter], storage: global, ready: scan.kernel_done}
        Prepared: {producer: selfprep, consumer: [fc1], storage: global, ready: selfprep.local_map}
        Route: {producer: selfprep, consumer: [activate, fc2], storage: global, ready: selfprep.kernel_done}
        Tile: {producer: selfprep, consumer: [fc2], storage: global, ready: selfprep.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
        Aq: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        As: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        Acc32: {producer: fc2, consumer: [convert], storage: global, initialize: 0, ready: fc2.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small and (PREP2 or KEEP_PREP): one CTA prepares the map before the SELFPREP kernel is submitted.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      selfprep:
        describe: Every submitted FC1 CTA redundantly forms the complete routing map before entering its projection sequence.
        decomposition:
          strategy: Nprep=Grid(SK*I/Bn1) from fc1. Replica denotes a redundant full-map computation, not a disjoint output partition; all replicas write the same global arrays. The stable ranking reads current route IDs on every invocation.
          partition: {replica: {size: Nprep, tile: 1}}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}, Route: {shape: [{route: Rcap}, {field: 3}], dtype: int32}, Tile: {shape: [{tile: Jcap}, {field: 2}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          worktile_order: [{by: replica, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc1:
        describe: |-
          After this CTA's selfprep, one expert tile, one hidden slice and Bn1 paired channels produce raw FP32 partials. Xq/Xs are original-token views addressed through Route. Local reduction stages cover H/SK channels.
        decomposition:
          strategy: |-
            cfg96 fixes Bm=128, Bn1=64, Bk=256, SK=2, AMODE=3, STAGES=3, SFS=2, EPI=4, BRLESS=DEEP=SFCH=SELFPREP=true and SFPF=2. FUSE=PP=CPHOIST=EARLYDONE=TSTORE=EPITB=NPAIR=false and NIPRE=PFTMA=MBH=0. H/(Bk*SK) is integral in the shared domain.
            Let Nx=SK*I/Bn1 for FC1 and H/Bn2 for FC2. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 CTAs have 224 threads; FC2 CTAs have 128. Both stride flattened work IDs with channel fastest. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              Xq: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              Xs: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      activate:
        describe: Sum all FC1 slices for capacity rows with an in-range stored expert ID, then clamp, activate and quantize.
        decomposition:
          strategy: |-
            Flatten (route, I/G block) with block fastest. One 256-thread CTA owns 64 blocks of 16 channels, four adjacent lanes per block; lane quarter selects four channels. Tail lanes beyond Rcap*I/G*4 return. The expert-ID test is uniform in each four-lane group, not necessarily across a warp. ACTV2=act_v2()!=0 (default on) chooses compile-time SK and hoists every partial load before the expert test; otherwise load and accumulate one slice at a time after the test. Both sum from zero in ascending slice order.
          partition: {block: {size: Rcap*I/G, tile: 64}}
          worktile:
            invariant:
              Route: {shape: [{block: 64}, {expert: 1}], dtype: int32}
              Parameters: {shape: [{block: 64}, {value: 3}], dtype: fp32}
            iteration:
              Part: {shape: [{block: 64}, {channel: G}, {pair: 2}], dtype: fp32, direction: ascending}
          target:
            single_tile: {Aq: {shape: [{block: 64}, {packed_channel: G/2}], dtype: uint8}, As: {shape: [{block: 64}], dtype: fp8_e4m3fn}}
            tile_reduction: {dimension: slice, input: Part, output: [Aq, As], method: 'design.math_reshape::activate'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap*I/G,64)'}
        schedule:
          worktile_order: [{by: block, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the full intermediate reduction, then BF16 rounding,
          weighting and atomic accumulation into the corresponding token rows.
        decomposition:
          strategy: |-
            Use Bm=Bn2=128, Bk=256 and Grid from fc1. FC2-local parameters are STAGES=SFS=3, TMA=REDF=true, AMODE=0, SK=1, FUSE=BRLESS=PIPE=false. cfg46 uses SFCP=true and SFPRE=0; cfg47 uses SFCP=false and SFPRE=1. Both encode a 128-row A box and a 128-row B box, matching the 32768-byte stage transaction count. A map refusal returns 732, with no cp.async or rout-writing fallback; attribute/launch failures propagate.
            The same four warps stage operands, issue the full reduction and drain TMEM in 32-channel chunks. For every valid row, use its ptok/pslot to fetch the routing weight once per worktile; BF16-round and weight each chunk, then atomically merge into global Acc32. The side-stream clear and join in flow establish its zero initial state. Overlapping expert tiles merge at the addressed token/channel elements, without a slot-order reduction kernel. There are no separate epilogue warps, ping-pong accumulators or bulk-store sink.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 2}], dtype: int32}
              route_weights: {shape: [{route: Bm}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {C: {shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32}}
            tile_reduction: {dimension: tile, input: C, output: Acc32, method: 'design.math_reshape::fc2'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      convert:
        describe: Read the completed token accumulator and overwrite the caller view with BF16 results.
        decomposition:
          strategy: |-
            Flatten (token,hidden) with hidden fastest. Each 128-thread CTA covers 1024 elements; each lane converts eight adjacent elements. H is divisible by 1024 in the shared domain, so every submitted worktile is full.
          partition: {element: {size: T*H, tile: 1024}}
          worktile:
            invariant: {Acc32: {shape: [{element: 1024}], dtype: fp32}}
          target: {single_tile: {Y: {shape: [{element: 1024}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(T*H,1024)'}
        schedule:
          worktile_order: [{by: element, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      Each FC1 CTA first uses all seven warps for selfprep, then reuses them for projection roles; only a CTA rendezvous separates the phases. Its 4 KiB static chunk table is initialized anew each invocation and is not aliased to the dynamic GEMM buffers.
      FC1 assigns warp 0 to activation scales, warp 1 to payload and weight scales, warp 2 to ordered MMA, and EPI independent epilogue warps to TMEM drain. Its continuous payload/scale rings and all-epilogue accumulator release permit producer and epilogue overlap.
      For FC1 only, Nk1=H/(Bk*SK), Nrow=2*Bn1, AccCols=Nrow, NSFB=2, TCOLS=AccCols+16*SFS*(1+NSFB), TALLOC=256. Dpayload=STAGES, Chunks=Bn1/32=2, DrainWidth=64. For worktile t with slice l, local stage k reads global reduction stage l*Nk1+k; flattened g advances across the CTA's assigned work sequence without resetting rings.
      FC1 epilogue quadrant=warp_id%4; four independent warps drain paired 32-channel chunks, issue partial stores and collectively release the single accumulator. No activation runs there.
      FC2 uses one cooperative four-warp loop and one accumulator. Nk=I/Bk and TALLOC2=256, covering Bn2+32*SFS columns. Payload and scale slots use (t*Nk+k)%3; transaction and MMA completion parity continue across worktiles. All real copies and MMA reads finish before TMEM drain; global atomic updates can remain in flight after the worktile closes. No FC1 epilogue parameter applies to FC2.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      selfprep:
        milestone: {local_map: ['Main/publish:Prepared@done']}
        resource:
          Chunk: {space: SMEM, member_slot_shape: [{chunk: 4}, {expert: 256}], dtype: uint32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:7]
              verb:
                histogram: |-
                  No predecessor wait occurs here in this node (ZGUARD has a null pointer). All 224 threads clear the full Chunk table and rendezvous. Warp c handles chunk c in two 32-slot passes, reading current input IDs and atomically accumulating valid expert counts; all warps then rendezvous. No staged ID array is retained.
                prefix: |-
                  Threads sum chunk counts per expert, write global counts and rendezvous. Warp 0 reads those global counts and scans route/tile counts in 32-expert rounds with additive carries, writes offs/toffs including their terminal entries, then all rendezvous. Per-expert threads read global offs and replace Chunk counts by chunk-exclusive position bases, retaining each count until incorporated; rendezvous before any base is consumed.
                scatter: |-
                  Each chunk warp reloads its two ID passes. A 32-lane shuffle sweep counts equal-expert preceding lanes; the second pass additionally reloads all 32 first-pass IDs for a valid expert. Active slots write ptok/pslot/pexp and route_of using the stable rank; inactive slots write route_of=-1. All seven warps rendezvous.
                publish: |-
                  Read global toffs[E], distribute tile IDs with stride 224, binary-search global toffs and write texp/tm0. A final CTA rendezvous ends this worker's map preparation and permits its FC1 setup. Chunk is dead thereafter but remains statically allocated until kernel exit. Replicas issue ordinary same-value global stores without cross-CTA synchronization. This local_map event does not protect against the independently submitted preparation's conflicting writes and does not publish a completed grid to downstream kernels.
            pipe: {steady: ['histogram:ChunkCounts', 'prefix:ChunkBases', 'scatter:Route', 'publish:Prepared']}
      fc1:
        domain: {t: worktile, k: [0, Nk1], g: {flatten: [t, k]}, c: [0, Chunks]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, AccCols]}}
              TScale(g): {part: {column: [AccCols+16*(1+NSFB)*(g%SFS), AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  After this worker's selfprep, all roles execute pdl_wait for the preceding grid. Warp 0 then triggers successor admission; this late wait does not order earlier selfprep accesses. If J=0 all return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and publish setup with one CTA rendezvous. Surplus CTAs still initialize and retire. The continuous stage counter never resets between worktiles.
                prime: |-
                  Resolve tile/expert/route bases and slice stage offset. Follow ptok into original input scales; skip register loads and shared writes for padded rows, retaining old slot bytes. Read local stages 0 and 1 when present into two register sets before the stage loop.
                produce: |-
                  After scale-ring reuse, write the current registers into AScale(g), fence shared writes, then load k+1 into the alternate register set when present. The primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish this readiness contribution. No load passes the worktile end.
                retire: Join the final CTA rendezvous after every role's assigned sequence; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue A/B TMA payloads at the slice-offset stage: nbox=ceil_div(v,4) gather4 A boxes and two Bn1-row B boxes. Only the last A box's padded rows repeat the first valid token; unissued rows keep old slot bytes. Resolve ptok for all 128 rows even when some boxes are not issued. Completion covers 128*(4*nbox+Nrow) bytes.
                stage: |-
                  Wait for the two-slot scale ring after payload issue, independently of the three-slot payload ring. Issue weight-scale cp.async copies grouped into contiguous source spans, followed by 32 completion arrivals. The two B-scale images each allocate 128 rows but write/use only 64; remaining bytes are uninitialized, although full images are copied to TMEM. Prefetch weight scales k+SFPF only within this slice. Full-stage readiness joins completed TMA bytes, completed weight-scale copies and the activation-scale release arrival, including when some A rows are skipped.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'],
                'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: |-
                    For t>0, wait for all four epilogue arrivals releasing the previous worktile's accumulator. The first worktile has no such wait. Done means the single accumulator is reusable; stage readiness is awaited by compute.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale. One elected lane issues four ascending 64-channel updates using separate up/gate MMAs. The first update of each slice initializes Acc. Cumulative stage completion covers preceding scale copies and all MMA input reads, releasing shared slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data:
                compute:Stage(g): ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']
              reuse: {'begin:Acc(t+1)@done': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  At the worktile start, evaluate the unused expert parameters, reciprocals and folded constants, then wait for Acc(t). Each chunk loads its up/gate quadrant together into private Drain and waits for both TMEM reads, including padded rows.
                release: |-
                  After both chunks' TMEM reads and partial-store issues, rendezvous within the warp and issue one release arrival. MMA waits for all four arrivals before reusing Acc. No inter-warp rendezvous occurs here; global partial stores may remain in flight until grid completion.
                produce: |-
                  Valid rows issue eight float4 stores for each up/gate half into Part at this slice's slab and route row. Padded rows issue no stores. Done covers store issue, not kernel-global publication. No conversion or activation is performed.
            pipe: {steady: [{repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'produce:Part(t,c)']}, 'release:Acc(t)']}]}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      activate:
        resource:
          SliceLoads: {space: register, member_slot_shape: [{slice: 'SK if ACTV2 else 1'}, {block: 64}, {channel: G}, {pair: 2}], dtype: fp32, slot_count: 1}
          Sums: {space: register, member_slot_shape: [{block: 64}, {channel: G}, {pair: 2}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{block: 64}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the complete FC1 grid and let the first warp trigger successor admission; this wait publishes all slice stores.
                produce: |-
                  Each lane initializes four up/gate sums to zero. ACTV2 loads both float4 halves for every slice before reading pexp and testing its range, retains those loads, then accumulates them in order. Otherwise test pexp first, then load and accumulate each slice before reusing SliceLoads. Out-of-range expert IDs return; a stale in-range ID in spare capacity follows the full computation. Only after all slices have contributed are the sums consumed to form clamped activation values.
                  Each four-lane group covers one 16-channel quantization block. Compute four local values and a local maximum, then shuffle-xor by 1 and 2 to complete amax. Each lane produces four FP4 codes; shuffle-down by 1 joins adjacent halves, even quarters store four packed bytes and quarter 0 stores the scale byte. There is no CTA barrier or shared buffer. Grid completion publishes Aq/As to FC2; it does not clear Part or spare metadata.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Aq_As']}
      fc2:
        domain: {t: worktile, k: [0, Nk], c: [0, Bn2/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {'Payload(t,k)': {slot_index: '(t*Nk+k)%STAGES'}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {'Scale(t,k)': {slot_index: '(t*Nk+k)%SFS'}}
          ScaleRegisters:
            space: register
            member_slot_shape: [{row: 'Bm+Bn2 if SFPRE>0 else 0'}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 1
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC2}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(t,k): {part: {column: ['Bn2+32*((t*Nk+k)%SFS)', 'Bn2+32*((t*Nk+k)%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
          RouteToken: {space: register, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          RouteWeight: {space: register, member_slot_shape: [{row: Bm}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  The stream join has made Acc32 initialization complete. Wait for the activate grid and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor and rendezvous. Surplus CTAs with no assigned work still allocate and retire. Initialize counters once per CTA, not once per worktile.
                begin: |-
                  Resolve expert, channel and route bases; form Rows with padded entries repeating the first valid route, then rendezvous. Evaluate the unused activation parameters/reciprocals/constants specified in fc2. Keep row and weight addresses through the worktile.
                prime: |-
                  cfg47 sequentially fetches and lands scale stages 0 and 1 when present through one ScaleRegisters set, then prefetches stage 2 after payload priming. cfg46 copies scales asynchronously in the same groups as payload priming and has no scale-register prefetch.
                  Prime two payload groups, issuing only stages below Nk but committing empty cp.async groups for short loops. Each stage issues the two 128-row TMA payload boxes and arms 32768 bytes. All scale and payload targets are bounded by Nk; row padding uses Rows for scales and contiguous rows for TMA payload.
                advance: |-
                  At k>0 wait for MMA(k-1) completion and rendezvous, freeing shared slots for refill. For stage k+2 when present, cfg46 issues scale cp.async copies and cfg47 lands its prefetched scales; issue that stage's payload TMA boxes. Commit a cp.async group even when empty. Wait until at most two groups remain, wait for the current payload transaction and rendezvous so all current operands are readable.
                  One elected warp-0 lane fences shared writes to the async proxy, copies both current scale images to TScale, issues four ascending 64-channel MMAs and commits cumulative completion. The first update initializes Acc. Ordered scale-copy/MMA reads preserve TMEM scales until consumed. cfg47 then fetches stage k+3 when present into the single register set, after its old values have landed. Done covers these waits, refills and instruction issues; the current MMA may still be in flight.
                drain: |-
                  Wait for the last cumulative MMA commit, fence and rendezvous before reading Acc. Carry completion parity across worktiles. All real payload/scale copies have been consumed; only empty cp.async groups may remain. Load ptok and the score addressed by ptok/pslot once for each valid route, retaining RouteToken and RouteWeight through all channel chunks. Padded rows use zero metadata and issue no metadata reads.
                produce: |-
                  Each warp owns 32 route rows. Read the current 32-channel chunk from TMEM and wait for its reads, including padded rows. Valid rows round to BF16, widen, multiply by RouteWeight, and issue eight four-component FP32 atomic reductions into Acc32[RouteToken]. Padded rows are discarded. Done covers arithmetic and atomic issue, not completion of the global additions.
                close: |-
                  Rendezvous after all four warps finish their TMEM reads and atomic issues. Rows, Drain, route metadata and the single Acc can then be reused; global atomic updates may still be outstanding. This rendezvous does not publish the token sums.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. FC2 grid completion supplies visibility of all atomic updates to convert; the J=0 path leaves the cleared token buffer intact.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: k, steady: ['advance:Stage(t,k)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:C(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      convert:
        resource: {Values: {space: register, member_slot_shape: [{element: 1024}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including all atomic additions, then trigger admission.
                produce: |-
                  Each lane loads eight adjacent Acc32 values as two float4 vectors, converts four pairs to BF16 and stores one 16-byte output vector. The source grid-stride loop visits one vector per lane for this launch size. No route metadata, routing weight or previous output is read; Acc32 is retained until the next invocation's explicit clear.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and each projection's single accumulator.
  - item: design.tile_pipeline::fc1.Payload
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight row permutation, with matching scale images. FC1 uses clipped gather4 maps over the original token payload. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Use UINT8 TMA operand maps with the prepared-row permutation and 128-byte-swizzled shared payload. Bind payload readiness to transaction completion and scale readiness to cp.async commit/wait for cfg46 or fenced register-to-shared writes for cfg47.
    reason: Both operand paths must reach the same logical scale/payload pairing before the ordered MMA consumes them.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1's WS configurations return 733 on operand-map refusal; FC2 uses no drain map. For Small, both preparation kernel attributes are configured for a fixed 4*32768-byte opt-in even when their launch is skipped; failures still propagate. A submitted prepare uses 4*Rcap dynamic shared bytes. FC1 additionally owns the static 4*256-word selfprep table. Attribute/launch errors propagate to Model.forward. The REDF side stream and DisableTiming events persist process-wide; normal capture rejoins before EndCapture. Scratch, events and graph/map caches have no added lock or general cross-stream completion protocol; this extraction supplies none.
    reason: The source's exact placement of dependency waits, including selfprep before its wait, determines visibility; cached storage is reused across invocations.
