meta_data:
  name: nvfp4_fused_moe
  describe: Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise activation quantization, and a
    weighted expert reduction.
  source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: zero_split_ws
    parent: ws_split_ws
    when: |
      Let a be the effective ABI after Model.forward validation and content gates, or the
      cached ABI reused by its host fast path; use launch choices baked into a replayed graph.
      Select exactly when a.zflag is nonzero, a.cfg=99, and the actual FC2 is f4_body_ws
      with GEMM1=false (a.cfg2 in {57,81}), subject to tensor-map and launch dispatch.
      A rejected submission does not acquire a fallback. Here zflag is a pointer, not its
      current clean/dirty value: current dirty inputs remain in this node.
      On ABI construction the zero gate requires NVFP4_MOE_ZERO other than "0" or empty,
      no explicit nonnegative CFG/CFG2 override, the supported pair, and moe_zero_probe=1.
      That probe checks signed-zero hidden payload, finite hidden and weight scales,
      route weights, alpha/beta and optional clamp. Cached eligibility is not recomputed.
      Let S be positive a.small_thresh, otherwise native small_threshold(); graph replay
      uses its baked preparation choice. Let HostVerdict mean a.zflag_host is nonzero,
      allocated only for ZERO="2" and T*H>=2^20 after a successful probe. Eager, single-graph
      and two-graph execution belong here; actual graph state controls submission.
      Conditions apply independently over the shared Contract; parent is only the copy origin.
design:
  math_reshape:
    thesis: Verify current zero-input predicates and overwrite the output with zero before the guarded computation.
      Clean inputs avoid projections; dirty inputs execute a complete clipped-gather split-K FC1, ordered partial
      reduction/QDQ, WS FC2 and weighted finalize. Verification adds a full input scan and output write even on dirty
      calls; partial-sum traffic and dense padded arithmetic remain explicit.
    rewrite:
    - step: verify
      name: Revalidate the zero shortcut and overwrite output
      math: |
        Rcap=T*K; has_limit is 1 when clamp is present, else 0. For each submitted verification, let dirty be the OR of:
        any packed hidden nibble with nonzero magnitude bits (code & 7 != 0),
        any hidden scale byte s with (s & 0x7f)=0x7f, any nonfinite route weight,
        any nonfinite alpha or beta, and any nonfinite clamp value when present.
        Dirty is the local integer OR contribution of a work partition; dirty=OR(Dirty).
        Thus either sign of encoded zero is accepted. Store Verdict=int32(not dirty).
        Every verification unconditionally writes Y[t,h]=bf16(+0) for all t,h before the
        optional dirty computation, without reading incoming output or touching its guards.
        For Verdict=1 the final Y is zero and the host returns the same [output] alias.
        The remaining guarded computations do nothing; for Verdict=0,
        all subsequent rewrite steps execute and finalize overwrites this provisional zero.
        Graph submission can run verification twice; work_schedule defines that control.
        The initial eligibility probe also scans both complete weight-scale byte arrays;
        repeated verification does not scan weight scales, weight payloads or route IDs.
        Within the shared Contract the weight scales remain finite; no immutability or
        out-of-domain mutation guarantee is added. Initial probing does not write Y.
        Scratch allocations persist. A clean full-chain invocation leaves routing, partials,
        activation and Rout unchanged, except that the large-preparation counts/fill memset
        still clears both arrays; verify-only execution leaves those arrays unchanged too.
      symbol: {Verdict: {meaning: 'Current verification result at zflag[0]; 1 clean or 0 dirty', shape: [], dtype: int32,
          retention: keep_value verification}, Dirty: {meaning: Local contribution to the zero-verification OR, shape: [],
          dtype: int32}}
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        For the dirty chain, V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation policy is bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per split FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        SK: {meaning: Contiguous hidden-reduction slices, binding: 'bind:design.work_schedule::SK'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation,
          shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route: {meaning: 'Logical columns ptok pslot pexp in separate arrays; ptok feeds direct FC1, and the separate activation kernel reads pexp across the entire capacity', shape: [{route: Rcap},
            {field: 3}], dtype: int32, retention: keep_value invocation}
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: operands
      name: Read stored activations directly by route
      math: |
        FC1 reads hidden_states and hidden_states_scale directly through Route; no Xq/Xs
        allocation, conversion or pre-gather pass exists. Decode weights exactly as in
        Contract's Decode the stored operands; W1 and W2 denote those values without
        materializing decoded weight tensors.
    - step: fc1
      name: Slice-local paired projection and FP32 partial materialization
      math: |
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        Clipped direct gather4 (AMODE=3) gives fresh scales only to m<v. Payload rows
        m<4*ceil_div(v,4) read hidden token Route[b+(m if m<v else 0),0]. Unfetched
        payload rows and padded scale rows retain the operand slots' prior, possibly
        uninitialized bytes.
        All Bm rows are evaluated; padded results are discarded without partial stores.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. For each slice u=0..SK-1, C=H/SK and D1(-1)=0;
        h=u*C+64*s; D1(s)=mma32(Xtile[:,h:h+64],Wpair[:,h:h+64]^T,D1(s-1)),
        s=0..C/64-1. For m<v, store Part[u,b+m,n:n+Bn1]=D1(C/64-1)[m,:Bn1]
        and Part[u,b+m,I+n:I+n+Bn1]=D1(C/64-1)[m,Bn1:].
        Part[:,Rv:Rcap,:] retains prior bytes. The per-item activation parameters,
        reciprocals and folded constants are evaluated here but unused, as in FC2.
      symbol:
        D1: {meaning: Slice-local up and gate accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32, retention: 'carry_forward
            (j,u,n1); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw FP32 partials consumed by the separate reduction, shape: [{slice: SK}, {route: Rcap},
            {channel: 2*I}], dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32
          accumulator, not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each
          256-channel stage; the first update disables the previous accumulator. Native internal product/reduction
          rounding is not a bitwise FP32 reference promise.
    - step: reduce
      name: Capacity-wide ordered sum of the partials
      math: |
        Inspect every r in [0,Rcap). Let Er=Route[r,2], Qrows={r | 0<=Er<E}, and Re=count(Qrows).
        For r<Rv, Er is the actual expert; beyond Rv it is an unspecified retained pexp word.
        For each r in Qrows and block l=0..I/G-1, let B=[G*l,G*(l+1)); UpGate(-1)=0;
        UpGate(u)=UpGate(u-1)+[Part[u,r,B],Part[u,r,I+B]], u=0..SK-1, in FP32 slice order.
        up=UpGate(SK-1)[0,:]; gate=UpGate(SK-1)[1,:].
        Rejected rows do not sum or store. ACTV2 still loads every slice's partials before
        checking Er; without ACTV2, Er is checked before any partial load.
        No r<Rv test or tail initialization occurs. Accepted capacity-tail rows evaluate
        old partial bytes and can overwrite Aq/As there; no valid FC2 output depends on them.
      symbol: {UpGate: {meaning: Ordered merged up/gate values for one row and quantization block, shape: [{pair: 2},
            {channel: G}], dtype: fp32, retention: 'carry_forward (r,l); u=-1..SK-1'}}
    - step: activate
      name: Non-folded activation and branchless packed quantization
      math: |
        For r in Qrows, e=Er, apply Contract's asymmetric clamp to the merged up and gate.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), F(x)=rcp_approx(1+ex2_approx_ftz(x*L2E)),
        and Th(x)=fma32(F(x+x),2,-1).
        For activation_type=3, Ap=(gate*F(gate*a))*(up+bpar).
        For activation_type=10, tg=a*Th(gate*ia), tu=bpar*Th(up*ib), and Ap=(tg*F(gate))*tu.
        Parenthesized FP32 operations retain their shown order; prescales are not folded.
        ia and ib are evaluated even for SwiGLU, where they are unused (ib may be infinite).
        For each G-channel block, first form a maximum for each consecutive four elements
        from two pairwise absolute maxima; combine adjacent quarters, then both halves.
        All clamp and scale min/max operations use fminf/fmaxf semantics, ignoring a NaN
        operand when the other operand is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))).
        q[i]=Q4(Ap[i]*inv), using Contract's RNE saturating E2M1 code rule and low-even-nibble packing.
        This multiplication is evaluated also when s8=0; do not replace it by a guarded division.
        Store Aq[r,G*l/2:G*(l+1)/2] as packed q and As[r,l]=s8 for every r in Qrows.
        Rejected rows retain Aq/As bytes. The decoded operand is d(q)*s8; a zero scale
        therefore need not have a zero payload code.
      symbol:
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}],
          dtype: uint8, retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: 'F uses ex2.approx.ftz.f32 and rcp.approx.f32; the sigmoid identity for tanh and multiply-by-rounded-reciprocal
          normalization replace the reference evaluation. unknown: no verified bound for the composed error over this
          entire path is supplied; source comments and external acceptance records do not establish one.'
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, QTile uses Aq payload row b+m and As scale row b+m for m<v, b otherwise,
        Payload may cross into another expert or retained capacity; outside the Rcap-row
        byte matrix it is zero-filled. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item alpha, beta, reciprocals and folded constants: alpha*L2E for SwiGLU, or
        ia*(2*L2E), ib*(2*L2E) for SiTU; it does not use these values.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        For every (t,h), Z(-1)=0. For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        On a dirty invocation, empty routing performs no projection work; the capacity-wide reduce/activate
        still runs with the scratch behavior above. Finalize overwrites Y with zeros through route_of=-1.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs. Except for verification entries, the following counts describe the dirty
        chain.
      footprint: [{item: FC1 intermediates, change: 16*Rv*I FP32 bytes -> 8*SK*Rv*I current partial bytes plus 9*Re*I/16
            packed bytes; physical allocations are 8*SK*Rcap*I partial bytes and 2*Rcap*I act bytes, by: [fc1, reduce,
            activate]}]
      traffic:
      - {item: Split partials, change: Add 8*SK*Rv*I written bytes and 8*SK*Re*I read bytes; ACTV2 instead reads 8*SK*Rcap*I
          bytes before expert filtering, by: [fc1, reduce]}
      - item: Verification scan and provisional output
        change: Per verification add 9*T*H/16 + 4*Rcap + (8+4*has_limit)*E read bytes and 2*T*H output bytes. Initial
          eligibility additionally reads 3*E*H*I/16 weight-scale bytes. Dirty finalize writes the output again.
        by: [verify]
      matmul: [{item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs, including discarded rows under the
            bound worktile geometry', by: [fc1, fc2]}, {item: Clean shortcut, change: 'On clean inputs, 3*Rv*H*I direct
            MACs -> 0; no dirty-chain partial or activation traffic occurs. Allocations remain live.', by: [verify,
            fc1, fc2]}]
      vector: [{item: Partial reduction and activation, change: 'Add 2*SK*Re*I FP32 additions including the zero initial
            sum; Rv*I -> Re*I clamp/activation/quantization elements, with Rv<=Re<=Rcap', by: [reduce, activate]},
        {item: Routing auxiliaries, change: '+ two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J
            tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes
            up to 32 group counts per expert', by: [routing]}]
      error: [{item: Approximate activation and normalization, change: Affects Re*I evaluations through the explicitly
            defined approximations; no established full-domain output error bound, by: [activate]}, {item: FC1 accumulation
            grouping, change: One H-channel accumulation -> SK independent H/SK-channel accumulations and ordered
            FP32 additions; no bitwise equivalence to the unsplit reduction is asserted, by: [fc1, reduce]}]
  work_schedule:
    thesis: |
      Full denotes verify -> prepare -> fc1 -> activate -> fc2 -> finalize when Small
      (Rcap<=S); otherwise verify -> counts/fill memset -> count -> scan -> scatter ->
      fc1 -> activate -> fc2 -> finalize. There is no pre-gather, fused split counter,
      SELFPREP or REDF branch. Only the chosen preparation alternative is submitted.
      Each compute kernel reads Verdict after waiting for its actual predecessor and
      returns when clean; the large-path memset still clears 8*E bytes even when clean.
      Dirty work and handoffs below apply after that guard. Part/Route publish only their
      written valid prefixes; activation explicitly reads retained capacity tails.
      Eager execution and the single full graph submit Full once. With HostVerdict AND
      an existing exec_clean graph, graph_replay instead sets the host mirror to -1 and
      submits verify_pre (the verify-only graph). Outside outer capture it polls until
      the mirror changes or 200000000 spin iterations elapse: mirror=1 submits nothing
      more; any other value submits Full on the same stream. Under outer capture it
      records verify_pre then Full without polling. Thus fallback Full re-verifies and
      may itself be clean. Its verify and guards are never removed from the captured graph.
      A successful full-graph capture may be followed by verify-only capture; failure of
      that second capture leaves single-graph behavior. Graph-disabled/first-signature
      execution is eager; full capture is attempted on the second matching signature,
      and full capture failure disables capture and runs eagerly. A clean-graph launch
      error returns directly, without a fabricated fallback. The capture attempt calls
      run_pipeline on capture_stream even if BeginCapture fails; eager fallback adds no
      cross-stream join. Submission errors do not roll back already enqueued prefixes.
      These conditions describe actual submissions, not device-side conditional graphs.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or
      Rcap<pdl_big_r()), default threshold 49152. It separates successor admission from
      data readiness; otherwise stream order serializes kernels. The API enable_pdl
      argument does not select this policy. Every consuming grid waits for its actual
      predecessor; bypassed phases create no events. Host verdict is not kernel_done.
      ABI setup outside this repeated flow assigns the initial probe to 296 CTAs of
      256 threads: scan hidden payload/scales, all scores/parameters and both weight-scale
      arrays, use dirty CTAs' lane-0 non-atomic writes of 1 to a zeroed temporary word,
      synchronize the stream, copy that word to host,
      and free it. This selects eligibility only; the repeated flow reads current bytes.
    flow:
      launch:
      - {phase: [verify_pre], protocol: source_pdl}
      - {phase: [verify], protocol: source_pdl}
      - {phase: [prepare], protocol: source_pdl, start_after: verify.launch_ready}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [activate], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: source_pdl, start_after: activate.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts:
          producer: count
          consumer: [scan, fc1, fc2]
          storage: global
          initialize: 0
          ready: count.kernel_done
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [finalize], storage: global, ready: scatter.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
        Aq: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        As: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, activate, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [fc1, activate], storage: global, ready: scatter.kernel_done}
        Verdict:
          producer: verify
          consumer:
          - prepare
          - count
          - scan
          - scatter
          - fc1
          - activate
          - fc2
          - finalize
          storage: global
          ready: verify.kernel_done
    phase:
      verify_pre: &verify_work
        describe: Verify current bytes, zero the output and combine per-CTA dirty flags; flow defines submission.
        decomposition:
          strategy: |-
            Gz=min(max(T,1),296). One worktile is one stripe across all independent flattened
            passes. Stripe u owns indices 256*u+l+256*Gz*j (l=0..255, j>=0), clipped separately
            to T*H/8 output vectors, T*H/8 payload words, T*H/16 scale bytes, Rcap scores and E
            parameter entries. Nv=256*ceil_div(T*H/8,256*Gz), Ns=256*ceil_div(T*H/16,256*Gz),
            Nr=256*ceil_div(Rcap,256*Gz), Ne=256*ceil_div(E,256*Gz) bound each stripe's views;
            all tails are masked. The output vectors contain eight BF16 elements each.
            Last-arriver publication merges Dirty into Verdict without spinning on another CTA.
          partition: {stripe: {size: Gz, tile: 1}}
          worktile:
            invariant:
              hidden_states: {shape: [{byte: 4*Nv}], dtype: uint8}
              hidden_states_scale: {shape: [{scale: Ns}], dtype: fp8_e4m3fn}
              route_weights: {shape: [{slot: Nr}], dtype: fp32}
              Parameters: {shape: [{expert: Ne}, {value: 2+has_limit}], dtype: fp32}
          target: {single_tile: {Y: {shape: [{element: 8*Nv}], dtype: bf16}, Dirty: {shape: [], dtype: int32}}, tile_reduction: {
              dimension: stripe, input: Dirty, output: Verdict, method: 'design.math_reshape::verify'}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Gz}
        schedule: {worktile_order: [{by: stripe, direction: ascending}], worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}}
      verify: *verify_work
      prepare:
        describe: 'When Full is submitted and its Verdict=0: Only for Small: one CTA stages IDs, forms private histograms
          and prefixes, scatters routes and builds all tiles.'
        decomposition: {partition: {}, worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}, Verdict: {
                shape: [], dtype: int32}}}, target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
                dtype: int32}}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'When Full is submitted and its Verdict=0: Only outside Small: Produce block histogram contributions
          and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, Verdict: {shape: [], dtype: int32}}}
          target: {single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}, tile_reduction: {dimension: slot,
              input: counts_group, output: counts, method: 'design.math_reshape::routing'}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'When Full is submitted and its Verdict=0: Only outside Small: Joint route/tile prefix scan followed
          by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}, Verdict: {shape: [], dtype: int32}}}
          target: {single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'When Full is submitted and its Verdict=0: Only outside Small: Reserve per-expert ranges and publish
          forward and inverse route maps.'
        decomposition:
          strategy: Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each
            warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32},
              Verdict: {shape: [], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc1:
        describe: 'When Full is submitted and its Verdict=0: One expert tile, hidden slice and Bn1 paired channels
          read original-token operands through Route and produce raw FP32 partials.'
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256, SK=2, STAGES=3, SFS=2, AMODE=3, EPI=4.
            BRLESS=DEEP=NPAIR=SFCH=true, SFPF=2; PP=CPHOIST=EARLYDONE=TSTORE=EPITB=FUSE=
            SELFPREP=false and NIPRE=PFTMA=MBH=0. Each slice visits H/(Bk*SK) stages at
            hidden offset u*H/SK, exactly divisible throughout this domain.
            Let Nx=SK*I/Bn1 for FC1, H/Bn2 for FC2. Effective cap=grid_cap(), normally twice
            the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap,
            then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. Each CTA has 224 threads.
            Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, split: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
              Verdict: {shape: [], dtype: int32}
            iteration:
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              hidden_states: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          strategy: Flattened work is (expert tile, hidden slice, channel tile), with channel fastest. No last-arriver
            counters or in-grid slice reduction exist on this path.
          worktile_order: [{by: tile, direction: ascending}, {by: split, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      activate:
        describe: 'When Full is submitted and its Verdict=0: Sum all FC1 slices in order, apply non-folded activation
          and quantize each capacity-row block.'
        decomposition:
          strategy: 'Flatten (r, quantization block) with block fastest. One CTA owns 64 consecutive G-channel blocks,
            including capacity tails, and locally traverses all SK partials. ACTV2 means effective act_v2()!=0: specialize
            the slice count and load all slices before checking pexp; otherwise check pexp then load/sum slices one
            at a time. BRLESS=true throughout. This kernel is submitted even when Rv=0.'
          partition: {block: {size: Rcap*I/G, tile: 64}}
          worktile:
            invariant: {Route: {shape: [{block: 64}, {field: 1}], dtype: int32}, Parameters: {shape: [{block: 64},
                  {value: 3}], dtype: fp32}, Verdict: {shape: [], dtype: int32}}
            iteration: {Part: {shape: [{block: 64}, {pair: 2}, {channel: G}], dtype: fp32, direction: ascending}}
          target:
            single_tile: {Aq: {shape: [{block: 64}, {packed_intermediate: G/2}], dtype: uint8}, As: {shape: [{block: 64}],
                dtype: fp8_e4m3fn}}
            tile_reduction: {dimension: split, input: Part, output: UpGate, method: 'design.math_reshape::reduce'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap*I/G,64)'}
        schedule: {worktile_order: [{by: block, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc2:
        describe: 'When Full is submitted and its Verdict=0: One expert tile and Bn2 output channels over the entire
          intermediate reduction, followed by BF16 route materialization.'
        decomposition:
          strategy: |-
            Use Bm, Bk and Grid from fc1. Bn2=128, STAGES=3, SFS=2, EPI=4,
            AMODE=0, SK=1, BRLESS=true. PP=NPAIR=SFCH=FUSE=SELFPREP=false and
            SFPF=PFTMA=NIPRE=MBH=0. cfg57 has DEEP=TSTORE=EPITB=CPHOIST=EARLYDONE=false;
            cfg81 sets those five flags true. For cfg81, complete 32-row quadrants use bulk
            stores and partial quadrants use masked vector stores; cfg57 uses vectors throughout.
            cfg81 requires the additional drain tensor map. Map/attribute/launch failures
            return errors without a substituted WS implementation.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Verdict: {shape: [], dtype: int32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule: {worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}}
      finalize:
        describe: 'When Full is submitted and its Verdict=0: Reduce all route slots locally for a block of output
          channels and overwrite the caller view.'
        decomposition:
          strategy: Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(),
            otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin
            channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32},
              Verdict: {shape: [], dtype: int32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule: {worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}], worker_assignment: {
            preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}}
  tile_pipeline:
    thesis: |-
      Verification joins each CTA's scan with an OR, then uses a last-arriver ticket to
      publish Verdict and reset its scratch. Clean guards avoid all projection resources.
      Dirty projections use warp 0 for activation scales, warp 1 for payload and weight
      scales, warp 2 for ordered MMA and warps 3..6 for TMEM drain. FC1 stores raw partials;
      a separate SIMT kernel reduces and quantizes. Payload/scale rings persist across
      worktiles and slices. TMEM release, bulk source reuse and global completion differ.
      Both projections have Nrow=AccCols=128, Acount=1, NSFB=1 and TALLOC=256;
      Dpayload=STAGES if DEEP else SFS. FC1 has Chunks=2, DrainWidth=64, ReleaseAt=1;
      FC2 has Chunks=2 and DrainWidth=64 for EPITB, otherwise Chunks=4 and DrainWidth=32;
      ReleaseAt=0 if EARLYDONE else 1. Projection-local flags are bound in work_schedule.
      Each epilogue warp owns quadrant=warp_id%4 and independently drains chunks in order.
      MMA accumulator reuse waits for all four epilogue releases; their store tails remain
      independent. The first worktile has no prior-accumulator wait; ring-distance waits
      apply only after the corresponding earlier stage exists.
    phase:
      verify_pre: &verify_pipe
        resource: {DirtyLocal: {space: register, member_slot_shape: [{lane: 256}], dtype: uint32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission. This kernel has
                  no clean guard.
                scan: |
                  Initialize each lane's DirtyLocal=0. First store all assigned output vectors as
                  zero, then scan payload words, hidden scale bytes, scores and parameters in that
                  order. Each pass has its own grid-stride loop, including empty passes. The CTA OR
                  rendezvous waits for every lane to finish its scan and output-store issue.
                publish: |
                  If this CTA is dirty, lane 0 atomic-ORs zflag[1] with 1. In either case lane 0
                  executes a device fence then atomicAdd(zflag[2],1). Only the last ticket holder
                  reads the dirty fold, writes zflag[0]=Verdict and resets zflag[1:3] to zero.
                  When zflag_host is nonnull that lane executes a system fence and writes the same
                  verdict to the volatile pinned word. No CTA polls other CTAs, and other lanes/CTAs
                  may retire independently. zflag is four zero-initialized int32 words owned with
                  the ABI; word 3 is unused. Its reset is for the next ordered verification, not a
                  concurrency lock. Guard consumption waits for kernel completion. The host mirror
                  controls submission only and is not a completion event for all output stores;
                  no device synchronization is added when graph_replay observes a clean mirror.
            pipe: {prologue: ['enter:Input'], steady: ['scan:DirtyLocal', 'publish:Verdict']}
      verify: *verify_pipe
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission. Then the guard
                  performs its dependency wait and reads Verdict; if clean, every thread returns before all remaining
                  actions. Admission was triggered before this guard.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger
                  successor admission. Trigger does not publish computed data. Then the guard performs its dependency
                  wait and reads Verdict; if clean, every thread returns before all remaining actions. Admission was
                  triggered before this guard.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous,
                  then add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp. Then the guard performs
                  its dependency wait and reads Verdict; if clean, every thread returns before all remaining actions.
                  Admission was triggered before this guard.
                produce: Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using
                  two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse
                  tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp. Then the guard performs
                  its dependency wait and reads Verdict; if clean, every thread returns before all remaining actions.
                  Admission was triggered before this guard.
                produce: Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses,
                  reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks
                  and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally
                  and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real
                  slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      fc1:
        domain: {t: worktile, k: [0, H/(Bk*SK)], g: {flatten: [t, k]}, c: [0, Chunks]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {Payload(g): {slot_index: g%STAGES}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters:
            space: register
            member_slot_shape: [{row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {ARegisters(g): {slot_index: k%2}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view: {Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}, TScale(g): {part: {column: [
                    Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]}, dtype: fp8_e4m3fn}}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles first execute the guard dependency wait and read Verdict. If clean they
                  return before the usual entry trigger, J read, allocation or protocol initialization;
                  grid completion releases the next kernel. If dirty, wait for the predecessor,
                  let warp 0 trigger admission, and read J. J=0 returns before allocation. Otherwise
                  allocate Tensor, initialize stage/epilogue protocols and rendezvous once. Surplus
                  CTAs still initialize and retire. Continuous stage counters do not reset at worktiles.
                prime: |-
                  Resolve the slice's tile/expert/route bases and ptok token indirections. Read local
                  stages 0 and 1 when present into the two register sets, only for valid rows. Padded
                  rows are skipped at both load and shared-store sites, retaining their prior bytes.
                produce: |-
                  After scale-ring reuse, write current valid-row registers to AScale(g), fence
                  shared writes, then load k+1 into the alternate registers if inside this slice.
                  The primed stage 1 is reread at k=0. Warp rendezvous and one release arrival publish
                  readiness. Padded rows are skipped and no prefetch crosses the slice end.
                retire: Join the final CTA rendezvous after every role's assigned sequence and any bulk global store
                  drain; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue ceil_div(v,4) gather4 A boxes
                  at this slice's hidden offset, repeating the first valid token within the last box.
                  Unfetched rows retain prior payload bytes. Issue two Bn1-row B boxes. Completion
                  accounts for exactly 128*(128+4*ceil_div(v,4)) bytes.
                stage: |-
                  After payload issue, wait for the separate scale slot. SFCH groups weight-scale
                  cp.async4 copies into contiguous source spans; NPAIR lands both halves in one
                  128-row image matching [up|gate]. Issue 32 completion arrivals. SFPF hints k+2
                  only inside this slice; it allocates no slot and establishes no readiness event.
                  Full-stage readiness joins completed TMA bytes, weight-scale copies and the
                  activation-scale release arrival; padded activation rows need not be fresh.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': [
                  'MMA/compute:Stage(g)'], 'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: Wait for accumulator release from t-1, except on the first worktile, before stage 0 readiness
                    and scale-copy issue. Done means scale copies issued and accumulator reusable, not copies completed.
                    FC1 has one accumulator and no hoisted scale-copy path.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale unless begin already
                  issued stage 0 copies. One elected lane issues four ascending 64-channel block-scaled
                  MMAs spanning all 128 result columns; the first update initializes Acc. Cumulative
                  completion covers preceding scale copies and all MMA input reads, releasing shared
                  slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a
                  later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data: {'begin:Acc(t)@done': ['AScale/produce:AScale(g[t,0])', 'Payload/load:Payload(g[t,0])', 'Payload/stage:BScale(g[t,0])'],
                'compute:Stage(g)': ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']}
              reuse: {'begin:Acc(t+Acount)@done': ['Epilogue/release:Acc(t,Chunks-1,ReleaseAt)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Resolve expert parameters, reciprocals and unused folded activation constants,
                  wait for Acc(t), and load this quadrant's chunk into private Drain. Wait for every
                  issued TMEM read before use; FC1 pairs up/gate and FC2 pairs adjacent chunks only
                  when EPITB is enabled.
                release: Point 0 is immediately after the TMEM read wait; point 1 is after this chunk stores issue.
                  Only c=Chunks-1 and point=ReleaseAt performs a warp rendezvous and one release arrival. Other instances
                  are no-ops. MMA waits for all EPI arrivals on the chosen accumulator; no inter-warp rendezvous occurs
                  here and global stores may remain in flight.
                produce: For valid rows issue float4 stores of raw up/gate into this slice's disjoint Part range;
                  padded rows store nothing. Drain registers are reusable after store issue. No clamp, activation,
                  quantization, fence/counter publication or slice merge occurs here. All EPI release arrivals follow
                  the final chunk's stores; they release TMEM, not global Part visibility. The dependent activation
                  kernel waits for grid completion.
            pipe: {steady: [{repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'release:Acc(t,c,0)', 'produce:Part(t,c)',
                        'release:Acc(t,c,1)']}]}]}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      activate:
        resource:
          PartialRegisters: {space: register, member_slot_shape: [{slice: SK if ACTV2 else 1}, {block: 64}, {pair: 2},
              {channel: G}], dtype: fp32, slot_count: 1}
          UpGate: {space: register, member_slot_shape: [{block: 64}, {pair: 2}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the complete FC1 grid, then let the first warp trigger successor admission. Then the
                  guard performs its dependency wait and reads Verdict; if clean, every thread returns before all
                  remaining actions. Admission was triggered before this guard.
                produce: |-
                  Four adjacent lanes own one G-channel block, four channels per lane; one CTA covers 64 blocks. Capacity bounds are checked first. With ACTV2, load both float4 partial vectors for every slice into PartialRegisters, then read and range-check pexp; otherwise read/check pexp first and load each slice just before adding it. Rejected groups return; accepted groups initialize UpGate to zero and add slices in ascending order, then use the non-folded activate formulas.
                  Each lane forms a four-value maximum; XOR exchanges 1 then 2 merge the four quarters. Normalize and pack four nibbles per lane; a shuffle joins adjacent halves for the two 32-bit payload stores, and quarter 0 stores the scale byte. No CTA barrier or shared storage is used. Every participating group has four live lanes; accepted spare rows follow the same path. Registers die after stores issue, and kernel completion publishes Aq/As before FC2 consumption.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Aq_As']}
      fc2:
        domain:
          t: worktile
          k: [0, I/Bk]
          g: {flatten: [t, k]}
          c: [0, Chunks]
          h: [0, DrainWidth/32]
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {Payload(g): {slot_index: g%STAGES}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters:
            space: register
            member_slot_shape: [{row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 2
            view: {ARegisters(g): {slot_index: k%2}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view: {Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}, TScale(g): {part: {column: [
                    Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]}, dtype: fp8_e4m3fn}}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
          Sink: {space: SMEM, member_slot_shape: [{quadrant: 4 if TSTORE else 0}, {row: 32}, {hidden: 32}], dtype: bf16,
            slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles first execute the guard dependency wait and read Verdict. If clean they
                  return before the usual entry trigger, J read, allocation or protocol initialization;
                  grid completion releases the next kernel. If dirty, wait for the predecessor,
                  let warp 0 trigger admission, and read J. J=0 returns before allocation. Otherwise
                  allocate Tensor, initialize stage/epilogue protocols and rendezvous once. Surplus
                  CTAs still initialize and retire. Continuous stage counters do not reset at worktiles.
                prime: |-
                  Resolve tile/expert/route bases. Use As for activation scales, repeating the first
                  valid row's scales for padding. Read local stages 0 and 1 when present into the
                  two register sets before the stage loop.
                produce: After scale-ring reuse, write the current registers into AScale(g), fence shared writes,
                  then load k+1 into the alternate register set when present. The primed stage 1 is reread at k=0.
                  A warp rendezvous and one release arrival publish this readiness contribution. No load passes the
                  worktile end.
                retire: Join the final CTA rendezvous after every role's assigned sequence and any bulk global store
                  drain; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]',
                      steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue one 128-row A TMA box and
                  one 128-row B box. Completion accounts for 128*(Bm+Nrow) bytes.
                stage: |-
                  DEEP waits for scale reuse after payload issue; otherwise the preceding SFS-distance
                  wait covers both. Copy weight scales in contiguous 16-byte pieces and issue 32
                  completion arrivals. Full-stage readiness joins completed TMA bytes, completed
                  weight-scale copies and the activation-scale release arrival; payload arrival alone
                  is insufficient.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': [
                  'MMA/compute:Stage(g)'], 'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: If CPHOIST, t>0 and Rcap>=16*E, first wait for stage 0 readiness and issue its scale copies
                    into disjoint TScale, then wait for the prior accumulator release. Otherwise wait for accumulator
                    release before stage 0 readiness and scale copies. The prior user is t-1; the first worktile has
                    no such wait. Done means scale copies issued and accumulator reusable, not copies completed.
                compute: |-
                  Wait for full-stage readiness and copy scales into TScale unless begin already
                  issued stage 0 copies. One elected lane issues four ascending 64-channel block-scaled
                  MMAs spanning all 128 result columns; the first update initializes Acc. Cumulative
                  completion covers preceding scale copies and all MMA input reads, releasing shared
                  slots. The ordered scale-copy/MMA stream reads each TMEM scale operand before a
                  later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data: {'begin:Acc(t)@done': ['AScale/produce:AScale(g[t,0])', 'Payload/load:Payload(g[t,0])', 'Payload/stage:BScale(g[t,0])'],
                'compute:Stage(g)': ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']}
              reuse: {'begin:Acc(t+Acount)@done': ['Epilogue/release:Acc(t,Chunks-1,ReleaseAt)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                load: |-
                  Resolve expert parameters, reciprocals and unused folded activation constants,
                  wait for Acc(t), and load this quadrant's chunk into private Drain. Wait for every
                  issued TMEM read before use; FC1 pairs up/gate and FC2 pairs adjacent chunks only
                  when EPITB is enabled.
                release: Point 0 is immediately after the TMEM read wait; point 1 is after this chunk stores issue.
                  Only c=Chunks-1 and point=ReleaseAt performs a warp rendezvous and one release arrival. Other instances
                  are no-ops. MMA waits for all EPI arrivals on the chosen accumulator; no inter-warp rendezvous occurs
                  here and global stores may remain in flight.
                pack: Convert this 32-channel half of Drain to BF16 output registers, preserving route rounding before
                  weighting.
                recycle: 'Only TSTORE and a full valid quadrant use Sink: the issuing lane waits until ALL previous
                  bulk stores have consumed their shared source, including the previous worktile, then the warp rendezvous
                  permits overwrite. This is not global completion. Partial quadrants neither touch Sink nor clear
                  pending groups.'
                store:
                  execution_mode: async
                  meaning: TSTORE full quadrants stage 32x32 BF16 values, fence to the async proxy, rendezvous, and
                    issue/commit a bulk store from one lane. All other cases use valid-row-masked vector global stores.
                    Done means global completion; bulk completion is established by drain, not recycle.
                drain: After all worktiles, every bulk issuing lane waits for ALL stores to complete globally, then
                  joins the final CTA rendezvous. Non-TSTORE and empty sequences have no bulk groups. There is no
                  per-worktile global drain.
            pipe: {steady: [{repeat: t, steady: [{repeat: c, steady: ['load:Drain(t,c)', 'release:Acc(t,c,0)', {repeat: h,
                          steady: ['pack:Rout(t,c,h)', 'recycle:Sink(t,c,h)', 'store:Rout(t,c,h)']}, 'release:Acc(t,c,1)']}]}],
              epilogue: ['drain:Rout']}
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding grid, including global bulk-store completion, then trigger admission.
                  Then the guard performs its dependency wait and reads Verdict; if clean, every thread returns before
                  all remaining actions. Admission was triggered before this guard.
                produce: Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route
                  loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the
                  full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads
                  and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit
      completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect the separate shared rings and single accumulator.
  - item: ['design.tile_pipeline::fc1.Payload', 'design.tile_pipeline::fc2.Payload']
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight
      row permutation, with matching scale images. FC1 uses gather4 maps; FC2 uses
      route-row maps. Bind joint readiness to transaction-counted TMA completion,
      cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all
      three producers.
  - item: design.tile_pipeline::fc2.Epilogue
    choice: For TSTORE use cp.async.bulk.tensor.2d.global.shared::cta.bulk_group with the 64-byte by 32-row byte-view
      map, async-proxy fence, per-issuer wait_group.read 0 for source reuse and wait_group 0 before the final CTA
      rendezvous.
    reason: Source reuse permits outstanding global stores; finalize requires their stronger final completion.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl and guards to programmatic stream serialization and griddepcontrol
      wait/launch_dependents; the off case relies on stream order. Model.forward retains
      ABI, input, scratch, device-flag and pinned-mirror ownership, refreshing the stream
      on host-cache hits. Graphs retain their baked parameters; return enqueues work,
      including after the optional host verdict poll, without an output-completion wait.
      Map caches include pointers, dimensions, mode, box geometry, L2 promotion and
      refusals. Operand-map refusal returns 733; cfg81 drain-map refusal returns 738
      (native launch helpers). Small preparation requests 4*Rcap dynamic shared bytes
      with a fixed 4*32768-byte opt-in; oversized forced small thresholds do not select
      large preparation automatically. Attribute/launch errors propagate to Model.forward.
      Scratch and process-global graph/map caches have no added lock or cross-stream
      completion protocol. No such guarantee is supplied by this design.
    reason: Cached eligibility and storage remain live across invocations; a host verdict does not replace stream
      completion.
  - item: ['design.tile_pipeline::verify.Main', 'design.tile_pipeline::verify_pre.Main']
    choice: |-
      Bind the CTA fold to __syncthreads_or, dirty aggregation to atomicOr, and last-arriver
      tickets to atomicAdd. Preserve the lane-0 device fence before its ticket and system
      fence before the volatile pinned-mirror write. These are the source publication
      operations; they do not introduce a host wait for verification kernel completion.
    reason: The ticket result selects the unique writer and resetter of the shared verdict state.
