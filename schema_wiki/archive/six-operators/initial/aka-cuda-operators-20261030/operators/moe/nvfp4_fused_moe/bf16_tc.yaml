meta_data:
  name: nvfp4_fused_moe
  describe: Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise activation quantization, and a weighted
    expert reduction.
  source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: bf16_tc
    parent: mono_fused_mono
    when: |-
      Let a be the effective ABI after Model.forward configuration validation and content
      gates, or the ABI reused on its host-cache hit; for replay use the baked launch set.
      Select exactly when a.cfg and a.cfg2 are both in {4,5,6}. These configurations have
      a.zflag=0 and launch k_gemm_tc for both projections. They independently choose
      their BM/BN/NSUB; no extra BM-pairing correction is implied.
      Let S be a.small_thresh when positive, otherwise native small_threshold(). For graph
      replay retain its captured preparation choice. Rcap=T*K and Small means Rcap<=S.
      Parent only identifies the copying origin; this condition is independent over the
      shared Contract. Cached configuration is not recomputed from in-place data changes.
design:
  math_reshape:
    thesis: Compact routes by expert, decode all hidden values once to BF16, and decode weights inside each projection.
      Fuse FC1 activation and NVFP4 QDQ into a BF16 act buffer; dense projections trade expanded operands
      and padded work for reuse of decoded weights across 128 or 256 route rows.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm1). J=toffs[E]; P1=Bm1*J; P2=Bm2*J.
        The preparation policy is bound by design.work_schedule; the single Tile map uses FC1 Bm1.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm1*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm1)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm1: {meaning: FC1 row span and shared route-map stride, binding: 'bind:design.work_schedule::Bm1'}
        Bm2: {meaning: 'FC2 row span, independently selected', binding: 'bind:design.work_schedule::Bm2'}
        Bn1: {meaning: Intermediate channels per fused FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route: {meaning: Logical columns ptok pslot pexp in separate arrays; FC1 consumes only ptok, shape: [{route: Rcap},
            {field: 3}], dtype: int32, retention: keep_value invocation}
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: decode
      name: Materialize exact BF16 hidden operands
      math: |-
        Decode X, W1 and W2 by Contract's Decode the stored operands.
        For every token and hidden channel, Xbf[t,h]=bf16(X[t,h]), including tokens with no active route.
        Weight operands are bf16(W1) and bf16(W2), decoded as needed without a global weight tensor.
        Finite E2M1 times E4M3FN products fit BF16 exactly; these conversions retain the stored values.
      symbol: {Xbf: {meaning: Decoded token-major hidden buffer for FC1, shape: [{token: T}, {hidden: H}], dtype: bf16,
          retention: keep_value invocation}}
    - step: fc1
      name: Paired BF16 projection over the shared expert map
      math: |-
        For j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v1=min(Bm1,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm1 rows.
        Row m uses Xbf[Route[b+(m if m<v1 else 0),0],:]. Padding repeats the first valid row.
        Let Xtile collect those rows; Wpair concatenates bf16(W1[e,n:n+Bn1,:])
        and bf16(W1[e,I+n:I+n+Bn1,:]). D1(-1)=0;
        D1(s)=mma32(Xtile[:,16*s:16*(s+1)],Wpair[:,16*s:16*(s+1)]^T,D1(s-1)),
        s=0..H/16-1. up=D1(H/16-1)[:,:Bn1]; gate=D1(H/16-1)[:,Bn1:].
      symbol: {D1: {meaning: Paired up/gate accumulators, shape: [{row: Bm1}, {channel: 2*Bn1}], dtype: fp32, retention: 'carry_forward
            (j,n1); s=-1..H/16-1'}}
      arithmetic:
        accumulate: BF16 multiplication inputs with FP32 accumulation. Four ascending 16-channel updates form each 64-channel
          stage; each row sub-block has an independent accumulator initialized by its first update. Native internal reduction
          rounding is not a bitwise FP32 reference promise.
    - step: activate
      name: Fuse library activation and guarded QDQ to BF16
      math: |-
        Only for m<v1, apply Contract's asymmetric clamp to up and gate.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], Sig(x)=rcp_rn(1+expf(-x)).
        For activation_type=3, Ap=(gate*Sig(a*gate))*(up+bpar).
        For activation_type=10, t0=a*tanhf(gate/a), t1=bpar*tanhf(up/bpar),
        and Ap=(t0*Sig(gate))*t1. Retain the shown FP32 operation order.
        For each valid row and block ell=0..Bn1/G-1, let Vq[q]=Ap[ell*G+q].
        Start amax=0, then in channel order
        amax=fmax(amax,abs(Vq[q])) for q=0..15, using fmax's numeric-over-NaN semantics.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)); sf=fp32(s8).
        If sf>0, inv=rcp_rn(sf), q0=Vq[q]*inv, rem=fma32(-sf,q0,Vq[q]),
        z=fma32(rem,inv,q0). Let mag=abs(z) and code be the sum of indicators
        (mag>0.25),(mag>=0.75),(mag>1.25),(mag>=1.75),(mag>2.5),(mag>=3.5),(mag>5).
        Using Contract's magnitude table, Act[b+m,n+ell*G+q]=bf16(copysign(d(code),z)*sf).
        If sf=0, write positive BF16 zeros without evaluating normalization.
        Thus Act stores decoded QDQ values, not packed codes or stored scales; [Rv,Rcap) is unwritten.
        Padded rows have projection results and accumulator reads, but no clamp, activation or QDQ.
        Both projections also evaluate rcp_rn(a) and rcp_rn(bpar) per workitem; these values
        are unused by this activation and by FC2, including the infinite reciprocal when bpar=0.
      symbol: {Act: {meaning: BF16 decoded post-activation QDQ buffer consumed by FC2, shape: [{route: Rcap}, {intermediate: I}],
          dtype: bf16, retention: keep_value invocation}}
      arithmetic:
        approx: 'expf and tanhf are the FP32 library calls in activation(), with no use_fast_math build flag; sigmoid
          uses the correctly rounded reciprocal. QDQ normalization uses the explicit reciprocal/FMA refinement above.
          unknown: the source supplies no verified composed output-error bound over this node; inherited external acceptance
          records do not establish one.'
    - step: fc2
      name: Independently tiled BF16 route projection
      math: |-
        For j<J and n2<H/Bn2 use (e,m0)=Tile[j], b=offs[e]+m0,
        v2=min(Bm2,counts[e]-m0), n=n2*Bn2. For all Bm2 rows let
        QTile[m,:]=Act[b+(m if m<v2 else 0),:]. Padding repeats the first valid row.
        D2(-1)=0; D2(s)=mma32(QTile[:,16*s:16*(s+1)],
        bf16(W2[e,n:n+Bn2,16*s:16*(s+1)])^T,D2(s-1)), s=0..I/16-1.
        For m<v2 store Rout[b+m,n:n+Bn2]=bf16(D2(I/16-1)[m,:]); other rows are discarded.
        The map advances by Bm1 even in FC2. Let C2 be the union of its valid row intervals
        [b,b+v2), and U2=sum_{j<J}v2 count row writes with multiplicity.
        For Bm2=Bm1, C2=[0,Rv) with one write per element. For Bm2<Bm1, any upper
        part of a Bm1 tile beyond Bm2 is omitted: Rout there retains prior allocation bytes.
        For Bm2>Bm1, neighboring tiles of the same expert may overlap, issuing unordered
        non-atomic stores to the same Rout elements. No synchronization or repair is inserted.
        Rout[Rv:Rcap] is unwritten in all cases.
      symbol:
        D2: {meaning: FC2 accumulators, shape: [{row: Bm2}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/16-1'}
        Rout:
          meaning: BF16 route buffer; uncovered rows keep prior bytes and overlapping rows have multiple writers
          shape: [{route: Rcap}, {hidden: H}]
          dtype: bf16
          retention: keep_value invocation
      arithmetic: {accumulate: Same BF16-input arithmetic and ascending 16-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |-
        After FC2 grid completion, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Finalize reads every active route, including any FC2 coverage holes; the mismatched
        geometry therefore has no full-output correctness guarantee. Empty routing skips
        projection work but still decodes hidden values and overwrites Y with zeros.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 decoded hidden, up/gate, activation and
        decoded quantized activation, and BF16 route outputs.
      footprint:
      - {item: Hidden buffer, change: 4*T*H -> 2*T*H bytes of decoded hidden storage, by: [decode]}
      - {item: FC1 intermediates, change: 16*Rv*I bytes of live FP32 intermediates -> 2*Rv*I bytes of BF16 Act; physical
          Act capacity is 2*Rcap*I bytes, by: [fc1, activate]}
      matmul: [{item: Dense padding and FC2 geometry, change: '3*Rv*H*I -> (2*P1+P2)*H*I MACs; FC2 counts padded, omitted
            and repeated rows according to its independent Bm2', by: [fc1, fc2]}]
      vector:
      - item: Decode and activation
        change: Decode T*H hidden elements, including inactive tokens; decode 2*J*I*H FC1 and J*H*I FC2 weight elements
          inside worktiles; activation/QDQ evaluates Rv*I elements
        by: [decode, fc1, activate, fc2]
      - item: Routing auxiliaries
        change: Two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile entries and Rcap inverse-map
          entries; small preparation stages Rcap IDs once and prefixes up to 32 groups per expert
        by: [routing]
      error:
      - item: Numerics and geometry
        change: BF16 operand decoding is exact for finite stored products; library activation and refined normalization
          have no established composed full-domain error bound. Mismatched Bm1/Bm2 adds uncovered or multiply written
          Rout elements
        by: [decode, activate, fc2, finalize]
      traffic: [{item: FC2 route writes, change: '2*Rv*H -> 2*U2*H bytes of store payload, counting overlapping writes;
            omitted rows retain prior bytes rather than receiving a zero fill', by: [fc2]}]
  work_schedule:
    thesis: |-
      Select one small preparation kernel, or count/scan/scatter after a counts/fill memset, then decode -> FC1 -> FC2 -> finalize on the invocation stream. Both projections use four cooperating warps and a statically strided capped work sequence, keeping each full reduction local. No pre-gather or separate activation kernel is submitted.
      Small has only prepare; the other path has only count/scan/scatter. Conditional launch/handoff entries describe these alternatives. Decode starts after the actual preparation predecessor has completed (prepare or scatter); FC1 and FC2 are plain launches with full stream completion dependencies.
      source_pdl applies only to preparation and finalize, when pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It separates early admission from consumption: each PDL kernel waits for its actual predecessor grid before reading. With PDL off, ordinary stream order provides completion. The API enable_pdl argument does not choose this policy. A plain FC2 provides no early trigger, so finalize admission follows its completion.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [decode]}
      - {phase: [fc1], start_after: decode.kernel_done}
      - {phase: [fc2], start_after: fc1.kernel_done}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.kernel_done}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [finalize], storage: global, ready: scatter.kernel_done}
        Route: {producer: scatter, consumer: [fc1], storage: global, ready: scatter.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Xbf: {producer: decode, consumer: [fc1], storage: global, ready: decode.kernel_done}
        Act: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target: {single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}, tile_reduction: {dimension: slot,
              input: counts_group, output: counts, method: 'design.math_reshape::routing'}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target: {single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: Agg means scatter_agg()!=0. Aggregated scatter reserves once per block/expert and ranks with shared
            atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      decode:
        describe: Decode every token hidden row to BF16, independently of routing activity.
        decomposition:
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*G}}
          worktile: {invariant: {hidden_states: {shape: [{packed_hidden: 128*G/2}], dtype: uint8}, hidden_states_scale: {
                shape: [{hidden_block: 128}], dtype: fp8_e4m3fn}}}
          target: {single_tile: {Xbf: {shape: [{hidden: 128*G}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H/G,128)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc1:
        describe: 'One expert map tile and Bn1 intermediate channels: full paired hidden reduction, valid-row activation/QDQ,
          and BF16 Act stores.'
        decomposition:
          strategy: |-
            Bind Ns1=2 for a.cfg=6, otherwise 1; Bm1=128*Ns1; Bn1=256 for a.cfg=5, otherwise 128. Bind Ns2=2 for a.cfg2=6, otherwise 1; Bm2=128*Ns2 and Bn2=256. Both reductions use Bk=64. The one route map is built with Bm1; do not rebuild it for FC2.
            For either projection, Nx is its channel tile count. cap=grid_cap(), normally twice the runtime SM count, or zero on query failure. Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. Submit 128-thread CTAs. Runtime J bounds work, so surplus CTAs may have no assigned items. Each 128-row sub-block uses separate accumulator columns and shares its decoded weight stage with the other sub-block when Ns1=2.
          partition: {tile: {size: J, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm1}, {field: 1}], dtype: int32}
            iteration:
              Xbf: {shape: [{row: Bm1}, {hidden: Bk}], dtype: bf16, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Act: {shape: [{row: Bm1}, {intermediate: Bn1}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(I/Bn1)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: 'One expert map tile and Bn2 hidden channels: full intermediate reduction and BF16 Rout stores.'
        decomposition:
          strategy: 'Use the FC2-local Bm2/Bn2/Ns2 and Bk=64 bound in fc1, with Grid from fc1. Every CTA reads the same
            FC1-stride Tile map. Valid output intervals are those in math_reshape.fc2: Bm2<Bm1 may leave active rows
            unwritten; Bm2>Bm1 may produce overlapping, unordered stores. Neither host nor kernel performs a pairing
            correction. The two 128-row sub-blocks for Ns2=2 share one decoded weight stage.'
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Act: {shape: [{row: Bm2}, {intermediate: Bk}], dtype: bf16, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm2}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(),
            otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      Each projection has one four-warp cooperative loop, two BF16 A/B stage buffers, and one TMEM allocation partitioned among 128-row sub-blocks. While the current MMA runs, the same warps decode the next prefetched weight stage; each next iteration first waits for the preceding MMA before reusing its slots. Epilogues use the same warps after the final MMA wait.
      In FC1 use local (Bm,Bn,Ns,Nk,Nrow)=(Bm1,Bn1,Ns1,H/Bk,2*Bn1); in FC2 use (Bm2,Bn2,Ns2,I/Bk,Bn2). A/B slot indices restart at k=0 per worktile, after all real prior copies and MMA reads have completed. Completion parity is initialized once per CTA and continues across worktiles.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger
                  successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: Jointly scan counts and ceil(counts/Bm1) with warp scans and a scan of warp totals, using two
                  CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices
                  in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if Agg else 0}], dtype: int32,
            slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves
                  one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both
                  maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the
                  base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of;
                  only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      decode:
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                produce: After the actual preparation grid completes on the stream, each lane decodes one G-channel block
                  using the initialized global format tables. Read eight payload bytes and one scale, form eight BF16
                  pairs, and issue two vector stores. Mask blocks beyond H/G; all token rows, including unrouted rows,
                  are processed.
            pipe: {steady: ['produce:Xbf']}
      fc1:
        domain: {t: worktile, k: [0, Nk], sub: [0, Ns], c: [0, Bn/32]}
        resource:
          AStage: {space: SMEM, member_slot_shape: [{row: Bm}, {reduction: Bk}], dtype: bf16, slot_count: 2, view: {
              'A(t,k)': {slot_index: k%2}}}
          BStage: {space: SMEM, member_slot_shape: [{row: Nrow}, {reduction: Bk}], dtype: bf16, slot_count: 2, view: {
              'B(t,k)': {slot_index: k%2}}}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          DecodeTable: {space: SMEM, member_slot_shape: [{table: 2}, {entry: 256}], dtype: uint32, slot_count: 1}
          WeightRegisters: {space: register, member_slot_shape: [{task: Nrow*Bk/32}, {word: 5}], dtype: uint32, slot_count: 1}
          Tensor: {space: TMEM, member_slot_shape: [{row: 128}, {column: Ns*Nrow}], dtype: fp32, slot_count: 1, view: {
              'Acc(t,sub)': {part: {column: [sub*Nrow, (sub+1)*Nrow]}}}}
          Drain: {space: register, member_slot_shape: [{row: 128}, {channel: 64}], dtype: fp32, slot_count: 1}
          ActivationValues: {space: register, member_slot_shape: [{row: 128}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: &tc_enter The plain launch starts after its preceding grid completes. If J=0, return before allocation
                  and all remaining actions are absent or no-ops. Otherwise copy the two format tables into SMEM, initialize
                  one completion barrier and parity=0, allocate Tensor from warp 0, then rendezvous. Surplus CTAs with
                  empty assigned sequences still perform this setup and retirement.
                begin: Resolve expert and channel addresses, and retain prepared weight row/scale addresses for the full
                  reduction. Evaluate per-item parameters and their unused reciprocals. Rows gathers token IDs through
                  Route; padding repeats the first valid row. Rendezvous before staging.
                prime: &tc_prime Fetch stage-zero weight payload/scales and synchronously decode them into B slot 0.
                  Cooperatively issue 16-byte asynchronous copies of BF16 A into slot 0, then commit that copy group.
                  Each 32-value weight task loads 16 payload bytes and a four-byte scale word; two scale bytes are consumed.
                  The next-stage WeightRegisters holds this payload/scale prefetch until it is decoded.
                advance: &tc_advance |-
                  This collective action's done means its issue, waits and next-stage decode have finished, not that the current MMA has completed.
                  For k>0, warp 0's leader waits for the preceding MMA commit, flips parity and rendezvouses with the CTA. This frees the opposite A/B slots previously read by MMA(k-1).
                  If k+1<Nk, fetch that weight stage into registers and issue its A copies into the opposite slot. Commit a copy group even on the last iteration, where it is empty. Wait until all but the newest group have completed, then rendezvous: current A is ready and current B stores are published.
                  After the tensor-thread and shared-to-async visibility fences, an elected lane in warp 0 issues the current stage's four ascending 16-channel MMAs for each sub-block (up and gate for FC1), then one cumulative commit. The first update of each accumulator disables its old contents.
                  When k+1<Nk, the four warps decode the prefetched weights into the opposite B slot while current MMA is outstanding. No current MMA reads that opposite slot. Register values can be reused after this decode; the next iteration's rendezvous publishes B before its MMA.
                drain: &tc_drain Warp 0's leader waits for the final cumulative MMA commit and flips parity; tensor-thread
                  fencing and a CTA rendezvous precede the epilogue. All real A copies have been consumed and all operand
                  reads are retired. Only an empty committed copy group may remain; the source adds no further copy drain.
                  Parity is carried, not reset, at the next worktile.
                produce: Each warp owns 32 rows of the current sub-block. Read 32 up channels from TMEM and wait, then
                  read the paired 32 gate channels and wait, including padded rows. Only valid rows apply activate in
                  two consecutive G-channel blocks and issue BF16 Act vector stores. Drain and ActivationValues are reused
                  after their reads/store operands are consumed; grid completion publishes the global results.
                sub_end: &tc_sub_end Rendezvous between sub-blocks when another sub-block follows; there is no additional
                  barrier for the last sub-block.
                close: &tc_close Rendezvous after all sub-blocks and channel chunks finish their TMEM reads and vector-store
                  issues. Rows, the stage slots, Drain and Tensor may then be reused for the next worktile. This is not
                  a global-store completion wait.
                retire: &tc_retire After the assigned sequence, warp 0 deallocates Tensor; no-op on the J=0 early return.
                  Kernel completion supplies the stream handoff.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - begin:Work(t)
                - prime:Staging(t)
                - {repeat: k, steady: ['advance:Stage(t,k)']}
                - drain:Tensor(t)
                - {repeat: sub, steady: [{repeat: c, steady: ['produce:Act(t,sub,c)']}, 'sub_end:Sub(t,sub)']}
                - close:Work(t)
              epilogue: ['retire:Pipeline']
      fc2:
        domain: {t: worktile, k: [0, Nk], sub: [0, Ns], c: [0, Bn/32]}
        resource:
          AStage: {space: SMEM, member_slot_shape: [{row: Bm}, {reduction: Bk}], dtype: bf16, slot_count: 2, view: {
              'A(t,k)': {slot_index: k%2}}}
          BStage: {space: SMEM, member_slot_shape: [{row: Nrow}, {reduction: Bk}], dtype: bf16, slot_count: 2, view: {
              'B(t,k)': {slot_index: k%2}}}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          DecodeTable: {space: SMEM, member_slot_shape: [{table: 2}, {entry: 256}], dtype: uint32, slot_count: 1}
          WeightRegisters: {space: register, member_slot_shape: [{task: Nrow*Bk/32}, {word: 5}], dtype: uint32, slot_count: 1}
          Tensor: {space: TMEM, member_slot_shape: [{row: 128}, {column: Ns*Nrow}], dtype: fp32, slot_count: 1, view: {
              'Acc(t,sub)': {part: {column: [sub*Nrow, (sub+1)*Nrow]}}}}
          Drain: {space: register, member_slot_shape: [{row: 128}, {channel: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: *tc_enter
                begin: Resolve expert and channel addresses, retain prepared weight row/scale addresses, and evaluate
                  the unused activation parameters/reciprocals. Rows contains compact route indices with padding repeating
                  the first valid row. The row span is Bm2 while Tile's offsets advance by Bm1. Rendezvous before staging.
                prime: *tc_prime
                advance: *tc_advance
                drain: *tc_drain
                produce: Each warp owns 32 rows of the current sub-block. Read 32 channels from TMEM and wait, including
                  padding; only valid rows convert to BF16 and issue Rout vector stores. These stores retain math_reshape.fc2's
                  possible cross-CTA overlaps; no inter-CTA writer arbitration exists. Grid completion publishes the
                  actual stores, not coverage of omitted rows.
                sub_end: *tc_sub_end
                close: *tc_close
                retire: *tc_retire
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - begin:Work(t)
                - prime:Staging(t)
                - {repeat: k, steady: ['advance:Stage(t,k)']}
                - drain:Tensor(t)
                - {repeat: sub, steady: [{repeat: c, steady: ['produce:Rout(t,sub,c)']}, 'sub_end:Sub(t,sub)']}
                - close:Work(t)
              epilogue: ['retire:Pipeline']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including its route stores, then trigger admission.
                produce: Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route
                  loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full
                  valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output
                  stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.Main', 'design.tile_pipeline::fc2.Main']
    choice: Use BF16 K-major shared operands with matching 128-byte swizzle and BF16/F32 descriptors for tcgen05.mma.kind::f16.
      Bind stage completion to tcgen05.commit plus parity waits, shared visibility to the source fences/rendezvous, and
      epilogue reads to tcgen05.ld with wait::ld. A staging uses cp.async commit/wait_group 1; weight staging decodes
      register-fetched prepared payload/scales.
    reason: MMA input readiness, opposite-slot reuse and TMEM visibility use different completion mechanisms; BF16 descriptors
      must agree with the decoded operand layout.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl only to prepare/count/scan/scatter/finalize using programmatic serialization and griddepcontrol wait/launch_dependents. Hidden decode and both BF16 GEMMs remain plain stream launches. Model.forward initializes format lookup tables through ensure_tables/moe_init and synchronizes the device before marking them ready.
      Retain scratch and ABI ownership on host-cache hits while updating the invocation stream. Native moe_run executes eagerly for the first matching signature, attempts capture on the second and replays a matching graph thereafter; source capture failures select eager execution. The return only enqueues work. There is no added lock or cross-stream completion protocol for scratch or the process-global graph cache.
      Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. GEMM shared-memory attribute or launch errors propagate, without a BF16 fallback. No tensor maps are constructed by this path.
    reason: Initialization, cached storage lifetime, stream completion and submission failure behavior are required to
      interpret the pipeline across invocations.
