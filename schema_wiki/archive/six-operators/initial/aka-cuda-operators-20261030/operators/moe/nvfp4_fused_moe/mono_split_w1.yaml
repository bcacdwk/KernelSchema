"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "mono_split_w1"
    "parent": "mono_fused_w1"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates,
      or the cached ABI reused by its host fast path; use the launch choices baked
      into a replayed graph. Select exactly when a.zflag=0, the actual FC1 is
      f4_body with GEMM1=true, SK>1 and FUSE=false, and the actual FC2 is
      f4_body_w1 with GEMM1=false. In this source FC1 uses cfg in
      {20,21,28,29,37,42,43,54,55,76,77}; FC2 is cfg36 with successful operand maps.
      FC1 map refusal returns an error without a split-K replacement; FC2's
      map-refusal fallback runs f4_body and belongs outside this node.
      Attribute or launch rejection does not acquire a replacement kernel.
      This condition applies independently over the shared Contract. In-place
      tensor changes do not rebuild cached configuration or probe eligibility.
      Let S be a.small_thresh when positive, otherwise native small_threshold();
      for graph replay use the preparation choice baked into the graph. Rcap=T*K.
design:
  math_reshape:
    thesis: |-
      Compact routes by expert and retain packed FP4 operands through both projections. Split the paired FC1 reduction into independent contiguous K slices, materialize FP32 partials, then reduce them in fixed slice order and quantize the activation. This shortens each projection chain and exposes more work at the cost of partial traffic and an extra kernel; padded GEMM arithmetic remains.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation and gather policies are bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per paired FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok is consumed by route-major gather and direct
            FC1 operand reads
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        SK: {meaning: Number of contiguous FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Replicate stored activation bytes into compact route order
      math: |
        When PG is selected as defined in work_schedule, for (t,k) in V and r=route_of[t,k], Xq[r,:]=hidden_states[t,:]
        and Xs[r,:]=hidden_states_scale[t,:], with no conversion.
        Flat and token-major gather load each active token's bytes once for all its routes;
        route-major gather loads them once per active route. PG is equivalent to AMODE=2
        on this path; AMODE=0, 1 or 3 reads original tensors through Route and has no gather.
        With PG=false these buffers and the gather operation are absent.
        Let Tv=count({t | exists k: (t,k) in V}). Rows [Rv,Rcap) are not initialized or cleared.
        Decode weights exactly as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
      symbol:
        Xq: {meaning: Gathered activation payload, shape: [{route: Rcap}, {packed_hidden: H/2}], dtype: uint8, retention: keep_value
            invocation}
        Xs: {meaning: Gathered activation scales, shape: [{route: Rcap}, {hidden_block: H/G}], dtype: fp8_e4m3fn, retention: keep_value
            invocation}
    - step: fc1
      name: Paired projection over independent contiguous reduction slices
      math: |
        For j<J, l=0..SK-1 and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), n=n1*Bn1 and D=H/SK. Evaluate all Bm rows.
        With AMODE=2, payload row m is Xq[b+m]; scales use Xs[b+m] for m<v,
        Xs[b] otherwise. Payload can cross into another expert or unwritten capacity;
        outside the Rcap-row matrix it is zero-filled.
        With AMODE=0 or 1, both operands use token Route[b+(m if m<v else 0),0].
        With AMODE=3, only 4*ceil_div(v,4) payload rows are fetched, using that
        same token mapping, and only v scale rows are fetched. Other payload/scale
        entries retain unspecified prior values. These padded rows are evaluated and discarded.
        Let Xtile decode those operands, and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. For each slice l, D1(-1)=0;
        D1(s)=mma32(Xtile[:,l*D+64*s:l*D+64*(s+1)],
                   Wpair[:,l*D+64*s:l*D+64*(s+1)]^T,D1(s-1)), s=0..D/64-1.
        For m<v, Part[l,b+m,n:n+Bn1]=D1(D/64-1)[m,:Bn1] and
        Part[l,b+m,I+n:I+n+Bn1]=D1(D/64-1)[m,Bn1:]. No clamp or cast occurs.
        Part[:,Rv:Rcap,:] is not initialized or overwritten.
        Each slice workitem also reads alpha, beta and the optional clamp limit,
        evaluates ia=rcp_rn(alpha), ib=rcp_rn(beta), and forms unused folded constants:
        with L2E=fp32(-1.44269504), (L2E,ia*(2*L2E),ib*(2*L2E)) for SiTU,
        or three copies of alpha*L2E for SwiGLU. They do not affect Part.
      symbol:
        D1: {meaning: One paired up and gate slice accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,l,n1); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw slice partials consumed by separate reduction and activation, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32, retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 denotes native block-scaled E2M1 products with E4M3 scale per G channels and FP32 accumulation. Four ascending 64-channel updates form each 256-channel stage; each slice's first update disables the previous accumulator. Splitting and then summing FP32 partials changes reduction grouping. Neither native internal rounding nor slice grouping promises bitwise agreement with a decoded FP32 reference.
    - step: activate
      name: Fixed slice reduction followed by non-folded activation and packed quantization
      math: |
        Examine every compact-capacity row r<Rcap. Let C={r | 0<=Route[r,2]<E}
        after preparation, Ra=count(C), and e=Route[r,2] for r in C.
        C includes [0,Rv); inclusion of spare rows depends on their unspecified prior pexp bytes.
        For every r in C and i<I, U(-1)=Vg(-1)=0;
        U(l)=fp32(U(l-1)+Part[l,r,i]); Vg(l)=fp32(Vg(l-1)+Part[l,r,I+i]), l=0..SK-1.
        up=U(SK-1), gate=Vg(SK-1). Apply Contract's asymmetric clamp if enabled.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        L2E=fp32(-1.44269504), F(x)=rcp_approx(1+ex2_approx_ftz(x*L2E)),
        and TH(x)=fma32(F(fp32(x+x)),2,-1).
        For activation_type=3, Ap=(gate*F(gate*a))*(up+bpar).
        For activation_type=10, tg=a*TH(gate*ia), tu=bpar*TH(up*ib),
        and Ap=(tg*F(gate))*tu. Each shown FP32 operation retains its order;
        exponent prescales are not folded. Both reciprocals are evaluated even for SwiGLU.
        For each G-channel block, quarter u=0..3 first forms
        M0(u)=fmax(fmax(abs(Ap[4*u]),abs(Ap[4*u+1])),fmax(abs(Ap[4*u+2]),abs(Ap[4*u+3]))).
        M1(u)=fmax(M0(u),M0(u xor 1)); M2(u)=fmax(M1(u),M1(u xor 2)); amax=M2(u).
        Each max here is fmax: a numeric operand wins over a NaN operand.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)). With BRLESS=true,
        inv=rcp_rn(max(fp32(s8),fp32(1.17549435e-38))) and q[i]=Q4(Ap[i]*inv).
        Otherwise initialize q[i]=0 and only when fp32(s8)>0 evaluate
        inv=rcp_rn(fp32(s8)) and q[i]=Q4(Ap[i]*inv).
        Q4 uses Contract's RNE saturating E2M1 rule and low-even-nibble packing.
        Store Aq[r,:] and As[r,:] for every r in C; other capacity rows remain unchanged.
        With ACTV2 enabled all Rcap rows' Part values are loaded before the expert check;
        otherwise only C rows load Part. Spare rows can therefore read uninitialized partials
        and write unspecified Aq/As even when J=0. They are never valid FC2 output rows;
        FC2 padding may fetch their payload, and only its discarded rows use it.
      symbol:
        U: {meaning: Fixed-order up-partial reduction state, shape: [], dtype: fp32, retention: 'carry_forward (r,i); l=-1..SK-1'}
        Vg: {meaning: Fixed-order gate-partial reduction state, shape: [], dtype: fp32, retention: 'carry_forward (r,i); l=-1..SK-1'}
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8, retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn, retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32. TH uses the sigmoid identity, and normalization multiplies by a rounded reciprocal. unknown: no verified composed error bound over this path's full domain is supplied; implementation comments and external acceptance records do not establish one.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. Aq uses row b+m,
        with the capacity and zero-fill behavior defined for AMODE=2 in fc1.
        Let QTile decode these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item alpha/beta reciprocals and reads the optional clamp limit, but uses
        none of them; it does not form FC1's folded activation constants.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        After completing fc2, including J=0, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection or gather payload work and still overwrites Y with zeros;
        the capacity-wide activate pass retains the scratch behavior defined above.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: '16*Rv*I baseline bytes -> 8*SK*Rv*I valid FP32 partial bytes plus 9*Ra*I/16 quantized bytes; physical Part and act capacities are 8*SK*Rcap*I and 2*Rcap*I bytes', by: [fc1, activate]}
      - {item: Route gather, change: 'With PG, 0 -> 9*Rv*H/16 written bytes and 9*Rcap*H/16 capacity; PG=false omits this materialization', by: [gather]}
      traffic:
      - {item: Split partial transfer, change: 'FC1-to-activation boundary: 16*Rv*I baseline bytes -> 8*SK*Rv*I written bytes plus 8*SK*Rcap*I read bytes with ACTV2, or 8*SK*Ra*I without it', by: [fc1, activate]}
      - item: Gather copy
        change: |-
          With PG, flat/token-major add 9*(Tv+Rv)*H/16 logical bytes and route-major adds 18*Rv*H/16. Direct modes fetch operands in each FC1 slice tile; clipped mode limits payload rows to 4*ceil_div(v,4) and scale rows to v
        by: [gather, fc1]
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> Ra*I elements plus 2*SK*Ra*I FP32 additions from zero for slice reduction; every Rcap row is examined', by: [activate]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      depth:
      - {item: FC1 accumulation, change: 'H/64 serial MMA updates -> H/(64*SK) per slice followed by SK ordered FP32 additions per up/gate element', by: [fc1, activate]}
      error:
      - item: Approximate activation and normalization
        change: 'Ra*I approximate activation/normalization evaluations and a different FC1 reduction grouping; no established full-domain output error bound'
        by: [fc1, activate]
  work_schedule:
    thesis: |-
      Prepare compact routes, optionally gather, submit monolithic split-K FC1, then a separate fixed-order reduction/activation/QDQ kernel, single-warp-mainloop FC2 and finalize. FC1 exposes SK times as many worktiles with H/SK reduction length; global Part traffic and the activate launch replace the parent's fused epilogue.
      Let Small mean Rcap<=S with S defined in when. Only prepare is submitted for Small; count/scan/scatter are submitted otherwise. PG means cfg in {28,29,37,42,43,54,55}, exactly AMODE=2 on this path. Gather exists only for PG. The launch and handoff entries enumerate these alternatives; absent phases do not create events or waits.
      The stream chain is prepare -> optional gather -> fc1 -> activate -> fc2 -> finalize, or memset -> count -> scan -> scatter -> optional gather -> fc1 -> activate -> fc2 -> finalize. Every successor waits for its actual predecessor grid before consuming data. Routing handoffs from count/scan/scatter apply to the large chain; Prepared carries the same arrays in the small chain. Xq/Xs handoffs apply only with PG.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise the stream serializes kernels; grid dependency controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [gather], protocol: source_pdl}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [activate], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [fc2], protocol: source_pdl, start_after: activate.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, gather, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [gather, finalize], storage: global, ready: scatter.kernel_done}
        Xq: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Xs: {producer: gather, consumer: [fc1], storage: global, ready: gather.kernel_done}
        Part: {producer: fc1, consumer: [activate], storage: global, ready: fc1.kernel_done}
        Aq: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        As: {producer: activate, consumer: [fc2], storage: global, ready: activate.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [gather, fc1, activate, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [gather, fc1, activate], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      gather:
        describe: 'Only for PG: copy stored bytes into route order using the effective flat, token-major
          or route-major policy.'
        decomposition:
          strategy: |-
            Flat takes precedence over token-major. Let C=9*H/256, Gg=max(1,min(ceil_div(T*C,128),gatherf_cap())) and Ncopy=ceil_div(T*C,128) for flat: unit u covers flattened token/chunk coordinates [128*u,128*(u+1)). Each chunk makes up to K copies.
            For token-major, Gg=max(1,min(T,gather_grid_cap())), Ncopy=Gg*floor(T/(2*Gg))+min(Gg,T%(2*Gg)); unit u uses tokens (u%Gg)+2*floor(u/Gg)*Gg and that token+Gg, masking the second past T. For route-major, Gg=min(ceil_div(Rcap,4),1184), Ncopy=ceil_div(Rv,4); unit u covers routes [4*u,min(4*u+4,Rv)).
            Flat and route-major use 128 threads. Token-major uses Nt=gather_threads(), default 64, clamped to [32,1024] and rounded down to a warp multiple. The effective flat cap defaults to 1184, token cap to 2368; both clamp to [1,65536]. InputBytes is respectively 128*16, 2*9*H/16 or 4*9*H/16; CopyBytes is respectively K*InputBytes, K*InputBytes or InputBytes. CopyMaps denotes the corresponding route_of entries, or four ptok entries for route-major.
          partition: {unit: {size: Ncopy, tile: 1}}
          worktile: {invariant: {Input_bytes: {shape: [{byte: InputBytes}], dtype: uint8}, CopyMaps: {shape: [{word: 128*K
                      if flat else 2*K if token_major else 4}], dtype: int32}}}
          target: {single_tile: {Gathered: {shape: [{byte: CopyBytes}], dtype: uint8}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Gg}
        schedule: {worktile_order: [{by: unit, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              step: worker_count}, refill: none, exit: assigned_done}}
      fc1:
        describe: |-
          One expert tile, one contiguous K slice and Bn1 paired up/gate channels; write raw FP32 partials. Xq/Xs denote original-token slices through Route when PG=false.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64 and Bk=256. All actual f4_body instances have GEMM1=true, TMA=true, STAGES=SFS=2, FUSE=SFCP=REDF=false. Their (SK,AMODE,SFPRE,BRLESS,PIPE) are cfg20=(4,0,1,false,false), cfg21=(2,0,1,false,false), cfg28=(2,2,1,false,false), cfg29=(4,2,1,false,false), cfg37=(8,2,1,false,false), cfg42=(2,2,1,true,false), cfg43=(4,2,1,true,false), cfg54=(2,2,2,true,true), cfg55=(4,2,2,true,true), cfg76=(4,3,1,true,false), cfg77=(4,1,1,true,false). BRLESS only affects the later activate kernel on this path. Host validation requires (H/256)%SK=0; cfg37 therefore excludes H=7168.
            Each worktile traverses Nk=H/(Bk*SK) stages at absolute stage offset l*Nk. Adjacent channel tiles share an A slice as a cache reuse opportunity. FC1 map refusals have no cp.async-only fallback.
            For grid width Nx, cap=grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 uses Nx=SK*I/Bn1; FC2 uses Nx=H/Bn2. Both CTAs have 128 threads and stride their flattened work IDs. Runtime J bounds work, leaving surplus CTAs with empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              Xq: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              Xs: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          strategy: Order is expert tile, slice, then channel fastest; only valid route rows are stored.
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      activate:
        describe: Reduce all slices and quantize 64 consecutive route/block coordinates per CTA.
        decomposition:
          strategy: |-
            Flatten (r,block) with block fastest and block=0..I/G-1. Each 256-thread CTA handles 64 G-channel blocks; four adjacent lanes share one block, each lane owning four channels. This scans Rcap, not Rv. Experts denotes the corresponding pexp entries, repeated when blocks share a row; Parameters denotes their alpha/beta/optional-limit values. Guard pexp before parameter indexing, but ACTV2 loads all slice partials before that guard. ACTV2 means act_v2()!=0, default enabled; it specializes SKT=SK in {2,4,8}; disabled uses runtime SKT=0. BRLESS is true for cfg in {42,43,54,55,76,77}, false otherwise.
          partition: {block: {size: Rcap*I/G, tile: 64}}
          worktile:
            invariant:
              Experts: {shape: [{block: 64}], dtype: int32}
              Parameters: {shape: [{block: 64}, {value: 3}], dtype: fp32}
            iteration:
              Part: {shape: [{block: 64}, {channel: 2*G}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Aq: {shape: [{block: 64}, {packed_intermediate: G/2}], dtype: uint8}
              As: {shape: [{block: 64}], dtype: fp8_e4m3fn}
            tile_reduction: {dimension: slice, input: Part, output: [Aq, As], method: 'design.math_reshape::activate'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap*I/G,64)'}
        schedule:
          worktile_order: [{by: block, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm=128, Bn2=128, Bk=256 and Grid from fc1. The only FC2 instantiation is f4_body_w1<128,false,3,3,1>: three payload slots, three scale slots and no reduction split. Both TMA boxes have 128 rows, matching the expected (Bm+Bn2)*(Bk/2)=32768 payload bytes per stage.
            Each CTA has 128 threads. Warp 0 stages payload and both scale operands and issues the full MMA reduction; all four warps then drain 32-channel chunks and issue valid-row BF16 vector stores. One accumulator serves successive worktiles; there is no bulk-store sink or fused route reduction.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1 uses four warps cooperatively for staging and FP32 partial drain, with one elected warp-0 lane issuing paired MMA. Non-PIPE retires the previous stage before refilling and issuing the current stage; PIPE issues the current stage before waiting for the previous commit, permitting two bursts in flight. Both drain the final commit before storing Part and reusing the single accumulator. The independent activate CTA then merges slices in registers and shares block maxima within four-lane groups.
      For FC1, Nrow=2*Bn1, Nk=H/(Bk*SK), TCOLS=Nrow+48*SFS and TALLOC=256. Ring positions use continuous stage index g across assigned worktiles, while operand addresses add the current slice's absolute offset l*Nk. Completion parity also continues. ScaleRegisters has NRB=2 for SFPRE=2, otherwise 1. Gather instantiates only warp[0:Nt/32].
      FC2 uses warp 0 for its mainloop and all four warps for TMEM drain. Its three payload and scale slots use a continuous stage index across worktiles. The single 256-column TMEM allocation holds Bn2 accumulator columns plus 96 scale columns. One register set carries both scale operands ahead of use. FC2 stage waits are warp-local; CTA rendezvous surround the mainloop and finish each worktile's drain.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      gather:
        domain: {t: worktile}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: |-
                  Nt=128 for flat/route-major, otherwise the bound gather_threads value. Wait for actual preceding preparation and trigger admission. Flat/token-major return if Rv=0; route-major has an empty row loop.
                produce: |-
                  Flat assigns each lane one 16-byte input chunk and copies its vector to all active destinations. Token-major holds two route lists, loads the second token vector before the first, then interleaves their stores; payload precedes scales. Skip input loads for tokens without active routes. Route-major visits four valid rows in order, loading ptok and copying payload then scales in block-strided 16-byte vectors. Mask tails, leave spare capacity untouched, and reuse register vectors after store issue.
            pipe: {prologue: ['enter:Input'], steady: [{repeat: t, steady: ['produce:Gathered(t)']}]}
      fc1:
        domain: {t: worktile, k: [0, Nk], g: {flatten: [t, k]}, c: [0, Bn1/32]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale: {space: SMEM, member_slot_shape: [{image: 3}, {row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: SFS, view: {Scale(g): {slot_index: g%SFS}}}
          ScaleRegisters: {space: register, member_slot_shape: [{row: Bm+Nrow}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: NRB, view: {ScaleRegisters(g): {slot_index: k%NRB}}}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Nrow]}}
              TScale(g): {part: {column: ['Nrow+48*(g%SFS)', 'Nrow+48*(g%SFS+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: 64}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the actual predecessor grid and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor from warp 0 and rendezvous. Surplus CTAs with no assigned work still initialize and retire. Stage/completion counters initialize once per CTA.
                begin: |-
                  Resolve expert, slice and channel bases. Read the unused activation parameters and folded constants specified in fc1. Fill all Rows entries with compact indices for AMODE=2 or ptok indices otherwise, repeating the first valid row for padding, then rendezvous. Retain weight offsets and scale-row addresses through this slice worktile.
                prime: |-
                  Prepare only stages inside the current slice, adding l*Nk to all operand offsets. Fetch and land scale stage 0. SFPRE=1 then uses one register set; SFPRE=2 uses two alternating sets. Only Bn1 rows in each 128-row B-scale image are written and used; all three full images will be copied to TMEM. AMODE=3 fetches/lands A scales only for valid rows, leaving other shared bytes unchanged.
                  Issue payload stage 0 and commit one cp.async group, empty unless AMODE=0. Each stage uses two Bn1-row B boxes. AMODE=0 gathers all Bm A rows by cp.async and expects Nrow*(Bk/2) TMA bytes; AMODE=2 uses one Bm-row A box; AMODE=1 uses 32 gather4 A boxes; AMODE=3 uses ceil_div(v,4) gather4 boxes. The latter three expect (Nrow+Arows)*(Bk/2) bytes, with Arows=Bm except Arows=4*ceil_div(v,4) for AMODE=3. Then fetch scale stage 1 if present, and also stage 2 for SFPRE=2. Done covers register/shared staging and payload issue, not payload arrival.
                advance: |-
                  Non-PIPE: at k>0 wait for the preceding cumulative MMA commit, toggle parity and rendezvous before reuse. If k+1<Nk, land its held scales and issue its payload. Commit a cp.async group even at the tail, wait until at most one group remains, wait for current TMA transaction completion and rendezvous. One elected warp-0 lane fences, copies all three scale images to TScale(g), issues four ascending 64-channel up/gate MMA pairs and commits completion. The first pair in each slice initializes Acc. Ordered scale-copy/MMA reads protect TMEM scales. Fetch scale k+2 for SFPRE=1, or k+3 for SFPRE=2, guarded by Nk.
                  PIPE: wait for current TMA bytes and rendezvous, issue that same scale-copy/MMA burst with a ping-pong commit, then at k>0 wait for the preceding commit and rendezvous before landing scales and issuing payload for k+1. Fetch scales for k+3 afterward. All refills are slice-bounded. PIPE uses AMODE=2 and SFPRE=2, with no per-stage cp.async groups. Done covers issue and tail work; the current MMA can remain in flight.
                drain: |-
                  Wait for the final cumulative MMA commit; non-PIPE toggles carried parity, PIPE carries its commit count. Advance the continuous TMA stage counter by Nk. All warps tensor-fence and rendezvous before TMEM reads. All nonempty transfers have been consumed. No cp.async wait-all is added: non-PIPE leaves trailing empty groups, while PIPE's empty prime group has no explicit wait.
                produce: |-
                  Each warp owns 32 route rows. Issue both 32-channel up/gate reads into Drain before one TMEM read wait. Valid rows issue eight float4 stores for each half to Part[l,r,:]; padded rows are read and discarded. Drain is reused after those vector store issues. No clamp, quantization, arrival ticket or last-arriver reduction occurs. Done covers read completion and store issue.
                close: |-
                  Rendezvous after all warps finish their TMEM reads and partial store issues. Rows, Drain and the single Acc can serve the next assigned worktile; stage and completion state continue. There is no independent epilogue overlap or separate global-store completion event. Grid completion publishes Part to activate.
                retire: Warp 0 deallocates Tensor after its assigned sequence, including an empty sequence after setup. No-op for J=0.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: 'g[t]', steady: ['advance:Stage(g)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:Part(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      activate:
        resource:
          SliceLoads: {space: register, member_slot_shape: [{block: 64}, {channel: 2*G}], dtype: fp32, slot_count: 'SK if ACTV2 else 1'}
          Values: {space: register, member_slot_shape: [{block: 64}, {channel: 2*G}], dtype: fp32, slot_count: 1}
          BlockMax: {space: register, member_slot_shape: [{block: 64}, {quarter: 4}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the FC1 grid and its partial stores, then let the first warp trigger successor admission. Mask coordinates beyond Rcap*I/G, without testing Rv.
                reduce: |-
                  Four adjacent lanes own one G-channel block, each loading four up and four gate values per slice. Initialize Values to zero. With ACTV2, load all SK slices into SliceLoads before reading/range-checking pexp; rejected groups return after those reads. Otherwise check pexp first, then load and accumulate one slice at a time, reusing SliceLoads after its additions. Add in ascending slice order to Values, then read parameters and evaluate both reciprocals. All four lanes of a block share the row/expert check. No CTA barrier or arrival counter exists.
                produce: |-
                  Apply activate's clamp and non-folded paired arithmetic. Reduce each lane's four absolute values, then combine BlockMax by XOR distances 1 and 2 within each four-lane group. Each lane computes the common rounded scale, normalizes and packs its four values. Shuffle the neighboring halfword; even quarters issue a combined 4-byte payload store and quarter zero issues the scale byte. These warp exchanges retain live peers within each accepted group despite other groups returning. Store issues finish this worktile; grid completion publishes Aq/As. Spare-row reads and stores follow activate's explicit capacity semantics; no tail clear or extra wait is supplied.
            pipe: {prologue: ['enter:Input'], steady: ['reduce:Values', 'produce:Aq']}
      fc2:
        domain: {t: worktile, k: [0, I/Bk], g: {flatten: [t, k]}, c: [0, Bn2/32]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}], dtype: uint8, slot_count: 3,
            view: {Payload(g): {slot_index: g%3}}}
          Scale: {space: SMEM, member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 3, view: {Scale(g): {slot_index: g%3}}}
          ScaleRegisters: {space: register, member_slot_shape: [{row: Bm+Bn2}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(g): {part: {column: ['Bn2+32*(g%3)', 'Bn2+32*(g%3+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the activate grid and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor from warp 0 and rendezvous. Surplus CTAs with no assigned work still allocate and retire. Warp 0 initializes stage and MMA completion counters once per CTA.
                begin: |-
                  Resolve expert, channel and route bases. All four warps fill Rows, repeating the first valid route for padding, then rendezvous. Read alpha/beta and optional clamp and evaluate the unused reciprocals specified in fc2. Warp 0 keeps the prepared weight-scale addresses through the worktile.
                prime: |-
                  Only warp 0 executes prime and advance; the other warps proceed to the drain rendezvous. Fetch scale stages 0 and 1 when present into the single ScaleRegisters set, landing each into its continuous Scale slot before overwriting the registers. Fence each shared scale image to the async proxy. Lane 0 issues the corresponding leading payload stages, each with one 128-row A box and one 128-row B box and a 32768-byte transaction count. Fetch stage 2 into ScaleRegisters when present. Done covers scale staging and payload issue, not payload arrival.
                advance: |-
                  At k>0, lane 0 waits for the preceding MMA commit and the warp rendezvouses before any shared-slot refill. That cumulative completion protects both payload and scale reuse. Land the held scales for k+2 and issue payload k+2 when it exists. Lane 0 waits for the current payload transaction phase, then the warp rendezvouses, making current payload and scales readable.
                  One elected lane fences, copies current scale images to TScale(g), issues four ascending 64-channel MMAs and commits completion. The first update of the worktile initializes Acc. Ordered scale-copy/MMA reads protect each TMEM scale operand. After a warp rendezvous, fetch scale stage k+3 when present into ScaleRegisters, whose prior values have landed. Every fetch/refill stays inside this worktile. Done covers these issues and the tail fetch; the current MMA can remain in flight. No per-stage CTA rendezvous or cp.async group exists.
                drain: |-
                  Warp 0 advances its continuous stage counter and waits for the final cumulative MMA commit, toggling the carried completion parity. All four warps execute the tensor fence and a CTA rendezvous before TMEM reads. Every issued payload and scale stage has been consumed; no extra tail transaction is issued or drained.
                produce: |-
                  Each warp owns 32 route rows. Load the current 32-channel chunk into Drain and wait for the TMEM read. Only valid rows convert to BF16 and issue four 16-byte vector Rout stores; padded rows are read and discarded. Done covers conversion and store issue; grid completion publishes Rout to finalize.
                close: |-
                  Rendezvous after all four warps finish their TMEM reads and vector store issues. Rows, Drain and the single Acc may then serve the next worktile. This is not a separate global-store completion event; payload/scale slot positions and transaction/MMA parity continue without reset.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. Kernel completion supplies the route-store visibility required by finalize.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: 'g[t]', steady: ['advance:Stage(g)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:Rout(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including its route stores, then trigger admission.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.Main', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect shared rings and the single accumulator in each projection.
  - item: design.tile_pipeline::fc1.Main
    choice: |-
      Preserve the prepared weight-row permutation and matching f4_sf_off scale images. Use 128-byte-swizzled UINT8 TMA boxes for B, gathered-row A maps for AMODE=2 and gather4 maps for AMODE=1 or 3. AMODE=0 uses 16-byte cp.async A copies. Register-to-shared scale stores require async-proxy fences. Keep cp.async group completion separate from transaction-counted TMA readiness and cumulative MMA completion; the clipped gather4 transaction count follows the actual issued boxes.
    reason: Payload/scale rows must agree, and clipped or full-row copies need their actual readiness and reuse protocol.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Encode UINT8 128-row A/B TMA boxes with the prepared weight-row permutation and 128-byte payload swizzle. Use transaction-counted mbarrier completion for the 32768 payload bytes; direct register loads and shared scale stores use the matching f4_sf_off image, async-proxy fences and warp rendezvous.
    reason: Payload and scale rows must agree, while TMA readiness and the separate cumulative MMA completion protect different parts of staging and reuse.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1 split-K map refusal returns 731 without a replacement launch; FC2 requires cfg36 operand maps and uses no drain map. Host scratch caches retain Part and the disjoint Aq/As views in act across calls, including unwritten capacity bytes; no initialization of spare pexp/Part rows is implied. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. Attribute/launch errors propagate to Model.forward. Scratch and process-global graph/map caches have no added lock or cross-stream completion protocol; this extraction supplies none.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
