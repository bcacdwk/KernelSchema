"meta_data":
  "name": "nvfp4_fused_moe"
  "describe": "Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise\
    \ activation quantization, and a weighted expert reduction."
  "source": "source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward"
  "version": 1
  "dispatch":
    "id": "ws_arrival_w1"
    "parent": "ws_split_w1"
    "when": |
      Let a be the effective ABI after Model.forward validation and content gates, or
      the cached ABI reused by its host fast path; use the launch choices baked into
      a replayed graph. Select exactly when a.zflag=0, the actual FC1 is f4_body_ws
      with GEMM1=true and FUSE=true (cfg88), and the actual FC2 is f4_body_w1 with
      GEMM1=false (cfg36 with successfully encoded operand maps). Its map-refusal
      fallback runs f4_body and is outside this node. Attribute or launch rejection
      does not acquire a replacement kernel. Parent is only the copying origin;
      this condition applies independently over the shared Contract. In-place tensor
      changes do not rebuild cached configuration or probe eligibility.
      Let S be a.small_thresh when positive, otherwise native small_threshold(); for
      graph replay use the preparation choice baked into the graph. Rcap=T*K.
design:
  math_reshape:
    thesis: |-
      Compact routes by expert and split the paired FC1 projection into two contiguous hidden slices. Retain FP32 partials, sum them in fixed slice order when the group is complete, then apply folded approximate activation and guarded packed quantization; this removes the separate activation pass but retains partial traffic and changes rounding.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation policy is bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per paired FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        SK: {meaning: Independent contiguous FC1 reduction slices, binding: 'bind:design.work_schedule::SK'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill: {meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation, shape: [
            {expert: E}], dtype: int32, retention: keep_value invocation}
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; FC1 uses ptok for direct operand gathering
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared: {meaning: Logical union of the small preparation outputs in their existing arrays, shape: [{word: 3*E+2+4*Rcap+2*Jcap}],
          dtype: int32, retention: keep_value invocation}
    - step: gather
      name: Read stored activations through compact route identities
      math: |
        FC1 reads hidden_states and hidden_states_scale through Route without pre-gather
        allocation or a copy pass. Decode weights as in Contract's Decode the stored
        operands; W1 and W2 denote these values without materializing decoded tensors.
    - step: fc1
      name: Split paired projection and materialize raw partials
      math: |
        For j<J, slice l=0..SK-1 and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), n=n1*Bn1 and C=H/SK. Evaluate all Bm rows.
        Direct clipped gather4 uses hidden token Route[b+m,0] for m<v. It fetches
        4*ceil_div(v,4) payload rows, repeating token Route[b,0] for the last partial
        group; other padded payload and all padded scale values retain unspecified
        prior local bytes. These extra rows are still evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. D1(-1)=0;
        D1(s)=mma32(Xtile[:,l*C+64*s:l*C+64*(s+1)],
                   Wpair[:,l*C+64*s:l*C+64*(s+1)]^T,D1(s-1)), s=0..C/64-1.
        For m<v, Part[l,b+m,n:n+Bn1]=D1(C/64-1)[m,:Bn1] and
        Part[l,b+m,I+n:I+n+Bn1]=D1(C/64-1)[m,Bn1:].
        Part[:,Rv:Rcap,:] remains unwritten and is not initialized on allocation.
        Each FC1 workitem also evaluates per-expert reciprocals and folded constants:
        alpha=gemm1_alpha[e], beta=gemm1_beta[e], ia=rcp_rn(alpha), ib=rcp_rn(beta),
        L2E=fp32(-1.44269504);
        for type 3, alpha*L2E; for type 10, ia*(2*L2E), ib*(2*L2E).
        It reads the optional clamp limit. The partial stores use none of these values;
        the completing slice retains them for activation, while other slices discard them.
      symbol:
        D1: {meaning: Paired slice accumulator, shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32,
          retention: 'carry_forward (j,l,n1); s=-1..H/(64*SK)-1'}
        Part: {meaning: Raw up and gate partials consumed once by the completing slice of each tile/channel group, shape: [{slice: SK}, {route: Rcap}, {channel: 2*I}], dtype: fp32,
          retention: keep_value invocation}
      arithmetic:
        accumulate: |-
          mma32 denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator. Four ascending 64-channel updates form each 256-channel stage; the first update of each slice disables the previous accumulator. Native internal rounding and the separate slice sum do not promise bitwise equality with an unsplit or decoded-FP32 GEMM.
    - step: reduce
      name: Complete each tile group and sum its slices
      math: |
        For each (j,n1), all SK partial slices cover the same v valid rows and Bn1
        paired channels. Once they are available, for each such row r and channel i,
        U(-1)=0; U(l)=fp32(U(l-1)+Part[l,r,{i,I+i}]), l=0..SK-1.
        Set up=U(SK-1)[0] and gate=U(SK-1)[1], with expert e=Tile[j,0].
        Reduction reads only r<Rv. Part remains allocated and retains its bytes after
        use; each valid region is overwritten by the next invocation before consumption.
      symbol:
        U: {meaning: Running paired sum for one tile-group row and channel, shape: [{pair: 2}], dtype: fp32,
          retention: 'carry_forward (j,n1,r,i); l=-1..SK-1'}
    - step: activate
      name: Folded activation and guarded block quantization
      math: |
        For each reduced valid row/channel, apply Contract's asymmetric clamp to up
        and gate. Use the completing slice's alpha, beta, ia, ib and L2E from fc1.
        Define F(x,k)=rcp_approx(1+ex2_approx_ftz(x*k)).
        For activation_type=3, ksw=alpha*L2E and Ap=(gate*F(gate,ksw))*(up+beta).
        For activation_type=10, ksw=L2E, kgu=ia*(2*L2E), kuu=ib*(2*L2E),
        tg=alpha*fma32(F(gate,kgu),2,-1), tu=beta*fma32(F(up,kuu),2,-1),
        and Ap=(tg*F(gate,ksw))*tu. Parenthesized FP32 operations retain this order.
        For each consecutive G-channel block, amax is a left-to-right fmax fold
        starting at FP32 zero over fmax(abs(Ap[2*q]),abs(Ap[2*q+1])), q=0..G/2-1.
        fmax ignores a NaN operand when the other is numeric.
        s8=fp8_e4m3fn(min(amax*fp32(1/6),448)).
        If fp32(s8)>0, inv=rcp_rn(fp32(s8)) and q[i]=Q4(Ap[i]*inv), with
        Contract's RNE saturating E2M1 codes and low-even-nibble packing.
        Otherwise set all payload bits to zero without evaluating the reciprocal or multiply.
        Store the packed q in Aq[r,:] and scale in As[r,:]; decode as d(q)*s8.
        Only rows [0,Rv) are written. Aq/As spare capacity retains prior bytes.
      symbol:
        Aq: {meaning: Packed post-activation payload for FC2, shape: [{route: Rcap}, {packed_intermediate: I/2}], dtype: uint8,
          retention: keep_value invocation}
        As: {meaning: Post-activation block scales for FC2, shape: [{route: Rcap}, {intermediate_block: I/G}], dtype: fp8_e4m3fn,
          retention: keep_value invocation}
      arithmetic:
        approx: |-
          F uses ex2.approx.ftz.f32 and rcp.approx.f32. Folded prescales and the sigmoid identity for tanh replace the reference evaluation. unknown: no verified composed full-domain output error bound is supplied. The source's digest-equivalence comment does not establish equality with the non-folded standalone activation.
    - step: fc2
      name: Materialize BF16 route outputs
      math: |
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, As uses row b+m for m<v, b otherwise. Aq uses row b+m,
        possibly crossing experts or unwritten spare capacity; outside the Rcap-row
        payload matrix it is zero-filled.
        Let QTile decode these operands. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates the
        per-item alpha/beta reciprocals and reads the optional clamp limit, but uses
        none of them; it does not form FC1's folded activation constants.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        After completing fc2, including J=0, for every (t,h), Z(-1)=0.
        For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection or activation work. Finalize overwrites Y with zeros because every route_of is negative.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized activation, and BF16 route outputs.
      footprint:
      - {item: FC1 intermediates, change: '16*Rv*I baseline FP32 bytes -> 8*SK*Rv*I valid partial bytes plus 9*Rv*I/16 packed activation bytes; physical allocations total 8*SK*Rcap*I+2*Rcap*I bytes', by: [fc1, activate]}
      traffic:
      - {item: Partial materialization, change: '8*Rv*I-byte unsplit up/gate buffer written and read -> 8*SK*Rv*I partial bytes written and the same read; no capacity-row reduction', by: [fc1, reduce]}
      matmul:
      - {item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs including discarded rows', by: [fc1, fc2]}
      vector:
      - {item: Slice reduction, change: 'Add 2*SK*Rv*I FP32 additions, including the initial zero plus slice 0', by: [reduce]}
      - item: Routing auxiliaries
        change: |-
          + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - {item: Split accumulation order, change: 'H/64 updates per output become SK chains of H/(64*SK) updates plus SK FP32 additions per valid up/gate result; rounding can differ', by: [fc1, reduce]}
      - {item: Approximate activation and normalization, change: 'Affects Rv*I evaluations through the defined folded approximations and reciprocal normalization; no established full-domain output error bound', by: [activate]}
  work_schedule:
    thesis: |-
      Prepare compact routes, submit WS split-K FC1 with last-arriver reduction/activation/QDQ, single-warp-mainloop FC2 and finalize. Each FC1 slice stores raw partials; the last arrival for its tile/channel group reduces both slices locally. This removes the standalone activation grid but retains the partial slab and adds group counters.
      Let Small mean Rcap<=S with S defined in when. The actual stream chain is prepare -> fc1 -> fc2 -> finalize for Small, otherwise memset -> count -> scan -> scatter -> fc1 -> fc2 -> finalize. No pre-gather or reduce_act kernel is submitted. The launch entries enumerate conditional alternatives. Successors wait for their actual predecessor grid before reading; absent phases create no event or wait. Routing handoffs from count/scan/scatter apply only outside Small; Prepared carries the same arrays for Small.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise stream order serializes kernels and in-kernel dependency controls are inert. The API enable_pdl argument does not choose this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [finalize], storage: global, ready: scatter.kernel_done}
        Aq: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        As: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [fc1], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles; also reset all group arrival counters.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The preceding stream memset resets E counts, E fill words and Jcap*(I/Bn1) adjacent arrival counters.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile: {offs: {shape: [{prefix: E+1}], dtype: int32}, toffs: {shape: [{prefix: E+1}], dtype: int32},
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: |-
            Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule: {worktile_order: [{by: slot, direction: ascending}], worker_assignment: {preassigned: {start: worker_id,
              count: 1}, refill: none, exit: assigned_done}}
      fc1:
        describe: |-
          One expert tile, one contiguous hidden slice and Bn1 paired channels produce raw FP32 partials. The completing slice additionally produces Aq/As for that group; no separate reduction work is assigned.
        decomposition:
          strategy: |-
            cfg88 fixes Bm=128, Bn1=64, Bk=256, SK=2, STAGES=3, SFS=2, EPI=4, AMODE=3, DEEP=true, SFCH=true, SFPF=2 and FUSE=true. BRLESS=true but the FUSE tail uses guarded quantization. PP, SELFPREP, TSTORE, EPITB, CPHOIST, EARLYDONE and NPAIR are false; NIPRE=PFTMA=MBH=0.
            Each slice traverses H/(Bk*SK) stages from hidden channel l*H/SK; these divisions are exact in the shared Contract. Payload and scales are gathered directly by Route; no gathered activation buffers exist.
            Part is one global [SK,Rcap,2*I] FP32 slab, uninitialized on allocation and never memset. A global int32 counter for each (j,n1) starts at zero every invocation, increments once per completed slice and ends at SK for j<J; spare counters remain zero. Capacity is Jcap*(I/Bn1), appended to counts/fill. Small preparation resets it; otherwise the counts/fill memset does. The last arrival owns the sum and activation, without spinning for other CTAs. Its local tail visits ascending G-channel blocks and, within each, ascending partial slices. Counters are not reset by FC1.
            For either GEMM let Nx be the submitted x-width: SK*I/Bn1 for FC1 and H/Bn2 for FC2. The effective cap is grid_cap(), normally twice the runtime SM count (0 on query failure). Gy=Jcap unless cap>0 and Nx*Jcap>cap, then Gy=max(1,floor(cap/Nx)); Grid(Nx)=Nx*Gy. FC1 CTAs have 224 threads; FC2 CTAs have 128. Runtime J bounds work, so surplus CTAs can have empty sequences.
          partition: {tile: {size: J, tile: 1}, slice: {size: SK, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              hidden_states: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              Part: {shape: [{row: Bm}, {pair: 2}, {channel: G}], dtype: fp32, direction: ascending}
          target:
            single_tile:
              Part: {shape: [{row: Bm}, {channel: 2*Bn1}], dtype: fp32}
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bn1/2}], dtype: uint8}
              As: {shape: [{row: Bm}, {intermediate_block: Bn1/G}], dtype: fp8_e4m3fn}
            tile_reduction: {dimension: slice, input: Part, output: U, method: 'design.math_reshape::reduce'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(SK*I/Bn1)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: slice, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm=128, Bn2=128, Bk=256 and Grid from fc1. The only FC2 instantiation is f4_body_w1<128,false,3,3,1>: three payload slots, three scale slots and no reduction split. Both TMA boxes have 128 rows, matching the expected (Bm+Bn2)*(Bk/2)=32768 payload bytes per stage.
            Each CTA has 128 threads. Warp 0 stages payload and both scale operands and issues the full MMA reduction; all four warps then drain 32-channel chunks and issue valid-row BF16 vector stores. One accumulator serves successive worktiles; there is no bulk-store sink or fused route reduction.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: Grid(H/Bn2)}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: |-
            Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(), otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1 assigns warp 0 to activation scales, warp 1 to payload and weight scales, warp 2 to ordered MMA, and EPI independent epilogue warps to TMEM drain. Its continuous payload/scale rings and all-epilogue accumulator release permit producer and epilogue overlap.
      For FC1, Nrow=2*Bn1, AccCols=Nrow, NSFB=2, TCOLS=AccCols+16*SFS*(1+NSFB), TALLOC=256, Dpayload=STAGES, Chunks=Bn1/32. Four epilogue warps cover row quadrants warp_id%4. They release Acc after draining both chunks and issuing partial stores, before the last-arriver protocol. The next MMA worktile can overlap reduction of the previous group; FC2 still waits for the whole FC1 grid.
      FC2 uses warp 0 for its mainloop and all four warps for TMEM drain. Nk=I/Bk; three payload and scale slots use a continuous stage index across worktiles. The single 256-column TMEM allocation holds Bn2 accumulator columns plus 96 scale columns. One register set carries both scale operands ahead of their use. FC2 stage waits are warp-local; CTA rendezvous surround the mainloop and complete each worktile's drain.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  Reset all Jcap*(I/Bn1) arrival counters with CTA-strided stores. With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched; kernel completion also publishes the counter reset.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: |-
                  Wait for preceding stream work, including the counts/fill/arrival-counter memset, then let the first warp trigger successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: |-
                  Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of; only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      fc1:
        domain: {t: worktile, k: [0, H/(Bk*SK)], g: {flatten: [t, k]}, c: [0, Chunks], q: [0, Bn1/G]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}], dtype: uint8, slot_count: STAGES,
            view: {Payload(g): {slot_index: g%STAGES}}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, AccCols]}}
              TScale(g): {part: {column: [AccCols+16*(1+NSFB)*(g%SFS), AccCols+16*(1+NSFB)*(g%SFS+1)]}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: 64}], dtype: fp32, slot_count: 1}
          Last: {space: SMEM, member_slot_shape: [], dtype: int32, slot_count: 1}
          Sum: {space: register, member_slot_shape: [{row: Bm}, {pair: 2}, {channel: G}], dtype: fp32, slot_count: 1}
          Activated: {space: register, member_slot_shape: [{row: Bm}, {channel: G}], dtype: fp32, slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: |-
                  All roles wait for predecessor grid completion. Warp 0 triggers successor admission. If J=0 all return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and rendezvous. Surplus CTAs still initialize and retire. Stage counters and parity continue across assigned worktiles without resetting.
                prime: |-
                  Resolve tile, slice, expert and route bases; source stage k is slice*H/(Bk*SK)+k. Follow ptok into input scales and read only valid rows. Prime local stages 0 and 1 when present into the two register sets.
                produce: |-
                  After scale-slot reuse, write current registers into AScale(g), skipping padded rows. Fence shared writes, then load local k+1 into the alternate registers when present; primed stage 1 is reread at k=0. A warp rendezvous and one release arrival publish the readiness contribution. No load passes this slice's end.
                retire: Join the final CTA rendezvous after all roles finish their assigned sequences; warp 0 deallocates Tensor. No-op for J=0.
            pipe: {prologue: ['enter:Pipeline'], steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]', steady: ['produce:AScale(g)']}]}], epilogue: ['retire:Pipeline']}
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: |-
                  After payload reuse, arm transaction bytes and issue payloads at this slice's stage offset: ceil_div(v,4) gather4 boxes, repeating the first token in the final partial box. Unissued payload rows retain old local bytes. Both paired Bn1-row B boxes are always issued. The transaction covers (2*Bn1+4*ceil_div(v,4))*Bk/2 bytes.
                stage: |-
                  Wait for scale-slot reuse after payload issue. Issue SFCH weight-scale cp.async copies and 32 completion arrivals. Two images each write/use only 64 rows although full images are copied to TMEM. Hint local k+SFPF only inside this slice, without a readiness event.
                  Full-stage readiness joins completed TMA bytes, weight-scale copies and the activation-scale release arrival. Unstaged padded A scales and unused B-scale image rows are not cleared.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'], 'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: Wait for the prior worktile's all-epilogue accumulator release before consuming this worktile's first stage. The first worktile has no prior-accumulator wait.
                compute: |-
                  Wait for full-stage readiness, copy scales to TScale, and issue four ascending 64-channel updates. Each update uses separate up/gate MMAs. The slice's first update initializes Acc. Cumulative stage completion covers scale copies and MMA input reads, releasing shared slots. Ordered scale-copy/MMA operations read each TMEM scale operand before a later copy overwrites it.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update of the slice.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data: {'compute:Stage(g)': ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']}
              reuse: {'begin:Acc(t+1)': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:7]
              verb:
                begin: |-
                  Resolve this workitem's expert parameters and folded constants from fc1, retaining them through the conditional activation tail. Wait for Acc(t) and order the completed MMA before TMEM reads.
                load: Load this warp's paired up/gate quadrant/chunk into Drain and wait for both TMEM reads before use.
                store: Only valid rows issue FP32 vector stores to the disjoint slice/route/channel region of Part. Padded rows are read and discarded. Done covers store issue.
                release: |-
                  After both chunks, each warp rendezvouses and contributes one release arrival. MMA waits for all four before overwriting Acc. Partial stores can still be in flight; the release does not publish them or wait for the following reduction.
                arrive: |-
                  Every epilogue lane executes __threadfence after its partial stores, then the 128 epilogue threads rendezvous. The leader with quadrant 0 and lane 0 atomically increments this (j,n1) counter and writes Last=(old==SK-1), then executes __threadfence. A second 128-thread rendezvous broadcasts Last before any peer-slice load. These are the source's publication operations; no polling or extra inter-CTA wait is inserted. Producer/MMA warps do not enter either rendezvous.
                  Last is shared by successive local workitems. The first rendezvous of the next item joins all previous Last readers before its leader overwrites the flag; there is no additional closing barrier after reduction.
                reduce: |-
                  Only when Last and row<v, load all SK slices for the current G-channel block with FP32 vectors and sum in ascending slice order into Sum. Other rows and non-last arrivals skip the entire reduction and activation. Each lane owns one row and all G channels, so no inter-lane reduction is used.
                produce: |-
                  The same valid lanes evaluate activate into Activated, retaining all G values through the sequential pairwise amax scan and guarded QDQ. Each issues one eight-byte payload store and one scale-byte store. Sum/Activated are reused for the next block after consumption; done covers store issue. Non-last arrivals have no activation stores. Grid completion publishes Aq/As to FC2, and no valid Part region is overwritten within this invocation.
            pipe:
              repeat: t
              steady:
              - 'begin:Acc(t)'
              - {repeat: c, steady: ['load:Drain(t,c)', 'store:Part(t,c)']}
              - 'release:Acc(t)'
              - 'arrive:Last(t)'
              - {repeat: q, steady: ['reduce:Sum(t,q)', 'produce:Aq_As(t,q)']}
            waits_for: {data: {'begin:Acc(t)': ['MMA/publish:Acc(t)']}}
      fc2:
        domain: {t: worktile, k: [0, I/Bk], g: {flatten: [t, k]}, c: [0, Bn2/32]}
        resource:
          Payload: {space: SMEM, member_slot_shape: [{row: Bm+Bn2}, {byte: Bk/2}], dtype: uint8, slot_count: 3,
            view: {Payload(g): {slot_index: g%3}}}
          Scale: {space: SMEM, member_slot_shape: [{image: 2}, {row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 3, view: {Scale(g): {slot_index: g%3}}}
          ScaleRegisters: {space: register, member_slot_shape: [{row: Bm+Bn2}, {block: Bk/G}], dtype: fp8_e4m3fn,
            slot_count: 1}
          Rows: {space: SMEM, member_slot_shape: [{row: Bm}], dtype: int32, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: 256}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [0, Bn2]}}
              TScale(g): {part: {column: ['Bn2+32*(g%3)', 'Bn2+32*(g%3+1)']}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {hidden: 32}], dtype: fp32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: |-
                  Wait for the FC1 grid, including its last-arriver activation stores, and let warp 0 trigger successor admission. If J=0 return before allocation. Otherwise initialize completion protocols, allocate Tensor from warp 0 and rendezvous. Surplus CTAs with no assigned work still allocate and retire. Warp 0 initializes stage and MMA completion counters once per CTA.
                begin: |-
                  Resolve expert, channel and route bases. All four warps fill Rows, repeating the first valid route for padding, then rendezvous. Read alpha/beta and optional clamp and evaluate the unused reciprocals specified in fc2. Warp 0 keeps the prepared weight-scale addresses through the worktile.
                prime: |-
                  Only warp 0 executes prime and advance; the other warps proceed to the drain rendezvous. Fetch scale stages 0 and 1 when present into the single ScaleRegisters set, landing each into its continuous Scale slot before overwriting the registers. Fence each shared scale image to the async proxy. Lane 0 issues the corresponding leading payload stages, each with one 128-row A box and one 128-row B box and a 32768-byte transaction count. Fetch stage 2 into ScaleRegisters when present. Done covers scale staging and payload issue, not payload arrival.
                advance: |-
                  At k>0, lane 0 waits for the preceding MMA commit and the warp rendezvouses before any shared-slot refill. That cumulative completion protects both payload and scale reuse. Land the held scales for k+2 and issue payload k+2 when it exists. Lane 0 waits for the current payload transaction phase, then the warp rendezvouses, making current payload and scales readable.
                  One elected lane fences, copies current scale images to TScale(g), issues four ascending 64-channel MMAs and commits completion. The first update of the worktile initializes Acc. Ordered scale-copy/MMA reads protect each TMEM scale operand. After a warp rendezvous, fetch scale stage k+3 when present into ScaleRegisters, whose prior values have landed. Every fetch/refill stays inside this worktile. Done covers these issues and the tail fetch; the current MMA can remain in flight. No per-stage CTA rendezvous or cp.async group exists.
                drain: |-
                  Warp 0 advances its continuous stage counter and waits for the final cumulative MMA commit, toggling the carried completion parity. All four warps execute the tensor fence and a CTA rendezvous before TMEM reads. Every issued payload and scale stage has been consumed; no extra tail transaction is issued or drained.
                produce: |-
                  Each warp owns 32 route rows. Load the current 32-channel chunk into Drain and wait for the TMEM read. Only valid rows convert to BF16 and issue four 16-byte vector Rout stores; padded rows are read and discarded. Done covers conversion and store issue; grid completion publishes Rout to finalize.
                close: |-
                  Rendezvous after all four warps finish their TMEM reads and vector store issues. Rows, Drain and the single Acc may then serve the next worktile. This is not a separate global-store completion event; payload/scale slot positions and transaction/MMA parity continue without reset.
                retire: |-
                  Warp 0 deallocates Tensor after the assigned sequence, or after setup for an empty sequence. No-op when J=0. Kernel completion supplies the route-store visibility required by finalize.
            pipe:
              prologue: ['enter:Pipeline']
              steady:
              - repeat: t
                steady:
                - 'begin:Work(t)'
                - 'prime:Staging(t)'
                - {repeat: 'g[t]', steady: ['advance:Stage(g)']}
                - 'drain:Acc(t)'
                - {repeat: c, steady: ['produce:Rout(t,c)']}
                - 'close:Work(t)'
              epilogue: ['retire:Pipeline']
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding FC2 grid, including its route stores, then trigger admission.
                produce: |-
                  Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.Main']
    choice: |-
      Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect independent shared rings and the single accumulator in each projection.
  - item: design.tile_pipeline::fc1.Payload
    choice: |-
      Encode UINT8 TMA maps with 128-byte payload swizzle, undoing the prepared weight row permutation, with matching scale images. FC1 uses clipped gather4 A maps and two paired B boxes. Bind joint readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale release arrival.
    reason: Payload and scale rows must describe the same logical values, and the joint ready event must cover all three
      producers.
  - item: design.tile_pipeline::fc2.Main
    choice: |-
      Encode UINT8 128-row A/B TMA boxes with the prepared weight-row permutation and 128-byte payload swizzle. Use transaction-counted mbarrier completion for the 32768 payload bytes; direct register loads and shared scale stores use the matching f4_sf_off image, async-proxy fences and warp rendezvous.
    reason: Payload and scale rows must agree, while TMA readiness and the separate cumulative MMA completion protect different parts of staging and reuse.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays the captured launch set thereafter; source capture failures select eager execution. Return only enqueues work.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. FC1 cfg88 returns 733 on operand-map refusal. FC2 uses no drain map. Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold is not converted to large preparation. Attribute/launch errors propagate to Model.forward. Scratch and process-global graph/map caches have no added lock or cross-stream completion protocol; this extraction supplies none.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
