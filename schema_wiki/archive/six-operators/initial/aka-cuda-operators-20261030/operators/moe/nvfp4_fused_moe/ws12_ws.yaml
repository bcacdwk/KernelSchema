meta_data:
  name: nvfp4_fused_moe
  describe: Compute a pre-routed expert MLP with prepared NVFP4 weights, blockwise activation quantization, and a weighted
    expert reduction.
  source: source@b5c8e870e5534ae629325e56aa0ba28c3f00486f:kernel_wiki/aka-cuda-operators-20261030/operators/moe/nvfp4_fused_moe/candidate/solution.py::Model.forward
  version: 1
  dispatch:
    id: ws12_ws
    parent: ws_fused_ws
    when: |-
      Let a be the effective ABI after Model.forward validation and content gates, or the
      cached ABI reused by its host fast path. Use the launch choices baked into a replayed
      graph. Select exactly when a.zflag=0, the actual FC1 is f4_ws_g1 (cfg26 with an
      encodable operand map), and the actual FC2 is f4_body_ws with GEMM1=false.
      The FC2 cfg set is {57,61,62,66,67,68,71,72,73,80,81,83,89,93,94,100,102,105},
      subject to actual map/launch dispatch. A cfg26 operand-map refusal takes the ordinary
      FP4 fallback and is outside this node; FC2 WS map refusal returns an error.
      Let S be a.small_thresh when positive, otherwise native small_threshold(); use the
      preparation choice baked into a replayed graph. Both small and multi-kernel preparation
      are included, with no pre-gather. Conditions apply independently over the shared Contract;
      parent is only the copying origin. In-place input changes do not rebuild cached policy.
design:
  math_reshape:
    thesis: Compact routes by expert, collect packed token operands directly, and retain FP4 through both projections.
      Fuse paired FC1, scalar approximate activation and block quantization, avoiding full FP32 intermediates and a pre-gather
      allocation at the cost of dense padded arithmetic and repeated per-worktile token reads. The equations describe
      barrier-satisfied execution; the FC1 timeout escape recorded in tile_pipeline does not preserve those guarantees.
    rewrite:
    - step: routing
      name: Compact routes and enumerate expert tiles
      math: |
        Rcap = T*K. V = {(t,k) | 0 <= route_ids[t,k] < E}; Rv = count(V).
        counts[e] = count({(t,k) in V | route_ids[t,k]=e}).
        offs[0]=toffs[0]=0; offs[e+1]=offs[e]+counts[e];
        toffs[e+1]=toffs[e]+ceil_div(counts[e],Bm). J=toffs[E]; P=Bm*J.
        The preparation policy is bound by design.work_schedule.
        With multi-kernel preparation, fill starts at zero. Each consecutive group of
        256 slots (aggregated scatter) or 32 slots (warp scatter) reserves counts_group[e]
        positions at offs[e]+old(fill[e]); fill[e] increases by counts_group[e]. Local
        ranks fill the reservation, unordered for aggregated scatter and in slot order otherwise.
        With small preparation, split Rcap slots into up to 32 consecutive groups of
        L=32*ceil_div(ceil_div(Rcap,32),32) slots. Prefix their expert counts in group order;
        local atomic ranks place each group's routes after all earlier groups' routes.
        New counts/fill scratch is zero-initialized. Small preparation does not touch global fill;
        its prior value is unused.
        Thus route_of maps V bijectively onto [0,Rv), grouped by expert but unordered within
        an expert; route_of[t,k]=-1 outside V. Route[route_of[t,k],:] = (t,k,route_ids[t,k]).
        For toffs[e] <= j < toffs[e+1], Tile[j,:]=(e,Bm*(j-toffs[e])).
        Jcap=ceil_div(Rcap,Bm)+min(E,Rcap). Only Route[0:Rv] and Tile[0:J] are written;
        their remaining capacity retains unspecified prior bytes. All route_of entries are written.
        Prepared denotes the logical union (counts,offs,toffs,Route,route_of,Tile) written
        by small preparation, in exactly these same allocations; it adds no copy.
      symbol:
        Bm: {meaning: Dense route rows per projection worktile, binding: 'bind:design.work_schedule::Bm'}
        Bn1: {meaning: Intermediate channels per fused FC1 worktile, binding: 'bind:design.work_schedule::Bn1'}
        Bn2: {meaning: Hidden channels per FC2 worktile, binding: 'bind:design.work_schedule::Bn2'}
        counts: {meaning: Active route histogram, shape: [{expert: E}], dtype: int32, retention: keep_value invocation}
        fill:
          meaning: Multi-kernel scatter counters ending at counts; unused and unchanged by small preparation
          shape: [{expert: E}]
          dtype: int32
          retention: keep_value invocation
        counts_group: {meaning: Histogram contribution from one group of slots, shape: [{expert: E}], dtype: int32}
        offs: {meaning: Exclusive route prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        toffs: {meaning: Exclusive tile prefixes, shape: [{prefix: E+1}], dtype: int32, retention: keep_value invocation}
        Route:
          meaning: Logical columns ptok pslot pexp in separate arrays; ptok supplies direct FC1 token reads
          shape: [{route: Rcap}, {field: 3}]
          dtype: int32
          retention: keep_value invocation
        route_of: {meaning: Original slot to compact row mapping, shape: [{token: T}, {slot: K}], dtype: int32, retention: keep_value
            invocation}
        Tile: {meaning: Logical columns texp and tm0 in separate arrays, shape: [{tile: Jcap}, {field: 2}], dtype: int32,
          retention: keep_value invocation}
        Prepared:
          meaning: Logical union of the small preparation outputs in their existing arrays
          shape: [{word: 3*E+2+4*Rcap+2*Jcap}]
          dtype: int32
          retention: keep_value invocation
    - step: fc1
      name: Paired projection with dense padded rows
      math: |-
        Decode weights as in Contract's Decode the stored operands; W1 and W2 denote
        those values without materializing decoded weight tensors.
        For each j<J and n1<I/Bn1, let (e,m0)=Tile[j], b=offs[e]+m0,
        v=min(Bm,counts[e]-m0), and n=n1*Bn1. Evaluate all Bm rows.
        Row m reads both payload and scales from hidden token Route[b+(m if m<v else 0),0].
        Thus padding repeats the first valid token; it is evaluated and discarded.
        Let Xtile be these decoded operands and Wpair concatenate W1[e,n:n+Bn1,:]
        with W1[e,I+n:I+n+Bn1,:]. D1(-1)=0;
        D1(s)=mma32(Xtile[:,64*s:64*(s+1)],Wpair[:,64*s:64*(s+1)]^T,D1(s-1)),
        s=0..H/64-1. up=D1(H/64-1)[:,:Bn1]; gate=D1(H/64-1)[:,Bn1:].
      symbol:
        D1:
          meaning: Paired up and gate projection accumulator
          shape: [{row: Bm}, {channel: 2*Bn1}]
          dtype: fp32
          retention: carry_forward (j,n1); s=-1..H/64-1
      arithmetic:
        accumulate: mma32 here denotes native block-scaled E2M1 products with E4M3 scale per G channels and an FP32 accumulator,
          not an FP32 decoded-operand GEMM implementation. Four ascending 64-channel updates form each 256-channel stage;
          the first update disables the previous accumulator. Native internal product/reduction rounding is not a bitwise
          FP32 reference promise.
    - step: activate
      name: Scalar activation and guarded packed quantization
      math: |-
        Apply Contract's asymmetric clamp to up and gate, including padded rows.
        Let a=gemm1_alpha[e], bpar=gemm1_beta[e], ia=rcp_rn(a), ib=rcp_rn(bpar),
        F(x)=rcp_approx(1+ExpFast(-x)), and TanhFast(x)=fma32(F(2*x),2,-1).
        ExpFast is the CUDA __expf operation used by sigmoid_fast in the fixed source.
        For activation_type=3, Ap=(gate*F(a*gate))*(up+bpar).
        For activation_type=10, tg=a*TanhFast(gate*ia), tu=bpar*TanhFast(up*ib),
        and Ap=(tg*F(gate))*tu. Keep the shown FP32 operation order; no folded prescales.
        ia and ib are evaluated per workitem even for SwiGLU, where unused (ib may be infinite).
        For each row and G-channel block, M(-1)=0 and M(i)=fmax(M(i-1),abs(Ap[i]))
        for i=0..G-1 in channel order. fmax ignores a NaN operand if the other is numeric.
        s8=fp8_e4m3fn(min(M(G-1)*fp32(1/6),448)).
        Initialize every payload code to positive zero. Only if fp32(s8)>0, set inv=rcp_rn(fp32(s8))
        and, for each x=Ap[i], q0=x*inv, rem=fma32(-fp32(s8),q0,x),
        quot=fma32(rem,inv,q0), q[i]=Q4(quot). Q4 is Contract's RNE saturating E2M1 code rule.
        Otherwise skip the reciprocal, normalization and code conversion, keeping zero codes.
        Pack even channels into low nibbles. For m<v only, store
        Aq[b+m,n/2:(n+Bn1)/2] and As[b+m,n/G:(n+Bn1)/G]=s8.
        Rows [Rv,Rcap) retain prior bytes. The decoded FC2 operand is d(q)*s8;
        padded-row activation and quantization are computed without stores.
      symbol:
        Aq:
          meaning: Packed post-activation payload for FC2
          shape: [{route: Rcap}, {packed_intermediate: I/2}]
          dtype: uint8
          retention: keep_value invocation
        As:
          meaning: Post-activation block scales for FC2
          shape: [{route: Rcap}, {intermediate_block: I/G}]
          dtype: fp8_e4m3fn
          retention: keep_value invocation
      arithmetic:
        approx: 'sigmoid_fast uses CUDA __expf and rcp.approx.f32; SiTU uses the sigmoid identity for tanh and multiply-by-rounded-reciprocal
          parameter normalization. Quantization uses the explicit two-FMA residual correction above. unknown: no verified
          composed full-domain error bound is supplied; source comments about exact division or measured activation errors
          are not adopted as such a guarantee.'
    - step: fc2
      name: Materialize BF16 route outputs
      math: |-
        For j<J and n2<H/Bn2, use e,b,v from fc1 and n=n2*Bn2.
        At all Bm rows, QTile uses Aq payload row b+m and As scale row b+m for m<v, b otherwise.
        Padded payload may cross into another expert or unwritten capacity; outside the Rcap-row
        byte matrix it is zero-filled. Padded scale rows repeat the first valid row. D2(-1)=0;
        D2(s)=mma32(QTile[:,64*s:64*(s+1)],W2[e,n:n+Bn2,64*s:64*(s+1)]^T,D2(s-1)),
        s=0..I/64-1. For m<v, Rout[b+m,n:n+Bn2]=bf16(D2(I/64-1)[m,:]).
        Other rows are discarded; Rout[Rv:Rcap] remains unwritten. FC2 also evaluates per-item
        activation parameters and rounded reciprocals ia,ib. With L2E=fp32(-1.44269504),
        its unused ActK constants are (L2E,ia*(2*L2E),ib*(2*L2E)) for SiTU,
        or three copies of a*L2E for SwiGLU; each constant is duplicated in a float2.
      symbol:
        D2: {meaning: FC2 accumulator, shape: [{row: Bm}, {hidden: Bn2}], dtype: fp32, retention: 'carry_forward (j,n2);
            s=-1..I/64-1'}
        Rout: {meaning: BF16 route outputs before weighting, shape: [{route: Rcap}, {hidden: H}], dtype: bf16, retention: keep_value
            invocation}
      arithmetic: {accumulate: Same native block-scaled arithmetic and ascending 64-channel updates as fc1.}
    - step: finalize
      name: Fixed slot-order weighted reduction
      math: |
        For every (t,h), Z(-1)=0. For k=0..K-1, if route_of[t,k]<0 then Z(k)=Z(k-1);
        otherwise Z(k)=fma32(fp32(Rout[route_of[t,k],h]),route_weights[t,k],Z(k-1)).
        Y[t,h]=bf16(Z(K-1)); overwrite the supplied output view and return [output].
        Empty routing performs no projection payload work and still overwrites Y with zeros.
      symbol: {Z: {meaning: Per-output slot reduction state, shape: [], dtype: fp32, retention: 'carry_forward (t,h);
            k=-1..K-1'}}
    ledger:
      baseline: Direct active-route Contract evaluation with materialized FP32 up/gate, activation and decoded quantized
        activation, and BF16 route outputs.
      footprint:
      - item: FC1 intermediates
        change: 16*Rv*I bytes of FP32 intermediates -> 9*Rv*I/16 live payload/scale bytes; physical act allocation remains
          2*Rcap*I bytes
        by: [fc1, activate]
      matmul: [{item: Dense expert padding, change: '3*Rv*H*I -> 3*P*H*I MACs, including discarded rows under the bound
            worktile geometry', by: [fc1, fc2]}]
      vector:
      - {item: Quantized activation evaluation, change: 'Rv*I -> P*I elements for clamp/activation/quantization, including
          discarded rows', by: [activate]}
      - item: Routing auxiliaries
        change: + two Rcap-slot histogram/scatter traversals, two E-wide prefixes, J tile-map entries and Rcap inverse-map
          entries; small preparation stages Rcap IDs once and also prefixes up to 32 group counts per expert
        by: [routing]
      error:
      - item: Approximate activation and normalization
        change: Affects P*I activations through the explicit approximate sigmoid/tanh and parameter normalization; no
          established full-domain output error bound
        by: [activate]
  work_schedule:
    thesis: |-
      Compact routes with one small preparation kernel or count/scan/scatter kernels, then submit the dedicated twelve-warp fused FC1, WS FC2 and finalize. Each projection owns a full reduction and strides its capped static work sequence; FC1 gathers directly from input tokens.
      Let Small mean Rcap<=S with S defined in when. Only prepare is submitted for Small; only count/scan/scatter otherwise. The chain is prepare -> fc1 -> fc2 -> finalize, or memset -> count -> scan -> scatter -> fc1 -> fc2 -> finalize. Absent preparation phases create no events or waits. Routing handoffs from count/scan/scatter apply only to the large chain; Prepared carries the same allocations for the small chain. Successors wait for the actual predecessor grid before reading.
      source_pdl is active when effective pdl_on()!=0 and (pdl_big_r()<0 or Rcap<pdl_big_r()), default threshold 49152. It permits early admission through launch_ready, not early consumption. Otherwise stream order serializes kernels; in-kernel dependency controls are inert. The API enable_pdl argument does not select this policy.
    flow:
      launch:
      - {phase: [prepare], protocol: source_pdl}
      - {phase: [count], protocol: source_pdl}
      - {phase: [scan], protocol: source_pdl, start_after: count.launch_ready}
      - {phase: [scatter], protocol: source_pdl, start_after: scan.launch_ready}
      - {phase: [fc1], protocol: source_pdl}
      - {phase: [fc2], protocol: source_pdl, start_after: fc1.launch_ready}
      - {phase: [finalize], protocol: source_pdl, start_after: fc2.launch_ready}
      handoff:
        counts: {producer: count, consumer: [scan, fc1, fc2], storage: global, initialize: 0, ready: count.kernel_done}
        offs: {producer: scan, consumer: [scatter, fc1, fc2], storage: global, ready: scan.kernel_done}
        toffs: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        Tile: {producer: scan, consumer: [fc1, fc2], storage: global, ready: scan.kernel_done}
        route_of: {producer: scatter, consumer: [finalize], storage: global, ready: scatter.kernel_done}
        Aq: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        As: {producer: fc1, consumer: [fc2], storage: global, ready: fc1.kernel_done}
        Rout: {producer: fc2, consumer: [finalize], storage: global, ready: fc2.kernel_done}
        Prepared: {producer: prepare, consumer: [fc1, fc2, finalize], storage: global, ready: prepare.kernel_done}
        Route: {producer: scatter, consumer: [fc1], storage: global, ready: scatter.kernel_done}
    phase:
      prepare:
        describe: 'Only for Small: one CTA stages IDs, forms private histograms and prefixes, scatters routes and builds
          all tiles.'
        decomposition:
          partition: {}
          worktile: {invariant: {route_ids: {shape: [{slot: Rcap}], dtype: int32}}}
          target: {single_tile: {Prepared: {shape: [{word: 3*E+2+4*Rcap+2*Jcap}], dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      count:
        describe: 'Only outside Small: Produce block histogram contributions and atomically merge counts.'
        decomposition:
          strategy: The stream memset resets all E counts and E fill words before this kernel; no split counters exist
            here.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}}}
          target:
            single_tile: {counts_group: {shape: [{expert: E}], dtype: int32}}
            tile_reduction: {dimension: slot, input: counts_group, output: counts, method: 'design.math_reshape::routing'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule:
          worktile_order: [{by: slot, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      scan:
        describe: 'Only outside Small: Joint route/tile prefix scan followed by tile-map construction.'
        decomposition:
          partition: {}
          worktile: {invariant: {counts: {shape: [{expert: E}], dtype: int32}}}
          target:
            single_tile:
              offs: {shape: [{prefix: E+1}], dtype: int32}
              toffs: {shape: [{prefix: E+1}], dtype: int32}
              Tile: {shape: [{tile: J}, {field: 2}], dtype: int32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 1}
        schedule: {worker_assignment: {preassigned: {start: 0, count: 1}, refill: none, exit: assigned_done}}
      scatter:
        describe: 'Only outside Small: Reserve per-expert ranges and publish forward and inverse route maps.'
        decomposition:
          strategy: Aggregated scatter reserves once per block/expert and ranks with shared atomics; otherwise each warp
            matches equal IDs, reserves once per expert and ranks by lane order.
          partition: {slot: {size: Rcap, tile: 256}}
          worktile: {invariant: {route_ids: {shape: [{slot: 256}], dtype: int32}, offs: {shape: [{prefix: E+1}], dtype: int32}}}
          target: {single_tile: {Route: {shape: [{route: 256}, {field: 3}], dtype: int32}, route_of: {shape: [{slot: 256}],
                dtype: int32}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'ceil_div(Rcap,256)'}
        schedule:
          worktile_order: [{by: slot, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
      fc1:
        describe: One expert tile and Bn1 paired channels over the full hidden reduction, followed by scalar activation
          and guarded QDQ; Route selects original-token payloads and scales.
        decomposition:
          strategy: |-
            Bm=128, Bn1=64, Bk=256. cfg26 uses STAGES=SFS=4, two paired accumulators and 384 threads. Warp 0 issues B payloads and stages A scales; warps 1/3 collect the two A row halves, with warp 1 also staging B scales; warp 2 issues MMA; warps 4-7 drain and quantize. Warps 8-11 perform no per-worktile computation, but join setup/retirement rendezvous.
            Let C=grid_cap(), normally twice the runtime SM count, or 0 on query failure. FC1 cap C1=ceil_div(C,2) for C>0; otherwise query the runtime SM count again, using it if positive and 0 on failure. For a cap c, Gy(Nx,c)=Jcap unless c>0 and Nx*Jcap>c, then max(1,floor(c/Nx)); Grid(Nx,c)=Nx*Gy(Nx,c). Thus a channel row is never split even if Nx exceeds the cap.
            FC1 uses Grid(I/Bn1,C1); flattened channel tile is fastest. CTAs with worker_id>=J*(I/Bn1), including J=0, return before local allocation. Active CTAs stride by the submitted grid size, keeping ring state between worktiles.
          partition: {tile: {size: J, tile: 1}, channel: {size: I, tile: Bn1}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
              Route: {shape: [{route: Bm}, {field: 1}], dtype: int32}
            iteration:
              gemm1_weights: {shape: [{row: 2*Bn1}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              gemm1_weights_scale: {shape: [{row: 2*Bn1}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              hidden_states: {shape: [{row: Bm}, {packed_hidden: Bk/2}], dtype: uint8, direction: ascending}
              hidden_states_scale: {shape: [{row: Bm}, {hidden_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bn1/2}], dtype: uint8}
              As: {shape: [{row: Bm}, {intermediate_block: Bn1/G}], dtype: fp8_e4m3fn}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'Grid(I/Bn1,C1)'}
        schedule:
          strategy: Flattened channel tile is fastest. Runtime J bounds the work; surplus submitted CTAs have empty sequences.
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      fc2:
        describe: One expert tile and Bn2 output channels over the entire intermediate reduction, followed by BF16 route
          materialization.
        decomposition:
          strategy: |-
            Use Bm, Bk and Grid(Nx,c) from fc1. FC2 cap C2=C except cfg71 uses floor(3*C/2) for C>0; C=0 stays uncapped. Submit (3+EPI)*32 threads per CTA. Bn2 and the FC2-local template parameters have base cfg57: Bn2=128, STAGES=3, SFS=2, EPI=4; PP, DEEP, TSTORE, EPITB, CPHOIST, EARLYDONE are false; PFTMA=NIPRE=MBH=0. AMODE=0, SK=1, BRLESS=true, NPAIR=SFCH=FUSE=SELFPREP=false and SFPF=0 throughout.
            cfg61 sets Bn2=64 and PP=true; cfg62 also sets STAGES=4. cfg66 sets STAGES=4; cfg67 sets STAGES=5,SFS=3; cfg68 sets STAGES=6,SFS=3; cfg71 sets Bn2=64,STAGES=2 with cap C2; cfg72 sets Bn2=64; cfg73 enables DEEP.
            cfg80 enables TSTORE; cfg83 also sets PFTMA=2. cfg81 enables DEEP,TSTORE,EPITB,CPHOIST,EARLYDONE; cfg89 adds NIPRE=6 to cfg81; cfg93/94 add NIPRE=1/2 to cfg81; cfg102 adds MBH=256 to cfg81. cfg100 sets Bn2=64,PP=true,DEEP=true,EPITB=true from base. cfg105 sets EPI=8,DEEP=true,CPHOIST=true from base.
            For TSTORE, complete 32-row quadrants use bulk stores; partial quadrants use masked vector stores. Other forms use vector stores throughout. Every ws2d launch requires the drain tensor map even cfg100/105, whose TSTORE is false. Map/attribute/launch failures return errors, with no substituted WS implementation.
          partition: {tile: {size: J, tile: 1}, channel: {size: H, tile: Bn2}}
          worktile:
            invariant:
              Tile: {shape: [{field: 2}], dtype: int32}
              counts: {shape: [{expert: 1}], dtype: int32}
              offs: {shape: [{prefix: 1}], dtype: int32}
              Parameters: {shape: [{value: 3}], dtype: fp32}
            iteration:
              Aq: {shape: [{row: Bm}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              As: {shape: [{row: Bm}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
              gemm2_weights: {shape: [{row: Bn2}, {packed_intermediate: Bk/2}], dtype: uint8, direction: ascending}
              gemm2_weights_scale: {shape: [{row: Bn2}, {intermediate_block: Bk/G}], dtype: fp8_e4m3fn, direction: ascending}
          target: {single_tile: {Rout: {shape: [{row: Bm}, {hidden: Bn2}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'Grid(H/Bn2,C2)'}
        schedule:
          worktile_order: [{by: tile, direction: ascending}, {by: channel, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, step: worker_count}, refill: none, exit: assigned_done}
      finalize:
        describe: Reduce all route slots locally for a block of output channels and overwrite the caller view.
        decomposition:
          strategy: Vfin=16 when 2*Rcap*H >= fin16_mb()*2^20, otherwise Vfin=4 when fin_wide()!=0 and T<=fin_tmax(),
            otherwise 8. Defaults are 40 MiB, enabled and 128 tokens. Each worktile covers one token and 128*Vfin channels.
          partition: {token: {size: T, tile: 1}, hidden: {size: H, tile: 128*Vfin}}
          worktile:
            invariant: {route_of: {shape: [{slot: K}], dtype: int32}, route_weights: {shape: [{slot: K}], dtype: fp32}}
            iteration: {Rout: {shape: [{hidden: 128*Vfin}], dtype: bf16, direction: ascending}}
          target: {single_tile: {Y: {shape: [{hidden: 128*Vfin}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: 'T*ceil_div(H,128*Vfin)'}
        schedule:
          worktile_order: [{by: token, direction: ascending}, {by: hidden, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: |-
      FC1 binds four payload/scale slots and alternates two accumulators, allowing producers and MMA to advance while four epilogue warps drain the previous worktile. FC2 retains independent payload/scale rings, its source-selected single or double accumulator, and optional bulk output drain. Ring indices persist across worktiles; TMEM release, bulk source reuse and global completion are different events.
      For FC1, AccCols=2*Bn1, Acount=2, NSFB=2 and TALLOC=512: 256 columns hold the two accumulators, the next 192 hold four sets of three scale images. Payload and scale slots both use g%4. No register lookahead crosses FC1 stages.
      For FC2 only, template parameters are local to work_schedule: Nrow=Bn2, AccCols=Bn2, Acount=2 if PP else 1, NSFB=1, TCOLS=Acount*AccCols+32*SFS; TALLOC is the smallest of 128,256,512 covering TCOLS. Dpayload=STAGES if DEEP else SFS; Chunks=Bn2/(32*(EPI/4)*(2 if EPITB else 1)), DrainWidth=64 if EPITB else 32, ReleaseAt=0 if EARLYDONE else 1. MBH=256 adds only a suspend hint. Epilogue members are the instantiated prefix warp[3:3+EPI] of the listed maximum; quadrant=warp_id%4, parity=floor((warp_id-3)/4) for EPI=8, otherwise 0. Local chunk c selects c*(EPI/4)+parity, or adjacent chunks 2*c and 2*c+1 for EPITB. Release covers every instantiated epilogue warp, without an inter-warp rendezvous.
      FC1 data/reuse edges describe successful barrier satisfaction. Its actual ws_mbar_wait returns immediately if the process-global device diagnostic is already nonzero, or records a timeout and returns after more than 2^28 polling cycles. Subsequent ws_mbar_wait calls then bypass synchronization, including in later calls; this path neither aborts nor rebuilds the rings and may compute/store from unready or overwritten data. The fixed source provides no normal-call reset or valid-output guarantee for this escape. Selection does not exclude it.
    phase:
      prepare:
        resource:
          IDs: {space: SMEM, member_slot_shape: [{slot: Rcap}], dtype: int32, slot_count: 1}
          PrivateCounts: {space: SMEM, member_slot_shape: [{group: 32}, {expert: 256}], dtype: int32, slot_count: 1}
          Prefixes: {space: SMEM, member_slot_shape: [{word: 643}], dtype: int32, slot_count: 1}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for preceding stream work; the first warp triggers successor admission.
                produce: |-
                  With prep2_on()==0, stage all IDs and clear the full 32x256 private table, rendezvous, histogram each warp's contiguous L-slot range, then rendezvous. PREP2 instead lets only nw=min(32,ceil_div(Rcap,L)) active warps clear their E counters and stage their own ranges, sync locally before their histogram, then all rendezvous. The cross-warp prefix reads all 32 rows in the first form, only nw initialized rows in PREP2.
                  Per expert, replace private counts with group-exclusive bases and write global counts, rendezvous, then scan route/tile counts using warp sums and CTA rendezvous. Publish offs/toffs and rendezvous before scatter from staged IDs through private atomic bases. Build Tile by binary search of shared tile prefixes. Scatter and tile writes are disjoint; kernel completion publishes both. Global fill is untouched, and there are no split-K arrival counters here.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Prepared']}
      count:
        resource: {Histogram: {space: SMEM, member_slot_shape: [{expert: 256}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for preceding stream work, including the counts/fill memset, then let the first warp trigger
                  successor admission. Trigger does not publish computed data.
                produce: Zero the local histogram, rendezvous, count valid IDs by shared atomic adds, rendezvous, then
                  add nonzero expert totals to global counts.
            pipe: {prologue: ['enter:Input'], steady: ['produce:counts_group']}
      scan:
        resource: {ScanScratch: {space: SMEM, member_slot_shape: [{word: 386}], dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:32]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: Jointly scan counts and ceil(counts/Bm) with warp scans and a scan of warp totals, using two
                  CTA rendezvous. Publish offs/toffs, rendezvous after the shared tile prefixes, then traverse tile indices
                  in steps of 1024 and binary-search their expert.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Tile']}
      scatter:
        resource: {Reservations: {space: SMEM, member_slot_shape: [{array: 3}, {expert: 256 if scatter_agg else 0}],
            dtype: int32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:8]
              verb:
                enter: Wait for the preceding kernel, then trigger admission from the first warp.
                produce: Aggregated scatter clears local counts/ranks, rendezvouses, histograms IDs, rendezvouses, reserves
                  one global fill range per block/expert, rendezvouses, then assigns shared atomic ranks and writes both
                  maps. Otherwise each warp matches IDs, its leader reserves the group size globally and broadcasts the
                  base; rank counts earlier matching lanes. That form has no CTA barrier. All real slots write route_of;
                  only valid slots write Route.
            pipe: {prologue: ['enter:Input'], steady: ['produce:route_of']}
      fc1:
        domain: {t: worktile, k: [0, H/Bk], g: {flatten: [t, k]}, c: [0, Bn1/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+2*Bn1}, {byte: Bk/2}]
            dtype: uint8
            slot_count: 4
            view:
              Alo(g): {slot_index: g%4, part: {row: [0, Bm/2]}}
              Ahi(g): {slot_index: g%4, part: {row: [Bm/2, Bm]}}
              BPayload(g): {slot_index: g%4, part: {row: [Bm, Bm+2*Bn1]}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 3}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: 4
            view: {AScale(g): {slot_index: g%4, part: {image: [0, 1]}}, BScale(g): {slot_index: g%4, part: {image: [
                    1, 3]}}}
          BRegisters: {space: register, member_slot_shape: [{row: 2*Bn1}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 1}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: 512}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [(t%2)*AccCols, (t%2+1)*AccCols]}}
              TScale(g): {part: {column: [2*AccCols+48*(g%4), 2*AccCols+48*(g%4+1)]}, dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{row: Bm}, {channel: 64}], dtype: fp32, slot_count: 1}
        role:
          BPayload:
            info:
              execution_mode: async
              member: warp[0:1]
              verb:
                enter:
                  execution_mode: serial
                  meaning: All twelve warps wait for predecessor grid completion, with warp 0 triggering successor admission.
                    Empty assigned sequences return before allocation. Otherwise warp 0 allocates Tensor, initializes
                    four joint-ready/reuse protocols and two accumulator-full/empty protocols, then all twelve warps
                    rendezvous. The first four stage slots and first two accumulator uses have no prior readers.
                prime:
                  execution_mode: serial
                  meaning: Resolve this worktile's expert, channel and route bases; retain four token indices per lane,
                    repeating the first valid row for padding.
                load: After the bounded slot-reuse wait, arm 2*Bn1*(Bk/2) transaction bytes and issue two 64-row B TMA
                  boxes. Done covers only B payload completion, not full-stage readiness. Arming contributes one of four
                  readiness arrivals.
                stage:
                  execution_mode: serial
                  meaning: Load the current hidden_states_scale rows synchronously, permute into AScale, fence to the
                    async proxy and rendezvous within the warp. One lane makes the second readiness arrival. No A-scale
                    register prefetch or extra scale-ring wait exists.
                retire:
                  execution_mode: serial
                  meaning: All twelve warps rendezvous after their assigned sequences; warp 0 deallocates Tensor. Empty
                    sequences skipped allocation and retirement. No per-worktile reset is inserted.
            pipe:
              prologue: ['enter:Pipeline']
              steady: [{repeat: t, steady: ['prime:Route(t)', {repeat: 'g[t]', steady: ['load:BPayload(g)', 'stage:AScale(g)']}]}]
              epilogue: ['retire:Pipeline']
            waits_for: {reuse: {'load:BPayload(g+4)': ['MMA/compute:Stage(g)']}}
          LowerA:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                prime: {execution_mode: serial, meaning: Retain token indices for rows 0-63 and prepared up/gate scale
                    addresses; padded rows use the first valid token.}
                load: After the bounded slot-reuse wait, issue eight 16-byte cp.async pieces per row into Alo and commit
                  the group.
                prefetch:
                  execution_mode: serial
                  meaning: Synchronously load this stage's two 64-row weight-scale planes into BRegisters while the A
                    copies remain in flight. This is current-stage staging, not next-stage lookahead.
                publish:
                  execution_mode: serial
                  meaning: Wait for all of this warp's committed cp.async copies, then scatter BRegisters into the two
                    BScale images and fence shared writes to the async proxy. Only the first 64 rows of each 128-row
                    image are written/used; the rest remain uninitialized although whole images are copied to TMEM. A
                    warp rendezvous and one lane's arrival publish readiness of Alo and BScale together. This is the
                    third joint-ready arrival.
            pipe: {repeat: t, steady: ['prime:Route(t)', {repeat: 'g[t]', steady: ['load:Alo(g)', 'prefetch:BRegisters(g)',
                    'publish:Lower(g)']}]}
            waits_for: {sync: {'prime:Route(t)': ['BPayload/enter:Pipeline']}, reuse: {'load:Alo(g+4)': ['MMA/compute:Stage(g)']}}
          UpperA:
            info:
              execution_mode: async
              member: warp[3:4]
              verb:
                prime: {execution_mode: serial, meaning: 'Retain token indices for rows 64-127, repeating the first valid
                    token for padding.'}
                load: After the bounded slot-reuse wait, issue eight 16-byte cp.async pieces per row into Ahi and commit
                  the group.
                publish:
                  execution_mode: serial
                  meaning: Wait for all of this warp's committed copies, rendezvous within the warp and have one lane
                    arrive. This fourth arrival publishes Ahi readiness; joint readiness also requires completed B transaction
                    bytes and the other arrivals.
            pipe: {repeat: t, steady: ['prime:Route(t)', {repeat: 'g[t]', steady: ['load:Ahi(g)', 'publish:Upper(g)']}]}
            waits_for: {sync: {'prime:Route(t)': ['BPayload/enter:Pipeline']}, reuse: {'load:Ahi(g+4)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: Perform the bounded accumulator-empty wait for parity t%2; its prior reader is worktile t-2.
                    The first two uses pass the initialized empty phase. No stage-zero scale-copy hoist precedes this
                    wait.
                compute: Perform the bounded joint-ready wait. An elected lane copies all three scale images into TScale,
                  then issues four ascending 64-channel up/gate MMA pairs. The first pair initializes both accumulator
                  halves. Cumulative stage completion covers scale copies and all MMA shared-input reads, returning the
                  bound payload/scale slot. The ordered scale-copy/MMA stream consumes each TMEM scale before its later
                  overwrite.
                publish: Commit cumulative completion of the final MMA updates to the selected accumulator-full protocol.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['BPayload/enter:Pipeline']}
              data: {'compute:Stage(g)': ['BPayload/load:BPayload(g)', 'BPayload/stage:AScale(g)', 'LowerA/publish:Lower(g)',
                  'UpperA/publish:Upper(g)']}
              reuse: {'begin:Acc(t+2)@done': ['Epilogue/release:Acc(t)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[4:8]
              verb:
                prime: Load expert activation parameters, reciprocals and optional limit once for this worktile.
                load: At the first chunk perform the bounded accumulator-full wait; subsequent chunks reuse that established
                  readiness. Quadrant=warp_id%4. Read 32 up and 32 gate channels into private Drain and wait for both
                  TMEM loads before use.
                produce: Apply math_reshape.activate, including padded rows and the positive-scale guard. For each valid
                  row issue one 16-byte payload store and one two-byte scale store per 32-channel chunk. There is no
                  scale-word carry between chunks. Done covers computation and store issue, not kernel-global publication.
                release: After both chunks, each of the 128 epilogue threads arrives once on the selected accumulator-empty
                  protocol. MMA needs all 128 arrivals before reusing it two worktiles later. No additional warp/CTA
                  rendezvous or global-store drain occurs at this release.
            pipe: {repeat: t, steady: ['prime:Parameters(t)', {repeat: c, steady: ['load:Drain(t,c)', 'produce:Aq(t,c)']},
                'release:Acc(t)']}
            waits_for: {sync: {'prime:Parameters(t)': ['BPayload/enter:Pipeline']}, data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      fc2:
        domain: {t: worktile, k: [0, I/Bk], g: {flatten: [t, k]}, c: [0, Chunks], h: [0, DrainWidth/32]}
        resource:
          Payload:
            space: SMEM
            member_slot_shape: [{row: Bm+Nrow}, {byte: Bk/2}]
            dtype: uint8
            slot_count: STAGES
            view: {Payload(g): {slot_index: g%STAGES}}
          Scale:
            space: SMEM
            member_slot_shape: [{image: 1+NSFB}, {row: Bm}, {block: Bk/G}]
            dtype: fp8_e4m3fn
            slot_count: SFS
            view: {AScale(g): {slot_index: g%SFS, part: {image: [0, 1]}}, BScale(g): {slot_index: g%SFS, part: {image: [
                    1, 1+NSFB]}}}
          ARegisters: {space: register, member_slot_shape: [{row: Bm}, {block: Bk/G}], dtype: fp8_e4m3fn, slot_count: 2,
            view: {ARegisters(g): {slot_index: k%2}}}
          Tensor:
            space: TMEM
            member_slot_shape: [{row: Bm}, {column: TALLOC}]
            dtype: fp32
            slot_count: 1
            view:
              Acc(t): {part: {column: [(t%Acount)*AccCols, (t%Acount+1)*AccCols]}}
              TScale(g): {part: {column: [Acount*AccCols+16*(1+NSFB)*(g%SFS), Acount*AccCols+16*(1+NSFB)*(g%SFS+1)]},
                dtype: fp8_e4m3fn}
          Drain: {space: register, member_slot_shape: [{group: EPI/4}, {row: Bm}, {channel: DrainWidth}], dtype: fp32,
            slot_count: 1}
          Sink: {space: SMEM, member_slot_shape: [{quadrant: 4 if TSTORE else 0}, {row: 32}, {hidden: 32}], dtype: bf16,
            slot_count: 1}
        role:
          AScale:
            info:
              execution_mode: serial
              member: warp[0:1]
              verb:
                enter: All roles wait for predecessor grid completion. Warp 0 triggers successor admission. If J=0 all
                  return before allocation; otherwise allocate Tensor, initialize stage and epilogue protocols, and publish
                  setup with one CTA rendezvous. Surplus CTAs still initialize and retire. The continuous stage counter
                  never resets between worktiles.
                prime: Resolve tile/expert/route bases. Padded rows use the first valid As row. Read local stages 0 and
                  1 when present into the two register sets before the stage loop.
                produce: After scale-ring reuse, write the current registers into AScale(g), fence shared writes, then
                  load k+1 into the alternate register set when present. The primed stage 1 is reread at k=0. A warp
                  rendezvous and one release arrival publish this readiness contribution. No load passes the worktile
                  end.
                retire: Join the final CTA rendezvous after every role's assigned sequence and any bulk global store
                  drain; warp 0 deallocates Tensor. No-op for J=0.
            pipe:
              prologue: ['enter:Pipeline']
              steady: [{repeat: t, steady: ['prime:ARegisters(t)', {repeat: 'g[t]', steady: ['produce:AScale(g)']}]}]
              epilogue: ['retire:Pipeline']
            waits_for: {reuse: {'produce:AScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          Payload:
            info:
              execution_mode: async
              member: warp[1:2]
              verb:
                load: After payload reuse, arm transaction bytes and issue one 128-row Aq TMA box and one Bn2-row weight
                  box. Completion covers 128*(Bm+Bn2) bytes. PFTMA hints operands k+PFTMA only inside this worktile;
                  NIPRE hints g+NIPRE along this CTA sequence, crossing worktiles while the target work ID is valid.
                  Hints allocate no slot and provide no readiness event.
                stage: DEEP waits for the scale slot after payload issue; otherwise the preceding SFS-distance wait covers
                  both. Issue weight-scale cp.async copies and 32 completion arrivals, using contiguous 16-byte pieces
                  for Bn2=128 or 8-byte pieces for Bn2=64. The BN64 image allocates 128 rows but writes/uses only 64;
                  the rest remain uninitialized although the whole image is copied to TMEM. Full readiness joins completed
                  TMA bytes, completed weight-scale copies and the activation-scale release arrival.
            pipe: {repeat: g, steady: ['load:Payload(g)', 'stage:BScale(g)']}
            waits_for: {sync: {'load:Payload(g)': ['AScale/enter:Pipeline']}, reuse: {'load:Payload(g+Dpayload)': ['MMA/compute:Stage(g)'],
                'stage:BScale(g+SFS)': ['MMA/compute:Stage(g)']}}
          MMA:
            info:
              execution_mode: async_ordered_completion
              member: warp[2:3]
              verb:
                begin:
                  execution_mode: serial
                  meaning: If CPHOIST, t>0 and Rcap>=16*E, first wait for stage 0 readiness and issue its scale copies
                    into disjoint TScale, then wait for the prior accumulator release. Otherwise wait for accumulator
                    release before stage 0 readiness and scale copies. The prior user is t-Acount; the first Acount worktiles
                    have no such wait. Done means scale copies issued and accumulator reusable, not copies completed.
                compute: Wait for full-stage readiness and copy scales into TScale unless begin already issued stage
                  0 copies. One elected lane issues four ascending 64-channel MMA updates spanning Bn2 columns; the first
                  initializes Acc. Cumulative stage completion covers preceding scale copies and all MMA input reads,
                  releasing shared slots. Ordered scale-copy/MMA issue consumes each TMEM scale before its later overwrite.
                publish: Commit final MMA completion for Acc(t) to the epilogue protocol; done covers the last update.
            pipe: {repeat: t, steady: ['begin:Acc(t)', {repeat: 'g[t]', steady: ['compute:Stage(g)']}, 'publish:Acc(t)']}
            waits_for:
              sync: {'begin:Acc(t)': ['AScale/enter:Pipeline']}
              data:
                begin:Acc(t)@done: ['AScale/produce:AScale(g[t,0])', 'Payload/load:Payload(g[t,0])', 'Payload/stage:BScale(g[t,0])']
                compute:Stage(g): ['AScale/produce:AScale(g)', 'Payload/load:Payload(g)', 'Payload/stage:BScale(g)']
              reuse: {'begin:Acc(t+Acount)@done': ['Epilogue/release:Acc(t,Chunks-1,ReleaseAt)']}
          Epilogue:
            info:
              execution_mode: serial
              member: warp[3:11]
              verb:
                load: Each epilogue warp resolves expert parameters and unused folded activation constants, waits for
                  Acc(t), and loads its quadrant/chunk into private Drain. EPITB reads adjacent chunks together; otherwise
                  read one chunk. Wait for every issued TMEM read before use.
                release: Point 0 is immediately after the TMEM read wait; point 1 is after this chunk stores issue. Only
                  c=Chunks-1 and point=ReleaseAt performs a warp rendezvous and one release arrival. Other instances
                  are no-ops. MMA waits for all EPI arrivals on the chosen accumulator; no inter-warp rendezvous occurs
                  here and global stores may remain in flight.
                pack: Convert this 32-channel half of Drain to BF16 output registers, preserving route rounding before
                  weighting.
                recycle: 'Only TSTORE and a full valid quadrant use Sink: the issuing lane waits until ALL previous bulk
                  stores have consumed their shared source, including the previous worktile, then the warp rendezvous
                  permits overwrite. This is not global completion. Partial quadrants neither touch Sink nor clear pending
                  groups.'
                store:
                  execution_mode: async
                  meaning: TSTORE full quadrants stage 32x32 BF16 values, fence to the async proxy, rendezvous, and issue/commit
                    a bulk store from one lane. All other cases use valid-row-masked vector global stores. Done means
                    global completion; bulk completion is established by drain, not recycle.
                drain: After all worktiles, every bulk issuing lane waits for ALL stores to complete globally, then joins
                  the final CTA rendezvous. Non-TSTORE and empty sequences have no bulk groups. There is no per-worktile
                  global drain.
            pipe:
              steady:
              - repeat: t
                steady:
                - repeat: c
                  steady: ['load:Drain(t,c)', 'release:Acc(t,c,0)', {repeat: h, steady: ['pack:Rout(t,c,h)', 'recycle:Sink(t,c,h)',
                        'store:Rout(t,c,h)']}, 'release:Acc(t,c,1)']
              epilogue: ['drain:Rout']
            waits_for: {data: {'load:Drain(t,c)': ['MMA/publish:Acc(t)']}}
      finalize:
        resource: {Sum: {space: register, member_slot_shape: [{hidden: 128*Vfin}], dtype: fp32, slot_count: 1}}
        role:
          Main:
            info:
              execution_mode: serial
              member: warp[0:4]
              verb:
                enter: Wait for the preceding grid, including global bulk-store completion, then trigger admission.
                produce: Each lane owns Vfin adjacent channels. Load all eight positions and weights before the route
                  loop, skip negative positions, apply finalize in fixed slot order, convert to BF16 and store the full
                  valid output slice. Out-of-range channel lanes return. Vfin=16 uses evict-first route loads and output
                  stores; no output read occurs.
            pipe: {prologue: ['enter:Input'], steady: ['produce:Y']}
realization:
  require:
  - item: ['design.tile_pipeline::fc1.MMA', 'design.tile_pipeline::fc2.MMA']
    choice: Bind the ordered scale-copy/MMA stream to tcgen05.cp, block-scaled tcgen05.mma and cumulative tcgen05.commit
      completion; bind epilogue reads to tcgen05.ld plus wait::ld.
    reason: Ordered operand reads and cumulative completion protect the FC1 bound ring, the FC2 independent rings and
      their accumulator reuse.
  - item: ['design.tile_pipeline::fc1.BPayload', 'design.tile_pipeline::fc1.LowerA', 'design.tile_pipeline::fc1.UpperA']
    choice: Use two 64-row UINT8 B TMA boxes with 128-byte swizzle and matching scale images. Collect original-token
      A by 16-byte cp.async pieces into the matching swizzle, with commit_group/wait_group 0 before each half publishes
      its release arrival; ordinary scale stores use the async-proxy fence.
    reason: The split producers must describe the same logical rows and publish completed A copies and scale stores together
      with completed B transaction bytes.
  - item: design.tile_pipeline::fc2.Payload
    choice: Use UINT8 TMA maps with 128-byte payload swizzle, undoing prepared weight row permutation, and matching scale
      images. Bind full-stage readiness to transaction-counted TMA completion, cp.async completion arrivals and the activation-scale
      release arrival.
    reason: Readiness must cover both payloads and both scale producers before MMA consumes the stage.
  - item: design.tile_pipeline::fc2.Epilogue
    choice: For TSTORE use cp.async.bulk.tensor.2d.global.shared::cta.bulk_group with the 64-byte by 32-row byte-view
      map, async-proxy fence, per-issuer wait_group.read 0 for source reuse and wait_group 0 before the final CTA rendezvous.
    reason: Source reuse permits outstanding global stores; finalize requires their stronger final completion.
  - item: design.work_schedule::flow
    choice: |-
      Bind source_pdl to programmatic stream serialization and griddepcontrol wait/launch_dependents; the off case relies on stream order. Model.forward retains scratch/ABI ownership and refreshes the invocation stream on host-cache hits. Native moe_run executes eagerly on the first matching signature, attempts capture on the second, and replays thereafter; disabled/failed capture uses eager execution. Return enqueues work without a host completion wait.
      Maps cache pointers, dimensions, mode, box geometry and L2 promotion, including refusals. cfg26 requires its B map for this node; map refusal instead dispatches the ordinary FP4 fallback. FC2 WS returns 733 on operand-map refusal, and ws2d returns 738 on drain-map refusal. FC2 attribute/launch errors propagate; cfg26 returns 760 on attribute failure, but ignores launch_pdl's returned status and only uses launch_gemm's final cudaGetLastError, with no stronger reporting guarantee.
      Small preparation requests 4*Rcap dynamic shared bytes with a fixed 4*32768-byte opt-in; an oversized forced small threshold does not select large preparation. Scratch and process-global graph/map caches provide no additional lock or cross-stream completion protocol. The FC1 sticky timeout escape remains as recorded in tile_pipeline.
    reason: Early admission does not provide data visibility, and cached storage is reused across invocations rather
      than implicitly rebuilt.
