meta_data:
  name: gdn_postconv_mtp_bf16_state_fp32
  describe: Normalize packed queries and keys, apply gated delta-rule state recurrence over MTP tokens, and write gated RMS-normalized BF16 outputs and indexed FP32 checkpoints.
  source: KernelSchema@c3fc7a029476ba448d6378aad4d5323d24a476ee:kernel_wiki/aka-cuda-operators-20261030/operators/linear_attention/gdn_postconv_mtp_bf16_state_fp32/candidate/solution.py::Model.forward
  version: 2
contract:
  algorithm_requirement:
    constant:
      Dk: {value: 128, meaning: Query and key channel count}
      Dv: {value: 128, meaning: Value and output channel count}
      QkEps: {value: 1.0e-6, meaning: Additive epsilon for query and key squared-norm normalization}
    input:
      mixed_qkv:
        meaning: Packed post-convolution queries, keys and values; read-only view of the same backing as output_gate
        shape: [token: T, channel: "2*H*Dk+HV*Dv"]
        dtype: bf16
      a: {meaning: Raw per-token per-value-head decay logits; second half of shared BA backing, shape: [token: T, value_head: HV], dtype: bf16}
      b: {meaning: Raw beta logits; first half of the same BA backing as a, shape: [token: T, value_head: HV], dtype: bf16}
      A_log: {meaning: Per-value-head log decay rate, shape: [value_head: HV], dtype: fp32}
      dt_bias: {meaning: Per-value-head bias added to a before softplus, shape: [value_head: HV], dtype: bf16}
      state_indices:
        meaning: Request checkpoint table; zero is the reserved null slot and positive entries identify distinct pool slots
        shape: [request: N, checkpoint: W]
        dtype: int32
        range: "0 <= state_indices[r,j] < P; all positive entries are pairwise distinct"
      cu_seqlens:
        meaning: Contiguous prefix sums locating each request in the packed token axis
        shape: [boundary: "N+1"]
        dtype: int32
        range: "0 <= cu_seqlens[r] <= T"
      num_accepted_tokens:
        meaning: One-based checkpoint position selecting the initial carried state independently of current request length
        shape: [request: N]
        dtype: int32
        range: "1 <= num_accepted_tokens[r] <= W"
      state:
        meaning: Caller-owned initial FP32 state pool with value-major matrices and independently padded slot stride; updated in place
        shape: [slot: P, value_head: HV, value: Dv, key: Dk]
        dtype: fp32
      output_gate:
        meaning: Raw output gate logits in the trailing portion of the packed QKV and gate backing; read-only
        shape: [token: T, value_head: HV, value: Dv]
        dtype: bf16
      norm_weight: {meaning: RMSNorm weight shared across tokens and value heads, shape: [value: Dv], dtype: bf16}
      out:
        meaning: Required caller-owned contiguous output buffer; previous contents are ignored and all logical elements are overwritten
        shape: [token: T, value_head: HV, value: Dv]
        dtype: bf16
      scale: {meaning: Supplied query scaling factor, shape: [], dtype: fp64, range: "scale = Dk^(-1/2)"}
      norm_eps: {meaning: Supplied additive RMSNorm epsilon, shape: [], dtype: fp64, range: "norm_eps = 1e-6"}
      output_gate_activation: {meaning: Supplied output activation selector, shape: [], dtype: string, range: "output_gate_activation = 'sigmoid'"}
    output:
      Y:
        meaning: Gated normalized token outputs written into out; the returned object is the supplied out itself
        shape: [token: T, value_head: HV, value: Dv]
        dtype: bf16
      State:
        meaning: Post-call state pool in the same storage as state; only active positive destination slots are updated
        shape: [slot: P, value_head: HV, value: Dv, key: Dk]
        dtype: fp32
    compute:
      - name: Domain and caller storage
        math: |
          Let TP be an integer in {1,2,4,8}, H = 16/TP, and R = HV/H in {2,3,8}.
          There are 1 <= N <= 256 requests and 1 <= W <= 8 checkpoint positions.
          For 0 <= r < N define L_r = cu_seqlens[r+1] - cu_seqlens[r].
          cu_seqlens[0] = 0, cu_seqlens[N] = T = sum_r L_r > 0,
          and 0 <= L_r <= W. Pool capacity satisfies 2 <= P <= 2048 and P > N*W.
          Every positive table entry is distinct across all requests and positions;
          zero entries are allowed, including all-zero request rows.
          Accepted positions select previous checkpoints, so they need not be <= L_r.
          Supplied workloads choose num_accepted_tokens[r] = 1+(r mod W) or W.
          The declared input families include normal, cancellation, tiny, zero,
          qk_nearzero, gate_negative and api_null (the latter has N >= 4).
          These generation profiles do not impose additional elementwise value bounds.
          All floating input values are finite. Convolution and rolling history are
          outside this boundary; their results are already in mixed_qkv.

          All tensors are on one CUDA device. Strides below are in elements.
          Let C = 2*H*Dk + 2*HV*Dv. mixed_qkv has strides [C,1], and
          output_gate has strides [C,Dv,1] with a same-row backing offset of
          2*H*Dk+HV*Dv after mixed_qkv. The read-only a and b views have strides
          [2*HV,1], with a starting HV elements after b. A_log, dt_bias,
          norm_weight, state_indices, cu_seqlens and num_accepted_tokens are contiguous.
          state has strides [HV*Dv*Dk+p,Dv*Dk,Dk,1], where p is any integer
          in [0,65536]. No divisibility requirement is imposed on p.
          out is contiguous. The supplied guarded allocations have nonzero storage
          offsets and retain their shared backing; neither view offsets nor pool
          padding may be discarded. out and state have separate backing allocations.
      - name: Normalized queries and keys with gates
        math: |
          For 0 <= t < T, 0 <= h < H, 0 <= v < Dv and 0 <= k < Dk,
          define local unpacked values q0[t,h,k] = mixed_qkv[t,h*Dk+k],
          k0[t,h,k] = mixed_qkv[t,H*Dk+h*Dk+k], and
          V[t,u,v] = mixed_qkv[t,2*H*Dk+u*Dv+v] for 0 <= u < HV.
          Value head u uses key head h = floor(u/R), preserving contiguous head groups.
          Q[t,u,k] = scale*q0[t,h,k]/sqrt(sum_{j=0}^{Dk-1} q0[t,h,j]^2+QkEps).
          K[t,u,k] = k0[t,h,k]/sqrt(sum_{j=0}^{Dk-1} k0[t,h,j]^2+QkEps).
          Define sigmoid(x) = 1/(1+exp(-x)) and softplus(x) = ln(1+exp(x)),
          evaluated stably using the reference's PyTorch softplus.
          Decay[t,u] = exp(-exp(A_log[u])*softplus(a[t,u]+dt_bias[u])).
          Beta[t,u] = sigmoid(b[t,u]); Gate[t,u,v] = sigmoid(output_gate[t,u,v]).
          Floating arithmetic and reductions use FP32; supplied Python floating
          scalars participate at FP32 precision. BF16 inputs contribute their stored
          values exactly. QkEps keeps zero query/key norms well-defined.
        symbol:
          Q: {meaning: Scaled normalized queries expanded to value heads, shape: [token: T, value_head: HV, key: Dk], dtype: fp32}
          K: {meaning: Normalized keys expanded to value heads, shape: [token: T, value_head: HV, key: Dk], dtype: fp32}
          V: {meaning: Unpacked stored values represented in reference arithmetic, shape: [token: T, value_head: HV, value: Dv], dtype: fp32}
          Decay: {meaning: Per-token per-value-head state decay, shape: [token: T, value_head: HV], dtype: fp32}
          Beta: {meaning: Per-token per-value-head delta update gate, shape: [token: T, value_head: HV], dtype: fp32}
          Gate: {meaning: Activated elementwise output gate, shape: [token: T, value_head: HV, value: Dv], dtype: fp32}
      - name: Accepted-state delta recurrence and checkpoints
        math: |
          Let State0 denote the entire state pool at call entry, before any writes.
          Request r is active exactly when L_r > 0 and
          s_r = state_indices[r,num_accepted_tokens[r]-1] > 0.
          Empty requests produce no token values and perform no checkpoint writes.
          For each active request, S_r(-1)[u,v,k] = State0[s_r,u,v,k].
          For 0 <= j < L_r, set t = cu_seqlens[r]+j and define
          local decayed state Hbar[u,v,k] = Decay[t,u]*S_r(j-1)[u,v,k],
          prediction pred[u,v] = sum_{k=0}^{Dk-1} Hbar[u,v,k]*K[t,u,k], and
          delta[u,v] = Beta[t,u]*(V[t,u,v]-pred[u,v]).
          S_r(j)[u,v,k] = Hbar[u,v,k]+delta[u,v]*K[t,u,k].
          Raw[t,u,v] = sum_{k=0}^{Dk-1} S_r(j)[u,v,k]*Q[t,u,k].
          Each token reads the updated state. Recurrence is dependent along j;
          requests and value heads are independent. State carry, checkpoints and
          Raw remain FP32, with no intermediate BF16 rounding in the reference.

          Initialize State = State0. For each active r and 0 <= j < L_r,
          if d = state_indices[r,j] > 0, set State[d,:,:,:] = S_r(j).
          A zero destination skips only its checkpoint store, not the recurrence
          or output. A zero source deactivates the whole request even when other
          destinations are positive. Read initial source snapshots before writes,
          including when the selected source is also a destination of that request.
          All other slots, including slot 0 and checkpoint positions beyond L_r,
          retain their call-entry values. Padding and allocation guards are untouched.
        symbol:
          State0: {meaning: Immutable call-entry snapshot of the logical state pool, shape: "ref:state.shape", dtype: fp32}
          S: {meaning: S_r(j) is the state after local token j for each active request r; j is a recurrence instance, shape: [request: N, value_head: HV, value: Dv, key: Dk], dtype: fp32}
          Raw: {meaning: Updated-state query readout defined on active token rows, shape: [token: T, value_head: HV, value: Dv], dtype: fp32}
      - name: Gated RMS-normalized output and side effects
        math: |
          For each token t of an active request and 0 <= u < HV, 0 <= v < Dv,
          Y[t,u,v] = bf16((Raw[t,u,v]/sqrt(
            sum_{w=0}^{Dv-1} Raw[t,u,w]^2/Dv+norm_eps))*norm_weight[v]*Gate[t,u,v]).
          BF16 output conversion uses round-to-nearest, ties-to-even.
          For every token of an inactive nonempty request, Y[t,u,v] = bf16(0).
          Write all Y elements to out and return that exact caller-owned object;
          write State into the existing state storage only at defined destinations.
          No other input, shared read-only backing, padding, guard or unused storage
          may change. There is no caller-provided scratch region or extra output.
          The fixed workload supplies out, scale, norm_eps and activation explicitly;
          omitted-out allocation, SiLU and different scalar values exposed by the
          Python signature are not additional variants of this declared workload.
    golden_reference:
      source: KernelSchema@c3fc7a029476ba448d6378aad4d5323d24a476ee:kernel_wiki/aka-cuda-operators-20261030/operators/linear_attention/gdn_postconv_mtp_bf16_state_fp32/problem/reference.py::Model.forward
      tolerance:
        Y: >-
          Compare the returned tensor and mutated out with the default reference
          Model (fault=None) on identical call-entry inputs. For candidate value x
          and reference value g, every element must satisfy
          abs(x-g) <= 0.01 + 0.05*abs(x); relative_to=candidate and
          max_mismatch_fraction=0.0. The recorded mode is elementwise_and_l2,
          but max_rel_l2 is unset, so no additional L2 threshold is imposed.
          The return must alias the supplied out exactly. The two numeric records
          observe the same buffer. External comparator arithmetic precision and
          NaN/Inf policy are not declared; no such guarantees are inferred.
        State: >-
          Compare each positive destination selected by an active request with the
          corresponding mutated state of the default reference Model (fault=None),
          starting from identical call-entry pools. For candidate x and reference g,
          every element must satisfy abs(x-g) <= 0.01 + 0.05*abs(x);
          relative_to=candidate, max_mismatch_fraction=0.0,
          mode=elementwise_and_l2, and no additional L2 threshold (max_rel_l2 unset).
          Unwritten slots, slot 0, padding, guards and other protected storage must
          remain exactly unchanged from call entry. External comparator arithmetic
          precision and NaN/Inf policy are not declared; no such guarantees are inferred.
  hardware_specification:
    device: null
    arch: null
    execution: {Unit: null}
    feature: {Mechanism: null}
    stack: {language: null, toolchain: null}
    wiki:
      hardware: null
      programming: {language: null}
      microbench: null
      sota: {kernel: null, schema: null}
      profile: null
design:
  math_reshape:
    thesis: >-
      Fuse normalization, row-independent delta recurrence and gated RMSNorm while
      retaining prepared token data and carrying each state row through all tokens.
      BF16 value and raw-output materialization halves their payload relative to FP32,
      but raw-output narrowing changes RMSNorm inputs; time dependence remains serial.
    rewrite:
      - step: boundary
        name: Select the carried checkpoint and define arithmetic
        math: |
          Use the Contract's unpacking, head map h=floor(u/R), request lengths L_r,
          initial pool State0, active-request predicate and checkpoint destinations.
          Empty requests return without producing values or writing state. Nonempty
          requests with source slot zero write Y[cu_seqlens[r]+j,u,v]=bf16(0) for
          every j,u,v and leave State unchanged. The remaining steps apply only
          to active requests, 0<=u<HV, 0<=j<L_r, 0<=v<Dv, 0<=k<Dk.
          Let E(x), LP(x), RS(x) and DIV(x,y) denote the candidate FP32 fast
          exponential, log1p, reciprocal square root and division evaluations.
          Fmul(x,y), Fadd(x,y), Fma(x,y,z) denote RNE FP32 multiply, add and
          fused multiply-add with subnormal inputs/results flushed to signed zero.
          For a 32-element vector z define X_0=z and
          X_(n+1)[a]=Fadd(X_n[a],X_n[a xor (16/2^n)]) for n=0..4, a=0..31;
          PairSum(z)=X_5[0]. This definition also applies independently to two
          paired reductions; no arithmetic mixes their values.
          StridedSquares(x) first accumulates x[a+32*i]^2 in FP32 for i=0..3,
          in that order, for each a=0..31, then applies PairSum to these 32 sums.
          ContiguousDot(x,y) first sets z[a]=0 and applies
          z[a]=Fma(x[4*a+i],y[4*a+i],z[a]) for i=0..3 in order, then PairSum(z).
          All unnamed arithmetic is FP32. Python scale and norm_eps are converted
          to FP32 at launch. BF16 casts use round-to-nearest, ties-to-even.
      - step: prepare
        name: Retain normalized token operands and scalar gates
        math: |
          For t=cu_seqlens[r]+j, use q0, k0 and V from the Contract unpacking.
          qs=RS(StridedSquares(q0[t,h,:])+QkEps)*scale;
          ks=RS(StridedSquares(k0[t,h,:])+QkEps).
          Qn(r,u)[j,k]=q0[t,h,k]*qs; Kn(r,u)[j,k]=k0[t,h,k]*ks.
          Vb(r,u)[j,v]=bf16(V[t,u,v]), retaining the original stored BF16 value.
          x=a[t,u]+dt_bias[u]; sp(x)=x if x>20, otherwise LP(E(x)).
          Gd(r,u)[j]=E(-E(A_log[u])*sp(x));
          Gb(r,u)[j]=DIV(1,1+E(-b[t,u])).
          These values are evaluated for actual tokens only, retained through all
          value-row recurrences, and discarded after those recurrences finish.
        symbol:
          Qn: {meaning: Prepared scaled queries for one request and value head, shape: [token: L_r, key: Dk], dtype: fp32, retention: "keep_value (r,u)"}
          Kn: {meaning: Prepared keys for one request and value head, shape: [token: L_r, key: Dk], dtype: fp32, retention: "keep_value (r,u)"}
          Vb: {meaning: Stored token values for one request and value head, shape: [token: L_r, value: Dv], dtype: bf16, retention: "keep_value (r,u)"}
          Gd: {meaning: Prepared state decays, shape: [token: L_r], dtype: fp32, retention: "keep_value (r,u)"}
          Gb: {meaning: Prepared delta gates, shape: [token: L_r], dtype: fp32, retention: "keep_value (r,u)"}
        arithmetic:
          approx: >-
            E is __expf, LP is log1pf, RS is rsqrtf and DIV is FP32 division
            under solution.py CUDA_FLAGS --use_fast_math. The sp threshold is 20.
            unknown: the fixed source supplies no uniform error bound for these
            approximations over the Contract's finite but unbounded inputs.
          accumulate: >-
            StridedSquares has four ordered products per group followed by the
            paired FTZ sum defined in boundary. Scalar source expressions may
            contract multiply-add under the pinned fast-math build; no generated
            instruction trace or bitwise agreement with PyTorch is asserted.
      - step: recurrent
        name: Carry independent FP32 rows and narrow the readout
        math: |
          Let s_r=state_indices[r,num_accepted_tokens[r]-1].
          Carry(r,u,v,-1)[k]=State0[s_r,u,v,k]. For j=0..L_r-1 in ascending order:
          Hdec[k]=Fmul(Carry(r,u,v,j-1)[k],Gd(r,u)[j]);
          pred=ContiguousDot(Hdec,Kn(r,u)[j,:]);
          delta=(Vb(r,u)[j,v]-pred)*Gb(r,u)[j];
          Carry(r,u,v,j)[k]=Fma(Kn(r,u)[j,k],delta,Hdec[k]);
          raw=ContiguousDot(Carry(r,u,v,j),Qn(r,u)[j,:]);
          Rb(r,u)[j,v]=bf16(raw).
          Initialize State=State0; if d=state_indices[r,j]>0,
          State[d,u,v,k]=Carry(r,u,v,j)[k]. If d=0, omit only this store.
          Carry remains FP32 across tokens, independent of checkpoint stores; each
          value row consumes its own call-entry source row before overwriting it.
          Rows and value heads do not interact until the RMS reduction below.
          Rb is retained until all Dv values of every actual token are available.
          The terminal Carry is discarded after its last readout and optional store;
          other slots, pool padding and guards retain their call-entry values.
        symbol:
          Carry: {meaning: Current FP32 state row after local token j, shape: [key: Dk], dtype: fp32, retention: "carry_forward (r,u,v); j=-1..L_r-1"}
          Rb: {meaning: BF16 readout materialized for the later RMS reduction, shape: [token: L_r, value: Dv], dtype: bf16, retention: "keep_value (r,u)"}
        arithmetic:
          accumulate: >-
            Hdec, the two ordered four-product partial dot sums, their PairSum
            reductions and the state update use the explicit FTZ/RNE operations
            defined in boundary. Paired value rows and paired key coordinates
            remain independent FP32 arithmetic streams.
      - step: output
        name: Normalize the rounded readout and write the caller output
        math: |
          For each active r,u,j let z[v] be Rb(r,u)[j,v] widened to FP32.
          Accumulate z[a+32*i]^2 for i=0..3 in FP32 for a=0..31; reduce the
          32 partial sums by the same xor offsets 16,8,4,2,1 using scalar FP32
          additions to obtain ss. Set rr=RS(ss/Dv+norm_eps).
          For t=cu_seqlens[r]+j, gate=DIV(1,1+E(-output_gate[t,u,v]));
          Y[t,u,v]=bf16(((z[v]*rr)*norm_weight[v])*gate).
          Store Y in out, and return that same object. Combined with boundary,
          every logical out element is written; State is the pool produced by
          recurrent, with no additional output or caller-visible scratch.
        arithmetic:
          approx: >-
            E, RS and DIV use the same candidate fast-math evaluations and unknown
            error bounds defined in prepare. RMSNorm consumes widened Rb, not the
            FP32 Contract Raw; the Contract reference and tolerance remain unchanged.
          accumulate: >-
            Four ordered squares per group and the scalar xor reduction follow
            kernel.cuh lines 493-505. Scalar multiply-add contraction and FTZ follow
            the pinned --use_fast_math build, without a bitwise reference claim.
    ledger:
      baseline: >-
        Direct Contract recurrence retaining FP32 normalized Q/K, FP32 V and FP32
        Raw for all L_r tokens of one active request and value head, with FP32
        carried state and the same required positive checkpoint stores. Count
        logical payload, not allocation capacity or measured global traffic.
      footprint:
        - {item: Retained V and raw readout, change: "8*L_r*Dv -> 4*L_r*Dv bytes per active request/value head; Q/K and scalar gates are unchanged", by: [prepare, recurrent]}
      error:
        - {item: Readout narrowing, change: "0 -> L_r*Dv extra BF16 RNE conversions before RMSNorm per active request/value head; both numerator and squared norm change", by: [recurrent, output]}
        - {item: Fast arithmetic and grouped reductions, change: "Reference FP32 evaluation -> fast transcendental/division evaluations, explicit FTZ state arithmetic and fixed grouped reductions on active tokens; no uniform end-to-end error bound is established", by: [prepare, recurrent, output]}
  work_schedule:
    thesis: >-
      Assign one request and value head to one CTA, keeping every token and all
      value rows within that worker so RMSNorm needs no cross-worker merge.
      Four local value-row chunks limit live carried state, at the cost of
      replaying the token loop four times and repeating Q/K preparation across
      the R value heads that share a key head.
    flow:
      launch: [{phase: [main]}]
    phase:
      main:
        describe: >-
          Execute boundary, prepare, recurrent and output for one (r,u), writing
          its complete Y rows and its positive State checkpoint head slices.
        decomposition:
          strategy: >-
            Bv=32 and Cv=Dv/Bv=4. A worktile owns all j=0..L_r-1 and v=0..Dv-1.
            Prepare all actual token operands once, then visit c=0..Cv-1 in
            ascending order; for each c carry rows v=c*Bv..(c+1)*Bv-1 through
            j=0..L_r-1 before advancing c. Only after all c finish, normalize
            the complete Dv-element Rb row of each token. The key contractions
            and output RMS reductions are local work, not tile reductions.
            Active_r is 1 for an active request and 0 otherwise.
            M_r counts j<L_r with state_indices[r,j]>0 when r is active, and
            is zero otherwise. State target slots are precisely these M_r
            destinations, with untouched pool storage inherited from call entry.
            Invariant input shapes describe views, not full local allocations;
            mixed_qkv reads only key head floor(u/R) and value head u. Empty
            requests do no work; zero-source requests only fill their Y slice.
          partition:
            request: {size: N, tile: 1}
            value_head: {size: HV, tile: 1}
          worktile:
            invariant:
              mixed_qkv: {shape: [token: L_r, channel: "2*H*Dk+HV*Dv"], dtype: "ref:contract.algorithm_requirement::mixed_qkv.dtype"}
              a: {shape: [token: L_r], dtype: "ref:contract.algorithm_requirement::a.dtype"}
              b: {shape: [token: L_r], dtype: "ref:contract.algorithm_requirement::b.dtype"}
              A_log: {shape: [], dtype: "ref:contract.algorithm_requirement::A_log.dtype"}
              dt_bias: {shape: [], dtype: "ref:contract.algorithm_requirement::dt_bias.dtype"}
              state_indices: {shape: [checkpoint: W], dtype: "ref:contract.algorithm_requirement::state_indices.dtype"}
              cu_seqlens: {shape: [boundary: 2], dtype: "ref:contract.algorithm_requirement::cu_seqlens.dtype"}
              num_accepted_tokens: {shape: [], dtype: "ref:contract.algorithm_requirement::num_accepted_tokens.dtype"}
              output_gate: {shape: [token: L_r, value: Dv], dtype: "ref:contract.algorithm_requirement::output_gate.dtype"}
              norm_weight: {shape: [value: Dv], dtype: "ref:contract.algorithm_requirement::norm_weight.dtype"}
            iteration:
              state: {shape: [value: Bv, key: Dk], dtype: "ref:contract.algorithm_requirement::state.dtype", direction: ascending}
              Qn: {shape: [token: 1, key: Dk], dtype: "ref:design.math_reshape::Qn.dtype", direction: ascending}
              Kn: {shape: [token: 1, key: Dk], dtype: "ref:design.math_reshape::Kn.dtype", direction: ascending}
              Vb: {shape: [token: 1, value: Bv], dtype: "ref:design.math_reshape::Vb.dtype", direction: ascending}
              Gd: {shape: [token: 1], dtype: "ref:design.math_reshape::Gd.dtype", direction: ascending}
              Gb: {shape: [token: 1], dtype: "ref:design.math_reshape::Gb.dtype", direction: ascending}
          target:
            single_tile:
              Y: {shape: [token: L_r, value: Dv], dtype: "ref:contract.algorithm_requirement::Y.dtype"}
              State: {shape: [slot: M_r, value: Dv, key: Dk], dtype: "ref:contract.algorithm_requirement::State.dtype"}
        mapping:
          strategy: >-
            Grid coordinates (x,y)=(u,r) give worker_id=r*HV+u. Each worker is
            one CTA. N*HV is the number submitted, not a residency
            or simultaneous-execution guarantee; workers have no communication.
          worker: {unit: CTA, unit_count: 1}
          worker_count: "N*HV"
        schedule:
          strategy: >-
            One current-stream launch chooses gdn_post_conv_mtp<float,R,true>
            for R in {2,3,8}. Actual request lengths create unequal work without
            dynamic redistribution. The host rejects unaligned FP32 state bases
            or slot strides not divisible by four before launch; no fallback
            covers those otherwise legal Contract inputs. Device completion,
            rather than Python return, makes all state and output stores ready
            for a later current-stream consumer or an explicitly ordered consumer.
          worktile_order:
            - {by: request, direction: ascending}
            - {by: value_head, direction: ascending}
          worker_assignment:
            preassigned: {start: worker_id, count: 1}
            refill: none
            exit: assigned_done
  tile_pipeline:
    thesis: >-
      One cooperative eight-warp role permits asynchronous source-state copies to overlap
      with operand preparation and with the preceding chunk's token recurrence.
      Two shared state slots cost 32768 bytes; completion waits and CTA barriers
      bound lookahead to one chunk, while all token readouts wait for the final
      chunk before RMSNorm. No overlap or residency performance is asserted.
    phase:
      main:
        domain:
          c: [0, Cv]
          j: [0, L_r]
        resource:
          StateRing:
            space: SMEM
            member_slot_shape: [value: Bv, key: Dk]
            dtype: fp32
            slot_count: 2
            view:
              "Seed(c)": {slot_index: "c%2"}
          Qn:
            space: SMEM
            member_slot_shape: [token: 8, key: Dk]
            dtype: fp32
            slot_count: 1
            view: {Qn: {part: {token: [0, L_r]}}}
          Kn:
            space: SMEM
            member_slot_shape: [token: 8, key: Dk]
            dtype: fp32
            slot_count: 1
            view: {Kn: {part: {token: [0, L_r]}}}
          Vb:
            space: SMEM
            member_slot_shape: [token: 8, value: Dv]
            dtype: bf16
            slot_count: 1
            view: {Vb: {part: {token: [0, L_r]}}}
          Rb:
            space: SMEM
            member_slot_shape: [token: 8, value: Dv]
            dtype: bf16
            slot_count: 1
            view: {Rb: {part: {token: [0, L_r]}}}
          Gd:
            space: SMEM
            member_slot_shape: [token: 8]
            dtype: fp32
            slot_count: 1
            view: {Gd: {part: {token: [0, L_r]}}}
          Gb:
            space: SMEM
            member_slot_shape: [token: 8]
            dtype: fp32
            slot_count: 1
            view: {Gb: {part: {token: [0, L_r]}}}
          CarryBlock:
            space: register
            member_slot_shape: [value: Bv, key: Dk]
            dtype: fp32
            slot_count: 1
            view: {"CarryBlock(c)": {}}
          TokenQK:
            space: register
            member_slot_shape: [operand: 2, replica: 8, key: Dk]
            dtype: fp32
            slot_count: 1
            view:
              "Qfrag(c,j)": {part: {operand: [0, 1]}}
              "Kfrag(c,j)": {part: {operand: [1, 2]}}
          OutputRows:
            space: register
            member_slot_shape: [token: 8, value: Dv]
            dtype: fp32
            slot_count: 1
            view: {OutputRows: {part: {token: [0, L_r]}}}
          Rstd:
            space: register
            member_slot_shape: [token: 8, replica: 32]
            dtype: fp32
            slot_count: 1
            view: {Rstd: {part: {token: [0, L_r]}}}
        role:
          Main:
            info:
              execution_mode: serial
              member: "warp[0:8]"
              verb:
                classify: >-
                  Request reads its prefix-sum boundaries, and only when nonempty
                  reads the accepted source index.
                  The condition is CTA-uniform. Empty requests return immediately;
                  nonempty zero-source requests distribute all L_r*Dv zero stores
                  across the CTA and return without state access. Active_r gates
                  the entire remaining pipe, so inactive paths issue no copies,
                  shared accesses or barriers. There is no refill operation.
                prefetch:
                  execution_mode: async
                  meaning: >-
                    Seed(0) issues the first source chunk. Next(c) issues Seed(c+1)
                    only when c+1<Cv; at c=Cv-1 it is a completed no-op and issues
                    no out-of-range copy. Each active copy reads Bv*Dk FP32 values
                    from the selected source head into StateRing slot chunk%2,
                    using distributed 16-byte asynchronous copies followed by a
                    commit per thread. Issue means committed, not readable; done
                    means all copies of this chunk completed, as established by
                    the following wait. Next(c) may overlap the current recurrence.
                prepare: >-
                  Operands executes math_reshape.prepare. Warp j handles token j
                  only for j<L_r, keeping four strided q/k values per lane through
                  the squared-norm reduction before writing Qn/Kn and copying Vb.
                  Its lane zero writes Gd/Gb. Unused token slots remain uninitialized
                  and are never read. This computation may overlap Seed(0) copies.
                publish: >-
                  Operands is the CTA barrier after prepare; it publishes all
                  prepared token arrays but does not replace the asynchronous-copy
                  completion wait. Readouts is the final CTA barrier after all
                  chunks and token loops; it makes all Rb columns readable by the
                  token warps. Both barriers include all eight warps, including
                  those that have no token in preparation or output.
                wait: >-
                  Seed(c) executes the asynchronous-copy wait-all for each thread,
                  then a CTA barrier. Done guarantees all of Seed(c) is readable.
                  For c>0 the same barrier also joins all previous chunk work:
                  every reader of Seed(c-1) has finished before Next(c) can overwrite
                  its slot with Seed(c+1). The first wait has no old slot readers.
                  This is the source's actual wait/barrier, not an added fence.
                load: >-
                  Carry(c) reads all Seed(c) rows into CarryBlock, initializing
                  their math_reshape Carry values at j=-1. Every warp owns four
                  rows and each lane owns four contiguous key coordinates of each
                  row, giving sixteen FP32 carried values per thread. No further
                  reads of that shared state chunk occur after this load.
                  TokenQK(c,j) reads Qn/Kn for j into Qfrag/Kfrag; each of eight
                  warps receives a full Dk-vector pair, distributed over its lanes,
                  and reuses it for its four value rows before the next token load.
                advance: >-
                  Carry(c,j) consumes CarryBlock, TokenQK, Gd[j], Gb[j] and the
                  current Bv values of Vb. It executes math_reshape.recurrent for
                  those rows, replacing CarryBlock with the updated FP32 state.
                  Paired reductions cover each row's Dk entries within its warp;
                  lane zero writes each BF16 Rb[j,v]. Done ends these register and
                  shared operand reads. No CTA barrier is inserted between tokens.
                store: >-
                  State(c,j) reads the updated CarryBlock and issues FP32 checkpoint
                  stores for the same Bv rows exactly when state_indices[r,j]>0;
                  a zero destination is a no-op and does not reset Carry. Done
                  means register operands have been consumed, allowing the next
                  token update; global writes may still be in flight. Kernel
                  completion provides external visibility. An aliased source slot
                  is safe because Seed(c) was copied and loaded before these writes,
                  while Next(c) reads disjoint rows; other workers have distinct
                  positive slots or disjoint value heads under the Contract.
                produce: >-
                  Y executes math_reshape.output within each token warp j<L_r:
                  load and widen the complete Rb[j,:] into OutputRows registers,
                  retain those four values per lane through the scalar xor RMS
                  reduction, then use Rstd, output_gate and norm_weight to issue
                  gated BF16 output stores. Rstd is replicated across the token's
                  lanes. Token warps progress independently, with no intervening
                  CTA barrier; unused token warps do nothing. Rb has no later readers.
                  Done ends use of these local registers; global-store visibility
                  follows main.kernel_done. All copies were already waited by the
                  last chunk entry. This worker has no next worktile, and its local
                  resources end with the kernel; future calls rebuild them and
                  consume only caller state after normal stream ordering. No
                  host synchronization or cross-CTA barrier is introduced.
            pipe:
              steady:
                - "classify:Request"
                - repeat: {active: [0, Active_r]}
                  steady:
                    - "prefetch:Seed(0)"
                    - "prepare:Operands"
                    - "publish:Operands"
                    - repeat: c
                      steady:
                        - "wait:Seed(c)"
                        - "prefetch:Next(c)"
                        - "load:Carry(c)"
                        - repeat: j
                          steady:
                            - "load:TokenQK(c,j)"
                            - "advance:Carry(c,j)"
                            - "store:State(c,j)"
                    - "publish:Readouts"
                    - "produce:Y"
            waits_for:
              data:
                "wait:Seed(0)@done": ["prefetch:Seed(0)@done"]
                "wait:Seed(c+1)@done": ["prefetch:Next(c)@done"]
realization:
  require:
    - item: ["design.tile_pipeline::main.StateRing", "design.tile_pipeline::main.Main.prefetch", "design.tile_pipeline::main.Main.wait"]
      choice: >-
        Bind the source-state transfer to cp.async.cg.shared.global with 16-byte
        copies and cp.async.commit_group; bind the per-chunk completion to
        cp.async.wait_all followed by __syncthreads across the whole CTA.
        FP32 state.data_ptr() is 16-byte aligned and state.stride(0)%4==0,
        as enforced by the existing host check; preserve this rejection behavior.
      reason: >-
        The ring's asynchronous publication and reuse depend on both per-thread
        copy completion and a CTA join before collective reads or slot overwrite.
        The source copy and float4 accesses require aligned chunk addresses;
        a CTA barrier alone does not complete pending copies. Binding is from
        KernelSchema@c3fc7a029476ba448d6378aad4d5323d24a476ee:kernel_wiki/aka-cuda-operators-20261030/operators/linear_attention/gdn_postconv_mtp_bf16_state_fp32/candidate/kernel.cuh::copy_state_chunk
        and the checks in candidate/launch.cu. This is an implementation coverage
        limitation, not permission to narrow the shared Contract.
    - item: "design.tile_pipeline::main.Main.publish"
      choice: >-
        Use the source's whole-CTA __syncthreads publication after operand
        preparation and after the last chunk, with every warp participating.
      reason: >-
        Preparation and output use token warps, whereas recurrence uses value-row
        warps. The consumer warp of a shared value can differ from its producer;
        local warp ordering cannot provide these two cross-warp publications.
  prefer:
    - item: ["design.math_reshape::boundary", "design.math_reshape::recurrent"]
      choice: >-
        Use the candidate's mul.rn.ftz.f32x2, fma.rn.ftz.f32x2 and
        add.rn.ftz.f32x2 for already independent pairs in state scaling,
        update, dot partial sums and paired reductions. Preserve each component's
        existing operation order, fusion and FTZ behavior.
      reason: >-
        Each paired arithmetic instruction represents two independent FP32
        operations, reducing the explicit arithmetic instruction count relative
        to issuing two matching scalar operations. No latency, throughput or
        measured speedup is inferred. These exact operations occur in
        KernelSchema@c3fc7a029476ba448d6378aad4d5323d24a476ee:kernel_wiki/aka-cuda-operators-20261030/operators/linear_attention/gdn_postconv_mtp_bf16_state_fp32/candidate/kernel.cuh::state_fma_pair
        and warp_reduce_sum_pair; instruction packing itself is not a semantic
        requirement beyond the math_reshape precision and grouping rules.
