[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelschema"
version = "0.1.0"
description = "KernelSchema workflow contracts and source-checkout tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
kernelschema = "kernelschema.cli:main"

[tool.setuptools.packages.find]
include = ["kernelschema*"]

[tool.pytest.ini_options]
testpaths = ["tests/workflows"]
