[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelschema"
version = "0.1.0"
description = "Kernel Schema design, implementation, optimization and source-checkout tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
implement = ["atrex-gateway-client>=0.14.37"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["schema_design/tools/tests", "schema_optimize/tools/tests", "schema_implement/tools/tests", "schema_workflow/tools/tests"]
