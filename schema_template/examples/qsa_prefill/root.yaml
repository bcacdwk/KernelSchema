META_DATA:
  Name: paged_sparse_grouped_query_attention
  Describe: Compute selected paged attention, round the attention result, and apply an elementwise sigmoid gate
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/qsa_prefill/aka_solution/solution.py::Model.forward
  Version: 11
  Dispatch:
    when: Serialized eager calls on one current CUDA stream; shared workspace consumers finish before reuse
CONTRACT:
  Algorithm_requirement:
    Constant:
      rows: {value: 4096, meaning: CP-local query rows}
      queryheads: {value: 24, meaning: Query head count}
      kvheads: {value: 2, meaning: KV head count}
      d: {value: 256, meaning: Query and value dimension}
      pagesize: {value: 128, meaning: Tokens per physical cache page}
      cachepages: {value: 2626, meaning: Physical cache page count}
      tablewidth: {value: 2054, meaning: Logical page-table width}
      selectedwidth: {value: 2051, meaning: Selection slots before the valid-count word}
      groupsize: {value: queryheads/kvheads, meaning: Query heads sharing one KV head}
      scale: {value: 1/sqrt(d), meaning: Attention score scale}
    Input:
      q: {meaning: Query rows, shape: [{row: rows}, {head: queryheads}, {d: d}], dtype: bf16}
      k_cache: {meaning: Paged keys, shape: [{page: cachepages}, {page_token: pagesize}, {kv_head: kvheads}, {d: d}], dtype: bf16, range: 'Mapped pages are finite; other storage may contain arbitrary BF16 bits, including NaN and infinity.'}
      v_cache: {meaning: Paged values, shape: [{page: cachepages}, {page_token: pagesize}, {kv_head: kvheads}, {d: d}], dtype: bf16, range: 'Mapped pages are finite; other storage may contain arbitrary BF16 bits, including NaN and infinity.'}
      logical_indices: {meaning: Packed token IDs and trailing valid count, shape: [{row: rows}, {packed: selectedwidth+1}], dtype: int32, range: Fitted step-15 draws; the packed selection law in Compute applies}
      block_table: {meaning: Request-to-physical-page lookup, shape: [{request: 1}, {logical_page: tablewidth}], dtype: int32, range: 'block_table[0,p]=1352+p for 0<=p<1024; -1 otherwise.'}
      token_to_req: {meaning: Request owning each row, shape: [{row: rows}], dtype: int32, range: [0, 0]}
      use_prefill_config: {meaning: Ignored configuration hint, shape: [], dtype: bool}
      output_gate: {meaning: Elementwise sigmoid logits, shape: [{row: rows}, {head: queryheads}, {d: d}], dtype: bf16}
      out: {meaning: Optional destination; initial contents are ignored, shape: [{row: rows}, {head: queryheads}, {d: d}], dtype: bf16, nullable: true, range: 'Arbitrary BF16 bits, including NaN and infinity.', default: None}
    Output: {o: {meaning: Written to out and returned as the same tensor, shape: [{row: rows}, {head: queryheads}, {d: d}], dtype: bf16}}
    Compute:
      - Name: Selection domain
        Math: |
          Fitted selections follow KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/qsa_prefill/input.py::_fitted_step15_indices with integer 0<=index_seed<2^62.
          One invocation-wide CP rank rho is in {0,1}; c_r=floor((15*8192+rho*rows+r+1)/4), t_r=(r+1)%4.
          The first 2048 entries are 512 quads 4*g+[0,1,2,3] with distinct 0<=g<c_r.
          Entries 2048+l equal 4*c_r+l for 0<=l<t_r; remaining selection slots are -1; the last word is 2048+t_r.
      - Name: Selected gated attention
        Math: |-
          If out is None, allocate a destination matching q; otherwise use the supplied destination.
          K/V share element strides [2157376,512,256,1]; v_cache starts 65536 elements after k_cache.
          For independent row r and head h, v=floor(h/groupsize), valid_slots(r)={0,...,logical_indices[r,selectedwidth]-1}.
          For j in valid_slots(r), k=logical_indices[r,j], page=block_table[0,floor(k/pagesize)], offset=k%pagesize.
          keys_j=k_cache[page,offset,v,:], values_j=v_cache[page,offset,v,:]; score[j]=scale*sum_{z=0}^{d-1} q[r,h,z]*keys_j[z].
          peak=max_{j in valid_slots(r)} score[j]; denom=sum_{j in valid_slots(r)} exp(score[j]-peak).
          attention[r,h,z]=bf16(sum_{j in valid_slots(r)} exp(score[j]-peak)*values_j[z]/denom).
          o[r,h,z]=bf16(attention[r,h,z]/(1+exp(-output_gate[r,h,z]))).
          The selection supplies causality; add no further mask. Write every out element; other inputs remain unchanged.
          The callable covers selected attention, gating and destination allocation; input construction is excluded.
        Symbol:
          valid_slots: {meaning: Valid selection-slot indices of a row, shape: not_applicable, dtype: not_applicable}
          attention: {meaning: Attention result rounded before gating, shape: 'ref:o.shape', dtype: bf16}
    Golden_reference:
      Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/qsa_prefill/reference.py::Model.forward
      Tolerance:
        o: FP64 finite x,g; abs(x-g)<=3.2e-5+.02*abs(x) elementwise for returned o and out; no L2 gate
  Hardware_specification:
    Device: NVIDIA L20D
    Architecture: SM103
    Execution:
      warp: 32 SIMT threads within one CTA
      cta: Warps co-resident on one SM with shared memory and barriers
      cluster: CTAs co-scheduled within one GPC with cluster synchronization
    Feature:
      smem: CTA-lifetime shared storage; cluster peers can address it while its owner remains alive
      tmem: Explicitly allocated Tensor Core storage separate from SMEM
      register: Thread-private registers in the SM register file
      asynchronous_execution: Transfers and MMA require primitive-specific completion and visibility guarantees
    Stack:
      Language: CuTe DSL 4.6.1
      Toolchain: CuTe DSL 4.6.1 bundled compiler; CUDA 13.0; cuda-python 13.1.1; torch 2.9.0+cu130
    Wiki:
      Hardware: <wiki-hardware@pending:L20D/SM103.md>
      Programming:
        Language: <wiki-language@pending:CuTe-DSL/4.6.1/>
        Virtual_ISA: <wiki-virtual-isa@pending:PTX/pending/>
        Machine_ISA: <wiki-machine-isa@pending:SASS/SM103/>
      Microbench: <wiki-microbench@pending:L20D/>
      Sota:
        Kernel: <wiki-sota-kernel@pending:L20D/>
        Schema: <wiki-sota-schema@pending:L20D/>
      Profile: <wiki-profile@pending:NVIDIA/>
DESIGN:
  Math_reshape:
    Thesis: Share sparse group unions across nearby queries; split denominator work and retain streaming numerators, trading masked products for fewer KV gathers
    Rewrite:
      - Name: union
        Math: |-
          0<=b<ceil_div(rows,br), 0<=v<kvheads; rb={r | b*br<=r<min((b+1)*br,rows)}; max_entries=br*(floor(selectedwidth/4)+1).
          union(b) has one (0,g,lo,hi) per distinct g=floor(logical_indices[r,j]/4), r in rb, j in valid_slots(r), in unspecified order.
          Bit 4*(r-b*br)+l of concatenated lo/hi is 1 iff row r selects 4*g+l; lo holds bits 0:32, hi bits 32:64.
          union_count(b)=count(union(b)); uniontiles(b)=ceil_div(union_count(b),etile)>=32.
          x=groupsize*(r-b*br)+h; qblk[x,:]=q[r,v*groupsize+h,:] for r in rb, 0<=h<groupsize; other rows retain unspecified values.
          For 0<=i<uniontiles(b), 0<=u<bk, e=i*etile+floor(u/4), src=e if e<union_count(b) else 0, k=4*union(b)[src,1]+u%4.
          page=block_table[0,floor(k/pagesize)]; kblk(i)[u,:]=k_cache[page,k%pagesize,v,:]; vblk(i)[u,:]=v_cache[page,k%pagesize,v,:].
          selected(x,i,u) is the corresponding membership bit if x<groupsize*count(rb) and e<union_count(b), otherwise false.
        Symbol:
          br: {meaning: Query rows sharing one union, binding: 'bind:DESIGN.Work_schedule::br'}
          etile: {meaning: union entries per iteration, binding: 'bind:DESIGN.Work_schedule::etile'}
          bk: {meaning: Token columns per iteration, binding: 'bind:DESIGN.Work_schedule::bk'}
          m: {meaning: Packed query capacity, binding: 'bind:DESIGN.Work_schedule::m'}
          union: {meaning: Compacted request/group/membership entries., shape: [{entry: max_entries}, {word: 4}], dtype: int32, retention: keep_value (b)}
          qblk: {meaning: Packed query/head rows., shape: [{packed_query: m}, {d: d}], dtype: bf16}
          kblk: {meaning: Gathered union keys, shape: [{kv: bk}, {d: d}], dtype: bf16}
          vblk: {meaning: Gathered union values, shape: [{kv: bk}, {d: d}], dtype: bf16}
          uniontiles: {meaning: union tile count for row block b}
          selected: {meaning: Membership mask for packed row and gathered token}
          union_count: {meaning: Live union entry count, shape: [], dtype: int32, retention: keep_value (b)}
        Ledger:
          Baseline: Separate selected KV gathers for each query row
          Gain: Share each union group across the row block
          Cost: Masked and padded products plus one hash preprocessing pass
      - Name: Online
        Math: |
          For each (b,v), c=scale*log2(e); mref(-1)[x]=-inf and l(-1)[w,x]=0 for w in {0,1}, 0<=x<m.
          For 0<=i<uniontiles(b), s(i)=mm32(qblk,kblk(i)ᵀ); vmax(i,x)=c*max_{0<=u<bk} s(i)[x,u].
          first(i,x)=(mref(i-1)[x]==-inf); drift(i,x)=0 if first(i,x), otherwise vmax(i,x)-mref(i-1)[x].
          move_ref(i,x)=any_{x' in rescale_peer(x)}(drift(i,x')>tau).
          mref(i)[x]=vmax(i,x) if first(i,x) or move_ref(i,x), otherwise mref(i-1)[x].
          alpha(i,x)=exp2_fast(mref(i-1)[x]-mref(i)[x]) if move_ref(i,x), otherwise 1.
          f(i)[x,u]=exp2_fast(c*s(i)[x,u]-mref(i)[x]); E(i)[x,u]=f(i)[x,u] if selected(x,i,u), otherwise 0.
          p(i)=bf16(E(i)); p_a(i)=p(i)[:,0:bk/2], p_b(i)=p(i)[:,bk/2:bk].
          l(i)[w,x]=alpha(i,x)*l(i-1)[w,x]+sum32_{w*bk/2<=u<(w+1)*bk/2} E(i)[x,u].
          y(0)=mm32(p(0),vblk(0)); for i>0, y(i)=mma32(p(i),vblk(i),alpha(i)[:,None] ⊙ y(i-1)).
        Symbol:
          tau: {meaning: Base-two reference-update threshold, value: 8.0}
          rescale_peer: {meaning: Packed rows sharing a correction vote, binding: 'bind:DESIGN.Tile_pipeline::rescale_peer'}
          s: {meaning: Unmasked QK scores, shape: [{packed_query: m}, {kv: bk}], dtype: fp32}
          p: {meaning: Rounded numerator weights, shape: [{packed_query: m}, {kv: bk}], dtype: bf16}
          p_a: {meaning: First column half of P., shape: [{packed_query: m}, {kv: bk/2}], dtype: bf16}
          p_b: {meaning: Second column half of P., shape: [{packed_query: m}, {kv: bk/2}], dtype: bf16}
          l: {meaning: Separate FP32 half-denominators, shape: [{half: 2}, {packed_query: m}], dtype: fp32, retention: 'carry_forward (b,v); i=-1..uniontiles(b)-1'}
          y: {meaning: Unnormalized numerator, shape: [{packed_query: m}, {d: d}], dtype: fp32, retention: 'carry_forward (b,v); i=0..uniontiles(b)-1'}
          mref: {meaning: Common reference replicated by the two halves, shape: [{packed_query: m}], dtype: fp32, retention: 'carry_forward (b,v); i=-1..uniontiles(b)-1'}
        Arithmetic:
          Approx: 'exp2_fast is approximate FP32 exp2 with fastmath=True; unknown: no error bound is supplied'
        Ledger:
          Baseline: Materialized FP32 scores and probabilities
          Gain: Remove their global round trips
          Cost: BF16 PV weights, split reductions, reordered entries and approximate exponentials
      - Name: Gate
        Math: |
          ell[x]=l(uniontiles(b)-1)[0,x]+l(uniontiles(b)-1)[1,x]; inv[x]=rcp_fast(ell[x]) if ell[x]!=0, otherwise 0.
          For r in rb, 0<=h<groupsize, x=groupsize*(r-b*br)+h, attention[r,v*groupsize+h,z]=bf16(y(uniontiles(b)-1)[x,z]*inv[x]) if ell[x]!=0, otherwise 0.
          sig=1/(1+exp2_fast(-output_gate[r,v*groupsize+h,z]*log2(e))); o[r,v*groupsize+h,z]=bf16(attention[r,v*groupsize+h,z]*sig).
        Arithmetic:
          Approx: 'exp2_fast follows Online; rcp_fast uses FP32 rcp_approx for nonzero denominators; unknown: no reciprocal error bound is supplied'
  Work_schedule:
    Thesis: Preprocess shared unions, then dynamically balance row-block/head traversals while retaining CTA buffers across worktiles
    Step:
      PREPROCESS:
        Describe: Build one union per consecutive query-row block
        Decomposition:
          Strategy: br=10.
          Partition: {row: {meaning: Consecutive query rows, size: rows, tile: br}}
          Worktile:
            Invariant:
              logical_indices: {meaning: Packed row selections, shape: [{row: br}, {packed: selectedwidth+1}], dtype: int32}
              token_to_req: {meaning: Request owners, shape: [{row: br}], dtype: int32}
              block_table: {meaning: Page lookup, shape: [{request: 1}, {logical_page: tablewidth}], dtype: int32}
          Target:
            Single_tile:
              union: {meaning: Shared group membership, shape: [{entry: max_entries}, {word: 4}], dtype: int32}
              union_count: {meaning: Number of union entries, shape: [], dtype: int32}
        Mapping:
          Worker: {unit: cta, unit_count: 1}
          Worker_count: worktile_count
        Schedule:
          Strategy: Current-stream inputs; reuse cached union/count only after prior ATTENTION consumers finish. Rewrite every live entry
          Worktile_order: [{by: row, direction: ascending}]
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
      ATTENTION:
        Describe: Keep one row-block/KV-head union traversal and all its grouped outputs inside one worktile.
        Decomposition:
          Strategy: m=128; etile=16; bk=4*etile; tile_count(t)=uniontiles(b(t)), with b(t) decoded from the accepted ticket
          Partition:
            row: {meaning: Consecutive query rows, size: rows, tile: br}
            kv_head: {meaning: Independent KV head, size: kvheads, tile: 1}
          Worktile:
            Invariant:
              qblk: {meaning: Queries sharing a union, shape: [{packed_query: m}, {d: d}], dtype: bf16}
              output_gate: {meaning: Gate for this output block, shape: [{row: br}, {head: groupsize}, {d: d}], dtype: bf16}
              union_count: {meaning: union length, shape: [], dtype: int32}
            Iteration:
              union: {meaning: Compacted group membership, shape: [{entry: etile}, {word: 4}], dtype: int32, direction: ascending}
              kblk: {meaning: union key payload, shape: [{kv: bk}, {d: d}], dtype: bf16, direction: ascending}
              vblk: {meaning: union value payload, shape: [{kv: bk}, {d: d}], dtype: bf16, direction: ascending}
          Target:
            Single_tile: {o: {meaning: Gated attention rows, shape: [{row: br}, {head: groupsize}, {d: d}], dtype: bf16}}
        Mapping:
          Strategy: sm_count is the current device multiprocessor count
          Worker: {unit: cta, unit_count: 1}
          Worker_count: max(1,min(sm_count,worktile_count))
        Schedule:
          Strategy: Device counter and host base start at zero; host reserves worktile_count+worker_count tickets per submit; passed base wraps to int32
          Worktile_order:
            - {by: row, direction: descending}
            - {by: kv_head, direction: ascending}
          Worker_assignment:
            Refill: {atomic_counter: 'Claim u=ticket-base; b=ceil_div(rows,br)-1-floor(u/2),v=u%2. terminal_done means terminal acknowledged, work complete and in-flight accesses drained'}
            Exit: terminal_done
    Flow:
      Launch:
        - {step: [PREPROCESS]}
        - {step: [ATTENTION], start_after: PREPROCESS.kernel_done}
      Handoff:
        union: {producer: PREPROCESS, consumer: [ATTENTION], storage: global}
        union_count: {producer: PREPROCESS, consumer: [ATTENTION], storage: global}
  Tile_pipeline:
    Thesis: Column-split softmax overlaps three leading QKs with PV; two-slot gathers cross worktiles, while next-Q copy overlaps output drain and the next first PV awaits both Y releases
    Step:
      PREPROCESS:
        Storage:
          hash: {meaning: Open-addressed keys and membership masks, depth: 1, location: smem, shape: [{word: 3}, {slot: 16384}],
            dtype: int32, total_size: 196608}
          rowheader: {meaning: Valid counts and request IDs, depth: 1, location: smem, shape: [{row: br}, {word: 2}],
            dtype: int32, total_size: 8*br}
          pagetable: {meaning: Request-zero page table, depth: 1, location: smem, shape: [{logical_page: tablewidth}],
            dtype: int32, total_size: 4*tablewidth}
          compactcount: {meaning: Warp output reservations, depth: 1, location: smem, shape: [],
            dtype: int32, total_size: 4}
          quadlookahead: {meaning: Current and next packed index quad per thread, depth: 1, location: register, shape: [{thread: 512}, {quad: 2}, {word: 4}],
            dtype: int32, total_size: 16384}
        Role:
          MAIN:
            Info:
              Describe: Clear hash/count, cache row headers and request-zero page table; rendezvous before insertion and compaction
              Member: warp[0:16]
              Using_verb:
                compute:
                  hash: {execution_mode: serial, describe: 'From logical_indices via quadlookahead, filter validity; CAS linear-probe keys and OR membership by every inserter. Mixed quads insert per lane'}
                  unioncount: {execution_mode: serial, describe: 'From hash, warp-prefix ranks reserve compactcount intervals; write global union, rendezvous, write union_count. Warp reservation order varies'}
            Pipe:
              - compute:hash
              - compute:unioncount
      ATTENTION:
        Index:
          t: {meaning: Worker-local accepted work ordinal, definition: worktile}
          i: {meaning: union tile within accepted work, definition: [0, tile_count(t)]}
          n: {meaning: Continuous union tile ordinal, definition: {flatten: [t, i]}}
        Storage:
          ticket: {meaning: One published work ticket, depth: 1, location: smem, shape: [],
            dtype: int32, total_size: 4}
          qblk: {meaning: Unwritten padding participates in correction votes, depth: 1, location: smem, shape: [{packed_query: m}, {d: d}],
            dtype: bf16, total_size: 2*m*d}
          keyring: {meaning: Cross-worktile key staging, depth: 2, location: smem, shape: [{kv: bk}, {d: d}],
            dtype: bf16, total_size: 4*bk*d, view: {kblk(n): {slot_index: n%2}}}
          valuering: {meaning: Cross-worktile value staging, depth: 2, location: smem, shape: [{kv: bk}, {d: d}],
            dtype: bf16, total_size: 4*bk*d, view: {vblk(n): {slot_index: n%2}}}
          accumulator: {meaning: Aliased S/P stages and persistent numerator, depth: 1, location: tmem, shape: [{row: m}, {column: 512}],
            dtype: fp32, total_size: 4*m*512, view: {s(n): {region: {column: [bk*(n%3), bk*(n%3+1)]}}, p(n): {region: {column: [bk*(n%3), bk*(n%3)+bk/2]}}, y: {region: {column: [3*bk, 3*bk+d]}}}}
          halfmax: {meaning: Peer maxima; overwrite safety unestablished, depth: 1, location: smem, shape: [{half: 2}, {packed_query: m}],
            dtype: fp32, total_size: 8*m}
          halfsum: {meaning: Exchanged denominators, depth: 1, location: smem, shape: [{half: 2}, {packed_query: m}],
            dtype: fp32, total_size: 8*m}
          reference: {meaning: Replicated lagged references, depth: 1, location: register, shape: [{half: 2}, {packed_query: m}],
            dtype: fp32, total_size: 8*m, view: {mref: {}}}
          l: {meaning: Carried half-denominators, depth: 1, location: register, shape: [{half: 2}, {packed_query: m}],
            dtype: fp32, total_size: 8*m}
          scorecopy: {meaning: Captured scores overwritten by unrounded weights, depth: 1, location: register, shape: [{packed_query: m}, {kv: bk}],
            dtype: fp32, total_size: 4*m*bk}
          weightcopy: {meaning: Rounded weights pending TMEM publication, depth: 1, location: register, shape: [{packed_query: m}, {kv: bk}],
            dtype: bf16, total_size: 2*m*bk}
          masklookahead: {meaning: Current mask and next raw membership words, depth: 1, location: register, shape: [{half: 2}, {packed_query: m}, {word: 9}],
            dtype: int32, total_size: 72*m}
          outputcopy: {meaning: One output strip per column half, depth: 1, location: register, shape: [{half: 2}, {packed_query: m}, {column: 32}],
            dtype: fp32, total_size: 256*m}
          addresslookahead: {meaning: Per-gather-lane union words and next physical page, depth: 1, location: register, shape: [{gather: 2}, {lane: 32}, {word: 5}],
            dtype: int32, total_size: 1280}
          normalization: {meaning: Retained output normalization factors, depth: 1, location: register, shape: [{half: 2}, {packed_query: m}],
            dtype: fp32, total_size: 8*m, view: {inv: {}}}
        Role:
          SCHEDULER:
            Info:
              Describe: Claim and publish work with one-ticket lookahead
              Member: warp[11:12]
              Using_verb:
                compute:
                  initialticket: {execution_mode: serial, describe: 'Atomically claim from the cached global counter, subtract tbase, write Ticket and notify all eleven consumer warps'}
                  nextticket: {execution_mode: serial, describe: Claim and publish the next Ticket as initialticket; nextticket(t) includes the terminal ticket}
                await:
                  initialtaken: {execution_mode: serial, describe: Join all consumer copies and acknowledgements of initialticket}
                  nexttaken: {execution_mode: serial, describe: Join all consumer acknowledgements before another claim; retire the acknowledged terminal ticket}
            Pipe:
              - compute:initialticket
              - await:initialtaken
              - for(t):
                  - compute:nextticket(t)
                  - await:nexttaken(t)
            Waiting:
              Allowed:
                - '{done await:initialtaken} ← [{done GATHER_K::load:initialticket}, {done GATHER_V::load:initialticket}, {done MMA::load:initialticket}, {done SOFTMAX_A::load:initialticket}, {done SOFTMAX_B::load:initialticket}]'
                - '{done await:nexttaken(t)} ← [{done GATHER_K::load:nextticket(t)}, {done GATHER_V::load:nextticket(t)}, {done MMA::load:nextticket(t)}, {done SOFTMAX_A::load:nextticket(t)}, {done SOFTMAX_B::load:nextticket(t)}]'
          GATHER_K:
            Info:
              Describe: 'Addresslookahead primes per worktile: union words two tiles ahead, page lookup one ahead, clamped to last tile; last_loaded starts at -1'
              Member: warp[9:10]
              Using_verb:
                load:
                  initialticket: {execution_mode: serial, describe: 'Copy SCHEDULER initialticket from ticket and acknowledge; decode b,v; terminal starts no work; initialize last_loaded=-1'}
                  nextticket: {execution_mode: serial, describe: Copy SCHEDULER nextticket(t) from ticket and acknowledge; bind has_next(t) and next coordinates from it; terminal starts no work}
                  kblk: {execution_mode: async_unordered, describe: Gather k_cache via union/block_table into keyring; set last_loaded=n. Dead entries repeat entry zero; done includes delayed shared publication}
                  workcount: {execution_mode: serial, describe: Read global union_count for the accepted b; bind tile_count(t) for this work}
                await: {drain: {execution_mode: serial, describe: 'After the terminal ticket, finish and publish the last outstanding copy; last_loaded is the final issued continuous tile ordinal'}}
            Pipe:
              - load:initialticket
              - for(t):
                  - load:workcount(t)
                  - for(n[t]):
                      - load:kblk(n)
                  - load:nextticket(t)
              - if(last_loaded >= 0):
                  - await:drain
            Waiting:
              Prepared:
                - '{issue load:initialticket} ← [{done SCHEDULER::compute:initialticket}]'
                - '{issue load:nextticket(t)} ← [{done SCHEDULER::compute:nextticket(t)}]'
              Released: ['{issue load:kblk(n+2)} ← [{done MMA::matmul:qblk(t)@kblk(n)}]']
              Allowed:
                - '{done load:kblk(n)} ← [{issue load:kblk(n+1)}]'
                - '{done load:kblk(last_loaded)} ← [{issue await:drain}]'
                - '{done await:drain} ← [{done load:kblk(last_loaded)}]'
          GATHER_V:
            Info:
              Describe: 'Addresslookahead primes per worktile: union words two tiles ahead, page lookup one ahead, clamped to last tile; last_loaded starts at -1'
              Member: warp[10:11]
              Using_verb:
                load:
                  initialticket: {execution_mode: serial, describe: 'Copy SCHEDULER initialticket from ticket and acknowledge; decode b,v; terminal starts no work; initialize last_loaded=-1'}
                  nextticket: {execution_mode: serial, describe: Copy SCHEDULER nextticket(t) from ticket and acknowledge; bind has_next(t) and next coordinates from it; terminal starts no work}
                  vblk: {execution_mode: async_unordered, describe: Gather v_cache via union/block_table into valuering; set last_loaded=n. Dead entries repeat entry zero; done includes delayed shared publication}
                  workcount: {execution_mode: serial, describe: Read global union_count for the accepted b; bind tile_count(t) for this work}
                await: {drain: {execution_mode: serial, describe: 'After the terminal ticket, finish and publish the last outstanding copy; last_loaded is the final issued continuous tile ordinal'}}
            Pipe:
              - load:initialticket
              - for(t):
                  - load:workcount(t)
                  - for(n[t]):
                      - load:vblk(n)
                  - load:nextticket(t)
              - if(last_loaded >= 0):
                  - await:drain
            Waiting:
              Prepared:
                - '{issue load:initialticket} ← [{done SCHEDULER::compute:initialticket}]'
                - '{issue load:nextticket(t)} ← [{done SCHEDULER::compute:nextticket(t)}]'
              Released: ['{issue load:vblk(n+2)} ← [{done MMA::matmul:p(n)@vblk(n)}]']
              Allowed:
                - '{done load:vblk(n)} ← [{issue load:vblk(n+1)}]'
                - '{done load:vblk(last_loaded)} ← [{issue await:drain}]'
                - '{done await:drain} ← [{done load:vblk(last_loaded)}]'
          MMA:
            Info:
              Describe: Issue QK ahead of PV on one cumulative completion queue
              Member: warp[8:9]
              Using_verb:
                matmul:
                  qblk@kblk: {execution_mode: async_ordered, describe: Read qblk and keyring into accumulator s(n); completion covers operand reads before later products overwrite aliased S/P}
                  p@vblk: {execution_mode: async_ordered, describe: 'Read accumulator p(n) and valuering vblk(n); overwrite y on first tile, else add to corrected y; done releases P/V and makes y quiescent'}
                load:
                  initialticket: {execution_mode: serial, describe: 'Copy SCHEDULER initialticket from ticket and acknowledge; decode b,v; terminal starts no work'}
                  nextticket: {execution_mode: serial, describe: Copy SCHEDULER nextticket(t) from ticket and acknowledge; bind has_next(t) and next coordinates from it; terminal starts no work}
                  workcount: {execution_mode: serial, describe: Read global union_count for the accepted b; bind tile_count(t) for this work}
                await:
                  initialq: {execution_mode: serial, describe: 'Await SOFTMAX_A initial Q publication, including when initialticket is terminal'}
                  workq: {execution_mode: serial, describe: Await SOFTMAX_A nextq(t-1) before setting up this work}
            Pipe:
              - load:initialticket
              - await:initialq
              - for(t):
                  - if(t > 0):
                      - await:workq(t)
                  - load:workcount(t)
                  - for(j=0:tile_count(t)+2):
                      - if(j < tile_count(t)):
                          - matmul:qblk(t)@kblk(n[t,j])
                      - if(j >= 2):
                          - matmul:p(n[t,j-2])@vblk(n[t,j-2])
                  - load:nextticket(t)
            Waiting:
              Prepared:
                - '{issue load:initialticket} ← [{done SCHEDULER::compute:initialticket}]'
                - '{issue load:nextticket(t)} ← [{done SCHEDULER::compute:nextticket(t)}]'
                - '{done await:initialq} ← [{done SOFTMAX_A::load:initialq}]'
                - '{issue matmul:qblk(t)@kblk(n)} ← [{done GATHER_K::load:kblk(n)}]'
                - '{issue matmul:qblk(t)@kblk(n[t,i])} ← [{done SOFTMAX_A::signal:nextq(t-1)}]'
                - '{issue matmul:p(n)@vblk(n)} ← [{done SOFTMAX_A::compute:p(n)}, {done SOFTMAX_B::compute:p(n)}, {done GATHER_V::load:vblk(n)}]'
                - '{done await:workq(t)} ← [{done SOFTMAX_A::signal:nextq(t-1)}]'
              Released: ['{issue matmul:p(n[t,0])@vblk(n[t,0])} ← [{done SOFTMAX_A::release:y(t-1)}, {done SOFTMAX_B::release:y(t-1)}]']
          SOFTMAX_A:
            Info:
              Describe: First S/P and Y column half; rescale_peer(x) is the aligned 32-row interval containing x; masklookahead prefetches membership
              Member: warp[0:4]
              Using_verb:
                compute:
                  halfmax: {execution_mode: serial, describe: Capture this S(n) half from accumulator into scorecopy and write its row maxima to halfmax}
                  weights: {execution_mode: serial, describe: 'From scorecopy/reference/peer halfmax, form Online weightcopy, alpha and tsum; correction(n)=any warp vote'}
                  p: {execution_mode: serial, describe: Update reference/l from Online alpha/tsum; copy weightcopy to p_a in accumulator p(n); notify MMA after TMEM visibility}
                  normalization: {execution_mode: serial, describe: Read peer halfsum; retain Gate inv in normalization}
                  outputprefix: {execution_mode: serial, describe: 'Read this Y half in accumulator through outputcopy strips; Gate/store all but the last strip to out, retaining the last before release'}
                  outputtail: {execution_mode: serial, describe: Apply Gate to the retained outputcopy strip using output_gate; write the final strip to out on real rows}
                  correction: {execution_mode: serial, describe: Use alpha from weights to rescale voting warps' Y rows across all d columns in accumulator; other rows remain unchanged}
                load:
                  initialticket: {execution_mode: serial, describe: 'Copy SCHEDULER initialticket from ticket and acknowledge; decode b,v; terminal starts no work'}
                  nextticket: {execution_mode: serial, describe: Copy SCHEDULER nextticket(t) from ticket and acknowledge; bind has_next(t) and next coordinates from it; terminal starts no work}
                  initialq: {execution_mode: serial, describe: 'Gather real q rows for min(ticket,worktile_count-1) into qblk and notify MMA, even on an initial terminal ticket; padding remains unwritten'}
                  nextq: {execution_mode: async_unordered, describe: Gather the next accepted worktile's real query rows into qblk; current final QK has retired}
                  workcount: {execution_mode: serial, describe: Read global union_count for the accepted b; bind tile_count(t) for this work}
                store: {halfsum: {execution_mode: serial, describe: Copy final l to this role's halfsum half}}
                await:
                  maxexchange: {execution_mode: serial, describe: Rendezvous after both halfmax writes and scorecopy captures}
                  correction: {execution_mode: serial, describe: Only voting warps await preceding PV completion before the Y read-modify-write}
                  nextq: {execution_mode: serial, describe: 'Complete load:nextq(t) and establish qblk shared visibility'}
                signal: {nextq: {execution_mode: serial, describe: Publish Q readiness to MMA after releasing this role's Y half; also notify on a terminal next ticket}}
                release: {y: {execution_mode: serial, describe: Notify MMA that this role has read all of its Y column half into registers}}
            Pipe:
              - load:initialticket
              - load:initialq
              - for(t):
                  - load:workcount(t)
                  - for(n[t]):
                      - compute:halfmax(n)
                      - await:maxexchange(n)
                      - compute:weights(n)
                      - if(i > 0 and correction(n) == 1):
                          - await:correction(n)
                      - if(correction(n) == 1):
                          - compute:correction(n)
                      - compute:p(n)
                  - load:nextticket(t)
                  - if(has_next(t) == 1):
                      - load:nextq(t)
                  - store:halfsum(t)
                  - compute:normalization(t)
                  - compute:outputprefix(t)
                  - release:y(t)
                  - if(has_next(t) == 1):
                      - await:nextq(t)
                  - signal:nextq(t)
                  - compute:outputtail(t)
            Waiting:
              Prepared:
                - '{issue load:initialticket} ← [{done SCHEDULER::compute:initialticket}]'
                - '{issue load:nextticket(t)} ← [{done SCHEDULER::compute:nextticket(t)}]'
                - '{issue compute:halfmax(n)} ← [{done MMA::matmul:qblk(t)@kblk(n)}]'
                - '{done await:maxexchange(n)} ← [{done SOFTMAX_B::compute:halfmax(n)}]'
                - '{issue compute:normalization(t)} ← [{done SOFTMAX_B::store:halfsum(t)}]'
                - '{issue compute:outputprefix(t)} ← [{done MMA::matmul:p(n[t,tile_count(t)-1])@vblk(n[t,tile_count(t)-1])}]'
                - '{done await:correction(n)} ← [{done MMA::matmul:p(n[t,i-1])@vblk(n[t,i-1])}]'
                - '{done await:nextq(t)} ← [{done load:nextq(t)}]'
          SOFTMAX_B:
            Info:
              Describe: Second column half of S/P and Y; prime union membership, prefetch next raw words in masklookahead, and pack on use
              Member: warp[4:8]
              Using_verb:
                compute:
                  halfmax: {execution_mode: serial, describe: Capture this S(n) half from accumulator into scorecopy and write its row maxima to halfmax}
                  weights: {execution_mode: serial, describe: 'From scorecopy/reference/peer halfmax, form Online weightcopy, alpha and tsum; correction(n)=any warp vote'}
                  p: {execution_mode: serial, describe: Update reference/l from Online alpha/tsum; copy weightcopy to p_b in accumulator p(n); notify MMA after TMEM visibility}
                  normalization: {execution_mode: serial, describe: Read peer halfsum; retain Gate inv in normalization}
                  outputprefix: {execution_mode: serial, describe: 'Read this Y half in accumulator through outputcopy strips; Gate/store all but the last strip to out, retaining the last before release'}
                  outputtail: {execution_mode: serial, describe: Apply Gate to the retained outputcopy strip using output_gate; write the final strip to out on real rows}
                load:
                  initialticket: {execution_mode: serial, describe: 'Copy SCHEDULER initialticket from ticket and acknowledge; decode b,v; terminal starts no work'}
                  nextticket: {execution_mode: serial, describe: Copy SCHEDULER nextticket(t) from ticket and acknowledge; bind has_next(t) and next coordinates from it; terminal starts no work}
                  workcount: {execution_mode: serial, describe: Read global union_count for the accepted b; bind tile_count(t) for this work}
                store: {halfsum: {execution_mode: serial, describe: Copy final l to this role's halfsum half}}
                await: {maxexchange: {execution_mode: serial, describe: Rendezvous after both halfmax writes and scorecopy captures}}
                release: {y: {execution_mode: serial, describe: Notify MMA that this role has read all of its Y column half into registers}}
            Pipe:
              - load:initialticket
              - for(t):
                  - load:workcount(t)
                  - for(n[t]):
                      - compute:halfmax(n)
                      - await:maxexchange(n)
                      - compute:weights(n)
                      - compute:p(n)
                  - load:nextticket(t)
                  - store:halfsum(t)
                  - compute:normalization(t)
                  - compute:outputprefix(t)
                  - release:y(t)
                  - compute:outputtail(t)
            Waiting:
              Prepared:
                - '{issue load:initialticket} ← [{done SCHEDULER::compute:initialticket}]'
                - '{issue load:nextticket(t)} ← [{done SCHEDULER::compute:nextticket(t)}]'
                - '{issue compute:halfmax(n)} ← [{done MMA::matmul:qblk(t)@kblk(n)}]'
                - '{done await:maxexchange(n)} ← [{done SOFTMAX_A::compute:halfmax(n)}]'
                - '{issue compute:normalization(t)} ← [{done SOFTMAX_A::store:halfsum(t)}]'
                - '{issue compute:outputprefix(t)} ← [{done MMA::matmul:p(n[t,tile_count(t)-1])@vblk(n[t,tile_count(t)-1])}]'
REALIZATION:
  Require:
    - Item: DESIGN.Tile_pipeline::ATTENTION.MMA
      Choice: Single-CTA tcgen05.mma, TMEM P operands and cumulative completion commits
      Reason: Preserve TMEM handoff and operand-read completion before aliased stage reuse
    - Item:
        - DESIGN.Tile_pipeline::ATTENTION.GATHER_K
        - DESIGN.Tile_pipeline::ATTENTION.GATHER_V
      Choice: cp.async commit with wait_group(1) for delayed publication and wait_group(0) for terminal drain; shared visibility fence
      Reason: Preserve cross-worktile two-slot copy publication
    - Item: DESIGN.Tile_pipeline::ATTENTION.SOFTMAX_A
      Choice: cp.async Q gather with wait_group(0), shared visibility fence and Q-ready notification
      Reason: Publish completed Q while output tail stores may remain
    - Item:
        - CONTRACT.Algorithm_requirement::logical_indices
        - CONTRACT.Algorithm_requirement::output_gate
        - CONTRACT.Algorithm_requirement::out
      Choice: Contiguous 16-byte-aligned logical_indices; gate/out final stride 1 and outer element strides divisible by 8
      Reason: Packed index and output transfers require vector-compatible addresses
    - Item: DESIGN.Work_schedule::ATTENTION
      Choice: Current-stream submissions with cached workspace and signed-int32 device ticket; host base advances by total units plus CTA count
      Reason: The ticket is never reset; captured replay lacks host base advancement
    - Item: DESIGN.Work_schedule::PREPROCESS
      Choice: Cache by device, row-block count and max_entries; allocate 4*ceil_div(rows,br)*max_entries+128 int32 workspace words plus per-block counts
      Reason: Tile-prefetched dead mask words stay allocated and are discarded by union_count masking
