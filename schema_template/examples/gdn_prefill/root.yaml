META_DATA:
  Name: gated_delta_rule_prefill
  Describe: Apply grouped-head gated delta updates to packed sequences and overwrite the supplied output and final-state buffers
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/gdn_prefill/aka_solution/solution.py::Model.forward
  Version: 9
  Dispatch:
    when: batch_count>1; fixed 64 value rows per CTA, dynamic sequence descriptors and separate recurrence notifications
CONTRACT:
  Algorithm_requirement:
    Constant:
      query_heads: {value: 4, meaning: Query and key head count}
      value_heads: {value: 32, meaning: Value and state head count}
      key_dim: {value: 128, meaning: Key dimension}
      value_dim: {value: 128, meaning: Value dimension}
      epsilon: {value: 1.0e-10, meaning: Additive stabilizer for linear decay}
    Input:
      q: {meaning: Unnormalized queries, shape: [{token: total_tokens}, {head: query_heads}, {key_dim: key_dim}], dtype: bf16, range: Generated distribution specified in Compute; no query normalization.}
      k: {meaning: Pre-normalized keys, shape: [{token: total_tokens}, {head: query_heads}, {key_dim: key_dim}], dtype: bf16, range: 'BF16 result of torch.nn.functional.normalize(p=2.0, dim=-1) on the BF16 generator output.'}
      v: {meaning: Values., shape: [{token: total_tokens}, {head: value_heads}, {value_dim: value_dim}], dtype: bf16}
      alpha: {meaning: Linear decay factors, shape: [{token: total_tokens}, {head: value_heads}], dtype: fp32, range: torch.rand uniform samples; 0 <= alpha < 1}
      beta: {meaning: Delta-update strengths, shape: [{token: total_tokens}, {head: value_heads}], dtype: fp32, range: torch.rand uniform samples; 0 <= beta < 1}
      initial_state: {meaning: Explicit incoming value-by-key state, shape: [{batch: batch_count}, {head: value_heads}, {value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32, range: All zeros or the final state of an independent 32-token reference prefix per sequence under the same input contract.}
      cu_seqlens: {meaning: Packed sequence boundaries, shape: [{boundary: batch_count+1}], dtype: int64, range: 'Starts at 0, strictly increases, ends at total_tokens; 1<=batch_count<=16 and total_tokens<=16384.'}
      scale: {meaning: Mandatory Python output multiplier, shape: [], dtype: fp64, range: 'Python binary64 1.0/math.sqrt(key_dim), equal to 0.08838834764831843; metadata lists the adjacent value 0.08838834764831845.'}
      output: {meaning: Preallocated output buffer, shape: [{token: total_tokens}, {head: value_heads}, {value_dim: value_dim}], dtype: bf16, range: Arbitrary contents including NaN; previous contents ignored.}
      output_state: {meaning: Preallocated final-state buffer, shape: [{batch: batch_count}, {head: value_heads}, {value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32, range: Arbitrary contents including NaN; previous contents ignored.}
    Output:
      o: {meaning: Returned alias of fully overwritten output, shape: [{token: total_tokens}, {head: value_heads}, {value_dim: value_dim}], dtype: bf16}
      s_final: {meaning: Returned alias of fully overwritten output_state, shape: [{batch: batch_count}, {head: value_heads}, {value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32}
    Compute:
      - Name: Decay, delta update and inclusive readout
        Math: |-
          1<=batch_count<=16; 1<=total_tokens<=16384; length(b)=cu_seqlens[b+1]-cu_seqlens[b]>0; sum_b length(b)=total_tokens.
          All tensors are contiguous on one CUDA device; only output and output_state may be mutated.
          Before key normalization, q/k/v rows have independent Normal(0,0.05) centers and Uniform(center-0.25,center+0.25) elements rounded to BF16.
          For 0<=b<batch_count, 0<=h<value_heads: qhead=floor(h/(value_heads/query_heads)); state(-1)=initial_state[b,h].
          For 0<=t<length(b): x=cu_seqlens[b]+t; decayed=(alpha[x,h]+epsilon)*state(t-1);
            delta[j]=beta[x,h]*(v[x,h,j]-sum_d decayed[j,d]*k[x,qhead,d]); state(t)[j,d]=decayed[j,d]+delta[j]*k[x,qhead,d];
            o[x,h,j]=bf16(scale*sum_d state(t)[j,d]*q[x,qhead,d]), 0<=j<value_dim, 0<=d<key_dim.
          s_final[b,h]=state(length(b)-1); return (o,s_final).
        Symbol: {state: {meaning: Reference state after local token t, shape: [{batch: batch_count}, {head: value_heads}, {value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32}}
    Golden_reference:
      Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/gdn_prefill/reference.py::Model.forward
      Tolerance:
        o: abs(candidate-reference)<=0.01+0.01*abs(reference); each returned and mutated element
        s_final: abs(candidate-reference)<=0.005+0.001*abs(reference); each returned and mutated element
  Hardware_specification:
    Device: NVIDIA L20D
    Architecture: SM103
    Execution:
      warp: 32 SIMT threads within one CTA.
      cta: Warps co-resident on one SM, sharing SMEM and barriers
      cluster: CTAs co-scheduled within one GPC, with cluster synchronization
    Feature:
      smem: CTA-lifetime shared storage, addressable by cluster peers while its owner remains alive
      tmem: Explicitly allocated Tensor Core storage, separate from SMEM.
      register: Thread-private registers backed by the SM register file
      asynchronous_execution: Asynchronous transfers and MMA require their primitive-specific completion and visibility guarantees
    Stack:
      Language: CuTe DSL 4.6.1
      Toolchain: CuTe DSL 4.6.1 bundled compiler; torch 2.9.0+cu130; cuda-python 13.1.1; CUDA runtime 13.0; driver 580.105.08.
    Wiki:
      Hardware: <wiki-hardware@pending:L20D/SM103.md>
      Programming:
        Language: <wiki-language@pending:CuTe-DSL/4.6.1/>
        Virtual_ISA: <wiki-virtual-isa@pending:PTX/pending/>
        Machine_ISA: <wiki-machine-isa@pending:SASS/SM103/>
      Microbench: <wiki-microbench@pending:L20D/>
      Sota:
        Kernel: <wiki-sota-kernel@pending:L20D/>
        Schema: <wiki-sota-schema@pending:L20D/>
      Profile: <wiki-profile@pending:NVIDIA/>
DESIGN:
  Math_reshape:
    Thesis: Replace the token dependency chain with chunk products and a hierarchical inverse, paying local quadratic work and BF16 rounding while carrying state in FP32.
    Rewrite:
      - Name: Pad to complete pairs and form decay prefixes
        Math: |-
          cu32=int32(cu_seqlens). For each b,h: qhead=floor(h/(value_heads/query_heads));
          length(b)=cu32[b+1]-cu32[b]; np(b)=2*ceil(length(b)/(2*chunk_size)); 0<=c<np(b), 0<=i<chunk_size.
          At x=cu32[b]+c*chunk_size+i with c*chunk_size+i<length(b):
            qchunk(c)[i,:]=q[x,qhead,:]; kchunk(c)[i,:]=k[x,qhead,:]; vchunk(c)[i,:]=v[x,h,:];
            alphachunk(c)[i]=alpha[x,h]; betachunk(c)[i]=beta[x,h].
          Outside length(b): qchunk=kchunk=vchunk=0; alphachunk=1; betachunk=0.
          g[i]=sum32_{j=0}^{i} log2_fast(fp32(alphachunk[j]+epsilon)); gamma[i]=exp2_fast(g[i]);
          w[i,j]=exp2_fast(g[i]-g[j]) for j<=i, otherwise 0.
        Symbol:
          chunk_size: {meaning: Tokens per recurrent chunk, value: 64}
          np: {meaning: Even padded chunk count for sequence b}
          cu32: {meaning: Converted packed boundaries consumed by the core, shape: [{boundary: batch_count+1}], dtype: int32, retention: keep_value invocation}
          qchunk: {meaning: Padded query chunk, shape: [{token: chunk_size}, {key_dim: key_dim}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          kchunk: {meaning: Padded key chunk, shape: [{token: chunk_size}, {key_dim: key_dim}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          vchunk: {meaning: Padded value chunk, shape: [{token: chunk_size}, {value_dim: value_dim}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          alphachunk: {meaning: Neutral-padded linear decays, shape: [{token: chunk_size}], dtype: fp32}
          betachunk: {meaning: Zero-padded update strengths, shape: [{token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          g: {meaning: Inclusive log2 decay prefix, shape: [{token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          gamma: {meaning: Decay from incoming state to each row, shape: [{token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          w: {meaning: Causal decay ratios for feedback and readout, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
        Arithmetic:
          Approx: 'Fast FP32 log2 and exp2 on stabilized gates and prefix differences; unknown: no reliable bound established for this source path'
          Accumulate: Scan each 32-token half in FP32, then add the first-half total to the second half
      - Name: Invert feedback with BF16 merge rounding
        Math: |-
          kk=mm32(kchunk,kchunkᵀ); a=bf16((kk ⊙ w) ⊙ betachunk[:,None]); triangular=identity+strict_lower(a).
          For each diagonal 8x8 block tri8: z=fp32(tri8); for pivot=0..6 and pivot<row<8:
            z[row,col]=z[row,col]-z[row,pivot]*z[pivot,col] for 0<=col<pivot; z[row,pivot]=-z[row,pivot].
          inv8=bf16(z).
          Merge widths 8->16->32->64: for triangular_block=[[left,0],[lower,right]],
            inverse_block=[[left_inv,0],[bf16(mm32(bf16(-mm32(right_inv,lower)),left_inv)),right_inv]].
          inverse=inverse_block at width chunk_size; tinv=bf16(inverse ⊙ betachunk[None,:]); qk=mm32(qchunk,kchunkᵀ);
          bmat=bf16((qk ⊙ w)*fp32(scale)).
        Symbol:
          kk: {meaning: Key Gram accumulator, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          a: {meaning: Rounded feedback and in-place inverse workspace, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: bf16}
          tinv: {meaning: Rounded inverse with column beta scaling, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          qk: {meaning: Query-key accumulator, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          bmat: {meaning: Scaled causal readout coefficients, shape: [{token: chunk_size}, {source_token: chunk_size}], dtype: bf16, retention: 'keep_value (b,h,c)'}
      - Name: Correct values and update the local state
        Math: |-
          s(-1)=initial_state[b,h]. For c=0..np(b)-1, omit c on local quantities:
          sbar=bf16(s(c-1)); sdec=gamma[chunk_size-1]*s(c-1);
          ks=mm32(sbar,kchunkᵀ); qs=mm32(sbar,qchunkᵀ);
          r=bf16(vchunkᵀ-bf16(ks ⊙ gamma[None,:])); u=mm32(r,tinvᵀ);
          ubar=bf16(u); decay[i]=exp2_fast(g[chunk_size-1]-g[i]); udec=bf16(u ⊙ decay[None,:]);
          qsscaled=(qs ⊙ gamma[None,:])*fp32(scale); y=mma32(ubar,bmatᵀ,qsscaled);
          s(c)=mma32(udec,kchunk,sdec).
          For c*chunk_size+i<length(b): o[cu32[b]+c*chunk_size+i,h,:]=bf16(y[:,i])
          s_final[b,h]=s(np(b)-1).
        Symbol:
          s: {meaning: FP32 chunk-boundary value-by-key state, shape: [{value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32, retention: 'carry_forward (b,h); c=-1..np(b)-1'}
          sbar: {meaning: Rounded state snapshot before decay, shape: [{value_dim: value_dim}, {key_dim: key_dim}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          sdec: {meaning: State scaled to the chunk end, shape: [{value_dim: value_dim}, {key_dim: key_dim}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          ks: {meaning: Incoming-state key projection, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          qs: {meaning: Incoming-state query projection, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          r: {meaning: Residual after two separate BF16 roundings, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          u: {meaning: FP32 corrected value update, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          ubar: {meaning: Rounded update for readout, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          decay: {meaning: Remaining decay from each token to the chunk end, shape: [{token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          udec: {meaning: End-decayed update rounded directly from u., shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: bf16, retention: 'keep_value (b,h,c)'}
          qsscaled: {meaning: Scaled incoming-state readout, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
          y: {meaning: Unrounded output chunk, shape: [{value_dim: value_dim}, {token: chunk_size}], dtype: fp32, retention: 'keep_value (b,h,c)'}
        Ledger:
          Baseline: Direct FP32 token recurrence with one live value_dim-by-key_dim state per sequence and head
          Gain: State dependency depth length(b) -> np(b) updates per sequence and head
          Cost: Seven dense products and a chunk_size-by-chunk_size hierarchical inverse per padded chunk, with BF16 snapshot, inverse, residual and update rounding.
  Work_schedule:
    Thesis: Split value rows between independent workers, duplicating qchunk/kchunk products and inverses to double available work; each worker carries the complete sequence recurrence.
    Step:
      INDEX_CAST:
        Describe: Materialize cu32 inside the timed Model.forward boundary
        Decomposition:
          Partition: {}
          Target:
            Single_tile: {cu32: {meaning: Converted packed boundaries, shape: [{boundary: batch_count+1}], dtype: int32}}
        Mapping:
          Worker: {unit: cta, unit_count: 1}
          Worker_count: 1
        Schedule:
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
      GDN:
        Describe: Compute independent state row halves with bounded sequence descriptors
        Decomposition:
          Strategy: For work t, b(t) is its sequence coordinate and chunk_count(t)=np(b(t)); the two value halves never merge
          Partition:
            batch: {meaning: Independent packed sequence, size: batch_count, tile: 1}
            head: {meaning: Value and state head, size: value_heads, tile: 1}
            value_dim: {meaning: Independent state and output rows, size: value_dim, tile: 64}
          Worktile:
            Invariant:
              cu32: {meaning: Boundaries of this sequence, shape: [{boundary: 2}], dtype: int32}
              initial_state: {meaning: Incoming state row half, shape: [{value_dim: 64}, {key_dim: key_dim}], dtype: fp32}
              scale: {meaning: Output multiplier, shape: [], dtype: fp64}
            Iteration:
              qchunk: {meaning: Padded query chunk, shape: [{token: chunk_size}, {key_dim: key_dim}], dtype: bf16, direction: ascending}
              kchunk: {meaning: Padded key chunk, shape: [{token: chunk_size}, {key_dim: key_dim}], dtype: bf16, direction: ascending}
              vchunk: {meaning: Padded value chunk, shape: [{token: chunk_size}, {value_dim: 64}], dtype: bf16, direction: ascending}
              alphachunk: {meaning: Neutral-padded linear decays, shape: [{token: chunk_size}], dtype: fp32, direction: ascending}
              betachunk: {meaning: Zero-padded update strengths, shape: [{token: chunk_size}], dtype: fp32, direction: ascending}
          Target:
            Single_tile:
              o: {meaning: Output rows of this sequence and head, shape: [{token: length(b)}, {value_dim: 64}], dtype: bf16}
              s_final: {meaning: Final state row half, shape: [{value_dim: 64}, {key_dim: key_dim}], dtype: fp32}
        Mapping:
          Strategy: workers=min(batch_count*value_heads*2,num_sm); num_sm is queried at runtime. Linear id=b*(2*value_heads)+2*h+row_half
          Worker: {unit: cta, unit_count: 1}
          Worker_count: workers
        Schedule:
          Strategy: All roles follow the same preassigned sequence. Ring cursors continue across worktiles; s reloads from initial_state for each work.
          Worktile_order:
            - {by: batch, direction: ascending}
            - {by: head, direction: ascending}
            - {by: value_dim, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, stride: workers}
            Refill: none
            Exit: assigned_done
    Flow:
      Launch:
        - {step: [INDEX_CAST]}
        - {step: [GDN], start_after: INDEX_CAST.kernel_done}
      Handoff: {cu32: {producer: INDEX_CAST, consumer: [GDN], storage: global}}
  Tile_pipeline:
    Thesis: Overlap pairwise inverse preparation with the recurrent chain using two compute groups and two MMA issuers; unequal rings and early accumulator returns expose overlap while scalar preparation shares the output warp
    Step:
      INDEX_CAST:
        Role:
          MAIN:
            Info:
              Describe: Convert public boundaries before the core launch
              Member: warp[0:4]
              Using_verb:
                compute: {cu32: {execution_mode: serial, describe: Convert batch_count+1 invocation cu_seqlens elements from int64 to int32 using the contiguous PyTorch copy kernel; overwrite cu32}}
            Pipe:
              - compute:cu32
      GDN:
        Index:
          t: {meaning: Preassigned work sequence of this worker, definition: worktile}
          c: {meaning: Padded recurrent chunk within work t, definition: [0, chunk_count(t)]}
          p: {meaning: INVERSE pair within work t, definition: [0, chunk_count(t)/2]}
          n: {meaning: Continuous chunk ordinal across works, definition: {flatten: [t, c]}}
        Storage:
          qring: {meaning: Queries shared by both MMA issuers, depth: 3, location: smem, shape: [{token: chunk_size}, {key_dim: key_dim}],
            dtype: bf16, total_size: 3*chunk_size*key_dim*2, view: {qchunk(n): {slot_index: n%3}}}
          kring: {meaning: Keys shared by both MMA issuers, depth: 4, location: smem, shape: [{token: chunk_size}, {key_dim: key_dim}],
            dtype: bf16, total_size: 4*chunk_size*key_dim*2, view: {kchunk(n): {slot_index: n%4}}}
          vring: {meaning: Values for residual construction, depth: 2, location: smem, shape: [{value_dim: 64}, {token: chunk_size}],
            dtype: bf16, total_size: 2*64*chunk_size*2, view: {vchunk(n): {slot_index: n%2}}}
          tring: {meaning: In-place inverse workspace and published tinv, depth: 3, location: smem, shape: [{token: chunk_size}, {source_token: chunk_size}],
            dtype: bf16, total_size: 3*chunk_size*chunk_size*2, view: {a(n): {slot_index: n%3}, tinv(n): {slot_index: n%3}}}
          bring: {meaning: Readout coefficients, depth: 2, location: smem, shape: [{token: chunk_size}, {source_token: chunk_size}],
            dtype: bf16, total_size: 2*chunk_size*chunk_size*2, view: {bmat(n): {slot_index: n%2}}}
          o: {meaning: Output staging, depth: 1, location: smem, shape: [{value_dim: 64}, {token: chunk_size}],
            dtype: bf16, total_size: 1*64*chunk_size*2}
          gatering: {meaning: gate prefixes and cumulative decays, depth: 5, location: smem, shape: [{field: 2}, {token: chunk_size}],
            dtype: fp32, total_size: 5*2*chunk_size*4, view: {g(n): {slot_index: n%5, region: {field: [0, 1]}}, gamma(n): {slot_index: n%5, region: {field: [1, 2]}}}}
          betaring: {meaning: Update strengths retained through tinv, depth: 5, location: smem, shape: [{token: chunk_size}],
            dtype: fp32, total_size: 5*chunk_size*4, view: {betachunk(n): {slot_index: n%5}}}
          wpair: {meaning: Pairwise decay factors retained through bmat, depth: 2, location: register, shape: [{token: chunk_size}, {source_token: chunk_size}],
            dtype: fp32, total_size: 2*chunk_size*chunk_size*4, view: {w(n): {slot_index: n%2}}}
          arena: {meaning: Accumulator and operand aliases in Tensor Memory, depth: 1, location: tmem, shape: [{row: 128}, {column: 512}],
            dtype: fp32, total_size: 262144, view: {s: {region: {column: [0, 128]}}, sdec(n): {region: {column: [0, 128]}}, qs(n): {region: {column: [128, 192]}}, qsscaled(n): {region: {column: [128, 192]}}, y(n): {region: {column: [128, 192]}}, sbar(n): {region: {column: [192, 256]}}, kk(n): {region: {column: [256+64*(n%2), 320+64*(n%2)]}}, qk(n): {region: {column: [256+64*(n%2), 320+64*(n%2)]}}, ks(n): {region: {column: [384, 448]}}, u(n): {region: {column: [384, 448]}}, r(n): {region: {column: [448, 480]}}, ubar(n): {region: {column: [448, 480]}}, udec(n): {region: {column: [480, 512]}}}}
          inversecapture: {meaning: One retired accumulator captured before weighting, depth: 1, location: register, shape: [{token: chunk_size}, {source_token: chunk_size}],
            dtype: fp32, total_size: chunk_size*chunk_size*4, view: {kkcaptured(n): {}, qkcaptured(n): {}}}
          betarows: {meaning: Row beta fragments held through pair inversion, depth: 1, location: register, shape: [{pair_chunk: 2}, {token: chunk_size}, {source_token: chunk_size}],
            dtype: fp32, total_size: 2*chunk_size*chunk_size*4, view: {'betarows(t,p)': {}}}
          decayfactors: {meaning: Captured cumulative and end-decay factors, depth: 1, location: register, shape: [{value_dim: 64}, {token: chunk_size}, {field: 2}],
            dtype: fp32, total_size: 64*chunk_size*2*4, view: {decayfactors(n): {}}}
          updatecapture: {meaning: Unrounded update for direct end-decay conversion, depth: 1, location: register, shape: [{value_dim: 64}, {token: chunk_size}],
            dtype: fp32, total_size: 64*chunk_size*4, view: {ucaptured(n): {}}}
          roundedupdate: {meaning: Rounded update held during end-decay computation, depth: 1, location: register, shape: [{value_dim: 64}, {token: chunk_size}],
            dtype: bf16, total_size: 64*chunk_size*2, view: {ubarcaptured(n): {}}}
          gateregs: {meaning: gate prefixes before SMEM acquisition, depth: 1, location: register, shape: [{field: 2}, {token: chunk_size}],
            dtype: fp32, total_size: 2*chunk_size*4, view: {gateregs(n): {}}}
        Role:
          LOAD:
            Info:
              Describe: Issue bounded qchunk/kchunk/vchunk transfers independently of both MMA issuers.
              Member: warp[9:10]
              Register: 24
              Using_verb:
                compute: {qkvbounds: {execution_mode: serial, describe: 'Read cu32, initialize then bound descriptors to cu32[b+1], and fence; old in-flight descriptor-read ordering is not established'}}
                load:
                  kchunk: {execution_mode: async_unordered, describe: Transfer invocation k into kring as kchunk; sequence-end descriptor bounds zero-fill partial and synthetic chunks}
                  qchunk: {execution_mode: async_unordered, describe: Transfer invocation q into qring as qchunk; sequence-end descriptor bounds zero-fill partial and synthetic chunks}
                  vchunk: {execution_mode: async_unordered, describe: Transfer invocation v into vring as vchunk; sequence-end descriptor bounds zero-fill partial and synthetic chunks}
            Pipe:
              - for(t):
                  - compute:qkvbounds(t)
                  - for(n[t]):
                      - load:kchunk(n)
                      - load:qchunk(n)
                      - load:vchunk(n)
            Waiting:
              Released:
                - '{issue load:kchunk(n+4)} ← [{done MMA0::matmul:qk(n+1-n%2)}, {done MMA1::matmul:s(n)}]'
                - '{issue load:qchunk(n+3)} ← [{done MMA0::matmul:qk(n+1-n%2)}, {done MMA1::matmul:qs(n)}]'
                - '{issue load:vchunk(n+2)} ← [{done RECURRENCE::release:vchunk(n)}]'
          MMA0:
            Info:
              Describe: Issue independent pair products while INVERSE retires their accumulators
              Member: warp[8:9]
              Register: 24
              Using_verb:
                matmul:
                  kk: {execution_mode: async_ordered, describe: Compute kk from LOAD kchunk with zero initial accumulator; done covers prior products and operand reads by this issuer}
                  qk: {execution_mode: async_ordered, describe: Compute qk from LOAD qchunk/kchunk into the retired kk slot; completion covers prior products and operand reads from this issuer.}
                await: {arena: {execution_mode: serial, describe: Join the allocation rendezvous and retrieve the arena base; done guarantees the allocated pointer is usable}}
            Pipe:
              - await:arena
              - for(t):
                  - for(p):
                      - matmul:kk(n[t,2*p])
                      - matmul:kk(n[t,2*p+1])
                      - matmul:qk(n[t,2*p])
                      - matmul:qk(n[t,2*p+1])
            Waiting:
              Prepared:
                - '{done await:arena} ← [{done RECURRENCE::acquire:arena}]'
                - '{issue matmul:kk(n)} ← [{done LOAD::load:kchunk(n)}]'
                - '{issue matmul:qk(n)} ← [{done LOAD::load:qchunk(n)}, {done LOAD::load:kchunk(n)}]'
              Released:
                - '{issue matmul:kk(n+2)} ← [{done INVERSE::load:qkcaptured(n)}]'
                - '{issue matmul:qk(n)} ← [{done INVERSE::load:kkcaptured(n)}]'
          INVERSE:
            Info:
              Describe: Retain decay factors while transforming each pair, returning TMEM accumulators before weighting
              Member: warp[0:4]
              Register: 224
              Using_verb:
                compute:
                  decaypair: {execution_mode: serial, describe: Form w for both chunks from SCALAROUTPUT g; return this role's gate stages after capture}
                  a: {execution_mode: serial, describe: 'Form a from kkcaptured, w and captured row beta in the acquired tring slot'}
                  inversepair: {execution_mode: serial, describe: 'Invert both a blocks in place; group rendezvous separates levels, with two warps per chunk at widths 8/32/64 and four across 16x16 blocks'}
                  tinv: {execution_mode: serial, describe: Apply column betachunk to the in-place inverse; publish tinv to MMA1 and return this beta stage}
                  bmat: {execution_mode: serial, describe: Form bmat from qkcaptured and retained w; publish to MMA1}
                load:
                  betarows: {execution_mode: serial, describe: Capture both row-beta fragments from SCALAROUTPUT betachunk; column betachunk stays live in SMEM through tinv}
                  kkcaptured: {execution_mode: serial, describe: 'Acquire the next tring slot, capture MMA0 kk into inversecapture, and return its TMEM slot before weighting'}
                  qkcaptured: {execution_mode: serial, describe: 'Acquire the next bring slot, capture MMA0 qk into inversecapture, and return its TMEM slot before weighting'}
                await: {arena: {execution_mode: serial, describe: Join the allocation rendezvous and retrieve the arena base; done guarantees the allocated pointer is usable}}
            Pipe:
              - await:arena
              - for(t):
                  - for(p):
                      - compute:decaypair(t,p)
                      - load:betarows(t,p)
                      - for(j=0:2):
                          - load:kkcaptured(n[t,2*p+j])
                          - compute:a(n[t,2*p+j])
                      - compute:inversepair(t,p)
                      - for(j=0:2):
                          - compute:tinv(n[t,2*p+j])
                      - for(j=0:2):
                          - load:qkcaptured(n[t,2*p+j])
                          - compute:bmat(n[t,2*p+j])
            Waiting:
              Prepared:
                - '{done await:arena} ← [{done RECURRENCE::acquire:arena}]'
                - '{issue compute:decaypair(t,p)} ← [{done SCALAROUTPUT::store:gate(n[t,2*p])}, {done SCALAROUTPUT::store:gate(n[t,2*p+1])}]'
                - '{issue load:betarows(t,p)} ← [{done SCALAROUTPUT::load:betachunk(n[t,2*p])}, {done SCALAROUTPUT::load:betachunk(n[t,2*p+1])}]'
                - '{issue load:kkcaptured(n)} ← [{done MMA0::matmul:kk(n)}]'
                - '{issue load:qkcaptured(n)} ← [{done MMA0::matmul:qk(n)}]'
              Released:
                - '{issue load:kkcaptured(n+3)} ← [{done MMA1::matmul:u(n)}]'
                - '{issue load:qkcaptured(n+2)} ← [{done MMA1::matmul:y(n)}]'
          MMA1:
            Info:
              Describe: Issue the five products on the state and output dependency chain
              Member: warp[10:11]
              Register: 24
              Using_verb:
                matmul:
                  ks: {execution_mode: async_ordered, describe: 'Compute ks from RECURRENCE sbar and LOAD kchunk, initializing the accumulator; completion covers this issuer''s prior products and operand reads'}
                  qs: {execution_mode: async_ordered, describe: 'Compute qs from RECURRENCE sbar and LOAD qchunk, initializing the accumulator; completion covers this issuer''s prior products and operand reads'}
                  u: {execution_mode: async_ordered, describe: 'Compute u from RECURRENCE r and INVERSE tinv, initializing the shared ks/u accumulator; completion returns tinv.'}
                  y: {execution_mode: async_ordered, describe: Accumulate ubar times bmat into RECURRENCE qsscaled; completion returns bmat and covers prior operand reads}
                  s: {execution_mode: async_ordered, describe: Accumulate udec times kchunk into RECURRENCE sdec; completion returns this issuer's kchunk use and covers prior operand reads}
                await: {arena: {execution_mode: serial, describe: Join the allocation rendezvous and retrieve the arena base; done guarantees the allocated pointer is usable}}
            Pipe:
              - await:arena
              - for(t):
                  - for(n[t]):
                      - matmul:ks(n)
                      - matmul:qs(n)
                      - matmul:u(n)
                      - matmul:y(n)
                      - matmul:s(n)
            Waiting:
              Prepared:
                - '{done await:arena} ← [{done RECURRENCE::acquire:arena}]'
                - '{issue matmul:ks(n)} ← [{done RECURRENCE::compute:stateoperand(n)}, {done LOAD::load:kchunk(n)}, {done LOAD::load:qchunk(n)}]'
                - '{issue matmul:u(n)} ← [{done RECURRENCE::compute:r(n)}, {done INVERSE::compute:tinv(n)}]'
                - '{issue matmul:y(n)} ← [{done RECURRENCE::compute:ubar(n)}, {done RECURRENCE::compute:qsscaled(n)}, {done INVERSE::compute:bmat(n)}]'
                - '{issue matmul:s(n)} ← [{done RECURRENCE::signal:udec(n)}]'
              Released: ['{issue matmul:qs(n+1)} ← [{done RECURRENCE::compute:o(n)}]']
          RECURRENCE:
            Info:
              Describe: Retain FP32 state, construct operands, and stage each output in the producing chunk
              Member: warp[4:8]
              Register: 256
              Using_verb:
                compute:
                  stateoperand: {execution_mode: serial, describe: 'Read incoming s once per subtile; write sbar and decay s in place, fence and publish; omit the producer empty-stage acquire'}
                  decayfactors: {execution_mode: serial, describe: 'Capture gamma and end-decay factors from SCALAROUTPUT gate into registers, then return this role''s gate stage'}
                  r: {execution_mode: serial, describe: 'Form r from LOAD vchunk, MMA1 ks and captured gamma, returning the ks accumulator after capture; publish r through its independent notification stream'}
                  qsscaled: {execution_mode: serial, describe: 'Rescale MMA1 qs in place using captured gamma and invocation scale, then return its accumulator stage for y.'}
                  o: {execution_mode: serial, describe: 'Acquire output SMEM, round MMA1 y into o, and return the qs/y accumulator; publish o to SCALAROUTPUT.'}
                  ubar: {execution_mode: serial, describe: 'Form udec from captured FP32 u and decayfactors; write ubarcaptured and udec to separate TMEM regions, fence, and publish ubar'}
                load:
                  initial_state: {execution_mode: serial, describe: 'Load this worktile''s explicit initial_state into s; group rendezvous and arrival establish readiness, including in zero mode'}
                  ucaptured: {execution_mode: serial, describe: 'Capture MMA1 u into updatecapture, retain its BF16 copy in roundedupdate, and return the ks/u accumulator before end-decay arithmetic.'}
                store: {s_final: {execution_mode: serial, describe: 'Read the last MMA1 state from TMEM and overwrite this worktile''s output_state rows, then return the state accumulator.'}}
                signal: {udec: {execution_mode: serial, describe: Notify MMA1 that the already written udec is ready through its separate stream}}
                acquire: {arena: {execution_mode: serial, describe: Allocate arena once; publish its base through the source rendezvous with INVERSE and both MMA issuers. Allocation does not initialize its contents}}
                release:
                  arena: {execution_mode: serial, describe: 'Free arena after final-state reads; TMEM producers and readers are transitively complete, while output SMEM stores may remain'}
                  vchunk: {execution_mode: serial, describe: 'Return LOAD vchunk after u completes, matching the source''s delayed return'}
            Pipe:
              - acquire:arena
              - for(t):
                  - load:initial_state(t)
                  - for(n[t]):
                      - compute:stateoperand(n)
                      - compute:decayfactors(n)
                      - compute:r(n)
                      - compute:qsscaled(n)
                      - release:vchunk(n)
                      - load:ucaptured(n)
                      - compute:ubar(n)
                      - signal:udec(n)
                      - compute:o(n)
                  - store:s_final(t)
              - release:arena
            Waiting:
              Prepared:
                - '{issue compute:stateoperand(n)} ← [{done SCALAROUTPUT::store:gate(n)}]'
                - '{issue compute:stateoperand(n[t,c+1])} ← [{done MMA1::matmul:s(n[t,c])}]'
                - '{issue compute:r(n)} ← [{done MMA1::matmul:ks(n)}, {done LOAD::load:vchunk(n)}]'
                - '{issue compute:qsscaled(n)} ← [{done MMA1::matmul:qs(n)}]'
                - '{issue release:vchunk(n)} ← [{done MMA1::matmul:u(n)}]'
                - '{issue load:ucaptured(n)} ← [{done MMA1::matmul:u(n)}]'
                - '{issue compute:o(n)} ← [{done MMA1::matmul:y(n)}]'
                - '{issue store:s_final(t)} ← [{done MMA1::matmul:s(n[t,last(c)])}]'
              Released: ['{issue compute:o(n+1)} ← [{done SCALAROUTPUT::store:o(n)}]']
          SCALAROUTPUT:
            Info:
              Describe: Prefetch four scalar chunks ahead of the output drain on the same warp
              Member: warp[11:12]
              Register: 24
              Using_verb:
                compute:
                  outputbounds: {execution_mode: serial, describe: 'Read cu32; initialize o descriptor on first use, update its sequence end and fence. Prior o stores complete before the next worktile update'}
                  gateregs: {execution_mode: serial, describe: Load invocation alpha with neutral tail predicates and compute g/gamma into gateregs before acquiring their SMEM stage}
                load: {betachunk: {execution_mode: async_unordered, describe: Acquire betaring and copy invocation beta asynchronously as betachunk; explicitly zero-fill padded elements}}
                store:
                  gate: {execution_mode: serial, describe: Acquire gatering and publish gateregs to INVERSE and RECURRENCE.}
                  o: {execution_mode: serial, describe: 'Bounded TMA stores RECURRENCE o into output, including synthetic chunks; await global completion and return the SMEM slot'}
            Pipe:
              - for(t):
                  - compute:outputbounds(t)
                  - for(j=0:min(4,chunk_count(t))):
                      - compute:gateregs(n[t,j])
                      - store:gate(n[t,j])
                      - load:betachunk(n[t,j])
                  - for(j=0:max(0,chunk_count(t)-4)):
                      - compute:gateregs(n[t,j+4])
                      - store:gate(n[t,j+4])
                      - load:betachunk(n[t,j+4])
                      - store:o(n[t,j])
                  - for(j=max(0,chunk_count(t)-4):chunk_count(t)):
                      - store:o(n[t,j])
            Waiting:
              Prepared: ['{issue store:o(n)} ← [{done RECURRENCE::compute:o(n)}]']
              Released:
                - '{issue store:gate(n+5)} ← [{done INVERSE::compute:decaypair(t,floor(c/2))}, {done RECURRENCE::compute:decayfactors(n)}]'
                - '{issue load:betachunk(n+5)} ← [{done INVERSE::compute:tinv(n)}]'
