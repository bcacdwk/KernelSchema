META_DATA:
  Name: paged_grouped_query_decode_attention
  Describe: Compute right-aligned causal attention against a paged FP8 KV cache and overwrite the supplied BF16 output
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/fa4_decode/aka_solution/solution.py::Model.forward
  Version: 9
  Dispatch:
    id: q4_direct
    when: 'q_len_per_req=4; 1<=batchcount<=17; 4<=max_seq_len<=256; each seq_lens>=4; fixed splitcount=1 and direct output. Steady native cache hit: same objects/signature, thread/current device, outside stream capture.'
DESIGN:
  Math_reshape:
    Thesis: Stripe KV work and keep two online numerator parities; leading and residual FP8 probabilities avoid dense intermediates at the cost of a second value product
    Rewrite:
      - Name: stripe
        Math: |-
          For request b, 0<=r<splitcount and 0<=q<q_len_per_req/querytile, x=h+headcount*t, t_abs=q*querytile+t, 0<=t<querytile, 0<=h<headcount.
          qpack[x,:]=query[b*q_len_per_req+t_abs,h,:]; T_b=ceil(l_b/bk); N_r=max(0,ceil((T_b-r)/worksplit(b))).
          For 0<=i<N_r and 0<=u<bk, k=(r+i*worksplit(b))*bk+u and page=floor(k/pagesize).
          id=block_tables[b,page] if i=0 or page<ceil(l_b/pagesize), otherwise -1.
          kblk(i)[u,:]=kv_cache[id,0,0,k%pagesize,:]; vblk(i)[u,:]=kv_cache[id,1,0,k%pagesize,:] for 0<=id<pagecount, otherwise zero.
          scoreblock(i)=mm32(kblk(i),transpose(qpack)). Tail rows outside visible_key are masked after the products.
        Symbol:
          splitcount: {meaning: Number of nominal KV splits, binding: 'bind:DESIGN.Work_schedule::splitcount'}
          worksplit: {meaning: Request split count, binding: 'bind:DESIGN.Work_schedule::worksplit'}
          bk: {meaning: Logical key block length, binding: 'bind:DESIGN.Work_schedule::bk'}
          querytile: {meaning: Tail queries sharing one KV traversal, binding: 'bind:DESIGN.Work_schedule::querytile'}
          packedcolumns: {meaning: Packed query-head columns, binding: 'bind:DESIGN.Work_schedule::packedcolumns'}
          qpack: {meaning: Packed query-head and query-tail rows, shape: [{packed_query: packedcolumns}, {d: channels}], dtype: fp8_e4m3fn, retention: 'keep_value (b,q,r)'}
          kblk: {meaning: Logical paged key block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn}
          vblk: {meaning: Logical paged value block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn}
          scoreblock: {meaning: Unmasked key-query products, shape: [{kv: bk}, {packed_query: packedcolumns}], dtype: fp32}
        Ledger:
          Baseline: Dense score and probability tensors
          Gain: Remove their global materialization; shorten each split chain
          Cost: Padded tail products and independent query-tile KV traversal
      - Name: exponent
        Math: |
          For each (b,q,r), initialize m(-1)=-inf; c=fp32(bmm1_scale*log2(e)).
          For 0<=i<N_r:
            s(i)[u,x]=scoreblock(i)[u,x] if (r+i*worksplit(b))*bk+u is in visible_key(b,q*querytile+floor(x/headcount)), otherwise -inf.
            m(i)[x]=max(m(i-1)[x],c*max(minfinite,max_u s(i)[u,x])).
            eblock(i)[u,x]=exp2_fast(c*s(i)[u,x]-m(i)[x]) on visible keys, otherwise zero.
            p_hi(i)=fp8_e4m3fn(rho*eblock(i)); p_lo(i)=fp8_e4m3fn(rho*eblock(i)-fp32(p_hi(i))).
            exponentialsum(i)[v,x]=eblock(i)[v,x]+eblock(i)[v+128,x], 0<=v<128.
        Symbol:
          rho: {meaning: Probability-operand scale, shape: [], dtype: fp32, value: 448}
          minfinite: {meaning: Finite masked-max initializer, shape: [], dtype: fp32, value: -3.4028234663852885e+38}
          m: {meaning: Running base-two maximum, shape: [{packed_query: packedcolumns}], dtype: fp32, retention: 'carry_forward (b,q,r); i=-1..N_r-1'}
          p_hi: {meaning: Leading FP8 component of the scaled exponential, shape: 'ref:scoreblock.shape', dtype: fp8_e4m3fn}
          p_lo: {meaning: Independently rounded FP8 residual, shape: 'ref:scoreblock.shape', dtype: fp8_e4m3fn}
          exponentialsum: {meaning: Unrounded exponential partial sums, shape: [{partial: 128}, {packed_query: packedcolumns}], dtype: fp32}
        Arithmetic:
          Approx: 'Native fast exp2; unknown: primitive error bound'
      - Name: parity
        Math: |-
          Initialize y(-2)=y(-1)=0; lbase(0)=lbase(1)=0; omit (b,q,r).
          For 0<=i<N_r, a(i)[x]=0 if i<2, otherwise exp2_fast(m(i-2)[x]-m(i)[x]).
          y(i)=mma32(transpose(vblk(i)),p_lo(i),mma32(transpose(vblk(i)),p_hi(i),y(i-2)*a(i)[None,:])).
          If i>=2: lbase(i)=a(i)[None,:]*lbase(i-2)+a(i)[None,:]*exponentialsum(i-2).
          Each native V reduction slice applies p_hi then p_lo to the same accumulator; the displayed whole-block contractions abbreviate that order.
        Symbol:
          y: {meaning: Scaled numerator on one parity, shape: [{d: channels}, {packed_query: packedcolumns}], dtype: fp32, retention: 'carry_forward (b,q,r,parity); i=-2..N_r-1'}
          lbase: {meaning: Corrected denominator on one parity, shape: [{partial: 128}, {packed_query: packedcolumns}], dtype: fp32, retention: 'carry_forward (b,q,r,parity); i=0..N_r-1'}
        Arithmetic:
          Accumulate: 'lbase scales the old sum and current partial separately; unknown: scalar multiply-add contraction'
        Ledger:
          Baseline: One FP32 probability value product
          Gain: Use FP8 operands for value products
          Cost: An extra residual value product and two probability roundings; denominator remains unquantized
      - Name: collapse
        Math: |-
          If N_r=0: mlocal=-inf, llocal=0; no ylocal payload is produced.
          If N_r>0, f=N_r-1, p=N_r-2; z=exp2_fast(m(p)-m(f)) if N_r>1, otherwise 1.
          mlocal=m(f); ylocal=y(f)+(y(p)*z[None,:] if N_r>1, otherwise zero).
          lt=lbase(f)+exponentialsum(f)+(z[None,:]*(lbase(p)+exponentialsum(p)) if N_r>1, otherwise zero).
          finalsum[x,g]=sum32_{v=32*g}^{32*g+31} lt[v,x], 0<=g<4; llocal[x]=((finalsum[x,0]+finalsum[x,1])+finalsum[x,2])+finalsum[x,3].
          For N_r=1, the empty numerator and exponential-sum parity contain zero and are consumed alongside the populated parity.
        Symbol:
          mlocal: {meaning: Split maximum, shape: [{packed_query: packedcolumns}], dtype: fp32, retention: 'keep_value (b,q,r)'}
          llocal: {meaning: Split denominator, shape: 'ref:mlocal.shape', dtype: fp32, retention: 'keep_value (b,q,r)'}
          ylocal: {meaning: Active split numerator, shape: [{d: channels}, {packed_query: packedcolumns}], dtype: fp32, retention: 'keep_value (b,q,r)'}
          finalsum: {meaning: Warp-grouped final denominator, shape: [{packed_query: packedcolumns}, {warp: 4}], dtype: fp32}
      - Name: normalize
        Math: |-
          normalization[x]=rcp_fast(llocal[x])*fp32(bmm2_scale/rho).
          For x=h+headcount*t, output[b*q_len_per_req+q*querytile+t,h,d]=bf16(ylocal[d,x]*normalization[x]); out_after=output.
        Symbol: {normalization: {meaning: Final output multiplier, shape: [{packed_query: packedcolumns}], dtype: fp32, retention: 'keep_value (b,q,r)'}}
        Arithmetic:
          Approx: 'Native approximate reciprocal; unknown: primitive error bound'
        Ledger:
          Baseline: Split attention and combination
          Gain: No split workspace or inter-CTA reduction
          Cost: One CTA owns the entire KV chain for its query tile
  Work_schedule:
    Thesis: One CTA completes each query tile without split materialization or external reduction
    Step:
      MAIN:
        Describe: Form the query-tile output within its assigned worker
        Decomposition:
          Strategy: bk=256; querytile=2; packedcolumns=headcount*querytile; splitcount=1; worksplit(b)=splitcount; N_r=max(0,ceil((T_b-r)/splitcount))
          Partition:
            batch: {meaning: Request coordinate, size: batchcount, tile: 1}
            query_tail: {meaning: Query-tail tile coordinate, size: q_len_per_req, tile: querytile}
          Worktile:
            Invariant:
              qpack: {meaning: Resident packed queries, shape: [{packed_query: packedcolumns}, {d: channels}], dtype: fp8_e4m3fn}
              seq_lens: {meaning: Current request length, shape: [{batch: 1}], dtype: int32}
            Iteration:
              kblk: {meaning: Paged kblk block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn, direction: ascending}
              vblk: {meaning: Paged vblk block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn, direction: ascending}
          Target:
            Single_tile: {output: {meaning: Final query-tile output, shape: [{query_tail: querytile}, {head: headcount}, {d: channels}], dtype: bf16}}
        Mapping:
          Worker: {unit: cta, unit_count: 1}
          Worker_count: worktile_count
        Schedule:
          Strategy: Established native launcher, same objects/signature and thread on the current device, outside stream capture
          Worktile_order:
            - {by: batch, direction: ascending}
            - {by: query_tail, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
    Flow:
      Launch: [{step: [MAIN]}]
  Tile_pipeline:
    Thesis: A two-iteration issue lead overlaps KQ, softmax and parity correction; operand completion protects ring reuse while peer turns permit earlier issue
    Step:
      MAIN:
        Index:
          i: {meaning: Local stripe iteration, definition: [0, N]}
          u: {meaning: Operand slice within one block, definition: [0, 4]}
          tail: {meaning: Populated final numerator iterations, definition: ['max(0,N-2)', N]}
        Storage:
          qpack: {meaning: Resident packed queries, depth: 1, location: smem, shape: [{packed_query: packedcolumns}, {d: channels}],
            dtype: fp8_e4m3fn, total_size: 1*(packedcolumns*channels)}
          pageindex: {meaning: Page lookup ring, depth: 4, location: smem, shape: [{page_index: 4}],
            dtype: int32, total_size: 64, view: {pageindex(i): {slot_index: i%4}}}
          kv: {meaning: Shared key/value and output region, depth: 1, location: smem, shape: [{element: 131072}],
            dtype: fp8_e4m3fn, total_size: 131072, view: {'kslice(i,u)': {region: {element: ['16384*kslot(i,u)', '16384*(kslot(i,u)+1)']}}, 'vslice(i,u)': {region: {element: ['16384*vslot(i,u)', '16384*(vslot(i,u)+1)']}}, ostage: {region: {element: [0, 2*channels*packedcolumns]}}}}
          scoreblock: {meaning: Score accumulator ring, depth: 4, location: tmem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(16*bk*packedcolumns), view: {scoreblock(i): {slot_index: i%4}}}
          p_hi: {meaning: Leading probability ring, depth: 4, location: smem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp8_e4m3fn, total_size: 1*(4*bk*packedcolumns), view: {p_hi(i): {slot_index: i%4}}}
          p_lo: {meaning: Residual probability ring, depth: 4, location: smem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp8_e4m3fn, total_size: 1*(4*bk*packedcolumns), view: {p_lo(i): {slot_index: i%4}}}
          y: {meaning: numerator parity pair, depth: 2, location: tmem, shape: [{d: channels}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(8*channels*packedcolumns), view: {y(i): {slot_index: i%2}}}
          exponentialsum: {meaning: Unrounded sum parity pair, depth: 2, location: tmem, shape: [{partial: 128}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(1024*packedcolumns), view: {exponentialsum(i): {slot_index: i%2}}}
          maximum: {meaning: Shared maximum then normalization, depth: 1, location: smem, shape: [{packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(4*packedcolumns), view: {m: {}, normalization: {}}}
          finalsum: {meaning: Final denominator warp partials, depth: 1, location: smem, shape: [{packed_query: packedcolumns}, {warp: 4}],
            dtype: fp32, total_size: 1*(16*packedcolumns)}
          lbase: {meaning: Correction denominator state, depth: 1, location: register, shape: [{partial: 128}, {packed_query: packedcolumns}, {parity: 2}],
            dtype: fp32, total_size: 1*(1024*packedcolumns)}
          tailnumerator: {meaning: Captured final numerator pair, depth: 1, location: register, shape: [{age: 2}, {d: channels}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(8*channels*packedcolumns)}
          scorecopy: {meaning: Captured scores then exponentials, depth: 1, location: register, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(4*bk*packedcolumns)}
          pagecopy: {meaning: K and V private page snapshots, depth: 1, location: register, shape: [{role: 2}, {page_index: 4}],
            dtype: int32, total_size: 32}
          maximumhistory: {meaning: Retained correction maxima, depth: 1, location: register, shape: [{warp: 4}, {packed_query: packedcolumns}, {age: 3}],
            dtype: fp32, total_size: 48*packedcolumns}
          softmaxmaximum: {meaning: Captured softmax maximum vectors, depth: 1, location: register, shape: [{group: 1}, {partial: 128}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 512*packedcolumns}
        Role:
          LOADK:
            Info:
              Describe: Prepare the CTA and load paged keys
              Member: warp[2:3]
              Register: 64
              Using_verb:
                load:
                  startup: {execution_mode: serial, describe: Prefetch pageindex/length; join CTA initialization of TMEM and maximum=-inf/finalsum=0; bind N=N_r after cp.async and CTA sync}
                  query: {execution_mode: async_unordered, describe: TMA-load query into qpack; done includes query barrier completion}
                  nextpages: {execution_mode: async_unordered, describe: 'Prefetch pageindex(i+1) before the K turn; unproved: same-slot overwrite waits for the delayed V pagecopy'}
                  pagecopy: {execution_mode: serial, describe: Capture completed pageindex(i) into the K part of pagecopy before obtaining the K issue turn}
                  key: {execution_mode: async_unordered, describe: 'TMA-copy the acquired kslice(i,u) from pagecopy; done is this slice transaction completion'}
                await: {turn: {execution_mode: serial, describe: Obtain the K issue turn; short loops relay the two no-payload ramp/tail turns}}
                signal: {turn: {execution_mode: serial, describe: Release the V issue turn after final K slot acquisition and before its transfer; earlier transfers may remain in flight}}
                acquire: {key: {execution_mode: serial, describe: 'Acquire kslot(i,u) in the shared KV pipeline; wait its previous operand-consumer release; first use is free'}}
            Pipe:
              - load:startup
              - if(N > 0):
                  - load:query
                  - for(i):
                      - if(i+1 < N):
                          - load:nextpages(i)
                      - load:pagecopy(i)
                      - await:turn(i)
                      - for(u):
                          - acquire:key(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - load:key(i,u)
            Waiting:
              Prepared: ['{issue load:pagecopy(i+1)} ← [{done load:nextpages(i)}]']
              Allowed: ['{done await:turn(i+3)} ← [{done LOADV::signal:turn(i)}]']
          LOADV:
            Info:
              Describe: Load paged values and transfer the final output
              Member: warp[3:4]
              Register: 64
              Using_verb:
                load:
                  pagecopy: {execution_mode: serial, describe: Capture pageindex(i) into the V part of pagecopy; this ends the last page-ring reader}
                  value: {execution_mode: async_unordered, describe: 'TMA-copy acquired vslice(i,u) using the captured pages; done is this slice transaction completion'}
                store: {output: {execution_mode: async_unordered, describe: TMA-copy BF16 ostage into the owned out tile}}
                await:
                  startup: {execution_mode: serial, describe: Join LoadK startup before testing N}
                  turn: {execution_mode: serial, describe: 'Obtain the V issue turn, including the fixed two-turn ramp and tail relays'}
                signal: {turn: {execution_mode: serial, describe: Release the K issue turn after final V slot acquisition and before its transfer; transfers may remain in flight}}
                acquire: {value: {execution_mode: serial, describe: 'Acquire vslot(i,u) in the shared KV pipeline; wait its previous operand-consumer release; first use is free'}}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - load:pagecopy(i)
                      - for(u):
                          - acquire:value(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - load:value(i,u)
                  - store:output
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue store:output} ← [{done CORRECTION::compute:output}]'
              Allowed: ['{done await:turn(i)} ← [{done LOADK::signal:turn(min(i+2,N-1))}]']
          SCORE:
            Info:
              Describe: Issue key-query products and reduce final statistics
              Member: warp[0:1]
              Register: 64
              Using_verb:
                compute: {normalization: {execution_mode: serial, describe: Compute normalize from finalsum; overwrite maximum with normalization and notify Correction}}
                matmul: {key@query: {execution_mode: async_ordered, describe: 'Accumulate kslice(i,u) with the matching qpack half into scoreblock(i); same KQ queue preserves slice order'}}
                await:
                  maximum_ready: {execution_mode: serial, describe: Join the final-maximum rendezvous; no maximum payload is read when LSE and sinks are disabled}
                  sum_ready: {execution_mode: serial, describe: Join Correction finalsum rendezvous; permit its final Y capture}
                  startup: {execution_mode: serial, describe: Join LoadK setup before reading N}
                  turn: {execution_mode: serial, describe: Obtain the KQ issue turn; no-payload ramp/tail handshakes retain the source lead of two}
                signal:
                  turn: {execution_mode: serial, describe: 'Release the VP issue turn after final K operand acquisition, before its MMA; this is not score completion'}
                  score: {execution_mode: async_unordered, describe: Commit scoreblock(i) readiness after all four slice products}
                  launch_ready: {execution_mode: serial, describe: 'Call griddepcontrol_launch_dependents after statistics epilogue; contributes to grid permission, not output completion'}
                acquire:
                  score: {execution_mode: serial, describe: Acquire scoreblock(i) after its earlier softmax capture; the first four slots are free}
                  key: {execution_mode: serial, describe: 'Wait kslice(i,u) transaction completion and retain the KV consumer handle'}
                release: {key: {execution_mode: async_unordered, describe: 'Return kslice(i,u) through its UMMA consumer commit when operand reads finish'}}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - acquire:score(i)
                      - for(u):
                          - acquire:key(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - matmul:key(i,u)@query
                          - release:key(i,u)
                      - signal:score(i)
              - await:maximum_ready
              - await:sum_ready
              - compute:normalization
              - signal:launch_ready
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue matmul:key(i,u)@query} ← [{done LOADK::load:query}]'
                - '{done acquire:key(i,u)} ← [{done LOADK::load:key(i,u)}]'
                - '{done signal:score(i)} ← [{done matmul:key(i,3)@query}]'
                - '{done await:maximum_ready} ← [{done CORRECTION::signal:maximum}]'
                - '{done await:sum_ready} ← [{done CORRECTION::compute:sum}]'
              Released: ['{done acquire:score(i+4)} ← [{done SOFTMAX::load:score(i)}]']
              Allowed:
                - '{done await:turn(i+3)} ← [{done VALUE::signal:turn(i)}]'
                - '{done release:key(i,u)} ← [{issue matmul:key(i,u)@query}]'
          VALUE:
            Info:
              Describe: Issue both probability products and retire TMEM
              Member: warp[1:2]
              Register: 64
              Using_verb:
                matmul: {value@probability: {execution_mode: async_ordered, describe: Accumulate each V slice with p_hi then p_lo into Y(i); the VP queue preserves native slice order}}
                await:
                  startup: {execution_mode: serial, describe: Join LoadK setup before reading N}
                  turn: {execution_mode: serial, describe: Obtain VP issue permission; KQ may still have unfinished products}
                signal:
                  turn: {execution_mode: serial, describe: 'Release KQ issue permission after final V/P operand acquisition, before its MMA; Y need not be complete'}
                  numerator: {execution_mode: async_unordered, describe: Commit the updated Y(i) for Correction after all slice products}
                  empty: {execution_mode: serial, describe: Commit the initialized empty Y parity 1 when N=1; no extra value product}
                acquire:
                  numerator: {execution_mode: serial, describe: Acquire initialized or corrected Y(i) and the committed p_hi/p_lo pair for this iteration}
                  value: {execution_mode: serial, describe: 'Wait vslice(i,u) completion and retain its KV consumer handle'}
                release:
                  value: {execution_mode: async_unordered, describe: 'Return vslice(i,u) after both probability components finish reading it'}
                  probability: {execution_mode: async_unordered, describe: Return p_hi/p_lo(i) after all VP operand reads; independent of Y result readiness}
                  tmem: {execution_mode: serial, describe: Deallocate TMEM after Correction returns both final Y slots; empty splits free the initial allocation}
                  empty_tmem: {execution_mode: serial, describe: 'Release and deallocate the TMEM allocation for N=0; no score, probability or numerator was consumed'}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - acquire:numerator(i)
                      - for(u):
                          - acquire:value(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - matmul:value(i,u)@probability(i)
                          - release:value(i,u)
                      - release:probability(i)
                      - signal:numerator(i)
                  - if(N == 1):
                      - signal:empty
              - if(N > 0):
                  - release:tmem
              - if(N == 0):
                  - release:empty_tmem
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{done acquire:numerator(i)} ← [{done CORRECTION::compute:zero}, {done SOFTMAX::compute:probability(i)}]'
                - '{done acquire:value(i,u)} ← [{done LOADV::load:value(i,u)}]'
                - '{done signal:numerator(i)} ← [{done matmul:value(i,3)@probability(i)}]'
              Released:
                - '{done acquire:numerator(i+2)} ← [{done CORRECTION::compute:correct(i)}]'
                - '{issue release:tmem} ← [{done CORRECTION::release:tail}]'
              Allowed:
                - '{done await:turn(i)} ← [{done SCORE::signal:turn(min(i+2,N-1))}]'
                - '{done release:value(i,u)} ← [{issue matmul:value(i,u)@probability(i)}]'
                - '{done release:probability(i)} ← [{issue matmul:value(i,3)@probability(i)}]'
          SOFTMAX:
            Info:
              Describe: Produce probabilities and sums from every score block
              Member: warp[4:8]
              Register: 168
              Using_verb:
                compute:
                  maximum: {execution_mode: serial, describe: Mask scorecopy on boundary tiles; update maximum and join the producer rendezvous; done publishes m(i)}
                  probability: {execution_mode: serial, describe: Use captured m(i) and scorecopy to form p_hi/p_lo in SMEM; fence and commit the pair}
                  sum: {execution_mode: serial, describe: Store exponentialsum(i) from unrounded exponentials into its TMEM parity; fence and notify Correction}
                load:
                  score: {execution_mode: serial, describe: 'Capture scoreblock(i) into scorecopy, fence the TMEM read and release its score slot'}
                  maximum: {execution_mode: serial, describe: Capture m(i) from maximum into softmaxmaximum after the producer rendezvous}
                await: {startup: {execution_mode: serial, describe: Join CTA setup before the N-dependent softmax path}}
                signal: {empty_sum: {execution_mode: serial, describe: 'For N=1, notify Correction that initialized exponentialsum parity 1 is ready; no softmax work for that parity'}}
                acquire:
                  maximum: {execution_mode: serial, describe: Acquire the next maximum update turn after Correction captured its predecessor}
                  probability: {execution_mode: serial, describe: Acquire both probability rings for i before exposing the new maximum to Correction}
            Pipe:
              - await:startup
              - if(N == 1):
                  - signal:empty_sum
              - for(i):
                  - load:score(i)
                  - acquire:maximum(i)
                  - acquire:probability(i)
                  - compute:maximum(i)
                  - load:maximum(i)
                  - compute:probability(i)
                  - compute:sum(i)
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
