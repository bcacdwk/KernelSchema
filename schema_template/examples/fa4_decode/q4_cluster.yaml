meta_data:
  name: paged_grouped_query_decode_attention
  describe: Compute right-aligned causal attention against a paged FP8 KV cache; overwrite BF16 out.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_decode/aka_solution/solution.py::Model.forward
  version: 5
  dispatch:
    id: q4_cluster
    parent: root
    when: |
      Let B=BatchCount, L=max_seq_len, C=ceil(L/256), and skew=(128*PageCount<B*L).
      Select exactly when q_len_per_req=4, C>1, and either L<=2048, or
      2048<L<24576 and (B<=4 or (B>=10 and (B<17 or skew))).
      Short, small-batch and four-member policies share the cluster protocol.
design:
  math_reshape:
    thesis: Stripe KV blocks into shorter chains; keep two FP32 numerator parities and use leading/residual FP8 probabilities, trading an extra value product for no dense intermediate
      storage.
    rewrite:
    - step: stripe
      name: Pack query heads and stripe the logical key blocks
      math: |
        For request b and query block q, let x=h+HeadCount*t, 0<=t<QueryTile, 0<=h<HeadCount,
        t_abs=q*QueryTile+t, Qpack[x,:]=query[b*q_len_per_req+t_abs,h,:], and T_b=ceil(seq_lens[b]/Bk).
        For split r in [0,SplitCount), N_r=max(0,ceil((T_b-r)/WorkSplit(b))) if r<WorkSplit(b); otherwise 0.
        For 0<=i<N_r, 0<=u<Bk, k=(r+i*WorkSplit(b))*Bk+u:
          Let page=floor(k/PageSize); id=block_tables[b,page] if i=0 or page<ceil(seq_lens[b]/PageSize), otherwise -1.
          Kblk(i)[u,:]=kv_cache[id,0,0,k%PageSize,:], Vblk(i)[u,:]=kv_cache[id,1,0,k%PageSize,:] if id>=0; otherwise zero.
          ScoreBlock(i)=mm32(Kblk(i),Qpackᵀ).
      symbol:
        SplitCount: {meaning: Number of nominal KV splits., binding: 'bind:design.work_schedule::SplitCount'}
        WorkSplit: {meaning: Request-to-active-split-count map., binding: 'bind:design.work_schedule::WorkSplit'}
        Bk: {meaning: Logical key block length., binding: 'bind:design.work_schedule::Bk'}
        QueryTile: {meaning: Tail queries sharing one KV traversal., binding: 'bind:design.work_schedule::QueryTile'}
        PackedColumns: {meaning: 'Head-query column count, HeadCount*QueryTile.', binding: 'bind:design.work_schedule::PackedColumns'}
        Qpack: {meaning: Packed query-head and query-tail rows., shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn, life: 'stored (b,q,r)'}
        Kblk: {meaning: Logical paged key block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        Vblk: {meaning: Logical paged value block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        ScoreBlock: {meaning: Raw key-query product before the softmax mask., shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32}
    - step: exponent
      name: Use two FP8 components for each scaled exponential
      math: |
        For each (b,q,r), initialize m(-1)=-inf; c=fp32(bmm1_scale*log2(e)).
        For 0<=i<N_r:
          S(i)[u,x]=ScoreBlock(i)[u,x] if (r+i*WorkSplit(b))*Bk+u is in visible_key(b,q*QueryTile+floor(x/HeadCount)), otherwise -inf.
          m(i)[x]=max(m(i-1)[x],c*max(MinFinite,max_u S(i)[u,x])).
          Eblock(i)[u,x]=exp2_fast(c*S(i)[u,x]-m(i)[x]) on visible keys, otherwise zero.
          P_hi(i)=fp8_e4m3fn(rho*Eblock(i)); P_lo(i)=fp8_e4m3fn(rho*Eblock(i)-P_hi(i)).
          ExponentialSum(i)[v,x]=Eblock(i)[v,x]+Eblock(i)[v+128,x], 0<=v<128.
      symbol:
        rho: {meaning: Probability-operand scale., shape: [], dtype: fp32, value: 448}
        MinFinite: {meaning: Finite initializer of the masked score maximum., shape: [], dtype: fp32, value: -3.4028234663852886e+38}
        m: {meaning: Running base-two maximum., shape: [{packed_query: PackedColumns}], dtype: fp32, life: 'carried (b,q,r); i=-1..N_r-1'}
        P_hi: {meaning: Leading FP8 component of the scaled exponential., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        P_lo: {meaning: Independently rounded FP8 residual., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        ExponentialSum: {meaning: Unrounded per-thread probability partial sums., shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32}
      arithmetic: {approx: 'exp2_fast is the source''s fast-math base-two exponential; unknown: no verified error bound for this fast-exp2 path.'}
    - step: parity
      name: Carry two interleaved numerators and denominators
      math: |
        Initialize Y(-2)=Y(-1)=0; Lbase(0)=Lbase(1)=0; omit (b,q,r).
        For 0<=i<N_r:
          a(i)[x]=0 if i<2, otherwise exp2_fast(m(i-2)[x]-m(i)[x]).
          Y(i)=mma32(Vblk(i)ᵀ,P_lo(i),mma32(Vblk(i)ᵀ,P_hi(i),Y(i-2) ⊙ a(i)[None,:])).
          If i>=2: Lbase(i)=a(i)[None,:] ⊙ Lbase(i-2)+a(i)[None,:] ⊙ ExponentialSum(i-2).
        If N_r=0: Mlocal=-inf, Llocal=0; no Ylocal payload is produced.
        If N_r>0, let f=N_r-1, p=N_r-2; z=exp2_fast(m(p)-m(f)) if N_r>1, otherwise 1:
          Mlocal=m(f); Ylocal=Y(f)+(Y(p) ⊙ z[None,:] if N_r>1, otherwise zero).
          Lt=Lbase(f)+ExponentialSum(f)+(z[None,:] ⊙ (Lbase(p)+ExponentialSum(p)) if N_r>1, otherwise zero).
          FinalSum[x,g]=sum32_{v=32*g}^{32*g+31} Lt[v,x], 0<=g<4; Llocal[x]=sum32_g FinalSum[x,g].
      symbol:
        Y: {meaning: 'FP32 numerator of one parity, still scaled by rho.', shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, life: 'carried (b,q,r,parity); i=-2..N_r-1
            on that parity'}
        Mlocal: {meaning: Split maximum., shape: [{packed_query: PackedColumns}], dtype: fp32, life: 'stored (b,q,r)'}
        Llocal: {meaning: Split denominator., shape: 'ref:Mlocal.shape', dtype: fp32, life: 'stored (b,q,r)'}
        Ylocal: {meaning: Active split numerator., shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, life: 'stored (b,q,r)'}
        Lbase: {meaning: Corrected per-thread denominator carried on each parity., shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32, life: 'carried (b,q,r,parity);
            i=0..N_r-1 on that parity'}
        FinalSum: {meaning: Warp-grouped final denominator., shape: [{packed_query: PackedColumns}, {warp: 4}], dtype: fp32}
      arithmetic:
        approx: exp2_fast follows step exponent.
        accumulate: 'Each native V reduction slice accumulates P_hi then P_lo into the same FP32 Y. Lbase scales the old state and current partial separately before addition; scalar
          contraction is unknown: FP32 multiply-add contraction has not been confirmed for the recorded CuTe DSL compiler path.'
    - step: normalize
      name: Share normalization and add narrowed split contributions
      math: |
        For each (b,q,x), with split indices restored:
          M=max_{r=0}^{SplitCount-1} Mlocal(r)[x].
          w[r]=exp2_fast(Mlocal(r)[x]-M) if Mlocal(r)[x]>-inf; otherwise 0.
          Z=sum32_{r=0}^{SplitCount-1} w[r]*Llocal(r)[x].
          Normalization(r)[x]=w[r]*rcp_fast(Z)*fp32(bmm2_scale/rho).
          Contribution(r)[d,x]=bf16(Ylocal(r)[d,x]*Normalization(r)[x]) only for r with N_r>0.
        For x=h+HeadCount*t and t_abs=q*QueryTile+t:
          output[b*q_len_per_req+t_abs,h,d]=reduce_add_bf16_{r:N_r>0} Contribution(r)[d,x].
        reduce_add_bf16 starts from BF16 zero and adds the BF16 contributions in
        runtime completion order into the BF16 destination; empty splits add nothing.
        out_after=output.
      arithmetic:
        approx: 'exp2_fast follows step exponent; rcp_fast is the source approximate reciprocal; unknown: no verified error bound for this reciprocal path.'
        accumulate: 'Cluster max and sum use XOR-partner rounds; output accumulation takes separately BF16-rounded split contributions and has no fixed split order. Native BF16
          reduce-add internal arithmetic and subnormal handling are unknown: native BF16 TMA reduce-add rounding and subnormal behavior have not been verified.'
      symbol:
        Normalization: {meaning: Final multiplier., shape: [{packed_query: PackedColumns}], dtype: fp32, life: 'stored (b,q,r)'}
        Contribution: {meaning: Normalized BF16 split contribution., shape: [{d: D}, {packed_query: PackedColumns}], dtype: bf16}
    ledger:
      baseline: Dense FP32 scores/probabilities in global memory, with one value contraction.
      matmul:
      - {item: Contractions, change: 2*D*L_b -> 3*D*Bk*T_b MAC per query head; the added contraction applies P_lo., by: [stripe, exponent, parity]}
      traffic:
      - {item: Dense intermediates, change: -16*q_len_per_req*HeadCount*L_b bytes per request for score/probability writes and reads., by: [stripe, exponent]}
      depth:
      - {item: KV chain, change: 'T_b -> max_r N_r sequential block updates per query, followed by a SplitCount-way normalization reduction.', by: [stripe, normalize]}
      error:
      - {item: Numerics, change: '+two FP8 probability roundings, fast exp2/reciprocal, parity and split regrouping; the denominator keeps unquantized FP32 probabilities. Each split
          also rounds to BF16 before unordered reduce-add.', by: [exponent, parity, normalize]}
  work_schedule:
    thesis: Two query tiles per request each receive a striped CTA cluster; exchange maxima/sums and accumulate BF16 contributions directly into out.
    flow: {launch: [{phase: [attention]}]}
    phase:
      attention:
        describe: Compute and normalize one query block within its assigned worker.
        decomposition:
          strategy: |
            Bk=256; QueryTile=2; PackedColumns=HeadCount*QueryTile; C=ceil(max_seq_len/Bk).
            Let B=BatchCount, L=max_seq_len, M=2*B; f2(n)=largest power of two <=max(1,n).
            SplitCount=f2(min(C,min(8,max(2,f2(ceil(96/M)))))) if L<=2048;
            otherwise f2(min(C,min(16,max(4,f2(ceil(96/M)))))) if B<=4, otherwise 4.
            WorkSplit(b)=SplitCount; 96 is a source scheduling budget.
            Member r independently traverses blocks r+i*WorkSplit(b) via four HND page indices.
            Iteration shapes collect all members without lockstep; empty members still join statistics exchange.
            Member 0 zeroes out during the ramp; reduce-adds wait for its visibility signal.
          partition: {batch: {size: BatchCount, tile: 1}, query_tail: {size: q_len_per_req, tile: QueryTile}}
          worktile:
            invariant: {Qpack: {shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}, seq_lens: {shape: [{batch: 1}], dtype: int32}}
            iteration: {block_tables: {shape: [{split: SplitCount}, {page_index: 4}], dtype: int32, direction: ascending}, Kblk: {shape: [{split: SplitCount}, {kv: Bk}, {d: D}],
                dtype: fp8_e4m3fn, direction: ascending}, Vblk: {shape: [{split: SplitCount}, {kv: Bk}, {d: D}], dtype: fp8_e4m3fn, direction: ascending}}
          target: {single_tile: {output: {shape: [{query_tail: QueryTile}, {head: HeadCount}, {d: D}], dtype: bf16}}}
        mapping: {worker: {unit: CTA, count: SplitCount}, count: worktile_count, placement: {unit: cluster, count: 1}, strategy: 'Cluster member r, 0<=r<SplitCount, owns exactly
            the striped split r; query operands are separately loaded by each member.'}
        schedule: {worktile_order: [{by: batch, direction: ascending}, {by: query_tail, direction: ascending}], worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none,
            exit: assigned_done}}
  tile_pipeline:
    thesis: Separate K/V transfer and score/value issue roles; bounded issue lead and two numerator parities overlap softmax with correction. Buffer reuse follows operand completion,
      not issue. One softmax warpgroup processes every block; issuer/softmax/correction budgets are 64/168/256 registers per thread.
    phase:
      attention:
        domain: {i: [0, N_r], active: [0, 'min(1,N_r)'], single: [0, 'min(1,N_r)*max(0,2-N_r)'], head: [0, 'min(2,N_r)'], corr: [0, 'max(0,N_r-2)'], corr_prefix: [0, 'max(0,N_r-3)'],
          corr_final: ['max(0,N_r-3)', 'max(0,N_r-2)'], tail: ['max(0,N_r-2)', N_r], u: [0, 4]}
        resource:
          Qpack: {space: SMEM, shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}
          PageIndex: {space: SMEM, shape: [{page_index: 4}], dtype: int32, slot: 4, view: {PageIndex(i): {slot: i%4}}}
          KV:
            space: SMEM
            shape: [{element: 16384*KVStageCount}]
            dtype: fp8_e4m3fn
            view:
              Kslice(i,u): {part: {element: ['16384*Kslot(i,u)', '16384*(Kslot(i,u)+1)']}}
              Vslice(i,u): {part: {element: ['16384*Vslot(i,u)', '16384*(Vslot(i,u)+1)']}}
              Ostage: {part: {element: [0, 2*D*PackedColumns]}, dtype: bf16}
          ScoreBlock: {space: TMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32, slot: ScoreStageCount, view: {ScoreBlock(i): {slot: i%ScoreStageCount}}}
          P_hi: {space: SMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot: 4, view: {P_hi(i): {slot: i%4}}}
          P_lo: {space: SMEM, shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot: 4, view: {P_lo(i): {slot: i%4}}}
          Y: {space: TMEM, shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, slot: 2, view: {Y(i): {slot: i%2}}}
          ExponentialSum: {space: TMEM, shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32, slot: 2, view: {ExponentialSum(i): {slot: i%2}}}
          Maximum: {space: SMEM, shape: [{packed_query: PackedColumns}], dtype: fp32, view: {m: {}, Normalization: {}}}
          FinalSum: {space: SMEM, shape: [{packed_query: PackedColumns}, {warp: 4}], dtype: fp32}
          ClusterStatistic: {space: SMEM, shape: [{packed_query: PackedColumns}, {round: 4}, {statistic: 2}], dtype: fp32}
          Lbase: {space: register, shape: [{partial: 128}, {packed_query: PackedColumns}, {parity: 2}], dtype: fp32}
          TailNumerator: {space: register, shape: [{age: 2}, {d: D}, {packed_query: PackedColumns}], dtype: fp32}
        lane:
          LoadK:
            info:
              member: warp[2:3]
              mode: async
              verb:
                advance: {mode: sync, meaning: 'Complete PageIndex(i), prefetch i+1 before the K issue turn, and cycle four slots. For Lead=2 and i+4<N_r, V capture before same-slot
                    prefetch overwrite is unproved: no established cross-role ordering proof protects this page-slot reuse.'}
                load: Load Q once before K. Acquire four K slices independently; reuse waits for their prior KQ/VP operand reads, and transfers complete per slice. The K/V issue-turn
                  protocol admits K0..K(Lead),V0,K(Lead+1),V1,... and the V tail; each final-slice acquisition releases the peer before transfer completion. Short loops relay no-payload
                  turns; N_r=0 skips the protocol.
                prepare:
                  mode: sync
                  meaning: |
                    Use the fixed TableWidth stride to prefetch the first four page indices while the
                    sequence-length fetch, descriptor prefetch and TMEM/pipeline setup progress.
                    The initial lookup does not wait for seq_lens; unused entries may be -1 or name finite cache data,
                    which the subsequent score mask excludes. Join CTA setup, including initialized statistics,
                    before any stream work or empty-split handling; Q is then issued independently of later page lookups.
                    The first page-table address is b*TableWidth+4*r.
                    The startup cluster rendezvous publishes every member's DSMEM statistic/zero_done receiver initialization; it does not wait for output zeroing.
                    Empty CTAs bypass stream-role register redistribution; their reduction warp retains the launch allocation.
                    Let R=PackedColumns, T=512, Csm=232448.
                    T is in TMEM columns and Csm is in bytes; these are the values returned by
                    the original sm_100 helper calls in CUTLASS DSL 4.6.1.
                    ScoreStageCount=min(4,floor((T-6*R)/(2*R))); Lead=min(2,ScoreStageCount-1).
                    Allocate next_power_of_two((6+2*ScoreStageCount)*R) TMEM columns.
                    A=180+2324*R+16*ScoreStageCount+(32*R+88); pad=128-A%128; K0=floor((Csm-A-pad)/16384);
                    KVStageCount=K0-int(16*K0>pad). Kslot(i,u)=(4*i+4*max(i-Lead,0)+u)%KVStageCount;
                    Vslot(i,u)=(4*(i+min(i+Lead+1,N_r))+u)%KVStageCount.
                    Each slice is 128-key by 128-d FP8; u orders key-half then d-half.
              register: 64
            pipe: {prologue: ['prepare:Startup'], steady: [{repeat: active, steady: ['load:Qpack', {repeat: i, steady: ['advance:PageIndex(i)', 'load:Kblk(i)']}]}]}
            edge: {data: {'prepare:Startup': ['Softmax/initialize:Statistic']}}
          LoadV:
            info: {member: 'warp[3:4]', mode: async, verb: {load: Capture PageIndex(i); load four V slices under the K/V issue-turn and per-slice reuse protocols defined by LoadK/load.,
                store: 'For N_r>0, wait for Ostage and acquire member 0 zero_done, execute an async-proxy fence, then BF16 TMA reduce-add to out; N_r=0 adds nothing.'}, register: 64}
            pipe: {repeat: i, steady: ['load:Vblk(i)'], epilogue: ['store:output_tile']}
            edge: {data: {'load:Vblk(i)': ['LoadK/advance:PageIndex(i)'], 'store:output_tile': ['Correction/publish:Ostage']}}
          Score:
            info: {member: 'warp[0:1]', mode: async, verb: {release: {mode: sync, meaning: Guarantee completion of K operand reads for the Ostage alias; no additional collective
                    barrier.}, wait: {mode: sync, meaning: Join Correction's existing FinalSum rendezvous; completion admits this lane's sum read and Correction's final Y capture.},
                reduce: {mode: sync, meaning: 'After FinalMaximum, exchange maxima with peer r xor 2^j for j=0..log2(SplitCount)-1; each DSMEM transfer completes before the next
                    round.'}, publish: {mode: sync, meaning: 'Sum four local warp entries, rescale to ClusterMax, repeat the XOR tree for denominators, and publish Normalization
                    over Maximum.'}, score: 'Acquire a score slot; form two 128-key products reduced over both 128-d slices. Return K slices after operand reads; publish only the
                  complete ScoreBlock. An independent KQ/VP issue-turn protocol follows the same Lead window as K/V loads, releasing its peer on final operand acquisition; short
                  loops relay no-payload turns, and N_r=0 skips it. Wait for each operand slice separately; later transfers may overlap earlier products.'}, register: 64}
            pipe: {repeat: i, steady: ['score:ScoreBlock(i)'], epilogue: ['release:K_reads', 'reduce:ClusterMax', 'wait:FinalSum', 'publish:Normalization']}
            edge:
              data: {'reduce:ClusterMax': ['Correction/publish:FinalMaximum'], 'wait:FinalSum': ['Correction/publish:FinalSum'], 'score:ScoreBlock(i)': ['LoadK/load:Qpack']}
              reuse: {'score:ScoreBlock(i+ScoreStageCount)': ['Softmax/read:ScoreBlock(i)']}
          Value:
            info: {member: 'warp[1:2]', mode: async, verb: {release: {mode: sync, meaning: 'Guarantee V/P operand reads complete, without waiting for final Y capture or adding a
                    collective barrier.'}, retire: {mode: sync, meaning: 'Free TMEM after Correction returns the final Y slots, or immediately for N_r=0; final normalization and
                    Ostage publication need not finish first.'}, accumulate: P_pair is P_hi/P_lo. Acquire Y after initialization/correction; accumulate leading then residual per
                  V slice. Return each V slice after both component reads; release_p returns the P slot. N_r=1 also signals the initialized empty Y parity. Follow Score/score's
                  KQ/VP issue-turn protocol. Wait for each operand slice separately; later transfers may overlap earlier products., release_p: 'Signal completion of all leading/residual
                  P operand reads for block i, returning its P-ring slot independently of the Y result-commit notification; no Correction wait is involved.'}, register: 64}
            pipe: {repeat: i, steady: ['accumulate:Y(i)', 'release_p:P_pair(i)'], epilogue: ['release:V_reads', 'retire:TMEM']}
            edge:
              data: {'accumulate:Y(i)': ['Correction/zero:Y', 'Softmax/publish:P_pair(i)'], 'accumulate:Y(i+2)': ['Correction/rescale:Y(i)'], 'retire:TMEM': ['LoadK/prepare:Startup']}
              reuse: {'retire:TMEM': ['Correction/capture:Y(tail)']}
          Softmax:
            info: {member: 'warp[4:8]', register: 168, verb: {initialize: 'CTA setup initializes the shared maximum to -inf and FinalSum to zero, even for empty splits.', prepare: 'For
                  N_r=1, signal initialized ExponentialSum parity 1 before the block loop; otherwise this action is a no-op.', read: 'Capture raw ScoreBlock in registers and immediately
                  return its TMEM slot. Let last=ceil(seq_lens[b]/Bk)-1. Apply the contract mask in registers only for logical block last when q_len_per_req>1 or seq_lens[b]%Bk!=0,
                  and also last-1 when 0<seq_lens[b]%Bk<q_len_per_req; interior blocks are mask-free.', publish_max: 'Update/capture m; the next update waits for Correction to capture
                  it. Acquire the P-ring slot before publishing this maximum to Correction, as in the source maximum rendezvous.', publish: 'Publish P_hi/P_lo together, then the
                  independent ExponentialSum parity.'}}
            pipe: {prologue: ['initialize:Statistic', 'prepare:EmptySum'], repeat: i, steady: ['read:ScoreBlock(i)', 'publish_max:m(i)', 'publish:P_pair(i)', 'publish:ExponentialSum(i)']}
            edge:
              data: {'read:ScoreBlock(i)': ['Score/score:ScoreBlock(i)'], 'prepare:EmptySum': ['LoadK/prepare:Startup']}
              reuse: {'publish_max:m(i+4)': ['Value/release_p:P_pair(i)'], 'publish:ExponentialSum(i+2)': ['Correction/read:ExponentialSum(i)']}
              sync: {'publish_max:m(active)': ['Correction/zero:Y'], 'publish_max:m(i+1)': ['Correction/read:m(i)']}
          Correction:
            info: {member: 'warp[8:12]', verb: {zero: 'For N_r>0 initialize both Y slots, empty sum parity 1 and Lbase; fence before admitting softmax. N_r=0 retains setup statistics.
                  For output, member 0''s first correction warp writes BF16 zero, fences at GPU scope and notifies all peers through DSMEM zero_done during the ramp.', read: 'Capture
                  and release m or ExponentialSum, retaining two maxima and Lbase parities. For N_r=1 drain initialized sum parity 1 before valid parity 0.', rescale: 'With captured
                  m(i+2), wait for Y(i), correct that numerator, fence its TMEM writes and return the slot for block i+2; the denominator update follows separately.', capture: 'Each
                  tail action captures its Y parity into the corresponding older/newer entry of TailNumerator and returns that TMEM slot. For N_r=1, the sole action first drains
                  initialized empty parity 1, then valid parity 0. Retain both register entries through Ostage formation.', publish: FinalMaximum releases the final m before the
                  last parity correction. FinalSum publishes four warp sums (zero for N_r=0) and arrives at Score's rendezvous. Ostage normalizes and casts captured Y to BF16 over
                  the retired KV region; N_r=0 has no payload., update: Update the target Lbase from its parity predecessor and the just-captured exponential sum using step parity;
                  this register work follows Y-slot return and can overlap the next VP product.}, register: 256}
            pipe: {steady: [{repeat: active, steady: ['zero:Y', 'zero:output', {repeat: head, steady: ['read:m(head)']}, {repeat: corr_prefix, steady: ['read:ExponentialSum(corr_prefix)',
                        'read:m(corr_prefix+2)', 'rescale:Y(corr_prefix)', 'update:Lbase(corr_prefix+2)']}, {repeat: corr_final, steady: ['read:ExponentialSum(corr_final)', 'read:m(corr_final+2)']}]},
                'publish:FinalMaximum', {repeat: corr_final, steady: ['rescale:Y(corr_final)', 'update:Lbase(corr_final+2)']}, {repeat: tail, steady: ['read:ExponentialSum(tail)']},
                'publish:FinalSum', {repeat: tail, steady: ['capture:Y(tail)']}, 'publish:Ostage']}
            edge:
              data: {'publish:FinalMaximum': ['LoadK/prepare:Startup'], 'rescale:Y(corr)': ['Value/accumulate:Y(corr)'], 'capture:Y(tail)': ['Value/accumulate:Y(tail)'], 'read:m(i)': [
                  'Softmax/publish_max:m(i)'], 'read:ExponentialSum(i)': ['Softmax/publish:ExponentialSum(i)'], 'read:ExponentialSum(single)': ['Softmax/prepare:EmptySum'], 'publish:Ostage': [
                  'Score/publish:Normalization'], 'zero:Y': ['LoadK/prepare:Startup']}
              reuse: {'publish:Ostage': ['Score/release:K_reads', 'Value/release:V_reads']}
              sync: {'capture:Y(tail)': ['Score/wait:FinalSum']}
realization:
  require:
  - item: ['design.tile_pipeline::attention.Score', 'design.tile_pipeline::attention.Value']
