META_DATA:
  Name: paged_grouped_query_decode_attention
  Describe: Compute right-aligned causal attention against a paged FP8 KV cache and overwrite the supplied BF16 output
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/fa4_decode/aka_solution/solution.py::Model.forward
  Version: 9
  Dispatch:
    id: q1_global
    when: 'q_len_per_req=1; batchcount=16; 24576<=max_seq_len<32768; 128*pagecount>=batchcount*max_seq_len; 5*batchcount*max_seq_len>=576*pagecount; fixed S=16 global combine. Steady native cache hit: same objects/signature, thread/current device, outside stream capture.'
DESIGN:
  Math_reshape:
    from: root
  Work_schedule:
    Thesis: Independent split CTAs publish FP32 partials; a separate query-head CTA normalizes under PDL
    Step:
      PARTIAL:
        Describe: Produce split online statistics and output numerators
        Decomposition:
          Strategy: bk=256; querytile=1; packedcolumns=headcount*querytile; splitcount=16; worksplit(b)=splitcount; N_r=max(0,ceil((T_b-r)/splitcount))
          Partition:
            batch: {meaning: Request coordinate, size: batchcount, tile: 1}
            query_tail: {meaning: Query-tail tile coordinate, size: q_len_per_req, tile: querytile}
            split: {meaning: KV stripe coordinate, size: splitcount, tile: 1}
          Worktile:
            Invariant:
              qpack: {meaning: Resident packed queries, shape: [{packed_query: packedcolumns}, {d: channels}], dtype: fp8_e4m3fn}
              seq_lens: {meaning: Current request length, shape: [{batch: 1}], dtype: int32}
            Iteration:
              kblk: {meaning: Paged kblk block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn, direction: ascending}
              vblk: {meaning: Paged vblk block, shape: [{kv: bk}, {d: channels}], dtype: fp8_e4m3fn, direction: ascending}
          Target:
            Single_tile:
              mpartial: {meaning: Split mpartial, shape: [{query_tail: querytile}, {head: headcount}], dtype: fp32}
              lpartial: {meaning: Split lpartial, shape: [{query_tail: querytile}, {head: headcount}], dtype: fp32}
              opartial: {meaning: Split opartial, shape: [{query_tail: querytile}, {head: headcount}, {d: channels}], dtype: fp32}
        Mapping:
          Worker: {unit: cta, unit_count: 1}
          Worker_count: worktile_count
        Schedule:
          Strategy: Steady native cache hit on the same tensor objects/signature, thread and current device; outside stream capture
          Worktile_order:
            - {by: batch, direction: ascending}
            - {by: query_tail, direction: ascending}
            - {by: split, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
      COMBINE:
        Describe: Normalize all nominal splits for one query head
        Decomposition:
          Partition:
            batch: {meaning: Request coordinate, size: batchcount, tile: 1}
            query_tail: {meaning: Tail-query coordinate, size: q_len_per_req, tile: 1}
            head: {meaning: Query-head coordinate, size: headcount, tile: 1}
          Worktile:
            Invariant:
              mpartial: {meaning: Split mpartial, shape: [{split: splitcount}], dtype: fp32}
              lpartial: {meaning: Split lpartial, shape: [{split: splitcount}], dtype: fp32}
            Iteration: {opartial: {meaning: Nominal split numerator, shape: [{split: 1}, {d: channels}], dtype: fp32, direction: ascending}}
          Target:
            Single_tile: {output: {meaning: Final output vector, shape: [{d: channels}], dtype: bf16}}
            Tile_reduction: {dimension: split, input: [mpartial, lpartial, opartial], output: output, method: 'DESIGN.Math_reshape::normalize'}
        Mapping:
          Worker: {unit: cta, unit_count: 1}
          Worker_count: worktile_count
        Schedule:
          Worktile_order:
            - {by: batch, direction: ascending}
            - {by: query_tail, direction: ascending}
            - {by: head, direction: ascending}
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
    Flow:
      Launch:
        - {step: [PARTIAL]}
        - {step: [COMBINE], start_after: PARTIAL.launch_ready}
      Handoff:
        mpartial: {producer: PARTIAL, consumer: [COMBINE], storage: global, ready: PARTIAL.kernel_done, wait_at: COMBINE.read_partial}
        lpartial: {producer: PARTIAL, consumer: [COMBINE], storage: global, ready: PARTIAL.kernel_done, wait_at: COMBINE.read_partial}
        opartial: {producer: PARTIAL, consumer: [COMBINE], storage: global, ready: PARTIAL.kernel_done, wait_at: COMBINE.read_partial}
  Tile_pipeline:
    Thesis: A two-iteration issue lead overlaps KQ, softmax and parity correction; operand completion protects ring reuse while peer turns permit earlier issue
    Step:
      PARTIAL:
        Index:
          i: {meaning: Local stripe iteration, definition: [0, N]}
          u: {meaning: Operand slice within one block, definition: [0, 4]}
          tail: {meaning: Populated final numerator iterations, definition: ['max(0,N-2)', N]}
        Storage:
          qpack: {meaning: Resident packed queries, depth: 1, location: smem, shape: [{packed_query: packedcolumns}, {d: channels}],
            dtype: fp8_e4m3fn, total_size: 1*(packedcolumns*channels)}
          pageindex: {meaning: Page lookup ring, depth: 4, location: smem, shape: [{page_index: 4}],
            dtype: int32, total_size: 64, view: {pageindex(i): {slot_index: i%4}}}
          kv: {meaning: Shared key/value and output region, depth: 1, location: smem, shape: [{element: 163840}],
            dtype: fp8_e4m3fn, total_size: 163840, view: {'kslice(i,u)': {region: {element: ['16384*kslot(i,u)', '16384*(kslot(i,u)+1)']}}, 'vslice(i,u)': {region: {element: ['16384*vslot(i,u)', '16384*(vslot(i,u)+1)']}}, ostage: {region: {element: [0, 4*channels*packedcolumns]}}}}
          scoreblock: {meaning: Score accumulator ring, depth: 4, location: tmem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(16*bk*packedcolumns), view: {scoreblock(i): {slot_index: i%4}}}
          p_hi: {meaning: Leading probability ring, depth: 4, location: smem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp8_e4m3fn, total_size: 1*(4*bk*packedcolumns), view: {p_hi(i): {slot_index: i%4}}}
          p_lo: {meaning: Residual probability ring, depth: 4, location: smem, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp8_e4m3fn, total_size: 1*(4*bk*packedcolumns), view: {p_lo(i): {slot_index: i%4}}}
          y: {meaning: numerator parity pair, depth: 2, location: tmem, shape: [{d: channels}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(8*channels*packedcolumns), view: {y(i): {slot_index: i%2}}}
          exponentialsum: {meaning: Unrounded sum parity pair, depth: 2, location: tmem, shape: [{partial: 128}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(1024*packedcolumns), view: {exponentialsum(i): {slot_index: i%2}}}
          maximum: {meaning: Shared maximum then normalization, depth: 1, location: smem, shape: [{packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(4*packedcolumns), view: {m: {}}}
          finalsum: {meaning: Final denominator warp partials, depth: 1, location: smem, shape: [{packed_query: packedcolumns}, {warp: 4}],
            dtype: fp32, total_size: 1*(16*packedcolumns)}
          lbase: {meaning: Correction denominator state, depth: 1, location: register, shape: [{partial: 128}, {packed_query: packedcolumns}, {parity: 2}],
            dtype: fp32, total_size: 1*(1024*packedcolumns)}
          tailnumerator: {meaning: Captured final numerator pair, depth: 1, location: register, shape: [{age: 2}, {d: channels}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(8*channels*packedcolumns)}
          scorecopy: {meaning: Captured scores then exponentials, depth: 2, location: register, shape: [{kv: bk}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1*(8*bk*packedcolumns), view: {scorecopy(i): {slot_index: i%2}}}
          pagecopy: {meaning: K and V private page snapshots, depth: 1, location: register, shape: [{role: 2}, {page_index: 4}],
            dtype: int32, total_size: 32}
          maximumhistory: {meaning: Retained correction maxima, depth: 1, location: register, shape: [{warp: 4}, {packed_query: packedcolumns}, {age: 3}],
            dtype: fp32, total_size: 48*packedcolumns}
          softmaxmaximum: {meaning: Captured softmax maximum vectors, depth: 1, location: register, shape: [{group: 2}, {partial: 128}, {packed_query: packedcolumns}],
            dtype: fp32, total_size: 1024*packedcolumns}
        Role:
          LOADK:
            Info:
              Describe: Prepare the CTA and load paged keys
              Member: warp[2:3]
              Using_verb:
                load:
                  startup: {execution_mode: serial, describe: Prefetch pageindex/length; join CTA initialization of TMEM and maximum=-inf/finalsum=0; bind N=N_r after cp.async and CTA sync}
                  query: {execution_mode: async_unordered, describe: TMA-load query into qpack; done includes query barrier completion}
                  nextpages: {execution_mode: async_unordered, describe: 'Prefetch pageindex(i+1) before the K turn; unproved: same-slot overwrite waits for the delayed V pagecopy'}
                  pagecopy: {execution_mode: serial, describe: Capture completed pageindex(i) into the K part of pagecopy before obtaining the K issue turn}
                  key: {execution_mode: async_unordered, describe: 'TMA-copy the acquired kslice(i,u) from pagecopy; done is this slice transaction completion'}
                await: {turn: {execution_mode: serial, describe: Obtain the K issue turn; short loops relay the two no-payload ramp/tail turns}}
                signal: {turn: {execution_mode: serial, describe: Release the V issue turn after final K slot acquisition and before its transfer; earlier transfers may remain in flight}}
                acquire: {key: {execution_mode: serial, describe: 'Acquire kslot(i,u) in the shared KV pipeline; wait its previous operand-consumer release; first use is free'}}
            Pipe:
              - load:startup
              - if(N > 0):
                  - load:query
                  - for(i):
                      - if(i+1 < N):
                          - load:nextpages(i)
                      - load:pagecopy(i)
                      - await:turn(i)
                      - for(u):
                          - acquire:key(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - load:key(i,u)
            Waiting:
              Prepared: ['{issue load:pagecopy(i+1)} ← [{done load:nextpages(i)}]']
              Allowed: ['{done await:turn(i+3)} ← [{done LOADV::signal:turn(i)}]']
          LOADV:
            Info:
              Describe: Load paged values and transfer the final output
              Member: warp[3:4]
              Using_verb:
                load:
                  pagecopy: {execution_mode: serial, describe: Capture pageindex(i) into the V part of pagecopy; this ends the last page-ring reader}
                  value: {execution_mode: async_unordered, describe: 'TMA-copy acquired vslice(i,u) using the captured pages; done is this slice transaction completion'}
                store: {output: {execution_mode: async_unordered, describe: TMA-copy ostage into opartial for this active split}}
                await:
                  startup: {execution_mode: serial, describe: Join LoadK startup before testing N}
                  turn: {execution_mode: serial, describe: 'Obtain the V issue turn, including the fixed two-turn ramp and tail relays'}
                signal: {turn: {execution_mode: serial, describe: Release the K issue turn after final V slot acquisition and before its transfer; transfers may remain in flight}}
                acquire: {value: {execution_mode: serial, describe: 'Acquire vslot(i,u) in the shared KV pipeline; wait its previous operand-consumer release; first use is free'}}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - load:pagecopy(i)
                      - for(u):
                          - acquire:value(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - load:value(i,u)
                  - store:output
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue store:output} ← [{done CORRECTION::compute:output}]'
              Allowed: ['{done await:turn(i)} ← [{done LOADK::signal:turn(min(i+2,N-1))}]']
          SCORE:
            Info:
              Describe: Issue key-query products and reduce final statistics
              Member: warp[0:1]
              Using_verb:
                compute: {sum: {execution_mode: async_unordered, describe: 'Reduce the four finalsum entries and write lpartial, including zero on an empty split'}}
                matmul: {key@query: {execution_mode: async_ordered, describe: 'Accumulate kslice(i,u) with the matching qpack half into scoreblock(i); same KQ queue preserves slice order'}}
                store: {maximum: {execution_mode: async_unordered, describe: 'Write mpartial from the final maximum snapshot, including -inf on an empty split'}}
                await:
                  sum_ready: {execution_mode: serial, describe: Join Correction finalsum rendezvous; permit its final Y capture}
                  startup: {execution_mode: serial, describe: Join LoadK setup before reading N}
                  turn: {execution_mode: serial, describe: Obtain the KQ issue turn; no-payload ramp/tail handshakes retain the source lead of two}
                  score_even: {execution_mode: serial, describe: Await earlier even WG capture before reusing its score slot}
                  score_odd: {execution_mode: serial, describe: Await earlier odd WG capture before reusing its score slot}
                signal:
                  turn: {execution_mode: serial, describe: 'Release the VP issue turn after final K operand acquisition, before its MMA; this is not score completion'}
                  score: {execution_mode: async_unordered, describe: Commit scoreblock(i) readiness after all four slice products}
                  launch_ready: {execution_mode: serial, describe: 'Call griddepcontrol_launch_dependents after statistics epilogue; contributes to grid permission, not output completion'}
                acquire:
                  score: {execution_mode: serial, describe: Acquire scoreblock(i) after its earlier softmax capture; the first four slots are free}
                  key: {execution_mode: serial, describe: 'Wait kslice(i,u) transaction completion and retain the KV consumer handle'}
                release: {key: {execution_mode: async_unordered, describe: 'Return kslice(i,u) through its UMMA consumer commit when operand reads finish'}}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - if(i >= 4 and i%2 == 0):
                          - await:score_even(i)
                      - if(i >= 4 and i%2 == 1):
                          - await:score_odd(i)
                      - acquire:score(i)
                      - for(u):
                          - acquire:key(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - matmul:key(i,u)@query
                          - release:key(i,u)
                      - signal:score(i)
              - store:maximum
              - await:sum_ready
              - compute:sum
              - signal:launch_ready
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue matmul:key(i,u)@query} ← [{done LOADK::load:query}]'
                - '{done acquire:key(i,u)} ← [{done LOADK::load:key(i,u)}]'
                - '{done signal:score(i)} ← [{done matmul:key(i,3)@query}]'
                - '{issue store:maximum} ← [{done CORRECTION::signal:maximum}]'
                - '{done await:sum_ready} ← [{done CORRECTION::compute:sum}]'
              Released:
                - '{done await:score_even(i)} ← [{done SOFTMAXEVEN::load:score(i-4)}]'
                - '{done await:score_odd(i)} ← [{done SOFTMAXODD::load:score(i-4)}]'
              Allowed:
                - '{done await:turn(i+3)} ← [{done VALUE::signal:turn(i)}]'
                - '{done release:key(i,u)} ← [{issue matmul:key(i,u)@query}]'
          VALUE:
            Info:
              Describe: Issue both probability products and retire TMEM
              Member: warp[1:2]
              Using_verb:
                matmul: {value@probability: {execution_mode: async_ordered, describe: Accumulate each V slice with p_hi then p_lo into Y(i); the VP queue preserves native slice order}}
                await:
                  startup: {execution_mode: serial, describe: Join LoadK setup before reading N}
                  turn: {execution_mode: serial, describe: Obtain VP issue permission; KQ may still have unfinished products}
                  prob_even: {execution_mode: serial, describe: Await even WG probability pair commit}
                  prob_odd: {execution_mode: serial, describe: Await odd WG probability pair commit}
                signal:
                  turn: {execution_mode: serial, describe: 'Release KQ issue permission after final V/P operand acquisition, before its MMA; Y need not be complete'}
                  numerator: {execution_mode: async_unordered, describe: Commit the updated Y(i) for Correction after all slice products}
                  empty: {execution_mode: serial, describe: Commit the initialized empty Y parity 1 when N=1; no extra value product}
                acquire:
                  numerator: {execution_mode: serial, describe: Acquire initialized or corrected Y(i) and the committed p_hi/p_lo pair for this iteration}
                  value: {execution_mode: serial, describe: 'Wait vslice(i,u) completion and retain its KV consumer handle'}
                release:
                  value: {execution_mode: async_unordered, describe: 'Return vslice(i,u) after both probability components finish reading it'}
                  probability: {execution_mode: async_unordered, describe: Return p_hi/p_lo(i) after all VP operand reads; independent of Y result readiness}
                  tmem: {execution_mode: serial, describe: Deallocate TMEM after Correction returns both final Y slots; empty splits free the initial allocation}
                  empty_tmem: {execution_mode: serial, describe: 'Release and deallocate the TMEM allocation for N=0; no score, probability or numerator was consumed'}
            Pipe:
              - await:startup
              - if(N > 0):
                  - for(i):
                      - await:turn(i)
                      - if(i%2 == 0):
                          - await:prob_even(i)
                      - if(i%2 == 1):
                          - await:prob_odd(i)
                      - acquire:numerator(i)
                      - for(u):
                          - acquire:value(i,u)
                          - if(u == 3):
                              - signal:turn(i)
                          - matmul:value(i,u)@probability(i)
                          - release:value(i,u)
                      - release:probability(i)
                      - signal:numerator(i)
                  - if(N == 1):
                      - signal:empty
              - if(N > 0):
                  - release:tmem
              - if(N == 0):
                  - release:empty_tmem
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{done acquire:value(i,u)} ← [{done LOADV::load:value(i,u)}]'
                - '{done signal:numerator(i)} ← [{done matmul:value(i,3)@probability(i)}]'
                - '{done acquire:numerator(i)} ← [{done CORRECTION::compute:zero}]'
                - '{done await:prob_even(i)} ← [{done SOFTMAXEVEN::compute:probability(i)}]'
                - '{done await:prob_odd(i)} ← [{done SOFTMAXODD::compute:probability(i)}]'
              Released:
                - '{done acquire:numerator(i+2)} ← [{done CORRECTION::compute:correct(i)}]'
                - '{issue release:tmem} ← [{done CORRECTION::release:tail}]'
              Allowed:
                - '{done await:turn(i)} ← [{done SCORE::signal:turn(min(i+2,N-1))}]'
                - '{done release:value(i,u)} ← [{issue matmul:value(i,u)@probability(i)}]'
                - '{done release:probability(i)} ← [{issue matmul:value(i,3)@probability(i)}]'
          CORRECTION:
            Info:
              Describe: Correct both numerator parities and form output staging
              Member: warp[12:16]
              Using_verb:
                compute:
                  zero: {execution_mode: serial, describe: 'Initialize both Y slots, empty exponentialsum parity 1 and lbase=0; fence before releasing the first maximum turn'}
                  correct: {execution_mode: serial, describe: 'Using captured m(i) and m(i+2), rescale Y(i), fence TMEM writes and return the slot for VP iteration i+2'}
                  denominator: {execution_mode: serial, describe: Update lbase(i+2) from captured exponentialsum(i) after returning its corrected numerator slot}
                  sum: {execution_mode: serial, describe: Publish finalsum from both sum parities; on N=0 retain setup zeros and signal the reduction rendezvous}
                  output: {execution_mode: serial, describe: Combine tailnumerator into ylocal and stage FP32 ostage in the retired KV region}
                load:
                  empty_sum: {execution_mode: serial, describe: 'For N=1, capture and return the initialized empty exponentialsum parity 1 before parity 0'}
                  empty_numerator: {execution_mode: serial, describe: 'For N=1, capture initialized Y parity 1 into tailnumerator and return that TMEM slot'}
                  numerator: {execution_mode: serial, describe: Capture populated final Y(tail) into tailnumerator and return its TMEM slot}
                  maximum_even: {execution_mode: serial, describe: Capture m(i) into maximumhistory and return the shared maximum update turn}
                  maximum_odd: {execution_mode: serial, describe: Capture m(i) into maximumhistory and return the shared maximum update turn}
                  sum_even: {execution_mode: serial, describe: Capture exponentialsum(i) from TMEM into correction registers and return that parity}
                  sum_odd: {execution_mode: serial, describe: Capture exponentialsum(i) from TMEM into correction registers and return that parity}
                await:
                  startup: {execution_mode: serial, describe: Join CTA setup before testing N}
                  sum_ready: {execution_mode: serial, describe: Join Score finalsum rendezvous before capturing the final Y pair}
                signal: {maximum: {execution_mode: serial, describe: Notify Score that the final maximum can be captured; on N=0 use setup -inf}}
                release: {tail: {execution_mode: serial, describe: Both final Y slots have been captured and returned; Value may free TMEM before output formation}}
            Pipe:
              - await:startup
              - if(N > 0):
                  - compute:zero
                  - for(i[0:min(2,N)]):
                      - if((i)%2 == 0):
                          - load:maximum_even(i)
                      - if((i)%2 == 1):
                          - load:maximum_odd(i)
                  - for(i[0:max(0,N-2)]):
                      - if((i)%2 == 0):
                          - load:sum_even(i)
                      - if((i)%2 == 1):
                          - load:sum_odd(i)
                      - if((i+2)%2 == 0):
                          - load:maximum_even(i+2)
                      - if((i+2)%2 == 1):
                          - load:maximum_odd(i+2)
                      - if(i == N-3):
                          - signal:maximum
                      - compute:correct(i)
                      - compute:denominator(i)
                  - if(N <= 2):
                      - signal:maximum
                  - if(N == 1):
                      - load:empty_sum
                  - for(tail):
                      - if((tail)%2 == 0):
                          - load:sum_even(tail)
                      - if((tail)%2 == 1):
                          - load:sum_odd(tail)
                  - compute:sum
                  - await:sum_ready
                  - if(N == 1):
                      - load:empty_numerator
                  - for(tail):
                      - load:numerator(tail)
                  - release:tail
                  - compute:output
              - if(N == 0):
                  - signal:maximum
                  - compute:sum
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue load:empty_sum} ← [{done SOFTMAXODD::signal:empty_sum}]'
                - '{issue compute:correct(i)} ← [{done VALUE::signal:numerator(i)}]'
                - '{issue load:numerator(tail)} ← [{done VALUE::signal:numerator(tail)}]'
                - '{issue load:empty_numerator} ← [{done VALUE::signal:empty}]'
                - '{done await:sum_ready} ← [{done SCORE::await:sum_ready}]'
                - '{issue load:maximum_even(i)} ← [{done SOFTMAXEVEN::compute:maximum(i)}]'
                - '{issue load:maximum_odd(i)} ← [{done SOFTMAXODD::compute:maximum(i)}]'
                - '{issue load:sum_even(i)} ← [{done SOFTMAXEVEN::compute:sum(i)}]'
                - '{issue load:sum_odd(i)} ← [{done SOFTMAXODD::compute:sum(i)}]'
              Released: ['{issue compute:output} ← [{done SCORE::release:key(i,u)}, {done VALUE::release:value(i,u)}]']
          SOFTMAXEVEN:
            Info:
              Describe: Produce even score iterations and hand off the maximum mutex
              Member: warp[4:8]
              Using_verb:
                compute:
                  maximum: {execution_mode: serial, describe: Mask scorecopy on boundary tiles; update maximum and join the producer rendezvous; done publishes m(i)}
                  probability: {execution_mode: serial, describe: Use captured m(i) and scorecopy to form p_hi/p_lo in SMEM; fence and commit the pair}
                  sum: {execution_mode: serial, describe: Store exponentialsum(i) from unrounded exponentials into its TMEM parity; fence and notify Correction}
                load:
                  score: {execution_mode: serial, describe: 'Capture scoreblock(i) into scorecopy, fence the TMEM read and release its score slot'}
                  maximum: {execution_mode: serial, describe: Capture m(i) from maximum into softmaxmaximum after the producer rendezvous; then release this parity maximum mutex}
                await: {startup: {execution_mode: serial, describe: Join CTA setup before the N-dependent softmax path}}
                acquire:
                  maximum: {execution_mode: serial, describe: Acquire this parity maximum mutex and the Correction consumer turn before updating shared maximum}
                  probability: {execution_mode: serial, describe: Acquire both probability rings for i before exposing the new maximum to Correction}
            Pipe:
              - await:startup
              - for(i):
                  - if(i%2 == 0):
                      - load:score(i)
                      - acquire:maximum(i)
                      - acquire:probability(i)
                      - compute:maximum(i)
                      - load:maximum(i)
                      - compute:probability(i)
                      - compute:sum(i)
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue load:score(i)} ← [{done SCORE::signal:score(i)}]'
                - '{done acquire:maximum(i)} ← [{done CORRECTION::compute:zero}]'
                - '{done acquire:maximum(0)} ← [{done SOFTMAXODD::signal:initial_turn}]'
              Released:
                - '{done acquire:probability(i+4)} ← [{done VALUE::release:probability(i)}]'
                - '{done acquire:maximum(i+1)} ← [{done SOFTMAXODD::load:maximum(i)}]'
                - '{done acquire:maximum(i+1)} ← [{done CORRECTION::load:maximum_odd(i)}]'
                - '{issue compute:sum(i+2)} ← [{done CORRECTION::load:sum_even(i)}]'
          SOFTMAXODD:
            Info:
              Describe: Produce odd score iterations and hand off the maximum mutex
              Member: warp[8:12]
              Using_verb:
                compute:
                  maximum: {execution_mode: serial, describe: Mask scorecopy on boundary tiles; update maximum and join the producer rendezvous; done publishes m(i)}
                  probability: {execution_mode: serial, describe: Use captured m(i) and scorecopy to form p_hi/p_lo in SMEM; fence and commit the pair}
                  sum: {execution_mode: serial, describe: Store exponentialsum(i) from unrounded exponentials into its TMEM parity; fence and notify Correction}
                load:
                  score: {execution_mode: serial, describe: 'Capture scoreblock(i) into scorecopy, fence the TMEM read and release its score slot'}
                  maximum: {execution_mode: serial, describe: Capture m(i) from maximum into softmaxmaximum after the producer rendezvous; then release this parity maximum mutex}
                await: {startup: {execution_mode: serial, describe: Join CTA setup before the N-dependent softmax path}}
                signal:
                  empty_sum: {execution_mode: serial, describe: 'For N=1, notify Correction that initialized exponentialsum parity 1 is ready; no softmax work for that parity'}
                  initial_turn: {execution_mode: serial, describe: Advance odd S/P cursors and release the initial even maximum mutex for active work}
                acquire:
                  maximum: {execution_mode: serial, describe: Acquire this parity maximum mutex and the Correction consumer turn before updating shared maximum}
                  probability: {execution_mode: serial, describe: Acquire both probability rings for i before exposing the new maximum to Correction}
            Pipe:
              - await:startup
              - if(N > 0):
                  - signal:initial_turn
              - if(N == 1):
                  - signal:empty_sum
              - for(i):
                  - if(i%2 == 1):
                      - load:score(i)
                      - acquire:maximum(i)
                      - acquire:probability(i)
                      - compute:maximum(i)
                      - load:maximum(i)
                      - compute:probability(i)
                      - compute:sum(i)
            Waiting:
              Prepared:
                - '{done await:startup} ← [{done LOADK::load:startup}]'
                - '{issue load:score(i)} ← [{done SCORE::signal:score(i)}]'
                - '{done acquire:maximum(i)} ← [{done CORRECTION::compute:zero}]'
              Released:
                - '{done acquire:probability(i+4)} ← [{done VALUE::release:probability(i)}]'
                - '{done acquire:maximum(i+1)} ← [{done SOFTMAXEVEN::load:maximum(i)}]'
                - '{done acquire:maximum(i+1)} ← [{done CORRECTION::load:maximum_even(i)}]'
                - '{issue compute:sum(i+2)} ← [{done CORRECTION::load:sum_odd(i)}]'
      COMBINE:
        Event:
          read_partial: ['{done MAIN[0]::await:partial}']
        Storage:
          partialstatistic: {meaning: Split maximum and sum snapshots, depth: 1, location: smem, shape: [{statistic: 2}, {split: splitcount}],
            dtype: fp32, total_size: 8*splitcount}
          numerator: {meaning: Combined numerator and final output, depth: 1, location: register, shape: [{d: channels}],
            dtype: fp32, total_size: 4*channels}
        Role:
          MAIN:
            Info:
              Describe: Combine split statistics and overwrite one output vector
              Member: warp[0:4]
              Using_verb:
                compute:
                  weights: {execution_mode: serial, describe: Warp-reduce max and denominator; retain split weights; initialize numerator=0}
                  numerator: {execution_mode: serial, describe: Accumulate the weighted fragment into numerator in ascending nominal split order}
                  normalize: {execution_mode: serial, describe: 'Apply normalize to numerator, retaining the narrowed output until its final store'}
                load:
                  statistics: {execution_mode: serial, describe: 'Stage mpartial/lpartial into partialstatistic with cp.async, join copies and publish to the CTA'}
                  numerator: {execution_mode: serial, describe: Read opartial(r) into the local fragment even when its split weight is zero}
                store: {output: {execution_mode: serial, describe: Overwrite the owned BF16 out vector from the retained result}}
                await: {partial: {execution_mode: serial, describe: Execute griddepcontrol_wait before every partial input read}}
                signal: {launch_ready: {execution_mode: serial, describe: Call griddepcontrol_launch_dependents before the output store; this does not promise final output visibility}}
            Pipe:
              - await:partial
              - load:statistics
              - compute:weights
              - for(r=0:splitcount):
                  - load:numerator(r)
                  - compute:numerator(r)
              - compute:normalize
              - signal:launch_ready
              - store:output
REALIZATION:
  Require:
    - Item: DESIGN.Tile_pipeline::PARTIAL.LOADK
      Choice: 'Page/KV slots: Lead=2, ScoreStageCount=4, KVStageCount=10; kslot(i,u)=(4*i+4*max(i-2,0)+u)%KVStageCount; vslot(i,u)=(4*(i+min(i+3,N))+u)%KVStageCount'
      Reason: Shared KV producer/consumer handles order each slot; each slice is 128 by 128 FP8 elements, with u ordering key-half then channel-half
    - Item:
        - DESIGN.Tile_pipeline::PARTIAL.LOADK
        - DESIGN.Tile_pipeline::PARTIAL.LOADV
      Choice: Four pageindex slots; prefetch i+4 starts in K iteration i+3 before its V-turn wait. V capture of pageindex(i) may still be pending
      Reason: 'Source ordering is unresolved: Lead=2 and the capacity assertion do not prove read-before-overwrite; no extra barrier is added here'
    - Item:
        - DESIGN.Tile_pipeline::PARTIAL.SCORE
        - DESIGN.Tile_pipeline::PARTIAL.VALUE
      Choice: tcgen05.mma, FP8 E4M3FN operands and FP32 TMEM; independent KQ/VP queues and named-barrier issue turns; KV/P consumer commits release operands separately from S/O result commits
      Reason: acquire:key/value waits the prior owner release through the KV pipeline; signal:turn precedes the final slice MMA and cannot stand for completion
    - Item: DESIGN.Tile_pipeline::PARTIAL.LOADK
      Choice: Original sm_100 helpers return 512 TMEM columns and 232448 SMEM bytes. R=16; Sstage=min(4,floor((512-6*R)/(2*R))); allocate next_power_of_two((6+2*Sstage)*R) TMEM columns
      Reason: These are the matched helper values used by the source allocation calculation, not newly inferred device limits
    - Item: DESIGN.Tile_pipeline::PARTIAL.LOADK
      Choice: 'SMEM accounting: A=180+2324*R+16*Sstage+0; pad=128-A%128; K0=floor((232448-A-pad)/16384); KVStageCount=K0-int(16*K0>pad)'
      Reason: Includes metadata and barrier overhead, probability pairs and query storage; final ostage aliases the KV region after all operand reads
    - Item: DESIGN.Tile_pipeline::PARTIAL.CORRECTION
      Choice: TMEM load/store view fences; named-barrier maximum and sum handoffs; O consumer returns each captured tail slot before Value deallocates TMEM
      Reason: Final register normalization and output staging can continue after TMEM retirement
    - Item: DESIGN.Tile_pipeline::PARTIAL.LOADV
      Choice: TMA output transfer retains source storage and CTA/cluster lifetime until its source and completion obligations retire
      Reason: Kernel completion includes output visibility; a launch-ready notification may precede it
    - Item:
        - DESIGN.Tile_pipeline::PARTIAL.SOFTMAXEVEN
        - DESIGN.Tile_pipeline::PARTIAL.SOFTMAXODD
      Choice: 512-thread CTA with two softmax WGs, separate S/P cursors and alternating shared-maximum mutex; no Q4 register redistribution
      Reason: Each WG produces one L parity; for N=1 the odd WG only announces the initialized empty L parity
    - Item: CONTRACT.Algorithm_requirement::workspace_buffer
      Choice: 'Slice FP32 opartial, lpartial, mpartial and unused m: 4*batchcount*q_len_per_req*headcount*(splitcount*(channels+2)+1) bytes; no per-call clear'
      Reason: Empty splits leave opartial bits unchanged. Cross-(S,B,Q) reuse can reinterpret old -inf statistics as numerator data; zero-weight reads do not neutralize NaN
    - Item: DESIGN.Work_schedule::Flow
      Choice: PDL launch_dependents after partial statistics epilogue; combine griddepcontrol_wait precedes its first partial read; combine signals before final output store
      Reason: Launch permission, partial visibility and final output visibility are distinct guarantees
    - Item: DESIGN.Tile_pipeline::COMBINE.MAIN
      Choice: Four-warps warp-parallel combine; two d values per thread; unroll hint 16
      Reason: Warp statistics determine weights, and every nominal split payload is accumulated in ascending order
