meta_data:
  name: paged_grouped_query_decode_attention
  describe: Compute right-aligned causal attention against a paged FP8 KV cache; overwrite BF16 out.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_decode/aka_solution/solution.py::Model.forward
  version: 7
  dispatch:
    id: q4_compact
    parent: root
    when: |
      Let B=BatchCount, L=max_seq_len, P=PageCount, C=ceil(L/256), skew=(128*P<B*L),
      compact=(L>=24576 and ((not skew and B in {10,11}) or
        (skew and 10<=B<=17 and P>ceil(L/64)+16*(B-1) and (B<12 or P<B*ceil(L/64))))).
      Select exactly when q_len_per_req=4 and compact. Nominal S=8/32,
      near-uniform and proportional active counts share the serial-per-thread combine design.
design:
  math_reshape:
    thesis: Stripe KV blocks into shorter chains; keep two FP32 numerator parities and use leading/residual FP8 probabilities, trading an extra value product for no dense intermediate
      storage.
    rewrite:
    - step: stripe
      name: Pack query heads and stripe the logical key blocks
      math: |
        For request b and query block q, let x=h+HeadCount*t, 0<=t<QueryTile, 0<=h<HeadCount,
        t_abs=q*QueryTile+t, Qpack[x,:]=query[b*q_len_per_req+t_abs,h,:], and T_b=ceil(seq_lens[b]/Bk).
        For split r in [0,SplitCount), N_r=max(0,ceil((T_b-r)/WorkSplit(b))) if r<WorkSplit(b); otherwise 0.
        For 0<=i<N_r, 0<=u<Bk, k=(r+i*WorkSplit(b))*Bk+u:
          Let page=floor(k/PageSize); id=block_tables[b,page] if i=0 or page<ceil(seq_lens[b]/PageSize), otherwise -1.
          Kblk(i)[u,:]=kv_cache[id,0,0,k%PageSize,:], Vblk(i)[u,:]=kv_cache[id,1,0,k%PageSize,:] if id>=0; otherwise zero.
          ScoreBlock(i)=mm32(Kblk(i),Qpackᵀ).
      symbol:
        SplitCount: {meaning: Number of nominal KV splits., binding: 'bind:design.work_schedule::SplitCount'}
        WorkSplit: {meaning: Request-to-active-split-count map., binding: 'bind:design.work_schedule::WorkSplit'}
        Bk: {meaning: Logical key block length., binding: 'bind:design.work_schedule::Bk'}
        QueryTile: {meaning: Tail queries sharing one KV traversal., binding: 'bind:design.work_schedule::QueryTile'}
        PackedColumns: {meaning: 'Head-query column count, HeadCount*QueryTile.', binding: 'bind:design.work_schedule::PackedColumns'}
        Qpack: {meaning: Packed query-head and query-tail rows., shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn, retention: 'keep_value (b,q,r)'}
        Kblk: {meaning: Logical paged key block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        Vblk: {meaning: Logical paged value block., shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn}
        ScoreBlock: {meaning: Raw key-query product before the softmax mask., shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32}
    - step: exponent
      name: Use two FP8 components for each scaled exponential
      math: |
        For each (b,q,r), initialize m(-1)=-inf; c=fp32(bmm1_scale*log2(e)).
        For 0<=i<N_r:
          S(i)[u,x]=ScoreBlock(i)[u,x] if (r+i*WorkSplit(b))*Bk+u is in visible_key(b,q*QueryTile+floor(x/HeadCount)), otherwise -inf.
          m(i)[x]=max(m(i-1)[x],c*max(MinFinite,max_u S(i)[u,x])).
          Eblock(i)[u,x]=exp2_fast(c*S(i)[u,x]-m(i)[x]) on visible keys, otherwise zero.
          P_hi(i)=fp8_e4m3fn(rho*Eblock(i)); P_lo(i)=fp8_e4m3fn(rho*Eblock(i)-P_hi(i)).
          ExponentialSum(i)[v,x]=Eblock(i)[v,x]+Eblock(i)[v+128,x], 0<=v<128.
      symbol:
        rho: {meaning: Probability-operand scale., shape: [], dtype: fp32, value: 448}
        MinFinite: {meaning: Finite initializer of the masked score maximum., shape: [], dtype: fp32, value: -3.4028234663852886e+38}
        m: {meaning: Running base-two maximum., shape: [{packed_query: PackedColumns}], dtype: fp32, retention: 'carry_forward (b,q,r); i=-1..N_r-1'}
        P_hi: {meaning: Leading FP8 component of the scaled exponential., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        P_lo: {meaning: Independently rounded FP8 residual., shape: 'ref:ScoreBlock.shape', dtype: fp8_e4m3fn}
        ExponentialSum: {meaning: Unrounded per-thread probability partial sums., shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32}
      arithmetic: {approx: 'exp2_fast is the source''s fast-math base-two exponential; unknown: no verified error bound for this fast-exp2 path.'}
    - step: parity
      name: Carry two interleaved numerators and denominators
      math: |
        Initialize Y(-2)=Y(-1)=0; Lbase(0)=Lbase(1)=0; omit (b,q,r).
        For 0<=i<N_r:
          a(i)[x]=0 if i<2, otherwise exp2_fast(m(i-2)[x]-m(i)[x]).
          Y(i)=mma32(Vblk(i)ᵀ,P_lo(i),mma32(Vblk(i)ᵀ,P_hi(i),Y(i-2) ⊙ a(i)[None,:])).
          If i>=2: Lbase(i)=a(i)[None,:] ⊙ Lbase(i-2)+a(i)[None,:] ⊙ ExponentialSum(i-2).
        If N_r=0: Mlocal=-inf, Llocal=0; no Ylocal payload is produced.
        If N_r>0, let f=N_r-1, p=N_r-2; z=exp2_fast(m(p)-m(f)) if N_r>1, otherwise 1:
          Mlocal=m(f); Ylocal=Y(f)+(Y(p) ⊙ z[None,:] if N_r>1, otherwise zero).
          Lt=Lbase(f)+ExponentialSum(f)+(z[None,:] ⊙ (Lbase(p)+ExponentialSum(p)) if N_r>1, otherwise zero).
          FinalSum[x,g]=sum32_{v=32*g}^{32*g+31} Lt[v,x], 0<=g<4; Llocal[x]=sum32_g FinalSum[x,g].
      symbol:
        Y: {meaning: 'FP32 numerator of one parity, still scaled by rho.', shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, retention: 'carry_forward (b,q,r,parity); i=-2..N_r-1
            on that parity'}
        Mlocal: {meaning: Split maximum., shape: [{packed_query: PackedColumns}], dtype: fp32, retention: 'keep_value (b,q,r)'}
        Llocal: {meaning: Split denominator., shape: 'ref:Mlocal.shape', dtype: fp32, retention: 'keep_value (b,q,r)'}
        Ylocal: {meaning: Active split numerator., shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, retention: 'keep_value (b,q,r)'}
        Lbase: {meaning: Corrected per-thread denominator carried on each parity., shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32, retention: 'carry_forward (b,q,r,parity);
            i=0..N_r-1 on that parity'}
        FinalSum: {meaning: Warp-grouped final denominator., shape: [{packed_query: PackedColumns}, {warp: 4}], dtype: fp32}
      arithmetic:
        approx: exp2_fast follows step exponent.
        accumulate: 'Each native V reduction slice accumulates P_hi then P_lo into the same FP32 Y. Lbase scales the old state and current partial separately before addition; scalar
          contraction is unknown: FP32 multiply-add contraction has not been confirmed for the recorded CuTe DSL compiler path.'
    - step: materialize
      name: Save split statistics and active numerators
      math: |
        For x=h+HeadCount*t and t_abs=q*QueryTile+t:
          Mpartial[r,b,t_abs,h]=Mlocal[x].
          Lpartial[r,b,t_abs,h]=Llocal[x].
          Opartial[r,b,t_abs,h,d]=Ylocal[d,x] if N_r>0.
        An empty split writes Mpartial=-inf and Lpartial=0; its Opartial payload is not overwritten.
      symbol:
        Mpartial: {meaning: Materialized split maxima., shape: [{split: SplitCount}, {batch: BatchCount}, {query_tail: q_len_per_req}, {head: HeadCount}], dtype: fp32, retention: keep_value
            invocation}
        Lpartial: {meaning: Materialized split denominators., shape: 'ref:Mpartial.shape', dtype: fp32, retention: keep_value invocation}
        Opartial: {meaning: Active split numerators; empty slots remain scratch., shape: [{split: SplitCount}, {batch: BatchCount}, {query_tail: q_len_per_req}, {head: HeadCount},
            {d: D}], dtype: fp32, retention: keep_value invocation}
    - step: normalize
      name: Normalize after the global split reduction
      math: |
        For each (b,t_abs,h), let R={r | 0<=r<SplitCount and Mpartial[r,b,t_abs,h]>-inf}.
          M=max_{r in R} Mpartial[r,b,t_abs,h].
          w[r]=exp2_fast(Mpartial[r,b,t_abs,h]-M) for r in R; otherwise 0.
          Z=sum32_{r in R} w[r]*Lpartial[r,b,t_abs,h].
          U[d]=sum32_{r in R} w[r]*Opartial[r,b,t_abs,h,d].
          output[b*q_len_per_req+t_abs,h,d]=bf16(U[d]*(rcp_fast(Z)*fp32(bmm2_scale/rho))).
        Empty splits have zero weight; their scratch payload does not contribute.
        out_after=output.
      arithmetic:
        approx: 'exp2_fast follows step exponent; rcp_fast is the source approximate reciprocal; unknown: no verified error bound for this reciprocal path.'
        accumulate: 'Each output thread serially recomputes the maximum, then scans active splits in ascending order for the denominator and numerator. Scalar contraction is unknown:
          FP32 multiply-add contraction has not been confirmed for the recorded CuTe DSL compiler path.'
    ledger:
      baseline: Dense FP32 scores/probabilities in global memory, with one value contraction.
      matmul:
      - {item: Contractions, change: 2*D*L_b -> 3*D*Bk*T_b MAC per query head; the added contraction applies P_lo., by: [stripe, exponent, parity]}
      traffic:
      - {item: Dense intermediates, change: -16*q_len_per_req*HeadCount*L_b bytes per request for score/probability writes and reads., by: [stripe, exponent]}
      - {item: Split workspace, change: +8*SplitCount*q_len_per_req*HeadCount*(D+2) bytes per request as the full-active write/read payload bound; inactive numerators are not written.,
        by: [materialize, normalize]}
      depth:
      - {item: KV chain, change: 'T_b -> max_r N_r sequential block updates per query, followed by a SplitCount-way normalization reduction.', by: [stripe, normalize]}
      error:
      - {item: Numerics, change: '+two FP8 probability roundings, fast exp2/reciprocal, parity and split regrouping; the denominator keeps unquantized FP32 probabilities.', by: [
          exponent, parity, normalize]}
  work_schedule:
    thesis: Preserve nominal launch and scratch dimensions while varying active striped splits; combine skips empty payloads and recomputes statistics serially in each output thread.
    flow:
      launch:
      - {phase: [partial]}
      - {phase: [combine], start_after: partial.launch_ready, protocol: pdl}
      handoff:
        Mpartial: {producer: partial, consumer: [combine], storage: global, ready: partial.kernel_done, wait_at: combine.read_partial}
        Lpartial: {producer: partial, consumer: [combine], storage: global, ready: partial.kernel_done, wait_at: combine.read_partial}
        Opartial: {producer: partial, consumer: [combine], storage: global, ready: partial.kernel_done, wait_at: combine.read_partial}
    phase:
      partial:
        describe: Compute split-local online statistics and numerator.
        decomposition:
          strategy: |
            Bk=256; QueryTile=2; PackedColumns=HeadCount*QueryTile; let B=BatchCount, L=max_seq_len.
            SplitCount=8 if 128*PageCount>=B*L, otherwise 32.
            near=(4*min(131072,min_b seq_lens[b])>=3*L); the finite initializer is retained.
            If SplitCount=32: WorkSplit(b)=max(4,ceil(seq_lens[b]*SplitCount/L)).
            Otherwise, if near: WorkSplit(b)=7 for B=10 and 6 for B=11;
            otherwise WorkSplit(b)=ceil(seq_lens[b]*8/L) for B=10 and 8 for B=11.
            Nominal split r owns blocks r+i*WorkSplit(b); r>=WorkSplit(b) or r>=ceil(seq_lens[b]/Bk) is empty.
            Every nominal CTA is launched; empty CTAs publish Mpartial=-inf,Lpartial=0 without Opartial.
            Each active block gathers four HND page indices. The host's B=12/S=8 compact clause is unreachable under the default selector.
          partition: {batch: {size: BatchCount, tile: 1}, query_tail: {size: q_len_per_req, tile: QueryTile}, split: {size: SplitCount, tile: 1}}
          worktile:
            invariant: {Qpack: {shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}, seq_lens: {shape: [{batch: 1}], dtype: int32}}
            iteration: {block_tables: {shape: [{page_index: 4}], dtype: int32, direction: ascending}, Kblk: {shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn, direction: ascending},
              Vblk: {shape: [{kv: Bk}, {d: D}], dtype: fp8_e4m3fn, direction: ascending}}
          target:
            single_tile:
              Mpartial: {shape: [{query_tail: QueryTile}, {head: HeadCount}], dtype: fp32}
              Lpartial: {shape: [{query_tail: QueryTile}, {head: HeadCount}], dtype: fp32}
              Opartial: {shape: [{query_tail: QueryTile}, {head: HeadCount}, {d: D}], dtype: fp32}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: worktile_count}
        schedule: {worktile_order: [{by: batch, direction: ascending}, {by: query_tail, direction: ascending}, {by: split, direction: ascending}], worker_assignment: {preassigned: {
              start: worker_id, count: 1}, refill: none, exit: assigned_done}}
      combine:
        describe: Combine all nominal slots for one query head and overwrite its output vector.
        decomposition:
          partition: {batch: {size: BatchCount, tile: 1}, query_tail: {size: q_len_per_req, tile: 1}, head: {size: HeadCount, tile: 1}}
          worktile:
            invariant: {Mpartial: {shape: [{split: SplitCount}], dtype: fp32}, Lpartial: {shape: [{split: SplitCount}], dtype: fp32}}
            iteration: {Opartial: {shape: [{split: 1}, {d: D}], dtype: fp32, direction: ascending}}
          target:
            single_tile: {output: {shape: [{d: D}], dtype: bf16}}
            tile_reduction: {dimension: split, input: [Mpartial, Lpartial, Opartial], output: output, method: 'design.math_reshape::normalize'}
        mapping: {worker: {unit: CTA, unit_count: 1}, worker_count: worktile_count}
        schedule: {worktile_order: [{by: batch, direction: ascending}, {by: query_tail, direction: ascending}, {by: head, direction: ascending}], worker_assignment: {preassigned: {
              start: worker_id, count: 1}, refill: none, exit: assigned_done}}
  tile_pipeline:
    thesis: Separate K/V transfer and score/value issue roles; bounded issue lead and two numerator parities overlap softmax with correction. Buffer reuse follows operand completion,
      not issue. One softmax warpgroup processes every block; issuer/softmax/correction budgets are 64/168/256 registers per thread.
    phase:
      partial:
        domain: {i: [0, N_r], active: [0, 'min(1,N_r)'], single: [0, 'min(1,N_r)*max(0,2-N_r)'], head: [0, 'min(2,N_r)'], corr: [0, 'max(0,N_r-2)'], corr_prefix: [0, 'max(0,N_r-3)'],
          corr_final: ['max(0,N_r-3)', 'max(0,N_r-2)'], tail: ['max(0,N_r-2)', N_r], u: [0, 4]}
        resource:
          Qpack: {slot_count: 1, space: SMEM, member_slot_shape: [{packed_query: PackedColumns}, {d: D}], dtype: fp8_e4m3fn}
          PageIndex: {space: SMEM, member_slot_shape: [{page_index: 4}], dtype: int32, slot_count: 4, view: {PageIndex(i): {slot_index: i%4}}}
          KV:
            slot_count: 1
            space: SMEM
            member_slot_shape: [{element: 16384*KVStageCount}]
            dtype: fp8_e4m3fn
            view:
              Kslice(i,u): {part: {element: ['16384*Kslot(i,u)', '16384*(Kslot(i,u)+1)']}}
              Vslice(i,u): {part: {element: ['16384*Vslot(i,u)', '16384*(Vslot(i,u)+1)']}}
              Ostage: {part: {element: [0, 4*D*PackedColumns]}, dtype: fp32}
          ScoreBlock: {space: TMEM, member_slot_shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp32, slot_count: ScoreStageCount, view: {ScoreBlock(i): {slot_index: i%ScoreStageCount}}}
          P_hi: {space: SMEM, member_slot_shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot_count: 4, view: {P_hi(i): {slot_index: i%4}}}
          P_lo: {space: SMEM, member_slot_shape: [{kv: Bk}, {packed_query: PackedColumns}], dtype: fp8_e4m3fn, slot_count: 4, view: {P_lo(i): {slot_index: i%4}}}
          Y: {space: TMEM, member_slot_shape: [{d: D}, {packed_query: PackedColumns}], dtype: fp32, slot_count: 2, view: {Y(i): {slot_index: i%2}}}
          ExponentialSum: {space: TMEM, member_slot_shape: [{partial: 128}, {packed_query: PackedColumns}], dtype: fp32, slot_count: 2, view: {ExponentialSum(i): {slot_index: i%2}}}
          Maximum: {slot_count: 1, space: SMEM, member_slot_shape: [{packed_query: PackedColumns}], dtype: fp32, view: {m: {}}}
          FinalSum: {slot_count: 1, space: SMEM, member_slot_shape: [{packed_query: PackedColumns}, {warp: 4}], dtype: fp32}
          Lbase: {slot_count: 1, space: register, member_slot_shape: [{partial: 128}, {packed_query: PackedColumns}, {parity: 2}], dtype: fp32}
          TailNumerator: {slot_count: 1, space: register, member_slot_shape: [{age: 2}, {d: D}, {packed_query: PackedColumns}], dtype: fp32}
        role:
          LoadK:
            info:
              member: warp[2:3]
              execution_mode: async
              verb:
                advance:
                  execution_mode: serial
                  meaning: 'Complete PageIndex(i), prefetch i+1 before the K issue turn, and cycle four slots. For Lead=2 and i+4<N_r, V capture before same-slot
                    prefetch overwrite is unproved: no established cross-role ordering proof protects this page-slot reuse.'
                load: Load Q once before K. Acquire four K slices independently; reuse waits for their prior KQ/VP operand reads, and transfers complete per slice.
                  The K/V issue-turn protocol admits K0..K(Lead),V0,K(Lead+1),V1,... and the V tail; each final-slice acquisition releases the peer before transfer
                  completion. Short loops relay no-payload turns; N_r=0 skips the protocol.
                prepare:
                  execution_mode: serial
                  meaning: |
                    Use the fixed TableWidth stride to prefetch the first four page indices while the
                    sequence-length fetch, descriptor prefetch and TMEM/pipeline setup progress.
                    The initial lookup does not wait for seq_lens; unused entries may be -1 or name finite cache data,
                    which the subsequent score mask excludes. Join CTA setup, including initialized statistics,
                    before any stream work or empty-split handling; Q is then issued independently of later page lookups.
                    The first page-table address is b*TableWidth+4*r.
                    Each nominal CTA computes WorkSplit on device before early exit, using per-warp batch min/max reductions with the declared finite min initializer.
                    Empty CTAs bypass stream-role register redistribution; their reduction warp retains the launch allocation.
                    Let R=PackedColumns, T=512, Csm=232448.
                    T is in TMEM columns and Csm is in bytes; these are the values returned by
                    the original sm_100 helper calls in CUTLASS DSL 4.6.1.
                    ScoreStageCount=min(4,floor((T-6*R)/(2*R))); Lead=min(2,ScoreStageCount-1).
                    Allocate next_power_of_two((6+2*ScoreStageCount)*R) TMEM columns.
                    A=180+2324*R+16*ScoreStageCount; pad=128-A%128; K0=floor((Csm-A-pad)/16384);
                    KVStageCount=K0-int(16*K0>pad). Kslot(i,u)=(4*i+4*max(i-Lead,0)+u)%KVStageCount;
                    Vslot(i,u)=(4*(i+min(i+Lead+1,N_r))+u)%KVStageCount.
                    Each slice is 128-key by 128-d FP8; u orders key-half then d-half.
                yield_turn: {execution_mode: serial, meaning: Release the peer load turn after acquiring the final K slice; K transfers may remain in flight.}
              register: 64
            pipe:
              prologue: ['prepare:Startup']
              steady:
              - {repeat: active, steady: ['load:Qpack', {repeat: i, steady: ['advance:PageIndex(i)', 'load:Kblk(i)', 'yield_turn:K(i)']}]}
            waits_for: {data: {'prepare:Startup@issue': ['Softmax/initialize:Statistic@done']}, sync: {'load:Kblk(i+Lead+1)@issue': ['LoadV/yield_turn:V(i)@done']}}
          LoadV:
            info:
              member: warp[3:4]
              execution_mode: async
              verb:
                load: Capture PageIndex(i); load four V slices under the K/V issue-turn and per-slice reuse protocols defined by LoadK/load.
                store: For N_r>0, store Ostage to the FP32 Opartial slice; for N_r=0 this action remains in the pipe and completes as a no-op without reading Ostage or writing Opartial.
                yield_turn: {execution_mode: serial, meaning: Release the peer load turn after acquiring the final V slice; V transfers may remain in flight.}
              register: 64
            pipe: {repeat: i, steady: ['load:Vblk(i)', 'yield_turn:V(i)'], epilogue: ['store:output_tile']}
            waits_for:
              data: {'load:Vblk(i)@issue': ['LoadK/advance:PageIndex(i)@done'], 'store:output_tile@issue': ['Correction/publish:Ostage@done']}
              sync: {'load:Vblk(i)@issue': ['LoadK/yield_turn:K(min(i+Lead,N_r-1))@done']}
          Score:
            info:
              member: warp[0:1]
              execution_mode: async
              verb:
                release: {execution_mode: serial, meaning: Guarantee completion of K operand reads for the Ostage alias; no additional collective barrier.}
                wait: {execution_mode: serial, meaning: Join Correction's existing FinalSum rendezvous; completion admits this role's sum read and Correction's final Y capture.}
                store: Store Mpartial on FinalMaximum and Lpartial after reducing four FinalSum entries; visibility is required at kernel_done.
                launch:
                  execution_mode: serial
                  meaning: Issue this CTA's PDL release after statistic-store issue, contributing to grid-wide successor permission; statistic and Opartial stores
                    may remain outstanding.
                score: Acquire a score slot; form two 128-key products reduced over both 128-d slices. Return K slices after operand reads; publish only the complete
                  ScoreBlock. An independent KQ/VP issue-turn protocol follows the same Lead window as K/V loads, releasing its peer on final operand acquisition;
                  short loops relay no-payload turns, and N_r=0 skips it. Wait for each operand slice separately; later transfers may overlap earlier products.
                yield_turn: {execution_mode: serial, meaning: Release the peer MMA turn after final K operand acquisition; the score result may remain in flight.}
              register: 64
            pipe:
              repeat: i
              steady: ['score:ScoreBlock(i)', 'yield_turn:Score(i)']
              epilogue: ['release:K_reads', 'store:Mpartial', 'wait:FinalSum', 'store:Lpartial', 'launch:combine']
            waits_for:
              data:
                store:Mpartial@issue: ['Correction/publish:FinalMaximum@done']
                wait:FinalSum@issue: ['Correction/publish:FinalSum@done']
                score:ScoreBlock(i)@issue: ['LoadK/load:Qpack@done']
                score:ScoreBlock(i)@done: ['LoadK/load:Kblk(i)@done']
                yield_turn:Score(i)@done: ['LoadK/load:Kblk(i)@done']
              reuse: {'score:ScoreBlock(i+ScoreStageCount)@issue': ['Softmax/read:ScoreBlock(i)@done']}
              sync: {'score:ScoreBlock(i+Lead+1)@issue': ['Value/yield_turn:Value(i)@done']}
          Value:
            info:
              member: warp[1:2]
              execution_mode: async
              verb:
                release: {execution_mode: serial, meaning: 'Guarantee V/P operand reads complete, without waiting for final Y capture or adding a collective barrier.'}
                retire:
                  execution_mode: serial
                  meaning: Free TMEM after Correction returns the final Y slots, or immediately for N_r=0; final normalization and Ostage publication need not finish
                    first.
                accumulate: P_pair is P_hi/P_lo. Acquire Y after initialization/correction; accumulate leading then residual per V slice. Return each V slice after
                  both component reads; release_p returns the P slot. N_r=1 also signals the initialized empty Y parity. Follow Score/score's KQ/VP issue-turn protocol.
                  Wait for each operand slice separately; later transfers may overlap earlier products.
                release_p: Signal completion of all leading/residual P operand reads for block i, returning its P-ring slot independently of the Y result-commit notification;
                  no Correction wait is involved.
                yield_turn: {execution_mode: serial, meaning: Release the peer MMA turn after final V/P operand acquisition; the numerator result may remain in flight.}
              register: 64
            pipe: {repeat: i, steady: ['accumulate:Y(i)', 'yield_turn:Value(i)', 'release_p:P_pair(i)'], epilogue: ['release:V_reads', 'retire:TMEM']}
            waits_for:
              data:
                accumulate:Y(i)@issue: ['Correction/zero:Y(active)@done', 'Softmax/publish:P_pair(i)@done']
                accumulate:Y(i+2)@issue: ['Correction/rescale:Y(i)@done']
                retire:TMEM@issue: ['LoadK/prepare:Startup@done']
                accumulate:Y(i)@done: ['LoadV/load:Vblk(i)@done']
                yield_turn:Value(i)@done: ['LoadV/load:Vblk(i)@done']
              reuse: {'retire:TMEM@issue': ['Correction/capture:Y(tail)@done']}
              sync: {'accumulate:Y(i)@issue': ['Score/yield_turn:Score(min(i+Lead,N_r-1))@done']}
          Softmax:
            info: {execution_mode: serial, member: 'warp[4:8]', register: 168, verb: {initialize: 'CTA setup initializes the shared maximum to -inf and FinalSum to zero, even for empty splits.', prepare: 'For
                  N_r=1, signal initialized ExponentialSum parity 1 before the block loop; otherwise this action is a no-op.', read: 'Capture raw ScoreBlock in registers and immediately
                  return its TMEM slot. Let last=ceil(seq_lens[b]/Bk)-1. Apply the contract mask in registers only for logical block last when q_len_per_req>1 or seq_lens[b]%Bk!=0,
                  and also last-1 when 0<seq_lens[b]%Bk<q_len_per_req; interior blocks are mask-free.', publish_max: 'Update/capture m; the next update waits for Correction to capture
                  it. Acquire the P-ring slot before publishing this maximum to Correction, as in the source maximum rendezvous.', publish: 'Publish P_hi/P_lo together, then the
                  independent ExponentialSum parity.'}}
            pipe: {prologue: ['initialize:Statistic', 'prepare:EmptySum'], repeat: i, steady: ['read:ScoreBlock(i)', 'publish_max:m(i)', 'publish:P_pair(i)', 'publish:ExponentialSum(i)']}
            waits_for:
              data: {'read:ScoreBlock(i)@issue': ['Score/score:ScoreBlock(i)@done'], 'prepare:EmptySum@issue': ['LoadK/prepare:Startup@done']}
              reuse: {'publish_max:m(i+4)@issue': ['Value/release_p:P_pair(i)@done'], 'publish:ExponentialSum(i+2)@issue': ['Correction/read:ExponentialSum(i)@done']}
              sync: {'publish_max:m(active)@issue': ['Correction/zero:Y(active)@done'], 'publish_max:m(i+1)@issue': ['Correction/read:m(i)@done']}
          Correction:
            info: {execution_mode: serial, member: 'warp[8:12]', verb: {zero: 'For N_r>0 initialize both Y slots, empty sum parity 1 and Lbase; fence before admitting softmax. For N_r=0 active is empty, so no zero action or wait is created; setup statistics remain in use.',
                read: 'Capture and release m or ExponentialSum, retaining two maxima and Lbase parities. For N_r=1 drain initialized sum parity 1 before valid parity 0.', rescale: 'With
                  captured m(i+2), wait for Y(i), correct that numerator, fence its TMEM writes and return the slot for block i+2; the denominator update follows separately.', capture: 'Each
                  tail action captures its Y parity into the corresponding older/newer entry of TailNumerator and returns that TMEM slot. For N_r=1, the sole action first drains
                  initialized empty parity 1, then valid parity 0. Retain both register entries through Ostage formation.', publish: FinalMaximum releases the final m before the
                  last parity correction. FinalSum publishes four warp sums (zero for N_r=0) and arrives at Score's rendezvous. Ostage stages captured FP32 Ylocal without normalization
                  over the retired KV region; For N_r=0 the Ostage action remains in the pipe and completes as a no-op without forming or publishing a payload., update: Update the target Lbase from its parity predecessor and the just-captured exponential sum using step
                  parity; this register work follows Y-slot return and can overlap the next VP product.}, register: 256}
            pipe: {steady: [{repeat: active, steady: ['zero:Y(active)', {repeat: head, steady: ['read:m(head)']}, {repeat: corr_prefix, steady: ['read:ExponentialSum(corr_prefix)', 'read:m(corr_prefix+2)',
                        'rescale:Y(corr_prefix)', 'update:Lbase(corr_prefix+2)']}, {repeat: corr_final, steady: ['read:ExponentialSum(corr_final)', 'read:m(corr_final+2)']}]}, 'publish:FinalMaximum',
                {repeat: corr_final, steady: ['rescale:Y(corr_final)', 'update:Lbase(corr_final+2)']}, {repeat: tail, steady: ['read:ExponentialSum(tail)']}, 'publish:FinalSum',
                {repeat: tail, steady: ['capture:Y(tail)']}, 'publish:Ostage']}
            waits_for:
              data: {'publish:FinalMaximum@issue': ['LoadK/prepare:Startup@done'], 'rescale:Y(corr)@issue': ['Value/accumulate:Y(corr)@done'], 'capture:Y(tail)@issue': ['Value/accumulate:Y(tail)@done'], 'read:m(i)@issue': [
                  'Softmax/publish_max:m(i)@done'], 'read:ExponentialSum(i)@issue': ['Softmax/publish:ExponentialSum(i)@done'], 'read:ExponentialSum(single)@issue': ['Softmax/prepare:EmptySum@done'], 'zero:Y(active)@issue': [
                  'LoadK/prepare:Startup@done']}
              reuse: {'publish:Ostage@issue': ['Score/release:K_reads@done', 'Value/release:V_reads@done']}
              sync: {'capture:Y(tail)@issue': ['Score/wait:FinalSum@done']}
      combine:
        milestone: {read_partial: ['Main/wait:partial_input@done']}
        resource:
          PartialStatistic: {slot_count: 1, space: SMEM, member_slot_shape: [{statistic: 2}, {split: SplitCount}], dtype: fp32, view: {Mpartial: {part: {statistic: [0, 1]}}, Lpartial: {part: {statistic: [
                    1, 2]}}}}
          Numerator: {slot_count: 1, space: register, member_slot_shape: [{d: D}], dtype: fp32}
        role:
          Main:
            info: {execution_mode: serial, member: 'warp[0:4]', verb: {wait: Execute the PDL predecessor-completion wait before any partial-result read., compute: 'Each of 128 threads owns two d elements.
                  split_weight scans all maxima to obtain M and initializes Z=0; Numerator(r) recomputes w[r] and updates Z/U for active splits in ascending order.', load: 'PartialStatistic
                  stages Mpartial/Lpartial together with asynchronous global-to-SMEM copies, then waits and establishes CTA-wide visibility. For Opartial(r), skip Mpartial[r]=-inf
                  before any payload read; active payloads stream into registers.', produce: Apply upstream normalize and cast once to BF16 when overwriting out.}}
            pipe: {prologue: ['wait:partial_input', 'load:PartialStatistic', 'zero:Numerator', 'compute:split_weight'], steady: [{repeat: {r: [0, SplitCount]}, steady: ['load:Opartial(r)',
                    'compute:Numerator(r)']}], epilogue: ['produce:output']}
realization:
  require:
  - item: contract.algorithm_requirement::workspace_buffer
    choice: A byte length divisible by four and at least 4*BatchCount*q_len_per_req*HeadCount*(SplitCount*(D+2)+1).
    reason: The entry reinterprets scratch as FP32 and slices the three partial tensors plus an additional statistics region; that final region is reserved even though the kernels
      do not consume it.
  - item: ['design.tile_pipeline::partial.Score', 'design.tile_pipeline::partial.Value']
    choice: tcgen05.mma with FP8 E4M3FN operands and FP32 TMEM accumulation; completion-aware operand release. Use the operand-consumer release separately from the accumulator-producer
      commit for P reuse and Y readiness.
    reason: The pipeline exchanges TMEM accumulators and reuses KV slices after operand reads.
  - item: ['design.tile_pipeline::partial.LoadK', 'design.tile_pipeline::partial.LoadV']
    choice: TMA query/KV/output transfers; cp.async page-table prefetch; per-slice producer/consumer barriers.
    reason: Paged HND inputs are consumed directly through the shared KV ring.
  - item: ['design.work_schedule::flow', 'design.tile_pipeline::combine.Main']
    choice: PDL launch-dependents publication and griddepcontrol predecessor-completion wait.
    reason: Early successor launch must not make partial reads early.
  - item: ['design.tile_pipeline::partial.Softmax', 'design.tile_pipeline::partial.Correction']
    choice: 'For nonempty CTAs, setmaxnreg redistributes the 168-register launch allocation: issuers decrease to 64, Softmax stays at 168, Correction increases to 256.'
    reason: Preserve the wide-column role allocation without asking the softmax warpgroup to increase beyond the launch allocation.
  - item: ['design.tile_pipeline::partial.LoadK', 'design.tile_pipeline::partial.Score']
    choice: Named-barrier handshakes for the independent load and MMA issue-turn protocols.
    reason: Issue turns release peers before transfer or product completion.
