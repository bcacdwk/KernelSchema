META_DATA:
  Name: paged_causal_attention_prefill
  Describe: Compute right-aligned causal GQA from FP8 queries and an HND paged KV cache into the supplied BF16 output
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/fa4_prefill/aka_solution/solution.py::Model.forward
  Version: 8
  Dispatch:
    id: root
    when: 2<=batchcount<=4; compact static schedule with dual K/V load and separate rescale evaluation; one unsplit traversal
CONTRACT:
  Algorithm_requirement:
    Constant:
      hq: {value: 16, meaning: query head count}
      hkv: {value: 1, meaning: KV head count}
      channels: {value: 256, meaning: query and value channel count}
      page: {value: 64, meaning: Tokens per physical KV page}
      tablecolumns: {value: 16434, meaning: page-table width}
      workspacebytes: {value: 413138944, meaning: Caller scratch capacity}
    Input:
      query: {meaning: Concatenated request queries, shape: [{token: totalq}, {head: hq}, {channel: channels}], dtype: fp8_e4m3fn}
      kv_cache: {meaning: HND cache with keys then values on the kind axis, shape: [{page: pages}, {kind: 2}, {head: hkv}, {token: page}, {channel: channels}], dtype: fp8_e4m3fn}
      workspace_buffer: {meaning: Caller scratch zeroed before first isolated use, shape: [{byte: workspacebytes}], dtype: uint8}
      block_tables: {meaning: Logical page to physical page mapping, shape: [{request: batchcount}, {page_slot: tablecolumns}], dtype: int32, range: 'Used entries in [0,pages); unused entries are -1.'}
      seq_lens: {meaning: Used KV lengths, shape: [{request: batchcount}], dtype: int32, range: [1, 131072]}
      max_q_len: {meaning: Maximum request query length, shape: [], dtype: python_int, range: [1, 16384]}
      max_kv_len: {meaning: Maximum used KV length, shape: [], dtype: python_int, range: [1, 131072]}
      bmm1_scale: {meaning: Composite QK scale including quantization scales, shape: [], dtype: fp64, range: [0.0625, 0.0625]}
      bmm2_scale: {meaning: Composite output scale, shape: [], dtype: fp64, range: [1.0, 1.0]}
      batch_size: {meaning: ABI request count, shape: [], dtype: python_int, range: [1, 16]}
      cum_seq_lens_q: {meaning: query prefix boundaries, shape: [{boundary: batchcount+1}], dtype: int32, range: [0, 16384]}
      cum_seq_lens_kv: {meaning: Allocated-page prefix counts, shape: [{boundary: batchcount+1}], dtype: int32}
      window_left: {meaning: Unrestricted causal history sentinel, shape: [], dtype: python_int, range: [-1, -1]}
      sinks: {meaning: Required disabled sink argument, shape: [], dtype: python_none, range: Python None.}
      o_sf_scale: {meaning: Required disabled output quantization argument, shape: [], dtype: python_none, range: Python None.}
      out: {meaning: Destination with ignored initial contents, shape: [{token: totalq}, {head: hq}, {channel: channels}], dtype: bf16, range: 'Any BF16 bit pattern, including inf and NaN.'}
    Output:
      output: {meaning: Returned alias of the updated input out, shape: [{token: totalq}, {head: hq}, {channel: channels}], dtype: bf16}
      out_after: {meaning: In-place contents of input out, shape: [{token: totalq}, {head: hq}, {channel: channels}], dtype: bf16}
    Compute:
      - Name: Interpret the callable and pages
        Math: |
          python_int is a Python integer; fp64 scalars are Python floats; python_none is the singleton Python None ABI type, not a tensor.
          Tensors are contiguous in the stated axis order on one CUDA device. batch_size=batchcount; 1<=batchcount<=16; 1<=totalq<=16384; max_kv_len<=131072.
          cum_seq_lens_q[0]=cum_seq_lens_kv[0]=0; cum_seq_lens_q[batchcount]=totalq.
          qlen(b)=cum_seq_lens_q[b+1]-cum_seq_lens_q[b]; kvlen(b)=seq_lens[b]; 0<qlen(b)<=kvlen(b).
          max_q_len=max_b qlen(b); max_kv_len=max_b kvlen(b); pages=sum_b ceil(kvlen(b)/page).
          cum_seq_lens_kv[b+1]-cum_seq_lens_kv[b]=ceil(kvlen(b)/page)<=tablecolumns.
          For 0<=j<kvlen(b), kref[b,j,d]=kv_cache[block_tables[b,floor(j/page)],0,0,j%page,d], with vref using kind=1.
          The complete standalone callable is timed. Only out is an observable input mutation; workspace_buffer is scratch.
        Symbol:
          qlen: {meaning: query length function of request b., shape: not_applicable, dtype: not_applicable}
          kvlen: {meaning: Used KV length function of request b., shape: not_applicable, dtype: not_applicable}
          kref: {meaning: Logical keys on each request's valid domain, shape: [{request: batchcount}, {key: max_kv_len}, {channel: channels}], dtype: fp8_e4m3fn}
          vref: {meaning: Logical values on each request's valid domain, shape: 'ref:kref.shape', dtype: fp8_e4m3fn}
      - Name: Right-aligned causal attention
        Math: |
          For each b, 0<=q<qlen(b), 0<=h<hq and 0<=d<channels, let a=cum_seq_lens_q[b]+q.
          visible_keys(b,q)={j in integers | 0<=j<kvlen(b) and j<=kvlen(b)-qlen(b)+q}.
          score[j]=bmm1_scale*sum_{d=0}^{channels-1} query[a,h,d]*kref[b,j,d] for j in visible_keys(b,q).
          p[j]=exp(score[j]-max_k score[k])/sum_{k in visible_keys(b,q)} exp(score[k]-max_u score[u]), with all maxima over visible_keys(b,q).
          out_after[a,h,d]=bf16(bmm2_scale*sum_{j in visible_keys(b,q)} p[j]*vref[b,j,d]); output is the same tensor object as out.
        Symbol: {visible_keys: {meaning: Visible key set function of request and query, shape: not_applicable, dtype: not_applicable}}
    Golden_reference:
      Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/fa4_prefill/reference.py::Model.forward
      Tolerance:
        output: atol=0.06, rtol=0.04
        out_after: atol=0.06, rtol=0.04
  Hardware_specification:
    Device: NVIDIA L20D
    Architecture: SM103
    Execution:
      warp: 32 SIMT threads within one CTA.
      cta: Warps co-resident on one SM, sharing SMEM and barriers
      cluster: CTAs co-scheduled within one GPC, with cluster synchronization
    Feature:
      smem: CTA-lifetime shared storage, addressable by cluster peers while its owner remains alive
      tmem: Explicitly allocated Tensor Core storage, separate from SMEM.
      register: Thread-private registers backed by the SM register file
      asynchronous_execution: Asynchronous transfers and MMA require their primitive-specific completion and visibility guarantees
    Stack:
      Language: CuTe DSL, nvidia-cutlass-dsl==4.6.1
      Toolchain: nvidia-cutlass-dsl 4.6.1 bundled compiler; torch 2.9.0+cu130; cuda-python 13.1.1; CUDA compiler and driver versions were not recorded.
    Wiki:
      Hardware: <wiki-hardware@pending:L20D/SM103.md>
      Programming:
        Language: <wiki-language@pending:CuTe-DSL/4.6.1/>
        Virtual_ISA: <wiki-virtual-isa@pending:PTX/pending/>
        Machine_ISA: <wiki-machine-isa@pending:SASS/SM103/>
      Microbench: <wiki-microbench@pending:L20D/>
      Sota:
        Kernel: <wiki-sota-kernel@pending:L20D/>
        Schema: <wiki-sota-schema@pending:L20D/>
      Profile: <wiki-profile@pending:NVIDIA/>
DESIGN:
  Math_reshape:
    Thesis: Pack GQA heads into rows and replace dense attention intermediates with online state; lag the maximum and offset exponentials before FP8 rounding, trading numerator precision for FP8 products
    Rewrite:
      - Name: stream
        Math: |
          For request b and query block m, qc[r,d]=query[cum_seq_lens_q[b]+16*m+floor(r/hq),r%hq,d], 0<=r<packedrows, on valid query rows.
          qlen, kvlen and visible_keys retain their Contract definitions. For 0<=i<tile_count and 0<=k<kvblock, j=kvblock*sigma(i)+k.
          logicalpage(i,k)=floor(j/page) if page*floor(j/page)<kvlen(b), otherwise kvblock*sigma(i)/page; physicalpage(i,k)=block_tables[b,logicalpage(i,k)].
          kc(i)[k,d]=kv_cache[physicalpage(i,k),0,0,j%page,d]; vc(i)[k,d]=kv_cache[physicalpage(i,k),1,0,j%page,d].
          score(i,0)=mm32(qc[:,0:128],transpose(kc(i)[:,0:128])); score(i,1)=mma32(qc[:,128:256],transpose(kc(i)[:,128:256]),score(i,0)).
          maskedscore(i)[r,k]=score(i,1)[r,k] if j in visible_keys(b,16*m+floor(r/hq)), otherwise -inf.
        Symbol:
          packedrows: {meaning: Packed rows per worktile, value: 256}
          kvblock: {meaning: Keys per local iteration, value: 128}
          tile_count: {meaning: Local KV iteration count, value: 'min(ceil(kvlen(b)/kvblock),ceil((kvlen(b)-qlen(b)+16*(m+1))/kvblock))'}
          sigma: {meaning: Local iteration to KV block map, value: i}
          qc: {meaning: Packed query block, shape: [{row: packedrows}, {channel: channels}], dtype: fp8_e4m3fn, retention: 'keep_value (b,m)'}
          kc: {meaning: page-backed key block, shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn}
          vc: {meaning: page-backed value block, shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn}
          score: {meaning: Raw score after a channel-half contraction, shape: [{row: packedrows}, {key: kvblock}], dtype: fp32}
        Ledger:
          Baseline: Full FP32 score and probability tensors
          Gain: Remove dense intermediate global writes and reads
          Cost: page-tail replay and masked block products
      - Name: online
        Math: |
          For each valid row independently, c=fp32(bmm1_scale*log2(e)), with the expression inside the cast evaluated in Python binary64.
          mhat(-1)=-inf; ell(-1)=0; numerator(-1)=0. For 0<=i<tile_count, a=max(mhat(i-1),max_k maskedscore(i)[r,k]); safe=0 if a=-inf, otherwise a.
          keep=(c*(mhat(i-1)-safe)>=-tau); mhat(i)=mhat(i-1) if keep, otherwise a; base=mhat(i-1) if keep, otherwise safe.
          alpha(i)=1 if keep, otherwise exp2_fast(c*(mhat(i-1)-safe)); stats(i)[r,:]=(mhat(i-1),base).
          exponentials(i)[r,k]=exp2_fast(fma32(c,maskedscore(i)[r,k],offset-c*base)); exp2_fast(-inf)=0; prob(i)=fp8_e4m3fn(exponentials(i)).
          ell(i)=alpha(i)*ell(i-1)+sum32_k exponentials(i)[r,k].
          numerator(0)=mm32(prob(0),vc(0)); for i>0, numerator(i)=mma32(prob(i),vc(i),alpha(i)*numerator(i-1)).
          invell=1/ell(tile_count-1) if ell is nonzero and not NaN, otherwise zero; oblock=bf16(numerator(tile_count-1)*invell).
          out_after[cum_seq_lens_q[b]+16*m+floor(r/hq),r%hq,d]=oblock[r,d] for 16*m+floor(r/hq)<qlen(b); output aliases out.
        Symbol:
          tau: {meaning: Maximum lag in base-two score units, value: 4}
          offset: {meaning: Base-two shift before probability narrowing, value: 4}
          mhat: {meaning: Retained raw-score maximum, shape: [{row: packedrows}], dtype: fp32, retention: 'carry_forward (b,m); i=-1..tile_count-1'}
          ell: {meaning: denominator from unrounded exponentials, shape: [{row: packedrows}], dtype: fp32, retention: 'carry_forward (b,m); i=-1..tile_count-1'}
          numerator: {meaning: Numerator from FP8 probabilities, shape: [{row: packedrows}, {channel: channels}], dtype: fp32, retention: 'carry_forward (b,m); i=-1..tile_count-1'}
          prob: {meaning: Value-product operand, shape: [{row: packedrows}, {key: kvblock}], dtype: fp8_e4m3fn}
          stats: {meaning: Previous maximum and guarded current base, shape: [{row: packedrows}, {stat: 2}], dtype: fp32}
          oblock: {meaning: Final output block, shape: [{row: packedrows}, {channel: channels}], dtype: bf16}
        Arithmetic:
          Approx: 'Native fast exp2 on SM103; no polynomial substitution. Unknown: primitive exp2/log/division error bounds'
          Accumulate: Seed pair g0 with ell_previous*(alpha*0.5), g1..g3 with zero; add four FP32 exponentials fragments, merge (g0+g1)+(g2+g3), then sum pair components
        Ledger:
          Baseline: FP32 softmax weights in both numerator and denominator
          Gain: FP8 PV with bounded per-work online state
          Cost: FP8 numerator rounding, lagged maximum and approximate exponentials; denominator uses unrounded exponentials
  Work_schedule:
    Thesis: Front-load longer KV requests and fold their query tiles; launch one CTA pair per position so hardware can schedule each tile independently
    Flow:
      Launch: [{step: [MAIN]}]
    Step:
      MAIN:
        Describe: Sort requests by decreasing KV length with comparison-network ties; prefix c_b segments into compact candidates; padding emits no payload
        Decomposition:
          Strategy: 'cpad=ceil((totalq+15*(batchcount-1))/16); c_b=ceil(qlen(b)/16); valid(t): m<c_b; tile_count(t)=tile_count if valid(t), else 0'
          Partition: {cluster_tile: {size: cpad, tile: 1, meaning: cluster tile coordinate}}
          Worktile:
            Invariant: {qc: {shape: [{row: packedrows}, {channel: channels}], dtype: fp8_e4m3fn, meaning: qc operand block}}
            Iteration:
              kc: {shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn, direction: ascending, meaning: kc operand block}
              vc: {shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn, direction: ascending, meaning: vc operand block}
          Target:
            Single_tile: {oblock: {shape: [{row: packedrows}, {channel: channels}], dtype: bf16, meaning: oblock result block}}
        Mapping:
          Strategy: Rank a supplies K tokens [64*a,64*(a+1)) per channel half and V columns [128*d+64*a,128*d+64*(a+1)) for d=0,1.
          Worker: {unit: cta, unit_count: 2}
          Placement: {unit: cluster, unit_count: 1}
          Worker_count: cpad
          Member: [{row: [0, 128]}, {row: [128, 256]}]
        Schedule:
          Strategy: Within request ordinal x, m=2*x if x<ceil(c_b/2), else 2*(c_b-1-x)+1; retain CTA parity
          Worktile_order: [{by: cluster_tile, direction: ascending}]
          Worker_assignment:
            Preassigned: {start: worker_id, count: 1}
            Refill: none
            Exit: assigned_done
  Tile_pipeline:
    Thesis: K/V rings overlap QK-ahead-of-PV with softmax and correction; aliased score storage trades capacity for ordered reuse
    Step:
      MAIN:
        Index:
          t: {meaning: Worker-local assigned candidate ordinal, definition: worktile}
          i: {meaning: KV block within the candidate, definition: [0, tile_count(t)]}
          n: {meaning: KV block ordinal continuous across valid work, definition: {flatten: [t, i]}}
          d: {meaning: Channel half, definition: [0, 2]}
        Storage:
          query: {meaning: Resident query channel halves, depth: 2, location: smem, shape: [{row: 128}, {channel: 128}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'qc(t,d)': {slot_index: d}}}
          keyring: {meaning: Key payload independent of value storage, depth: 4, location: smem, shape: [{key: 64}, {channel: 128}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'kc(n,d)': {slot_index: (2*n+d)%4}}}
          valuering: {meaning: Value payload independent of key storage, depth: 4, location: smem, shape: [{key: 128}, {channel: 64}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'vc(n,d)': {slot_index: (2*n+d)%4}}}
          scoreprobability: {meaning: 'Aliased scores, probabilities and statistics', depth: 2, location: tmem, shape: [{row: 128}, {column: 128}],
            dtype: fp32, total_size: 262144, view: {'score(n,d)': {slot_index: n%2}, prob(n): {slot_index: n%2, region: {column: [0, 32]}}, stats(n): {slot_index: n%2, region: {column: [32, 34]}}}}
          numerator: {meaning: Carried numerator with one ownership token, depth: 1, location: tmem, shape: [{row: 128}, {channel: 256}],
            dtype: fp32, total_size: 262144}
          denominator: {meaning: Final sum handoff, depth: 1, location: smem, shape: [{row: 128}],
            dtype: fp32, total_size: 1024, view: {finalsum(t): {}}}
          outputstage: {meaning: One coalesced output channel half, depth: 1, location: smem, shape: [{row: 128}, {channel: 128}],
            dtype: bf16, total_size: 65536, view: {'oblock(t,d)': {}}}
          onlinestate: {meaning: Retained maximum and unrounded denominator, depth: 1, location: register, shape: [{row: 128}, {state: 2}],
            dtype: fp32, total_size: 2048, view: {mhat(n): {region: {state: [0, 1]}}, ell(n): {region: {state: [1, 2]}}}}
          scorecopy: {meaning: Scores replaced by unrounded exponentials, depth: 1, location: register, shape: [{row: 128}, {key: 128}],
            dtype: fp32, total_size: 131072}
          probabilitycopy: {meaning: Narrowed probabilities before TMEM publication, depth: 1, location: register, shape: [{row: 128}, {key: 128}],
            dtype: fp8_e4m3fn, total_size: 32768}
          correctioncopy: {meaning: 'Captured statistics, alpha and final normalization', depth: 1, location: register, shape: [{row: 128}, {state: 3}],
            dtype: fp32, total_size: 3072}
          requestmap: {meaning: Response allocation holding query/request mapping, depth: 1, location: smem, shape: [{element: 4}],
            dtype: int32, total_size: 32}
        Role:
          LOAD_QK:
            Info:
              Describe: Supply resident queries and independently staged keys
              Member: warp[9:10]
              Register: 32
              Using_verb:
                load:
                  work: &id001 {execution_mode: serial, describe: 'Read mapped b,m from requestmap; bind valid(t),tile_count(t)'}
                  qc: {execution_mode: async_unordered, describe: Read query through descriptor views into query; done includes both member contributions to the pair transaction barrier}
                  kc: {execution_mode: async_unordered, describe: 'block_tables/kv_cache to keyring: one page64 per member/half; invalid second page repeats the first; done covers pair transaction bytes'}
                await: {tail: {execution_mode: serial, describe: Finish producer ownership returns after all assigned work; no per-work drain}}
                acquire: {keyslot: {execution_mode: serial, describe: Acquire a free keyring slot; reuse waits for previous QK to return both members}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - for(d):
                          - load:qc(t,d)
                      - for(n[t]):
                          - for(d):
                              - acquire:keyslot(n,d)
                              - load:kc(n,d)
              - await:tail
            Waiting:
              Prepared: ['{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]']
              Released: ['{done acquire:keyslot(n+2,d)} ← [{done MMA[0]::matmul:qk(n,d)}]']
              Allowed: ['{done await:tail} ← [{done MMA[0]::matmul:qk(n,d)}]']
          LOAD_V:
            Info:
              Describe: Stage values independently of query and key progress
              Member: warp[10:11]
              Register: 32
              Using_verb:
                load:
                  work: *id001
                  vc: {execution_mode: async_unordered, describe: 'block_tables/kv_cache to valuering: two page64 copies per member/half; invalid second page repeats first; done covers pair bytes'}
                await: {tail: {execution_mode: serial, describe: Finish value producer ownership returns after all assigned work}}
                acquire: {valueslot: {execution_mode: serial, describe: Acquire a free valuering slot; reuse waits for previous PV to return both members}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - for(n[t]):
                          - for(d):
                              - acquire:valueslot(n,d)
                              - load:vc(n,d)
              - await:tail
            Waiting:
              Prepared: ['{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]']
              Released: ['{done acquire:valueslot(n+2,d)} ← [{done MMA[0]::matmul:pv(n,d)}]']
              Allowed: ['{done await:tail} ← [{done MMA[0]::matmul:pv(n,d)}]']
          MMA:
            Info:
              Describe: Issue QK one block ahead of PV on a cumulative pair queue
              Member: cta[0].warp[8:9]
              Register: 32
              Using_verb:
                load: {work: *id001}
                matmul:
                  qk: {execution_mode: async_ordered, describe: 'query qc and keyring kc to scoreprobability; d=0 initializes score. Done returns K and last QK returns Q, including one-block work'}
                  pv: {execution_mode: async_ordered, describe: scoreprobability prob and valuering vc to numerator; PV0 ignores old contents. Done returns V; d=1 publishes numerator and returns prob pair-wide}
                await: {tail: {execution_mode: serial, describe: Drain score and numerator producer returns after the worker loop}}
                acquire: {scoreslot: {execution_mode: serial, describe: Acquire a free scoreprobability slot; reuse waits for SOFTMAX to capture its preceding score}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - acquire:scoreslot(n[t,0])
                      - for(d):
                          - matmul:qk(n[t,0],d)
                      - for(n[t,1:]):
                          - acquire:scoreslot(n)
                          - for(d):
                              - matmul:qk(n,d)
                          - for(d):
                              - matmul:pv(n-1,d)
                      - for(d):
                          - matmul:pv(n[t,tile_count(t)-1],d)
              - await:tail
            Waiting:
              Prepared:
                - '{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]'
                - '{issue matmul:qk(n,d)} ← [{done LOAD_QK[*]::load:qc(t,d)}, {done LOAD_QK[*]::load:kc(n,d)}]'
                - '{issue matmul:pv(n,d)} ← [{done SOFTMAX[*]::compute:prob(n)}, {done LOAD_V[*]::load:vc(n,d)}]'
                - '{issue matmul:pv(n[t,i+1],0)} ← [{done CORRECTION[*]::release:previousy(n[t,i+1])}]'
              Released: ['{done acquire:scoreslot(n+2)} ← [{done SOFTMAX[*]::load:score(n)}]']
              Allowed: ['{done await:tail} ← [{done SOFTMAX[*]::load:score(n)}, {done CORRECTION[*]::release:numerator(t)}]']
          SOFTMAX:
            Info:
              Describe: Form online weights while retaining the unrounded denominator
              Member: warp[0:4]
              Register: 256
              Using_verb:
                load:
                  work: *id001
                  score: {execution_mode: serial, describe: Capture scoreprobability into scorecopy; fence and return score. Fully visible prefix uses ldred max; masked suffix recomputes max}
                compute:
                  stats: {execution_mode: serial, describe: 'From scorecopy and onlinestate, compute online retained max and write old/base into scoreprobability stats; fence and publish to CORRECTION'}
                  prob: {execution_mode: serial, describe: 'online: scorecopy exponentials to probabilitycopy, then scoreprobability prob; publish pair readiness, retain unrounded exponentials in scorecopy'}
                  ell: {execution_mode: serial, describe: Update onlinestate ell from unrounded scorecopy exponentials and the retained maxima; rescale is computed independently from CORRECTION}
                  finalsum: {execution_mode: serial, describe: Write onlinestate ell into denominator finalsum and publish to CORRECTION}
                  requestmap: {execution_mode: serial, describe: Elected CTA thread builds requestmap from query prefixes and decreasing KV lengths; CTA rendezvous before role divergence}
                  state: {execution_mode: serial, describe: Initialize onlinestate mhat=-inf and ell=0 for this work without reading prior contents}
                acquire:
                  statsslot: {execution_mode: serial, describe: Acquire a free Stats region; reuse waits for CORRECTION to return its prior token}
                  probslot: {execution_mode: serial, describe: Acquire a free probability region; reuse waits for prior PV to return prob}
            Pipe:
              - compute:requestmap
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - compute:state(t)
                      - for(n[t]):
                          - load:score(n)
                          - acquire:statsslot(n)
                          - compute:stats(n)
                          - acquire:probslot(n)
                          - compute:prob(n)
                          - compute:ell(n)
                      - compute:finalsum(t)
            Waiting:
              Prepared: ['{issue load:score(n)} ← [{done MMA[0]::matmul:qk(n,1)}]']
              Released:
                - '{done acquire:statsslot(n+2)} ← [{done CORRECTION::load:stats(n)}]'
                - '{done acquire:probslot(n+2)} ← [{done MMA[0]::matmul:pv(n,1)}]'
          CORRECTION:
            Info:
              Describe: Correct the carried numerator and stage normalized output
              Member: warp[4:8]
              Register: 160
              Using_verb:
                load:
                  work: *id001
                  stats: {execution_mode: serial, describe: 'First local Stats only returns its token; later capture old/base into correctioncopy, derive alpha and warp-vote rescale(n), then return Stats'}
                  finalsum: {execution_mode: serial, describe: Capture SOFTMAX finalsum from denominator into correctioncopy; return its slot and compute the guarded normalization}
                acquire: {previousy: {execution_mode: serial, describe: Acquire the quiescent previous PV numerator in numerator even when all warp votes skip correction}}
                compute:
                  correction: {execution_mode: serial, describe: Voting warps rescale their rows of numerator using correctioncopy alpha; fence TMEM writes before ownership return}
                  oblock: {execution_mode: serial, describe: Normalize a numerator channel half using correctioncopy into outputstage; group rendezvous makes staged output available}
                release:
                  previousy: {execution_mode: serial, describe: Return this member numerator ownership after correction or a skipped vote}
                  numerator: {execution_mode: serial, describe: 'Fence final TMEM reads and return numerator ownership after the last half reaches outputstage, before its global store'}
                store: {oblock: {execution_mode: serial, describe: Read outputstage through registers; coalesced valid-row stores undo head packing into out; group rendezvous protects stage reuse}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - load:stats(n[t,0])
                      - for(n[t,1:]):
                          - load:stats(n)
                          - acquire:previousy(n)
                          - if(rescale(n)):
                              - compute:correction(n)
                          - release:previousy(n)
                      - load:finalsum(t)
                      - compute:oblock(t,0)
                      - store:oblock(t,0)
                      - compute:oblock(t,1)
                      - release:numerator(t)
                      - store:oblock(t,1)
            Waiting:
              Prepared:
                - '{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]'
                - '{issue load:stats(n)} ← [{done SOFTMAX::compute:stats(n)}]'
                - '{issue load:finalsum(t)} ← [{done SOFTMAX::compute:finalsum(t)}]'
                - '{done acquire:previousy(n[t,i+1])} ← [{done MMA[0]::matmul:pv(n[t,i],1)}]'
                - '{issue compute:oblock(t,0)} ← [{done MMA[0]::matmul:pv(n[t,tile_count(t)-1],1)}]'
