meta_data:
  name: paged_causal_attention_prefill
  describe: Compute right-aligned causal GQA from FP8 queries and an HND paged KV cache into the supplied BF16 output.
  source: bcacdwk/KernelSchema@01fff90d714abc6e84904ea9c44523ba66d34a0e:kernel_wiki/aka-four-problems-20261019/fa4_prefill/aka_solution/solution.py::Model.forward
  version: 2
  dispatch:
    id: small_static_lpt
    parent: root
    when: |
      Use packaged defaults with no FA_HD256 environment overrides, under the root contract.
      Let B=BatchCount, T=TotalQ, Q=max_q_len, K=64*ceil(max_kv_len/64), SM=runtime multiprocessor count.
      C=ceil(T/16)*B; G=max(1,floor(SM/2)); Split=(2*C<=G and ceil(K/128)>=16 and 2*T*16*256*4<=24000000).
      nc=ceil((T+15*(B-1))/16); g=max(1,min(floor(SM/2),nc)); w=T*T/(4096*B).
      qlo=min(max(1,T-(B-1)*Q),Q); A=w+T/256; F=max(0,min(qlo*(K-63-qlo),Q*(K-63-Q)))/2048.
      PersistSmall=(ceil(nc/g)>=4 and (ceil(K/128)*g/w<=0.30 or (B*K-T)*8<=K or (K<=8*Q and ceil((K+15)/128)*g/(A+F)<=0.60))).
      Select exactly when not Split, 2<=B<=4, not PersistSmall, and not (B=4 and T=16384).
design:
  math_reshape:
    thesis: Pack GQA heads into rows and replace dense attention intermediates with online state; lag the maximum and offset exponentials before FP8 rounding, trading numerator precision for FP8 products.
    rewrite:
    - step: stream
      name: Pack heads and stream page-backed score blocks
      math: |
        For request b and query block m, Qc[r,d]=query[cum_seq_lens_q[b]+16*m+floor(r/Hq),r%Hq,d], 0<=r<M, on valid query rows.
        For 0<=i<N and 0<=k<Bk, j=Bk*sigma(i)+k and p=floor(j/Page).
        Read page p when p*Page<L(b), otherwise this block's first page; Kc(i)[k,d] and Vc(i)[k,d] use kind 0 and 1 of kv_cache.
        These are block views; no full-cache gather is materialized. Invalid rows and keys are excluded from results.
        S(i,0)=mm32(Qc[:,0:128],transpose(Kc(i)[:,0:128])); S(i,1)=mma32(Qc[:,128:256],transpose(Kc(i)[:,128:256]),S(i,0)).
        X(i)[r,k]=S(i,1)[r,k] if j in J(b,16*m+floor(r/Hq)), otherwise -inf.
      symbol:
        M: {meaning: Packed rows per worktile., binding: 'bind:design.work_schedule::M'}
        Bk: {meaning: Keys per local iteration., binding: 'bind:design.work_schedule::Bk'}
        N: {meaning: Local KV iteration count., binding: 'bind:design.work_schedule::N'}
        sigma: {meaning: Local iteration to KV block map., binding: 'bind:design.work_schedule::sigma'}
        Qc: {meaning: Packed query block., shape: [{row: M}, {channel: D}], dtype: fp8_e4m3fn, life: 'stored (b,m)'}
        Kc: {meaning: Page-backed key block., shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn}
        Vc: {meaning: Page-backed value block., shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn}
        S: {meaning: Raw score after a channel-half contraction., shape: [{row: M}, {key: Bk}], dtype: fp32}
    - step: online
      name: Lagged maximum and distinct denominator and numerator precision
      math: |
        For each valid row independently, c=fp32(bmm1_scale*log2(e)), with the expression inside the cast evaluated in Python binary64.
        Initialize mhat(-1)=-inf, ell(-1)=0, Y(-1)=0. For i=0..N-1, a=max(mhat(i-1),max_k X(i)[r,k]); safe=0 if a=-inf, otherwise a.
        keep=(c*(mhat(i-1)-safe)>=-tau); mhat(i)=mhat(i-1) if keep, otherwise a; base=mhat(i-1) if keep, otherwise safe.
        alpha(i)=1 if keep, otherwise exp2_fast(c*(mhat(i-1)-safe)); Stats(i)[r,:]=(mhat(i-1),base).
        E(i)[r,k]=exp2_fast(fma32(c,X(i)[r,k],offset-c*base)); masked -inf maps to zero; P(i)=fp8_e4m3fn(E(i)).
        ell(i)=alpha(i)*ell(i-1)+sum32_k E(i)[r,k].
        For d in {0,1}, Y(i)[:,128*d:128*(d+1)]=mma32(P(i),Vc(i)[:,128*d:128*(d+1)],alpha(i)*Y(i-1)[:,128*d:128*(d+1)]).
        invell=1/ell(N-1) if ell is nonzero and not NaN, otherwise zero; Oblock=bf16(Y(N-1)*invell).
        Store valid rows of Oblock into out_after by undoing head packing; return out as output.
      symbol:
        tau: {meaning: Maximum lag in base-two score units., value: 4}
        offset: {meaning: Base-two shift before probability narrowing., value: 4}
        mhat: {meaning: Retained raw-score maximum., shape: [{row: M}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        ell: {meaning: Denominator from unrounded exponentials., shape: [{row: M}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        Y: {meaning: Numerator from FP8 probabilities., shape: [{row: M}, {channel: D}], dtype: fp32, life: 'carried (b,m); i=-1..N-1'}
        P: {meaning: Value-product operand., shape: [{row: M}, {key: Bk}], dtype: fp8_e4m3fn}
        Stats: {meaning: Previous maximum and guarded current base., shape: [{row: M}, {stat: 2}], dtype: fp32}
        Oblock: {meaning: Final output block., shape: [{row: M}, {channel: D}], dtype: bf16}
      arithmetic:
        approx: 'exp2_fast is native fast exp2 on SM103 without polynomial substitution; unknown: standalone fast-exp2 and output-division error bounds are not supplied.'
        accumulate: Seed both components of one FP32 pair with ell_previous*(alpha*0.5), seed three other pairs with zero, add four E fragments, merge (g0+g1)+(g2+g3), then add components.
    ledger:
      baseline: Materialize FP32 scores and probabilities for every request and query head, each written and read once.
      footprint:
      - {item: Dense intermediates, change: '8*Hq*sum_b(Qlen(b)*L(b)) bytes -> M*(D+2) FP32 recurrent scalars per active worktile plus block-local values.', by: [stream, online]}
      error:
      - {item: Probability precision, change: '+1 E4M3FN rounding per PV multiplicand; denominator retains FP32 exponentials.', by: [online]}
  work_schedule:
    thesis: Front-load longer KV requests and fold their query tiles; launch one CTA pair per position so hardware can schedule each tile independently.
    flow:
      launch: [{phase: [attention]}]
    phase:
      attention:
        describe: Final BF16 attention with a small-batch LPT flattened static schedule.
        decomposition:
          strategy: |
            M=256; Bk=128; C_b=ceil(Qlen(b)/16); Cpad=ceil((TotalQ+15*(BatchCount-1))/16).
            A worktile covers 16 query tokens and all Hq heads; N=min(ceil(L(b)/Bk),ceil((L(b)-Qlen(b)+16*(m+1))/Bk)); sigma(i)=i.
            Flatten request segments of C_b tiles into Cpad positions; reject positions beyond sum_b C_b before pipeline actions. Active tiles have N>=1.
          partition: {cluster_tile: {size: Cpad, tile: 1}}
          worktile:
            invariant: {Qc: {shape: [{row: M}, {channel: D}], dtype: fp8_e4m3fn}}
            iteration:
              Kc: {shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn, direction: ascending}
              Vc: {shape: [{key: Bk}, {channel: D}], dtype: fp8_e4m3fn, direction: ascending}
          target:
            single_tile: {Oblock: {shape: [{row: M}, {channel: D}], dtype: bf16}}
        mapping:
          strategy: Rank a supplies K tokens [64*a,64*(a+1)) per channel half and V columns [128*d+64*a,128*d+64*(a+1)) for d=0,1.
          worker: {unit: CTA, count: 2}
          placement: {unit: cluster, count: 1}
          count: Cpad
          member: [{row: [0, 128]}, {row: [128, 256]}]
        schedule:
          strategy: |
            Order requests by descending L(b), using strict-greater compare-swaps on request IDs initially in input order.
            Pair positions are (0,1) for B=2; (0,1),(1,2),(0,1) for B=3; (0,1),(2,3),(0,2),(1,3),(1,2) for B=4; ties are not generally stable.
            An elected thread resolves the assigned segment once and publishes the request and local query coordinates to its CTA.
            Within a segment, ordinal x maps to m=2*x if x<ceil(C_b/2), otherwise m=2*(C_b-1-x)+1.
          worktile_order: [{by: cluster_tile, direction: ascending}]
          worker_assignment: {preassigned: {start: worker_id, count: 1}, refill: none, exit: assigned_done}
  tile_pipeline:
    thesis: Independent K and V producers feed separate four-stage rings; QK leads PV by one block while softmax and correction exchange aliased scores and numerator ownership within one worktile.
    phase:
      attention:
        domain:
          i: [0, N]
          later: [1, N]
          d: [0, 2]
        resource:
          Query: {space: SMEM, shape: [{row: 128}, {channel: 128}], dtype: fp8_e4m3fn, slot: 2, view: {'Qc(d)': {slot: d}}}
          KeyRing: {space: SMEM, shape: [{key: 64}, {channel: 128}], dtype: fp8_e4m3fn, slot: 4, view: {'Kc(i,d)': {slot: '(2*i+d)%4'}}}
          ValueRing: {space: SMEM, shape: [{key: 128}, {channel: 64}], dtype: fp8_e4m3fn, slot: 4, view: {'Vc(i,d)': {slot: '(2*i+d)%4'}}}
          ScoreProbability:
            space: TMEM
            shape: [{row: 128}, {column: 128}]
            dtype: fp32
            slot: 2
            view:
              S(i,d): {slot: i%2}
              P(i): {slot: i%2, part: {column: [0, 32]}, dtype: fp8_e4m3fn}
              Stats(i): {slot: i%2, part: {column: [32, 34]}}
          Y: {space: TMEM, shape: [{row: 128}, {channel: D}], dtype: fp32}
          Denominator: {space: SMEM, shape: [{row: 128}], dtype: fp32, view: {'FinalSum': {part: {row: [0, 128]}}}}
          OutputStage: {space: SMEM, shape: [{row: 128}, {channel: 128}], dtype: bf16, view: {'Oblock(d)': {part: {channel: [0, 128]}}}}
          OnlineState: {space: register, shape: [{row: 128}, {state: 2}], dtype: fp32, view: {'mhat(i)': {part: {state: [0, 1]}}, 'ell(i)': {part: {state: [1, 2]}}}}
          WorkCoord: {space: SMEM, shape: [{element: 2}], dtype: int32}
        lane:
          LoadQK:
            info:
              member: warp[9:10]
              mode: async
              register: 32
              verb:
                load: Q holds this member's rows for the KV traversal; each K half uses one page per member. Both members contribute to pair-wide readiness.
            pipe:
              steady:
              - {repeat: d, steady: ['load:Qc(d)']}
              - {repeat: 'i', steady: [{repeat: d, steady: ['load:Kc(i,d)']}]}
            edge:
              data: {'load:Qc(0)': ['Softmax/publish:WorkCoord']}
              reuse:
                load:Kc(i+2,d): ['MMA/qk:S(i,d)']
          LoadV:
            info:
              member: warp[10:11]
              mode: async
              register: 32
              verb:
                load: Each V half uses two page transfers per member; done covers both and contributes to pair-wide readiness independently of K.
            pipe: {repeat: i, steady: [{repeat: d, steady: ['load:Vc(i,d)']}]}
            edge:
              data: {'load:Vc(0,0)': ['Softmax/publish:WorkCoord']}
              reuse: {'load:Vc(i+2,d)': ['MMA/pv:Y(i,d)']}
          MMA:
            info:
              member: CTA[0].warp[8:9]
              mode: ordered
              register: 32
              verb:
                qk: Issue one QK channel half; d=0 initializes S and d=1 completes it. Done returns K; last QK returns Q. Ordered pair products read earlier P before later QK overwrites its aliased slot.
                pv: Issue one PV output half; i=0 initializes Y and later blocks use corrected Y. Done returns V; d=1 publishes Y and returns P, covering both CTAs.
            pipe:
              steady:
              - {repeat: d, steady: ['qk:S(0,d)']}
              - repeat: i[1:]
                steady:
                - {repeat: d, steady: ['qk:S(i,d)']}
                - {repeat: d, steady: ['pv:Y(i-1,d)']}
              - {repeat: d, steady: ['pv:Y(last(i),d)']}
            edge:
              data:
                qk:S(i,d): ['LoadQK/load:Qc(d)', 'LoadQK/load:Kc(i,d)']
                pv:Y(i,d): ['Softmax/publish:P(i)', 'LoadV/load:Vc(i,d)']
                pv:Y(later,0): ['Correction/rescale:Y(later)']
              reuse:
                qk:S(i,0): ['Softmax/capture:S(i-2,1)']
          Softmax:
            info:
              member: warp[0:4]
              register: 256
              verb:
                capture: Capture scores and return their slot; use the load-reduced maximum for the fully visible prefix, and recompute after masking the causal/tail suffix.
                publish: Publish the elected thread's mapped request and query coordinates once with CTA-wide visibility; Stats carries old maximum and base; P applies online with per-tile state reset; FinalSum publishes ell(N-1) after all blocks.
            pipe:
              prologue: ['publish:WorkCoord']
              steady:
              - {repeat: 'i', steady: ['capture:S(i,1)', 'publish:Stats(i)', 'publish:P(i)', 'compute:ell(i)']}
              - publish:FinalSum
            edge:
              data: {'capture:S(i,1)': ['MMA/qk:S(i,1)']}
              reuse:
                publish:Stats(i+2): ['Correction/capture:Stats(i)']
          Correction:
            info:
              member: warp[4:8]
              register: 160
              verb:
                capture: Acknowledge first-block Stats without reading its payload; capture later Stats and final ell into registers before returning their slots.
                rescale: Evaluate alpha from Stats and correct both Y halves after previous PV; a warp vote skips rewriting when no row has alpha<1, retaining the ownership handshake.
                stage: Normalize and narrow one Y half into OutputStage; completion covers the correction group.
                store: Coalesced valid-row stores undo head packing; completion ends OutputStage reads and includes the group barrier before reuse.
            pipe:
              steady:
              - capture:Stats(0)
              - {repeat: 'i[1:]', steady: ['capture:Stats(i)', 'rescale:Y(i)']}
              - capture:FinalSum
              - stage:Oblock(0)
              - store:Oblock(0)
              - stage:Oblock(1)
              - store:Oblock(1)
            edge:
              data:
                rescale:Y(later): ['MMA/pv:Y(later-1,1)']
                stage:Oblock(0): ['MMA/pv:Y(last(i),1)']
realization:
  require:
  - {item: 'design.tile_pipeline::attention.MMA', choice: Use two-CTA tcgen05 MMA with cumulative completion and earlier-PV-read-before-later-QK-write ordering., reason: Pair-wide operand returns and aliased score/probability storage depend on these guarantees.}
  - {item: ['design.tile_pipeline::attention.LoadQK', 'design.tile_pipeline::attention.LoadV'], choice: Use native page-64 TMA for HND FP8 KV and descriptor views for Q., reason: Pair-wide transaction completion implements the declared operand handoffs.}
  - {item: 'design.tile_pipeline::attention', choice: Launch 384 threads per CTA with setmaxnreg budgets and one contiguous 512-column TMEM allocation., reason: Idle warps relinquish registers and the score/numerator resources share one allocation lifetime.}
