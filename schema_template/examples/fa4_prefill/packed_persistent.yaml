META_DATA:
  Name: paged_causal_attention_prefill
  Describe: Compute right-aligned causal GQA from FP8 queries and an HND paged KV cache into the supplied BF16 output
  Source: KernelSchema@3d64ad35900a0e6a66d6f93da34108fbceba0daf:kernel_wiki/aka-four-problems-20261019/fa4_prefill/aka_solution/solution.py::Model.forward
  Version: 7
  Dispatch:
    id: packed_persistent
    when: 5<=batchcount<=16; compact stride persistence on 148 SMs, dual K/V load and separate rescale evaluation; one unsplit traversal
DESIGN:
  Math_reshape:
    from: root
  Work_schedule:
    Thesis: Reuse a bounded grid of CTA pairs over folded query work; retain mapping and pipeline state across statically assigned tiles
    Flow:
      Launch: [{step: [MAIN]}]
    Step:
      MAIN:
        Describe: Keep request order; map stride work through a CTA-local prefix table and four-step binary search; pad logical CTA extent to an even count
        Decomposition:
          Strategy: 'cpad=ceil((totalq+15*(batchcount-1))/16); c_b=ceil(qlen(b)/16); valid(t): m<c_b; tile_count(t)=tile_count if valid(t), else 0'
          Partition: {cluster_tile: {size: cpad, tile: 1, meaning: cluster tile coordinate}}
          Worktile:
            Invariant: {qc: {shape: [{row: packedrows}, {channel: channels}], dtype: fp8_e4m3fn, meaning: qc operand block}}
            Iteration:
              kc: {shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn, direction: ascending, meaning: kc operand block}
              vc: {shape: [{key: kvblock}, {channel: channels}], dtype: fp8_e4m3fn, direction: ascending, meaning: vc operand block}
          Target:
            Single_tile: {oblock: {shape: [{row: packedrows}, {channel: channels}], dtype: bf16, meaning: oblock result block}}
        Mapping:
          Strategy: Each worker is a CTA pair on the recorded 148-SM device. Rank a supplies K tokens [64*a,64*(a+1)) and V columns [128*d+64*a,128*d+64*(a+1)), d=0,1.
          Worker: {unit: cta, unit_count: 2}
          Placement: {unit: cluster, unit_count: 1}
          Worker_count: min(74,cpad)
          Member: [{row: [0, 128]}, {row: [128, 256]}]
        Schedule:
          Strategy: Within request ordinal x, m=2*x if x<ceil(c_b/2), else 2*(c_b-1-x)+1; retain CTA parity
          Worktile_order: [{by: cluster_tile, direction: ascending}]
          Worker_assignment:
            Preassigned: {start: worker_id, stride: worker_count}
            Refill: none
            Exit: assigned_done
  Tile_pipeline:
    Thesis: K/V rings overlap QK-ahead-of-PV with softmax and correction; continuous slot indices let next-Q copying overlap old output stores
    Step:
      MAIN:
        Index:
          t: {meaning: Worker-local assigned candidate ordinal, definition: worktile}
          i: {meaning: KV block within the candidate, definition: [0, tile_count(t)]}
          n: {meaning: KV block ordinal continuous across valid work, definition: {flatten: [t, i]}}
          d: {meaning: Channel half, definition: [0, 2]}
        Storage:
          query: {meaning: Resident query channel halves, depth: 2, location: smem, shape: [{row: 128}, {channel: 128}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'qc(t,d)': {slot_index: d}}}
          keyring: {meaning: Key payload independent of value storage, depth: 4, location: smem, shape: [{key: 64}, {channel: 128}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'kc(n,d)': {slot_index: (2*n+d)%4}}}
          valuering: {meaning: Value payload independent of key storage, depth: 4, location: smem, shape: [{key: 128}, {channel: 64}],
            dtype: fp8_e4m3fn, total_size: 65536, view: {'vc(n,d)': {slot_index: (2*n+d)%4}}}
          scoreprobability: {meaning: 'Aliased scores, probabilities and statistics', depth: 2, location: tmem, shape: [{row: 128}, {column: 128}],
            dtype: fp32, total_size: 262144, view: {'score(n,d)': {slot_index: n%2}, prob(n): {slot_index: n%2, region: {column: [0, 32]}}, stats(n): {slot_index: n%2, region: {column: [32, 34]}}}}
          numerator: {meaning: Carried numerator with one ownership token, depth: 1, location: tmem, shape: [{row: 128}, {channel: 256}],
            dtype: fp32, total_size: 262144}
          denominator: {meaning: Final sum handoff, depth: 1, location: smem, shape: [{row: 128}],
            dtype: fp32, total_size: 1024, view: {finalsum(t): {}}}
          outputstage: {meaning: One coalesced output channel half, depth: 1, location: smem, shape: [{row: 128}, {channel: 128}],
            dtype: bf16, total_size: 65536, view: {'oblock(t,d)': {}}}
          onlinestate: {meaning: Retained maximum and unrounded denominator, depth: 1, location: register, shape: [{row: 128}, {state: 2}],
            dtype: fp32, total_size: 2048, view: {mhat(n): {region: {state: [0, 1]}}, ell(n): {region: {state: [1, 2]}}}}
          scorecopy: {meaning: Scores replaced by unrounded exponentials, depth: 1, location: register, shape: [{row: 128}, {key: 128}],
            dtype: fp32, total_size: 131072}
          probabilitycopy: {meaning: Narrowed probabilities before TMEM publication, depth: 1, location: register, shape: [{row: 128}, {key: 128}],
            dtype: fp8_e4m3fn, total_size: 32768}
          correctioncopy: {meaning: 'Captured statistics, alpha and final normalization', depth: 1, location: register, shape: [{row: 128}, {state: 3}],
            dtype: fp32, total_size: 3072}
          requestmap: {meaning: Immutable request map, depth: 1, location: smem, shape: [{element: 36}],
            dtype: int32, total_size: 288}
        Role:
          LOAD_QK:
            Info:
              Describe: Supply resident queries and independently staged keys
              Member: warp[9:10]
              Register: 32
              Using_verb:
                load:
                  work: &id001 {execution_mode: serial, describe: 'Decode this candidate from requestmap using the scheduled binary search; bind b,m,valid(t),tile_count(t)'}
                  qc: {execution_mode: async_unordered, describe: Read query through descriptor views into query; done includes both member contributions to the pair transaction barrier}
                  kc: {execution_mode: async_unordered, describe: 'block_tables/kv_cache to keyring: one page64 per member/half; invalid second page repeats the first; done covers pair transaction bytes'}
                await: {tail: {execution_mode: serial, describe: Finish producer ownership returns after all assigned work; no per-work drain}}
                acquire: {keyslot: {execution_mode: serial, describe: Acquire a free keyring slot; reuse waits for previous QK to return both members}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - for(d):
                          - load:qc(t,d)
                      - for(n[t]):
                          - for(d):
                              - acquire:keyslot(n,d)
                              - load:kc(n,d)
              - await:tail
            Waiting:
              Prepared: ['{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]']
              Released:
                - '{done acquire:keyslot(n+2,d)} ← [{done MMA[0]::matmul:qk(n,d)}]'
                - '{issue load:qc(t+1,d)} ← [{done MMA[0]::matmul:qk(n[t,tile_count(t)-1],d)}]'
              Allowed: ['{done await:tail} ← [{done MMA[0]::matmul:qk(n,d)}]']
          LOAD_V:
            Info:
              Describe: Stage values independently of query and key progress
              Member: warp[10:11]
              Register: 32
              Using_verb:
                load:
                  work: *id001
                  vc: {execution_mode: async_unordered, describe: 'block_tables/kv_cache to valuering: two page64 copies per member/half; invalid second page repeats first; done covers pair bytes'}
                await: {tail: {execution_mode: serial, describe: Finish value producer ownership returns after all assigned work}}
                acquire: {valueslot: {execution_mode: serial, describe: Acquire a free valuering slot; reuse waits for previous PV to return both members}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - for(n[t]):
                          - for(d):
                              - acquire:valueslot(n,d)
                              - load:vc(n,d)
              - await:tail
            Waiting:
              Prepared: ['{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]']
              Released: ['{done acquire:valueslot(n+2,d)} ← [{done MMA[0]::matmul:pv(n,d)}]']
              Allowed: ['{done await:tail} ← [{done MMA[0]::matmul:pv(n,d)}]']
          MMA:
            Info:
              Describe: Issue QK one block ahead of PV on a cumulative pair queue
              Member: cta[0].warp[8:9]
              Register: 32
              Using_verb:
                load: {work: *id001}
                matmul:
                  qk: {execution_mode: async_ordered, describe: 'query qc and keyring kc to scoreprobability; d=0 initializes score. Done returns K and last QK returns Q, including one-block work'}
                  pv: {execution_mode: async_ordered, describe: scoreprobability prob and valuering vc to numerator; PV0 ignores old contents. Done returns V; d=1 publishes numerator and returns prob pair-wide}
                await: {tail: {execution_mode: serial, describe: Drain score and numerator producer returns after the worker loop}}
                acquire: {scoreslot: {execution_mode: serial, describe: Acquire a free scoreprobability slot; reuse waits for SOFTMAX to capture its preceding score}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - acquire:scoreslot(n[t,0])
                      - for(d):
                          - matmul:qk(n[t,0],d)
                      - for(n[t,1:]):
                          - acquire:scoreslot(n)
                          - for(d):
                              - matmul:qk(n,d)
                          - for(d):
                              - matmul:pv(n-1,d)
                      - for(d):
                          - matmul:pv(n[t,tile_count(t)-1],d)
              - await:tail
            Waiting:
              Prepared:
                - '{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]'
                - '{issue matmul:qk(n,d)} ← [{done LOAD_QK[*]::load:qc(t,d)}, {done LOAD_QK[*]::load:kc(n,d)}]'
                - '{issue matmul:pv(n,d)} ← [{done SOFTMAX[*]::compute:prob(n)}, {done LOAD_V[*]::load:vc(n,d)}]'
                - '{issue matmul:pv(n[t,i+1],0)} ← [{done CORRECTION[*]::release:previousy(n[t,i+1])}]'
              Released:
                - '{done acquire:scoreslot(n+2)} ← [{done SOFTMAX[*]::load:score(n)}]'
                - '{issue matmul:pv(n[t,0],0)} ← [{done CORRECTION[*]::release:numerator(t-1)}]'
              Allowed: ['{done await:tail} ← [{done SOFTMAX[*]::load:score(n)}, {done CORRECTION[*]::release:numerator(t)}]']
          SOFTMAX:
            Info:
              Describe: Form online weights while retaining the unrounded denominator
              Member: warp[0:4]
              Register: 256
              Using_verb:
                load:
                  work: *id001
                  score: {execution_mode: serial, describe: Capture scoreprobability into scorecopy; fence and return score. Fully visible prefix uses ldred max; masked suffix recomputes max}
                compute:
                  stats: {execution_mode: serial, describe: 'From scorecopy and onlinestate, compute online retained max and write old/base into scoreprobability stats; fence and publish to CORRECTION'}
                  prob: {execution_mode: serial, describe: 'online: scorecopy exponentials to probabilitycopy, then scoreprobability prob; publish pair readiness, retain unrounded exponentials in scorecopy'}
                  ell: {execution_mode: serial, describe: Update onlinestate ell from unrounded scorecopy exponentials and the retained maxima; rescale is computed independently from CORRECTION}
                  finalsum: {execution_mode: serial, describe: Write onlinestate ell into denominator finalsum and publish to CORRECTION}
                  requestmap: {execution_mode: serial, describe: Elected CTA thread builds requestmap from query prefixes in input order; CTA rendezvous before role divergence}
                  state: {execution_mode: serial, describe: Initialize onlinestate mhat=-inf and ell=0 for this work without reading prior contents}
                acquire:
                  statsslot: {execution_mode: serial, describe: Acquire a free Stats region; reuse waits for CORRECTION to return its prior token}
                  probslot: {execution_mode: serial, describe: Acquire a free probability region; reuse waits for prior PV to return prob}
            Pipe:
              - compute:requestmap
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - compute:state(t)
                      - for(n[t]):
                          - load:score(n)
                          - acquire:statsslot(n)
                          - compute:stats(n)
                          - acquire:probslot(n)
                          - compute:prob(n)
                          - compute:ell(n)
                      - compute:finalsum(t)
            Waiting:
              Prepared: ['{issue load:score(n)} ← [{done MMA[0]::matmul:qk(n,1)}]']
              Released:
                - '{done acquire:statsslot(n+2)} ← [{done CORRECTION::load:stats(n)}]'
                - '{done acquire:probslot(n+2)} ← [{done MMA[0]::matmul:pv(n,1)}]'
                - '{issue compute:finalsum(t+1)} ← [{done CORRECTION::load:finalsum(t)}]'
          CORRECTION:
            Info:
              Describe: Correct the carried numerator and stage normalized output
              Member: warp[4:8]
              Register: 160
              Using_verb:
                load:
                  work: *id001
                  stats: {execution_mode: serial, describe: 'First local Stats only returns its token; later capture old/base into correctioncopy, derive alpha and warp-vote rescale(n), then return Stats'}
                  finalsum: {execution_mode: serial, describe: Capture SOFTMAX finalsum from denominator into correctioncopy; return its slot and compute the guarded normalization}
                acquire: {previousy: {execution_mode: serial, describe: Acquire the quiescent previous PV numerator in numerator even when all warp votes skip correction}}
                compute:
                  correction: {execution_mode: serial, describe: Voting warps rescale their rows of numerator using correctioncopy alpha; fence TMEM writes before ownership return}
                  oblock: {execution_mode: serial, describe: Normalize a numerator channel half using correctioncopy into outputstage; group rendezvous makes staged output available}
                release:
                  previousy: {execution_mode: serial, describe: Return this member numerator ownership after correction or a skipped vote}
                  numerator: {execution_mode: serial, describe: 'Fence final TMEM reads and return numerator ownership after the last half reaches outputstage, before its global store'}
                store: {oblock: {execution_mode: serial, describe: Read outputstage through registers; coalesced valid-row stores undo head packing into out; group rendezvous protects stage reuse}}
            Pipe:
              - for(t):
                  - load:work(t)
                  - if(valid(t) and tile_count(t) > 0):
                      - load:stats(n[t,0])
                      - for(n[t,1:]):
                          - load:stats(n)
                          - acquire:previousy(n)
                          - if(rescale(n)):
                              - compute:correction(n)
                          - release:previousy(n)
                      - load:finalsum(t)
                      - compute:oblock(t,0)
                      - store:oblock(t,0)
                      - compute:oblock(t,1)
                      - release:numerator(t)
                      - store:oblock(t,1)
            Waiting:
              Prepared:
                - '{issue load:work(t)} ← [{done SOFTMAX::compute:requestmap}]'
                - '{issue load:stats(n)} ← [{done SOFTMAX::compute:stats(n)}]'
                - '{issue load:finalsum(t)} ← [{done SOFTMAX::compute:finalsum(t)}]'
                - '{done acquire:previousy(n[t,i+1])} ← [{done MMA[0]::matmul:pv(n[t,i],1)}]'
                - '{issue compute:oblock(t,0)} ← [{done MMA[0]::matmul:pv(n[t,tile_count(t)-1],1)}]'
REALIZATION:
  Require:
    - Item: DESIGN.Tile_pipeline::MAIN.MMA
      Choice: Two-CTA tcgen05 MMA with cumulative completion and earlier operand reads preceding later aliased writes
      Reason: Pair returns and score/probability reuse depend on this ordering
    - Item: DESIGN.Tile_pipeline::MAIN
      Choice: Page64 TMA pair transaction barriers; 384 threads per CTA with role register budgets; one 512-column TMEM allocation
      Reason: Operand handoffs require both member contributions; final cluster rendezvous precedes TMEM free
